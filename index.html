<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>phlix Website Variants</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #0c0c0f;
            --bg-surface: #141418;
            --bg-card: #1a1a1f;
            --text-primary: #f0f0f0;
            --text-secondary: #8a8a95;
            --accent: #e8ff47;
            --accent-alt: #47c3ff;
            --border: #2a2a32;
            --shadow: rgba(0, 0, 0, 0.5);

            /* Hover-zoom factors for the enlarged preview popout. */
            --zoom-x: 3;
            --zoom-y: 2;

            /* Design set theme colors */
            --set-01: #a3a3a3;
            --set-02: #fbbf24;
            --set-03: #f97316;
            --set-04: #8b5cf6;
            --set-05: #22c55e;
            --set-06: #ec4899;
            --set-07: #facc15;
            --set-08: #14b8a6;
            --set-09: #34d399;
            --set-10: #22c55e;
            --set-11: #a78bfa;
            --set-12: #e879f9;
            --set-13: #ef4444;
            --set-14: #0ea5e9;
            --set-15: #f43f5e;
            --set-16: #3b82f6;
            --set-17: #6b7280;
            --set-18: #78716c;
            --set-19: #fb923c;
            --set-20: #10b981;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Syne', sans-serif;
            background: var(--bg-deep);
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.5;
        }

        /* Noise texture overlay */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            opacity: 0.03;
            z-index: 9999;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
        }

        header {
            padding: 4rem 2rem 3rem;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        header::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 120px;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--accent), transparent);
        }

        h1 {
            font-size: clamp(2.5rem, 6vw, 4rem);
            font-weight: 800;
            letter-spacing: -0.02em;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, var(--text-primary) 0%, var(--accent) 50%, var(--accent-alt) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            font-family: 'Space Mono', monospace;
            font-size: 0.875rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.2em;
        }

        main {
            padding: 2rem;
            max-width: 1600px;
            margin: 0 auto;
        }

        /* One continuous grid for every variant. Cards are ordered by set and
           grouped only by color (no per-set section blocks), so rows can mix the
           tail of one set with the head of the next without a forced row break. */
        .variants-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 1rem;
            align-items: start;
        }

        .variant-card {
            position: relative;
            background: var(--bg-card);
            border-radius: 12px;
            overflow: visible;
            border: 1px solid var(--border);
            /* Set-colored top edge is the grouping cue in the mixed grid. */
            border-top: 3px solid var(--set-color, var(--accent));
            cursor: pointer;
            text-decoration: none;
            display: block;
            color: inherit;
        }

        .variant-card:hover {
            z-index: 1000;
        }

        .preview-container {
            position: relative;
            width: 100%;
            height: 285px;
            background: var(--bg-surface);
            overflow: hidden;
            border-radius: 10px 10px 0 0;
            transform: scale(1);
            transform-origin: center center;
            transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1),
                        box-shadow 0.35s ease,
                        border-radius 0.2s ease;
        }

        /* Hover: enlarge the preview into an UNDISTORTED ~3x-wide / ~2x-tall
           popout that stays while the cursor is over it. The container stretches
           by (--zoom-x, --zoom-y); the iframe counter-stretches (below) so the
           net scale is uniform — the site grows without distorting. */
        .variant-card:hover .preview-container {
            transform: scale(var(--zoom-x), var(--zoom-y));
            box-shadow: 0 30px 90px var(--shadow), 0 0 0 2px var(--set-color, var(--accent));
            border-radius: 8px;
            z-index: 1000;
        }

        .preview-container iframe {
            /* Render the variant at full desktop width (PREVIEW_WIDTH px) then
               scale the whole frame down so the entire width of the site is
               visible inside the card, instead of a clipped narrow viewport.
               --preview-scale is set per-card in JS from the card's width. */
            width: 1280px;
            height: calc(100% / var(--preview-scale, 0.25));
            border: none;
            pointer-events: none;
            transform: scale(var(--preview-scale, 0.25));
            transform-origin: top left;
            opacity: 0;
            transition: opacity 0.3s ease,
                        transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        /* Counter-stretch so container(--zoom-x,--zoom-y) ∘ iframe scale nets to
           a uniform (--preview-scale * --zoom-x) in both axes → no distortion. */
        .variant-card:hover .preview-container iframe {
            transform: scale(
                var(--preview-scale, 0.25),
                calc(var(--preview-scale, 0.25) * var(--zoom-x) / var(--zoom-y))
            );
        }

        .preview-container iframe.loaded {
            opacity: 1;
        }

        .preview-container .placeholder {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, var(--bg-surface) 0%, var(--bg-card) 100%);
            color: var(--text-secondary);
            font-family: 'Space Mono', monospace;
            font-size: 0.75rem;
            z-index: -1;
        }

        .preview-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .variant-info {
            padding: 0.7rem 0.85rem;
            background: var(--bg-card);
            border-top: 1px solid var(--border);
            border-radius: 0 0 11px 11px;
        }

        .variant-name {
            font-family: 'Space Mono', monospace;
            font-size: 0.72rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 0.3rem;
            letter-spacing: 0.01em;
            line-height: 1.3;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .variant-variation {
            font-size: 0.66rem;
            line-height: 1.35;
            color: var(--text-secondary);
            margin-bottom: 0.45rem;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .variant-personality {
            display: flex;
            flex-wrap: wrap;
            gap: 0.25rem;
            margin-bottom: 0.5rem;
        }

        .chip {
            font-size: 0.58rem;
            color: var(--text-secondary);
            border: 1px solid var(--border);
            border-radius: 999px;
            padding: 0.05rem 0.45rem;
            white-space: nowrap;
        }

        .variant-swatches {
            display: flex;
            align-items: center;
            gap: 0.3rem;
            flex-wrap: wrap;
        }

        .swatch {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.18);
            flex-shrink: 0;
        }

        .set-tag {
            font-family: 'Space Mono', monospace;
            font-weight: 700;
            font-size: 0.62rem;
            color: var(--bg-deep);
            background: var(--set-color, var(--accent));
            padding: 0.1rem 0.4rem;
            border-radius: 3px;
            letter-spacing: 0.05em;
            flex-shrink: 0;
        }

        footer {
            text-align: center;
            padding: 3rem 2rem;
            font-family: 'Space Mono', monospace;
            font-size: 0.75rem;
            color: var(--text-secondary);
            border-top: 1px solid var(--border);
            margin-top: 2rem;
        }

        /* Staggered entrance animation */
        .variant-card {
            opacity: 0;
            transform: translateY(20px);
            animation: fadeInUp 0.5s ease forwards;
        }

        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Scrollbar styling */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-deep);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--text-secondary);
        }

        /* Hover instruction */
        .hover-hint {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            font-family: 'Space Mono', monospace;
            font-size: 0.7rem;
            color: var(--text-secondary);
            background: var(--bg-surface);
            padding: 0.5rem 1rem;
            border-radius: 20px;
            border: 1px solid var(--border);
            opacity: 0.7;
            transition: opacity 0.3s ease;
            z-index: 100;
        }

        @media (max-width: 768px) {
            main {
                padding: 1rem;
            }

            .variants-grid {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
                gap: 0.75rem;
            }

            .preview-container {
                height: 225px;
            }

            /* Gentler zoom so the popout stays on small screens. */
            .variant-card {
                --zoom-x: 2.4;
                --zoom-y: 1.7;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>phlix Variants</h1>
        <p class="subtitle">Design variant previews</p>
    </header>

    <main id="variants-container">
        <!-- Variants will be injected here by JavaScript -->
    </main>

    <div class="hover-hint">Hover to preview &middot; Click to open</div>

    <footer>
        phlix Website Variants Preview &middot; Built with intention
    </footer>

    <script>
        const designSets = [
            { num: '01', name: 'minimalist-cinema', color: '#a3a3a3' },
            { num: '02', name: 'spotlight-projector', color: '#fbbf24' },
            { num: '03', name: 'retro-film-reel', color: '#f97316' },
            { num: '04', name: 'portal-hub', color: '#8b5cf6' },
            { num: '05', name: 'pixel-tech', color: '#22c55e' },
            { num: '06', name: 'atelier-vogue', color: '#ec4899' },
            { num: '07', name: 'saturday-cartoons', color: '#facc15' },
            { num: '08', name: 'frutiger-aqua-bloom', color: '#14b8a6' },
            { num: '09', name: 'jade-deco-palace', color: '#34d399' },
            { num: '10', name: 'forest-canopy', color: '#22c55e' },
            { num: '11', name: 'lectern-hall', color: '#a78bfa' },
            { num: '12', name: 'liquid-psychedelia', color: '#e879f9' },
            { num: '13', name: 'bauhaus-primary', color: '#ef4444' },
            { num: '14', name: 'deep-current', color: '#0ea5e9' },
            { num: '15', name: 'swiss-international', color: '#f43f5e' },
            { num: '16', name: 'blueprint-works', color: '#3b82f6' },
            { num: '17', name: 'graphite-mono', color: '#6b7280' },
            { num: '18', name: 'broadsheet-press', color: '#78716c' },
            { num: '19', name: 'palm-springs-modern', color: '#fb923c' },
            { num: '20', name: 'botanica-nouveau', color: '#10b981' }
        ];

        // When this page is deployed, tools/build.mjs injects
        // window.__PHLIX_VARIANTS__ with the real list of built variant folders.
        // In that context dist/ is the publish root, so variant pages live at
        // ./<folder>/. When the page is opened locally from the repo root (no
        // manifest), variants live under dist/<folder>/ and are discovered at
        // runtime via getVariants().
        const MANIFEST = (typeof window !== 'undefined' && window.__PHLIX_VARIANTS__) || null;
        const VARIANT_BASE = MANIFEST ? './' : 'dist/';

        // Brand-kit metadata (name / variation / personality / colors) per
        // variant. Injected at build time as window.__PHLIX_BRAND_KITS__; when
        // opened locally from the repo root it is fetched from shared/data/.
        const BRAND_KITS_INJECTED = (typeof window !== 'undefined' && window.__PHLIX_BRAND_KITS__) || null;

        async function getBrandKits() {
            if (BRAND_KITS_INJECTED) return BRAND_KITS_INJECTED;
            try {
                const res = await fetch('shared/data/brand-kits.json');
                if (!res.ok) return {};
                const json = await res.json();
                return json.variants || json || {};
            } catch (e) {
                return {};
            }
        }

        // Flatten a kit's nested colour groups into a flat list of hex strings.
        function kitColors(kit) {
            if (!kit || !kit.colors) return [];
            const out = [];
            for (const group of Object.values(kit.colors)) {
                if (group && typeof group === 'object') out.push(...Object.values(group));
            }
            return out.filter((c) => typeof c === 'string');
        }

        // Vivid card accent: the kit's accent colour, else its first primary.
        function kitAccent(kit) {
            const c = kit && kit.colors;
            if (!c) return null;
            const acc = c.accent && Object.values(c.accent)[0];
            const prim = c.primary && Object.values(c.primary)[0];
            return acc || prim || null;
        }

        function esc(s) {
            return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => (
                { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
            ));
        }

        // Desktop width each variant is rendered at inside its preview iframe.
        // The frame is then CSS-scaled down to the card's width (see the iframe
        // rule above) so the whole site width is visible. Must match the iframe
        // `width` in CSS.
        const PREVIEW_WIDTH = 1280;
        // Must match --zoom-x in CSS; used only to keep the popout on-screen.
        const HOVER_ZOOM_X = 3;

        // Set --preview-scale on a card's preview container from its current
        // width, so width:1280px * scale renders exactly the container width.
        // Also anchor the hover-zoom origin to the left/right edge for the edge
        // columns so the enlarged popout doesn't spill off-screen.
        function applyPreviewScale(container) {
            const w = container.clientWidth;
            if (w <= 0) return;
            container.style.setProperty('--preview-scale', (w / PREVIEW_WIDTH).toFixed(4));
            const r = container.getBoundingClientRect();
            const spill = (w * (HOVER_ZOOM_X - 1)) / 2;
            const vw = document.documentElement.clientWidth;
            let ox = 'center';
            if (r.left < spill) ox = 'left';
            else if (vw - r.right < spill) ox = 'right';
            container.style.transformOrigin = `${ox} center`;
        }

        function applyAllPreviewScales() {
            document.querySelectorAll('.preview-container').forEach(applyPreviewScale);
        }

        // IntersectionObserver for lazy loading iframes
        let iframeObserver;
        const loadedIframes = new WeakSet();

        function initIntersectionObserver() {
            iframeObserver = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    const card = entry.target;
                    const iframe = card.querySelector('iframe');

                    if (!iframe) return;

                    if (entry.isIntersecting) {
                        // Card is visible - load the iframe
                        loadIframe(iframe);
                    } else {
                        // Card is out of view - optionally unload
                        // For performance, we keep loaded iframes in memory
                        // but reset opacity to allow re-trigger
                    }
                });
            }, {
                rootMargin: '100px',
                threshold: 0.1
            });
        }

        function loadIframe(iframe) {
            if (loadedIframes.has(iframe)) return;

            const src = iframe.dataset.src;
            if (!src) return;

            iframe.src = src;
            iframe.onload = () => {
                iframe.classList.add('loaded');
            };
            loadedIframes.add(iframe);
        }

        // Get all variant folders from dist
        async function getVariants() {
            // Deployed build: use the injected manifest (GitHub Pages has no
            // directory listing, so the fetch() discovery below cannot work there).
            if (MANIFEST && Array.isArray(MANIFEST.variants)) {
                return MANIFEST.variants;
            }
            try {
                const response = await fetch('dist/');
                const text = await response.text();
                const parser = new DOMParser();
                const doc = parser.parseFromString(text, 'text/html');
                const folders = Array.from(doc.querySelectorAll('a'))
                    .map(a => a.href)
                    .map(href => {
                        const parts = href.split('/');
                        return parts[parts.length - 1];
                    })
                    .filter(name => name && name !== 'assets' && !name.includes('_headers') && name !== 'index.html' && name !== 'robots.txt' && name !== 'sitemap.xml' && name.match(/^\d{2}-[a-z-]+-\d+$/));
                return folders;
            } catch (e) {
                console.warn('Could not fetch dist listing, using fallback');
                // Fallback: generate all possible variants
                const variants = [];
                designSets.forEach(set => {
                    for (let i = 1; i <= 5; i++) {
                        variants.push(`${set.num}-${set.name}-${i}`);
                    }
                });
                return variants;
            }
        }

        function groupBySet(variants) {
            const grouped = {};
            for (const variant of variants) {
                const match = variant.match(/^(\d{2})-([a-z-]+)-(\d+)$/);
                if (match) {
                    const setNum = match[1];
                    const setName = match[2];
                    const variantNum = parseInt(match[3], 10);
                    const key = `${setNum}-${setName}`;
                    if (!grouped[key]) {
                        grouped[key] = [];
                    }
                    grouped[key].push({ folder: variant, variantNum });
                }
            }
            // Sort variants within each group
            for (const key in grouped) {
                grouped[key].sort((a, b) => a.variantNum - b.variantNum);
            }
            return grouped;
        }

        function renderVariantCard(folder, index, set, variantNum, kit) {
            const card = document.createElement('a');
            card.className = 'variant-card';
            card.href = `${VARIANT_BASE}${folder}/index.html`;
            card.title = folder;
            // Cap the entrance stagger so later cards don't stay hidden for long.
            card.style.animationDelay = `${Math.min(index, 24) * 0.03}s`;
            // Colour the card by the brand kit's own accent when available.
            const accent = kitAccent(kit) || set.color;
            card.style.setProperty('--set-color', accent);
            card.dataset.set = set.num;

            // Prefer the brand-kit name; otherwise synthesise one in the same
            // "<Set Name> V<n>" style the kits use.
            const name = (kit && kit.name) || `${formatSetName(set.name)} V${variantNum}`;
            const variation = (kit && kit.variation) || '';
            const personality = kit && Array.isArray(kit.personality) ? kit.personality.slice(0, 3) : [];
            const colors = kitColors(kit).slice(0, 6);

            const variationHtml = variation
                ? `<div class="variant-variation">${esc(variation)}</div>` : '';
            const personalityHtml = personality.length
                ? `<div class="variant-personality">${personality.map((p) => `<span class="chip">${esc(p)}</span>`).join('')}</div>` : '';
            const swatchHtml = colors
                .map((c) => `<span class="swatch" style="background:${esc(c)}"></span>`)
                .join('');

            card.innerHTML = `
                <div class="preview-container">
                    <div class="placeholder">Loading preview...</div>
                    <iframe data-src="${VARIANT_BASE}${folder}/index.html" loading="lazy"></iframe>
                    <div class="preview-overlay"></div>
                </div>
                <div class="variant-info">
                    <div class="variant-name">${esc(name)}</div>
                    ${variationHtml}
                    ${personalityHtml}
                    <div class="variant-swatches">
                        <span class="set-tag">${set.num}</span>
                        ${swatchHtml}
                    </div>
                </div>
            `;

            // Observe card for lazy loading
            if (iframeObserver) {
                iframeObserver.observe(card);
            }

            return card;
        }

        async function init() {
            initIntersectionObserver();

            const container = document.getElementById('variants-container');
            const variants = await getVariants();
            const kits = await getBrandKits();
            const grouped = groupBySet(variants);

            // One grid for everything: iterate sets in order so same-set cards
            // stay adjacent (grouped by color), but let them flow continuously so
            // a row can hold the end of one set and the start of the next.
            const grid = document.createElement('div');
            grid.className = 'variants-grid';

            let cardIndex = 0;
            for (const set of designSets) {
                const key = `${set.num}-${set.name}`;
                const setVariants = grouped[key];
                if (!setVariants || setVariants.length === 0) continue;

                for (const variant of setVariants) {
                    const card = renderVariantCard(variant.folder, cardIndex, set, variant.variantNum, kits[variant.folder]);
                    grid.appendChild(card);
                    cardIndex++;
                }
            }

            container.appendChild(grid);

            const subtitle = document.querySelector('.subtitle');
            if (subtitle) {
                subtitle.textContent = `${designSets.length} design sets · ${cardIndex} variants`;
            }

            // Cards are laid out now — size every preview to its card width, and
            // keep them correct as the grid reflows on resize.
            applyAllPreviewScales();
            let resizeTimer;
            window.addEventListener('resize', () => {
                clearTimeout(resizeTimer);
                resizeTimer = setTimeout(applyAllPreviewScales, 150);
            });
        }

        function formatSetName(name) {
            return name.split('-').map(word =>
                word.charAt(0).toUpperCase() + word.slice(1)
            ).join(' ');
        }

        init();
    </script>
</body>
</html>
