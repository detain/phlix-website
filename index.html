<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phlix Website Brand Kits</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #0c0c0f;
            --bg-surface: #141418;
            --bg-card: #1a1a1f;
            --text-primary: #f0f0f0;
            --text-secondary: #8a8a95;
            --accent: #e8ff47;
            --accent-alt: #47c3ff;
            --border: #2a2a32;
            --shadow: rgba(0, 0, 0, 0.5);

            /* Hover-zoom factors for the enlarged preview popout. */
            --zoom-x: 3;
            --zoom-y: 2;

            /* Design set theme colors */
            --set-01: #a3a3a3;
            --set-02: #fbbf24;
            --set-03: #f97316;
            --set-04: #8b5cf6;
            --set-05: #22c55e;
            --set-06: #ec4899;
            --set-07: #facc15;
            --set-08: #14b8a6;
            --set-09: #34d399;
            --set-10: #22c55e;
            --set-11: #a78bfa;
            --set-12: #e879f9;
            --set-13: #ef4444;
            --set-14: #0ea5e9;
            --set-15: #f43f5e;
            --set-16: #3b82f6;
            --set-17: #6b7280;
            --set-18: #78716c;
            --set-19: #fb923c;
            --set-20: #10b981;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Syne', sans-serif;
            background: var(--bg-deep);
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.5;
        }

        /* Noise texture overlay */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            opacity: 0.03;
            z-index: 9999;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
        }

        header {
            padding: 0.75rem 2rem 0.85rem;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        header::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 120px;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--accent), transparent);
        }

        h1 {
            font-size: clamp(1.9rem, 4vw, 2.75rem);
            font-weight: 800;
            letter-spacing: -0.02em;
            margin-bottom: 0.3rem;
            background: linear-gradient(135deg, var(--text-primary) 0%, var(--accent) 50%, var(--accent-alt) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            font-family: 'Space Mono', monospace;
            font-size: 0.875rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.2em;
        }

        main {
            padding: 0.5rem 1rem 2rem;
            max-width: none;
            margin: 0;
        }

        /* One continuous grid for every variant. Cards are ordered by set and
           grouped only by color (no per-set section blocks), so rows can mix the
           tail of one set with the head of the next without a forced row break. */
        .variants-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.1rem;
            align-items: start;
        }

        .variant-card {
            position: relative;
            /* Tint the whole card with the variant's own brand colour. */
            background: color-mix(in srgb, var(--set-color, var(--accent)) 7%, var(--bg-card));
            border-radius: 12px;
            overflow: visible;
            border: 1px solid color-mix(in srgb, var(--set-color, var(--accent)) 22%, var(--border));
            /* Set-colored top edge is the grouping cue in the mixed grid. */
            border-top: 4px solid var(--set-color, var(--accent));
            cursor: pointer;
            text-decoration: none;
            display: block;
            color: inherit;
        }

        .variant-card:hover {
            z-index: 1000;
        }

        .preview-container {
            position: relative;
            width: 100%;
            height: 225px;
            background: var(--bg-surface);
            overflow: hidden;
            border-radius: 10px 10px 0 0;
            transform: scale(1);
            transform-origin: center center;
            transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1),
                        box-shadow 0.35s ease,
                        border-radius 0.2s ease;
        }

        /* Hover: enlarge the preview into an UNDISTORTED ~3x-wide / ~2x-tall
           popout that stays while the cursor is over it. The container stretches
           by (--zoom-x, --zoom-y); the iframe counter-stretches (below) so the
           net scale is uniform — the site grows without distorting. */
        .variant-card:hover .preview-container {
            transform: scale(var(--zoom-x), var(--zoom-y));
            box-shadow: 0 30px 90px var(--shadow), 0 0 0 2px var(--set-color, var(--accent));
            border-radius: 8px;
            z-index: 1000;
        }

        .preview-container iframe {
            /* Render the variant at full desktop width (PREVIEW_WIDTH px) then
               scale the whole frame down so the entire width of the site is
               visible inside the card, instead of a clipped narrow viewport.
               --preview-scale is set per-card in JS from the card's width. */
            width: 1280px;
            height: calc(100% / var(--preview-scale, 0.25));
            border: none;
            pointer-events: none;
            transform: scale(var(--preview-scale, 0.25));
            transform-origin: top left;
            opacity: 0;
            transition: opacity 0.3s ease,
                        transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        /* Counter-stretch so container(--zoom-x,--zoom-y) ∘ iframe scale nets to
           a uniform (--preview-scale * --zoom-x) in both axes → no distortion. */
        .variant-card:hover .preview-container iframe {
            transform: scale(
                var(--preview-scale, 0.25),
                calc(var(--preview-scale, 0.25) * var(--zoom-x) / var(--zoom-y))
            );
        }

        .preview-container iframe.loaded {
            opacity: 1;
        }

        .preview-container .placeholder {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, var(--bg-surface) 0%, var(--bg-card) 100%);
            color: var(--text-secondary);
            font-family: 'Space Mono', monospace;
            font-size: 0.75rem;
            z-index: -1;
        }

        .preview-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .variant-info {
            padding: 0.85rem 1rem;
            /* Brand-tinted info panel so each card's colours carry through. */
            background: color-mix(in srgb, var(--set-color, var(--accent)) 14%, var(--bg-card));
            border-top: 1px solid color-mix(in srgb, var(--set-color, var(--accent)) 40%, var(--border));
            border-radius: 0 0 11px 11px;
        }

        .variant-name {
            font-family: 'Space Mono', monospace;
            font-size: 0.92rem;
            font-weight: 700;
            /* Pull the name toward the brand colour while staying readable. */
            color: color-mix(in srgb, var(--set-color, var(--accent)) 28%, var(--text-primary));
            margin-bottom: 0.35rem;
            letter-spacing: 0.01em;
            line-height: 1.3;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .variant-variation {
            font-size: 0.82rem;
            line-height: 1.4;
            color: var(--text-secondary);
            margin-bottom: 0.55rem;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .variant-personality {
            display: flex;
            flex-wrap: wrap;
            gap: 0.35rem;
            margin-bottom: 0.6rem;
        }

        /* Each chip is tinted with one of the variant's own palette colours
           (set inline as --chip-color), foreground border + soft background. */
        .chip {
            font-size: 0.72rem;
            color: var(--text-primary);
            border: 1px solid var(--chip-color, var(--border));
            background: color-mix(in srgb, var(--chip-color, var(--border)) 18%, transparent);
            border-radius: 999px;
            padding: 0.12rem 0.6rem;
            white-space: nowrap;
        }

        .variant-swatches {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            flex-wrap: wrap;
        }

        .swatch {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.22);
            flex-shrink: 0;
        }

        .set-tag {
            font-family: 'Space Mono', monospace;
            font-weight: 700;
            font-size: 0.76rem;
            color: var(--bg-deep);
            background: var(--set-color, var(--accent));
            padding: 0.14rem 0.5rem;
            border-radius: 3px;
            letter-spacing: 0.05em;
            flex-shrink: 0;
        }

        /* Cards whose brand kit has no built site yet: dimmed, not clickable,
           and never zoom on hover (there is no preview to enlarge). */
        .variant-card.unbuilt {
            cursor: default;
            opacity: 0.72;
        }

        .variant-card.unbuilt:hover .preview-container {
            transform: scale(1);
            box-shadow: none;
        }

        .preview-container .pending {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 0.4rem;
            background:
                repeating-linear-gradient(
                    45deg,
                    var(--bg-surface),
                    var(--bg-surface) 12px,
                    var(--bg-card) 12px,
                    var(--bg-card) 24px);
            color: var(--text-secondary);
            font-family: 'Space Mono', monospace;
            font-size: 0.72rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        .status-tag {
            font-family: 'Space Mono', monospace;
            font-weight: 700;
            font-size: 0.68rem;
            padding: 0.12rem 0.45rem;
            border-radius: 3px;
            letter-spacing: 0.05em;
            flex-shrink: 0;
            border: 1px solid currentColor;
        }

        .status-tag.pending-tag {
            color: var(--text-secondary);
        }

        footer {
            text-align: center;
            padding: 3rem 2rem;
            font-family: 'Space Mono', monospace;
            font-size: 0.75rem;
            color: var(--text-secondary);
            border-top: 1px solid var(--border);
            margin-top: 2rem;
        }

        /* Staggered entrance animation */
        .variant-card {
            opacity: 0;
            transform: translateY(20px);
            animation: fadeInUp 0.5s ease forwards;
        }

        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Scrollbar styling */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-deep);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--text-secondary);
        }

        /* Hover instruction */
        .hover-hint {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            font-family: 'Space Mono', monospace;
            font-size: 0.7rem;
            color: var(--text-secondary);
            background: var(--bg-surface);
            padding: 0.5rem 1rem;
            border-radius: 20px;
            border: 1px solid var(--border);
            opacity: 0.7;
            transition: opacity 0.3s ease;
            z-index: 100;
        }

        @media (max-width: 768px) {
            main {
                padding: 1rem;
            }

            .variants-grid {
                grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
                gap: 0.8rem;
            }

            .preview-container {
                height: 180px;
            }

            /* Gentler zoom so the popout stays on small screens. */
            .variant-card {
                --zoom-x: 2.2;
                --zoom-y: 1.7;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>Phlix Brand Kits</h1>
        <p class="subtitle">Brand-kit site previews</p>
    </header>

    <main id="variants-container">
        <!-- Brand-kit cards are injected here by JavaScript -->
    </main>

    <div class="hover-hint">Hover to preview &middot; Click to open</div>

    <footer>
        Phlix Website Brand Kits &middot; Built with intention
    </footer>

    <script>
        // tools/build.mjs injects window.__PHLIX_KITS__ — one entry per brand
        // kit in brand-kits/*.js, each marked `built:true` when a generated site
        // exists in sites/<slug>/ (copied to dist/<slug>/). dist/ is the GitHub
        // Pages publish root, so built sites live at ./<slug>/. When index.html
        // is opened directly from the repo (no build), the manifest is absent and
        // the page shows a build hint.
        const KITS = (typeof window !== 'undefined' && Array.isArray(window.__PHLIX_KITS__))
            ? window.__PHLIX_KITS__ : null;

        // Relative luminance of a #rrggbb colour (0 = black, 1 = white).
        function hexLum(hex) {
            const m = /^#?([0-9a-f]{6})$/i.exec(hex || '');
            if (!m) return 0.5;
            const n = parseInt(m[1], 16);
            const r = ((n >> 16) & 255) / 255;
            const g = ((n >> 8) & 255) / 255;
            const b = (n & 255) / 255;
            return 0.2126 * r + 0.7152 * g + 0.0722 * b;
        }

        // Palette for chip borders: drop near-black / near-white so every chip
        // border stays visible on the dark panel. Falls back to the accent.
        function chipPalette(colors, accent) {
            const cols = (colors || []).filter((c) => {
                const l = hexLum(c);
                return l > 0.22 && l < 0.9;
            });
            return cols.length ? cols : [accent];
        }

        function esc(s) {
            return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => (
                { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
            ));
        }

        // Desktop width each site is rendered at inside its preview iframe. The
        // frame is then CSS-scaled down to the card's width (see the iframe rule
        // above) so the whole site width is visible. Must match the iframe
        // `width` in CSS.
        const PREVIEW_WIDTH = 1280;
        // Must match --zoom-x in CSS; used only to keep the popout on-screen.
        const HOVER_ZOOM_X = 3;

        // Set --preview-scale on a card's preview container from its current
        // width, so width:1280px * scale renders exactly the container width.
        // Also anchor the hover-zoom origin to the left/right edge for the edge
        // columns so the enlarged popout doesn't spill off-screen.
        function applyPreviewScale(container) {
            const w = container.clientWidth;
            if (w <= 0) return;
            container.style.setProperty('--preview-scale', (w / PREVIEW_WIDTH).toFixed(4));
            const r = container.getBoundingClientRect();
            const spill = (w * (HOVER_ZOOM_X - 1)) / 2;
            const vw = document.documentElement.clientWidth;
            let ox = 'center';
            if (r.left < spill) ox = 'left';
            else if (vw - r.right < spill) ox = 'right';
            container.style.transformOrigin = `${ox} center`;
        }

        function applyAllPreviewScales() {
            document.querySelectorAll('.variant-card:not(.unbuilt) .preview-container').forEach(applyPreviewScale);
        }

        // IntersectionObserver for lazy loading iframes
        let iframeObserver;
        const loadedIframes = new WeakSet();

        function initIntersectionObserver() {
            iframeObserver = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    const iframe = entry.target.querySelector('iframe');
                    if (iframe && entry.isIntersecting) loadIframe(iframe);
                });
            }, {
                rootMargin: '100px',
                threshold: 0.1
            });
        }

        function loadIframe(iframe) {
            if (loadedIframes.has(iframe)) return;
            const src = iframe.dataset.src;
            if (!src) return;
            iframe.src = src;
            iframe.onload = () => { iframe.classList.add('loaded'); };
            loadedIframes.add(iframe);
        }

        // Render one brand-kit card. Built kits are clickable anchors with a
        // live iframe preview; unbuilt kits are dimmed, non-interactive tiles.
        function renderKitCard(kit, index) {
            const built = !!kit.built;
            const card = document.createElement(built ? 'a' : 'div');
            card.className = 'variant-card' + (built ? '' : ' unbuilt');
            if (built) {
                card.href = `./${kit.slug}/index.html`;
            }
            card.title = built ? kit.name : `${kit.name} (site not built yet)`;
            // Cap the entrance stagger so later cards don't stay hidden for long.
            card.style.animationDelay = `${Math.min(index, 24) * 0.03}s`;

            const accent = kit.accent || '#e8ff47';
            card.style.setProperty('--set-color', accent);

            const tagline = kit.tagline || kit.archetype || '';
            const personality = Array.isArray(kit.personality) ? kit.personality.slice(0, 3) : [];
            const colors = (kit.colors || []).slice(0, 6);
            const chipCols = chipPalette(kit.colors, accent);

            const taglineHtml = tagline
                ? `<div class="variant-variation">${esc(tagline)}</div>` : '';
            const personalityHtml = personality.length
                ? `<div class="variant-personality">${personality.map((p, i) =>
                    `<span class="chip" style="--chip-color:${esc(chipCols[i % chipCols.length])}">${esc(p)}</span>`).join('')}</div>` : '';
            const swatchHtml = colors
                .map((c) => `<span class="swatch" style="background:${esc(c)}"></span>`)
                .join('');

            const previewHtml = built
                ? `<div class="placeholder">Loading preview…</div>
                   <iframe data-src="./${esc(kit.slug)}/index.html" loading="lazy" title="${esc(kit.name)} preview"></iframe>
                   <div class="preview-overlay"></div>`
                : `<div class="pending">Site not built yet</div>`;

            const statusTag = built
                ? `<span class="set-tag">Live</span>`
                : `<span class="status-tag pending-tag">Pending</span>`;

            card.innerHTML = `
                <div class="preview-container">
                    ${previewHtml}
                </div>
                <div class="variant-info">
                    <div class="variant-name">${esc(kit.name)}</div>
                    ${taglineHtml}
                    ${personalityHtml}
                    <div class="variant-swatches">
                        ${statusTag}
                        ${swatchHtml}
                    </div>
                </div>
            `;

            if (built && iframeObserver) {
                iframeObserver.observe(card);
            }

            return card;
        }

        function init() {
            const container = document.getElementById('variants-container');

            if (!KITS) {
                container.innerHTML =
                    '<p style="font-family:\'Space Mono\',monospace;color:var(--text-secondary);text-align:center;padding:3rem 1rem;">' +
                    'Run <code>npm run build</code> to generate the brand-kit gallery, then open <code>dist/index.html</code>.</p>';
                return;
            }

            initIntersectionObserver();

            const grid = document.createElement('div');
            grid.className = 'variants-grid';

            KITS.forEach((kit, i) => grid.appendChild(renderKitCard(kit, i)));
            container.appendChild(grid);

            const builtCount = KITS.filter((k) => k.built).length;
            const subtitle = document.querySelector('.subtitle');
            if (subtitle) {
                subtitle.textContent = `${KITS.length} brand kits · ${builtCount} live`;
            }

            // Cards are laid out now — size every preview to its card width, and
            // keep them correct as the grid reflows on resize.
            applyAllPreviewScales();
            let resizeTimer;
            window.addEventListener('resize', () => {
                clearTimeout(resizeTimer);
                resizeTimer = setTimeout(applyAllPreviewScales, 150);
            });
        }

        init();
    </script>
</body>
</html>
