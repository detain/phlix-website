<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A0F0A"/>
      <stop offset="100%" stop-color="#2D1B14"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="50%" stop-color="#C9A227"/>
      <stop offset="100%" stop-color="#FFD700"/>
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#C9A227" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#C9A227" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Glow effect -->
  <ellipse cx="600" cy="280" rx="400" ry="300" fill="url(#glowGrad)"/>

  <!-- Art Deco corners -->
  <g fill="none" stroke="#C9A227" stroke-opacity="0.3" stroke-width="1">
    <path d="M0 0 L60 0 L60 5 L5 5 L5 60 L0 60 Z"/>
    <path d="M1200 0 L1140 0 L1140 5 L1195 5 L1195 60 L1200 60 Z"/>
    <path d="M0 630 L60 630 L60 625 L5 625 L5 570 L0 570 Z"/>
    <path d="M1200 630 L1140 630 L1140 625 L1195 625 L1195 570 L1200 570 Z"/>
  </g>

  <!-- Award statuette -->
  <g transform="translate(600, 240)" fill="url(#goldGrad)">
    <!-- Base -->
    <rect x="-50" y="100" width="100" height="20" rx="4"/>
    <!-- Stem -->
    <rect x="-15" y="40" width="30" height="65" rx="4"/>
    <!-- Body -->
    <ellipse cx="0" cy="20" rx="50" ry="35"/>
    <!-- Head -->
    <circle cx="0" cy="-35" r="25"/>
    <!-- Arm left -->
    <ellipse cx="-55" cy="-5" rx="20" ry="12" transform="rotate(-30 -55 -5)"/>
    <!-- Arm right -->
    <ellipse cx="55" cy="-5" rx="20" ry="12" transform="rotate(30 55 -5)"/>
  </g>

  <!-- Wordmark -->
  <text x="600" y="380" font-family="Georgia, 'Times New Roman', serif" font-size="72" font-weight="bold" fill="url(#goldGrad)" text-anchor="middle">Phlix</text>

  <!-- Tagline -->
  <text x="600" y="440" font-family="Georgia, serif" font-size="24" fill="#BDB49A" text-anchor="middle">Your media. Your library. Your Phlix.</text>

  <!-- Bottom accent line -->
  <rect x="500" y="500" width="200" height="2" fill="url(#goldGrad)" rx="1"/>
</svg>
