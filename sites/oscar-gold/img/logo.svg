<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 50" fill="none">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="50%" stop-color="#C9A227"/>
      <stop offset="100%" stop-color="#FFD700"/>
    </linearGradient>
    <linearGradient id="goldGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C9A227"/>
      <stop offset="100%" stop-color="#FFD700"/>
    </linearGradient>
  </defs>

  <!-- Award statuette silhouette -->
  <g transform="translate(5, 5)">
    <!-- Base -->
    <rect x="8" y="38" width="24" height="4" rx="1" fill="url(#goldGrad)"/>
    <!-- Stem -->
    <rect x="17" y="28" width="6" height="12" rx="1" fill="url(#goldGrad)"/>
    <!-- Body -->
    <ellipse cx="20" cy="22" rx="10" ry="8" fill="url(#goldGrad)"/>
    <!-- Head -->
    <circle cx="20" cy="10" r="6" fill="url(#goldGrad)"/>
    <!-- Arm left -->
    <ellipse cx="8" cy="18" rx="4" ry="3" fill="url(#goldGrad)" transform="rotate(-30 8 18)"/>
    <!-- Arm right -->
    <ellipse cx="32" cy="18" rx="4" ry="3" fill="url(#goldGrad)" transform="rotate(30 32 18)"/>
  </g>

  <!-- Wordmark -->
  <text x="50" y="34" font-family="Georgia, 'Times New Roman', serif" font-size="28" font-weight="bold" fill="url(#goldGrad2)">Phlix</text>
</svg>
