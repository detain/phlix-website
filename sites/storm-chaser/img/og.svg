<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <rect width="1200" height="630" fill="#0D0B1E"/>

  <!-- Background gradient -->
  <defs>
    <radialGradient id="glow" cx="70%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#1B1464" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0D0B1E" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Storm vortex rings -->
  <circle cx="900" cy="300" r="300" fill="none" stroke="#F7981D" stroke-opacity="0.05" stroke-width="2"/>
  <circle cx="900" cy="300" r="220" fill="none" stroke="#F7981D" stroke-opacity="0.08" stroke-width="3"/>
  <circle cx="900" cy="300" r="150" fill="none" stroke="#F7981D" stroke-opacity="0.12" stroke-width="4"/>
  <circle cx="900" cy="300" r="80" fill="none" stroke="#F7981D" stroke-opacity="0.2" stroke-width="5"/>

  <!-- Core glow -->
  <circle cx="900" cy="300" r="40" fill="#F7981D" fill-opacity="0.3"/>
  <circle cx="900" cy="300" r="20" fill="#F7981D"/>

  <!-- Text -->
  <text x="100" y="300" font-family="Bebas Neue, Impact, sans-serif" font-size="120" fill="#F0F4FF" letter-spacing="4">STORM</text>
  <text x="100" y="420" font-family="Bebas Neue, Impact, sans-serif" font-size="120" fill="#F7981D" letter-spacing="4">CHASER</text>

  <text x="100" y="500" font-family="IBM Plex Sans, sans-serif" font-size="28" fill="#7F8C8D">Hunt the Storm. Own the Chaos.</text>

  <!-- Rain streaks -->
  <g opacity="0.1" stroke="#F7981D" stroke-width="1">
    <line x1="100" y1="0" x2="80" y2="200"/>
    <line x1="200" y1="0" x2="180" y2="200"/>
    <line x1="300" y1="0" x2="280" y2="200"/>
    <line x1="400" y1="0" x2="380" y2="200"/>
    <line x1="500" y1="0" x2="480" y2="200"/>
  </g>
</svg>
