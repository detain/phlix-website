<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" fill="none">
  <!-- Warp-drive inspired logo: stylized "P" with warp streak -->
  <defs>
    <linearGradient id="warpGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5FF"/>
      <stop offset="50%" stop-color="#7B2CBF"/>
      <stop offset="100%" stop-color="#FF006E"/>
    </linearGradient>
    <linearGradient id="streakGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5FF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00F5FF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#00F5FF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Warp streak behind -->
  <ellipse cx="45" cy="30" rx="35" ry="6" fill="url(#streakGrad)" opacity="0.6"/>
  <ellipse cx="50" cy="30" rx="28" ry="3" fill="url(#streakGrad)" opacity="0.4"/>

  <!-- P letterform -->
  <path d="M20 12 L20 48 L28 48 L28 36 L38 36 C50 36 56 28 56 22 C56 14 48 12 38 12 Z M28 20 L36 20 C42 20 48 21 48 22 C48 24 44 24 38 24 L28 24 Z"
        fill="url(#warpGrad)"/>

  <!-- "hlix" text -->
  <text x="64" y="40" font-family="system-ui, sans-serif" font-size="22" font-weight="700" letter-spacing="2" fill="#FFFFFF">HLIX</text>
</svg>
