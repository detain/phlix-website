<!-- Autumn Harvest Logo — Phlix. Kit: autumn-harvest v1.0. Wordmark in Playfair Display with maple leaf flourish. -->

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 56" role="img" aria-label="Phlix — Autumn Harvest">
  <title>Phlix</title>

  <!-- Maple leaf icon -->
  <g transform="translate(4, 10)" fill="none" stroke="#B5321A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M16 2C11 2 8 5.5 8 9.5c0 3 2 6 4.5 8.5C14 19 15 20 16 21v6h4v-6c1-1 2-2 3.5-3 2.5-2.5 4.5-5.5 4.5-8.5C28 5.5 21 2 16 2z" fill="#B5321A" stroke="none"/>
    <path d="M16 2C11 2 8 5.5 8 9.5c0 3 2 6 4.5 8.5C14 19 15 20 16 21v6h4v-6c1-1 2-2 3.5-3 2.5-2.5 4.5-5.5 4.5-8.5C28 5.5 21 2 16 2z"/>
    <!-- Leaf veins -->
    <path d="M16 2v19M16 12l-5.5 2.5M16 12l5.5 2.5M16 17l-4 1.5M16 17l4 1.5" stroke-width="1" opacity="0.5"/>
  </g>

  <!-- Phlix wordmark -->
  <text x="44" y="42"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="32"
    font-weight="700"
    fill="#1E140A"
    letter-spacing="-0.01em">Phlix</text>

  <!-- Tagline -->
  <text x="44" y="54"
    font-family="Georgia, serif"
    font-size="9"
    fill="#5C3D1E"
    letter-spacing="0.08em"
    textLength="140">Settle In. The Season Is Perfect.</text>
</svg>
