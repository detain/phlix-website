<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <!-- Orchard dusk gradient -->
    <linearGradient id="ogGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4601A"/>
      <stop offset="60%" stop-color="#B5321A"/>
      <stop offset="100%" stop-color="#5C3D1E"/>
    </linearGradient>
    <!-- Harvest moon glow -->
    <radialGradient id="moonGlow" cx="75%" cy="25%" r="40%">
      <stop offset="0%" stop-color="rgba(200,144,26,0.25)"/>
      <stop offset="100%" stop-color="rgba(200,144,26,0)"/>
    </radialGradient>
    <!-- Linen texture -->
    <filter id="noise">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feBlend in="SourceGraphic" mode="multiply" result="blend"/>
      <feComposite in="blend" in2="SourceGraphic" operator="in"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#ogGrad)"/>
  <rect width="1200" height="630" fill="url(#moonGlow)" opacity="0.8"/>

  <!-- Linen texture overlay -->
  <rect width="1200" height="630" fill="#F7EDD8" opacity="0.04"/>

  <!-- Scattered maple leaves (decorative) -->
  <g opacity="0.12" fill="#C8901A">
    <path d="M100 80 C80 80 70 95 70 110 C70 130 85 145 100 155 C90 145 85 130 85 120 C85 110 95 100 100 80Z" transform="rotate(-20, 85, 110)"/>
    <path d="M300 150 C280 150 270 165 270 180 C270 200 285 215 300 225 C290 215 285 200 285 190 C285 180 295 170 300 150Z" transform="rotate(15, 285, 180)"/>
    <path d="M900 100 C880 100 870 115 870 130 C870 150 885 165 900 175 C890 165 885 150 885 140 C885 130 895 120 900 100Z" transform="rotate(-35, 885, 130)"/>
    <path d="M1100 200 C1080 200 1070 215 1070 230 C1070 250 1085 265 1100 275 C1090 265 1085 250 1085 240 C1085 230 1095 220 1100 200Z" transform="rotate(25, 1085, 230)"/>
    <path d="M150 400 C130 400 120 415 120 430 C120 450 135 465 150 475 C140 465 135 450 135 440 C135 430 145 420 150 400Z" transform="rotate(40, 135, 430)"/>
    <path d="M950 450 C930 450 920 465 920 480 C920 500 935 515 950 525 C940 515 935 500 935 490 C935 480 945 470 950 450Z" transform="rotate(-15, 935, 480)"/>
  </g>

  <!-- Warm parchment card in center -->
  <rect x="200" y="140" width="800" height="350" rx="28" fill="#FAF2E2" opacity="0.95"/>
  <rect x="200" y="140" width="800" height="350" rx="28" fill="none" stroke="#3D2510" stroke-width="2"/>

  <!-- Logo wordmark -->
  <text x="600" y="220" font-family="Georgia, serif" font-size="52" font-weight="700" fill="#1E140A" text-anchor="middle" letter-spacing="-0.01em">Phlix</text>

  <!-- Tagline -->
  <text x="600" y="260" font-family="Georgia, serif" font-size="16" fill="#5C3D1E" text-anchor="middle" letter-spacing="0.1em">Settle In. The Season Is Perfect.</text>

  <!-- Decorative divider -->
  <line x1="400" y1="290" x2="800" y2="290" stroke="#C8901A" stroke-width="2" opacity="0.5"/>
  <circle cx="600" cy="290" r="4" fill="#C8901A"/>

  <!-- Headline -->
  <text x="600" y="355" font-family="Georgia, serif" font-size="36" font-weight="700" fill="#B5321A" text-anchor="middle">Your media. Your library. Your Phlix.</text>

  <!-- CTA pill -->
  <rect x="490" y="390" width="220" height="56" rx="999" fill="#B5321A"/>
  <text x="600" y="428" font-family="'Nunito', sans-serif" font-size="18" font-weight="700" fill="#FAF2E2" text-anchor="middle">Get Phlix</text>
</svg>
