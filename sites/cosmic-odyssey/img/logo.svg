<!-- Logo: Orbitron wordmark PHLIX, orbital arc accent, deep-space-black background -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 80" role="img" aria-label="Phlix logo">
  <rect width="240" height="80" fill="#080B14"/>
  <!-- Orbital arc (stardust-gold) -->
  <path d="M 20 40 A 100 100 0 0 1 220 40" fill="none" stroke="#E8C44A" stroke-width="1.5" opacity="0.5"/>
  <path d="M 28 40 A 84 84 0 0 1 212 40" fill="none" stroke="#E8C44A" stroke-width="1" opacity="0.3"/>
  <!-- PHLIX wordmark -->
  <text x="120" y="50" font-family="Orbitron, 'Exo 2', sans-serif" font-size="36" font-weight="900"
        letter-spacing="0.12em" fill="#E8EAF0" text-anchor="middle"
        style="filter:drop-shadow(0 0 12px rgba(123,63,190,0.6))">PHLIX</text>
</svg>
