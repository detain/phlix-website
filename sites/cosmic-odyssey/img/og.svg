<!-- OG image: 1200x630 social share card, cosmic odyssey aesthetic -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Phlix — Every Story, An Infinite Horizon.">
  <defs>
    <radialGradient id="nebula" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#7B3FBE" stop-opacity="0.35"/>
      <stop offset="40%" stop-color="#C0399A" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#080B14" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sweep" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080B14"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="1200" height="630" fill="#080B14"/>
  <!-- Nebula bloom -->
  <rect width="1200" height="630" fill="url(#nebula)"/>
  <!-- Star field -->
  <g fill="#E8EAF0" opacity="0.7">
    <circle cx="80" cy="90" r="1.5"/>
    <circle cx="220" cy="200" r="1"/>
    <circle cx="400" cy="60" r="1.5"/>
    <circle cx="600" cy="150" r="1"/>
    <circle cx="850" cy="80" r="2" fill="#E8C44A" opacity="0.9"/>
    <circle cx="1000" cy="200" r="1"/>
    <circle cx="1100" cy="120" r="1.5"/>
    <circle cx="150" cy="400" r="1"/>
    <circle cx="300" cy="500" r="1.5"/>
    <circle cx="550" cy="420" r="1"/>
    <circle cx="750" cy="500" r="1"/>
    <circle cx="950" cy="400" r="1.5"/>
    <circle cx="1080" cy="500" r="1"/>
    <circle cx="50" cy="600" r="1"/>
    <circle cx="200" cy="580" r="1.5"/>
    <circle cx="500" cy="600" r="1"/>
    <circle cx="900" cy="580" r="1"/>
    <circle cx="1150" cy="600" r="1.5"/>
    <circle cx="650" cy="300" r="1"/>
    <circle cx="480" cy="350" r="2" fill="#C0399A" opacity="0.6"/>
  </g>
  <!-- Logo mark -->
  <text x="600" y="240" font-family="Orbitron, 'Exo 2', sans-serif" font-size="88" font-weight="900"
        letter-spacing="0.15em" fill="#E8EAF0" text-anchor="middle"
        style="filter:drop-shadow(0 0 30px rgba(123,63,190,0.7))">PHLIX</text>
  <!-- Tagline -->
  <text x="600" y="320" font-family="Rajdhani, 'Exo 2', sans-serif" font-size="28" font-weight="500"
        letter-spacing="0.12em" fill="#A78BFA" text-anchor="middle" opacity="0.9">Every Story, An Infinite Horizon.</text>
  <!-- Bottom bar -->
  <rect x="0" y="560" width="1200" height="70" fill="rgba(8,11,20,0.8)"/>
  <text x="600" y="605" font-family="Rajdhani, 'Exo 2', sans-serif" font-size="20" font-weight="600"
        letter-spacing="0.15em" fill="rgba(232,234,240,0.5)" text-anchor="middle" text-transform="uppercase">Self-hosted PHP media server</text>
</svg>
