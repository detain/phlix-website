<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 40" width="120" height="40">
  <defs>
    <linearGradient id="phlix-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF00FF"/>
      <stop offset="50%" style="stop-color:#FF0080"/>
      <stop offset="100%" style="stop-color:#00FF88"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- P letter with neon glow -->
  <text x="5" y="30" font-family="'Orbitron', sans-serif" font-size="28" font-weight="700" fill="url(#phlix-gradient)" filter="url(#glow)">P</text>
  <!-- hlix text -->
  <text x="30" y="30" font-family="'Orbitron', sans-serif" font-size="28" font-weight="700" fill="#F0F0F0">hlix</text>
  <!-- Accent line -->
  <rect x="5" y="35" width="50" height="2" rx="1" fill="#00FF88" opacity="0.8"/>
</svg>
