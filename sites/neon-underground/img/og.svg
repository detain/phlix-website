<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0A0A0A"/>
      <stop offset="50%" style="stop-color:#141414"/>
      <stop offset="100%" style="stop-color:#0A0A0A"/>
    </linearGradient>
    <linearGradient id="neon-magenta" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FF00FF"/>
      <stop offset="100%" style="stop-color:#FF0080"/>
    </linearGradient>
    <linearGradient id="neon-green" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00FF88"/>
      <stop offset="100%" style="stop-color:#00FFAA"/>
    </linearGradient>
    <filter id="glow-magenta">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glow-green">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#FF00FF" stroke-width="0.5" opacity="0.1"/>
    </pattern>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg-grad)"/>
  
  <!-- Grid overlay -->
  <rect width="1200" height="630" fill="url(#grid)"/>
  
  <!-- Glowing accent lines -->
  <line x1="0" y1="500" x2="1200" y2="500" stroke="#FF00FF" stroke-width="2" opacity="0.3" filter="url(#glow-magenta)"/>
  <line x1="0" y1="130" x2="1200" y2="130" stroke="#00FF88" stroke-width="1" opacity="0.2" filter="url(#glow-green)"/>
  
  <!-- Logo wordmark -->
  <text x="600" y="280" font-family="'Orbitron', sans-serif" font-size="120" font-weight="700" fill="#F0F0F0" text-anchor="middle" letter-spacing="0.05em">
    Phlix
  </text>
  
  <!-- Accent under logo -->
  <rect x="380" y="300" width="440" height="4" rx="2" fill="url(#neon-green)" filter="url(#glow-green)"/>
  
  <!-- Tagline -->
  <text x="600" y="400" font-family="'Exo 2', sans-serif" font-size="36" fill="#A0A0A0" text-anchor="middle" font-weight="400">
    Your media. Your library. Your Phlix.
  </text>
  
  <!-- Bottom accent -->
  <text x="600" y="550" font-family="'JetBrains Mono', monospace" font-size="18" fill="#00FF88" text-anchor="middle" letter-spacing="0.2em" opacity="0.8">
    SELF-HOSTED MEDIA SERVER
  </text>
  
  <!-- Corner decorations -->
  <path d="M 30 30 L 30 80 M 30 30 L 80 30" stroke="#FF00FF" stroke-width="3" fill="none" filter="url(#glow-magenta)"/>
  <path d="M 1170 30 L 1170 80 M 1170 30 L 1120 30" stroke="#FF00FF" stroke-width="3" fill="none" filter="url(#glow-magenta)"/>
  <path d="M 30 600 L 30 550 M 30 600 L 80 600" stroke="#00FF88" stroke-width="3" fill="none" filter="url(#glow-green)"/>
  <path d="M 1170 600 L 1170 550 M 1170 600 L 1120 600" stroke="#00FF88" stroke-width="3" fill="none" filter="url(#glow-green)"/>
</svg>
