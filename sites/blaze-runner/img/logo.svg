<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 52" fill="none">
  <!-- Blaze Runner logo: flame motif + Phlix wordmark in Bangers style + ember/gold accents -->
  <defs>
    <linearGradient id="flameAccent" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#FF4500"/>
      <stop offset="100%" stop-color="#FFD700"/>
    </linearGradient>
    <linearGradient id="emberGlow" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#FF6B00"/>
      <stop offset="100%" stop-color="#1A0A00"/>
    </linearGradient>
    <radialGradient id="flameHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF4500" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#FF4500" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Ember glow halo behind flame -->
  <ellipse cx="20" cy="26" rx="22" ry="20" fill="url(#flameHalo)" opacity="0.6"/>

  <!-- Flame figure — stylized fire shape -->
  <g transform="translate(2, 8)">
    <!-- Outer flame -->
    <path d="M16 32 C12 28 8 20 10 12 C10 6 14 2 18 6 C14 2 18 -2 22 4 C26 10 22 18 22 22 C22 26 20 32 16 32 Z"
          fill="url(#flameAccent)" opacity="0.9"/>
    <!-- Inner flame core -->
    <path d="M16 30 C13 26 11 20 12 14 C12 9 15 5 18 8 C15 5 18 2 21 7 C23 11 20 18 20 22 C20 25 18 30 16 30 Z"
          fill="#FFD700" opacity="0.85"/>
    <!-- Core highlight -->
    <path d="M16 28 C14 25 13 20 14 15 C14 11 16 8 18 10 C16 8 18 5 20 9 C21 12 19 18 19 21 C19 24 17 28 16 28 Z"
          fill="#FFF5E6" opacity="0.6"/>
  </g>

  <!-- Ember particle dots -->
  <circle cx="38" cy="16" r="1.5" fill="#FF4500" opacity="0.8"/>
  <circle cx="42" cy="22" r="1" fill="#FF6B00" opacity="0.7"/>
  <circle cx="40" cy="30" r="1.5" fill="#FFD700" opacity="0.6"/>

  <!-- Vertical flame stripe divider -->
  <rect x="48" y="6" width="3" height="40" rx="1.5" fill="url(#flameAccent)" opacity="0.9"/>

  <!-- "Phlix" wordmark — Bangers style, Impact fallback -->
  <text x="58" y="38"
        font-family="'Bangers', Impact, 'Arial Narrow', sans-serif"
        font-size="34"
        font-weight="400"
        letter-spacing="0.04em"
        fill="#FFF5E6">Phlix</text>

  <!-- Tagline in Barlow Semi Condensed -->
  <text x="58" y="48"
        font-family="'Barlow Semi Condensed', 'Barlow', sans-serif"
        font-size="8"
        font-weight="600"
        letter-spacing="0.14em"
        fill="#FF6B00"
        text-transform="uppercase">Blaze Runner</text>

  <!-- Flame underline accent -->
  <rect x="58" y="50" width="52" height="2" rx="1" fill="url(#flameAccent)" opacity="0.7"/>
</svg>
