<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <!-- Blaze Runner OG image: fire hero banner -->
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#2D1500"/>
      <stop offset="100%" stop-color="#1A0A00"/>
    </linearGradient>
    <linearGradient id="flameGrad" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#FF4500"/>
      <stop offset="50%" stop-color="#FF6B00"/>
      <stop offset="100%" stop-color="#FFD700"/>
    </linearGradient>
    <radialGradient id="emberRadial" cx="50%" cy="80%" r="60%">
      <stop offset="0%" stop-color="#FF4500" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#FF4500" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowGold" cx="70%" cy="30%" r="30%">
      <stop offset="0%" stop-color="#FFD700" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#FFD700" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Ember radial glow from bottom -->
  <ellipse cx="600" cy="630" rx="800" ry="400" fill="url(#emberRadial)"/>

  <!-- Gold glow accent top-right -->
  <ellipse cx="950" cy="150" rx="400" ry="300" fill="url(#glowGold)"/>

  <!-- Ambient ember particles scattered -->
  <circle cx="150" cy="500" r="3" fill="#FF4500" opacity="0.6"/>
  <circle cx="220" cy="480" r="2" fill="#FF6B00" opacity="0.5"/>
  <circle cx="980" cy="420" r="3" fill="#FFD700" opacity="0.5"/>
  <circle cx="1050" cy="380" r="2" fill="#FF4500" opacity="0.4"/>
  <circle cx="100" cy="300" r="2" fill="#FF6B00" opacity="0.5"/>
  <circle cx="1100" cy="200" r="2" fill="#FFD700" opacity="0.4"/>
  <circle cx="600" cy="100" r="2" fill="#FF4500" opacity="0.3"/>

  <!-- Flame accent bar top -->
  <rect x="0" y="0" width="1200" height="4" fill="url(#flameGrad)"/>

  <!-- Center flame motif -->
  <g transform="translate(540, 160)">
    <ellipse cx="60" cy="70" rx="70" ry="65" fill="#FF4500" opacity="0.15"/>
    <path d="M60 130 C45 110 25 80 35 45 C35 20 48 5 60 20 C52 5 60 -10 68 10 C76 25 65 55 65 70 C65 85 62 130 60 130 Z"
          fill="url(#flameGrad)"/>
    <path d="M60 125 C50 108 38 82 45 55 C45 35 52 22 60 32 C54 22 60 10 66 24 C72 36 63 65 63 78 C63 92 61 125 60 125 Z"
          fill="#FFD700" opacity="0.9"/>
    <path d="M60 120 C54 108 46 88 50 65 C50 48 56 38 60 45 C56 38 60 28 64 40 C68 50 62 75 62 85 C62 98 61 120 60 120 Z"
          fill="#FFF5E6" opacity="0.6"/>
  </g>

  <!-- "Phlix" headline -->
  <text x="600" y="360"
        text-anchor="middle"
        font-family="'Bangers', Impact, 'Arial Narrow', sans-serif"
        font-size="100"
        font-weight="400"
        letter-spacing="0.05em"
        fill="#FFF5E6">Phlix</text>

  <!-- Tagline -->
  <text x="600" y="420"
        text-anchor="middle"
        font-family="'Barlow Semi Condensed', 'Barlow', sans-serif"
        font-size="28"
        font-weight="600"
        letter-spacing="0.18em"
        fill="#FF6B00"
        text-transform="uppercase">Stream Ignited</text>

  <!-- Flame divider -->
  <rect x="400" y="440" width="400" height="3" rx="1.5" fill="url(#flameGrad)" opacity="0.8"/>

  <!-- Sub-line -->
  <text x="600" y="490"
        text-anchor="middle"
        font-family="'Barlow', sans-serif"
        font-size="18"
        font-weight="400"
        letter-spacing="0.05em"
        fill="#8B8B8B">Self-hosted media server · Open source · Free forever</text>

  <!-- Bottom flame stripe -->
  <rect x="0" y="626" width="1200" height="4" fill="url(#flameGrad)"/>
</svg>
