<!-- Neon Blossom OG social share card — 1200×630 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Phlix social card">
  <title>Phlix — Where the Night Blooms</title>
  <desc>Neon Blossom brand social share card for Phlix media server</desc>

  <!-- Midnight black background -->
  <rect width="1200" height="630" fill="#08010F"/>

  <!-- Radial bloom glow at center -->
  <radialGradient id="bgBloom" cx="50%" cy="45%" r="55%">
    <stop offset="0%" stop-color="#9B30FF" stop-opacity="0.18"/>
    <stop offset="40%" stop-color="#FF2D78" stop-opacity="0.10"/>
    <stop offset="100%" stop-color="#08010F" stop-opacity="0"/>
  </radialGradient>
  <rect width="1200" height="630" fill="url(#bgBloom)"/>

  <!-- Bottom gradient fade -->
  <linearGradient id="bottomFade" x1="0%" y1="100%" x2="0%" y2="0%">
    <stop offset="0%" stop-color="#130822" stop-opacity="0.9"/>
    <stop offset="50%" stop-color="#130822" stop-opacity="0.4"/>
    <stop offset="100%" stop-color="#08010F" stop-opacity="0"/>
  </linearGradient>
  <rect width="1200" height="630" fill="url(#bottomFade)"/>

  <!-- Decorative bloom circles (large, faint) -->
  <circle cx="950" cy="150" r="200" fill="none" stroke="#9B30FF" stroke-width="1" opacity="0.12"/>
  <circle cx="950" cy="150" r="140" fill="none" stroke="#FF2D78" stroke-width="1.5" opacity="0.15"/>
  <circle cx="950" cy="150" r="90" fill="none" stroke="#FF2D78" stroke-width="1" opacity="0.20"/>

  <!-- Petal shapes (stylised orchid petals radiating from center-left) -->
  <g transform="translate(80, 315)" opacity="0.7">
    <ellipse cx="0" cy="0" rx="40" ry="80" fill="none" stroke="#FF2D78" stroke-width="1.5" transform="rotate(0)"/>
    <ellipse cx="0" cy="0" rx="40" ry="80" fill="none" stroke="#9B30FF" stroke-width="1.5" transform="rotate(60)"/>
    <ellipse cx="0" cy="0" rx="40" ry="80" fill="none" stroke="#FF2D78" stroke-width="1.5" transform="rotate(120)"/>
    <ellipse cx="0" cy="0" rx="40" ry="80" fill="none" stroke="#9B30FF" stroke-width="1.5" transform="rotate(180)"/>
    <ellipse cx="0" cy="0" rx="40" ry="80" fill="none" stroke="#FF2D78" stroke-width="1.5" transform="rotate(240)"/>
    <ellipse cx="0" cy="0" rx="40" ry="80" fill="none" stroke="#9B30FF" stroke-width="1.5" transform="rotate(300)"/>
    <circle cx="0" cy="0" r="20" fill="#FF2D78" opacity="0.8"/>
    <circle cx="0" cy="0" r="30" fill="none" stroke="#FF2D78" stroke-width="2" opacity="0.25"/>
  </g>

  <!-- Brand text -->
  <text x="600" y="200" font-family="Georgia, serif" font-size="72" font-weight="300" fill="#F0EBF8" text-anchor="middle" letter-spacing="-2" filter="url(#ogtextglow)">Phlix</text>
  <text x="600" y="265" font-family="Georgia, serif" font-size="32" font-weight="300" fill="#F0EBF8" text-anchor="middle" letter-spacing="4" opacity="0.65">Where the Night Blooms.</text>

  <!-- Tagline -->
  <text x="600" y="380" font-family="Arial, sans-serif" font-size="20" font-weight="300" fill="#C77DFF" text-anchor="middle" letter-spacing="2" opacity="0.9">SELF-HOSTED MEDIA SERVER</text>

  <!-- CTA line -->
  <text x="600" y="480" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#F0EBF8" text-anchor="middle" opacity="0.6">Roku · Samsung Tizen · Windows · Mobile · DLNA</text>

  <!-- Bottom bar -->
  <rect x="0" y="580" width="1200" height="50" fill="#130822"/>
  <text x="600" y="612" font-family="Arial, sans-serif" font-size="14" font-weight="300" fill="#4A2070" text-anchor="middle" letter-spacing="3">PHLIX.IO</text>

  <!-- Glow filter -->
  <defs>
    <filter id="ogtextglow" x="-10%" y="-20%" width="120%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6" result="blur"/>
      <feFlood flood-color="#FF2D78" flood-opacity="0.5" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
</svg>
