<!-- Neon Blossom favicon — square mark in primary neon hot pink -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Phlix favicon">
  <title>Phlix favicon</title>
  <desc>Neon Blossom brand — glowing orchid bloom in neon hot pink on midnight black</desc>
  <rect width="32" height="32" rx="6" fill="#08010F"/>
  <!-- Stylised bloom petals -->
  <ellipse cx="16" cy="10" rx="4" ry="7" fill="none" stroke="#FF2D78" stroke-width="1.5" opacity="0.95" transform="rotate(0 16 10)"/>
  <ellipse cx="16" cy="10" rx="4" ry="7" fill="none" stroke="#9B30FF" stroke-width="1.5" opacity="0.85" transform="rotate(72 16 10)"/>
  <ellipse cx="16" cy="10" rx="4" ry="7" fill="none" stroke="#FF2D78" stroke-width="1.5" opacity="0.95" transform="rotate(144 16 10)"/>
  <ellipse cx="16" cy="10" rx="4" ry="7" fill="none" stroke="#9B30FF" stroke-width="1.5" opacity="0.85" transform="rotate(216 16 10)"/>
  <ellipse cx="16" cy="10" rx="4" ry="7" fill="none" stroke="#FF2D78" stroke-width="1.5" opacity="0.95" transform="rotate(288 16 10)"/>
  <circle cx="16" cy="10" r="2.5" fill="#FF2D78"/>
  <!-- Glow aura -->
  <circle cx="16" cy="10" r="7" fill="none" stroke="#FF2D78" stroke-width="2" opacity="0.2"/>
</svg>
