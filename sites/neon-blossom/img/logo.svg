<!-- Neon Blossom wordmark logo -->
<!-- Cormorant Garamond Light wordmark + minimal stylised orchid bloom -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 60" role="img" aria-label="Phlix">
  <title>Phlix logo</title>
  <desc>Neon Blossom brand — Phlix wordmark with a minimal orchid bloom icon</desc>

  <!-- Orchid bloom icon (left) -->
  <g transform="translate(8, 10)">
    <!-- Outer petal ring -->
    <ellipse cx="20" cy="12" rx="7" ry="11" fill="none" stroke="#FF2D78" stroke-width="1.5" opacity="0.9" transform="rotate(0 20 12)"/>
    <ellipse cx="20" cy="12" rx="7" ry="11" fill="none" stroke="#9B30FF" stroke-width="1.5" opacity="0.8" transform="rotate(72 20 12)"/>
    <ellipse cx="20" cy="12" rx="7" ry="11" fill="none" stroke="#FF2D78" stroke-width="1.5" opacity="0.9" transform="rotate(144 20 12)"/>
    <ellipse cx="20" cy="12" rx="7" ry="11" fill="none" stroke="#9B30FF" stroke-width="1.5" opacity="0.8" transform="rotate(216 20 12)"/>
    <ellipse cx="20" cy="12" rx="7" ry="11" fill="none" stroke="#FF2D78" stroke-width="1.5" opacity="0.9" transform="rotate(288 20 12)"/>
    <!-- Center -->
    <circle cx="20" cy="12" r="3.5" fill="#FF2D78" opacity="0.9"/>
    <!-- Glow filter on bloom -->
    <ellipse cx="20" cy="12" rx="8" ry="12" fill="none" stroke="#FF2D78" stroke-width="3" opacity="0.15" transform="rotate(36 20 12)"/>
  </g>

  <!-- Wordmark -->
  <text x="60" y="42" font-family="'Cormorant Garamond', 'Playfair Display', Georgia, serif" font-weight="300" font-size="32" letter-spacing="-0.5" fill="#F0EBF8" filter="url(#textglow)">Phlix</text>

  <!-- Glow filter -->
  <defs>
    <filter id="textglow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur"/>
      <feFlood flood-color="#FF2D78" flood-opacity="0.4" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="bloomglow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
</svg>
