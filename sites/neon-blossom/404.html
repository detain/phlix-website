    <style>
      @font-face {
        font-family: 'Cormorant Garamond';
        src: url('../assets/fonts/cormorant-garamond-300-latin.woff2') format('woff2');

      @font-face {

      }
      @font-face {

        font-weight: 300;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'Lato';
        src: url('../assets/fonts/lato-400-latin.woff2') format('woff2');
        font-weight: 400;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'DM Sans';
        src: url('../assets/fonts/dm-sans-400-latin.woff2') format('woff2');
        font-weight: 400;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'DM Sans';
        src: url('../assets/fonts/dm-sans-500-latin.woff2') format('woff2');
        font-weight: 500;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'DM Sans';
        src: url('../assets/fonts/dm-sans-600-latin.woff2') format('woff2');
        font-weight: 600;
        font-style: normal;
        font-display: swap;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      :root {
        --color-primary: #ff2d78;
        --color-secondary: #9b30ff;
        --color-tertiary: #ffd166;
        --color-bg: #08010f;
        --color-surface: #130822;
        --color-surface-alt: #1e0f38;
        --color-text: #f0ebf8;
        --color-border: #4a2070;
        --color-focus: #c77dff;
        --font-headline: 'Cormorant Garamond', 'Playfair Display', serif;
        --font-body: 'Lato', 'Helvetica Neue', sans-serif;
        --font-ui: 'DM Sans', 'Inter', system-ui, sans-serif;
        --space-4: 16px;
        --space-6: 24px;
        --space-8: 32px;
        --space-12: 48px;
        --space-16: 64px;
        --radius-md: 16px;
        --radius-lg: 24px;
        --radius-pill: 999px;
        --glow-pink: 0 0 20px 4px rgba(255, 45, 120, 0.35);
        --glow-violet: 0 0 20px 4px rgba(155, 48, 255, 0.35);
        --transition-fast: 200ms ease;
      }

      html {
        font-size: 16px;
      }

      body {
        background-color: var(--color-bg);
        color: var(--color-text);
        font-family: var(--font-body);
        font-weight: 300;
        line-height: 1.7;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow-x: hidden;
      }

      a {
        color: var(--color-focus);
        text-decoration: none;
        transition: color var(--transition-fast);
      }

      a:hover {
        color: var(--color-primary);
      }

      .container {
        max-width: 600px;
        margin: 0 auto;
        padding: var(--space-8);
        text-align: center;
      }

      .bloom-icon {
        width: 80px;
        height: 80px;
        margin: 0 auto var(--space-8);
        opacity: 0.7;
      }

      h1 {
        font-family: var(--font-headline);
        font-size: 3rem;
        font-weight: 300;
        margin-bottom: var(--space-4);
        text-shadow: 0 0 40px rgba(255, 45, 120, 0.3);
      }

      .subtitle {
        font-family: var(--font-ui);
        font-size: 1.125rem;
        opacity: 0.7;
        margin-bottom: var(--space-8);
        max-width: 45ch;
        margin-inline: auto;
      }

      .recover-links {
        display: flex;
        flex-wrap: wrap;
        gap: var(--space-3);
        justify-content: center;
        margin-bottom: var(--space-12);
      }

      .recover-link {
        font-family: var(--font-ui);
        font-size: 0.9375rem;
        font-weight: 500;
        padding: var(--space-3) var(--space-6);
        border-radius: var(--radius-pill);
        text-decoration: none;
        transition:
          transform var(--transition-fast),
          box-shadow var(--transition-fast),
          background var(--transition-fast);
      }

      .recover-link--primary {
        background: var(--color-primary);
        color: var(--color-text);
      }

      .recover-link--primary:hover {
        background: #ff4a8d;
        box-shadow: var(--glow-pink);
        color: var(--color-text);
        transform: translateY(-1px);
      }

      .recover-link--ghost {
        background: transparent;
        color: var(--color-text);
        border: 1px solid var(--color-border);
      }

      .recover-link--ghost:hover {
        border-color: var(--color-secondary);
        background: rgba(155, 48, 255, 0.08);
        color: var(--color-text);
      }

      .footprint {
        font-family: var(--font-ui);
        font-size: 0.8125rem;
        opacity: 0.35;
        margin-top: var(--space-12);
      }

      .footprint a {
        color: inherit;
      }

      /* Decorative background bloom */
      .bg-bloom {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 0;
        background:
          radial-gradient(ellipse at 20% 80%, rgba(255, 45, 120, 0.08) 0%, transparent 50%),
          radial-gradient(ellipse at 80% 20%, rgba(155, 48, 255, 0.1) 0%, transparent 50%);
      }

      .content {
        position: relative;
        z-index: 1;
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="bg-bloom" aria-hidden="true"></div>

            <ellipse cx="40" cy="40" rx="6" ry="10" fill="#FF2D78" opacity="0.35" />

            <circle cx="43" cy="33" r="1.5" fill="#FFD166" opacity="0.5" />
            <circle cx="45" cy="40" r="1" fill="#39FF85" opacity="0.4" />
            <circle cx="28" cy="28" r="1.5" fill="#FFD166" opacity="0.3" />
            <circle cx="52" cy="28" r="1.5" fill="#FFD166" opacity="0.3" />
            <circle cx="28" cy="52" r="1" fill="#FFD166" opacity="0.2" />

          </svg>

          <h1>This path leads nowhere.</h1>
          <p class="subtitle">
            The garden is quiet here — no bloom at this address. Perhaps it moved, or never grew
            here at all.
          </p>

          <nav class="recover-links" aria-label="Recovery navigation">

          <p class="footprint">

              >Phlix on GitHub</a
            >

        </div>
      </div>

  </body>
</html>
