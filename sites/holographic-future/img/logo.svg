<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 50" fill="none">
  <defs>
    <linearGradient id="chrome-aurora" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0096FF"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="wordmark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F0F4F8"/>
      <stop offset="50%" stop-color="#F0F4F8"/>
      <stop offset="100%" stop-color="#C8D0DA"/>
    </linearGradient>
  </defs>

  <!-- Prism mark -->
  <polygon points="25,5 45,40 5,40" fill="none" stroke="url(#chrome-aurora)" stroke-width="1.5"/>
  <line x1="25" y1="5" x2="25" y2="40" stroke="url(#chrome-aurora)" stroke-width="1" opacity="0.5"/>
  <line x1="5" y1="40" x2="38" y2="28" stroke="#0096FF" stroke-width="0.75" opacity="0.6"/>
  <line x1="45" y1="40" x2="12" y2="28" stroke="#8B5CF6" stroke-width="0.75" opacity="0.6"/>

  <!-- Wordmark -->
  <text x="55" y="34" font-family="Orbitron, Rajdhani, sans-serif" font-size="22" font-weight="700" letter-spacing="0.1em" fill="url(#wordmark)">PHLIX</text>
</svg>
