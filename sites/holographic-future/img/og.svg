<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="100%" stop-color="#1A2233"/>
    </linearGradient>
    <linearGradient id="chrome-aurora" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0096FF"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="wordmark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F0F4F8"/>
      <stop offset="100%" stop-color="#C8D0DA"/>
    </linearGradient>
    <radialGradient id="glow-center" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="rgba(0,150,255,0.15)"/>
      <stop offset="100%" stop-color="rgba(0,150,255,0)"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg-grad)"/>

  <!-- Ambient glow -->
  <ellipse cx="600" cy="250" rx="600" ry="300" fill="url(#glow-center)"/>

  <!-- Geometric wireframe grid (4% opacity) -->
  <g stroke="rgba(255,255,255,0.04)" stroke-width="1">
    <line x1="0" y1="157" x2="1200" y2="157"/>
    <line x1="0" y1="314" x2="1200" y2="314"/>
    <line x1="0" y1="471" x2="1200" y2="471"/>
    <line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
  </g>

  <!-- Prism mark -->
  <g transform="translate(520, 180)">
    <polygon points="80,0 160,140 0,140" fill="none" stroke="url(#chrome-aurora)" stroke-width="2"/>
    <line x1="80" y1="0" x2="80" y2="140" stroke="url(#chrome-aurora)" stroke-width="1.5" opacity="0.5"/>
    <line x1="0" y1="140" x2="120" y2="90" stroke="#0096FF" stroke-width="1" opacity="0.6"/>
    <line x1="160" y1="140" x2="40" y2="90" stroke="#8B5CF6" stroke-width="1" opacity="0.6"/>
  </g>

  <!-- Wordmark -->
  <text x="600" y="420" font-family="Orbitron, Rajdhani, sans-serif" font-size="72" font-weight="700" letter-spacing="0.1em" text-anchor="middle" fill="url(#wordmark)">PHLIX</text>

  <!-- Tagline -->
  <text x="600" y="475" font-family="Space Grotesk, Inter, sans-serif" font-size="24" font-weight="300" letter-spacing="0.04em" text-anchor="middle" fill="rgba(200,208,218,0.8)">The Future, Now Playing.</text>

  <!-- Spectrum sweep accent -->
  <rect x="0" y="600" width="1200" height="4" fill="url(#chrome-aurora)" opacity="0.6"/>
</svg>
