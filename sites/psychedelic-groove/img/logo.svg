<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" width="240" height="60">
  <!-- Wordmark in Lobster style with UV glow -->
  <defs>
    <filter id="uv-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="wordmark-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F5F0FF"/>
      <stop offset="100%" stop-color="#CCFF00"/>
    </linearGradient>
  </defs>
  <!-- Peace sign decorative element -->
  <g transform="translate(8, 12)" opacity="0.9">
    <circle cx="20" cy="20" r="16" fill="none" stroke="#9B00FF" stroke-width="2"/>
    <line x1="20" y1="4" x2="20" y2="36" stroke="#9B00FF" stroke-width="2"/>
    <line x1="20" y1="20" x2="8" y2="30" stroke="#9B00FF" stroke-width="2"/>
    <line x1="20" y1="20" x2="32" y2="30" stroke="#9B00FF" stroke-width="2"/>
  </g>
  <!-- Wordmark text -->
  <text x="60" y="42" font-family="Lobster, 'Pacifico', 'Righteous', cursive" font-size="32" fill="url(#wordmark-grad)" filter="url(#uv-glow)" letter-spacing="1">Phlix</text>
</svg>
