<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 64" role="img" aria-label="Phlix logo">
  <title>Phlix</title>
  <desc>Psychedelic Groove brand wordmark — Phlix in Lobster on blacklight indigo with UV glow and paisley mandala</desc>

  <defs>
    <!-- Cosmic rainbow gradient for accent elements -->
    <linearGradient id="cosmicAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9B00FF"/>
      <stop offset="50%" stop-color="#FF5500"/>
      <stop offset="100%" stop-color="#CCFF00"/>
    </linearGradient>

    <!-- UV bloom glow filter -->
    <filter id="uvGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
      <feFlood flood-color="#9B00FF" flood-opacity="0.7" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Soft mandala petal -->
    <radialGradient id="petalGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#9B00FF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#9B00FF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background: subtle blacklight indigo -->
  <rect width="240" height="64" rx="12" fill="#0A0018"/>

  <!-- Swirling paisley mandala behind wordmark — low opacity -->
  <g opacity="0.18" transform="translate(32, 32)">
    <!-- Outer ring of petals -->
    <ellipse cx="0" cy="-14" rx="5" ry="10" fill="#9B00FF" transform="rotate(0)"/>
    <ellipse cx="0" cy="-14" rx="5" ry="10" fill="#FF5500" transform="rotate(45)"/>
    <ellipse cx="0" cy="-14" rx="5" ry="10" fill="#CCFF00" transform="rotate(90)"/>
    <ellipse cx="0" cy="-14" rx="5" ry="10" fill="#9B00FF" transform="rotate(135)"/>
    <ellipse cx="0" cy="-14" rx="5" ry="10" fill="#FF5500" transform="rotate(180)"/>
    <ellipse cx="0" cy="-14" rx="5" ry="10" fill="#CCFF00" transform="rotate(225)"/>
    <ellipse cx="0" cy="-14" rx="5" ry="10" fill="#9B00FF" transform="rotate(270)"/>
    <ellipse cx="0" cy="-14" rx="5" ry="10" fill="#FF5500" transform="rotate(315)"/>
    <!-- Inner ring -->
    <circle cx="0" cy="-8" r="3.5" fill="#CCFF00" opacity="0.7" transform="rotate(22.5)"/>
    <circle cx="0" cy="-8" r="3.5" fill="#9B00FF" opacity="0.7" transform="rotate(67.5)"/>
    <circle cx="0" cy="-8" r="3.5" fill="#FF5500" opacity="0.7" transform="rotate(112.5)"/>
    <circle cx="0" cy="-8" r="3.5" fill="#CCFF00" opacity="0.7" transform="rotate(157.5)"/>
    <circle cx="0" cy="-8" r="3.5" fill="#9B00FF" opacity="0.7" transform="rotate(202.5)"/>
    <circle cx="0" cy="-8" r="3.5" fill="#FF5500" opacity="0.7" transform="rotate(247.5)"/>
    <circle cx="0" cy="-8" r="3.5" fill="#CCFF00" opacity="0.7" transform="rotate(292.5)"/>
    <circle cx="0" cy="-8" r="3.5" fill="#9B00FF" opacity="0.7" transform="rotate(337.5)"/>
    <!-- Center dot -->
    <circle cx="0" cy="0" r="3" fill="url(#cosmicAccent)"/>
  </g>

  <!-- Wordmark: Phlix in Lobster style -->
  <text
    x="120"
    y="44"
    font-family="Lobster, Pacifico, 'Righteous', cursive"
    font-size="36"
    font-weight="400"
    fill="#F5F0FF"
    text-anchor="middle"
    letter-spacing="1"
    filter="url(#uvGlow)"
  >Phlix</text>

  <!-- Small cosmic rainbow accent line -->
  <rect x="48" y="54" width="144" height="2" rx="1" fill="url(#cosmicAccent)" opacity="0.6"/>
</svg>
