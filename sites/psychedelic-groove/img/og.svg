<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="bg-glow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1A0035"/>
      <stop offset="100%" stop-color="#0A0018"/>
    </radialGradient>
    <radialGradient id="uv-bloom" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#9B00FF" stop-opacity="0.5"/>
      <stop offset="70%" stop-color="#9B00FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F5F0FF"/>
      <stop offset="100%" stop-color="#CCFF00"/>
    </linearGradient>
    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#0A0018"/>
  <rect width="1200" height="630" fill="url(#bg-glow)"/>

  <!-- UV radial bloom -->
  <ellipse cx="600" cy="300" rx="500" ry="400" fill="url(#uv-bloom)"/>

  <!-- Mandala rings -->
  <circle cx="600" cy="315" r="280" fill="none" stroke="#9B00FF" stroke-width="1" opacity="0.2"/>
  <circle cx="600" cy="315" r="220" fill="none" stroke="#FF5500" stroke-width="1" opacity="0.2"/>
  <circle cx="600" cy="315" r="160" fill="none" stroke="#CCFF00" stroke-width="1" opacity="0.25"/>
  <circle cx="600" cy="315" r="100" fill="none" stroke="#9B00FF" stroke-width="1.5" opacity="0.3"/>

  <!-- Peace sign marks -->
  <g transform="translate(200, 315)" opacity="0.15">
    <circle cx="0" cy="0" r="80" fill="none" stroke="#9B00FF" stroke-width="3"/>
    <line x1="0" y1="-80" x2="0" y2="80" stroke="#9B00FF" stroke-width="3"/>
    <line x1="0" y1="0" x2="-70" y2="60" stroke="#9B00FF" stroke-width="3"/>
    <line x1="0" y1="0" x2="70" y2="60" stroke="#9B00FF" stroke-width="3"/>
  </g>
  <g transform="translate(1000, 315) scale(-1,1)" opacity="0.15">
    <circle cx="0" cy="0" r="80" fill="none" stroke="#FF5500" stroke-width="3"/>
    <line x1="0" y1="-80" x2="0" y2="80" stroke="#FF5500" stroke-width="3"/>
    <line x1="0" y1="0" x2="-70" y2="60" stroke="#FF5500" stroke-width="3"/>
    <line x1="0" y1="0" x2="70" y2="60" stroke="#FF5500" stroke-width="3"/>
  </g>

  <!-- Phlix wordmark -->
  <text x="600" y="330" font-family="Lobster, 'Pacifico', 'Righteous', cursive" font-size="96" fill="url(#text-grad)" text-anchor="middle" filter="url(#glow)" letter-spacing="2">Phlix</text>

  <!-- Tagline -->
  <text x="600" y="400" font-family="Nunito, 'Varela Round', system-ui, sans-serif" font-size="28" fill="#F5F0FF" text-anchor="middle" opacity="0.85" letter-spacing="1">Expand Your Universe.</text>

  <!-- Decorative dots -->
  <circle cx="340" cy="490" r="6" fill="#9B00FF" opacity="0.6"/>
  <circle cx="370" cy="490" r="6" fill="#FF5500" opacity="0.6"/>
  <circle cx="400" cy="490" r="6" fill="#CCFF00" opacity="0.6"/>
  <circle cx="800" cy="490" r="6" fill="#9B00FF" opacity="0.6"/>
  <circle cx="830" cy="490" r="6" fill="#FF5500" opacity="0.6"/>
  <circle cx="860" cy="490" r="6" fill="#CCFF00" opacity="0.6"/>
</svg>
