<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="og-title og-desc">
  <title id="og-title">Phlix — Expand Your Universe.</title>
  <desc id="og-desc">Self-hostable PHP media server — stream to Roku, Samsung TV, Windows, mobile, and any DLNA device with SyncPlay, Live TV, and a hub that follows you anywhere.</desc>

  <defs>
    <!-- Cosmic rainbow gradient backdrop -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0018"/>
      <stop offset="60%" stop-color="#120825"/>
      <stop offset="100%" stop-color="#0A0018"/>
    </linearGradient>

    <!-- Accent rainbow gradient -->
    <linearGradient id="rainbowLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9B00FF"/>
      <stop offset="33%" stop-color="#FF5500"/>
      <stop offset="66%" stop-color="#CCFF00"/>
      <stop offset="100%" stop-color="#9B00FF"/>
    </linearGradient>

    <!-- UV radial bloom -->
    <radialGradient id="uvBloom" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#9B00FF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0A0018" stop-opacity="0"/>
    </radialGradient>

    <!-- UV glow filter for text -->
    <filter id="textGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur"/>
      <feFlood flood-color="#9B00FF" flood-opacity="0.6" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- UV radial bloom at center-top -->
  <ellipse cx="600" cy="200" rx="500" ry="350" fill="url(#uvBloom)"/>

  <!-- Swirling paisley mandala (large, faded) -->
  <g opacity="0.08" transform="translate(600, 320)">
    <ellipse cx="0" cy="-120" rx="40" ry="90" fill="#9B00FF" transform="rotate(0)"/>
    <ellipse cx="0" cy="-120" rx="40" ry="90" fill="#FF5500" transform="rotate(30)"/>
    <ellipse cx="0" cy="-120" rx="40" ry="90" fill="#CCFF00" transform="rotate(60)"/>
    <ellipse cx="0" cy="-120" rx="40" ry="90" fill="#9B00FF" transform="rotate(90)"/>
    <ellipse cx="0" cy="-120" rx="40" ry="90" fill="#FF5500" transform="rotate(120)"/>
    <ellipse cx="0" cy="-120" rx="40" ry="90" fill="#CCFF00" transform="rotate(150)"/>
    <ellipse cx="0" cy="-120" rx="40" ry="90" fill="#9B00FF" transform="rotate(180)"/>
    <ellipse cx="0" cy="-120" rx="40" ry="90" fill="#FF5500" transform="rotate(210)"/>
    <ellipse cx="0" cy="-120" rx="40" ry="90" fill="#CCFF00" transform="rotate(240)"/>
    <ellipse cx="0" cy="-120" rx="40" ry="90" fill="#9B00FF" transform="rotate(270)"/>
    <ellipse cx="0" cy="-120" rx="40" ry="90" fill="#FF5500" transform="rotate(300)"/>
    <ellipse cx="0" cy="-120" rx="40" ry="90" fill="#CCFF00" transform="rotate(330)"/>
    <ellipse cx="0" cy="-70" rx="25" ry="55" fill="#9B00FF" transform="rotate(15)"/>
    <ellipse cx="0" cy="-70" rx="25" ry="55" fill="#FF5500" transform="rotate(75)"/>
    <ellipse cx="0" cy="-70" rx="25" ry="55" fill="#CCFF00" transform="rotate(135)"/>
    <ellipse cx="0" cy="-70" rx="25" ry="55" fill="#9B00FF" transform="rotate(195)"/>
    <ellipse cx="0" cy="-70" rx="25" ry="55" fill="#FF5500" transform="rotate(255)"/>
    <ellipse cx="0" cy="-70" rx="25" ry="55" fill="#CCFF00" transform="rotate(315)"/>
    <circle cx="0" cy="0" r="35" fill="url(#rainbowLine)"/>
  </g>

  <!-- Rainbow accent bar at bottom -->
  <rect x="100" y="570" width="1000" height="3" rx="1.5" fill="url(#rainbowLine)" opacity="0.7"/>

  <!-- Phlix wordmark -->
  <text
    x="600"
    y="280"
    font-family="Lobster, Pacifico, 'Righteous', cursive"
    font-size="130"
    font-weight="400"
    fill="#F5F0FF"
    text-anchor="middle"
    letter-spacing="4"
    filter="url(#textGlow)"
  >Phlix</text>

  <!-- Tagline -->
  <text
    x="600"
    y="360"
    font-family="Fredoka One, 'Righteous', sans-serif"
    font-size="36"
    font-weight="400"
    fill="#CCFF00"
    text-anchor="middle"
    letter-spacing="3"
    opacity="0.95"
  >Expand Your Universe.</text>

  <!-- Peace sign decorative element (left) -->
  <g transform="translate(160, 310)" opacity="0.4">
    <circle cx="0" cy="0" r="30" fill="none" stroke="#CCFF00" stroke-width="3"/>
    <line x1="0" y1="-30" x2="0" y2="20" stroke="#CCFF00" stroke-width="3" stroke-linecap="round"/>
    <line x1="0" y1="20" x2="-18" y2="45" stroke="#CCFF00" stroke-width="3" stroke-linecap="round"/>
    <line x1="0" y1="20" x2="18" y2="45" stroke="#CCFF00" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Peace sign decorative element (right) -->
  <g transform="translate(1040, 310)" opacity="0.4">
    <circle cx="0" cy="0" r="30" fill="none" stroke="#CCFF00" stroke-width="3"/>
    <line x1="0" y1="-30" x2="0" y2="20" stroke="#CCFF00" stroke-width="3" stroke-linecap="round"/>
    <line x1="0" y1="20" x2="-18" y2="45" stroke="#CCFF00" stroke-width="3" stroke-linecap="round"/>
    <line x1="0" y1="20" x2="18" y2="45" stroke="#CCFF00" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Corner flower accents -->
  <g opacity="0.3">
    <!-- Top-left flower -->
    <circle cx="60" cy="60" r="8" fill="#9B00FF"/>
    <circle cx="72" cy="52" r="6" fill="#FF5500"/>
    <circle cx="80" cy="64" r="7" fill="#CCFF00"/>
    <circle cx="68" cy="74" r="5" fill="#9B00FF"/>
    <circle cx="54" cy="68" r="6" fill="#FF5500"/>

    <!-- Bottom-right flower -->
    <circle cx="1140" cy="570" r="8" fill="#9B00FF"/>
    <circle cx="1128" cy="558" r="6" fill="#FF5500"/>
    <circle cx="1120" cy="570" r="7" fill="#CCFF00"/>
    <circle cx="1132" cy="582" r="5" fill="#9B00FF"/>
    <circle cx="1146" cy="576" r="6" fill="#FF5500"/>
  </g>
</svg>
