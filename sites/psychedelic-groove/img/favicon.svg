<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Phlix favicon">
  <title>Phlix favicon</title>
  <desc>Ultra-violet rounded square with stylized P in lysergic white</desc>

  <!-- Ultra-violet rounded square -->
  <rect width="32" height="32" rx="6" fill="#9B00FF"/>

  <!-- Inner glow ring -->
  <rect x="2" y="2" width="28" height="28" rx="4" fill="none" stroke="#CCFF00" stroke-width="0.5" opacity="0.4"/>

  <!-- Stylized P in lysergic white -->
  <text
    x="16"
    y="23"
    font-family="Lobster, Pacifico, 'Righteous', cursive"
    font-size="20"
    font-weight="400"
    fill="#F5F0FF"
    text-anchor="middle"
    letter-spacing="-0.5"
  >P</text>

  <!-- Small acid lime dot accent -->
  <circle cx="24" cy="8" r="2.5" fill="#CCFF00" opacity="0.85"/>
</svg>
