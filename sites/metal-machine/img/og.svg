<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="flame" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#FF0000"/>
      <stop offset="50%" style="stop-color:#FF4500"/>
      <stop offset="100%" style="stop-color:#FFD700"/>
    </linearGradient>
    <linearGradient id="chrome" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#F5F5F5"/>
      <stop offset="50%" style="stop-color:#C0C0C0"/>
      <stop offset="100%" style="stop-color:#808080"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a1a"/>
      <stop offset="100%" style="stop-color:#0D0D0D"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="noise">
      <feTurbulence type="fractalNoise" baseFrequency="0.7" numOctaves="3" result="noise"/>
      <feColorMatrix type="saturate" values="0"/>
      <feBlend in="SourceGraphic" in2="noise" mode="multiply" result="blend"/>
      <feComposite in="blend" in2="SourceGraphic" operator="in"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Subtle iron texture pattern -->
  <rect width="1200" height="630" fill="#222" opacity="0.3" filter="url(#noise)"/>

  <!-- Large flame backdrop -->
  <ellipse cx="600" cy="650" rx="400" ry="300" fill="#FF0000" opacity="0.15" filter="url(#glow)"/>
  <ellipse cx="600" cy="630" rx="300" ry="250" fill="#FF4500" opacity="0.2"/>

  <!-- Main logo mark: stylized "P" with flame -->
  <g transform="translate(340, 165)">
    <!-- Large flame shape behind -->
    <path d="M60 280 C60 200, 30 120, 60 60 C90 0, 160 -20, 160 -20 C160 -20, 120 60, 120 140 C120 220, 160 300, 120 280 Z"
          fill="url(#flame)" opacity="0.85" filter="url(#glow)"/>

    <!-- Chrome "P" -->
    <path d="M40 40 L40 280 L90 280 L90 180 L170 180 C210 180, 230 150, 230 110 C230 70, 210 40, 170 40 Z M90 85 L160 85 C185 85, 195 95, 195 110 C195 125, 185 135, 160 135 L90 135 Z"
          fill="url(#chrome)"/>

    <!-- Flame tip accent -->
    <circle cx="130" cy="45" r="15" fill="#FF0000" filter="url(#glow)"/>
  </g>

  <!-- PHLIX text -->
  <g transform="translate(580, 320)">
    <text x="0" y="0"
          font-family="'Anton', 'Bebas Neue', Impact, sans-serif"
          font-size="180"
          font-weight="900"
          letter-spacing="0.08em"
          fill="url(#chrome)"
          filter="url(#glow)">PHLIX</text>
  </g>

  <!-- Flame underline accent -->
  <rect x="580" y="340" width="520" height="8" rx="4" fill="url(#flame)" opacity="0.9"/>
  <rect x="580" y="340" width="520" height="8" rx="4" fill="url(#flame)" filter="url(#glow)" opacity="0.5"/>

  <!-- Metal Machine label -->
  <text x="600" y="450"
        font-family="'Anton', 'Bebas Neue', Impact, sans-serif"
        font-size="48"
        font-weight="400"
        letter-spacing="0.25em"
        fill="#888"
        text-transform="uppercase">METAL MACHINE</text>

  <!-- Chrome accent lines -->
  <rect x="100" y="500" width="200" height="3" fill="url(#chrome)" opacity="0.6"/>
  <rect x="900" y="500" width="200" height="3" fill="url(#chrome)" opacity="0.6"/>

  <!-- Bottom flame bar -->
  <rect x="0" y="610" width="1200" height="20" fill="url(#flame)" opacity="0.7"/>
</svg>