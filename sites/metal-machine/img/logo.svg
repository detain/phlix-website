<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 40" width="120" height="40">
  <defs>
    <linearGradient id="flame" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#FF0000"/>
      <stop offset="50%" style="stop-color:#FF4500"/>
      <stop offset="100%" style="stop-color:#FFD700"/>
    </linearGradient>
    <linearGradient id="chrome" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#E0E0E0"/>
      <stop offset="50%" style="stop-color:#C0C0C0"/>
      <stop offset="100%" style="stop-color:#909090"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Logo mark: stylized "P" with flame accent -->
  <g transform="translate(4, 2)">
    <!-- Flame shape behind -->
    <path d="M8 36 C8 28, 4 20, 8 12 C12 4, 20 0, 20 0 C20 0, 16 8, 16 16 C16 24, 20 32, 16 36 Z"
          fill="url(#flame)" opacity="0.9" filter="url(#glow)"/>

    <!-- Metal "P" shape -->
    <path d="M6 6 L6 34 L10 34 L10 22 L18 22 C22 22, 24 18, 24 14 C24 10, 22 6, 18 6 Z M10 10 L17 10 C19 10, 20 11, 20 14 C20 17, 19 18, 17 18 L10 18 Z"
          fill="url(#chrome)"/>

    <!-- Flame tip accent -->
    <circle cx="14" cy="6" r="2" fill="#FF0000" filter="url(#glow)"/>
  </g>

  <!-- Text: PHLIX -->
  <text x="36" y="28"
        font-family="'Anton', 'Bebas Neue', sans-serif"
        font-size="24"
        font-weight="400"
        letter-spacing="0.15em"
        fill="url(#chrome)"
        text-transform="uppercase">PHLIX</text>

  <!-- Flame underline accent -->
  <rect x="36" y="33" width="72" height="2" rx="1" fill="url(#flame)" opacity="0.8"/>
</svg>
