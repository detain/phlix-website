<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Phlix favicon">
  <title>Phlix favicon</title>
  <desc>Library Amber brand mark — amber gold on mahogany dark square</desc>

  <!-- Square background — mahogany dark -->
  <rect width="32" height="32" rx="5" ry="5" fill="#2B1608"/>

  <!-- Brass border -->
  <rect x="1.5" y="1.5" width="29" height="29" rx="4" ry="4"
        fill="none" stroke="#A8792A" stroke-width="1"/>

  <!-- Open book silhouette — amber gold -->
  <g transform="translate(16, 16)" fill="none" stroke="#C8861A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Center spine -->
    <line x1="0" y1="-9" x2="0" y2="9"/>
    <!-- Left page -->
    <path d="M0 -9 Q-6 -10 -10 -7 L-10 9 Q-6 6 0 7"/>
    <!-- Right page -->
    <path d="M0 -9 Q6 -10 10 -7 L10 9 Q6 6 0 7"/>
    <!-- Left page lines -->
    <line x1="-8" y1="-3" x2="-2" y2="-4"/>
    <line x1="-8" y1="1" x2="-2" y2="0"/>
    <line x1="-7" y1="5" x2="-2" y2="4"/>
    <!-- Right page lines -->
    <line x1="2" y1="-4" x2="8" y2="-3"/>
    <line x1="2" y1="0" x2="8" y2="1"/>
    <line x1="2" y1="4" x2="7" y2="5"/>
  </g>
</svg>
