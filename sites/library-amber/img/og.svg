<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Phlix social share image">
  <title>Phlix — Your Collection, Curated.</title>
  <desc>Library Amber brand social share card — Phlix wordmark on mahogany with amber lamp glow</desc>

  <!-- Background — deep mahogany -->
  <rect width="1200" height="630" fill="#2B1608"/>

  <!-- Amber radial lamp glow -->
  <ellipse cx="600" cy="360" rx="500" ry="300" fill="url(#amberGlow)"/>

  <!-- Herringbone texture hint at bottom -->
  <defs>
    <pattern id="herringbone" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="transparent"/>
      <line x1="0" y1="0" x2="20" y2="40" stroke="#C8861A" stroke-width="0.5" opacity="0.06"/>
      <line x1="20" y1="0" x2="40" y2="40" stroke="#C8861A" stroke-width="0.5" opacity="0.06"/>
      <line x1="-20" y1="0" x2="0" y2="40" stroke="#C8861A" stroke-width="0.5" opacity="0.06"/>
      <line x1="0" y1="0" x2="40" y2="40" stroke="#C8861A" stroke-width="0.5" opacity="0.04"/>
      <line x1="0" y1="0" x2="20" y2="20" stroke="#A8792A" stroke-width="0.5" opacity="0.04"/>
    </pattern>
    <radialGradient id="amberGlow" cx="50%" cy="60%" r="55%">
      <stop offset="0%" stop-color="#C8861A" stop-opacity="0.25"/>
      <stop offset="40%" stop-color="#7A4E10" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#1C0F0A" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#herringbone)"/>

  <!-- Brass top rule -->
  <rect x="60" y="48" width="1080" height="1.5" fill="url(#brassRule)"/>

  <!-- Cartouche / bookplate frame -->
  <rect x="100" y="100" width="1000" height="430" rx="12" ry="12"
        fill="none" stroke="#A8792A" stroke-width="2"/>
  <rect x="108" y="108" width="984" height="414" rx="10" ry="10"
        fill="#0D0806" fill-opacity="0.6"/>

  <!-- Open book SVG element centered -->
  <g transform="translate(540, 270)" fill="none" stroke="#C8861A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Book spine -->
    <line x1="0" y1="-70" x2="0" y2="70"/>
    <!-- Left pages -->
    <path d="M0 -70 Q-50 -78 -80 -55 L-80 70 Q-50 47 0 55"/>
    <!-- Right pages -->
    <path d="M0 -70 Q50 -78 80 -55 L80 70 Q50 47 0 55"/>
    <!-- Left page text lines -->
    <line x1="-70" y1="-38" x2="-12" y2="-45" stroke-width="1.5"/>
    <line x1="-70" y1="-22" x2="-12" y2="-29" stroke-width="1.5"/>
    <line x1="-70" y1="-6" x2="-12" y2="-13" stroke-width="1.5"/>
    <line x1="-70" y1="10" x2="-12" y2="3" stroke-width="1.5"/>
    <!-- Right page text lines -->
    <line x1="12" y1="-45" x2="70" y2="-38" stroke-width="1.5"/>
    <line x1="12" y1="-29" x2="70" y2="-22" stroke-width="1.5"/>
    <line x1="12" y1="-13" x2="70" y2="-6" stroke-width="1.5"/>
    <line x1="12" y1="3" x2="70" y2="10" stroke-width="1.5"/>
  </g>

  <!-- Phlix wordmark -->
  <text x="600" y="390"
        text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="88"
        font-weight="700"
        letter-spacing="-2"
        fill="#C8861A">Phlix</text>

  <!-- Tagline -->
  <text x="600" y="438"
        text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="24"
        font-weight="400"
        font-style="italic"
        letter-spacing="1"
        fill="rgba(242, 232, 208, 0.75)">Your Collection, Curated.</text>

  <!-- Brass bottom rule -->
  <rect x="60" y="570" width="1080" height="1.5" fill="url(#brassRule)"/>

  <defs>
    <linearGradient id="brassRule" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A8792A" stop-opacity="0"/>
      <stop offset="15%" stop-color="#A8792A"/>
      <stop offset="50%" stop-color="#C8861A"/>
      <stop offset="85%" stop-color="#A8792A"/>
      <stop offset="100%" stop-color="#A8792A" stop-opacity="0"/>
    </linearGradient>
  </defs>
</svg>
