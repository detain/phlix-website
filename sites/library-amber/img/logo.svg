<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 52" role="img" aria-label="Phlix logo">
  <title>Phlix</title>
  <desc>Library Amber brand mark — Phlix wordmark in amber gold with an open-book cartouche frame</desc>

  <!-- Cartouche frame — antique cream on mahogany dark -->
  <rect x="1" y="1" width="178" height="50" rx="6" ry="6"
        fill="none" stroke="#2B1608" stroke-width="2"/>
  <rect x="5" y="5" width="170" height="42" rx="4" ry="4"
        fill="#2B1608"/>

  <!-- Brass corner ornaments -->
  <circle cx="5" cy="5" r="2.5" fill="#A8792A"/>
  <circle cx="175" cy="5" r="2.5" fill="#A8792A"/>
  <circle cx="5" cy="47" r="2.5" fill="#A8792A"/>
  <circle cx="175" cy="47" r="2.5" fill="#A8792A"/>

  <!-- Open book silhouette in amber gold -->
  <g transform="translate(14, 14)" fill="none" stroke="#C8861A" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
    <!-- Book spine -->
    <line x1="16" y1="4" x2="16" y2="24"/>
    <!-- Left page -->
    <path d="M16 4 Q8 3 2 6 L2 24 Q8 21 16 22"/>
    <!-- Right page -->
    <path d="M16 4 Q24 3 30 6 L30 24 Q24 21 16 22"/>
    <!-- Page lines left -->
    <line x1="5" y1="10" x2="13" y2="9"/>
    <line x1="5" y1="14" x2="13" y2="13"/>
    <line x1="5" y1="18" x2="12" y2="17"/>
    <!-- Page lines right -->
    <line x1="19" y1="9" x2="27" y2="10"/>
    <line x1="19" y1="13" x2="27" y2="14"/>
    <line x1="20" y1="17" x2="27" y2="18"/>
  </g>

  <!-- Phlix wordmark in Playfair Display style — amber gold -->
  <text x="52" y="37"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="30"
        font-weight="700"
        letter-spacing="-0.5"
        fill="#C8861A">Phlix</text>
</svg>
