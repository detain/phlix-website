<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#001A2E"/>
      <stop offset="50%" style="stop-color:#002F4A"/>
      <stop offset="100%" style="stop-color:#004455"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00CED1"/>
      <stop offset="100%" style="stop-color:#7FFFD4"/>
    </linearGradient>
    <radialGradient id="glow1" cx="30%" cy="30%" r="50%">
      <stop offset="0%" style="stop-color:#00CED1;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#00CED1;stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="70%" cy="70%" r="50%">
      <stop offset="0%" style="stop-color:#7FFFD4;stop-opacity:0.2"/>
      <stop offset="100%" style="stop-color:#7FFFD4;stop-opacity:0"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Glow orbs -->
  <ellipse cx="360" cy="189" rx="300" ry="300" fill="url(#glow1)"/>
  <ellipse cx="840" cy="441" rx="360" ry="360" fill="url(#glow2)"/>

  <!-- Dot pattern -->
  <g opacity="0.1">
    <pattern id="dots" x="0" y="0" width="60" height="60" patternUnits="userSpaceOnUse">
      <circle cx="30" cy="30" r="2" fill="#00CED1"/>
    </pattern>
    <rect width="1200" height="630" fill="url(#dots)"/>
  </g>

  <!-- Wave decoration -->
  <path d="M0 480 Q150 450 300 470 Q450 490 600 460 Q750 430 900 450 Q1050 470 1200 440 L1200 630 L0 630 Z" fill="#004455" opacity="0.5"/>
  <path d="M0 510 Q150 480 300 500 Q450 520 600 490 Q750 460 900 480 Q1050 500 1200 470 L1200 630 L0 630 Z" fill="#003B55" opacity="0.3"/>

  <!-- Logo text -->
  <text x="600" y="280" font-family="Georgia, serif" font-size="120" font-weight="bold" fill="url(#textGrad)" text-anchor="middle" filter="url(#glow)">Phlix</text>

  <!-- Tagline -->
  <text x="600" y="380" font-family="Georgia, serif" font-size="32" fill="#F5F5F5" text-anchor="middle" opacity="0.9">Your media. Your library. Your Phlix.</text>

  <!-- Coral-like decorations -->
  <g opacity="0.4" stroke="#7FFFD4" stroke-width="2" fill="none">
    <path d="M100 560 Q110 530 105 500 Q100 470 110 440"/>
    <path d="M110 440 Q120 420 115 400"/>
    <path d="M200 570 Q205 540 200 510 Q195 480 205 450"/>
    <path d="M205 450 Q215 430 210 410"/>

    <path d="M1100 560 Q1090 530 1095 500 Q1100 470 1090 440"/>
    <path d="M1090 440 Q1080 420 1085 400"/>
    <path d="M1000 570 Q995 540 1000 510 Q1005 480 995 450"/>
    <path d="M995 450 Q985 430 990 410"/>
  </g>
</svg>
