<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 80" role="img" aria-label="Phlix logo — Art Nouveau Garden">
  <title>Phlix</title>
  <desc>Phlix media server wordmark in Cormorant Garamond with botanical Art Nouveau frame</desc>

  <!-- Decorative top vine -->
  <path d="M10 18 Q30 8 50 18 Q70 28 90 18 Q110 8 130 18 Q150 28 170 18 Q185 12 190 18"
        fill="none" stroke="#B8960C" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Left decorative leaf -->
  <ellipse cx="12" cy="40" rx="8" ry="4" fill="none" stroke="#7D9B76" stroke-width="1"
           transform="rotate(-30 12 40)"/>
  <line x1="12" y1="40" x2="12" y2="54" stroke="#7D9B76" stroke-width="1"
        transform="rotate(-30 12 40)" stroke-linecap="round"/>

  <!-- Right decorative leaf -->
  <ellipse cx="188" cy="40" rx="8" ry="4" fill="none" stroke="#7D9B76" stroke-width="1"
           transform="rotate(30 188 40)"/>
  <line x1="188" y1="40" x2="188" y2="54" stroke="#7D9B76" stroke-width="1"
        transform="rotate(30 188 40)" stroke-linecap="round"/>

  <!-- Central lily blossom (small, decorative) -->
  <g transform="translate(100, 44)">
    <ellipse cx="0" cy="-10" rx="4" ry="7" fill="#C08070" opacity="0.7" transform="rotate(0)"/>
    <ellipse cx="0" cy="-10" rx="4" ry="7" fill="#C08070" opacity="0.7" transform="rotate(72)"/>
    <ellipse cx="0" cy="-10" rx="4" ry="7" fill="#C08070" opacity="0.7" transform="rotate(144)"/>
    <ellipse cx="0" cy="-10" rx="4" ry="7" fill="#C08070" opacity="0.7" transform="rotate(216)"/>
    <ellipse cx="0" cy="-10" rx="4" ry="7" fill="#C08070" opacity="0.7" transform="rotate(288)"/>
    <circle cx="0" cy="0" r="3" fill="#B8960C"/>
  </g>

  <!-- Wordmark: Phlix -->
  <text x="100" y="38"
        font-family="'Cormorant Garamond', Georgia, serif"
        font-size="28"
        font-weight="600"
        letter-spacing="0.08em"
        fill="#1F2E1A"
        text-anchor="middle">Phlix</text>

  <!-- Decorative bottom vine -->
  <path d="M10 62 Q30 72 50 62 Q70 52 90 62 Q110 72 130 62 Q150 52 170 62 Q185 68 190 62"
        fill="none" stroke="#B8960C" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Bottom corner dots (botanical terminal dots) -->
  <circle cx="10" cy="60" r="2.5" fill="#B8960C"/>
  <circle cx="190" cy="60" r="2.5" fill="#B8960C"/>
  <circle cx="10" cy="20" r="2" fill="#7D9B76"/>
  <circle cx="190" cy="20" r="2" fill="#7D9B76"/>
</svg>
