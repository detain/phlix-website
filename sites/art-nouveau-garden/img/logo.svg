<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 80" role="img" aria-label="Phlix logo">
  <title>Phlix — Art Nouveau Garden</title>
  <desc>Phlix wordmark in Cormorant Garamond style, framed by botanical Art Nouveau curves with lily and vine accents in aged gold on ivory.</desc>

  <!-- Background -->
  <rect width="280" height="80" fill="#F5EFE0"/>

  <!-- Botanical oval frame - outer ring -->
  <ellipse cx="140" cy="40" rx="130" ry="36" fill="none" stroke="#B8960C" stroke-width="1" opacity="0.5"/>
  <!-- Botanical oval frame - inner decorative ring -->
  <ellipse cx="140" cy="40" rx="118" ry="30" fill="none" stroke="#2C3D28" stroke-width="0.75" opacity="0.4" stroke-dasharray="3 4"/>

  <!-- Top vine scrollwork -->
  <path d="M30 40 Q55 15, 90 25 Q115 32, 140 20 Q165 8, 190 25 Q215 38, 250 40"
        stroke="#7D9B76" stroke-width="1" fill="none" opacity="0.7"/>
  <!-- Bottom vine scrollwork -->
  <path d="M30 40 Q55 65, 90 55 Q115 48, 140 60 Q165 72, 190 55 Q215 42, 250 40"
        stroke="#7D9B76" stroke-width="1" fill="none" opacity="0.7"/>

  <!-- Top decorative lily blossoms -->
  <circle cx="60" cy="22" r="4" fill="#C08070" opacity="0.7"/>
  <circle cx="110" cy="18" r="3" fill="#B8960C" opacity="0.6"/>
  <circle cx="170" cy="18" r="3" fill="#B8960C" opacity="0.6"/>
  <circle cx="220" cy="22" r="4" fill="#C08070" opacity="0.7"/>

  <!-- Bottom decorative lily blossoms -->
  <circle cx="60" cy="58" r="4" fill="#C08070" opacity="0.7"/>
  <circle cx="110" cy="62" r="3" fill="#B8960C" opacity="0.6"/>
  <circle cx="170" cy="62" r="3" fill="#B8960C" opacity="0.6"/>
  <circle cx="220" cy="58" r="4" fill="#C08070" opacity="0.7"/>

  <!-- Left leaf accents -->
  <path d="M18 40 Q25 30, 22 20 Q30 25, 28 35 Q32 28, 30 40 Q25 32, 18 40Z"
        fill="#7D9B76" opacity="0.5"/>
  <path d="M18 40 Q25 50, 22 60 Q30 55, 28 45 Q32 52, 30 40 Q25 48, 18 40Z"
        fill="#7D9B76" opacity="0.5"/>

  <!-- Right leaf accents -->
  <path d="M262 40 Q255 30, 258 20 Q250 25, 252 35 Q248 28, 250 40 Q255 32, 262 40Z"
        fill="#7D9B76" opacity="0.5"/>
  <path d="M262 40 Q255 50, 258 60 Q250 55, 252 45 Q248 52, 250 40 Q255 48, 262 40Z"
        fill="#7D9B76" opacity="0.5"/>

  <!-- Central lily blossom mark -->
  <circle cx="140" cy="40" r="10" fill="none" stroke="#B8960C" stroke-width="1.5"/>
  <circle cx="140" cy="40" r="5" fill="#B8960C" opacity="0.4"/>
  <!-- Petals -->
  <ellipse cx="140" cy="31" rx="3" ry="5" fill="#C08070" opacity="0.6" transform="rotate(0 140 40)"/>
  <ellipse cx="140" cy="31" rx="3" ry="5" fill="#C08070" opacity="0.6" transform="rotate(72 140 40)"/>
  <ellipse cx="140" cy="31" rx="3" ry="5" fill="#C08070" opacity="0.6" transform="rotate(144 140 40)"/>
  <ellipse cx="140" cy="31" rx="3" ry="5" fill="#C08070" opacity="0.6" transform="rotate(216 140 40)"/>
  <ellipse cx="140" cy="31" rx="3" ry="5" fill="#C08070" opacity="0.6" transform="rotate(288 140 40)"/>

  <!-- Wordmark: Phlix -->
  <!-- P -->
  <text x="86" y="48" font-family="Georgia, 'Times New Roman', serif" font-size="26" font-weight="400" letter-spacing="2" fill="#B8960C">P</text>
  <!-- h -->
  <text x="100" y="48" font-family="Georgia, 'Times New Roman', serif" font-size="26" font-weight="400" letter-spacing="2" fill="#B8960C">h</text>
  <!-- l -->
  <text x="111" y="48" font-family="Georgia, 'Times New Roman', serif" font-size="26" font-weight="400" letter-spacing="2" fill="#B8960C">l</text>
  <!-- i -->
  <text x="119" y="48" font-family="Georgia, 'Times New Roman', serif" font-size="26" font-weight="400" letter-spacing="2" fill="#B8960C">i</text>
  <!-- x -->
  <text x="127" y="48" font-family="Georgia, 'Times New Roman', serif" font-size="26" font-weight="400" letter-spacing="2" fill="#B8960C">x</text>

  <!-- Small vine flourish under wordmark -->
  <path d="M88 56 Q110 52, 140 54 Q170 56, 192 52" stroke="#7D9B76" stroke-width="0.75" fill="none" opacity="0.5"/>
  <circle cx="140" cy="55" r="2" fill="#B8960C" opacity="0.5"/>
</svg>
