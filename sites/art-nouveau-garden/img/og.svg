<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Phlix — Art Nouveau Garden">
  <title>Phlix — Where the Garden Blooms, the Story Begins</title>
  <desc>Art Nouveau Garden social share card for Phlix media server</desc>

  <!-- Background: aged gold gradient -->
  <rect width="1200" height="630" fill="#F5EFE0"/>

  <!-- Decorative border frame (Mucha-style) -->
  <rect x="20" y="20" width="1160" height="590" fill="none" stroke="#B8960C" stroke-width="2" rx="4"/>
  <rect x="28" y="28" width="1144" height="574" fill="none" stroke="#B8960C" stroke-width="0.8" rx="2"/>

  <!-- Top decorative vine -->
  <path d="M60 60 Q200 40 400 60 Q600 80 800 60 Q1000 40 1140 60"
        fill="none" stroke="#7D9B76" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Bottom decorative vine -->
  <path d="M60 570 Q200 590 400 570 Q600 550 800 570 Q1000 590 1140 570"
        fill="none" stroke="#7D9B76" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Corner botanical flourishes -->
  <!-- Top-left -->
  <ellipse cx="60" cy="60" rx="20" ry="10" fill="none" stroke="#B8960C" stroke-width="1.2"
           transform="rotate(-45 60 60)"/>
  <circle cx="44" cy="44" r="4" fill="#B8960C"/>

  <!-- Top-right -->
  <ellipse cx="1140" cy="60" rx="20" ry="10" fill="none" stroke="#B8960C" stroke-width="1.2"
           transform="rotate(45 1140 60)"/>
  <circle cx="1156" cy="44" r="4" fill="#B8960C"/>

  <!-- Bottom-left -->
  <ellipse cx="60" cy="570" rx="20" ry="10" fill="none" stroke="#B8960C" stroke-width="1.2"
           transform="rotate(45 60 570)"/>
  <circle cx="44" cy="586" r="4" fill="#B8960C"/>

  <!-- Bottom-right -->
  <ellipse cx="1140" cy="570" rx="20" ry="10" fill="none" stroke="#B8960C" stroke-width="1.2"
           transform="rotate(-45 1140 570)"/>
  <circle cx="1156" cy="586" r="4" fill="#B8960C"/>

  <!-- Central lily blossom (larger, hero) -->
  <g transform="translate(600, 310)">
    <ellipse cx="0" cy="-45" rx="16" ry="28" fill="#C08070" opacity="0.6" transform="rotate(0)"/>
    <ellipse cx="0" cy="-45" rx="16" ry="28" fill="#C08070" opacity="0.6" transform="rotate(72)"/>
    <ellipse cx="0" cy="-45" rx="16" ry="28" fill="#C08070" opacity="0.6" transform="rotate(144)"/>
    <ellipse cx="0" cy="-45" rx="16" ry="28" fill="#C08070" opacity="0.6" transform="rotate(216)"/>
    <ellipse cx="0" cy="-45" rx="16" ry="28" fill="#C08070" opacity="0.6" transform="rotate(288)"/>
    <circle cx="0" cy="0" r="12" fill="#B8960C"/>
    <circle cx="0" cy="0" r="7" fill="#F5EFE0" opacity="0.6"/>
  </g>

  <!-- Phlix wordmark -->
  <text x="600" y="200"
        font-family="'Cormorant Garamond', Georgia, serif"
        font-size="96"
        font-weight="700"
        letter-spacing="0.1em"
        fill="#1F2E1A"
        text-anchor="middle">Phlix</text>

  <!-- Primary tagline -->
  <text x="600" y="420"
        font-family="'Josefin Sans', sans-serif"
        font-size="22"
        font-weight="300"
        letter-spacing="0.25em"
        fill="#7A6352"
        text-anchor="middle" text-transform="uppercase">Where the Garden Blooms</text>

  <!-- Sub-tagline -->
  <text x="600" y="460"
        font-family="'EB Garamond', Georgia, serif"
        font-size="24"
        font-style="italic"
        fill="#C08070"
        text-anchor="middle">the Story Begins.</text>

  <!-- Feather accents (left) -->
  <path d="M80 200 Q120 180 140 220 Q160 260 140 290 Q120 300 100 280"
        fill="none" stroke="#3D7A8A" stroke-width="1.5" opacity="0.5"/>

  <!-- Feather accents (right) -->
  <path d="M1120 200 Q1080 180 1060 220 Q1040 260 1060 290 Q1080 300 1100 280"
        fill="none" stroke="#3D7A8A" stroke-width="1.5" opacity="0.5"/>
</svg>
