<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Phlix — Where the Garden Blooms, the Story Begins">
  <title>Phlix — Art Nouveau Garden</title>
  <desc>Open Graph social share card for Phlix: Art Nouveau Garden brand identity — botanical illustration, aged gold wordmark, ivory cream backdrop.</desc>

  <!-- Background -->
  <rect width="1200" height="630" fill="#F5EFE0"/>

  <!-- Decorative gradient overlay -->
  <defs>
    <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#FAF5EA" stop-opacity="0"/>
      <stop offset="100%" stop-color="#1F2E1A" stop-opacity="0.08"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B8960C"/>
      <stop offset="100%" stop-color="#C08070"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#vignette)"/>

  <!-- Top vine border -->
  <path d="M0 60 Q200 20, 400 55 Q600 90, 800 55 Q1000 20, 1200 60"
        stroke="#2C3D28" stroke-width="2" fill="none" opacity="0.3"/>
  <path d="M0 70 Q200 30, 400 65 Q600 100, 800 65 Q1000 30, 1200 70"
        stroke="#7D9B76" stroke-width="1" fill="none" opacity="0.4"/>

  <!-- Bottom vine border -->
  <path d="M0 570 Q200 610, 400 575 Q600 540, 800 575 Q1000 610, 1200 570"
        stroke="#2C3D28" stroke-width="2" fill="none" opacity="0.3"/>
  <path d="M0 560 Q200 600, 400 565 Q600 530, 800 565 Q1000 600, 1200 560"
        stroke="#7D9B76" stroke-width="1" fill="none" opacity="0.4"/>

  <!-- Corner botanical flourishes -->
  <!-- Top left -->
  <path d="M20 100 Q40 50, 80 40 Q60 80, 20 100Z" fill="#7D9B76" opacity="0.3"/>
  <path d="M20 100 Q60 70, 100 50" stroke="#B8960C" stroke-width="1.5" fill="none" opacity="0.5"/>
  <circle cx="100" cy="50" r="5" fill="#C08070" opacity="0.6"/>

  <!-- Top right -->
  <path d="M1180 100 Q1160 50, 1120 40 Q1140 80, 1180 100Z" fill="#7D9B76" opacity="0.3"/>
  <path d="M1180 100 Q1140 70, 1100 50" stroke="#B8960C" stroke-width="1.5" fill="none" opacity="0.5"/>
  <circle cx="1100" cy="50" r="5" fill="#C08070" opacity="0.6"/>

  <!-- Bottom left -->
  <path d="M20 530 Q40 580, 80 590 Q60 550, 20 530Z" fill="#7D9B76" opacity="0.3"/>
  <path d="M20 530 Q60 560, 100 580" stroke="#B8960C" stroke-width="1.5" fill="none" opacity="0.5"/>
  <circle cx="100" cy="580" r="5" fill="#C08070" opacity="0.6"/>

  <!-- Bottom right -->
  <path d="M1180 530 Q1160 580, 1120 590 Q1140 550, 1180 530Z" fill="#7D9B76" opacity="0.3"/>
  <path d="M1180 530 Q1140 560, 1100 580" stroke="#B8960C" stroke-width="1.5" fill="none" opacity="0.5"/>
  <circle cx="1100" cy="580" r="5" fill="#C08070" opacity="0.6"/>

  <!-- Central lily emblem -->
  <ellipse cx="600" cy="250" rx="120" ry="35" fill="none" stroke="#B8960C" stroke-width="1.5" opacity="0.4"/>
  <ellipse cx="600" cy="250" rx="105" ry="28" fill="none" stroke="#2C3D28" stroke-width="0.75" stroke-dasharray="4 5" opacity="0.3"/>

  <!-- Lily blossom at center top -->
  <ellipse cx="600" cy="205" rx="10" ry="18" fill="#C08070" opacity="0.7" transform="rotate(0 600 225)"/>
  <ellipse cx="600" cy="205" rx="10" ry="18" fill="#C08070" opacity="0.7" transform="rotate(72 600 225)"/>
  <ellipse cx="600" cy="205" rx="10" ry="18" fill="#C08070" opacity="0.7" transform="rotate(144 600 225)"/>
  <ellipse cx="600" cy="205" rx="10" ry="18" fill="#C08070" opacity="0.7" transform="rotate(216 600 225)"/>
  <ellipse cx="600" cy="205" rx="10" ry="18" fill="#C08070" opacity="0.7" transform="rotate(288 600 225)"/>
  <circle cx="600" cy="225" r="15" fill="#B8960C" opacity="0.8"/>
  <circle cx="600" cy="225" r="8" fill="#F5EFE0" opacity="0.4"/>

  <!-- Phlix wordmark -->
  <text x="600" y="290"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="72"
        font-weight="400"
        letter-spacing="8"
        text-anchor="middle"
        fill="#1F2E1A">Phlix</text>

  <!-- Tagline -->
  <text x="600" y="335"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="24"
        font-weight="400"
        font-style="italic"
        letter-spacing="3"
        text-anchor="middle"
        fill="#B8960C">Where the Garden Blooms, the Story Begins.</text>

  <!-- Subtext / product line -->
  <text x="600" y="390"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="18"
        font-weight="400"
        letter-spacing="2"
        text-anchor="middle"
        fill="#7A6352">Self-hosted media server</text>

  <!-- Decorative vine divider -->
  <path d="M350 420 Q475 410, 600 415 Q725 420, 850 410"
        stroke="#7D9B76" stroke-width="1" fill="none" opacity="0.5"/>
  <circle cx="475" cy="413" r="4" fill="#B8960C" opacity="0.6"/>
  <circle cx="600" cy="415" r="5" fill="#C08070" opacity="0.7"/>
  <circle cx="725" cy="413" r="4" fill="#B8960C" opacity="0.6"/>

  <!-- Bottom tagline -->
  <text x="600" y="480"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="16"
        font-weight="400"
        letter-spacing="3"
        text-anchor="middle"
        fill="#7A6352">Roku · Samsung Tizen · Windows · Mobile · DLNA</text>

  <!-- Bottom banner -->
  <rect x="0" y="560" width="1200" height="70" fill="#B8960C" opacity="0.12"/>
  <text x="600" y="598"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="20"
        font-weight="400"
        font-style="italic"
        letter-spacing="2"
        text-anchor="middle"
        fill="#1F2E1A">beauty without borders · 100% open source · BSD-3-Clause</text>
</svg>
