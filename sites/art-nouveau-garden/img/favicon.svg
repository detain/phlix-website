<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Phlix favicon">
  <title>Phlix favicon — Art Nouveau Garden</title>
  <desc>Stylized lily blossom mark in aged gold on ivory, derived from the Art Nouveau Garden brand kit.</desc>
  <rect width="32" height="32" fill="#F5EFE0" rx="6"/>
  <!-- Lily blossom petals -->
  <ellipse cx="16" cy="10" rx="3" ry="5" fill="#C08070" opacity="0.8" transform="rotate(0 16 18)"/>
  <ellipse cx="16" cy="10" rx="3" ry="5" fill="#C08070" opacity="0.8" transform="rotate(72 16 18)"/>
  <ellipse cx="16" cy="10" rx="3" ry="5" fill="#C08070" opacity="0.8" transform="rotate(144 16 18)"/>
  <ellipse cx="16" cy="10" rx="3" ry="5" fill="#C08070" opacity="0.8" transform="rotate(216 16 18)"/>
  <ellipse cx="16" cy="10" rx="3" ry="5" fill="#C08070" opacity="0.8" transform="rotate(288 16 18)"/>
  <!-- Center -->
  <circle cx="16" cy="18" r="4" fill="#B8960C"/>
  <circle cx="16" cy="18" r="2" fill="#F5EFE0" opacity="0.5"/>
</svg>
