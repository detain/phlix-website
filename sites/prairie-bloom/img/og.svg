<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Prairie Bloom — Phlix media server">
  <title>Prairie Bloom — Phlix</title>
  <desc>Stories Worth Gathering For. A self-hosted PHP media server for everyone.</desc>

  <!-- Background: prairie sky gradient -->
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#A8CFEA"/>
      <stop offset="60%" stop-color="#F7F0DC"/>
      <stop offset="100%" stop-color="#EDE3C5"/>
    </linearGradient>
    <radialGradient id="bloomGrad" cx="50%" cy="60%" r="50%">
      <stop offset="0%" stop-color="rgba(123,94,167,0.18)"/>
      <stop offset="100%" stop-color="rgba(247,240,220,0)"/>
    </radialGradient>
    <linearGradient id="sunGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F2C12E"/>
      <stop offset="100%" stop-color="#D9A520"/>
    </linearGradient>
    <clipPath id="bottomClip">
      <rect width="1200" height="630" ry="0"/>
    </clipPath>
  </defs>

  <rect width="1200" height="630" fill="url(#skyGrad)"/>
  <rect width="1200" height="630" fill="url(#bloomGrad)"/>

  <!-- Ground hill -->
  <ellipse cx="600" cy="700" rx="800" ry="200" fill="#4E7C59" opacity="0.25"/>
  <ellipse cx="600" cy="750" rx="900" ry="180" fill="#4E7C59" opacity="0.15"/>

  <!-- Left sunflower -->
  <g transform="translate(80, 350)" opacity="0.85">
    <ellipse cx="0" cy="-55" rx="14" ry="32" fill="#F2C12E" transform="rotate(0)"/>
    <ellipse cx="0" cy="-55" rx="14" ry="32" fill="#F2C12E" transform="rotate(30)"/>
    <ellipse cx="0" cy="-55" rx="14" ry="32" fill="#F2C12E" transform="rotate(60)"/>
    <ellipse cx="0" cy="-55" rx="14" ry="32" fill="#F2C12E" transform="rotate(90)"/>
    <ellipse cx="0" cy="-55" rx="14" ry="32" fill="#F2C12E" transform="rotate(120)"/>
    <ellipse cx="0" cy="-55" rx="14" ry="32" fill="#F2C12E" transform="rotate(150)"/>
    <ellipse cx="0" cy="-55" rx="14" ry="32" fill="#D9A520" transform="rotate(15)"/>
    <ellipse cx="0" cy="-55" rx="14" ry="32" fill="#D9A520" transform="rotate(75)"/>
    <ellipse cx="0" cy="-55" rx="14" ry="32" fill="#D9A520" transform="rotate(135)"/>
    <circle cx="0" cy="0" r="28" fill="#2C1D0E"/>
    <circle cx="-8" cy="-8" r="4" fill="#4E7C59"/>
    <circle cx="6" cy="-6" r="4" fill="#4E7C59"/>
    <circle cx="-4" cy="8" r="4" fill="#4E7C59"/>
    <circle cx="8" cy="6" r="4" fill="#4E7C59"/>
    <!-- Stem -->
    <line x1="0" y1="28" x2="0" y2="160" stroke="#4E7C59" stroke-width="8" stroke-linecap="round"/>
    <!-- Leaves -->
    <path d="M0 80 Q-40 60 -50 100 Q-20 90 0 100Z" fill="#4E7C59"/>
    <path d="M0 120 Q40 100 50 140 Q20 130 0 140Z" fill="#4E7C59"/>
  </g>

  <!-- Right sunflower -->
  <g transform="translate(1100, 380)" opacity="0.75">
    <ellipse cx="0" cy="-50" rx="12" ry="28" fill="#F2C12E" transform="rotate(0)"/>
    <ellipse cx="0" cy="-50" rx="12" ry="28" fill="#F2C12E" transform="rotate(36)"/>
    <ellipse cx="0" cy="-50" rx="12" ry="28" fill="#F2C12E" transform="rotate(72)"/>
    <ellipse cx="0" cy="-50" rx="12" ry="28" fill="#F2C12E" transform="rotate(108)"/>
    <ellipse cx="0" cy="-50" rx="12" ry="28" fill="#F2C12E" transform="rotate(144)"/>
    <ellipse cx="0" cy="-50" rx="12" ry="28" fill="#F2C12E" transform="rotate(180)"/>
    <ellipse cx="0" cy="-50" rx="12" ry="28" fill="#F2C12E" transform="rotate(216)"/>
    <ellipse cx="0" cy="-50" rx="12" ry="28" fill="#F2C12E" transform="rotate(252)"/>
    <ellipse cx="0" cy="-50" rx="12" ry="28" fill="#F2C12E" transform="rotate(288)"/>
    <ellipse cx="0" cy="-50" rx="12" ry="28" fill="#F2C12E" transform="rotate(324)"/>
    <circle cx="0" cy="0" r="24" fill="#2C1D0E"/>
    <circle cx="-6" cy="-6" r="3.5" fill="#4E7C59"/>
    <circle cx="5" cy="-5" r="3.5" fill="#4E7C59"/>
    <circle cx="-3" cy="7" r="3.5" fill="#4E7C59"/>
    <circle cx="7" cy="5" r="3.5" fill="#4E7C59"/>
    <line x1="0" cy="24" x2="0" y2="140" stroke="#4E7C59" stroke-width="7" stroke-linecap="round"/>
    <path d="M0 70 Q-35 55 -42 88 Q-15 80 0 90Z" fill="#4E7C59"/>
  </g>

  <!-- Wildflower scatter - left -->
  <g opacity="0.6">
    <circle cx="200" cy="520" r="8" fill="#7B5EA7"/>
    <circle cx="250" cy="550" r="6" fill="#B83A3A"/>
    <circle cx="160" cy="560" r="7" fill="#4E7C59"/>
    <circle cx="300" cy="530" r="5" fill="#7B5EA7"/>
    <circle cx="340" cy="570" r="6" fill="#B83A3A"/>
    <circle cx="120" cy="580" r="5" fill="#4E7C59"/>
    <!-- stems -->
    <line x1="200" y1="528" x2="200" y2="630" stroke="#4E7C59" stroke-width="2"/>
    <line x1="160" y1="567" x2="160" y2="630" stroke="#4E7C59" stroke-width="2"/>
  </g>

  <!-- Wildflower scatter - right -->
  <g opacity="0.6">
    <circle cx="900" cy="540" r="7" fill="#7B5EA7"/>
    <circle cx="950" cy="570" r="5" fill="#B83A3A"/>
    <circle cx="870" cy="550" r="6" fill="#4E7C59"/>
    <circle cx="1000" cy="530" r="6" fill="#7B5EA7"/>
    <circle cx="1050" cy="560" r="5" fill="#B83A3A"/>
    <line x1="900" y1="547" x2="900" y2="630" stroke="#4E7C59" stroke-width="2"/>
    <line x1="870" y1="556" x2="870" y2="630" stroke="#4E7C59" stroke-width="2"/>
  </g>

  <!-- Central content area -->
  <rect x="200" y="140" width="800" height="350" rx="28" fill="#FBF6EA" opacity="0.92"/>
  <rect x="200" y="140" width="800" height="350" rx="28" fill="none" stroke="#2C1D0E" stroke-width="4"/>

  <!-- Phlix wordmark -->
  <text x="600" y="230"
    font-family="Georgia, serif"
    font-size="72"
    font-weight="bold"
    fill="#2C1D0E"
    text-anchor="middle"
    letter-spacing="0.03em">Phlix</text>

  <!-- Divider -->
  <line x1="380" y1="255" x2="820" y2="255" stroke="#2C1D0E" stroke-width="2" stroke-dasharray="8,4" opacity="0.4"/>

  <!-- Tagline -->
  <text x="600" y="320"
    font-family="Georgia, serif"
    font-size="36"
    font-style="italic"
    fill="#2C1D0E"
    text-anchor="middle"
    letter-spacing="0.02em">Stories Worth Gathering For.</text>

  <!-- Sub-tagline -->
  <text x="600" y="380"
    font-family="Georgia, serif"
    font-size="22"
    fill="#7B5EA7"
    text-anchor="middle"
    opacity="0.9">Self-hosted PHP media server</text>

  <!-- Sunflower accent icons flanking sub-tagline -->
  <g transform="translate(320, 365)" opacity="0.8">
    <ellipse cx="0" cy="-12" rx="4" ry="9" fill="#F2C12E" transform="rotate(0)"/>
    <ellipse cx="0" cy="-12" rx="4" ry="9" fill="#F2C12E" transform="rotate(60)"/>
    <ellipse cx="0" cy="-12" rx="4" ry="9" fill="#F2C12E" transform="rotate(120)"/>
    <ellipse cx="0" cy="-12" rx="4" ry="9" fill="#F2C12E" transform="rotate(180)"/>
    <ellipse cx="0" cy="-12" rx="4" ry="9" fill="#F2C12E" transform="rotate(240)"/>
    <ellipse cx="0" cy="-12" rx="4" ry="9" fill="#F2C12E" transform="rotate(300)"/>
    <circle cx="0" cy="0" r="6" fill="#2C1D0E"/>
  </g>
  <g transform="translate(880, 365)" opacity="0.8">
    <ellipse cx="0" cy="-12" rx="4" ry="9" fill="#F2C12E" transform="rotate(0)"/>
    <ellipse cx="0" cy="-12" rx="4" ry="9" fill="#F2C12E" transform="rotate(60)"/>
    <ellipse cx="0" cy="-12" rx="4" ry="9" fill="#F2C12E" transform="rotate(120)"/>
    <ellipse cx="0" cy="-12" rx="4" ry="9" fill="#F2C12E" transform="rotate(180)"/>
    <ellipse cx="0" cy="-12" rx="4" ry="9" fill="#F2C12E" transform="rotate(240)"/>
    <ellipse cx="0" cy="-12" rx="4" ry="9" fill="#F2C12E" transform="rotate(300)"/>
    <circle cx="0" cy="0" r="6" fill="#2C1D0E"/>
  </g>

  <!-- Bottom banner -->
  <rect x="0" y="600" width="1200" height="30" fill="#2C1D0E" opacity="0.12"/>
  <text x="600" y="622"
    font-family="Georgia, serif"
    font-size="14"
    fill="#2C1D0E"
    text-anchor="middle"
    opacity="0.7">BSD-3-Clause &nbsp;·&nbsp; Self-hostable &nbsp;·&nbsp; No lock-in</text>
</svg>
