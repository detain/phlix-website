<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <!-- Prairie Bloom OG card: sunflower meadow on hay cream -->
  <rect width="1200" height="630" fill="#F7F0DC"/>
  <!-- Subtle radial gradient -->
  <radialGradient id="hg" cx="70%" cy="30%" r="60%">
    <stop offset="0%" stop-color="#F2C12E" stop-opacity="0.25"/>
    <stop offset="100%" stop-color="#F7F0DC" stop-opacity="0"/>
  </radialGradient>
  <rect width="1200" height="630" fill="url(#hg)"/>
  <!-- Quilt-dash border -->
  <rect x="40" y="40" width="1120" height="550" rx="18" fill="none" stroke="#2C1D0E" stroke-width="3" stroke-dasharray="12 8"/>
  <!-- Large sunflower cluster -->
  <g transform="translate(850, 80)">
    <circle cx="60" cy="60" r="55" fill="#F2C12E" stroke="#2C1D0E" stroke-width="2.5"/>
    <circle cx="60" cy="60" r="28" fill="#2C1D0E"/>
    <circle cx="60" cy="60" r="22" fill="#F2C12E" opacity="0.5"/>
    <g stroke="#2C1D0E" stroke-width="2">
      <ellipse cx="60" cy="60" rx="10" ry="22" transform="rotate(0   60 60)"/>
      <ellipse cx="60" cy="60" rx="10" ry="22" transform="rotate(60  60 60)"/>
      <ellipse cx="60" cy="60" rx="10" ry="22" transform="rotate(120 60 60)"/>
      <ellipse cx="60" cy="60" rx="10" ry="22" transform="rotate(180 60 60)"/>
      <ellipse cx="60" cy="60" rx="10" ry="22" transform="rotate(240 60 60)"/>
      <ellipse cx="60" cy="60" rx="10" ry="22" transform="rotate(300 60 60)"/>
    </g>
  </g>
  <!-- Small sunflower -->
  <g transform="translate(980, 280) scale(0.6)">
    <circle cx="60" cy="60" r="50" fill="#F2C12E" stroke="#2C1D0E" stroke-width="3"/>
    <circle cx="60" cy="60" r="25" fill="#2C1D0E"/>
    <g stroke="#2C1D0E" stroke-width="2">
      <ellipse cx="60" cy="60" rx="9" ry="20" transform="rotate(0   60 60)"/>
      <ellipse cx="60" cy="60" rx="9" ry="20" transform="rotate(45  60 60)"/>
      <ellipse cx="60" cy="60" rx="9" ry="20" transform="rotate(90  60 60)"/>
      <ellipse cx="60" cy="60" rx="9" ry="20" transform="rotate(135 60 60)"/>
      <ellipse cx="60" cy="60" rx="9" ry="20" transform="rotate(180 60 60)"/>
      <ellipse cx="60" cy="60" rx="9" ry="20" transform="rotate(225 60 60)"/>
      <ellipse cx="60" cy="60" rx="9" ry="20" transform="rotate(270 60 60)"/>
      <ellipse cx="60" cy="60" rx="9" ry="20" transform="rotate(315 60 60)"/>
    </g>
  </g>
  <!-- Wildflowers -->
  <circle cx="100" cy="150" r="12" fill="#7B5EA7" stroke="#2C1D0E" stroke-width="1.5"/>
  <circle cx="130" cy="180" r="10" fill="#4A90C4" stroke="#2C1D0E" stroke-width="1.5"/>
  <circle cx="80" cy="200" r="8" fill="#A8D5AE" stroke="#2C1D0E" stroke-width="1.5"/>
  <!-- Headline -->
  <text x="80" y="300" font-family="Georgia, serif" font-weight="700" font-size="72" fill="#2C1D0E" letter-spacing="0.5">Stories Worth</text>
  <text x="80" y="395" font-family="Georgia, serif" font-weight="700" font-size="72" fill="#2C1D0E" letter-spacing="0.5">Gathering For.</text>
  <!-- Tagline -->
  <text x="80" y="470" font-family="Georgia, serif" font-size="28" fill="#7B5EA7" letter-spacing="0.3">Pull up a chair. The show's starting.</text>
  <!-- Phlix wordmark -->
  <text x="80" y="560" font-family="Georgia, serif" font-weight="700" font-size="24" fill="#4E7C59">Phlix</text>
</svg>
