<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 120" fill="none">
  <!-- Sunny — Anthropomorphic sunflower with straw hat -->
  <!-- Stem -->
  <path d="M50 65 Q45 85 48 110 Q52 110 55 85 Q58 65 50 65Z" fill="#4E7C59" stroke="#2C1D0E" stroke-width="2"/>
  <!-- Leaf left -->
  <path d="M48 85 Q38 80 35 88 Q38 93 48 88Z" fill="#4E7C59" stroke="#2C1D0E" stroke-width="1.5"/>
  <!-- Leaf right -->
  <path d="M52 80 Q62 76 66 83 Q62 88 52 84Z" fill="#4E7C59" stroke="#2C1D0E" stroke-width="1.5"/>
  <!-- Petals -->
  <g fill="#F2C12E" stroke="#2C1D0E" stroke-width="1.5">
    <ellipse cx="50" cy="22" rx="7" ry="14" transform="rotate(0   50 38)"/>
    <ellipse cx="50" cy="22" rx="7" ry="14" transform="rotate(45  50 38)"/>
    <ellipse cx="50" cy="22" rx="7" ry="14" transform="rotate(90  50 38)"/>
    <ellipse cx="50" cy="22" rx="7" ry="14" transform="rotate(135 50 38)"/>
    <ellipse cx="50" cy="22" rx="7" ry="14" transform="rotate(180 50 38)"/>
    <ellipse cx="50" cy="22" rx="7" ry="14" transform="rotate(225 50 38)"/>
    <ellipse cx="50" cy="22" rx="7" ry="14" transform="rotate(270 50 38)"/>
    <ellipse cx="50" cy="22" rx="7" ry="14" transform="rotate(315 50 38)"/>
  </g>
  <!-- Face circle -->
  <circle cx="50" cy="38" r="18" fill="#F2C12E" stroke="#2C1D0E" stroke-width="2"/>
  <!-- Eyes -->
  <circle cx="44" cy="36" r="2.5" fill="#2C1D0E"/>
  <circle cx="56" cy="36" r="2.5" fill="#2C1D0E"/>
  <!-- Cheeks -->
  <circle cx="40" cy="41" r="3" fill="#B83A3A" opacity="0.35"/>
  <circle cx="60" cy="41" r="3" fill="#B83A3A" opacity="0.35"/>
  <!-- Smile -->
  <path d="M44 42 Q50 48 56 42" stroke="#2C1D0E" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  <!-- Straw hat brim -->
  <ellipse cx="50" cy="22" rx="28" ry="7" fill="#EDE3C5" stroke="#2C1D0E" stroke-width="2"/>
  <!-- Hat crown -->
  <rect x="36" y="10" width="28" height="13" rx="4" fill="#EDE3C5" stroke="#2C1D0E" stroke-width="2"/>
  <!-- Hat band -->
  <rect x="36" y="17" width="28" height="4" fill="#7B5EA7"/>
  <!-- Wildflower basket (left hand) -->
  <path d="M22 72 Q18 68 20 62 Q25 58 30 64 Q32 68 28 72Z" fill="#4E7C59" stroke="#2C1D0E" stroke-width="1.5"/>
  <!-- Flowers in basket -->
  <circle cx="22" cy="60" r="3" fill="#7B5EA7" stroke="#2C1D0E" stroke-width="1"/>
  <circle cx="27" cy="62" r="2.5" fill="#4A90C4" stroke="#2C1D0E" stroke-width="1"/>
  <circle cx="25" cy="58" r="2" fill="#F2C12E" stroke="#2C1D0E" stroke-width="1"/>
</svg>
