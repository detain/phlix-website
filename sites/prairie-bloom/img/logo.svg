<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 64" role="img" aria-label="Prairie Bloom logo">
  <title>Prairie Bloom</title>
  <desc>Sunflower folk-art logo for the Prairie Bloom brand kit</desc>

  <!-- Sunflower icon -->
  <g transform="translate(6, 6)">
    <!-- Petals -->
    <ellipse cx="0" cy="-20" rx="6" ry="12" fill="#F2C12E" transform="rotate(0)"/>
    <ellipse cx="0" cy="-20" rx="6" ry="12" fill="#F2C12E" transform="rotate(30)"/>
    <ellipse cx="0" cy="-20" rx="6" ry="12" fill="#F2C12E" transform="rotate(60)"/>
    <ellipse cx="0" cy="-20" rx="6" ry="12" fill="#F2C12E" transform="rotate(90)"/>
    <ellipse cx="0" cy="-20" rx="6" ry="12" fill="#F2C12E" transform="rotate(120)"/>
    <ellipse cx="0" cy="-20" rx="6" ry="12" fill="#F2C12E" transform="rotate(150)"/>
    <ellipse cx="0" cy="-20" rx="6" ry="12" fill="#F2C12E" transform="rotate(180)"/>
    <ellipse cx="0" cy="-20" rx="6" ry="12" fill="#F2C12E" transform="rotate(210)"/>
    <ellipse cx="0" cy="-20" rx="6" ry="12" fill="#F2C12E" transform="rotate(240)"/>
    <ellipse cx="0" cy="-20" rx="6" ry="12" fill="#F2C12E" transform="rotate(270)"/>
    <ellipse cx="0" cy="-20" rx="6" ry="12" fill="#F2C12E" transform="rotate(300)"/>
    <ellipse cx="0" cy="-20" rx="6" ry="12" fill="#F2C12E" transform="rotate(330)"/>
    <!-- Center disk -->
    <circle cx="0" cy="0" r="10" fill="#2C1D0E"/>
    <circle cx="-3" cy="-3" r="1.5" fill="#4E7C59"/>
    <circle cx="3" cy="-2" r="1.5" fill="#4E7C59"/>
    <circle cx="-2" cy="4" r="1.5" fill="#4E7C59"/>
    <circle cx="4" cy="3" r="1.5" fill="#4E7C59"/>
  </g>

  <!-- Wordmark -->
  <text x="54" y="40"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="24"
    font-weight="bold"
    fill="#2C1D0E"
    letter-spacing="0.01em">Prairie Bloom</text>
</svg>
