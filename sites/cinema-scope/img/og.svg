<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0A0F"/>
      <stop offset="50%" stop-color="#1A1A2E"/>
      <stop offset="100%" stop-color="#0A0A0F"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C9A227"/>
      <stop offset="50%" stop-color="#E8C547"/>
      <stop offset="100%" stop-color="#C9A227"/>
    </linearGradient>
    <radialGradient id="flare" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="rgba(201,162,39,0.15)"/>
      <stop offset="100%" stop-color="rgba(201,162,39,0)"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Lens flare glow -->
  <ellipse cx="600" cy="200" rx="600" ry="300" fill="url(#flare)"/>

  <!-- Letterbox bars -->
  <rect x="0" y="0" width="1200" height="50" fill="#1A1A2E"/>
  <rect x="0" y="580" width="1200" height="50" fill="#1A1A2E"/>

  <!-- Film reel aperture mark -->
  <g transform="translate(540, 220)">
    <circle cx="60" cy="60" r="55" stroke="url(#gold)" stroke-width="4" fill="none"/>
    <circle cx="60" cy="60" r="35" stroke="url(#gold)" stroke-width="3" fill="none"/>
    <circle cx="60" cy="60" r="12" fill="url(#gold)"/>
    <!-- Spokes -->
    <line x1="60" y1="5" x2="60" y2="25" stroke="url(#gold)" stroke-width="4"/>
    <line x1="60" y1="95" x2="60" y2="115" stroke="url(#gold)" stroke-width="4"/>
    <line x1="5" y1="60" x2="25" y2="60" stroke="url(#gold)" stroke-width="4"/>
    <line x1="95" y1="60" x2="115" y2="60" stroke="url(#gold)" stroke-width="4"/>
    <!-- Diagonals -->
    <line x1="21" y1="21" x2="35" y2="35" stroke="url(#gold)" stroke-width="3"/>
    <line x1="99" y1="21" x2="85" y2="35" stroke="url(#gold)" stroke-width="3"/>
    <line x1="21" y1="99" x2="35" y2="85" stroke="url(#gold)" stroke-width="3"/>
    <line x1="99" y1="99" x2="85" y2="85" stroke="url(#gold)" stroke-width="3"/>
  </g>

  <!-- Wordmark -->
  <text x="600" y="380" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="72" font-weight="700" letter-spacing="24" fill="#F5F5F5">PHLIX</text>

  <!-- Tagline -->
  <text x="600" y="440" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" letter-spacing="6" fill="rgba(245,245,245,0.8)" text-transform="uppercase">CINEMA SCOPE</text>

  <!-- Hero text -->
  <text x="600" y="510" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="28" font-weight="400" fill="#C9A227">Your media. Your library. Your Phlix.</text>

  <!-- Gold line accent -->
  <line x1="400" y1="550" x2="800" y2="550" stroke="url(#gold)" stroke-width="2"/>
</svg>
