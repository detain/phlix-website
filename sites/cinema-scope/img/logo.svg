<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" fill="none">
  <!-- Film reel aperture design -->
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C9A227"/>
      <stop offset="50%" stop-color="#E8C547"/>
      <stop offset="100%" stop-color="#C9A227"/>
    </linearGradient>
    <linearGradient id="gold-dark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#C9A227"/>
      <stop offset="100%" stop-color="#9A7B1C"/>
    </linearGradient>
  </defs>

  <!-- Aperture / film reel icon -->
  <g transform="translate(8, 5)">
    <!-- Outer circle -->
    <circle cx="25" cy="25" r="22" stroke="url(#gold)" stroke-width="2" fill="none"/>
    <!-- Inner circle -->
    <circle cx="25" cy="25" r="14" stroke="url(#gold)" stroke-width="1.5" fill="none"/>
    <!-- Center dot -->
    <circle cx="25" cy="25" r="4" fill="url(#gold)"/>
    <!-- Reel spokes -->
    <line x1="25" y1="3" x2="25" y2="11" stroke="url(#gold)" stroke-width="2"/>
    <line x1="25" y1="39" x2="25" y2="47" stroke="url(#gold)" stroke-width="2"/>
    <line x1="3" y1="25" x2="11" y2="25" stroke="url(#gold)" stroke-width="2"/>
    <line x1="39" y1="25" x2="47" y2="25" stroke="url(#gold)" stroke-width="2"/>
    <!-- Diagonal spokes -->
    <line x1="9.4" y1="9.4" x2="15" y2="15" stroke="url(#gold)" stroke-width="1.5"/>
    <line x1="40.6" y1="9.4" x2="35" y2="15" stroke="url(#gold)" stroke-width="1.5"/>
    <line x1="9.4" y1="40.6" x2="15" y2="35" stroke="url(#gold)" stroke-width="1.5"/>
    <line x1="40.6" y1="40.6" x2="35" y2="35" stroke="url(#gold)" stroke-width="1.5"/>
  </g>

  <!-- Wordmark -->
  <text x="75" y="40" font-family="Georgia, 'Times New Roman', serif" font-size="32" font-weight="700" letter-spacing="8" fill="#F5F5F5">PHLIX</text>
</svg>
