<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Background: Cotton Candy Sky gradient -->
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F9A8D4"/>
      <stop offset="50%" stop-color="#C4B5FD"/>
      <stop offset="100%" stop-color="#BAE6FD"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.5)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#skyGrad)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <!-- Decorative cloud puffs -->
  <ellipse cx="100" cy="580" rx="120" ry="70" fill="rgba(255,255,255,0.3)"/>
  <ellipse cx="150" cy="560" rx="90" ry="60" fill="rgba(255,255,255,0.25)"/>
  <ellipse cx="1100" cy="580" rx="130" ry="75" fill="rgba(255,255,255,0.3)"/>
  <ellipse cx="1050" cy="555" rx="100" ry="65" fill="rgba(255,255,255,0.25)"/>
  <!-- Floating bubbles -->
  <circle cx="900" cy="150" r="18" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="2"/>
  <circle cx="950" cy="200" r="12" fill="rgba(167,243,208,0.4)"/>
  <circle cx="280" cy="130" r="14" fill="rgba(167,243,208,0.35)"/>
  <circle cx="320" cy="180" r="8" fill="rgba(255,255,255,0.4)"/>
  <circle cx="1100" cy="350" r="16" fill="rgba(196,181,253,0.4)"/>
  <circle cx="100" cy="350" r="22" fill="rgba(249,168,212,0.35)"/>
  <!-- Sparkle stars -->
  <path d="M1050 120l3 8 8 3-8 3-3 8-3-8-8-3 8-3 3-8z" fill="rgba(255,255,255,0.7)"/>
  <path d="M180 100l2 6 6 2-6 2-2 6-2-6-6-2 6-2 2-6z" fill="rgba(255,255,255,0.6)"/>
  <!-- Logo -->
  <text x="600" y="260" text-anchor="middle" font-family="'Comfortaa', 'Quicksand', sans-serif" font-size="72" font-weight="700" fill="#4B3F6B" letter-spacing="0.02em">Phlix</text>
  <!-- Tagline -->
  <text x="600" y="340" text-anchor="middle" font-family="'Baloo 2', 'Nunito', sans-serif" font-size="32" font-weight="700" fill="#4B3F6B" opacity="0.85" letter-spacing="0.01em">Where every story floats on clouds.</text>
  <!-- Sub text -->
  <text x="600" y="400" text-anchor="middle" font-family="'Nunito', sans-serif" font-size="22" fill="#4B3F6B" opacity="0.65">Self-hosted media server — free &amp; open source</text>
</svg>