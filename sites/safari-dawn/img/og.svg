<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#E8B84A"/>
      <stop offset="40%" style="stop-color:#D4A017"/>
      <stop offset="100%" style="stop-color:#5C2E0A"/>
    </linearGradient>
    <linearGradient id="sunGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFF8E7;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#D4A017;stop-opacity:0"/>
    </linearGradient>
  </defs>

  <!-- Background sky gradient -->
  <rect width="1200" height="630" fill="url(#sky)"/>

  <!-- Sun glow at horizon -->
  <ellipse cx="600" cy="400" rx="400" ry="150" fill="#D4A017" opacity="0.3"/>
  <ellipse cx="600" cy="420" rx="300" ry="100" fill="#FF6B35" opacity="0.2"/>

  <!-- Ground/grass silhouette -->
  <rect x="0" y="480" width="1200" height="150" fill="#2E5A1C" opacity="0.4"/>
  <path d="M0 500 Q100 490 200 500 T400 500 T600 500 T800 500 T1000 500 T1200 500 L1200 630 L0 630 Z" fill="#1A3A10" opacity="0.3"/>

  <!-- Acacia tree silhouette -->
  <g fill="#1A3A10" opacity="0.7">
    <!-- Trunk -->
    <path d="M950 520 L950 480 Q960 475 970 480 L970 520 Z"/>
    <!-- Canopy -->
    <ellipse cx="960" cy="460" rx="80" ry="20"/>
    <ellipse cx="940" cy="455" rx="40" ry="12"/>
    <ellipse cx="980" cy="455" rx="40" ry="12"/>
  </g>

  <!-- Small acacia left -->
  <g fill="#1A3A10" opacity="0.5">
    <path d="M150 530 L150 510 Q155 507 160 510 L160 530 Z"/>
    <ellipse cx="155" cy="502" rx="35" ry="10"/>
  </g>

  <!-- Central text -->
  <text x="600" y="280" font-family="Georgia, serif" font-size="72" font-weight="700" fill="#1A1A1A" text-anchor="middle" letter-spacing="-1">Your media.</text>
  <text x="600" y="360" font-family="Georgia, serif" font-size="72" font-weight="700" fill="#1A1A1A" text-anchor="middle" letter-spacing="-1">Your library.</text>
  <text x="600" y="440" font-family="Georgia, serif" font-size="72" font-weight="700" fill="#8B4513" text-anchor="middle" letter-spacing="-1">Your Phlix.</text>

  <!-- Sun/sphere mark bottom right -->
  <g transform="translate(1050, 550)">
    <circle cx="0" cy="0" r="45" fill="#D4A017"/>
    <circle cx="-8" cy="-8" r="10" fill="#1A1A1A" opacity="0.15"/>
    <circle cx="15" cy="-20" r="6" fill="#FF6B35" opacity="0.5"/>
  </g>
</svg>
