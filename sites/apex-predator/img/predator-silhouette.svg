<svg viewBox="0 0 400 200" xmlns="http://www.w3.org/2000/svg" fill="currentColor">
  <defs>
    <linearGradient id="predatorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#C70039;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#900C3F;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#000000;stop-opacity:1" />
    </linearGradient>
    <filter id="predatorGlow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Wolf/Canid predator silhouette - prowling pose -->
  <g class="predator-silhouette" filter="url(#predatorGlow)">
    <!-- Body -->
    <path d="M50 140
             Q60 120, 90 115
             L130 110
             Q150 105, 170 108
             L200 115
             Q220 120, 240 115
             L280 105
             Q300 100, 320 95
             L350 80
             Q360 75, 365 70
             L360 65
             Q355 60, 350 65
             L340 75
             Q320 90, 300 95
             L270 100
             L240 105
             L210 100
             Q190 98, 170 95
             L140 90
             Q120 88, 100 90
             L70 95
             Q55 98, 45 105
             L35 115
             Q30 125, 35 135
             L45 140
             Z" fill="url(#predatorGrad)"/>

    <!-- Head -->
    <path d="M350 80
             Q360 70, 370 65
             L380 55
             Q385 50, 390 52
             L395 58
             Q398 62, 395 68
             L388 75
             Q380 82, 372 82
             L365 78
             Q358 76, 350 80
             Z" fill="#C70039"/>

    <!-- Snout -->
    <path d="M390 52
             L400 48
             Q402 50, 400 55
             L395 58
             L390 52
             Z" fill="#C70039"/>

    <!-- Eye (glowing) -->
    <circle cx="375" cy="65" r="3" fill="#C70039" class="predator-eye"/>

    <!-- Ears -->
    <path d="M355 70 Q350 55, 345 50 Q348 45, 355 48 Q362 52, 360 70" fill="#900C3F"/>
    <path d="M365 72 Q362 60, 358 55 Q362 52, 368 55 Q372 60, 368 72" fill="#900C3F"/>

    <!-- Front legs -->
    <path d="M95 115
             Q90 130, 85 150
             L80 170
             Q78 178, 82 180
             L92 180
             Q96 178, 95 170
             L98 155
             Q100 140, 105 125
             Z" fill="#900C3F"/>

    <path d="M120 112
             Q118 128, 115 148
             L112 168
             Q110 178, 115 180
             L125 180
             Q130 178, 128 168
             L130 150
             Q132 135, 130 118
             Z" fill="#900C3F"/>

    <!-- Back legs -->
    <path d="M260 100
             Q255 120, 250 145
             L245 165
             Q242 178, 248 182
             L258 182
             Q264 178, 262 165
             L265 145
             Q268 125, 270 105
             Z" fill="#900C3F"/>

    <path d="M295 95
             Q290 115, 285 140
             L280 162
             Q277 178, 283 182
             L293 182
             Q300 178, 297 162
             L300 140
             Q305 120, 308 98
             Z" fill="#900C3F"/>

    <!-- Tail -->
    <path d="M50 140
             Q35 135, 20 125
             Q10 118, 5 110
             Q2 105, 8 105
             Q15 108, 25 115
             Q35 125, 48 135
             Z" fill="#900C3F"/>

    <!-- Claws (front) -->
    <g fill="#C70039" class="claws">
      <path d="M80 178 L75 188 L80 185 L85 190 L88 182 Z"/>
      <path d="M92 180 L88 192 L94 188 L100 193 L102 184 Z"/>
    </g>

    <!-- Claws (back) -->
    <g fill="#C70039" class="claws">
      <path d="M245 180 L242 190 L248 186 L254 191 L255 182 Z"/>
      <path d="M262 180 L258 191 L264 187 L270 192 L272 183 Z"/>
    </g>
  </g>

  <!-- Claw marks decorative element -->
  <g class="claw-marks" opacity="0.4">
    <line x1="30" y1="180" x2="60" y2="195" stroke="#C70039" stroke-width="2" stroke-linecap="round"/>
    <line x1="35" y1="185" x2="65" y2="198" stroke="#900C3F" stroke-width="2" stroke-linecap="round"/>
    <line x1="40" y1="190" x2="70" y2="201" stroke="#C70039" stroke-width="2" stroke-linecap="round"/>
  </g>

  <style>
    .predator-eye {
      animation: eyeGlow 4s ease-in-out infinite;
    }
    @keyframes eyeGlow {
      0%, 100% { filter: drop-shadow(0 0 2px #C70039); }
      50% { filter: drop-shadow(0 0 8px #C70039) drop-shadow(0 0 15px #C70039); }
    }
    @media (prefers-reduced-motion: reduce) {
      .predator-eye { animation: none; }
    }
  </style>
</svg>
