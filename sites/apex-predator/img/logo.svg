<!-- Phlix Logo — Apex Predator brand kit -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 48" fill="none">
  <!-- Claw mark accent left -->
  <g stroke="#C70039" stroke-width="2" stroke-linecap="round" opacity="0.7">
    <line x1="6" y1="8" x2="14" y2="8"/>
    <line x1="6" y1="8" x2="6" y2="20"/>
    <line x1="18" y1="8" x2="26" y2="8"/>
    <line x1="18" y1="8" x2="18" y2="18"/>
    <line x1="30" y1="8" x2="38" y2="8"/>
    <line x1="30" y1="8" x2="30" y2="14"/>
  </g>

  <!-- Wordmark: PHLIX -->
  <text x="50" y="36"
        font-family="'Bebas Neue', 'Oswald', 'Impact', sans-serif"
        font-size="38"
        font-weight="400"
        letter-spacing="0.06em"
        fill="#F0E6DC"
        text-anchor="start">PHLIX</text>

  <!-- Crimson underline accent -->
  <rect x="50" y="42" width="80" height="2" fill="#C70039" opacity="0.8"/>
</svg>
