<!-- Phlix Favicon — Apex Predator brand kit -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Background -->
  <rect width="32" height="32" fill="#000000"/>

  <!-- Claw mark — three diagonal scratches -->
  <g stroke="#C70039" stroke-width="2.5" stroke-linecap="round">
    <line x1="6" y1="8" x2="12" y2="8"/>
    <line x1="6" y1="8" x2="6" y2="16"/>
    <line x1="14" y1="10" x2="20" y2="10"/>
    <line x1="14" y1="10" x2="14" y2="20"/>
    <line x1="22" y1="12" x2="28" y2="12"/>
    <line x1="22" y1="12" x2="22" y2="18"/>
  </g>
</svg>
