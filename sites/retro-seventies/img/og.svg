<!-- img/og.svg — Retro Seventies Open Graph / social share image
     1200x630 — deep mahogany background with vinyl-groove
     concentric circles, the Phlix wordmark, and the tagline
     "Rewind. Replay. Relive." in a warm editorial style.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Phlix social share card">
  <title>Phlix — Rewind. Replay. Relive.</title>
  <desc>Retro Seventies social share card for Phlix media server</desc>

  <!-- Deep mahogany background -->
  <rect width="1200" height="630" fill="#0F0900"/>

  <!-- Warm ambient radial glow -->
  <radialGradient id="warmGlow" cx="50%" cy="50%" r="60%">
    <stop offset="0%"   stop-color="#D4570D" stop-opacity="0.18"/>
    <stop offset="60%"  stop-color="#C9A22B" stop-opacity="0.06"/>
    <stop offset="100%" stop-color="#0F0900" stop-opacity="0"/>
  </radialGradient>
  <rect width="1200" height="630" fill="url(#warmGlow)"/>

  <!-- Large vinyl-groove concentric circles — decorative background -->
  <g transform="translate(900, 315)" opacity="0.12">
    <circle r="420" fill="none" stroke="#D4570D" stroke-width="2"/>
    <circle r="370" fill="none" stroke="#D4570D" stroke-width="1.5"/>
    <circle r="320" fill="none" stroke="#C9A22B" stroke-width="1.5"/>
    <circle r="270" fill="none" stroke="#D4570D" stroke-width="1"/>
    <circle r="220" fill="none" stroke="#C9A22B" stroke-width="1"/>
    <circle r="170" fill="none" stroke="#D4570D" stroke-width="0.8"/>
    <circle r="120" fill="none" stroke="#C9A22B" stroke-width="0.8"/>
    <circle r="70"  fill="none" stroke="#D4570D" stroke-width="0.6"/>
    <circle r="35"  fill="#D4570D" opacity="0.5"/>
  </g>

  <!-- Wood-grain texture lines (subtle) -->
  <g opacity="0.05">
    <line x1="0" y1="50"  x2="1200" y2="50"  stroke="#7A6A52" stroke-width="1"/>
    <line x1="0" y1="150" x2="1200" y2="150" stroke="#7A6A52" stroke-width="1"/>
    <line x1="0" y1="250" x2="1200" y2="250" stroke="#7A6A52" stroke-width="1"/>
    <line x1="0" y1="350" x2="1200" y2="350" stroke="#7A6A52" stroke-width="1"/>
    <line x1="0" y1="450" x2="1200" y2="450" stroke="#7A6A52" stroke-width="1"/>
    <line x1="0" y1="550" x2="1200" y2="550" stroke="#7A6A52" stroke-width="1"/>
  </g>

  <!-- Decorative orange gradient line top -->
  <line x1="0" y1="0" x2="600" y2="0" stroke="#D4570D" stroke-width="3" opacity="0.7"/>
  <line x1="600" y1="0" x2="1200" y2="0" stroke="#C9A22B" stroke-width="3" opacity="0.7"/>

  <!-- Wordmark "Phlix" -->
  <text
    x="100" y="280"
    font-family="'Playfair Display', Georgia, serif"
    font-size="96"
    font-weight="900"
    fill="#F5EDD8"
    letter-spacing="-2"
    filter="url(#ogShadow)"
  >Phlix</text>

  <!-- Tagline primary -->
  <text
    x="100" y="340"
    font-family="'Fredoka One', 'Trebuchet MS', sans-serif"
    font-size="36"
    fill="#C9A22B"
    letter-spacing="2"
  >Rewind. Replay. Relive.</text>

  <!-- Horizontal rule -->
  <line x1="100" y1="370" x2="400" y2="370" stroke="#D4570D" stroke-width="2" opacity="0.8"/>

  <!-- Sub-descriptor -->
  <text
    x="100" y="420"
    font-family="'Lato', 'Helvetica Neue', Arial, sans-serif"
    font-size="22"
    fill="rgba(245,237,216,0.7)"
    letter-spacing="0.5"
  >Self-hosted PHP media server</text>

  <!-- Client badges -->
  <g transform="translate(100, 460)">
    <rect width="80" height="28" rx="14" fill="rgba(139,155,58,0.2)" stroke="#8B9B3A" stroke-width="1.5"/>
    <text x="40" y="19" font-family="sans-serif" font-size="12" font-weight="700" fill="#8B9B3A" text-anchor="middle" letter-spacing="1">Roku</text>

    <rect x="90" width="120" height="28" rx="14" fill="rgba(139,155,58,0.2)" stroke="#8B9B3A" stroke-width="1.5"/>
    <text x="150" y="19" font-family="sans-serif" font-size="12" font-weight="700" fill="#8B9B3A" text-anchor="middle" letter-spacing="1">Samsung Tizen</text>

    <rect x="220" width="100" height="28" rx="14" fill="rgba(139,155,58,0.2)" stroke="#8B9B3A" stroke-width="1.5"/>
    <text x="270" y="19" font-family="sans-serif" font-size="12" font-weight="700" fill="#8B9B3A" text-anchor="middle" letter-spacing="1">Windows</text>

    <rect x="330" width="90" height="28" rx="14" fill="rgba(212,87,13,0.2)" stroke="#D4570D" stroke-width="1.5"/>
    <text x="375" y="19" font-family="sans-serif" font-size="12" font-weight="700" fill="#D4570D" text-anchor="middle" letter-spacing="1">Mobile</text>
  </g>

  <!-- Warm glow filter for text -->
  <defs>
    <filter id="ogShadow" x="-5%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#D4570D" flood-opacity="0.4"/>
    </filter>
  </defs>
</svg>
