<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <!-- Background -->
  <rect width="1200" height="630" fill="#0F0900"/>

  <!-- Vinyl grooves radiating from center-left -->
  <circle cx="400" cy="315" r="280" stroke="#3A2E1A" stroke-width="2" fill="none" opacity="0.4"/>
  <circle cx="400" cy="315" r="240" stroke="#3A2E1A" stroke-width="1.5" fill="none" opacity="0.3"/>
  <circle cx="400" cy="315" r="200" stroke="#3A2E1A" stroke-width="1.5" fill="none" opacity="0.25"/>
  <circle cx="400" cy="315" r="160" stroke="#3A2E1A" stroke-width="1" fill="none" opacity="0.2"/>
  <circle cx="400" cy="315" r="120" stroke="#3A2E1A" stroke-width="1" fill="none" opacity="0.15"/>

  <!-- Brand name -->
  <text x="760" y="260" font-family="Georgia, serif" font-size="72" font-weight="700" fill="#F5EDD8" text-anchor="middle">Phlix</text>
  <text x="760" y="320" font-family="Georgia, serif" font-size="36" font-weight="400" fill="#C9A22B" text-anchor="middle" letter-spacing="0.1em">RETRO SEVENTIES</text>
  <text x="760" y="380" font-family="Georgia, serif" font-size="28" font-weight="400" fill="#F5EDD8" text-anchor="middle" opacity="0.8">Rewind. Replay. Relive.</text>

  <!-- Groovy tagline -->
  <text x="760" y="450" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#D4570D" text-anchor="middle">Drop the needle. Enjoy the groove.</text>

  <!-- Decorative vinyl record -->
  <circle cx="400" cy="315" r="50" fill="#D4570D" opacity="0.15"/>
  <circle cx="400" cy="315" r="40" stroke="#D4570D" stroke-width="3" fill="none"/>
  <circle cx="400" cy="315" r="20" stroke="#C9A22B" stroke-width="2" fill="none"/>
  <circle cx="400" cy="315" r="5" fill="#D4570D"/>

  <!-- Warm gradient overlay at bottom -->
  <rect x="0" y="500" width="1200" height="130" fill="url(#warmGrad)"/>

  <defs>
    <linearGradient id="warmGrad" x1="0" y1="0" x2="1200" y2="0">
      <stop offset="0%" stop-color="#D4570D" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#D4570D" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#D4570D" stop-opacity="0.1"/>
    </linearGradient>
  </defs>
</svg>
