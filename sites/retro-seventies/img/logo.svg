<!-- img/logo.svg — Retro Seventies wordmark
     Playfair Display bold "Phlix" on deep mahogany ground
     with harvest gold text-shadow and a subtle vinyl-groove
     concentric circle motif integrated into the design.
     Allowed symbols: vinyl record concentric circles (yes),
     lava lamp silhouette (yes). Forbidden: cold geometry, neon.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" role="img" aria-label="Phlix logo">
  <title>Phlix</title>
  <desc>Retro Seventies Phlix wordmark with vinyl-groove concentric circles</desc>

  <!-- Deep mahogany background -->
  <rect width="240" height="60" rx="12" fill="#0F0900"/>

  <!-- Vinyl groove circles — decorative left accent -->
  <g opacity="0.25" transform="translate(12, 10)">
    <circle cx="20" cy="20" r="18" stroke="#D4570D" stroke-width="1.5" fill="none"/>
    <circle cx="20" cy="20" r="13" stroke="#D4570D" stroke-width="1" fill="none"/>
    <circle cx="20" cy="20" r="8"  stroke="#C9A22B" stroke-width="0.8" fill="none"/>
    <circle cx="20" cy="20" r="4"  fill="#D4570D"/>
  </g>

  <!-- Wordmark: "Phlix" in Playfair Display style bold -->
  <!-- Simulated with SVG text — in production, use the actual web font -->
  <text
    x="58" y="41"
    font-family="'Playfair Display', Georgia, serif"
    font-size="28"
    font-weight="700"
    fill="#F5EDD8"
    letter-spacing="-0.5"
    filter="url(#warmShadow)"
  >Phlix</text>

  <!-- Harvest gold sunburst tick marks right of wordmark -->
  <g transform="translate(200, 30)" opacity="0.6">
    <line x1="0" y1="-14" x2="0" y2="-10" stroke="#C9A22B" stroke-width="2" stroke-linecap="round"/>
    <line x1="0" y1="10"  x2="0" y2="14"  stroke="#C9A22B" stroke-width="2" stroke-linecap="round"/>
    <line x1="-14" y1="0" x2="-10" y2="0" stroke="#C9A22B" stroke-width="2" stroke-linecap="round"/>
    <line x1="10" y1="0" x2="14" y2="0" stroke="#C9A22B" stroke-width="2" stroke-linecap="round"/>
    <line x1="-10" y1="-10" x2="-7" y2="-7" stroke="#D4570D" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="7" y1="7"   x2="10" y2="10" stroke="#D4570D" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="-10" y1="10" x2="-7" y2="7"  stroke="#D4570D" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="7" y1="-7"  x2="10" y2="-10" stroke="#D4570D" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Warm glow filter -->
  <defs>
    <filter id="warmShadow" x="-10%" y="-20%" width="130%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#D4570D" flood-opacity="0.35"/>
    </filter>
  </defs>
</svg>
