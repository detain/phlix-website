<!-- img/favicon.svg — Retro Seventies favicon
     Square mark in burnt orange with a stylized vinyl
     record groove at center.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Phlix favicon">
  <title>Phlix favicon</title>
  <!-- Deep mahogany square -->
  <rect width="32" height="32" rx="6" fill="#0F0900"/>
  <!-- Burnt orange rounded square -->
  <rect x="4" y="4" width="24" height="24" rx="5" fill="#D4570D"/>
  <!-- Vinyl groove concentric circles -->
  <circle cx="16" cy="16" r="9"  fill="none" stroke="#F5EDD8" stroke-width="1" opacity="0.9"/>
  <circle cx="16" cy="16" r="6"  fill="none" stroke="#F5EDD8" stroke-width="0.8" opacity="0.7"/>
  <circle cx="16" cy="16" r="3"  fill="none" stroke="#F5EDD8" stroke-width="0.6" opacity="0.5"/>
  <!-- Center label -->
  <circle cx="16" cy="16" r="1.5" fill="#F5EDD8"/>
</svg>
