<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <rect width="1200" height="630" fill="#141418"/>
  <!-- Background waveform decoration -->
  <path d="M0 400 Q200 200, 400 350 T800 300 T1200 350" stroke="#00E676" stroke-width="2" fill="none" opacity="0.1"/>
  <!-- Radial glow -->
  <radialGradient id="glow" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#00E676" stop-opacity="0.15"/>
    <stop offset="100%" stop-color="#00E676" stop-opacity="0"/>
  </radialGradient>
  <ellipse cx="600" cy="315" rx="500" ry="300" fill="url(#glow)"/>
  <!-- Logo mark -->
  <path d="M500 290 Q520 260, 540 290 T580 290" stroke="#00E676" stroke-width="6" stroke-linecap="round" fill="none"/>
  <circle cx="580" cy="290" r="12" fill="#00E676"/>
  <!-- Wordmark -->
  <text x="600" y="370" text-anchor="middle" font-family="Rajdhani, sans-serif" font-weight="700" font-size="64" fill="#E8EAF0" letter-spacing="8">SOUNDWAVE STUDIO</text>
  <text x="600" y="420" text-anchor="middle" font-family="Share Tech Mono, monospace" font-weight="400" font-size="24" fill="#FFB300" letter-spacing="4">Every Session. Perfectly Captured.</text>
</svg>
