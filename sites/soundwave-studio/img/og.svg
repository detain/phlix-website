<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Phlix — Self-hosted media server">
  <title>Phlix — Self-hosted media server</title>
  <desc>Phlix self-hosted media server social share image — Soundwave Studio brand kit, dark studio aesthetic with waveform green accents</desc>

  <!-- Studio charcoal background -->
  <rect width="1200" height="630" fill="#141418"/>

  <!-- Ambient glow effects — radial gradients -->
  <ellipse cx="200" cy="315" rx="400" ry="300" fill="url(#glowLeft)" opacity="0.4"/>
  <ellipse cx="1000" cy="315" rx="350" ry="250" fill="url(#glowRight)" opacity="0.3"/>

  <!-- Subtle grid pattern — acoustic foam diamond texture at low opacity -->
  <defs>
    <pattern id="foamGrid" width="32" height="32" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="32" stroke="#2D2D3A" stroke-width="0.5" opacity="0.3"/>
    </pattern>
    <radialGradient id="glowLeft" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#00E676" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#00E676" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowRight" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#7C4DFF" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#7C4DFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#foamGrid)"/>

  <!-- Waveform decorative element — bottom -->
  <g transform="translate(0, 480)" opacity="0.25">
    <path d="M0 75 L80 75 L100 40 L140 110 L180 20 L220 100 L260 50 L300 90 L340 60 L380 80 L420 70 L460 75 L520 75 L560 75 L600 75 L640 75 L680 75 L720 75 L760 75 L800 75 L840 75 L880 75 L920 75 L960 75 L1000 75 L1040 75 L1080 75 L1120 75 L1160 75 L1200 75"
          fill="none" stroke="#00E676" stroke-width="2"/>
  </g>

  <!-- Center content -->
  <g transform="translate(600, 280)">

    <!-- Logo/waveform mark -->
    <g transform="translate(-180, -120)" opacity="0.9">
      <g fill="none" stroke="#00E676" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
        <path d="M0 40 L20 40 L25 20 L35 60 L45 5 L55 65 L65 25 L75 45 L85 35 L100 40 L140 40"/>
      </g>
    </g>

    <!-- Primary wordmark — Phlix -->
    <text x="0" y="-30" text-anchor="middle" font-family="'Rajdhani', 'Barlow Condensed', 'Arial Narrow', sans-serif" font-weight="700" font-size="72" fill="#E8EAF0" letter-spacing="0.08em" text-transform="uppercase">Phlix</text>

    <!-- Tagline primary -->
    <text x="0" y="40" text-anchor="middle" font-family="'Share Tech Mono', 'Courier New', monospace" font-size="22" fill="#00E676" letter-spacing="0.04em">Every session. Perfectly captured.</text>

    <!-- Brand kit identifier -->
    <text x="0" y="120" text-anchor="middle" font-family="'Rajdhani', 'Barlow Condensed', sans-serif" font-weight="600" font-size="16" fill="#4A5568" letter-spacing="0.15em" text-transform="uppercase">Soundwave Studio Brand Kit</text>

  </g>

  <!-- Bottom tagline -->
  <text x="600" y="580" text-anchor="middle" font-family="'Inter', 'Helvetica Neue', sans-serif" font-size="14" fill="#4A5568">Self-hosted media server — Phlix</text>

</svg>
