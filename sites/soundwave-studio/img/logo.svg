<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 48" role="img" aria-label="Soundwave Studio logo">
  <title>Soundwave Studio</title>
  <desc>Waveform Studio logo — oscilloscope waveform glyph with Soundwave Studio wordmark</desc>

  <!-- Waveform glyph — oscilloscope S-curve style -->
  <g fill="none" stroke="#00E676" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Oscilloscope waveform from left edge, sharp technical style -->
    <path d="M4 24 L10 24 L12 14 L16 34 L20 10 L24 38 L28 18 L32 30 L36 24 L44 24"/>
  </g>

  <!-- Wordmark — Soundwave Studio in Rajdhani-style condensed bold -->
  <text x="52" y="20" font-family="'Rajdhani', 'Barlow Condensed', 'Arial Narrow', sans-serif" font-weight="700" font-size="13" fill="#E8EAF0" letter-spacing="0.08em" text-transform="uppercase">Soundwave</text>
  <text x="52" y="36" font-family="'Rajdhani', 'Barlow Condensed', 'Arial Narrow', sans-serif" font-weight="600" font-size="10" fill="#00E676" letter-spacing="0.12em" text-transform="uppercase">Studio</text>

  <!-- VU needle indicator — small accent -->
  <circle cx="180" cy="24" r="6" fill="none" stroke="#2D2D3A" stroke-width="1"/>
  <line x1="180" y1="24" x2="183" y2="20" stroke="#00E676" stroke-width="1.5" stroke-linecap="round"/>
</svg>
