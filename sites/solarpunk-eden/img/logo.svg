<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 80" role="img" aria-label="Phlix — Solarpunk Eden brand mark">
  <title>Phlix logo — Solarpunk Eden</title>
  <desc>A botanical art nouveau oval frame containing the Playfair Display wordmark "Phlix" in Canopy Green on Morning Parchment, with vine leaf accents</desc>

  <!-- Art nouveau botanical oval frame -->
  <ellipse cx="40" cy="40" rx="38" ry="36" fill="none" stroke="#2D7A4F" stroke-width="2.5"/>
  <ellipse cx="40" cy="40" rx="30" ry="28" fill="none" stroke="#2D7A4F" stroke-width="1" stroke-dasharray="4 3"/>

  <!-- Vine stems weaving through the oval -->
  <path d="M8 40 Q20 25 40 20 Q60 15 72 28" fill="none" stroke="#2D7A4F" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M8 40 Q20 55 40 60 Q60 65 72 52" fill="none" stroke="#2D7A4F" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Leaf accents on vine stems -->
  <path d="M22 30 Q28 24 34 30 Q28 33 22 30Z" fill="#2D7A4F"/>
  <path d="M50 24 Q56 18 62 24 Q56 27 50 24Z" fill="#2D7A4F"/>
  <path d="M18 50 Q24 56 30 50 Q24 47 18 50Z" fill="#2D7A4F"/>
  <path d="M52 56 Q58 62 64 56 Q58 53 52 56Z" fill="#2D7A4F"/>

  <!-- Honeybee silhouette accent -->
  <g transform="translate(32, 38) scale(0.55)">
    <ellipse cx="0" cy="0" rx="6" ry="5" fill="#E8A020"/>
    <ellipse cx="-7" cy="-2" rx="6" ry="3" fill="none" stroke="#E8A020" stroke-width="1.5" transform="rotate(-30)"/>
    <ellipse cx="7" cy="-2" rx="6" ry="3" fill="none" stroke="#E8A020" stroke-width="1.5" transform="rotate(30)"/>
    <line x1="-4" y1="4" x2="-5" y2="8" stroke="#E8A020" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="4" y1="4" x2="5" y2="8" stroke="#E8A020" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="-2" y1="3" x2="-2" y2="7" stroke="#E8A020" stroke-width="1" stroke-linecap="round"/>
    <line x1="2" y1="3" x2="2" y2="7" stroke="#E8A020" stroke-width="1" stroke-linecap="round"/>
    <!-- Stripes -->
    <path d="M-3 -1 L3 -1 M-4 2 L4 2" stroke="#1A2E1E" stroke-width="1.2" fill="none"/>
  </g>

  <!-- Wordmark: "Phlix" in Playfair Display style using SVG text -->
  <text
    x="88"
    y="54"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="38"
    font-weight="700"
    letter-spacing="-0.5"
    fill="#2D7A4F"
  >Phlix</text>

  <!-- Small leaf flourish on the "x" -->
  <path d="M188 44 Q195 36 202 42 Q196 48 188 44Z" fill="#2D7A4F"/>
  <path d="M190 50 Q196 44 202 50 Q196 54 190 50Z" fill="#E8A020" opacity="0.85"/>

  <!-- Tagline -->
  <text
    x="88"
    y="68"
    font-family="Georgia, serif"
    font-size="11"
    letter-spacing="2"
    fill="#8B6347"
    text-transform="uppercase"
  >Stream in the Sunshine.</text>
</svg>
