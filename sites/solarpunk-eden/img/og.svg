<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Phlix — Solarpunk Eden social share image">
  <title>Phlix — Stream in the Sunshine.</title>
  <desc>Solarpunk Eden branded social share card with botanical frame and Phlix wordmark on a lush green canopy gradient</desc>

  <!-- Background: Eden Canopy gradient -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D7A4F"/>
      <stop offset="60%" stop-color="#3d9a62"/>
      <stop offset="100%" stop-color="#4AADCF"/>
    </linearGradient>
    <radialGradient id="sun" cx="75%" cy="35%" r="45%">
      <stop offset="0%" stop-color="rgba(232,160,32,0.25)"/>
      <stop offset="100%" stop-color="rgba(232,160,32,0)"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#sun)"/>

  <!-- Art nouveau vine border top -->
  <path d="M0 48 Q150 20 300 48 T600 48 T900 48 T1200 48 V0 H0 Z" fill="#F4EFE0" opacity="0.95"/>
  <path d="M0 52 Q100 72 200 52 T400 52 T600 52 T800 52 T1000 52 T1200 52" stroke="#2D7A4F" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- Art nouveau vine border bottom -->
  <path d="M0 582 Q150 610 300 582 T600 582 T900 582 T1200 582 V630 H0 Z" fill="#F4EFE0" opacity="0.95"/>
  <path d="M0 578 Q100 558 200 578 T400 578 T600 578 T800 578 T1000 578 T1200 578" stroke="#2D7A4F" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- Leaf motif accents in corners -->
  <g fill="#E8A020" opacity="0.7">
    <path d="M80 52 Q92 36 104 52 Q92 60 80 52Z"/>
    <path d="M96 68 Q108 52 120 68 Q108 76 96 68Z" opacity="0.5"/>
    <path d="M1096 52 Q1108 36 1120 52 Q1108 60 1096 52Z"/>
    <path d="M1080 68 Q1092 52 1104 68 Q1092 76 1080 68Z" opacity="0.5"/>
    <path d="M80 578 Q92 562 104 578 Q92 586 80 578Z" opacity="0.5"/>
    <path d="M1096 578 Q1108 562 1120 578 Q1108 586 1096 578Z" opacity="0.5"/>
  </g>

  <!-- Center card -->
  <rect x="240" y="120" width="720" height="390" rx="32" fill="#F4EFE0" opacity="0.97"/>
  <rect x="244" y="124" width="712" height="382" rx="28" fill="none" stroke="#2A3D2E" stroke-width="2"/>

  <!-- Botanical oval inside card -->
  <ellipse cx="600" cy="200" rx="120" ry="70" fill="none" stroke="#2D7A4F" stroke-width="1.5" opacity="0.5"/>

  <!-- Logo wordmark -->
  <text x="600" y="185" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="64" font-weight="700" letter-spacing="-1" fill="#2D7A4F">Phlix</text>

  <!-- Tagline -->
  <text x="600" y="230" text-anchor="middle" font-family="Georgia, serif" font-size="20" letter-spacing="3" fill="#8B6347">STREAM IN THE SUNSHINE.</text>

  <!-- Tagline secondary -->
  <text x="600" y="290" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#1A2E1E" opacity="0.85">Where nature and stories bloom together.</text>

  <!-- Separator vine -->
  <path d="M380 310 Q490 295 600 310 Q710 325 820 310" stroke="#2D7A4F" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <circle cx="490" cy="303" r="4" fill="#E8A020"/>
  <circle cx="600" cy="310" r="4" fill="#E8A020"/>
  <circle cx="710" cy="303" r="4" fill="#E8A020"/>

  <!-- CTA hint -->
  <text x="600" y="370" text-anchor="middle" font-family="Georgia, serif" font-size="18" fill="#2D7A4F">Self-hosted PHP media server</text>
  <text x="600" y="400" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#8B6347">BSD-3-Clause · Roku · Samsung Tizen · Windows · Mobile</text>

  <!-- Honeybee accent -->
  <g transform="translate(820, 200) scale(0.5)">
    <ellipse cx="0" cy="0" rx="12" ry="10" fill="#E8A020"/>
    <ellipse cx="-14" cy="-4" rx="12" ry="6" fill="none" stroke="#E8A020" stroke-width="2" transform="rotate(-30)"/>
    <ellipse cx="14" cy="-4" rx="12" ry="6" fill="none" stroke="#E8A020" stroke-width="2" transform="rotate(30)"/>
    <path d="M-7 4 L-10 14 M7 4 L10 14 M0 6 L0 14" stroke="#E8A020" stroke-width="2" stroke-linecap="round"/>
    <path d="M-6 -2 L6 -2 M-8 4 L8 4" stroke="#1A2E1E" stroke-width="2.5" fill="none"/>
  </g>
</svg>
