<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="50%" stop-color="#1A1A2E"/>
      <stop offset="100%" stop-color="#161B22"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00FF87"/>
      <stop offset="50%" stop-color="#00B4D8"/>
      <stop offset="100%" stop-color="#7B2CBF"/>
    </linearGradient>
    <radialGradient id="glow1" cx="30%" cy="30%">
      <stop offset="0%" stop-color="#00FF87" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#00FF87" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="70%" cy="70%">
      <stop offset="0%" stop-color="#7B2CBF" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#7B2CBF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Decorative Glows -->
  <ellipse cx="300" cy="200" rx="400" ry="300" fill="url(#glow1)"/>
  <ellipse cx="900" cy="430" rx="400" ry="300" fill="url(#glow2)"/>

  <!-- DNA Helix Decorative Element (Left) -->
  <g transform="translate(120, 315)" opacity="0.2">
    <ellipse cx="0" cy="0" rx="40" ry="120" fill="none" stroke="#00FF87" stroke-width="2">
      <animate attributeName="ry" values="120;130;120" dur="6s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="0" cy="0" rx="25" ry="80" fill="none" stroke="#7B2CBF" stroke-width="1.5">
      <animate attributeName="ry" values="80;90;80" dur="6s" repeatCount="indefinite"/>
    </ellipse>
  </g>

  <!-- DNA Helix Decorative Element (Right) -->
  <g transform="translate(1080, 315)" opacity="0.2">
    <ellipse cx="0" cy="0" rx="40" ry="120" fill="none" stroke="#00B4D8" stroke-width="2">
      <animate attributeName="ry" values="120;130;120" dur="6s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="0" cy="0" rx="25" ry="80" fill="none" stroke="#7B2CBF" stroke-width="1.5">
      <animate attributeName="ry" values="80;90;80" dur="6s" repeatCount="indefinite"/>
    </ellipse>
  </g>

  <!-- Logo Mark -->
  <g transform="translate(600, 180)">
    <ellipse cx="0" cy="0" rx="50" ry="80" fill="none" stroke="url(#textGrad)" stroke-width="3" opacity="0.9">
      <animate attributeName="ry" values="80;85;80" dur="4s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="0" cy="0" rx="30" ry="55" fill="none" stroke="#7B2CBF" stroke-width="2" opacity="0.7">
      <animate attributeName="ry" values="55;60;55" dur="4s" repeatCount="indefinite"/>
    </ellipse>
    <circle cx="0" cy="-45" r="8" fill="#00FF87">
      <animate attributeName="opacity" values="1;0.4;1" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="45" r="8" fill="#00B4D8">
      <animate attributeName="opacity" values="1;0.4;1" dur="2.5s" repeatCount="indefinite" begin="1.25s"/>
    </circle>
  </g>

  <!-- Phlix Title -->
  <text x="600" y="340" font-family="Georgia, serif" font-size="72" font-weight="700" fill="url(#textGrad)" text-anchor="middle">
    Phlix
  </text>

  <!-- Tagline -->
  <text x="600" y="400" font-family="Segoe UI, sans-serif" font-size="24" font-weight="400" fill="#8B949E" text-anchor="middle" letter-spacing="3">
    GROWN, NOT BUILT
  </text>

  <!-- Subline -->
  <text x="600" y="450" font-family="Segoe UI, sans-serif" font-size="18" font-weight="400" fill="#E6EDF3" text-anchor="middle" opacity="0.8">
    Self-hosted media server with organic elegance
  </text>

  <!-- Bioluminescent dots -->
  <circle cx="200" cy="550" r="4" fill="#00FF87" opacity="0.3">
    <animate attributeName="opacity" values="0.3;0.8;0.3" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="400" cy="520" r="3" fill="#00B4D8" opacity="0.3">
    <animate attributeName="opacity" values="0.3;0.8;0.3" dur="2.5s" repeatCount="indefinite" begin="0.5s"/>
  </circle>
  <circle cx="600" cy="560" r="5" fill="#7B2CBF" opacity="0.3">
    <animate attributeName="opacity" values="0.3;0.8;0.3" dur="3.5s" repeatCount="indefinite" begin="1s"/>
  </circle>
  <circle cx="800" cy="530" r="3" fill="#00FF87" opacity="0.3">
    <animate attributeName="opacity" values="0.3;0.8;0.3" dur="2.8s" repeatCount="indefinite" begin="1.5s"/>
  </circle>
  <circle cx="1000" cy="555" r="4" fill="#00B4D8" opacity="0.3">
    <animate attributeName="opacity" values="0.3;0.8;0.3" dur="3.2s" repeatCount="indefinite" begin="2s"/>
  </circle>
</svg>
