<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="faviconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF87"/>
      <stop offset="100%" stop-color="#00B4D8"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="32" height="32" rx="6" fill="#0D1117"/>

  <!-- DNA Helix Element -->
  <g transform="translate(16, 16)">
    <ellipse cx="0" cy="0" rx="8" ry="12" fill="none" stroke="url(#faviconGrad)" stroke-width="1.5" opacity="0.8">
      <animate attributeName="ry" values="12;13;12" dur="3s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="0" cy="0" rx="5" ry="8" fill="none" stroke="#7B2CBF" stroke-width="1" opacity="0.6">
      <animate attributeName="ry" values="8;9;8" dur="3s" repeatCount="indefinite"/>
    </ellipse>
    <circle cx="0" cy="-7" r="2" fill="#00FF87">
      <animate attributeName="opacity" values="1;0.5;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="7" r="2" fill="#00B4D8">
      <animate attributeName="opacity" values="1;0.5;1" dur="2s" repeatCount="indefinite" begin="1s"/>
    </circle>
  </g>
</svg>
