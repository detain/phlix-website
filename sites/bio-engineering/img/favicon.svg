<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <radialGradient id="cellGlow" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#00FF87" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#00FF87" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Cell membrane -->
  <circle cx="16" cy="16" r="14" fill="url(#cellGlow)" stroke="#00B4D8" stroke-width="1.5"/>

  <!-- Inner membrane -->
  <circle cx="16" cy="16" r="10" fill="none" stroke="#00B4D8" stroke-width="0.5" stroke-opacity="0.5"/>

  <!-- Nucleus -->
  <circle cx="16" cy="16" r="4" fill="#7B2CBF" filter="url(#glow)">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- Orbit rings -->
  <ellipse cx="16" cy="16" rx="14" ry="5" fill="none" stroke="#00FF87" stroke-width="0.5" stroke-opacity="0.6" transform="rotate(0 16 16)">
    <animateTransform attributeName="transform" type="rotate" from="0 16 16" to="360 16 16" dur="20s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="16" cy="16" rx="14" ry="5" fill="none" stroke="#00FF87" stroke-width="0.5" stroke-opacity="0.6" transform="rotate(60 16 16)">
    <animateTransform attributeName="transform" type="rotate" from="60 16 16" to="420 16 16" dur="20s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="16" cy="16" rx="14" ry="5" fill="none" stroke="#00FF87" stroke-width="0.5" stroke-opacity="0.6" transform="rotate(120 16 16)">
    <animateTransform attributeName="transform" type="rotate" from="120 16 16" to="480 16 16" dur="20s" repeatCount="indefinite"/>
  </ellipse>

  <!-- Organelles -->
  <circle cx="10" cy="10" r="1.5" fill="#00B4D8" opacity="0.5">
    <animate attributeName="opacity" values="0.3;0.7;0.3" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="22" cy="12" r="1" fill="#00FF87" opacity="0.4">
    <animate attributeName="opacity" values="0.2;0.6;0.2" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="20" cy="22" r="1.2" fill="#7B2CBF" opacity="0.5">
    <animate attributeName="opacity" values="0.3;0.7;0.3" dur="5s" repeatCount="indefinite"/>
  </circle>
</svg>
