<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" fill="none">
  <defs>
    <linearGradient id="bioGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF87"/>
      <stop offset="50%" stop-color="#00B4D8"/>
      <stop offset="100%" stop-color="#7B2CBF"/>
    </linearGradient>
    <linearGradient id="cellGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF87" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#00B4D8" stop-opacity="0.6"/>
    </linearGradient>
  </defs>

  <!-- DNA Helix Symbol -->
  <g transform="translate(10, 5)">
    <ellipse cx="20" cy="25" rx="12" ry="20" fill="none" stroke="url(#cellGrad)" stroke-width="1.5" opacity="0.7">
      <animate attributeName="ry" values="20;22;20" dur="4s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="20" cy="25" rx="8" ry="14" fill="none" stroke="#7B2CBF" stroke-width="1" opacity="0.5">
      <animate attributeName="ry" values="14;16;14" dur="4s" repeatCount="indefinite"/>
    </ellipse>
    <circle cx="20" cy="10" r="3" fill="#00FF87" opacity="0.9">
      <animate attributeName="opacity" values="0.9;0.5;0.9" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="20" cy="40" r="3" fill="#00B4D8" opacity="0.9">
      <animate attributeName="opacity" values="0.9;0.5;0.9" dur="3s" repeatCount="indefinite" begin="1.5s"/>
    </circle>
  </g>

  <!-- Phlix Text -->
  <text x="55" y="42" font-family="Playfair Display, Georgia, serif" font-size="32" font-weight="700" fill="url(#bioGrad)">
    Phlix
  </text>

  <!-- Subtitle -->
  <text x="135" y="42" font-family="Source Sans 3, Segoe UI, sans-serif" font-size="10" font-weight="400" fill="#8B949E" letter-spacing="2">
    BIO
  </text>
</svg>
