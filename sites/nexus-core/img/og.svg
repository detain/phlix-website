<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1A2E"/>
      <stop offset="100%" stop-color="#252545"/>
    </linearGradient>
    <linearGradient id="core-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5FF"/>
      <stop offset="50%" stop-color="#7B2CBF"/>
      <stop offset="100%" stop-color="#FF006E"/>
    </linearGradient>
    <radialGradient id="glow-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00F5FF" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#00F5FF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg-grad)"/>
  <!-- Glow effect -->
  <ellipse cx="600" cy="315" rx="400" ry="300" fill="url(#glow-grad)"/>
  <!-- Orbital rings -->
  <ellipse cx="600" cy="315" rx="200" ry="80" fill="none" stroke="#00F5FF" stroke-width="2" opacity="0.4" transform="rotate(-15 600 315)"/>
  <ellipse cx="600" cy="315" rx="160" ry="65" fill="none" stroke="#7B2CBF" stroke-width="1.5" opacity="0.3" transform="rotate(20 600 315)"/>
  <ellipse cx="600" cy="315" rx="240" ry="95" fill="none" stroke="#FF006E" stroke-width="1" opacity="0.2" transform="rotate(-30 600 315)"/>
  <!-- Core -->
  <circle cx="600" cy="315" r="60" fill="url(#core-grad)"/>
  <circle cx="600" cy="315" r="30" fill="#1A1A2E"/>
  <circle cx="600" cy="315" r="15" fill="#00F5FF"/>
  <!-- Orbiting nodes -->
  <circle cx="750" cy="250" r="8" fill="#00F5FF"/>
  <circle cx="480" cy="380" r="6" fill="#00FF87"/>
  <circle cx="700" cy="420" r="7" fill="#7B2CBF"/>
  <circle cx="420" cy="260" r="5" fill="#FF006E"/>
  <circle cx="680" cy="200" r="6" fill="#00FF87"/>
  <!-- Text -->
  <text x="600" y="520" font-family="Orbitron, sans-serif" font-weight="700" font-size="48" fill="#F0F4F8" text-anchor="middle" letter-spacing="0.06em">PHLIX</text>
  <text x="600" y="570" font-family="Rajdhani, sans-serif" font-weight="300" font-size="24" fill="#9098A8" text-anchor="middle" letter-spacing="0.04em">All streams flow to the core.</text>
</svg>
