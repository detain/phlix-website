<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" aria-label="Phlix">
  <defs>
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5FF"/>
      <stop offset="50%" stop-color="#7B2CBF"/>
      <stop offset="100%" stop-color="#FF006E"/>
    </linearGradient>
    <linearGradient id="ring-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5FF" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#7B2CBF" stop-opacity="0.3"/>
    </linearGradient>
  </defs>
  <!-- Orbital rings -->
  <ellipse cx="30" cy="30" rx="28" ry="12" fill="none" stroke="url(#ring-grad)" stroke-width="1.5" transform="rotate(-20 30 30)"/>
  <ellipse cx="30" cy="30" rx="22" ry="9" fill="none" stroke="url(#ring-grad)" stroke-width="1" transform="rotate(15 30 30)"/>
  <!-- Core -->
  <circle cx="30" cy="30" r="8" fill="url(#text-grad)"/>
  <circle cx="30" cy="30" r="4" fill="#1A1A2E"/>
  <circle cx="30" cy="30" r="2" fill="#00F5FF"/>
  <!-- Text -->
  <text x="70" y="40" font-family="Orbitron, sans-serif" font-weight="700" font-size="28" fill="url(#text-grad)" letter-spacing="0.08em">PHLIX</text>
</svg>
