<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2C3E50"/>
      <stop offset="50%" stop-color="#8E44AD"/>
      <stop offset="100%" stop-color="#E74C3C"/>
    </linearGradient>
    <linearGradient id="mountain-gradient" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#2C3E50"/>
      <stop offset="100%" stop-color="#8E44AD"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg-gradient)"/>

  <!-- Topographic pattern overlay -->
  <g opacity="0.05">
    <path d="M0 100 Q300 50 600 100 T1200 100 L1200 630 L0 630 Z" fill="#ffffff"/>
    <path d="M0 200 Q300 150 600 200 T1200 200 L1200 630 L0 630 Z" fill="#ffffff"/>
    <path d="M0 300 Q300 250 600 300 T1200 300 L1200 630 L0 630 Z" fill="#ffffff"/>
  </g>

  <!-- Mountain peaks -->
  <g transform="translate(0, 180)">
    <!-- Left mountain -->
    <path d="M150 350 L350 50 L550 350 Z" fill="url(#mountain-gradient)" opacity="0.8"/>
    <path d="M350 50 L400 120 L350 95 L300 120 Z" fill="#ECF0F1" opacity="0.9"/>

    <!-- Center mountain (tallest) -->
    <path d="M400 350 L600 -50 L800 350 Z" fill="#2C3E50" opacity="0.9"/>
    <path d="M600 -50 L660 100 L600 60 L540 100 Z" fill="#ECF0F1"/>

    <!-- Right mountain -->
    <path d="M650 350 L850 100 L1050 350 Z" fill="url(#mountain-gradient)" opacity="0.7"/>
    <path d="M850 100 L890 160 L850 130 L810 160 Z" fill="#ECF0F1" opacity="0.9"/>
  </g>

  <!-- Sun/glow -->
  <circle cx="950" cy="150" r="80" fill="#F39C12" opacity="0.6"/>
  <circle cx="950" cy="150" r="50" fill="#F39C12" opacity="0.8"/>

  <!-- Brand text -->
  <text x="600" y="520" text-anchor="middle" font-family="Georgia, serif" font-size="72" font-weight="700" fill="#ECF0F1">Phlix</text>
  <text x="600" y="580" text-anchor="middle" font-family="sans-serif" font-size="28" fill="rgba(236,240,241,0.8)">Your media. Your library. Your Phlix.</text>
</svg>
