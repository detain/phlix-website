<!-- Cyber Tokyo brand kit — logo.svg -->
<!-- Wordmark in Space Grotesk bold, sharp-edged rectangle, Neon Sakura border, pink glow -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" role="img" aria-label="Phlix logo">
  <defs>
    <filter id="pink-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Sharp-cornered badge with Neon Sakura border -->
  <rect x="1" y="1" width="238" height="58" rx="0" fill="#050308" stroke="#FF00AA" stroke-width="1" filter="url(#pink-glow)"/>
  <!-- Phlix wordmark — Space Grotesk bold, Screen White -->
  <text x="16" y="41" font-family="'Space Grotesk', 'Noto Serif JP', sans-serif" font-weight="700" font-size="28" fill="#F0EEF8" letter-spacing="-0.5">Phlix</text>
  <!-- Katakana decorative mark — circuit trace -->
  <text x="190" y="40" font-family="'Space Grotesk', monospace" font-size="14" fill="#00FF41" opacity="0.7" letter-spacing="0.1em">信号</text>
  <!-- Thin accent line -->
  <rect x="16" y="48" width="80" height="1" fill="#FF00AA" opacity="0.5"/>
</svg>
