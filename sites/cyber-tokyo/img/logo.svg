<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" width="200" height="60" role="img" aria-label="Phlix logo">
  <title>Phlix — Cyber Tokyo</title>
  <defs>
    <filter id="sakura-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D0918"/>
      <stop offset="100%" stop-color="#050308"/>
    </linearGradient>
  </defs>

  <!-- Background badge -->
  <rect x="1" y="1" width="198" height="58" rx="2" ry="2"
        fill="url(#bg-grad)"
        stroke="#FF00AA"
        stroke-width="1"
        filter="url(#sakura-glow)"/>

  <!-- Circuit trace accent — left side -->
  <g stroke="#00FF41" stroke-width="1" fill="none" opacity="0.6">
    <path d="M8 30 L14 30 L14 20 L22 20"/>
    <path d="M8 34 L14 34 L14 40 L22 40"/>
    <circle cx="22" cy="20" r="1.5" fill="#00FF41" stroke="none"/>
    <circle cx="22" cy="40" r="1.5" fill="#00FF41" stroke="none"/>
  </g>

  <!-- Wordmark "Phlix" -->
  <text x="32" y="42"
        font-family="'Space Grotesk', 'Noto Sans JP', sans-serif"
        font-weight="700"
        font-size="28"
        fill="#F0EEF8"
        letter-spacing="-0.5"
        filter="url(#sakura-glow)">Phlix</text>

  <!-- Vertical katakana accent — right side -->
  <text x="185" y="45"
        font-family="'Noto Sans JP', sans-serif"
        font-weight="700"
        font-size="16"
        fill="#FF00AA"
        opacity="0.7"
        writing-mode="vertical-rl"
        text-orientation="mixed">シグナル</text>

  <!-- Small neon dot accent -->
  <circle cx="175" cy="30" r="3" fill="#00FF41" opacity="0.8"/>
</svg>
