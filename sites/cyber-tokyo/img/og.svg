<!-- Cyber Tokyo brand kit — og.svg -->
<!-- Social share card: 1200×630 — full-bleed Tokyo Night with neon accents -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Phlix — Every Screen. Every Signal. Every Story.">
  <defs>
    <linearGradient id="shibuya-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050308"/>
      <stop offset="60%" stop-color="#0D0918"/>
      <stop offset="100%" stop-color="#050308"/>
    </linearGradient>
    <linearGradient id="sakura-lime" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF00AA"/>
      <stop offset="100%" stop-color="#00FF41"/>
    </linearGradient>
    <radialGradient id="akihabara-glow" cx="80%" cy="30%" r="60%">
      <stop offset="0%" stop-color="rgba(255,0,170,0.25)"/>
      <stop offset="100%" stop-color="rgba(5,3,8,0)"/>
    </radialGradient>
    <filter id="neon-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#shibuya-bg)"/>

  <!-- Scan-line texture -->
  <rect width="1200" height="630" fill="none" stroke="#FF00AA" stroke-width="0.5" opacity="0.04">
    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="4" y2="0" stroke="#FF00AA" stroke-width="0.5" opacity="0.15"/>
    </pattern>
  </rect>
  <rect width="1200" height="630" fill="url(#scanlines)" opacity="0.5"/>

  <!-- Ambient neon bloom -->
  <rect width="1200" height="630" fill="url(#akihabara-glow)"/>

  <!-- Circuit stripe divider left -->
  <rect x="0" y="300" width="1200" height="1" fill="url(#sakura-lime)" opacity="0.3"/>

  <!-- Left vertical kanji accent -->
  <text x="40" y="300" font-family="'Noto Serif JP', serif" font-size="200" fill="#FF00AA" opacity="0.06" dominant-baseline="middle">東京</text>

  <!-- Bottom accent bar -->
  <rect x="0" y="620" width="1200" height="10" fill="#FF00AA" opacity="0.15"/>
  <rect x="0" y="620" width="600" height="10" fill="#00FF41" opacity="0.1"/>

  <!-- Phlix wordmark -->
  <text x="80" y="240" font-family="'Space Grotesk', 'Noto Serif JP', sans-serif" font-weight="900" font-size="96" fill="#F0EEF8" letter-spacing="-2">Phlix</text>

  <!-- Tagline primary -->
  <text x="80" y="310" font-family="'Space Grotesk', 'Noto Serif JP', sans-serif" font-weight="700" font-size="28" fill="#FF00AA" filter="url(#neon-glow)" letter-spacing="0">Every Screen. Every Signal. Every Story.</text>

  <!-- Product descriptor -->
  <text x="80" y="360" font-family="'IBM Plex Sans', sans-serif" font-size="22" fill="rgba(240,238,248,0.6)" letter-spacing="0.5">Self-hosted PHP media server</text>

  <!-- Circuit trace decorative line -->
  <polyline points="80,400 160,400 180,420 300,420 320,400 500,400" fill="none" stroke="#00FF41" stroke-width="1.5" opacity="0.4"/>

  <!-- Feature pills bottom -->
  <rect x="80" y="480" width="120" height="32" rx="2" fill="none" stroke="#FF00AA" stroke-width="1" opacity="0.6"/>
  <text x="140" y="502" font-family="'IBM Plex Sans', sans-serif" font-weight="600" font-size="13" fill="#FF00AA" text-anchor="middle" letter-spacing="0.08em">SYNCPLAY</text>

  <rect x="215" y="480" width="120" height="32" rx="2" fill="none" stroke="#00FF41" stroke-width="1" opacity="0.6"/>
  <text x="275" y="502" font-family="'IBM Plex Sans', sans-serif" font-weight="600" font-size="13" fill="#00FF41" text-anchor="middle" letter-spacing="0.08em">LIVE TV</text>

  <rect x="350" y="480" width="120" height="32" rx="2" fill="none" stroke="#FF00AA" stroke-width="1" opacity="0.6"/>
  <text x="410" y="502" font-family="'IBM Plex Sans', sans-serif" font-weight="600" font-size="13" fill="#FF00AA" text-anchor="middle" letter-spacing="0.08em">HUB RELAY</text>

  <rect x="485" y="480" width="120" height="32" rx="2" fill="none" stroke="#00FF41" stroke-width="1" opacity="0.6"/>
  <text x="545" y="502" font-family="'IBM Plex Sans', sans-serif" font-weight="600" font-size="13" fill="#00FF41" text-anchor="middle" letter-spacing="0.08em">DLNA</text>

  <rect x="620" y="480" width="120" height="32" rx="2" fill="none" stroke="#FF6600" stroke-width="1" opacity="0.6"/>
  <text x="680" y="502" font-family="'IBM Plex Sans', sans-serif" font-weight="600" font-size="13" fill="#FF6600" text-anchor="middle" letter-spacing="0.08em">4K / HDR</text>

  <!-- Vertical text right -->
  <text x="1140" y="300" font-family="'Space Grotesk', monospace" font-size="14" fill="#00FF41" opacity="0.4" letter-spacing="0.1em" writing-mode="tb" dominant-baseline="middle">P H L I X · M E D I A · S E R V E R ·</text>
</svg>
