<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Phlix — Cyber Tokyo social image">
  <title>Phlix — Cyber Tokyo</title>
  <defs>
    <linearGradient id="og-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D0918"/>
      <stop offset="50%" stop-color="#050308"/>
      <stop offset="100%" stop-color="#0D0918"/>
    </linearGradient>
    <linearGradient id="shibuya-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF00AA" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#050308" stop-opacity="0"/>
      <stop offset="100%" stop-color="#00FF41" stop-opacity="0.2"/>
    </linearGradient>
    <radialGradient id="akihabara-bloom" cx="30%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#FF00AA" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#050308" stop-opacity="0"/>
    </radialGradient>
    <filter id="neon-glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="text-glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#og-bg)"/>

  <!-- Gradient overlays -->
  <rect width="1200" height="630" fill="url(#shibuya-grad)"/>
  <rect width="1200" height="630" fill="url(#akihabara-bloom)"/>

  <!-- Scan-line overlay -->
  <g opacity="0.04">
    <line x1="0" y1="0" x2="1200" y2="0" stroke="#00FF41" stroke-width="1"/>
    <line x1="0" y1="4" x2="1200" y2="4" stroke="#00FF41" stroke-width="1"/>
    <line x1="0" y1="8" x2="1200" y2="8" stroke="#00FF41" stroke-width="1"/>
    <line x1="0" y1="12" x2="1200" y2="12" stroke="#00FF41" stroke-width="1"/>
  </g>

  <!-- Vertical kanji decorative column — left -->
  <text x="80" y="630"
        font-family="'Noto Serif JP', serif"
        font-weight="700"
        font-size="320"
        fill="#FF00AA"
        opacity="0.05"
        writing-mode="vertical-rl"
        text-orientation="mixed">東京</text>

  <!-- Vertical kanji decorative column — right -->
  <text x="1100" y="630"
        font-family="'Noto Serif JP', serif"
        font-weight="700"
        font-size="200"
        fill="#00FF41"
        opacity="0.04"
        writing-mode="vertical-rl"
        text-orientation="mixed">信号</text>

  <!-- Logo mark -->
  <g transform="translate(100, 100)" filter="url(#neon-glow)">
    <rect width="56" height="56" rx="2" fill="none" stroke="#FF00AA" stroke-width="1.5"/>
    <text x="28" y="42"
          text-anchor="middle"
          font-family="sans-serif"
          font-weight="900"
          font-size="32"
          fill="#F0EEF8"
          letter-spacing="-2">P</text>
  </g>

  <!-- Phlix wordmark -->
  <text x="176" y="145"
        font-family="'Space Grotesk', 'Noto Sans JP', sans-serif"
        font-weight="900"
        font-size="72"
        fill="#F0EEF8"
        letter-spacing="-2"
        filter="url(#text-glow)">Phlix</text>

  <!-- Tagline -->
  <text x="176" y="190"
        font-family="'IBM Plex Sans', sans-serif"
        font-weight="400"
        font-size="28"
        fill="#6B5C7C"
        letter-spacing="0">Your media. Your library. Your Phlix.</text>

  <!-- Circuit trace accent — bottom -->
  <g stroke="#00FF41" stroke-width="2" fill="none" opacity="0.5">
    <path d="M100 560 L200 560 L200 530 L300 530"/>
    <circle cx="300" cy="530" r="4" fill="#00FF41" stroke="none"/>
    <path d="M100 580 L150 580 L150 560 L220 560"/>
    <circle cx="220" cy="560" r="3" fill="#00FF41" stroke="none"/>
  </g>

  <!-- Bottom accent — right circuit -->
  <g stroke="#FF00AA" stroke-width="2" fill="none" opacity="0.4">
    <path d="M1100 560 L1000 560 L1000 530 L900 530"/>
    <circle cx="900" cy="530" r="4" fill="#FF00AA" stroke="none"/>
  </g>

  <!-- Neon Sakura dot accent -->
  <circle cx="600" cy="520" r="6" fill="#FF00AA" opacity="0.8" filter="url(#neon-glow)"/>
</svg>
