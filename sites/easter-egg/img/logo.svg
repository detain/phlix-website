<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 80" fill="none">
  <!-- Background egg shape hint -->
  <defs>
    <linearGradient id="eggGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF69B4"/>
      <stop offset="50%" stop-color="#87CEEB"/>
      <stop offset="100%" stop-color="#98FB98"/>
    </linearGradient>
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2E0854"/>
      <stop offset="100%" stop-color="#FF69B4"/>
    </linearGradient>
  </defs>

  <!-- Stylized egg mark -->
  <g transform="translate(8, 8)">
    <!-- Outer egg -->
    <path d="M32 4C18 4 8 16 8 32C8 48 18 60 32 60C46 60 56 48 56 32C56 16 46 4 32 4Z"
          fill="url(#eggGradient)" opacity="0.9"/>
    <!-- Inner highlight -->
    <ellipse cx="24" cy="24" rx="8" ry="10" fill="white" opacity="0.4"/>
    <!-- Playful dot -->
    <circle cx="40" cy="40" r="4" fill="#2E0854"/>
  </g>

  <!-- Wordmark -->
  <text x="80" y="52" font-family="Georgia, serif" font-size="42" font-weight="700" fill="url(#textGradient)">Phlix</text>

  <!-- Subtle easter egg accent -->
  <g transform="translate(185, 30)" opacity="0.6">
    <circle cx="0" cy="0" r="3" fill="#DDA0DD"/>
    <circle cx="10" cy="5" r="2" fill="#87CEEB"/>
    <circle cx="5" cy="12" r="2.5" fill="#98FB98"/>
  </g>
</svg>
