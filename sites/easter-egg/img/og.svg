<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF8DC"/>
      <stop offset="100%" stop-color="#F5F0E0"/>
    </linearGradient>
    <linearGradient id="eggGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF69B4"/>
      <stop offset="50%" stop-color="#87CEEB"/>
      <stop offset="100%" stop-color="#98FB98"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2E0854"/>
      <stop offset="100%" stop-color="#FF69B4"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Decorative circles -->
  <circle cx="100" cy="100" r="150" fill="#DDA0DD" opacity="0.15"/>
  <circle cx="1100" cy="530" r="200" fill="#87CEEB" opacity="0.12"/>
  <circle cx="600" cy="315" r="250" fill="#FF69B4" opacity="0.08"/>

  <!-- Egg icon -->
  <g transform="translate(200, 165)" filter="url(#glow)">
    <path d="M200 0C130 0 70 55 70 130C70 205 130 300 200 300C270 300 330 205 330 130C330 55 270 0 200 0Z" fill="url(#eggGrad)"/>
    <ellipse cx="160" cy="100" rx="40" ry="50" fill="white" opacity="0.4"/>
    <circle cx="250" cy="220" r="20" fill="#2E0854"/>
  </g>

  <!-- Text: Phlix wordmark -->
  <text x="650" y="280" font-family="Georgia, serif" font-size="120" font-weight="700" fill="url(#textGrad)">Phlix</text>

  <!-- Tagline -->
  <text x="650" y="360" font-family="Helvetica, sans-serif" font-size="32" fill="#5a4a7a">Your media. Your library. Your server.</text>

  <!-- Accent dots -->
  <g opacity="0.6">
    <circle cx="520" cy="420" r="8" fill="#FF69B4"/>
    <circle cx="550" cy="420" r="8" fill="#87CEEB"/>
    <circle cx="580" cy="420" r="8" fill="#98FB98"/>
    <circle cx="610" cy="420" r="8" fill="#DDA0DD"/>
  </g>

  <!-- Bottom tagline -->
  <text x="600" y="530" font-family="Helvetica, sans-serif" font-size="24" fill="#5a4a7a" text-anchor="middle">Open-source media, on your terms.</text>
</svg>
