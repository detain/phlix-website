<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 64" role="img" aria-label="Phlix — Afrofuturism brand logo">
  <!-- Background cosmic dark -->
  <rect width="240" height="64" fill="#080510"/>

  <!-- Kente geometric border: 2px Kente Gold with triangle notch corners -->
  <rect x="2" y="2" width="236" height="60" fill="none" stroke="#F0B800" stroke-width="2"/>

  <!-- Kente triangle notches at corners (top-left, top-right, bottom-left, bottom-right) -->
  <!-- Top-left: two triangles forming chevron -->
  <polygon points="2,16 16,2 16,16" fill="#F0B800"/>
  <!-- Top-right -->
  <polygon points="238,16 224,2 224,16" fill="#F0B800"/>
  <!-- Bottom-left -->
  <polygon points="2,48 16,62 16,48" fill="#F0B800"/>
  <!-- Bottom-right -->
  <polygon points="238,48 224,62 224,48" fill="#F0B800"/>

  <!-- Interlocking triangle kente motif — subtle, behind the wordmark -->
  <polygon points="30,32 38,18 46,32" fill="none" stroke="#F0B800" stroke-width="1" opacity="0.35"/>
  <polygon points="34,32 38,26 42,32" fill="#F0B800" opacity="0.25"/>
  <polygon points="194,32 202,18 210,32" fill="none" stroke="#F0B800" stroke-width="1" opacity="0.35"/>
  <polygon points="198,32 202,26 206,32" fill="#F0B800" opacity="0.25"/>

  <!-- Phlix wordmark — Montserrat Black style (bold sans-serif) -->
  <text
    x="120"
    y="42"
    text-anchor="middle"
    font-family="Arial Black, Helvetica Neue, sans-serif"
    font-size="32"
    font-weight="900"
    letter-spacing="-0.5"
    fill="#F5EDD8"
  >Phlix</text>

  <!-- Kente chevron accent below the wordmark -->
  <polygon points="108,52 112,46 116,52" fill="#F0B800" opacity="0.8"/>
  <polygon points="116,52 120,46 124,52" fill="#6600CC" opacity="0.8"/>
  <polygon points="124,52 128,46 132,52" fill="#F0B800" opacity="0.8"/>
</svg>
