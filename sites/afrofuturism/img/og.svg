<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Phlix — From Ancient Stars, Future Stories.">
  <!-- Cosmic Earth background -->
  <rect width="1200" height="630" fill="#080510"/>

  <!-- Radial violet glow behind center -->
  <ellipse cx="600" cy="200" rx="700" ry="400" fill="#6600CC" opacity="0.12"/>

  <!-- Starfield (subtle dots) -->
  <g opacity="0.5">
    <circle cx="120" cy="90" r="1.5" fill="#F5EDD8"/>
    <circle cx="240" cy="160" r="1" fill="#F5EDD8"/>
    <circle cx="380" cy="80" r="1.5" fill="#F5EDD8"/>
    <circle cx="520" cy="140" r="1" fill="#F5EDD8"/>
    <circle cx="680" cy="70" r="1.5" fill="#F5EDD8"/>
    <circle cx="820" cy="130" r="1" fill="#F5EDD8"/>
    <circle cx="960" cy="90" r="1.5" fill="#F5EDD8"/>
    <circle cx="1080" cy="160" r="1" fill="#F5EDD8"/>
    <circle cx="60" cy="280" r="1" fill="#F5EDD8"/>
    <circle cx="1100" cy="300" r="1.5" fill="#F5EDD8"/>
    <circle cx="180" cy="520" r="1" fill="#F5EDD8"/>
    <circle cx="900" cy="540" r="1.5" fill="#F5EDD8"/>
    <circle cx="1050" cy="480" r="1" fill="#F5EDD8"/>
    <circle cx="80" cy="450" r="1.5" fill="#F0B800"/>
    <circle cx="1140" cy="200" r="1" fill="#F0B800"/>
  </g>

  <!-- Kente pattern top border strip -->
  <rect x="0" y="0" width="1200" height="8" fill="#080510"/>
  <rect x="0" y="0" width="1200" height="6" fill="url(#kentePattern)"/>
  <defs>
    <pattern id="kentePattern" x="0" y="0" width="60" height="6" patternUnits="userSpaceOnUse">
      <rect width="30" height="6" fill="#F0B800"/>
      <rect x="30" width="30" height="6" fill="#6600CC"/>
    </pattern>
  </defs>

  <!-- Gold radial glow at center bottom -->
  <ellipse cx="600" cy="380" rx="400" ry="200" fill="#F0B800" opacity="0.08"/>

  <!-- Tagline (top) -->
  <text
    x="600"
    y="200"
    text-anchor="middle"
    font-family="Arial Black, Helvetica Neue, sans-serif"
    font-size="26"
    font-weight="900"
    letter-spacing="8"
    fill="#F0B800"
    opacity="0.9"
  >FROM ANCIENT STARS</text>

  <!-- Main headline -->
  <text
    x="600"
    y="340"
    text-anchor="middle"
    font-family="Arial Black, Helvetica Neue, sans-serif"
    font-size="96"
    font-weight="900"
    letter-spacing="-2"
    fill="#F5EDD8"
  >Future Stories.</text>

  <!-- Orisha triangle geometric silhouette (stylized) -->
  <polygon points="570,380 600,355 630,380" fill="#F0B800" opacity="0.7"/>
  <polygon points="580,385 600,365 620,385" fill="#080510" opacity="0.3"/>
  <polygon points="585,395 600,375 615,395 600,405" fill="none" stroke="#F0B800" stroke-width="1.5" opacity="0.5"/>

  <!-- Kente chevron divider -->
  <polygon points="530,430 545,415 560,430" fill="#F0B800" opacity="0.7"/>
  <polygon points="560,430 575,415 590,430" fill="#6600CC" opacity="0.7"/>
  <polygon points="590,430 605,415 620,430" fill="#F0B800" opacity="0.7"/>
  <polygon points="620,430 635,415 650,430" fill="#6600CC" opacity="0.7"/>
  <polygon points="650,430 665,415 680,430" fill="#F0B800" opacity="0.7"/>

  <!-- Product line -->
  <text
    x="600"
    y="480"
    text-anchor="middle"
    font-family="Arial, Helvetica Neue, sans-serif"
    font-size="28"
    font-weight="700"
    letter-spacing="4"
    fill="#F5EDD8"
    opacity="0.85"
  >PHLIX MEDIA SERVER</text>

  <!-- Subtext -->
  <text
    x="600"
    y="520"
    text-anchor="middle"
    font-family="Arial, Helvetica Neue, sans-serif"
    font-size="20"
    font-weight="400"
    fill="#F5EDD8"
    opacity="0.55"
  >Self-hosted. Open-source. Yours.</text>

  <!-- Kente border bottom strip -->
  <rect x="0" y="622" width="1200" height="8" fill="#080510"/>
  <rect x="0" y="624" width="1200" height="6" fill="url(#kentePattern2)"/>
  <defs>
    <pattern id="kentePattern2" x="0" y="0" width="60" height="6" patternUnits="userSpaceOnUse">
      <rect width="30" height="6" fill="#6600CC"/>
      <rect x="30" width="30" height="6" fill="#F0B800"/>
    </pattern>
  </defs>
</svg>
