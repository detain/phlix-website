<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Phlix favicon — Kente Gold P on cosmic dark">
  <rect width="32" height="32" fill="#080510"/>
  <rect x="2" y="2" width="28" height="28" fill="none" stroke="#F0B800" stroke-width="1.5"/>
  <!-- Corner triangle notches -->
  <polygon points="2,10 10,2 10,10" fill="#F0B800"/>
  <polygon points="30,10 22,2 22,10" fill="#F0B800"/>
  <polygon points="2,22 10,30 10,22" fill="#F0B800"/>
  <polygon points="30,22 22,30 22,22" fill="#F0B800"/>
  <!-- "P" glyph -->
  <text
    x="16"
    y="24"
    text-anchor="middle"
    font-family="Arial Black, Helvetica Neue, sans-serif"
    font-size="20"
    font-weight="900"
    fill="#F0B800"
  >P</text>
</svg>
