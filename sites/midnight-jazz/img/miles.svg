<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 120" aria-label="Miles the Midnight Jazz trumpet mascot" role="img">
  <title>Miles — Midnight Jazz Mascot</title>
  <desc>A stylized art-deco trumpet silhouette character with long valve-stems as legs, standing in a relaxed pose. From the Midnight Jazz brand kit.</desc>
  <!-- Bell (head) — art-deco oval with knowing smile implied by the flared opening -->
  <ellipse cx="30" cy="18" rx="14" ry="10" fill="#EDE8DF"/>
  <path d="M16 18 Q30 24 44 18" stroke="#0D1117" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <!-- Bell opening (smile) -->
  <ellipse cx="30" cy="18" rx="8" ry="5" fill="#0D1117"/>
  <!-- Body tube -->
  <rect x="26" y="24" width="8" height="30" rx="2" fill="#EDE8DF"/>
  <!-- Mute under one arm -->
  <ellipse cx="36" cy="36" rx="5" ry="8" fill="#7A9BB5" opacity="0.7" transform="rotate(15 36 36)"/>
  <!-- Valve stems (long legs) -->
  <rect x="23" y="52" width="5" height="52" rx="2" fill="#EDE8DF"/>
  <rect x="32" y="52" width="5" height="52" rx="2" fill="#EDE8DF"/>
  <!-- Valve caps -->
  <rect x="21" y="50" width="9" height="5" rx="1" fill="#EDE8DF"/>
  <rect x="30" y="50" width="9" height="5" rx="1" fill="#EDE8DF"/>
  <!-- Mouthpiece -->
  <rect x="27" y="22" width="6" height="4" rx="1" fill="#C4A45A"/>
  <!-- Tuning slide detail -->
  <rect x="20" y="30" width="16" height="3" rx="1.5" fill="none" stroke="#7A9BB5" stroke-width="1" opacity="0.6"/>
</svg>
