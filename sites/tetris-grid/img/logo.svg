<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 50" width="200" height="50">
  <defs>
    <style>
      .logo-text { font-family: 'Courier New', monospace; font-weight: 700; font-size: 28px; fill: #FFFFFF; }
      .block-i { fill: #00FFFF; }
      .block-o { fill: #FFFF00; }
      .block-t { fill: #FF00FF; }
      .block-s { fill: #00FF00; }
      .block-z { fill: #FF0000; }
      .block-j { fill: #0000FF; }
    </style>
  </defs>

  <!-- Tetromino blocks as decorative elements -->
  <!-- I-piece blocks -->
  <rect class="block-i" x="0" y="5" width="8" height="8" rx="1"/>
  <rect class="block-i" x="0" y="15" width="8" height="8" rx="1"/>
  <rect class="block-i" x="0" y="25" width="8" height="8" rx="1"/>
  <rect class="block-i" x="0" y="35" width="8" height="8" rx="1"/>

  <!-- Phlix text -->
  <text x="15" y="37" class="logo-text">Phlix</text>

  <!-- Decorative tetromino shapes after text -->
  <!-- T-piece -->
  <rect class="block-t" x="135" y="5" width="8" height="8" rx="1"/>
  <rect class="block-t" x="145" y="5" width="8" height="8" rx="1"/>
  <rect class="block-t" x="155" y="5" width="8" height="8" rx="1"/>
  <rect class="block-t" x="145" y="15" width="8" height="8" rx="1"/>

  <!-- S-piece -->
  <rect class="block-s" x="140" y="28" width="8" height="8" rx="1"/>
  <rect class="block-s" x="150" y="28" width="8" height="8" rx="1"/>
  <rect class="block-s" x="150" y="38" width="8" height="8" rx="1"/>
  <rect class="block-s" x="160" y="38" width="8" height="8" rx="1"/>
</svg>
