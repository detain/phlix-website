<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <style>
      .bg { fill: #0A0A0A; }
      .text { font-family: 'Courier New', monospace; fill: #FFFFFF; }
      .cyan { fill: #00FFFF; }
      .yellow { fill: #FFFF00; }
      .magenta { fill: #FF00FF; }
      .green { fill: #00FF00; }
      .red { fill: #FF0000; }
      .blue { fill: #0000FF; }
      .orange { fill: #FF8800; }
      .muted { fill: #A0A0A0; }
    </style>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FFFFFF"/>
      <stop offset="50%" style="stop-color:#00FFFF"/>
      <stop offset="100%" style="stop-color:#FF00FF"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect class="bg" width="1200" height="630"/>

  <!-- Grid pattern -->
  <g opacity="0.1">
    <line x1="0" y1="0" x2="0" y2="630" stroke="#333" stroke-width="1"/>
    <line x1="100" y1="0" x2="100" y2="630" stroke="#333" stroke-width="1"/>
    <line x1="200" y1="0" x2="200" y2="630" stroke="#333" stroke-width="1"/>
    <line x1="300" y1="0" x2="300" y2="630" stroke="#333" stroke-width="1"/>
    <line x1="400" y1="0" x2="400" y2="630" stroke="#333" stroke-width="1"/>
    <line x1="500" y1="0" x2="500" y2="630" stroke="#333" stroke-width="1"/>
    <line x1="600" y1="0" x2="600" y2="630" stroke="#333" stroke-width="1"/>
    <line x1="700" y1="0" x2="700" y2="630" stroke="#333" stroke-width="1"/>
    <line x1="800" y1="0" x2="800" y2="630" stroke="#333" stroke-width="1"/>
    <line x1="900" y1="0" x2="900" y2="630" stroke="#333" stroke-width="1"/>
    <line x1="1000" y1="0" x2="1000" y2="630" stroke="#333" stroke-width="1"/>
    <line x1="1100" y1="0" x2="1100" y2="630" stroke="#333" stroke-width="1"/>
    <line x1="0" y1="0" x2="1200" y2="0" stroke="#333" stroke-width="1"/>
    <line x1="0" y1="100" x2="1200" y2="100" stroke="#333" stroke-width="1"/>
    <line x1="0" y1="200" x2="1200" y2="200" stroke="#333" stroke-width="1"/>
    <line x1="0" y1="300" x2="1200" y2="300" stroke="#333" stroke-width="1"/>
    <line x1="0" y1="400" x2="1200" y2="400" stroke="#333" stroke-width="1"/>
    <line x1="0" y1="500" x2="1200" y2="500" stroke="#333" stroke-width="1"/>
  </g>

  <!-- Decorative tetromino blocks - top right -->
  <g transform="translate(950, 50)">
    <!-- I-piece -->
    <rect class="cyan" x="0" y="0" width="24" height="24" rx="3"/>
    <rect class="cyan" x="0" y="30" width="24" height="24" rx="3"/>
    <rect class="cyan" x="0" y="60" width="24" height="24" rx="3"/>
    <rect class="cyan" x="0" y="90" width="24" height="24" rx="3"/>
  </g>

  <g transform="translate(1020, 80)">
    <!-- T-piece -->
    <rect class="magenta" x="0" y="0" width="24" height="24" rx="3"/>
    <rect class="magenta" x="30" y="0" width="24" height="24" rx="3"/>
    <rect class="magenta" x="60" y="0" width="24" height="24" rx="3"/>
    <rect class="magenta" x="30" y="30" width="24" height="24" rx="3"/>
  </g>

  <!-- Decorative blocks - bottom left -->
  <g transform="translate(50, 480)">
    <!-- O-piece -->
    <rect class="yellow" x="0" y="0" width="24" height="24" rx="3"/>
    <rect class="yellow" x="30" y="0" width="24" height="24" rx="3"/>
    <rect class="yellow" x="0" y="30" width="24" height="24" rx="3"/>
    <rect class="yellow" x="30" y="30" width="24" height="24" rx="3"/>
  </g>

  <g transform="translate(150, 500)">
    <!-- S-piece -->
    <rect class="green" x="30" y="0" width="24" height="24" rx="3"/>
    <rect class="green" x="60" y="0" width="24" height="24" rx="3"/>
    <rect class="green" x="0" y="30" width="24" height="24" rx="3"/>
    <rect class="green" x="30" y="30" width="24" height="24" rx="3"/>
  </g>

  <!-- Logo -->
  <g transform="translate(600, 180)">
    <!-- Phlix text -->
    <text x="0" y="0" class="text" font-size="72" font-weight="700" fill="url(#textGrad)">Phlix</text>
  </g>

  <!-- Tagline -->
  <text x="600" y="280" class="text" font-size="28" text-anchor="middle" fill="#A0A0A0">Your media. Your library. Your Phlix.</text>

  <!-- Tetromino blocks as separators -->
  <g transform="translate(480, 340)">
    <rect class="cyan" x="0" y="0" width="16" height="16" rx="2"/>
    <rect class="yellow" x="20" y="0" width="16" height="16" rx="2"/>
    <rect class="magenta" x="40" y="0" width="16" height="16" rx="2"/>
    <rect class="green" x="60" y="0" width="16" height="16" rx="2"/>
    <rect class="red" x="80" y="0" width="16" height="16" rx="2"/>
    <rect class="blue" x="100" y="0" width="16" height="16" rx="2"/>
    <rect class="orange" x="120" y="0" width="16" height="16" rx="2"/>
  </g>

  <!-- Subtext -->
  <text x="600" y="420" class="text" font-size="20" text-anchor="middle" fill="#666">Self-hosted media server</text>

  <!-- Bottom tagline -->
  <text x="600" y="580" class="text" font-size="16" text-anchor="middle" fill="#00FFFF">Open-source media, on your terms.</text>
</svg>
