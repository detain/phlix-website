<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Dark background -->
  <rect width="1200" height="630" fill="#0D0D0D"/>

  <!-- Subtle gradient overlay -->
  <defs>
    <radialGradient id="glow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#00FF88" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0D0D0D" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- EQ Spectrum Bars (decorative, behind text) -->
  <g transform="translate(100, 200)" opacity="0.15">
    <rect x="0" y="100" width="20" height="200" rx="4" fill="#00FF88"/>
    <rect x="30" y="60" width="20" height="240" rx="4" fill="#00FF88"/>
    <rect x="60" y="20" width="20" height="280" rx="4" fill="#00FF88"/>
    <rect x="90" y="80" width="20" height="220" rx="4" fill="#00FF88"/>
    <rect x="120" y="40" width="20" height="260" rx="4" fill="#00FF88"/>
    <rect x="150" y="90" width="20" height="210" rx="4" fill="#00FF88"/>
    <rect x="180" y="50" width="20" height="250" rx="4" fill="#00FF88"/>
    <rect x="210" y="70" width="20" height="230" rx="4" fill="#00FF88"/>
    <rect x="240" y="30" width="20" height="270" rx="4" fill="#00FF88"/>
    <rect x="270" y="85" width="20" height="215" rx="4" fill="#00FF88"/>
    <rect x="300" y="55" width="20" height="245" rx="4" fill="#00FF88"/>
    <rect x="330" y="75" width="20" height="225" rx="4" fill="#00FF88"/>
    <rect x="360" y="25" width="20" height="275" rx="4" fill="#00FF88"/>
    <rect x="390" y="95" width="20" height="205" rx="4" fill="#00FF88"/>
    <rect x="420" y="45" width="20" height="255" rx="4" fill="#00FF88"/>
  </g>

  <!-- Right side EQ bars (mirror) -->
  <g transform="translate(680, 200) scale(-1,1)" opacity="0.15">
    <rect x="0" y="100" width="20" height="200" rx="4" fill="#00FF88"/>
    <rect x="30" y="60" width="20" height="240" rx="4" fill="#00FF88"/>
    <rect x="60" y="20" width="20" height="280" rx="4" fill="#00FF88"/>
    <rect x="90" y="80" width="20" height="220" rx="4" fill="#00FF88"/>
    <rect x="120" y="40" width="20" height="260" rx="4" fill="#00FF88"/>
    <rect x="150" y="90" width="20" height="210" rx="4" fill="#00FF88"/>
    <rect x="180" y="50" width="20" height="250" rx="4" fill="#00FF88"/>
    <rect x="210" y="70" width="20" height="230" rx="4" fill="#00FF88"/>
    <rect x="240" y="30" width="20" height="270" rx="4" fill="#00FF88"/>
    <rect x="270" y="85" width="20" height="215" rx="4" fill="#00FF88"/>
    <rect x="300" y="55" width="20" height="245" rx="4" fill="#00FF88"/>
    <rect x="330" y="75" width="20" height="225" rx="4" fill="#00FF88"/>
    <rect x="360" y="25" width="20" height="275" rx="4" fill="#00FF88"/>
    <rect x="390" y="95" width="20" height="205" rx="4" fill="#00FF88"/>
    <rect x="420" y="45" width="20" height="255" rx="4" fill="#00FF88"/>
  </g>

  <!-- Logo / Wordmark -->
  <g transform="translate(600, 280)">
    <!-- Mini EQ bars next to wordmark -->
    <g transform="translate(-220, -15)">
      <rect x="0" y="10" width="6" height="20" rx="1" fill="#00FF88" opacity="0.6"/>
      <rect x="10" y="5" width="6" height="30" rx="1" fill="#00FF88" opacity="0.8"/>
      <rect x="20" y="0" width="6" height="40" rx="1" fill="#00FF88"/>
      <rect x="30" y="8" width="6" height="24" rx="1" fill="#00FF88" opacity="0.7"/>
      <rect x="40" y="3" width="6" height="34" rx="1" fill="#00FF88" opacity="0.9"/>
    </g>

    <!-- PHLIX text -->
    <text x="0" y="0" font-family="Orbitron, 'Bebas Neue', sans-serif" font-size="72" font-weight="700" fill="#E8E8E8" letter-spacing="0.15em" text-anchor="middle">PHLIX</text>
  </g>

  <!-- Tagline -->
  <text x="600" y="370" font-family="Barlow, system-ui, sans-serif" font-size="24" fill="#7A7A7A" text-anchor="middle" letter-spacing="0.05em">Self-hosted media server</text>

  <!-- Decorative line -->
  <rect x="500" y="400" width="200" height="2" rx="1" fill="#333333"/>

  <!-- Subtitle -->
  <text x="600" y="440" font-family="Barlow, system-ui, sans-serif" font-size="18" fill="#00FF88" text-anchor="middle">Your media. Your library. Your Phlix.</text>

  <!-- Bottom accent bar -->
  <rect x="0" y="620" width="1200" height="10" fill="#00FF88" opacity="0.3"/>
  <rect x="0" y="620" width="400" height="10" fill="#00FF88" opacity="0.6"/>
  <rect x="400" y="620" width="200" height="10" fill="#0099FF" opacity="0.5"/>
  <rect x="600" y="620" width="200" height="10" fill="#FF0080" opacity="0.4"/>
</svg>
