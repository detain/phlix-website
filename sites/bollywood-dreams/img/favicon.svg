<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Phlix favicon">
  <title>Phlix favicon</title>
  <desc>Marigold gold peacock feather eye on midnight mandir</desc>

  <!-- Background — midnight mandir -->
  <rect width="32" height="32" fill="#0A0505" rx="4"/>

  <!-- Marigold gold ring -->
  <circle cx="16" cy="16" r="10" fill="none" stroke="#F5A800" stroke-width="1.5"/>

  <!-- Inner ring -->
  <circle cx="16" cy="16" r="6" fill="none" stroke="#F5A800" stroke-width="1" opacity="0.6"/>

  <!-- Peacock teal inner -->
  <circle cx="16" cy="16" r="3" fill="#00A8CC" opacity="0.7"/>

  <!-- Marigold gold center dot -->
  <circle cx="16" cy="16" r="1.5" fill="#F5A800"/>

  <!-- Fuchsia accent dot -->
  <circle cx="16" cy="11.5" r="0.8" fill="#CC0066"/>
</svg>
