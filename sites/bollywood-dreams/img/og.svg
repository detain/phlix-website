<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Phlix social share image">
  <title>Phlix — Every Story Deserves a Grand Entrance.</title>
  <desc>Bollywood Dreams brand card for social sharing: marigold gold and midnight mandir with Phlix wordmark</desc>

  <!-- Background — midnight mandir -->
  <rect width="1200" height="630" fill="#0A0505"/>

  <!-- Holi Burst gradient overlay (subtle) -->
  <defs>
    <linearGradient id="holiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#CC0066" stop-opacity="0.12"/>
      <stop offset="50%" stop-color="#F5A800" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#00A8CC" stop-opacity="0.1"/>
    </linearGradient>
    <radialGradient id="chandelierGrad" cx="50%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#F5A800" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#F5A800" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#holiGrad)"/>
  <rect width="1200" height="630" fill="url(#chandelierGrad)"/>

  <!-- Rangoli pattern — subtle background texture -->
  <g fill="none" stroke="#3D1A0A" stroke-width="0.5" opacity="0.3">
    <circle cx="600" cy="315" r="280"/>
    <circle cx="600" cy="315" r="240"/>
    <circle cx="600" cy="315" r="200"/>
    <line x1="600" y1="35" x2="600" y2="595"/>
    <line x1="320" y1="315" x2="880" y2="315"/>
    <line x1="420" y1="135" x2="780" y2="495"/>
    <line x1="780" y1="135" x2="420" y2="495"/>
  </g>

  <!-- Mughal arch decorative top -->
  <path d="M300 160 Q300 60 400 60 L800 60 Q900 60 900 160"
        fill="none" stroke="#F5A800" stroke-width="2" opacity="0.5"/>

  <!-- Rangoli corner ornaments -->
  <g fill="none" stroke="#F5A800" stroke-width="1.5" opacity="0.6">
    <circle cx="300" cy="60" r="8"/>
    <circle cx="300" cy="60" r="4"/>
    <circle cx="900" cy="60" r="8"/>
    <circle cx="900" cy="60" r="4"/>
  </g>

  <!-- Phlix wordmark — large centered -->
  <text x="600" y="310"
        font-family="Georgia, serif"
        font-style="italic"
        font-weight="bold"
        font-size="120"
        fill="#FFF5E0"
        text-anchor="middle"
        letter-spacing="-0.01em">Phlix</text>

  <!-- Tagline primary -->
  <text x="600" y="380"
        font-family="Georgia, serif"
        font-size="36"
        fill="#F5A800"
        text-anchor="middle"
        font-style="italic"
        letter-spacing="0.02em">Every Story Deserves a Grand Entrance.</text>

  <!-- Decorative divider -->
  <line x1="400" y1="420" x2="800" y2="420" stroke="#F5A800" stroke-width="1" opacity="0.4"/>
  <circle cx="600" cy="420" r="4" fill="#F5A800" opacity="0.4"/>

  <!-- Bottom tagline -->
  <text x="600" y="480"
        font-family="Georgia, serif"
        font-size="24"
        fill="#7A5040"
        text-anchor="middle">Self-hosted PHP media server</text>

  <!-- Peacock feather pair — decorative bottom corners -->
  <g transform="translate(160, 480)" fill="none" stroke="#F5A800" stroke-width="1.5" opacity="0.5">
    <!-- Feather 1 -->
    <path d="M0 60 Q6 35 4 10 Q2 0 12 2"/>
    <path d="M4 56 Q14 48 12 38 Q10 28 18 24" opacity="0.8"/>
    <path d="M4 48 Q12 44 10 35 Q8 28 15 24" opacity="0.6"/>
    <path d="M4 40 Q10 38 8 31 Q6 25 12 21" opacity="0.4"/>
    <circle cx="12" cy="4" r="2" fill="#F5A800" stroke="none" opacity="0.7"/>
  </g>

  <g transform="translate(1000, 480) scale(-1,1)" fill="none" stroke="#F5A800" stroke-width="1.5" opacity="0.5">
    <!-- Feather 2 -->
    <path d="M0 60 Q6 35 4 10 Q2 0 12 2"/>
    <path d="M4 56 Q14 48 12 38 Q10 28 18 24" opacity="0.8"/>
    <path d="M4 48 Q12 44 10 35 Q8 28 15 24" opacity="0.6"/>
    <path d="M4 40 Q10 38 8 31 Q6 25 12 21" opacity="0.4"/>
    <circle cx="12" cy="4" r="2" fill="#F5A800" stroke="none" opacity="0.7"/>
  </g>

  <!-- Bottom border line -->
  <line x1="100" y1="560" x2="1100" y2="560" stroke="#3D1A0A" stroke-width="1" opacity="0.6"/>
</svg>
