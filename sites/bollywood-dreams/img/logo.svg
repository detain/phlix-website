<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 72" role="img" aria-label="Phlix logo">
  <title>Phlix</title>
  <desc>Bollywood Dreams branding — Phlix wordmark with peacock feather accent in marigold gold on midnight mandir</desc>

  <!-- Background -->
  <rect width="280" height="72" fill="#0A0505" rx="4"/>

  <!-- Mughal arch outer frame -->
  <path d="M20 68 L20 28 Q20 8 40 8 L240 8 Q260 8 260 28 L260 68"
        fill="none" stroke="#F5A800" stroke-width="1" opacity="0.7"/>

  <!-- Rangoli corner ornaments -->
  <g fill="none" stroke="#F5A800" stroke-width="0.75" opacity="0.5">
    <!-- Top-left -->
    <circle cx="20" cy="8" r="5"/>
    <circle cx="20" cy="8" r="3"/>
    <line x1="20" y1="3" x2="20" y2="0"/>
    <line x1="25" y1="8" x2="28" y2="8"/>

    <!-- Top-right -->
    <circle cx="260" cy="8" r="5"/>
    <circle cx="260" cy="8" r="3"/>
    <line x1="260" y1="3" x2="260" y2="0"/>
    <line x1="255" y1="8" x2="252" y2="8"/>
  </g>

  <!-- Phlix wordmark — Playfair Display italic in jasmine white -->
  <text x="140" y="46"
        font-family="Georgia, serif"
        font-style="italic"
        font-weight="bold"
        font-size="32"
        fill="#FFF5E0"
        text-anchor="middle"
        letter-spacing="-0.01em">Phlix</text>

  <!-- Peacock feather accent — subtle gold at right -->
  <g transform="translate(222, 22)" fill="none" stroke="#F5A800" stroke-width="1.25" stroke-linecap="round">
    <!-- Feather shaft -->
    <path d="M0 24 Q4 14 2 4 Q0 -2 8 0"/>
    <!-- Feather vanes -->
    <path d="M2 22 Q10 18 8 12 Q6 6 12 4" opacity="0.9"/>
    <path d="M2 18 Q8 16 7 11 Q5 7 10 5" opacity="0.7"/>
    <path d="M2 14 Q7 13 6 9 Q4 6 9 4" opacity="0.5"/>
    <path d="M2 10 Q6 10 5 7 Q4 4 8 3" opacity="0.4"/>
    <!-- Eye of feather -->
    <circle cx="8" cy="2" r="1.5" fill="#F5A800" stroke="none" opacity="0.8"/>
    <circle cx="8" cy="2" r="0.75" fill="#CC0066" stroke="none" opacity="0.6"/>
  </g>

  <!-- Marigold dot accent at left -->
  <circle cx="24" cy="40" r="3" fill="#F5A800" opacity="0.6"/>

  <!-- Bottom decorative line -->
  <line x1="60" y1="62" x2="220" y2="62" stroke="#3D1A0A" stroke-width="0.75" opacity="0.8"/>
  <circle cx="140" cy="62" r="2" fill="#3D1A0A" opacity="0.8"/>
</svg>
