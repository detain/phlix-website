<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img">
  <title>Phlix — Every Frame a Revelation</title>
  <defs>
    <linearGradient id="ogBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E0A1A"/>
      <stop offset="50%" stop-color="#1A1230"/>
      <stop offset="100%" stop-color="#0E0A1A"/>
    </linearGradient>
    <radialGradient id="candleGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(201,146,46,0.25)"/>
      <stop offset="100%" stop-color="rgba(14,10,26,0)"/>
    </radialGradient>
    <linearGradient id="ogGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C9922E"/>
      <stop offset="100%" stop-color="#9A6E20"/>
    </linearGradient>
    <filter id="textGlow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#ogBgGrad)"/>

  <!-- Center candle glow -->
  <ellipse cx="600" cy="315" rx="500" ry="300" fill="url(#candleGlow)"/>

  <!-- Top ornament bar -->
  <path d="M0 60 Q300 30 600 50 Q900 30 1200 60 L1200 70 Q900 40 600 60 Q300 40 0 70 Z"
        fill="url(#ogGold)" opacity="0.3"/>

  <!-- Bottom ornament bar -->
  <path d="M0 570 Q300 600 600 580 Q900 600 1200 570 L1200 560 Q900 590 600 570 Q300 590 0 560 Z"
        fill="url(#ogGold)" opacity="0.3"/>

  <!-- Left mask decorative element -->
  <g transform="translate(80, 280)" opacity="0.15">
    <ellipse cx="60" cy="45" rx="55" ry="42" fill="none" stroke="#C9922E" stroke-width="2"/>
    <path d="M25 40 Q45 25 60 40 Q75 25 95 40" fill="none" stroke="#C9922E" stroke-width="1.5"/>
    <circle cx="40" cy="35" r="4" fill="#C9922E"/>
    <circle cx="80" cy="35" r="4" fill="#C9922E"/>
  </g>

  <!-- Right mask decorative element -->
  <g transform="translate(1020, 280) scale(-1,1)" opacity="0.15">
    <ellipse cx="60" cy="45" rx="55" ry="42" fill="none" stroke="#C9922E" stroke-width="2"/>
    <path d="M25 40 Q45 25 60 40 Q75 25 95 40" fill="none" stroke="#C9922E" stroke-width="1.5"/>
    <circle cx="40" cy="35" r="4" fill="#C9922E"/>
    <circle cx="80" cy="35" r="4" fill="#C9922E"/>
  </g>

  <!-- Eyebrow -->
  <text x="600" y="220"
        font-family="Georgia, serif"
        font-size="18"
        letter-spacing="0.3em"
        text-anchor="middle"
        fill="#C9922E"
        opacity="0.9">SELF-HOSTED MEDIA SERVER</text>

  <!-- Main wordmark -->
  <text x="600" y="350"
        font-family="Georgia, serif"
        font-size="96"
        font-weight="bold"
        letter-spacing="0.15em"
        text-anchor="middle"
        fill="#F2EDDF"
        filter="url(#textGlow)">Phlix</text>

  <!-- Gold rule -->
  <rect x="400" y="370" width="400" height="2" rx="1" fill="url(#ogGold)" opacity="0.7"/>

  <!-- Tagline -->
  <text x="600" y="420"
        font-family="Georgia, serif"
        font-size="28"
        font-style="italic"
        letter-spacing="0.08em"
        text-anchor="middle"
        fill="#C9922E">Every Frame a Revelation.</text>

  <!-- Bottom tagline -->
  <text x="600" y="530"
        font-family="Georgia, serif"
        font-size="16"
        letter-spacing="0.15em"
        text-anchor="middle"
        fill="#F2EDDF"
        opacity="0.6">VENETIAN MASQUERADE</text>
</svg>
