<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 80" role="img" aria-label="Phlix logo">
  <title>Phlix — Venetian Masquerade</title>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E0A1A"/>
      <stop offset="100%" stop-color="#1A1230"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C9922E"/>
      <stop offset="100%" stop-color="#9A6E20"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background cartouche -->
  <rect x="0" y="0" width="240" height="80" rx="8" fill="url(#bgGrad)"/>

  <!-- Top ornament -->
  <path d="M120 8 Q100 14 80 10 Q100 18 120 14 Q140 18 160 10 Q140 14 120 8Z"
        fill="url(#goldGrad)" opacity="0.9"/>

  <!-- Left flourish -->
  <path d="M16 40 Q8 32 12 20 Q20 28 24 36 Q20 28 16 40Z"
        fill="url(#goldGrad)" opacity="0.7"/>
  <path d="M20 40 Q14 30 18 22 Q24 30 28 38Z"
        fill="url(#goldGrad)" opacity="0.5"/>

  <!-- Right flourish -->
  <path d="M224 40 Q232 32 228 20 Q220 28 216 36 Q220 28 224 40Z"
        fill="url(#goldGrad)" opacity="0.7"/>
  <path d="M220 40 Q226 30 222 22 Q216 30 212 38Z"
        fill="url(#goldGrad)" opacity="0.5"/>

  <!-- Wordmark: Phlix -->
  <text x="120" y="52"
        font-family="Georgia, serif"
        font-size="34"
        font-weight="bold"
        letter-spacing="0.1em"
        text-anchor="middle"
        fill="#F2EDDF"
        filter="url(#glow)">Phlix</text>

  <!-- Subtle gold rule below -->
  <rect x="60" y="60" width="120" height="1" rx="0.5" fill="url(#goldGrad)" opacity="0.6"/>

  <!-- Bottom ornament -->
  <path d="M120 72 Q100 66 80 70 Q100 62 120 66 Q140 62 160 70 Q140 66 120 72Z"
        fill="url(#goldGrad)" opacity="0.9"/>

  <!-- Mask silhouette accent (stylized volto eye-slit) -->
  <path d="M108 40 Q112 37 116 40 Q120 37 124 40 Q120 43 116 40 Q112 43 108 40Z"
        fill="url(#goldGrad)" opacity="0.85"/>
</svg>
