<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <rect width="1200" height="630" fill="#0D0D0D"/>
  <!-- Matrix rain effect background -->
  <rect x="0" y="0" width="1200" height="630" fill="url(#matrix-gradient)" opacity="0.1"/>
  <defs>
    <linearGradient id="matrix-gradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00FF41"/>
      <stop offset="100%" stop-color="#003B00"/>
    </linearGradient>
  </defs>
  <!-- Wordmark -->
  <text x="600" y="320" font-family="monospace" font-size="120" font-weight="bold" fill="#00FF41" text-anchor="middle" letter-spacing="20">PHLIX</text>
  <!-- Tagline -->
  <text x="600" y="380" font-family="monospace" font-size="24" fill="#4A4A4A" text-anchor="middle" letter-spacing="8">BREACH THE ARCHIVE. OWN THE STREAM.</text>
  <!-- Decorative line -->
  <rect x="400" y="400" width="400" height="2" fill="#00FF41" opacity="0.3"/>
</svg>
