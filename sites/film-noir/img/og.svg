<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="50%" stop-color="#F5D76E"/>
      <stop offset="100%" stop-color="#B8942F"/>
    </linearGradient>
    <radialGradient id="smoke" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1A1A1A" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0D0D0D" stop-opacity="0.8"/>
    </radialGradient>
    <clipPath id="blinds">
      <rect x="0" y="0" width="1200" height="630"/>
    </clipPath>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="#0D0D0D"/>
  
  <!-- Smoke/atmosphere gradient overlay -->
  <rect width="1200" height="630" fill="url(#smoke)"/>
  
  <!-- Venetian blind light stripes -->
  <g clip-path="url(#blinds)" opacity="0.08">
    <rect x="0" y="0" width="4" height="630" fill="#000" transform="skewX(-15)"/>
    <rect x="50" y="0" width="4" height="630" fill="#000" transform="skewX(-15)"/>
    <rect x="100" y="0" width="4" height="630" fill="#000" transform="skewX(-15)"/>
    <rect x="150" y="0" width="4" height="630" fill="#000" transform="skewX(-15)"/>
    <rect x="200" y="0" width="4" height="630" fill="#000" transform="skewX(-15)"/>
    <rect x="250" y="0" width="4" height="630" fill="#000" transform="skewX(-15)"/>
    <rect x="300" y="0" width="4" height="630" fill="#000" transform="skewX(-15)"/>
    <rect x="350" y="0" width="4" height="630" fill="#000" transform="skewX(-15)"/>
    <rect x="400" y="0" width="4" height="630" fill="#000" transform="skewX(-15)"/>
    <rect x="450" y="0" width="4" height="630" fill="#000" transform="skewX(-15)"/>
    <rect x="500" y="0" width="4" height="630" fill="#000" transform="skewX(-15)"/>
    <rect x="550" y="0" width="4" height="630" fill="#000" transform="skewX(-15)"/>
    <rect x="600" y="0" width="4" height="630" fill="#000" transform="skewX(-15)"/>
    <rect x="650" y="0" width="4" height="630" fill="#000" transform="skewX(-15)"/>
    <rect x="700" y="0" width="4" height="630" fill="#000" transform="skewX(-15)"/>
    <rect x="750" y="0" width="4" height="630" fill="#000" transform="skewX(-15)"/>
    <rect x="800" y="0" width="4" height="630" fill="#000" transform="skewX(-15)"/>
    <rect x="850" y="0" width="4" height="630" fill="#000" transform="skewX(-15)"/>
    <rect x="900" y="0" width="4" height="630" fill="#000" transform="skewX(-15)"/>
    <rect x="950" y="0" width="4" height="630" fill="#000" transform="skewX(-15)"/>
    <rect x="1000" y="0" width="4" height="630" fill="#000" transform="skewX(-15)"/>
    <rect x="1050" y="0" width="4" height="630" fill="#000" transform="skewX(-15)"/>
    <rect x="1100" y="0" width="4" height="630" fill="#000" transform="skewX(-15)"/>
    <rect x="1150" y="0" width="4" height="630" fill="#000" transform="skewX(-15)"/>
  </g>
  
  <!-- Spotlight glow -->
  <ellipse cx="600" cy="280" rx="400" ry="250" fill="url(#gold)" opacity="0.06"/>
  
  <!-- Film reel icon -->
  <g transform="translate(560, 100)">
    <!-- Outer circle -->
    <circle cx="40" cy="40" r="36" stroke="url(#gold)" stroke-width="3" fill="none"/>
    <!-- Inner circle -->
    <circle cx="40" cy="40" r="22" stroke="url(#gold)" stroke-width="2" fill="none"/>
    <!-- Center -->
    <circle cx="40" cy="40" r="6" fill="#D4AF37"/>
    <!-- Spokes -->
    <line x1="40" y1="4" x2="40" y2="18" stroke="#D4AF37" stroke-width="3"/>
    <line x1="40" y1="62" x2="40" y2="76" stroke="#D4AF37" stroke-width="3"/>
    <line x1="4" y1="40" x2="18" y2="40" stroke="#D4AF37" stroke-width="3"/>
    <line x1="62" y1="40" x2="76" y2="40" stroke="#D4AF37" stroke-width="3"/>
    <!-- Play triangle -->
    <polygon points="34,28 34,52 54,40" fill="#D4AF37"/>
  </g>
  
  <!-- PHLIX text -->
  <text x="600" y="260" text-anchor="middle" font-family="Georgia, serif" font-size="72" font-weight="bold" letter-spacing="16" fill="url(#gold)">PHLIX</text>
  
  <!-- Tagline -->
  <text x="600" y="320" text-anchor="middle" font-family="Georgia, serif" font-size="28" fill="#F5F5F5">Your media. Your library. Your Phlix.</text>
  
  <!-- Bottom gold line -->
  <rect x="500" y="380" width="200" height="2" fill="#D4AF37"/>
  
  <!-- Bottom tagline -->
  <text x="600" y="430" text-anchor="middle" font-family="Helvetica, sans-serif" font-size="16" fill="#A0A0A0" letter-spacing="2">SELF-HOSTED MEDIA SERVER</text>
</svg>
