<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" fill="none">
  <!-- Film noir style logo with venetian blind light effect -->
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="50%" stop-color="#F5D76E"/>
      <stop offset="100%" stop-color="#B8942F"/>
    </linearGradient>
    <clipPath id="blinds">
      <rect x="0" y="0" width="200" height="60" />
    </clipPath>
  </defs>
  
  <!-- Background shadow -->
  <rect x="3" y="3" width="60" height="54" rx="2" fill="#1A1A1A" opacity="0.5"/>
  
  <!-- Film reel / play button icon -->
  <g transform="translate(10, 8)">
    <!-- Outer circle (film reel) -->
    <circle cx="22" cy="22" r="20" stroke="url(#gold)" stroke-width="2" fill="none"/>
    <!-- Inner circle -->
    <circle cx="22" cy="22" r="12" stroke="url(#gold)" stroke-width="1.5" fill="none"/>
    <!-- Center dot -->
    <circle cx="22" cy="22" r="3" fill="#D4AF37"/>
    <!-- Reel spokes -->
    <line x1="22" y1="2" x2="22" y2="10" stroke="url(#gold)" stroke-width="2"/>
    <line x1="22" y1="34" x2="22" y2="42" stroke="url(#gold)" stroke-width="2"/>
    <line x1="2" y1="22" x2="10" y2="22" stroke="url(#gold)" stroke-width="2"/>
    <line x1="34" y1="22" x2="42" y2="22" stroke="url(#gold)" stroke-width="2"/>
    <!-- Play triangle -->
    <polygon points="19,16 19,28 29,22" fill="#D4AF37"/>
  </g>
  
  <!-- Text: PHLIX -->
  <text x="70" y="42" 
        font-family="Georgia, serif" 
        font-size="36" 
        font-weight="bold" 
        letter-spacing="8"
        fill="url(#gold)">PHLIX</text>
  
  <!-- Venetian blind light stripes overlay on text -->
  <g clip-path="url(#blinds)" opacity="0.1">
    <rect x="70" y="0" width="2" height="60" fill="#000" transform="skewX(-15)"/>
    <rect x="85" y="0" width="2" height="60" fill="#000" transform="skewX(-15)"/>
    <rect x="100" y="0" width="2" height="60" fill="#000" transform="skewX(-15)"/>
    <rect x="115" y="0" width="2" height="60" fill="#000" transform="skewX(-15)"/>
    <rect x="130" y="0" width="2" height="60" fill="#000" transform="skewX(-15)"/>
    <rect x="145" y="0" width="2" height="60" fill="#000" transform="skewX(-15)"/>
    <rect x="160" y="0" width="2" height="60" fill="#000" transform="skewX(-15)"/>
    <rect x="175" y="0" width="2" height="60" fill="#000" transform="skewX(-15)"/>
    <rect x="190" y="0" width="2" height="60" fill="#000" transform="skewX(-15)"/>
  </g>
</svg>
