<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" aria-label="Phlix — Your Wall. Your Rules." role="img">
  <!-- Dark concrete background -->
  <rect width="1200" height="630" fill="#2B2B2B"/>

  <!-- Concrete texture overlay -->
  <defs>
    <filter id="noise" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="4" stitchTiles="stitch" result="noiseOut"/>
      <feColorMatrix type="saturate" values="0" in="noiseOut" result="grayNoise"/>
      <feBlend in="SourceGraphic" in2="grayNoise" mode="overlay" result="blended"/>
    </filter>
    <linearGradient id="sprayGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E81F1F"/>
      <stop offset="50%" stop-color="#FF8C00"/>
      <stop offset="100%" stop-color="#FFD600"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#sprayGrad)" opacity="0.15" filter="url(#noise)"/>

  <!-- Left concrete block panel -->
  <rect x="0" y="0" width="400" height="630" fill="#383838" opacity="0.9"/>
  <rect x="0" y="0" width="8" height="630" fill="#E81F1F"/>

  <!-- Logo mark in panel -->
  <text x="40" y="80"
    font-family="Impact, 'Haettenschweiler', 'Arial Narrow', sans-serif"
    font-size="64"
    font-weight="400"
    letter-spacing="8"
    fill="#F0F0F0">PHLIX</text>
  <circle cx="370" cy="60" r="14" fill="#E81F1F"/>
  <circle cx="370" cy="60" r="7" fill="#FFD600"/>

  <!-- Main headline -->
  <text x="440" y="280"
    font-family="Impact, 'Haettenschweiler', 'Arial Narrow', sans-serif"
    font-size="96"
    font-weight="400"
    letter-spacing="6"
    fill="#F0F0F0"
    text-transform="uppercase">YOUR WALL.</text>
  <text x="440" y="390"
    font-family="Impact, 'Haettenschweiler', 'Arial Narrow', sans-serif"
    font-size="96"
    font-weight="400"
    letter-spacing="6"
    fill="url(#sprayGrad)">YOUR RULES.</text>

  <!-- Subheadline -->
  <text x="440" y="470"
    font-family="Barlow Condensed, 'Roboto Condensed', Arial, sans-serif"
    font-size="28"
    font-weight="400"
    letter-spacing="1"
    fill="#F0F0F0"
    opacity="0.8">Self-hosted media server · BSD-3-Clause · Free forever</text>

  <!-- Spray can icon bottom right -->
  <g transform="translate(1050, 480)">
    <rect x="0" y="0" width="60" height="100" rx="6" fill="#C0C0C0"/>
    <rect x="20" y="-20" width="20" height="24" rx="4" fill="#7A7A7A"/>
    <rect x="18" y="-32" width="24" height="16" rx="2" fill="#E81F1F"/>
    <ellipse cx="30" cy="50" rx="20" ry="30" fill="#E81F1F" opacity="0.3"/>
    <text x="30" y="70"
      font-family="Arial Narrow, sans-serif"
      font-size="18"
      font-weight="700"
      fill="#0D0D0D"
      text-anchor="middle">CAP</text>
  </g>

  <!-- Decorative spray drips -->
  <circle cx="1180" cy="560" r="8" fill="#E81F1F" opacity="0.7"/>
  <circle cx="1160" cy="580" r="5" fill="#FFD600" opacity="0.6"/>
  <circle cx="1140" cy="600" r="4" fill="#E81F1F" opacity="0.5"/>
</svg>
