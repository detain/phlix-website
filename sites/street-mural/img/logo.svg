<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" width="240" height="60" aria-label="Phlix" role="img">
  <!-- Concrete panel background -->
  <rect width="240" height="60" rx="4" fill="#383838"/>
  <!-- Left accent stripe (spray-red) -->
  <rect x="0" y="0" width="6" height="60" fill="#E81F1F"/>
  <!-- Wordmark: PHLIX in Anton style -->
  <text x="18" y="44"
    font-family="Impact, 'Haettenschweiler', 'Arial Narrow', sans-serif"
    font-size="38"
    font-weight="400"
    letter-spacing="4"
    fill="#F0F0F0"
    text-transform="uppercase">PHLIX</text>
  <!-- Spray-red dot accent -->
  <circle cx="226" cy="30" r="8" fill="#E81F1F"/>
  <circle cx="226" cy="30" r="4" fill="#FFD600"/>
</svg>
