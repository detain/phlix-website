<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <!-- @copyright 2026 Phlix. MIT / MPL-2.0 license per component. -->
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0F0F1A"/>
      <stop offset="100%" style="stop-color:#1A1A2E"/>
    </linearGradient>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700"/>
      <stop offset="100%" style="stop-color:#B8860B"/>
    </linearGradient>
    <linearGradient id="silver-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#E0E0E0"/>
      <stop offset="100%" style="stop-color:#A0A0A0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="noise">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="4" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.05"/>
      </feComponentTransfer>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg-grad)"/>

  <!-- Film grain overlay -->
  <rect width="1200" height="630" filter="url(#noise)" opacity="1"/>

  <!-- Decorative art deco lines top -->
  <line x1="0" y1="80" x2="1200" y2="80" stroke="url(#gold-grad)" stroke-width="1" opacity="0.3"/>
  <line x1="0" y1="85" x2="1200" y2="85" stroke="url(#gold-grad)" stroke-width="2" opacity="0.5"/>
  <line x1="0" y1="90" x2="1200" y2="90" stroke="url(#gold-grad)" stroke-width="1" opacity="0.3"/>

  <!-- Decorative art deco lines bottom -->
  <line x1="0" y1="540" x2="1200" y2="540" stroke="url(#gold-grad)" stroke-width="1" opacity="0.3"/>
  <line x1="0" y1="545" x2="1200" y2="545" stroke="url(#gold-grad)" stroke-width="2" opacity="0.5"/>
  <line x1="0" y1="550" x2="1200" y2="550" stroke="url(#gold-grad)" stroke-width="1" opacity="0.3"/>

  <!-- Film reel icon -->
  <g transform="translate(100, 265)" filter="url(#glow)">
    <circle cx="50" cy="50" r="45" stroke="url(#gold-grad)" stroke-width="4" fill="none"/>
    <circle cx="50" cy="50" r="32" stroke="url(#gold-grad)" stroke-width="2.5" fill="none"/>
    <circle cx="50" cy="50" r="14" fill="url(#gold-grad)"/>
    <circle cx="50" cy="18" r="6" fill="#0F0F1A"/>
    <circle cx="50" cy="82" r="6" fill="#0F0F1A"/>
    <circle cx="18" cy="50" r="6" fill="#0F0F1A"/>
    <circle cx="82" cy="50" r="6" fill="#0F0F1A"/>
    <circle cx="27" cy="27" r="5" fill="#0F0F1A"/>
    <circle cx="73" cy="27" r="5" fill="#0F0F1A"/>
    <circle cx="27" cy="73" r="5" fill="#0F0F1A"/>
    <circle cx="73" cy="73" r="5" fill="#0F0F1A"/>
  </g>

  <!-- Art deco vertical lines -->
  <g opacity="0.4">
    <line x1="240" y1="200" x2="240" y2="430" stroke="url(#gold-grad)" stroke-width="2"/>
    <line x1="248" y1="220" x2="248" y2="410" stroke="url(#gold-grad)" stroke-width="1"/>
  </g>

  <!-- Text content -->
  <text x="280" y="340" font-family="Georgia, 'Times New Roman', serif" font-size="72" font-weight="bold" fill="#F5F5F5" letter-spacing="6" filter="url(#glow)">Phlix</text>

  <text x="280" y="400" font-family="'Helvetica Neue', Arial, sans-serif" font-size="28" fill="#C0C0C0" letter-spacing="2">Your media. Your library. Your Phlix.</text>

  <!-- Tagline -->
  <text x="600" y="500" font-family="'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#A0A0A0" text-anchor="middle" letter-spacing="3">OPEN-SOURCE MEDIA, ON YOUR TERMS.</text>

  <!-- Small film strip decorations left -->
  <g transform="translate(50, 120)">
    <rect x="0" y="0" width="8" height="40" rx="2" fill="url(#silver-grad)" opacity="0.3"/>
    <rect x="0" y="50" width="8" height="40" rx="2" fill="url(#silver-grad)" opacity="0.2"/>
    <rect x="0" y="100" width="8" height="40" rx="2" fill="url(#silver-grad)" opacity="0.3"/>
  </g>

  <!-- Small film strip decorations right -->
  <g transform="translate(1142, 120)">
    <rect x="0" y="0" width="8" height="40" rx="2" fill="url(#silver-grad)" opacity="0.3"/>
    <rect x="0" y="50" width="8" height="40" rx="2" fill="url(#silver-grad)" opacity="0.2"/>
    <rect x="0" y="100" width="8" height="40" rx="2" fill="url(#silver-grad)" opacity="0.3"/>
  </g>
</svg>
