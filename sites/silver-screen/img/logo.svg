<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 80" fill="none">
  <!-- @copyright 2026 Phlix. MIT / MPL-2.0 license per component. -->
  <defs>
    <linearGradient id="gold-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700"/>
      <stop offset="100%" style="stop-color:#B8860B"/>
    </linearGradient>
  </defs>

  <!-- Film reel icon -->
  <g transform="translate(10, 10)">
    <circle cx="30" cy="30" r="28" stroke="url(#gold-gradient)" stroke-width="3" fill="none"/>
    <circle cx="30" cy="30" r="20" stroke="url(#gold-gradient)" stroke-width="2" fill="none"/>
    <circle cx="30" cy="30" r="8" fill="url(#gold-gradient)"/>
    <!-- Reel spokes -->
    <circle cx="30" cy="12" r="4" fill="#0F0F1A"/>
    <circle cx="30" cy="48" r="4" fill="#0F0F1A"/>
    <circle cx="12" cy="30" r="4" fill="#0F0F1A"/>
    <circle cx="48" cy="30" r="4" fill="#0F0F1A"/>
  </g>

  <!-- Art deco lines -->
  <line x1="80" y1="20" x2="80" y2="60" stroke="url(#gold-gradient)" stroke-width="2"/>
  <line x1="85" y1="25" x2="85" y2="55" stroke="url(#gold-gradient)" stroke-width="1"/>

  <!-- Phlix text -->
  <text x="100" y="52" font-family="Georgia, 'Times New Roman', serif" font-size="36" font-weight="bold" fill="#F5F5F5" letter-spacing="4">Phlix</text>
</svg>
