<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#262019"/>
      <stop offset="100%" style="stop-color:#1A1512"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feBlend in="SourceGraphic" mode="multiply" result="noisy"/>
      <feComposite in="noisy" in2="SourceGraphic" operator="in"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg-grad)"/>

  <!-- Film grain overlay -->
  <rect width="1200" height="630" fill="#D4A574" opacity="0.03" filter="url(#grain)"/>

  <!-- Film sprocket decoration top -->
  <g opacity="0.2">
    <rect x="40" y="30" width="12" height="18" rx="3" fill="#8B7355"/>
    <rect x="70" y="30" width="12" height="18" rx="3" fill="#8B7355"/>
    <rect x="100" y="30" width="12" height="18" rx="3" fill="#8B7355"/>
    <rect x="1088" y="30" width="12" height="18" rx="3" fill="#8B7355"/>
    <rect x="1118" y="30" width="12" height="18" rx="3" fill="#8B7355"/>
    <rect x="1148" y="30" width="12" height="18" rx="3" fill="#8B7355"/>
  </g>

  <!-- Film sprocket decoration bottom -->
  <g opacity="0.2">
    <rect x="40" y="582" width="12" height="18" rx="3" fill="#8B7355"/>
    <rect x="70" y="582" width="12" height="18" rx="3" fill="#8B7355"/>
    <rect x="100" y="582" width="12" height="18" rx="3" fill="#8B7355"/>
    <rect x="1088" y="582" width="12" height="18" rx="3" fill="#8B7355"/>
    <rect x="1118" y="582" width="12" height="18" rx="3" fill="#8B7355"/>
    <rect x="1148" y="582" width="12" height="18" rx="3" fill="#8B7355"/>
  </g>

  <!-- Center logo / wordmark -->
  <g transform="translate(600, 280)">
    <!-- Film reel icon -->
    <circle cx="-120" cy="0" r="50" stroke="#D4A574" stroke-width="4" fill="none" filter="url(#glow)"/>
    <circle cx="-120" cy="0" r="18" fill="#D4A574"/>
    <circle cx="-120" cy="-24" r="8" fill="#D4A574"/>
    <circle cx="-120" cy="24" r="8" fill="#D4A574"/>
    <circle cx="-144" cy="0" r="8" fill="#D4A574"/>
    <circle cx="-96" cy="0" r="8" fill="#D4A574"/>

    <!-- Phlix text -->
    <text x="0" y="15" font-family="Georgia, serif" font-size="96" font-weight="700" fill="#F0E6D3" text-anchor="middle">Phlix</text>
  </g>

  <!-- Tagline -->
  <text x="600" y="400" font-family="Georgia, serif" font-size="28" fill="#A89888" text-anchor="middle" dominant-baseline="middle">Your media. Your library. Your terms.</text>

  <!-- Accent line -->
  <rect x="500" y="430" width="200" height="3" rx="1.5" fill="#C9A227" opacity="0.7"/>

  <!-- Date stamp decoration -->
  <text x="600" y="500" font-family="monospace" font-size="16" fill="#6B5B4F" text-anchor="middle" opacity="0.5">● 2024</text>
</svg>
