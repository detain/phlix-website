<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 64" role="img" aria-label="Phlix logo">
  <title>Phlix</title>
  <desc>Día de Muertos brand — marigold gold wordmark on midnight cemetery dark</desc>

  <!-- Papel picado decorative top border (arch-top panel) -->
  <defs>
    <clipPath id="arch-clip">
      <path d="M8 64 L8 20 Q8 4 24 4 L216 4 Q232 4 232 20 L232 64 Z"/>
    </clipPath>
  </defs>

  <!-- Background panel -->
  <rect width="240" height="64" rx="8" fill="#0C0512"/>

  <!-- Papel picado diamond pattern border (top arch) -->
  <path d="M8 64 L8 20 Q8 4 24 4 L216 4 Q232 4 232 20 L232 64"
        fill="none" stroke="#CC00BB" stroke-width="1.5" opacity="0.7"/>
  <path d="M12 64 L12 22 Q12 8 26 8 L214 8 Q228 8 228 22 L228 64"
        fill="none" stroke="#2D1845" stroke-width="1" opacity="0.8"/>

  <!-- Papel picado cut-diamond decorative dots along top -->
  <g fill="#CC00BB" opacity="0.5">
    <circle cx="20" cy="12" r="2.5"/>
    <circle cx="36" cy="10" r="2"/>
    <circle cx="52" cy="10" r="2"/>
    <circle cx="68" cy="10" r="2"/>
    <circle cx="84" cy="10" r="2"/>
    <circle cx="100" cy="10" r="2"/>
    <circle cx="116" cy="10" r="2"/>
    <circle cx="132" cy="10" r="2"/>
    <circle cx="148" cy="10" r="2"/>
    <circle cx="164" cy="10" r="2"/>
    <circle cx="180" cy="10" r="2"/>
    <circle cx="196" cy="10" r="2"/>
    <circle cx="212" cy="10" r="2"/>
    <circle cx="220" cy="12" r="2.5"/>
  </g>

  <!-- Side papel picado diamond accents -->
  <g fill="none" stroke="#FFB800" stroke-width="0.8" opacity="0.3">
    <!-- Left side diamonds -->
    <path d="M8 30 L4 34 L8 38 L12 34 Z"/>
    <path d="M8 44 L4 48 L8 52 L12 48 Z"/>
    <!-- Right side diamonds -->
    <path d="M232 30 L228 34 L232 38 L236 34 Z"/>
    <path d="M232 44 L228 48 L232 52 L236 48 Z"/>
  </g>

  <!-- Wordmark: "Phlix" -->
  <!--
    Using SVG text with system serif fallback for Cinzel-like look.
    Color: #FFB800 (cempasúchil gold)
    For production: replace with embedded Cinzel Decorative WOFF2
  -->
  <text
    x="120" y="44"
    text-anchor="middle"
    font-family="'Cinzel Decorative', 'Trajan Pro', 'Times New Roman', serif"
    font-weight="700"
    font-size="26"
    letter-spacing="0.1em"
    fill="#FFB800"
    clip-path="url(#arch-clip)">Phlix</text>

  <!-- Warm marigold glow behind text -->
  <rect x="48" y="18" width="144" height="30" rx="4"
        fill="url(#text-glow)" opacity="0.15"/>

  <defs>
    <radialGradient id="text-glow">
      <stop offset="0%" stop-color="#FFB800"/>
      <stop offset="100%" stop-color="#FFB800" stop-opacity="0"/>
    </radialGradient>
  </defs>
</svg>
