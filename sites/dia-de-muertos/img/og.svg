<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Phlix social share image">
  <title>Phlix — Remember. Celebrate. Live.</title>
  <desc>Día de Muertos brand social share card — cempasúchil marigold on midnight cemetery</desc>

  <defs>
    <!-- Warm marigold radial glow -->
    <radialGradient id="og-glow" cx="50%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#FFB800" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#CC00BB" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#0C0512" stop-opacity="0"/>
    </radialGradient>

    <!-- Papel picado diamond clip path pattern for border -->
    <pattern id="pp-border" x="0" y="0" width="40" height="24" patternUnits="userSpaceOnUse">
      <path d="M20 2 L28 10 L20 18 L12 10 Z" fill="none" stroke="#CC00BB" stroke-width="1" opacity="0.5"/>
      <circle cx="20" cy="10" r="2" fill="#FFB800" opacity="0.6"/>
    </pattern>
  </defs>

  <!-- Background: midnight cemetery -->
  <rect width="1200" height="630" fill="#0C0512"/>

  <!-- Warm glow overlay -->
  <rect width="1200" height="630" fill="url(#og-glow)"/>

  <!-- Top papel picado decorative band -->
  <rect x="0" y="0" width="1200" height="40" fill="url(#pp-border)" opacity="0.8"/>

  <!-- Bottom papel picado decorative band -->
  <g transform="translate(0,590)">
    <rect x="0" y="0" width="1200" height="40" fill="url(#pp-border)" opacity="0.8" transform="rotate(180 600 20)"/>
  </g>

  <!-- Left edge papel picado -->
  <g transform="translate(0,40)">
    <rect x="0" y="0" width="16" height="510" fill="url(#pp-border)" opacity="0.4" transform="rotate(90 8 255)"/>
  </g>

  <!-- Right edge papel picado -->
  <g transform="translate(1184,40)">
    <rect x="0" y="0" width="16" height="510" fill="url(#pp-border)" opacity="0.4" transform="rotate(90 8 255)"/>
  </g>

  <!-- Inner frame border -->
  <rect x="24" y="24" width="1152" height="582" rx="8"
        fill="none" stroke="#2D1845" stroke-width="1.5" opacity="0.6"/>
  <rect x="32" y="32" width="1136" height="566" rx="4"
        fill="none" stroke="#FFB800" stroke-width="0.5" opacity="0.2"/>

  <!-- Decorative marigold petals floating (subtle) -->
  <g fill="#FFB800" opacity="0.12">
    <ellipse cx="100" cy="560" rx="8" ry="16" transform="rotate(-15 100 560)"/>
    <ellipse cx="200" cy="580" rx="6" ry="12" transform="rotate(20 200 580)"/>
    <ellipse cx="1050" cy="70" rx="8" ry="16" transform="rotate(30 1050 70)"/>
    <ellipse cx="1100" cy="520" rx="6" ry="12" transform="rotate(-25 1100 520)"/>
    <ellipse cx="80" cy="100" rx="5" ry="10" transform="rotate(45 80 100)"/>
    <ellipse cx="1120" cy="450" rx="5" ry="10" transform="rotate(-35 1120 450)"/>
  </g>

  <!-- "Phlix" wordmark -->
  <text
    x="600" y="240"
    text-anchor="middle"
    font-family="'Cinzel Decorative', 'Trajan Pro', 'Times New Roman', serif"
    font-weight="700"
    font-size="96"
    letter-spacing="0.12em"
    fill="#FFB800"
    filter="url(#glow)"
  >Phlix</text>

  <!-- Tagline -->
  <text
    x="600" y="310"
    text-anchor="middle"
    font-family="'Playfair Display', Georgia, serif"
    font-weight="700"
    font-size="28"
    letter-spacing="0.06em"
    fill="#FFF0E8"
    opacity="0.9"
  >Remember. Celebrate. Live.</text>

  <!-- Horizontal divider -->
  <line x1="300" y1="350" x2="900" y2="350"
        stroke="#2D1845" stroke-width="1" opacity="0.8"/>
  <circle cx="300" cy="350" r="4" fill="#FFB800" opacity="0.7"/>
  <circle cx="600" cy="350" r="4" fill="#CC00BB" opacity="0.7"/>
  <circle cx="900" cy="350" r="4" fill="#FFB800" opacity="0.7"/>

  <!-- Hero headline -->
  <text
    x="600" y="430"
    text-anchor="middle"
    font-family="'Lora', Palatino, Georgia, serif"
    font-weight="400"
    font-size="26"
    fill="#FFF0E8"
    opacity="0.8"
  >Your media. Your library. Your Phlix.</text>

  <!-- Sub-text -->
  <text
    x="600" y="490"
    text-anchor="middle"
    font-family="'IBM Plex Sans', system-ui, sans-serif"
    font-weight="400"
    font-size="18"
    letter-spacing="0.04em"
    fill="#5A4070"
  >Self-hosted PHP media server</text>

  <!-- "Get Phlix" CTA pill -->
  <rect x="480" y="510" width="240" height="48" rx="24"
        fill="#FFB800"/>
  <text
    x="600" y="542"
    text-anchor="middle"
    font-family="'IBM Plex Sans', system-ui, sans-serif"
    font-weight="700"
    font-size="18"
    letter-spacing="0.04em"
    fill="#0C0512"
  >Light the First Candle →</text>

  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
</svg>
