<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Phlix favicon">
  <title>Phlix favicon</title>
  <desc>Día de Muertos brand — cempasúchil gold marigold flower on midnight cemetery</desc>

  <!-- Background: midnight cemetery -->
  <rect width="32" height="32" rx="6" fill="#0C0512"/>

  <!-- Marigold flower petals (stylized 8-petal) -->
  <g transform="translate(16,16)" fill="#FFB800">
    <!-- Outer petals -->
    <ellipse rx="4.5" ry="9" transform="rotate(0)"/>
    <ellipse rx="4.5" ry="9" transform="rotate(45)"/>
    <ellipse rx="4.5" ry="9" transform="rotate(90)"/>
    <ellipse rx="4.5" ry="9" transform="rotate(135)"/>
    <ellipse rx="4.5" ry="9" transform="rotate(180)"/>
    <ellipse rx="4.5" ry="9" transform="rotate(225)"/>
    <ellipse rx="4.5" ry="9" transform="rotate(270)"/>
    <ellipse rx="4.5" ry="9" transform="rotate(315)"/>
    <!-- Inner circle (calavera pink) -->
    <circle r="3.5" fill="#FF3355"/>
    <!-- Center dot -->
    <circle r="1.5" fill="#0C0512"/>
  </g>

  <!-- Subtle papel picado corner accents -->
  <g fill="none" stroke="#CC00BB" stroke-width="0.5" opacity="0.4">
    <path d="M2 10 L2 2 L10 2"/>
    <path d="M22 2 L30 2 L30 10"/>
    <path d="M30 22 L30 30 L22 30"/>
    <path d="M10 30 L2 30 L2 22"/>
  </g>
</svg>
