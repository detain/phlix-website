<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 80" width="240" height="80">
  <!-- Premiere Night Phlix wordmark -->
  <!-- Dark red-black background bar with gold border -->
  <rect x="0" y="15" width="240" height="55" fill="#1A0A0A" rx="4"/>
  <rect x="0" y="15" width="240" height="55" fill="none" stroke="#C9A227" stroke-width="1.5" rx="4" opacity="0.7"/>

  <!-- Gold "Phlix" in elegant serif italic -->
  <text x="18" y="52" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-style="italic" font-size="38" fill="#C9A227" letter-spacing="-1">Phlix</text>

  <!-- Gold shimmer effect on text -->
  <text x="18" y="52" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-style="italic" font-size="38" fill="none" stroke="#F5D87E" stroke-width="0.5" opacity="0.4" letter-spacing="-1">Phlix</text>

  <!-- Decorative gold marquee dots -->
  <circle cx="110" y="35" r="2" fill="#C9A227">
    <animate attributeName="opacity" values="1;0.5;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="120" cy="35" r="2" fill="#C9A227">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="130" cy="35" r="2" fill="#C9A227">
    <animate attributeName="opacity" values="1;0.5;1" dur="2s" repeatCount="indefinite" begin="0.5s"/>
  </circle>
  <circle cx="140" cy="35" r="2" fill="#C9A227">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite" begin="0.3s"/>
  </circle>
  <circle cx="150" cy="35" r="2" fill="#C9A227">
    <animate attributeName="opacity" values="1;0.5;1" dur="2s" repeatCount="indefinite" begin="0.7s"/>
  </circle>

  <!-- Gold accent line -->
  <rect x="160" y="32" width="30" height="2" fill="#C9A227" rx="1">
    <animate attributeName="width" values="30;25;30" dur="3s" repeatCount="indefinite"/>
  </rect>

  <!-- "PREMIERE NIGHT" subtitle in muted gold -->
  <text x="160" y="58" font-family="Georgia, serif" font-size="9" fill="#C9A227" opacity="0.6" letter-spacing="2" text-transform="uppercase">PREMIERE NIGHT</text>

  <!-- Spotlight glow effect -->
  <ellipse cx="120" cy="10" rx="80" ry="15" fill="url(#spotlightGradient)" opacity="0.15"/>

  <defs>
    <radialGradient id="spotlightGradient" cx="50%" cy="100%" r="100%">
      <stop offset="0%" stop-color="#C9A227"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
  </defs>
</svg>
