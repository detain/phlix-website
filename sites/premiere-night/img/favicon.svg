<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Premiere Night favicon - gold "P" on dark red-black -->
  <rect width="32" height="32" fill="#1A0A0A" rx="4"/>
  <rect width="32" height="32" fill="none" stroke="#C9A227" stroke-width="1" rx="4" opacity="0.8"/>

  <!-- Gold "P" letter -->
  <text x="7" y="23" font-family="Georgia, serif" font-weight="700" font-style="italic" font-size="20" fill="#C9A227">P</text>

  <!-- Gold shimmer -->
  <text x="7" y="23" font-family="Georgia, serif" font-weight="700" font-style="italic" font-size="20" fill="none" stroke="#F5D87E" stroke-width="0.5" opacity="0.4">P</text>
</svg>
