<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Premiere Night OG Image -->
  <!-- Dark red-black background with gold accents -->
  <rect width="1200" height="630" fill="#1A0A0A"/>

  <!-- Subtle radial spotlight from top -->
  <ellipse cx="600" cy="0" rx="800" ry="400" fill="url(#spotlightGrad)" opacity="0.15"/>

  <!-- Gold decorative border lines -->
  <line x1="50" y1="50" x2="1150" y2="50" stroke="#C9A227" stroke-width="2" opacity="0.4"/>
  <line x1="50" y1="580" x2="1150" y2="580" stroke="#C9A227" stroke-width="2" opacity="0.4"/>
  <line x1="50" y1="50" x2="50" y2="580" stroke="#C9A227" stroke-width="2" opacity="0.4"/>
  <line x1="1150" y1="50" x2="1150" y2="580" stroke="#C9A227" stroke-width="2" opacity="0.4"/>

  <!-- Decorative gold dots (marquee style) -->
  <circle cx="200" cy="80" r="4" fill="#C9A227" opacity="0.6"/>
  <circle cx="220" cy="80" r="4" fill="#C9A227" opacity="0.4"/>
  <circle cx="240" cy="80" r="4" fill="#C9A227" opacity="0.6"/>
  <circle cx="960" cy="80" r="4" fill="#C9A227" opacity="0.6"/>
  <circle cx="980" cy="80" r="4" fill="#C9A227" opacity="0.4"/>
  <circle cx="1000" cy="80" r="4" fill="#C9A227" opacity="0.6"/>

  <!-- Center content -->
  <text x="600" y="260" font-family="Georgia, serif" font-weight="700" font-style="italic" font-size="72" fill="#C9A227" text-anchor="middle" letter-spacing="-2">Phlix</text>

  <!-- Gold shimmer on Phlix text -->
  <text x="600" y="260" font-family="Georgia, serif" font-weight="700" font-style="italic" font-size="72" fill="none" stroke="#F5D87E" stroke-width="1" text-anchor="middle" letter-spacing="-2" opacity="0.3">Phlix</text>

  <!-- Tagline -->
  <text x="600" y="340" font-family="Georgia, serif" font-size="28" fill="#F5F5F5" text-anchor="middle" opacity="0.9">Open-source media, on your terms.</text>

  <!-- Red carpet line -->
  <rect x="350" y="380" width="500" height="3" fill="url(#redCarpetGrad)" rx="1"/>

  <!-- Features summary -->
  <text x="600" y="440" font-family="'IBM Plex Sans', sans-serif" font-size="16" fill="#B8A8A8" text-anchor="middle">Roku • Samsung Tizen • Windows • Mobile • DLNA</text>

  <!-- Additional details -->
  <text x="600" y="480" font-family="'IBM Plex Sans', sans-serif" font-size="16" fill="#B8A8A8" text-anchor="middle">SyncPlay • Live TV • DVR • Transcoding • Plugins</text>

  <!-- Bottom accent -->
  <text x="600" y="560" font-family="'IBM Plex Mono', monospace" font-size="12" fill="#C9A227" text-anchor="middle" opacity="0.7" letter-spacing="2">PREMIERE NIGHT</text>

  <defs>
    <radialGradient id="spotlightGrad" cx="50%" cy="0%" r="100%">
      <stop offset="0%" stop-color="#C9A227"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <linearGradient id="redCarpetGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="transparent"/>
      <stop offset="20%" stop-color="#8B0000"/>
      <stop offset="50%" stop-color="#C9A227"/>
      <stop offset="80%" stop-color="#8B0000"/>
      <stop offset="100%" stop-color="transparent"/>
    </linearGradient>
  </defs>
</svg>
