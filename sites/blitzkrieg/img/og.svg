<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1A1A2E"/>
      <stop offset="100%" style="stop-color:#16213E"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#E94560"/>
      <stop offset="100%" style="stop-color:#FF6B35"/>
    </linearGradient>
    <radialGradient id="radarGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:rgba(0,255,136,0.15)"/>
      <stop offset="100%" style="stop-color:rgba(0,255,136,0)"/>
    </radialGradient>
  </defs>
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <!-- Radar sweep effect -->
  <circle cx="950" cy="315" r="250" fill="url(#radarGrad)"/>
  <path d="M950 315 L950 65 A250 250 0 0 1 1150 440 Z" fill="rgba(0,255,136,0.2)"/>
  <!-- HUD corners -->
  <path d="M20 20 L80 20 L80 30 L30 30 L30 80 L20 80 Z" fill="#0F3460"/>
  <path d="M1180 20 L1120 20 L1120 30 L1170 30 L1170 80 L1180 80 Z" fill="#0F3460"/>
  <path d="M20 610 L80 610 L80 600 L30 600 L30 550 L20 550 Z" fill="#0F3460"/>
  <path d="M1180 610 L1120 610 L1120 600 L1170 600 L1170 550 L1180 550 Z" fill="#0F3460"/>
  <!-- Grid overlay -->
  <g stroke="#2A2A4A" stroke-width="0.5" opacity="0.3">
    <line x1="0" y1="157" x2="1200" y2="157"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="472" x2="1200" y2="472"/>
    <line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
  </g>
  <!-- Logo area -->
  <text x="600" y="280" font-family="Impact, sans-serif" font-size="72" fill="#F0F4FF" text-anchor="middle" letter-spacing="8">PHLIX</text>
  <!-- Tagline -->
  <text x="600" y="340" font-family="Rajdhani, sans-serif" font-size="28" fill="#94A3B8" text-anchor="middle" letter-spacing="4">Your media. Your library. Your Phlix.</text>
  <!-- Accent line -->
  <rect x="400" y="370" width="400" height="4" fill="url(#accentGrad)"/>
  <!-- Bottom text -->
  <text x="600" y="480" font-family="Rajdhani, sans-serif" font-size="20" fill="#94A3B8" text-anchor="middle" letter-spacing="2">Self-hosted media server</text>
  <text x="600" y="520" font-family="Rajdhani, sans-serif" font-size="18" fill="#E94560" text-anchor="middle" letter-spacing="1">Roku • Samsung Tizen • Windows • Mobile • DLNA</text>
</svg>
