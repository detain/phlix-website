<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Mission Failed — Target not found. The content doesn't exist in this sector.">
  <meta name="theme-color" content="#1A1A2E">
  <title>Mission Failed — 404 — Blitzkrieg</title>
  <link rel="icon" type="image/svg+xml" href="img/favicon.svg">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/blitzkrieg.css">
  <link rel="stylesheet" href="css/hud-components.css">
</head>
<body class="blitzkrieg-site">
  <div class="hud-frame" aria-hidden="true">
    <div class="hud-corner hud-corner--tl"></div>
    <div class="hud-corner hud-corner--tr"></div>
    <div class="hud-corner hud-corner--bl"></div>
    <div class="hud-corner hud-corner--br"></div>
  </div>

  <main class="error-page">
    <div class="error-content">
      <div class="error-code">
        <span class="error-code__digit">4</span>
        <span class="error-code__digit error-code__digit--impact">0</span>
        <span class="error-code__digit">4</span>
      </div>
      <div class="dog-tag dog-tag--danger">MISSION FAILED</div>
      <h1 class="error-title">Target Not Found</h1>
      <p class="error-desc">
        The content doesn't exist in this sector. It may have been 
        redeployed elsewhere or never existed in our operations.
      </p>
      <div class="error-coords">
        <span class="hud-coords">ERROR CODE: 404-SECTOR-NULL</span>
      </div>
      <div class="error-actions">
        <a href="index.html" class="btn btn--primary">Return to Base</a>
        <a href="features.html" class="btn btn--ghost">View Intel</a>
      </div>
    </div>
    <div class="error-visual" aria-hidden="true">
      <div class="error-target">
        <div class="target-reticle">
          <div class="reticle-ring reticle-ring--outer"></div>
          <div class="reticle-ring reticle-ring--inner"></div>
        </div>
      </div>
    </div>
  </main>

  <script src="js/prefers-reduced-motion.js"></script>
  <style>
    .error-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: var(--space-6);
      position: relative;
    }
    .error-content {
      text-align: center;
      z-index: 10;
    }
    .error-code {
      font-family: var(--font-display);
      font-size: clamp(6rem, 20vw, 12rem);
      line-height: 1;
      margin-bottom: var(--space-4);
    }
    .error-code__digit {
      display: inline-block;
      color: var(--color-text-muted);
    }
    .error-code__digit--impact {
      color: var(--color-primary);
      text-shadow: 0 0 40px var(--color-combat-glow);
    }
    .dog-tag--danger {
      border-color: var(--color-error);
      color: var(--color-error);
      margin-bottom: var(--space-4);
    }
    .dog-tag--danger::before {
      background: var(--color-error);
    }
    .error-title {
      font-size: clamp(1.5rem, 5vw, 2.5rem);
      margin-bottom: var(--space-4);
    }
    .error-desc {
      max-width: 50ch;
      margin: 0 auto var(--space-6);
    }
    .error-coords {
      margin-bottom: var(--space-8);
    }
    .error-actions {
      display: flex;
      gap: var(--space-4);
      justify-content: center;
      flex-wrap: wrap;
    }
    .error-visual {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      opacity: 0.1;
      pointer-events: none;
    }
    .error-target {
      width: 400px;
      height: 400px;
    }
    .target-reticle {
      position: relative;
      width: 100%;
      height: 100%;
    }
    .reticle-ring {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      border: 3px solid var(--color-primary);
      border-radius: 50%;
    }
    .reticle-ring--outer {
      width: 300px;
      height: 300px;
    }
    .reticle-ring--inner {
      width: 150px;
      height: 150px;
      border-color: var(--color-error);
    }
  </style>
</body>
</html>
