<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" fill="none">
  <defs>
    <linearGradient id="planetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06D6A0"/>
      <stop offset="50%" stop-color="#1B998B"/>
      <stop offset="100%" stop-color="#26547C"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06D6A0" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#FFD166" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#EF476F" stop-opacity="0.7"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Planet orb -->
  <circle cx="30" cy="30" r="18" fill="url(#planetGrad)" filter="url(#glow)"/>

  <!-- Ring -->
  <ellipse cx="30" cy="30" rx="28" ry="6" stroke="url(#ringGrad)" stroke-width="2.5" fill="none" transform="rotate(-20 30 30)"/>

  <!-- Crater details -->
  <circle cx="24" cy="24" r="3" fill="#1B998B" opacity="0.4"/>
  <circle cx="34" cy="32" r="2" fill="#1B998B" opacity="0.3"/>
  <circle cx="28" cy="36" r="2.5" fill="#26547C" opacity="0.3"/>

  <!-- Wordmark -->
  <text x="68" y="38" font-family="'Orbitron', 'Courier New', monospace" font-size="24" font-weight="700" fill="#E8F1F2">
    PHLIX
  </text>

  <!-- Tagline -->
  <text x="70" y="52" font-family="'Exo 2', 'Courier New', monospace" font-size="9" fill="#7B8C9A" letter-spacing="2">
    TERRAFORM EDITION
  </text>
</svg>
