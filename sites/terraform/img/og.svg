<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1B2A"/>
      <stop offset="50%" stop-color="#1B2838"/>
      <stop offset="100%" stop-color="#26547C"/>
    </linearGradient>
    <linearGradient id="planetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06D6A0"/>
      <stop offset="50%" stop-color="#1B998B"/>
      <stop offset="100%" stop-color="#26547C"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06D6A0" stop-opacity="0.8"/>
      <stop offset="40%" stop-color="#FFD166" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#EF476F" stop-opacity="0.7"/>
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06D6A0" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#06D6A0" stop-opacity="0"/>
    </radialGradient>
    <filter id="planetGlow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="textGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Atmosphere glow layers -->
  <ellipse cx="350" cy="350" rx="300" ry="280" fill="url(#glowGrad)"/>
  <ellipse cx="850" cy="200" rx="200" ry="180" fill="#EF476F" opacity="0.05"/>

  <!-- Star field -->
  <g fill="#E8F1F2" opacity="0.4">
    <circle cx="100" cy="80" r="1"/>
    <circle cx="250" cy="120" r="1.5"/>
    <circle cx="400" cy="60" r="1"/>
    <circle cx="550" cy="100" r="1.2"/>
    <circle cx="700" cy="50" r="1"/>
    <circle cx="900" cy="90" r="1.5"/>
    <circle cx="1050" cy="70" r="1"/>
    <circle cx="1100" cy="150" r="1.2"/>
    <circle cx="150" cy="200" r="1"/>
    <circle cx="1080" cy="300" r="1"/>
    <circle cx="80" cy="400" r="1.2"/>
    <circle cx="1120" cy="450" r="1"/>
    <circle cx="200" cy="550" r="1"/>
    <circle cx="950" cy="580" r="1.5"/>
    <circle cx="600" cy="600" r="1"/>
  </g>

  <!-- Main planet -->
  <circle cx="350" cy="350" r="160" fill="url(#planetGrad)" filter="url(#planetGlow)"/>

  <!-- Crater formations -->
  <ellipse cx="300" cy="300" rx="35" ry="30" fill="#1B998B" opacity="0.25"/>
  <ellipse cx="380" cy="380" rx="25" ry="20" fill="#26547C" opacity="0.3"/>
  <ellipse cx="340" cy="420" rx="20" ry="15" fill="#1B998B" opacity="0.2"/>
  <circle cx="410" cy="310" r="12" fill="#26547C" opacity="0.2"/>

  <!-- Orbital ring -->
  <ellipse cx="350" cy="350" rx="240" ry="55" stroke="url(#ringGrad)" stroke-width="8" fill="none" transform="rotate(-15 350 350)"/>

  <!-- Terraforming pulse effect -->
  <ellipse cx="350" cy="350" rx="200" ry="45" stroke="#06D6A0" stroke-width="1" fill="none" opacity="0.3" transform="rotate(-15 350 350)">
    <animate attributeName="rx" values="200;230;200" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;0.1;0.3" dur="4s" repeatCount="indefinite"/>
  </ellipse>

  <!-- Colony dome hint -->
  <ellipse cx="340" cy="260" rx="30" ry="20" fill="#06D6A0" opacity="0.15"/>
  <ellipse cx="340" cy="260" rx="20" ry="12" fill="#E8F1F2" opacity="0.1"/>

  <!-- Text content -->
  <!-- Wordmark -->
  <text x="650" y="280" font-family="'Orbitron', 'Courier New', monospace" font-size="72" font-weight="700" fill="#E8F1F2" filter="url(#textGlow)">PHLIX</text>

  <!-- Tagline -->
  <text x="655" y="330" font-family="'Exo 2', 'Courier New', monospace" font-size="24" fill="#7B8C9A" letter-spacing="3">TERRAFORM EDITION</text>

  <!-- Headline -->
  <text x="650" y="420" font-family="'IBM Plex Sans', 'Courier New', monospace" font-size="32" fill="#E8F1F2">Your media. Your library.</text>
  <text x="650" y="470" font-family="'IBM Plex Sans', 'Courier New', monospace" font-size="32" fill="#06D6A0">Your Phlix.</text>

  <!-- Subtext -->
  <text x="650" y="540" font-family="'IBM Plex Sans', 'Courier New', monospace" font-size="16" fill="#7B8C9A">Self-hosted media server</text>

  <!-- Accent elements -->
  <circle cx="1050" cy="500" r="60" fill="#EF476F" opacity="0.1"/>
  <circle cx="1050" cy="500" r="40" fill="#EF476F" opacity="0.05"/>

  <!-- Bottom accent bar -->
  <rect x="0" y="610" width="1200" height="20" fill="#06D6A0" opacity="0.2"/>
  <rect x="0" y="625" width="1200" height="5" fill="#06D6A0"/>
</svg>
