<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Square favicon: Prison Navy with Amber break line -->
  <rect width="32" height="32" rx="4" fill="#2C3E50"/>
  <!-- Chain-link grid pattern -->
  <g opacity="0.25" stroke="#4A4A4A" stroke-width="1" fill="none">
    <rect x="4" y="4" width="10" height="10" rx="2"/>
    <rect x="8" y="8" width="10" height="10" rx="2"/>
    <rect x="4" y="18" width="10" height="10" rx="2"/>
    <rect x="8" y="14" width="10" height="10" rx="2"/>
    <rect x="18" y="4" width="10" height="10" rx="2"/>
    <rect x="14" y="8" width="10" height="10" rx="2"/>
    <rect x="18" y="18" width="10" height="10" rx="2"/>
    <rect x="14" y="14" width="10" height="10" rx="2"/>
  </g>
  <!-- P letterform -->
  <text x="6" y="23" font-family="Oswald, Impact, sans-serif" font-weight="700" font-size="18" fill="#ECF0F1">P</text>
  <!-- Searchlight highlight -->
  <rect x="0" y="30" width="32" height="2" fill="#F39C12" opacity="0.5" rx="1"/>
</svg>
