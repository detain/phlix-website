<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <!-- Dark midnight background -->
  <rect width="1200" height="630" fill="#1A1A1A"/>

  <!-- Chain-link grid overlay -->
  <g opacity="0.1" stroke="#4A4A4A" stroke-width="1.5" fill="none">
    <rect x="40" y="40" width="40" height="40" rx="4"/>
    <rect x="88" y="40" width="40" height="40" rx="4"/>
    <rect x="40" y="88" width="40" height="40" rx="4"/>
    <rect x="88" y="88" width="40" height="40" rx="4"/>
    <rect x="1072" y="40" width="40" height="40" rx="4"/>
    <rect x="1024" y="40" width="40" height="40" rx="4"/>
    <rect x="1072" y="88" width="40" height="40" rx="4"/>
    <rect x="1024" y="88" width="40" height="40" rx="4"/>
    <rect x="40" y="552" width="40" height="40" rx="4"/>
    <rect x="88" y="552" width="40" height="40" rx="4"/>
    <rect x="40" y="500" width="40" height="40" rx="4"/>
    <rect x="88" y="500" width="40" height="40" rx="4"/>
    <rect x="1072" y="552" width="40" height="40" rx="4"/>
    <rect x="1024" y="552" width="40" height="40" rx="4"/>
    <rect x="1072" y="500" width="40" height="40" rx="4"/>
    <rect x="1024" y="500" width="40" height="40" rx="4"/>
  </g>

  <!-- Searchlight sweep beam -->
  <rect x="0" y="0" width="1200" height="630" fill="url(#sweep)" opacity="0.15"/>

  <!-- Central spotlight glow -->
  <ellipse cx="600" cy="315" rx="400" ry="250" fill="url(#spotlight)" opacity="0.2"/>

  <!-- Logo area -->
  <text x="600" y="270" text-anchor="middle" font-family="Oswald, Impact, sans-serif" font-weight="700" font-size="96" fill="#ECF0F1" letter-spacing="0.04em">PHLIX</text>

  <!-- Searchlight accent underline -->
  <rect x="300" y="285" width="600" height="3" fill="#F39C12" opacity="0.7" rx="1.5"/>

  <!-- Tagline -->
  <text x="600" y="360" text-anchor="middle" font-family="Source Sans 3, Segoe UI, sans-serif" font-size="32" fill="#95A5A6" letter-spacing="0.05em">BREAK FREE. OWN YOUR MEDIA.</text>

  <!-- Tagline secondary -->
  <text x="600" y="400" text-anchor="middle" font-family="Source Sans 3, Segoe UI, sans-serif" font-size="20" fill="#95A5A6" opacity="0.7">Self-hosted media server — no subscription lock-in</text>

  <!-- Bottom bar -->
  <rect x="0" y="600" width="1200" height="30" fill="#2C3E50"/>
  <text x="600" y="622" text-anchor="middle" font-family="Source Sans 3, Segoe UI, sans-serif" font-size="14" fill="#95A5A6" letter-spacing="0.08em">SELF-HOSTED • OPEN SOURCE • NO LOCK-IN</text>

  <defs>
    <linearGradient id="sweep" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F39C12" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#F39C12" stop-opacity="1"/>
      <stop offset="1" stop-color="#F39C12" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="spotlight" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#ECF0F1" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#1A1A1A" stop-opacity="0"/>
    </radialGradient>
  </defs>
</svg>
