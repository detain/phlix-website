<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 50" fill="none">
  <!-- Phlix wordmark with prison-escape motif -->
  <!-- Chain-link pattern left accent -->
  <g opacity="0.6">
    <rect x="0" y="8" width="18" height="18" rx="3" stroke="#4A4A4A" stroke-width="1.5" fill="none"/>
    <rect x="4" y="12" width="18" height="18" rx="3" stroke="#4A4A4A" stroke-width="1.5" fill="none"/>
    <rect x="0" y="24" width="18" height="18" rx="3" stroke="#4A4A4A" stroke-width="1.5" fill="none"/>
    <rect x="4" y="20" width="18" height="18" rx="3" stroke="#4A4A4A" stroke-width="1.5" fill="none"/>
  </g>

  <!-- P letterform with spotlight break -->
  <text x="28" y="38" font-family="Oswald, Impact, sans-serif" font-weight="700" font-size="38" fill="#ECF0F1" letter-spacing="0.02em">P</text>

  <!-- H -->
  <text x="58" y="38" font-family="Oswald, Impact, sans-serif" font-weight="700" font-size="38" fill="#ECF0F1" letter-spacing="0.02em">H</text>

  <!-- L with amber break highlight -->
  <text x="88" y="38" font-family="Oswald, Impact, sans-serif" font-weight="700" font-size="38" fill="#F39C12" letter-spacing="0.02em">L</text>

  <!-- I -->
  <text x="108" y="38" font-family="Oswald, Impact, sans-serif" font-weight="700" font-size="38" fill="#ECF0F1" letter-spacing="0.02em">I</text>

  <!-- X with red accent -->
  <text x="120" y="38" font-family="Oswald, Impact, sans-serif" font-weight="700" font-size="38" fill="#E74C3C" letter-spacing="0.02em">X</text>

  <!-- Searchlight beam accent -->
  <rect x="28" y="42" width="95" height="2" fill="#F39C12" opacity="0.4" rx="1"/>
</svg>
