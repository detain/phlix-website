<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 80" role="img" aria-label="Phlix Festive Lantern brand logo">
  <title>Phlix</title>
  <desc>Festive Lantern brand logo — Phlix wordmark in Noto Serif SC with gold accents on lacquer black</desc>

  <!-- Lantern glow background wash -->
  <ellipse cx="140" cy="45" rx="120" ry="38" fill="none" stroke="#D4A017" stroke-width="0.5" opacity="0.15"/>

  <!-- Decorative top tassel line -->
  <path d="M100 8 Q120 12 140 8 Q160 4 180 8" fill="none" stroke="#D4A017" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>

  <!-- Lantern body (rounded octagon silhouette) -->
  <path d="M95 20 L108 14 L172 14 L185 20 L185 55 Q185 68 172 72 L108 72 Q95 68 95 55 Z"
        fill="#1A1228" stroke="#D4A017" stroke-width="1.5" opacity="0.9"/>

  <!-- Lantern inner glow -->
  <ellipse cx="140" cy="40" rx="35" ry="22" fill="#C0392B" opacity="0.15"/>

  <!-- Double-line scroll frame corners -->
  <!-- Top-left -->
  <path d="M96 21 L109 14 M96 28 L115 14" fill="none" stroke="#D4A017" stroke-width="1" stroke-linecap="round" opacity="0.6"/>
  <!-- Top-right -->
  <path d="M184 21 L171 14 M184 28 L165 14" fill="none" stroke="#D4A017" stroke-width="1" stroke-linecap="round" opacity="0.6"/>

  <!-- Paper-cut plum blossom (left of wordmark) -->
  <g transform="translate(58, 30)" opacity="0.7">
    <ellipse cx="0" cy="-6" rx="3" ry="5" fill="#C0392B" transform="rotate(0)"/>
    <ellipse cx="0" cy="-6" rx="3" ry="5" fill="#C0392B" transform="rotate(72)"/>
    <ellipse cx="0" cy="-6" rx="3" ry="5" fill="#C0392B" transform="rotate(144)"/>
    <ellipse cx="0" cy="-6" rx="3" ry="5" fill="#C0392B" transform="rotate(216)"/>
    <ellipse cx="0" cy="-6" rx="3" ry="5" fill="#C0392B" transform="rotate(288)"/>
    <circle cx="0" cy="0" r="2.5" fill="#D4A017"/>
  </g>

  <!-- Paper-cut plum blossom (right of wordmark) -->
  <g transform="translate(222, 30)" opacity="0.7">
    <ellipse cx="0" cy="-6" rx="3" ry="5" fill="#C0392B" transform="rotate(0)"/>
    <ellipse cx="0" cy="-6" rx="3" ry="5" fill="#C0392B" transform="rotate(72)"/>
    <ellipse cx="0" cy="-6" rx="3" ry="5" fill="#C0392B" transform="rotate(144)"/>
    <ellipse cx="0" cy="-6" rx="3" ry="5" fill="#C0392B" transform="rotate(216)"/>
    <ellipse cx="0" cy="-6" rx="3" ry="5" fill="#C0392B" transform="rotate(288)"/>
    <circle cx="0" cy="0" r="2.5" fill="#D4A017"/>
  </g>

  <!-- Phlix wordmark -->
  <text x="140" y="52"
        font-family="'Noto Serif SC', Georgia, serif"
        font-size="28"
        font-weight="900"
        fill="#F5EFE0"
        text-anchor="middle"
        dominant-baseline="middle"
        letter-spacing="-0.5">Phlix</text>

  <!-- Bottom tassel -->
  <path d="M125 73 Q130 78 140 80 Q150 78 155 73" fill="none" stroke="#D4A017" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
  <line x1="140" y1="76" x2="140" y2="82" stroke="#D4A017" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
</svg>
