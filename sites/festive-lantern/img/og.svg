<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img">
  <title>Phlix — Festive Lantern</title>
  <desc>Open Graph social share image for Phlix Festive Lantern brand site</desc>

  <!-- Background: lacquer black with gradient sky -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1A1228"/>
      <stop offset="100%" stop-color="#0F0A08"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#C0392B" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0F0A08" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lantern" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D4A017" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#C0392B" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Floating lanterns (decorative silhouettes) -->
  <ellipse cx="180" cy="100" rx="18" ry="28" fill="url(#lantern)" stroke="#D4A017" stroke-width="0.8" opacity="0.5"/>
  <ellipse cx="380" cy="60" rx="14" ry="22" fill="url(#lantern)" stroke="#D4A017" stroke-width="0.8" opacity="0.4"/>
  <ellipse cx="580" cy="80" rx="16" ry="25" fill="url(#lantern)" stroke="#D4A017" stroke-width="0.8" opacity="0.45"/>
  <ellipse cx="820" cy="90" rx="14" ry="22" fill="url(#lantern)" stroke="#D4A017" stroke-width="0.8" opacity="0.4"/>
  <ellipse cx="1000" cy="110" rx="18" ry="28" fill="url(#lantern)" stroke="#D4A017" stroke-width="0.8" opacity="0.5"/>

  <!-- Bottom decorative wave/ribbon -->
  <path d="M0 560 Q200 530 400 550 Q600 570 800 545 Q1000 520 1200 550 L1200 630 L0 630 Z" fill="#1A1228" opacity="0.8"/>
  <path d="M0 575 Q200 545 400 565 Q600 585 800 560 Q1000 535 1200 565 L1200 630 L0 630 Z" fill="#C0392B" opacity="0.15"/>

  <!-- Brand wordmark -->
  <text x="600" y="320"
        font-family="'Noto Serif SC', Georgia, serif"
        font-size="88"
        font-weight="900"
        fill="#F5EFE0"
        text-anchor="middle"
        dominant-baseline="middle"
        letter-spacing="-2">Phlix</text>

  <!-- Tagline -->
  <text x="600" y="395"
        font-family="'Cinzel Decorative', Georgia, serif"
        font-size="22"
        fill="#D4A017"
        text-anchor="middle"
        dominant-baseline="middle"
        letter-spacing="6"
        opacity="0.9">EVERY NIGHT, A CELEBRATION</text>

  <!-- Divider line -->
  <line x1="400" y1="430" x2="800" y2="430" stroke="#D4A017" stroke-width="1" opacity="0.4"/>

  <!-- Product descriptor -->
  <text x="600" y="465"
        font-family="Inter, system-ui, sans-serif"
        font-size="18"
        fill="#F5EFE0"
        text-anchor="middle"
        dominant-baseline="middle"
        opacity="0.65"
        letter-spacing="1">Self-hosted media server</text>

  <!-- Corner accents: chrysanthemum burst top-left -->
  <g transform="translate(80, 80)" opacity="0.3">
    <circle cx="0" cy="0" r="6" fill="#D4A017"/>
    <line x1="0" y1="-12" x2="0" y2="-6" stroke="#D4A017" stroke-width="2" stroke-linecap="round"/>
    <line x1="0" y1="6" x2="0" y2="12" stroke="#D4A017" stroke-width="2" stroke-linecap="round"/>
    <line x1="-12" y1="0" x2="-6" y2="0" stroke="#D4A017" stroke-width="2" stroke-linecap="round"/>
    <line x1="6" y1="0" x2="12" y2="0" stroke="#D4A017" stroke-width="2" stroke-linecap="round"/>
    <line x1="-8.5" y1="-8.5" x2="-4.2" y2="-4.2" stroke="#D4A017" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="4.2" y1="4.2" x2="8.5" y2="8.5" stroke="#D4A017" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="-8.5" y1="8.5" x2="-4.2" y2="4.2" stroke="#D4A017" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="4.2" y1="-4.2" x2="8.5" y2="-8.5" stroke="#D4A017" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Chrysanthemum burst bottom-right -->
  <g transform="translate(1120, 550)" opacity="0.3">
    <circle cx="0" cy="0" r="6" fill="#D4A017"/>
    <line x1="0" y1="-12" x2="0" y2="-6" stroke="#D4A017" stroke-width="2" stroke-linecap="round"/>
    <line x1="0" y1="6" x2="0" y2="12" stroke="#D4A017" stroke-width="2" stroke-linecap="round"/>
    <line x1="-12" y1="0" x2="-6" y2="0" stroke="#D4A017" stroke-width="2" stroke-linecap="round"/>
    <line x1="6" y1="0" x2="12" y2="0" stroke="#D4A017" stroke-width="2" stroke-linecap="round"/>
    <line x1="-8.5" y1="-8.5" x2="-4.2" y2="-4.2" stroke="#D4A017" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="4.2" y1="4.2" x2="8.5" y2="8.5" stroke="#D4A017" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="-8.5" y1="8.5" x2="-4.2" y2="4.2" stroke="#D4A017" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="4.2" y1="-4.2" x2="8.5" y2="-8.5" stroke="#D4A017" stroke-width="1.5" stroke-linecap="round"/>
  </g>
</svg>
