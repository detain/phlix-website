<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 80" fill="none">
  <!-- Phlix wordmark with power-up theme: gold coins + cyan star motif -->
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffe44d"/>
      <stop offset="50%" style="stop-color:#FFD700"/>
      <stop offset="100%" style="stop-color:#B8960A"/>
    </linearGradient>
    <linearGradient id="fireGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FF4500"/>
      <stop offset="100%" style="stop-color:#CC3700"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Floating coin left -->
  <circle cx="32" cy="40" r="14" fill="url(#goldGrad)" filter="url(#glow)">
    <animate attributeName="cy" values="40;32;40" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="r" values="14;15;14" dur="3s" repeatCount="indefinite"/>
  </circle>
  <text x="32" y="45" font-family="serif" font-size="16" font-weight="bold" fill="#1A0A00" text-anchor="middle">P</text>

  <!-- Star right -->
  <polygon points="208,14 212,26 224,26 214,34 218,46 208,38 198,46 202,34 192,26 204,26"
           fill="#00CED1" filter="url(#glow)">
    <animate attributeName="opacity" values="1;0.6;1" dur="2s" repeatCount="indefinite"/>
  </polygon>

  <!-- Wordmark -->
  <text x="52" y="54" font-family="Arial Black, sans-serif" font-size="40" font-weight="900"
        fill="url(#goldGrad)" filter="url(#glow)" letter-spacing="2">Phlix</text>

  <!-- Decorative fire underline -->
  <rect x="52" y="60" width="136" height="4" rx="2" fill="url(#fireGrad)" opacity="0.8">
    <animate attributeName="width" values="136;140;136" dur="1.5s" repeatCount="indefinite"/>
  </rect>
</svg>
