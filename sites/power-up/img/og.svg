<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="70%">
      <stop offset="0%" style="stop-color:#3D1800"/>
      <stop offset="100%" style="stop-color:#1A0A00"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#B8960A"/>
      <stop offset="50%" style="stop-color:#FFD700"/>
      <stop offset="100%" style="stop-color:#B8960A"/>
    </linearGradient>
    <linearGradient id="fireGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#CC3700"/>
      <stop offset="100%" style="stop-color:#FF4500"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glowCyan" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Radial glow from center -->
  <ellipse cx="600" cy="280" rx="500" ry="280" fill="#FFD700" opacity="0.05"/>

  <!-- Grid lines (subtle arcade feel) -->
  <g opacity="0.07">
    <line x1="0" y1="200" x2="1200" y2="200" stroke="#FFD700" stroke-width="1"/>
    <line x1="0" y1="315" x2="1200" y2="315" stroke="#00CED1" stroke-width="1"/>
    <line x1="0" y1="430" x2="1200" y2="430" stroke="#FFD700" stroke-width="1"/>
    <line x1="300" y1="0" x2="300" y2="630" stroke="#FFD700" stroke-width="1"/>
    <line x1="600" y1="0" x2="600" y2="630" stroke="#FF4500" stroke-width="1"/>
    <line x1="900" y1="0" x2="900" y2="630" stroke="#FFD700" stroke-width="1"/>
  </g>

  <!-- Floating coins (left side) -->
  <g filter="url(#glow)" opacity="0.7">
    <circle cx="100" cy="200" r="22" fill="#FFD700"/>
    <circle cx="100" cy="200" r="16" fill="#1A0A00"/>
    <circle cx="100" cy="200" r="12" fill="#FFD700"/>
  </g>
  <g filter="url(#glow)" opacity="0.5">
    <circle cx="60" cy="350" r="16" fill="#FFD700"/>
    <circle cx="60" cy="350" r="11" fill="#1A0A00"/>
    <circle cx="60" cy="350" r="8" fill="#FFD700"/>
  </g>
  <g filter="url(#glow)" opacity="0.4">
    <circle cx="130" cy="450" r="12" fill="#FFD700"/>
    <circle cx="130" cy="450" r="8" fill="#1A0A00"/>
    <circle cx="130" cy="450" r="5" fill="#FFD700"/>
  </g>

  <!-- Floating stars (right side) -->
  <g filter="url(#glowCyan)" opacity="0.6">
    <polygon points="1100,160 1106,180 1126,180 1110,194 1116,214 1100,200 1084,214 1090,194 1074,180 1094,180"
             fill="#00CED1"/>
  </g>
  <g filter="url(#glowCyan)" opacity="0.4">
    <polygon points="1050,380 1054,392 1066,392 1056,400 1060,412 1050,404 1040,412 1044,400 1034,392 1046,392"
             fill="#00CED1"/>
  </g>
  <g filter="url(#glowCyan)" opacity="0.3">
    <polygon points="1120,480 1123,488 1131,488 1125,494 1128,502 1120,496 1112,502 1115,494 1109,488 1117,488"
             fill="#00CED1"/>
  </g>

  <!-- Phlix wordmark -->
  <g filter="url(#glow)" transform="translate(600, 220)">
    <text x="-180" y="50"
          font-family="Arial Black, sans-serif"
          font-size="200"
          font-weight="900"
          fill="url(#goldGrad)">P</text>
    <text x="-30" y="50"
          font-family="Arial Black, sans-serif"
          font-size="130"
          font-weight="900"
          fill="url(#goldGrad)"
          letter-spacing="8">HLIX</text>
  </g>

  <!-- Fire underline -->
  <rect x="350" y="285" width="500" height="5" rx="2.5" fill="url(#fireGrad)" opacity="0.9" filter="url(#glow)"/>

  <!-- Tagline -->
  <text x="600" y="370"
        font-family="Arial, sans-serif"
        font-size="34"
        fill="#F5F5F5"
        text-anchor="middle"
        opacity="0.95">Your media. Your library. Your Phlix.</text>

  <!-- Sub tagline -->
  <text x="600" y="420"
        font-family="Arial, sans-serif"
        font-size="18"
        fill="#C4C4C4"
        text-anchor="middle">Self-hosted media server</text>

  <!-- Bottom bar -->
  <rect x="0" y="580" width="1200" height="50" fill="#2D1200"/>
  <text x="600" y="610"
        font-family="Arial, sans-serif"
        font-size="15"
        fill="#C4C4C4"
        text-anchor="middle">Open-source media, on your terms.</text>

  <!-- Corner accents -->
  <g stroke="#FFD700" stroke-width="3" fill="none" opacity="0.5">
    <path d="M0 60 L0 0 L60 0"/>
    <path d="M1200 60 L1200 0 L1140 0"/>
    <path d="M0 570 L0 630 L60 630"/>
    <path d="M1200 570 L1200 630 L1140 630"/>
  </g>
</svg>
