<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <defs>
    <linearGradient id="brassBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A0A0A"/>
      <stop offset="50%" stop-color="#241010"/>
      <stop offset="100%" stop-color="#1A0A0A"/>
    </linearGradient>
    <linearGradient id="brassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B8860B"/>
      <stop offset="50%" stop-color="#D4A017"/>
      <stop offset="100%" stop-color="#CD853F"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#B8860B" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#B8860B" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#brassBg)"/>

  <!-- Radial glow -->
  <ellipse cx="600" cy="315" rx="500" ry="300" fill="url(#glow)"/>

  <!-- Decorative gears (background) -->
  <g opacity="0.08">
    <!-- Large gear left -->
    <circle cx="150" cy="150" r="100" stroke="#B8860B" stroke-width="2" fill="none"/>
    <circle cx="150" cy="150" r="70" stroke="#B8860B" stroke-width="1" fill="none"/>
    <circle cx="150" cy="150" r="30" stroke="#B8860B" stroke-width="1" fill="none"/>
    <g stroke="#B8860B" stroke-width="2">
      <line x1="150" y1="45" x2="150" y2="60"/>
      <line x1="150" y1="240" x2="150" y2="255"/>
      <line x1="45" y1="150" x2="60" y2="150"/>
      <line x1="240" y1="150" x2="255" y2="150"/>
      <line x1="76" y1="76" x2="87" y2="87"/>
      <line x1="213" y1="213" x2="224" y2="224"/>
      <line x1="224" y1="76" x2="213" y2="87"/>
      <line x1="87" y1="213" x2="76" y2="224"/>
    </g>

    <!-- Large gear right -->
    <circle cx="1050" cy="480" r="120" stroke="#B8860B" stroke-width="2" fill="none"/>
    <circle cx="1050" cy="480" r="85" stroke="#B8860B" stroke-width="1" fill="none"/>
    <circle cx="1050" cy="480" r="35" stroke="#B8860B" stroke-width="1" fill="none"/>
    <g stroke="#B8860B" stroke-width="2">
      <line x1="1050" y1="355" x2="1050" y2="375"/>
      <line x1="1050" y1="585" x2="1050" y2="605"/>
      <line x1="925" y1="480" x2="945" y2="480"/>
      <line x1="1155" y1="480" x2="1175" y2="480"/>
      <line x1="962" y1="392" x2="977" y2="407"/>
      <line x1="1123" y1="553" x2="1138" y2="568"/>
      <line x1="1138" y1="392" x2="1123" y2="407"/>
      <line x1="977" y1="553" x2="962" y2="568"/>
    </g>
  </g>

  <!-- Divider line -->
  <line x1="200" y1="450" x2="1000" y2="450" stroke="url(#brassGrad)" stroke-width="2"/>
  <circle cx="600" cy="450" r="6" fill="#CD853F"/>

  <!-- Main content -->
  <!-- Logo/wordmark -->
  <g transform="translate(600, 260)">
    <!-- Gear icon -->
    <g transform="translate(-180, -15)">
      <circle cx="20" cy="20" r="16" stroke="url(#brassGrad)" stroke-width="2" fill="none"/>
      <circle cx="20" cy="20" r="6" fill="#B8860B"/>
      <g stroke="url(#brassGrad)" stroke-width="2">
        <line x1="20" y1="0" x2="20" y2="6"/>
        <line x1="20" y1="34" x2="20" y2="40"/>
        <line x1="0" y1="20" x2="6" y2="20"/>
        <line x1="34" y1="20" x2="40" y2="20"/>
      </g>
    </g>

    <!-- PHLIX text -->
    <text x="-120" y="10" font-family="Georgia, serif" font-size="60" font-weight="bold" fill="#E8D5B7" letter-spacing="0.05em">PHLIX</text>
  </g>

  <!-- Headline -->
  <text x="600" y="370" font-family="Georgia, serif" font-size="28" fill="#C4A882" text-anchor="middle" letter-spacing="0.02em">Your media. Your library. Your Phlix.</text>

  <!-- Bottom tagline -->
  <text x="600" y="530" font-family="Georgia, serif" font-size="20" fill="#B8860B" text-anchor="middle" letter-spacing="0.1em">OPEN-SOURCE MEDIA, ON YOUR TERMS.</text>

  <!-- Small gear accents bottom -->
  <g transform="translate(350, 560)" opacity="0.5">
    <circle cx="10" cy="10" r="8" stroke="#B8860B" stroke-width="1" fill="none"/>
    <circle cx="10" cy="10" r="3" stroke="#B8860B" stroke-width="1" fill="none"/>
  </g>
  <g transform="translate(850, 560)" opacity="0.5">
    <circle cx="10" cy="10" r="8" stroke="#B8860B" stroke-width="1" fill="none"/>
    <circle cx="10" cy="10" r="3" stroke="#B8860B" stroke-width="1" fill="none"/>
  </g>
</svg>
