<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" fill="none">
  <!-- Background gear/cog motif -->
  <defs>
    <linearGradient id="brassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B8860B"/>
      <stop offset="50%" stop-color="#D4A017"/>
      <stop offset="100%" stop-color="#CD853F"/>
    </linearGradient>
  </defs>

  <!-- Gear decorations -->
  <g opacity="0.15">
    <circle cx="30" cy="30" r="25" stroke="#B8860B" stroke-width="1" fill="none"/>
    <circle cx="30" cy="30" r="18" stroke="#B8860B" stroke-width="1" fill="none"/>
    <circle cx="30" cy="30" r="8" stroke="#B8860B" stroke-width="1" fill="none"/>
    <!-- Gear teeth -->
    <g stroke="#B8860B" stroke-width="1">
      <line x1="30" y1="2" x2="30" y2="8"/>
      <line x1="30" y1="52" x2="30" y2="58"/>
      <line x1="2" y1="30" x2="8" y2="30"/>
      <line x1="52" y1="30" x2="58" y2="30"/>
      <line x1="10" y1="10" x2="14" y2="14"/>
      <line x1="46" y1="46" x2="50" y2="50"/>
      <line x1="50" y1="10" x2="46" y2="14"/>
      <line x1="14" y1="46" x2="10" y2="50"/>
    </g>
  </g>

  <!-- Letter P -->
  <text x="60" y="44" font-family="Georgia, serif" font-size="40" font-weight="bold" fill="url(#brassGrad)">P</text>

  <!-- Remaining letters -->
  <text x="90" y="44" font-family="Georgia, serif" font-size="40" font-weight="bold" fill="#E8D5B7">hlix</text>

  <!-- Underline accent -->
  <line x1="60" y1="52" x2="195" y2="52" stroke="#B8860B" stroke-width="2"/>
  <circle cx="195" cy="52" r="3" fill="#CD853F"/>

  <!-- Small gear accent -->
  <g transform="translate(210, 20)" opacity="0.3">
    <circle cx="12" cy="12" r="10" stroke="#B8860B" stroke-width="1" fill="none"/>
    <circle cx="12" cy="12" r="4" stroke="#B8860B" stroke-width="1" fill="none"/>
    <line x1="12" y1="0" x2="12" y2="4" stroke="#B8860B" stroke-width="1"/>
    <line x1="12" y1="20" x2="12" y2="24" stroke="#B8860B" stroke-width="1"/>
    <line x1="0" y1="12" x2="4" y2="12" stroke="#B8860B" stroke-width="1"/>
    <line x1="20" y1="12" x2="24" y2="12" stroke="#B8860B" stroke-width="1"/>
  </g>
</svg>
