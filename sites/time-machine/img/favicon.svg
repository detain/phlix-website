<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Gear/cog favicon in brass -->
  <defs>
    <linearGradient id="faviconBrass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B8860B"/>
      <stop offset="100%" stop-color="#CD853F"/>
    </linearGradient>
  </defs>

  <!-- Outer gear ring -->
  <circle cx="16" cy="16" r="14" stroke="url(#faviconBrass)" stroke-width="1.5" fill="#1A0A0A"/>

  <!-- Inner circle -->
  <circle cx="16" cy="16" r="9" stroke="url(#faviconBrass)" stroke-width="1" fill="none"/>

  <!-- Center dot -->
  <circle cx="16" cy="16" r="3" fill="url(#faviconBrass)"/>

  <!-- Gear teeth (8 teeth) -->
  <g stroke="url(#faviconBrass)" stroke-width="2" stroke-linecap="round">
    <!-- Top -->
    <line x1="16" y1="0" x2="16" y2="4"/>
    <!-- Bottom -->
    <line x1="16" y1="28" x2="16" y2="32"/>
    <!-- Left -->
    <line x1="0" y1="16" x2="4" y2="16"/>
    <!-- Right -->
    <line x1="28" y1="16" x2="32" y2="16"/>
  </g>

  <!-- Diagonal teeth (shorter) -->
  <g stroke="url(#faviconBrass)" stroke-width="2" stroke-linecap="round" opacity="0.7">
    <!-- Top-right -->
    <line x1="23" y1="3" x2="21" y2="6"/>
    <!-- Bottom-right -->
    <line x1="29" y1="23" x2="26" y2="21"/>
    <!-- Bottom-left -->
    <line x1="9" y1="29" x2="11" y2="26"/>
    <!-- Top-left -->
    <line x1="3" y1="9" x2="6" y2="11"/>
  </g>
</svg>
