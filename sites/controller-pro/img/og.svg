<!-- OG card source — Controller Pro, 1200x630.
     Editable source for img/og.png (rasterised with rsvg-convert).
     Esports RGB gaming aesthetic with Phlix wordmark. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <title>Phlix — Your media. Your library. Your Phlix.</title>
  <desc>Social share card for Phlix in the Controller Pro identity</desc>

  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0A0A" />
      <stop offset="100%" stop-color="#1A1A1A" />
    </linearGradient>
    <linearGradient id="rgbStrip" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00FF88" />
      <stop offset="50%" stop-color="#00FF88" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#FF0055" />
    </linearGradient>
    <linearGradient id="glowGreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00FF88" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#00FF88" stop-opacity="0" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Dark background -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />

  <!-- Subtle radial glow top-left -->
  <ellipse cx="200" cy="150" rx="400" ry="300" fill="url(#glowGreen)" />

  <!-- RGB accent strip top -->
  <rect x="0" y="0" width="1200" height="4" fill="url(#rgbStrip)" />

  <!-- RGB accent strip bottom -->
  <rect x="0" y="626" width="1200" height="4" fill="url(#rgbStrip)" />

  <!-- Mini controller icon with glow -->
  <g transform="translate(100, 220)" filter="url(#glow)">
    <!-- Main body -->
    <path d="M8 16C8 10 12 4 20 4H52C60 4 64 10 64 16V28C64 34 60 40 52 40H20C12 40 8 34 8 28V16Z"
          fill="#1A1A1A" stroke="#00FF88" stroke-width="1.5"/>
    <!-- Left analog stick -->
    <circle cx="24" cy="20" r="6" fill="#0A0A0A" stroke="#00FF88" stroke-width="1"/>
    <circle cx="24" cy="20" r="2" fill="#00FF88"/>
    <!-- Right analog stick -->
    <circle cx="48" cy="24" r="6" fill="#0A0A0A" stroke="#00FF88" stroke-width="1"/>
    <circle cx="48" cy="24" r="2" fill="#00FF88"/>
    <!-- D-pad -->
    <path d="M34 16V24M30 20H38" stroke="#00FF88" stroke-width="1.5" stroke-linecap="round"/>
    <!-- RGB strip accent -->
    <rect x="12" y="36" width="48" height="3" rx="1" fill="url(#rgbStrip)"/>
  </g>

  <!-- Vertical accent bar -->
  <rect x="200" y="160" width="4" height="310" rx="2" fill="#00FF88" />

  <!-- Eyebrow -->
  <text
    x="232"
    y="210"
    font-family="monospace"
    font-size="20"
    font-weight="500"
    letter-spacing="6"
    fill="#00FF88"
  >
    SELF-HOSTED MEDIA SERVER
  </text>

  <!-- Wordmark -->
  <text
    x="228"
    y="330"
    font-family="Arial Black, Arial, sans-serif"
    font-size="96"
    font-weight="900"
    letter-spacing="4"
    fill="#FFFFFF"
    filter="url(#glow)"
  >
    PHLIX
  </text>

  <!-- Tagline -->
  <text
    x="232"
    y="400"
    font-family="Arial, sans-serif"
    font-size="36"
    font-weight="400"
    fill="#888888"
  >
    Your media. Your library. Your Phlix.
  </text>

  <!-- RGB glow line under tagline -->
  <rect x="232" y="420" width="500" height="2" fill="url(#rgbStrip)" opacity="0.6" />

  <!-- Bottom right decorative grid -->
  <g opacity="0.15">
    <rect x="900" y="450" width="40" height="40" fill="none" stroke="#00FF88" stroke-width="1"/>
    <rect x="950" y="450" width="40" height="40" fill="none" stroke="#00FF88" stroke-width="1"/>
    <rect x="1000" y="450" width="40" height="40" fill="none" stroke="#00FF88" stroke-width="1"/>
    <rect x="1050" y="450" width="40" height="40" fill="none" stroke="#00FF88" stroke-width="1"/>
    <rect x="900" y="500" width="40" height="40" fill="none" stroke="#00FF88" stroke-width="1"/>
    <rect x="950" y="500" width="40" height="40" fill="none" stroke="#00FF88" stroke-width="1"/>
    <rect x="1000" y="500" width="40" height="40" fill="none" stroke="#00FF88" stroke-width="1"/>
    <rect x="1050" y="500" width="40" height="40" fill="none" stroke="#00FF88" stroke-width="1"/>
    <rect x="900" y="550" width="40" height="40" fill="none" stroke="#00FF88" stroke-width="1"/>
    <rect x="950" y="550" width="40" height="40" fill="none" stroke="#00FF88" stroke-width="1"/>
    <rect x="1000" y="550" width="40" height="40" fill="none" stroke="#00FF88" stroke-width="1"/>
    <rect x="1050" y="550" width="40" height="40" fill="none" stroke="#00FF88" stroke-width="1"/>
  </g>
</svg>
