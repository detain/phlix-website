<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 80" fill="none">
  <!-- Phlix wordmark with RGB gaming aesthetic -->
  <defs>
    <linearGradient id="rgb-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00FF88"/>
      <stop offset="50%" style="stop-color:#00FF88;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#FF0055"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Controller icon -->
  <g transform="translate(0, 12)" filter="url(#glow)">
    <!-- Main body -->
    <path d="M8 16C8 10 12 4 20 4H52C60 4 64 10 64 16V28C64 34 60 40 52 40H20C12 40 8 34 8 28V16Z"
          fill="#1A1A1A" stroke="#00FF88" stroke-width="1.5"/>
    <!-- Left analog stick -->
    <circle cx="24" cy="20" r="6" fill="#0A0A0A" stroke="#00FF88" stroke-width="1"/>
    <circle cx="24" cy="20" r="2" fill="#00FF88"/>
    <!-- Right analog stick -->
    <circle cx="48" cy="24" r="6" fill="#0A0A0A" stroke="#00FF88" stroke-width="1"/>
    <circle cx="48" cy="24" r="2" fill="#00FF88"/>
    <!-- D-pad -->
    <path d="M34 16V24M30 20H38" stroke="#00FF88" stroke-width="1.5" stroke-linecap="round"/>
    <!-- RGB strip accent -->
    <rect x="12" y="36" width="48" height="3" rx="1" fill="url(#rgb-glow)"/>
  </g>

  <!-- Wordmark -->
  <text x="80" y="38" font-family="Orbitron, system-ui, sans-serif" font-size="28" font-weight="700"
        fill="#FFFFFF" letter-spacing="0.1em">PHLIX</text>
  <text x="80" y="56" font-family="Rajdhani, system-ui, sans-serif" font-size="11" font-weight="500"
        fill="#888888" letter-spacing="0.25em">MEDIA SERVER</text>
</svg>
