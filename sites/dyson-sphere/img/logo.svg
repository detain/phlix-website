<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 80" width="280" height="80">
  <defs>
    <linearGradient id="solarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFB800"/>
      <stop offset="50%" style="stop-color:#FF6B00"/>
      <stop offset="100%" style="stop-color:#FF4500"/>
    </linearGradient>
    <linearGradient id="ringGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFB800;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#FF6B00;stop-opacity:0.4"/>
    </linearGradient>
    <linearGradient id="ringGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B00;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#FF4500;stop-opacity:0.3"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Megastructure rings -->
  <g transform="translate(45, 40)">
    <!-- Outer ring -->
    <ellipse cx="0" cy="0" rx="28" ry="10" fill="none" stroke="url(#ringGrad1)" stroke-width="1.5" opacity="0.6">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="20s" repeatCount="indefinite"/>
    </ellipse>
    <!-- Middle ring -->
    <ellipse cx="0" cy="0" rx="22" ry="8" fill="none" stroke="url(#ringGrad2)" stroke-width="1.2" opacity="0.5">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="15s" repeatCount="indefinite"/>
    </ellipse>
    <!-- Inner ring -->
    <ellipse cx="0" cy="0" rx="16" ry="6" fill="none" stroke="url(#ringGrad1)" stroke-width="1" opacity="0.4">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="10s" repeatCount="indefinite"/>
    </ellipse>

    <!-- Central sun/star -->
    <circle cx="0" cy="0" r="8" fill="url(#solarGrad)" filter="url(#glow)">
      <animate attributeName="r" values="8;9;8" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="5" fill="#FFB800" opacity="0.8"/>
  </g>

  <!-- Wordmark -->
  <text x="95" y="52" font-family="Orbitron, Rajdhani, system-ui, sans-serif" font-size="36" font-weight="700" fill="url(#solarGrad)" letter-spacing="0.15em" filter="url(#glow)">PHLIX</text>
</svg>
