<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="starGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFB800"/>
      <stop offset="50%" stop-color="#FF6B00"/>
      <stop offset="100%" stop-color="#FF4500"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Central Star -->
  <circle cx="200" cy="200" r="50" fill="url(#starGradient)" filter="url(#glow)"/>
  
  <!-- Inner Ring -->
  <ellipse cx="200" cy="200" rx="100" ry="40" fill="none" stroke="#FFB800" stroke-width="3">
    <animateTransform attributeName="transform" type="rotate" from="0 200 200" to="360 200 200" dur="20s" repeatCount="indefinite"/>
  </ellipse>
  
  <!-- Middle Ring -->
  <ellipse cx="200" cy="200" rx="150" ry="60" fill="none" stroke="#FF6B00" stroke-width="2">
    <animateTransform attributeName="transform" type="rotate" from="360 200 200" to="0 200 200" dur="15s" repeatCount="indefinite"/>
  </ellipse>
  
  <!-- Outer Ring -->
  <ellipse cx="200" cy="200" rx="200" ry="80" fill="none" stroke="#FF4500" stroke-width="2">
    <animateTransform attributeName="transform" type="rotate" from="0 200 200" to="360 200 200" dur="25s" repeatCount="indefinite"/>
  </ellipse>
  
  <!-- Energy Collectors -->
  <polygon points="300,200 320,215 320,185" fill="#FFB800"/>
  <polygon points="100,200 80,215 80,185" fill="#FFB800"/>
  <polygon points="200,100 215,80 185,80" fill="#FFB800"/>
  <polygon points="200,300 215,320 185,320" fill="#FFB800"/>
  
  <!-- Energy Beams -->
  <line x1="250" y1="200" x2="290" y2="200" stroke="#FF6B00" stroke-width="2" stroke-dasharray="5,3">
    <animate attributeName="stroke-dashoffset" from="0" to="16" dur="1s" repeatCount="indefinite"/>
  </line>
  <line x1="150" y1="200" x2="110" y2="200" stroke="#FF6B00" stroke-width="2" stroke-dasharray="5,3">
    <animate attributeName="stroke-dashoffset" from="0" to="16" dur="1s" repeatCount="indefinite"/>
  </line>
</svg>
