<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="solarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFB800"/>
      <stop offset="100%" style="stop-color:#FF6B00"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="32" height="32" rx="4" fill="#1A0A00"/>
  <!-- Megastructure ring -->
  <ellipse cx="16" cy="16" rx="12" ry="5" fill="none" stroke="#FF6B00" stroke-width="1" opacity="0.7"/>
  <ellipse cx="16" cy="16" rx="9" ry="3.5" fill="none" stroke="#FFB800" stroke-width="0.8" opacity="0.5"/>
  <!-- Central star -->
  <circle cx="16" cy="16" r="5" fill="url(#solarGrad)"/>
  <circle cx="16" cy="16" r="3" fill="#FFB800"/>
</svg>
