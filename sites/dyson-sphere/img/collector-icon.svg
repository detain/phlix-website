<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Energy Collector Hexagon -->
  <defs>
    <linearGradient id="collectorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFB800"/>
      <stop offset="100%" stop-color="#FF6B00"/>
    </linearGradient>
  </defs>
  
  <!-- Outer hexagon -->
  <polygon points="32,4 56,18 56,46 32,60 8,46 8,18" fill="url(#collectorGrad)" opacity="0.3"/>
  
  <!-- Inner hexagon -->
  <polygon points="32,12 48,22 48,42 32,52 16,42 16,22" fill="none" stroke="#FFB800" stroke-width="2"/>
  
  <!-- Core -->
  <circle cx="32" cy="32" r="8" fill="#FFB800"/>
  
  <!-- Connection points -->
  <line x1="32" y1="12" x2="32" y2="24" stroke="#FF6B00" stroke-width="1"/>
  <line x1="48" y1="22" x2="40" y2="27" stroke="#FF6B00" stroke-width="1"/>
  <line x1="48" y1="42" x2="40" y2="37" stroke="#FF6B00" stroke-width="1"/>
  <line x1="32" y1="52" x2="32" y2="40" stroke="#FF6B00" stroke-width="1"/>
  <line x1="16" y1="42" x2="24" y2="37" stroke="#FF6B00" stroke-width="1"/>
  <line x1="16" y1="22" x2="24" y2="27" stroke="#FF6B00" stroke-width="1"/>
</svg>
