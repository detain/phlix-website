<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Power Core Symbol -->
  <defs>
    <linearGradient id="powerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFB800"/>
      <stop offset="50%" stop-color="#FF6B00"/>
      <stop offset="100%" stop-color="#FF4500"/>
    </linearGradient>
  </defs>
  
  <!-- Outer ring -->
  <circle cx="32" cy="32" r="28" fill="none" stroke="url(#powerGrad)" stroke-width="3"/>
  
  <!-- Middle ring -->
  <circle cx="32" cy="32" r="20" fill="none" stroke="#FF6B00" stroke-width="2"/>
  
  <!-- Inner ring -->
  <circle cx="32" cy="32" r="12" fill="none" stroke="#FFB800" stroke-width="2"/>
  
  <!-- Core -->
  <circle cx="32" cy="32" r="6" fill="#FFB800"/>
  
  <!-- Power rays -->
  <line x1="32" y1="0" x2="32" y2="8" stroke="#FFB800" stroke-width="2"/>
  <line x1="32" y1="56" x2="32" y2="64" stroke="#FFB800" stroke-width="2"/>
  <line x1="0" y1="32" x2="8" y2="32" stroke="#FFB800" stroke-width="2"/>
  <line x1="56" y1="32" x2="64" y2="32" stroke="#FFB800" stroke-width="2"/>
</svg>
