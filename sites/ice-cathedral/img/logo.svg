<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 80" width="200" height="80">
  <!-- Ice Cathedral wordmark for Phlix -->
  <!-- Polar gothic: gothic arch + sharp typography on polar night -->

  <!-- Background: polar night -->
  <rect width="200" height="80" fill="#04101C"/>

  <!-- Gothic pointed arch outline (decorative top element) -->
  <path d="M100 4 L100 4 L136 32 L136 36 L100 12 L64 36 L64 32 Z"
        fill="none" stroke="#A8D8FF" stroke-width="1" opacity="0.7"/>

  <!-- Rose window radial lattice (subtle, centered above wordmark) -->
  <g transform="translate(100, 20)" opacity="0.35">
    <circle cx="0" cy="0" r="8" fill="none" stroke="#A8D8FF" stroke-width="0.75"/>
    <line x1="0" y1="-8" x2="0" y2="8" stroke="#A8D8FF" stroke-width="0.5"/>
    <line x1="-8" y1="0" x2="8" y2="0" stroke="#A8D8FF" stroke-width="0.5"/>
    <line x1="-5.6" y1="-5.6" x2="5.6" y2="5.6" stroke="#A8D8FF" stroke-width="0.5"/>
    <line x1="5.6" y1="-5.6" x2="-5.6" y2="5.6" stroke="#A8D8FF" stroke-width="0.5"/>
    <circle cx="0" cy="0" r="3" fill="none" stroke="#A8D8FF" stroke-width="0.5"/>
  </g>

  <!-- Crystal facet divider line -->
  <line x1="40" y1="48" x2="160" y2="48" stroke="#1A3050" stroke-width="1"/>

  <!-- Wordmark: PHLIX -->
  <text x="100" y="70"
        font-family="Cinzel, 'Trajan Pro', 'Times New Roman', serif"
        font-size="22"
        font-weight="700"
        letter-spacing="0.15em"
        text-anchor="middle"
        fill="#EEF5FF">PHLIX</text>
</svg>
