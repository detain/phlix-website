<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Ice Cathedral OG social share image (1200x630) -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#04101C"/>
      <stop offset="60%" stop-color="#04101C"/>
      <stop offset="100%" stop-color="#081828"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="45%">
      <stop offset="0%" stop-color="rgba(168,216,255,0.18)" stop-opacity="1"/>
      <stop offset="100%" stop-color="rgba(168,216,255,0)" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="archGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#A8D8FF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#6090FF" stop-opacity="0.5"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Ambient crystal glow -->
  <ellipse cx="600" cy="280" rx="500" ry="300" fill="url(#glow)"/>

  <!-- Large gothic arch outline (left) -->
  <path d="M180 580 L180 580 L280 350 L280 280 L180 160 L80 280 L80 350 Z"
        fill="none" stroke="rgba(168,216,255,0.15)" stroke-width="2"/>

  <!-- Large gothic arch outline (right) -->
  <path d="M1020 580 L1020 580 L1120 350 L1120 280 L1020 160 L920 280 L920 350 Z"
        fill="none" stroke="rgba(168,216,255,0.15)" stroke-width="2"/>

  <!-- Rose window radial lattice (centered top) -->
  <g transform="translate(600, 180)" opacity="0.5">
    <circle cx="0" cy="0" r="80" fill="none" stroke="#A8D8FF" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="55" fill="none" stroke="#A8D8FF" stroke-width="1"/>
    <circle cx="0" cy="0" r="30" fill="none" stroke="#A8D8FF" stroke-width="0.75"/>
    <circle cx="0" cy="0" r="8" fill="none" stroke="#A8D8FF" stroke-width="1"/>
    <!-- 8 radial lines -->
    <line x1="0" y1="-80" x2="0" y2="80" stroke="#A8D8FF" stroke-width="0.75"/>
    <line x1="-80" y1="0" x2="80" y2="0" stroke="#A8D8FF" stroke-width="0.75"/>
    <line x1="-56.6" y1="-56.6" x2="56.6" y2="56.6" stroke="#A8D8FF" stroke-width="0.75"/>
    <line x1="56.6" y1="-56.6" x2="-56.6" y2="56.6" stroke="#A8D8FF" stroke-width="0.75"/>
    <!-- Secondary lines (inner) -->
    <line x1="0" y1="-55" x2="0" y2="55" stroke="#A8D8FF" stroke-width="0.5"/>
    <line x1="-55" y1="0" x2="55" y2="0" stroke="#A8D8FF" stroke-width="0.5"/>
  </g>

  <!-- Crystal facet horizontal line divider -->
  <line x1="200" y1="340" x2="1000" y2="340" stroke="#1A3050" stroke-width="1"/>

  <!-- Eyebrow text -->
  <text x="600" y="400"
        font-family="Josefin Sans, Futura, sans-serif"
        font-size="14"
        font-weight="600"
        letter-spacing="0.3em"
        text-anchor="middle"
        fill="#A8D8FF"
        opacity="0.9">SELF-HOSTED MEDIA SERVER</text>

  <!-- Main headline -->
  <text x="600" y="475"
        font-family="Cinzel, 'Trajan Pro', 'Times New Roman', serif"
        font-size="72"
        font-weight="700"
        letter-spacing="0.1em"
        text-anchor="middle"
        fill="#EEF5FF">Silence. Light. Story.</text>

  <!-- Phlix wordmark -->
  <text x="600" y="550"
        font-family="Cinzel, 'Trajan Pro', 'Times New Roman', serif"
        font-size="20"
        font-weight="400"
        letter-spacing="0.35em"
        text-anchor="middle"
        fill="rgba(168,216,255,0.7)">PHLIX</text>

  <!-- Frost crystal corner details -->
  <g opacity="0.2">
    <!-- Top-left -->
    <line x1="30" y1="30" x2="80" y2="30" stroke="#A8D8FF" stroke-width="1"/>
    <line x1="30" y1="30" x2="30" y2="80" stroke="#A8D8FF" stroke-width="1"/>
    <line x1="30" y1="30" x2="55" y2="55" stroke="#A8D8FF" stroke-width="0.75"/>
    <!-- Top-right -->
    <line x1="1170" y1="30" x2="1120" y2="30" stroke="#A8D8FF" stroke-width="1"/>
    <line x1="1170" y1="30" x2="1170" y2="80" stroke="#A8D8FF" stroke-width="1"/>
    <line x1="1170" y1="30" x2="1145" y2="55" stroke="#A8D8FF" stroke-width="0.75"/>
    <!-- Bottom-left -->
    <line x1="30" y1="600" x2="80" y2="600" stroke="#A8D8FF" stroke-width="1"/>
    <line x1="30" y1="600" x2="30" y2="550" stroke="#A8D8FF" stroke-width="1"/>
    <line x1="30" y1="600" x2="55" y2="575" stroke="#A8D8FF" stroke-width="0.75"/>
    <!-- Bottom-right -->
    <line x1="1170" y1="600" x2="1120" y2="600" stroke="#A8D8FF" stroke-width="1"/>
    <line x1="1170" y1="600" x2="1170" y2="550" stroke="#A8D8FF" stroke-width="1"/>
    <line x1="1170" y1="600" x2="1145" y2="575" stroke="#A8D8FF" stroke-width="0.75"/>
  </g>
</svg>
