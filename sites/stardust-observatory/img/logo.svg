<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" role="img" aria-label="Phlix">
  <title>Phlix</title>
  <desc>Stardust Observatory brand — Phlix wordmark with constellation mark</desc>

  <!-- Observatory dome arc mark + star -->
  <g transform="translate(8, 4)">
    <!-- Dome arc -->
    <path d="M8 38 Q20 8 32 38" fill="none" stroke="#C9A84C" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Meridian ring through dome -->
    <ellipse cx="20" cy="28" rx="14" ry="14" fill="none" stroke="#7A5C2A" stroke-width="1" opacity="0.7"/>
    <line x1="20" y1="14" x2="20" y2="42" stroke="#7A5C2A" stroke-width="0.75" opacity="0.5"/>
    <!-- Constellation star at apex -->
    <polygon points="20,4 21.2,7.6 25,7.6 22,9.9 23.2,13.5 20,11.2 16.8,13.5 18,9.9 15,7.6 18.8,7.6" fill="#C9A84C" opacity="0.9"/>
  </g>

  <!-- Wordmark -->
  <text x="58" y="40"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="26"
    font-weight="700"
    letter-spacing="0.02em"
    fill="#EDE4CC">Phlix</text>

  <!-- Subtle tagline underline accent -->
  <line x1="58" y1="46" x2="138" y2="46" stroke="#7A5C2A" stroke-width="0.75" opacity="0.5"/>
</svg>
