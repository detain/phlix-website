<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Phlix — Stardust Observatory social image">
  <title>Phlix — Stardust Observatory</title>
  <desc>Open Graph social share image for Stardust Observatory Phlix brand kit</desc>

  <defs>
    <linearGradient id="zenith" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1A2744"/>
      <stop offset="100%" stop-color="#0D1B2A"/>
    </linearGradient>
    <radialGradient id="nebula" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="rgba(123,94,167,0.35)"/>
      <stop offset="100%" stop-color="rgba(13,27,42,0)"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#zenith)"/>
  <rect width="1200" height="630" fill="url(#nebula)"/>

  <!-- Star field -->
  <g fill="#A8B4C0" opacity="0.6">
    <circle cx="100" cy="120" r="1.2"/>
    <circle cx="240" cy="80" r="0.8"/>
    <circle cx="380" cy="150" r="1"/>
    <circle cx="520" cy="60" r="1.5"/>
    <circle cx="680" cy="110" r="1"/>
    <circle cx="820" cy="70" r="0.8"/>
    <circle cx="980" cy="130" r="1.2"/>
    <circle cx="1100" cy="90" r="1"/>
    <circle cx="150" cy="220" r="0.7"/>
    <circle cx="760" cy="200" r="0.9"/>
    <circle cx="1040" cy="250" r="1.1"/>
    <circle cx="80" cy="350" r="0.8"/>
    <circle cx="1120" cy="320" r="1"/>
    <circle cx="300" cy="400" r="0.7"/>
    <circle cx="900" cy="380" r="1.2"/>
  </g>
  <!-- Gold stars -->
  <g fill="#C9A84C" opacity="0.7" filter="url(#glow)">
    <circle cx="640" cy="280" r="2"/>
    <circle cx="560" cy="150" r="1.5"/>
    <circle cx="1080" cy="180" r="1.2"/>
    <circle cx="180" cy="160" r="1.3"/>
  </g>

  <!-- Dome arc illustration -->
  <g transform="translate(600, 360)" opacity="0.25">
    <path d="M-180 80 Q0 -120 180 80" fill="none" stroke="#C9A84C" stroke-width="2" stroke-linecap="round"/>
    <ellipse cx="0" cy="40" rx="100" ry="100" fill="none" stroke="#7A5C2A" stroke-width="1.5"/>
    <line x1="0" y1="-60" x2="0" y2="140" stroke="#7A5C2A" stroke-width="1"/>
  </g>

  <!-- Logo area -->
  <g transform="translate(600, 340)">
    <!-- Logo mark -->
    <g transform="translate(-100, -70)" opacity="0.9">
      <path d="M0 40 Q25 0 50 40" fill="none" stroke="#C9A84C" stroke-width="2" stroke-linecap="round"/>
      <ellipse cx="25" cy="28" rx="20" ry="20" fill="none" stroke="#7A5C2A" stroke-width="1.2" opacity="0.7"/>
      <polygon points="25,2 26.6,6.8 31.5,6.8 27.7,9.8 29.3,14.5 25,11.5 20.7,14.5 22.3,9.8 18.5,6.8 23.4,6.8" fill="#C9A84C" opacity="0.95"/>
    </g>
    <!-- Wordmark -->
    <text x="-28" y="10"
      font-family="Georgia, serif"
      font-size="56"
      font-weight="700"
      letter-spacing="0.03em"
      fill="#EDE4CC">Phlix</text>
  </g>

  <!-- Tagline -->
  <text x="600" y="430"
    font-family="Georgia, serif"
    font-size="22"
    font-style="italic"
    text-anchor="middle"
    fill="#A8B4C0"
    opacity="0.85">Every story begins with ancient light.</text>
</svg>
