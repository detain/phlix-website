<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="space-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#000428"/>
      <stop offset="50%" stop-color="#001B3A"/>
      <stop offset="100%" stop-color="#000428"/>
    </linearGradient>
    <linearGradient id="orbit-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D9A5"/>
      <stop offset="100%" stop-color="#00D9FF"/>
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="16" cy="16" r="15" fill="url(#space-gradient)" stroke="#00D9A5" stroke-width="0.5"/>

  <!-- Outer orbit ring -->
  <ellipse cx="16" cy="16" rx="14" ry="5" fill="none" stroke="#00D9A5" stroke-width="0.75" opacity="0.6" transform="rotate(-20 16 16)"/>

  <!-- Middle orbit ring -->
  <ellipse cx="16" cy="16" rx="14" ry="5" fill="none" stroke="#7B2D8E" stroke-width="0.75" opacity="0.5" transform="rotate(40 16 16)"/>

  <!-- Inner orbit ring -->
  <ellipse cx="16" cy="16" rx="14" ry="5" fill="none" stroke="#00D9A5" stroke-width="0.5" opacity="0.3" transform="rotate(90 16 16)"/>

  <!-- Central planet/satellite -->
  <circle cx="16" cy="16" r="4" fill="none" stroke="url(#orbit-gradient)" stroke-width="1.5"/>
  <circle cx="16" cy="16" r="1.5" fill="#00D9A5"/>

  <!-- Decorative stars -->
  <circle cx="8" cy="8" r="0.75" fill="#FFFFFF" opacity="0.8"/>
  <circle cx="24" cy="10" r="0.5" fill="#FFFFFF" opacity="0.6"/>
  <circle cx="22" cy="22" r="0.75" fill="#FFFFFF" opacity="0.7"/>
  <circle cx="7" cy="22" r="0.5" fill="#FFFFFF" opacity="0.5"/>
  <circle cx="12" cy="5" r="0.4" fill="#00D9A5" opacity="0.6"/>
  <circle cx="25" cy="18" r="0.4" fill="#7B2D8E" opacity="0.5"/>
</svg>
