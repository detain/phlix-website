<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Void black background -->
  <rect width="1200" height="630" fill="#000428"/>

  <!-- Nebula wisp left -->
  <ellipse cx="200" cy="400" rx="400" ry="300" fill="url(#nebulaGrad)" opacity="0.4"/>

  <!-- Starfield dots -->
  <g fill="white" opacity="0.6">
    <circle cx="100" cy="80" r="1"/>
    <circle cx="250" cy="120" r="0.8"/>
    <circle cx="400" cy="60" r="1.2"/>
    <circle cx="550" cy="100" r="0.7"/>
    <circle cx="700" cy="50" r="1"/>
    <circle cx="850" cy="90" r="0.9"/>
    <circle cx="1000" cy="70" r="1.1"/>
    <circle cx="1100" cy="130" r="0.8"/>
    <circle cx="150" cy="200" r="0.6"/>
    <circle cx="350" cy="180" r="1"/>
    <circle cx="600" cy="160" r="0.8"/>
    <circle cx="900" cy="200" r="1.2"/>
    <circle cx="1050" cy="250" r="0.7"/>
    <circle cx="80" cy="350" r="0.9"/>
    <circle cx="500" cy="300" r="0.6"/>
    <circle cx="750" cy="280" r="1"/>
    <circle cx="950" cy="350" r="0.8"/>
    <circle cx="1100" cy="400" r="1"/>
    <circle cx="300" cy="450" r="0.7"/>
    <circle cx="650" cy="500" r="0.9"/>
    <circle cx="450" cy="550" r="1.1"/>
  </g>

  <!-- Orbit arc decorative -->
  <circle cx="600" cy="350" r="200" stroke="#00D9A5" stroke-width="1" fill="none" stroke-dasharray="6,6" opacity="0.3"/>
  <circle cx="600" cy="350" r="260" stroke="#7B2D8E" stroke-width="0.5" fill="none" stroke-dasharray="4,8" opacity="0.2"/>

  <!-- Planet mark -->
  <circle cx="600" cy="350" r="40" fill="#7B2D8E"/>
  <circle cx="590" cy="340" r="12" fill="#00D9A5" opacity="0.5"/>
  <circle cx="600" cy="350" r="200" stroke="#00D9A5" stroke-width="1.5" stroke-dasharray="4,4" fill="none" opacity="0.5"/>

  <!-- Wordmark -->
  <text x="600" y="240" font-family="Orbitron, sans-serif" font-size="72" font-weight="700" fill="white" text-anchor="middle" letter-spacing="0.08em">Phlix</text>

  <!-- Aurora underline -->
  <rect x="420" y="255" width="360" height="3" rx="1.5" fill="#00D9A5" opacity="0.8"/>

  <!-- Tagline -->
  <text x="600" y="300" font-family="Rajdhani, sans-serif" font-size="24" fill="rgba(255,255,255,0.7)" text-anchor="middle" letter-spacing="0.1em">YOUR MEDIA. YOUR LIBRARY. YOUR PHLIX.</text>

  <defs>
    <radialGradient id="nebulaGrad" cx="30%" cy="70%">
      <stop offset="0%" stop-color="#7B2D8E" stop-opacity="0.6"/>
      <stop offset="60%" stop-color="#7B2D8E" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#000428" stop-opacity="0"/>
    </radialGradient>
  </defs>
</svg>