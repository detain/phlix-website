<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Phlix favicon">
  <title>Phlix</title>
  <desc>Phlix media server icon — desert dune on sky blue</desc>

  <!-- Background square -->
  <rect width="32" height="32" rx="6" fill="#D4A574"/>

  <!-- Sky blue shimmer band -->
  <rect x="2" y="18" width="28" height="4" rx="2" fill="#87CEEB" opacity="0.7"/>

  <!-- Dune silhouette -->
  <path d="M2 24 Q8 19 14 22 Q20 25 26 20 Q29 18 30 19 L30 30 L2 30 Z"
        fill="#8B4513" opacity="0.6"/>

  <!-- P letter as play button -->
  <text x="6" y="17"
        font-family="Georgia, serif"
        font-size="14"
        font-weight="700"
        fill="#FAF4E8">P</text>
</svg>
