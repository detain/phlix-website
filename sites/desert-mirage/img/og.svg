<!-- OG card source — Desert Mirage, 1200x630.
     Editable source for img/og.png (rasterised with rsvg-convert).
     Vast desert with heat shimmer and mirages — sand dunes, ochre tones,
     scorched sun, cool oasis accents. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <title>Phlix — Your media. Your library. Your Phlix.</title>
  <desc>Social share card for Phlix in the Desert Mirage identity</desc>

  <defs>
    <!-- Heat shimmer gradient sky -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#87CEEB" stop-opacity="0.3" />
      <stop offset="40%" stop-color="#D4A574" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#F5DEB3" stop-opacity="0" />
    </linearGradient>
    <!-- Heat shimmer overlay -->
    <linearGradient id="shimmerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D4A574" stop-opacity="0" />
      <stop offset="20%" stop-color="#87CEEB" stop-opacity="0.08" />
      <stop offset="40%" stop-color="#D4A574" stop-opacity="0" />
      <stop offset="60%" stop-color="#87CEEB" stop-opacity="0.05" />
      <stop offset="80%" stop-color="#D4A574" stop-opacity="0" />
      <stop offset="100%" stop-color="#C19A6B" stop-opacity="0.1" />
    </linearGradient>
    <!-- Dune sand gradient -->
    <linearGradient id="sandGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#C19A6B" />
      <stop offset="100%" stop-color="#8B4513" />
    </linearGradient>
    <!-- Oasis glow -->
    <radialGradient id="oasisGlow" cx="50%" cy="60%" r="50%">
      <stop offset="0%" stop-color="#87CEEB" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#87CEEB" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Wheat background -->
  <rect width="1200" height="630" fill="#F5DEB3" />

  <!-- Sky gradient wash -->
  <rect width="1200" height="630" fill="url(#skyGrad)" />

  <!-- Oasis glow center -->
  <rect width="1200" height="630" fill="url(#oasisGlow)" />

  <!-- Heat shimmer bands -->
  <rect x="0" y="200" width="1200" height="8" fill="url(#shimmerGrad)" opacity="0.6" />
  <rect x="0" y="280" width="1200" height="4" fill="url(#shimmerGrad)" opacity="0.4" />
  <rect x="0" y="360" width="1200" height="6" fill="url(#shimmerGrad)" opacity="0.5" />

  <!-- Distant dune silhouette -->
  <path d="M0 480 Q150 420 300 450 Q450 480 600 430 Q750 380 900 420 Q1050 460 1200 430 L1200 630 L0 630 Z"
        fill="#C19A6B" opacity="0.5" />

  <!-- Middle dune -->
  <path d="M0 520 Q200 470 400 500 Q600 530 800 480 Q1000 430 1200 470 L1200 630 L0 630 Z"
        fill="#D4A574" opacity="0.75" />

  <!-- Foreground dune -->
  <path d="M0 570 Q300 520 500 545 Q700 570 900 535 Q1050 510 1200 530 L1200 630 L0 630 Z"
        fill="#8B4513" opacity="0.85" />

  <!-- Sky shimmer line at horizon -->
  <path d="M0 470 Q300 455 600 468 Q900 481 1200 462"
        fill="none" stroke="#87CEEB" stroke-width="2" opacity="0.5" />

  <!-- Wordmark: Phlix -->
  <text x="80" y="260"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="96"
        font-weight="700"
        letter-spacing="0.04em"
        fill="#8B4513">Phlix</text>

  <!-- Tagline -->
  <text x="80" y="320"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="28"
        font-weight="400"
        letter-spacing="0.02em"
        fill="#C19A6B">Your media. Your library. Your Phlix.</text>

  <!-- Subtle separator line -->
  <line x1="80" y1="345" x2="320" y2="345" stroke="#D4A574" stroke-width="2" opacity="0.7" />

  <!-- Feature pills -->
  <rect x="80" y="370" width="180" height="32" rx="16" fill="#D4A574" opacity="0.2" />
  <text x="96" y="392"
        font-family="Georgia, serif"
        font-size="13"
        fill="#8B4513"
        letter-spacing="0.05em">SYNCPLAY</text>

  <rect x="280" y="370" width="200" height="32" rx="16" fill="#D4A574" opacity="0.2" />
  <text x="296" y="392"
        font-family="Georgia, serif"
        font-size="13"
        fill="#8B4513"
        letter-spacing="0.05em">LIVE TV + DVR</text>

  <rect x="500" y="370" width="180" height="32" rx="16" fill="#D4A574" opacity="0.2" />
  <text x="516" y="392"
        font-family="Georgia, serif"
        font-size="13"
        fill="#8B4513"
        letter-spacing="0.05em">DLNA</text>

  <rect x="700" y="370" width="180" height="32" rx="16" fill="#87CEEB" opacity="0.25" />
  <text x="716" y="392"
        font-family="Georgia, serif"
        font-size="13"
        fill="#8B4513"
        letter-spacing="0.05em">HUB RELAY</text>

</svg>
