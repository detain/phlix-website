  <!-- Wordmark: Phlix -->
  <text x="14" y="38"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="28"
        font-weight="700"
        letter-spacing="0.04em"
        fill="#8B4513">Phlix</text>
</svg>
