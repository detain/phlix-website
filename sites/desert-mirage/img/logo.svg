<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" role="img" aria-label="Phlix logo">
  <title>Phlix</title>
  <desc>Phlix media server wordmark with desert dune horizon</desc>

  <!-- Dune horizon silhouette -->
  <path d="M0 52 Q30 38 60 44 Q90 50 120 40 Q150 30 180 38 Q195 42 200 40 L200 60 L0 60 Z"
        fill="#D4A574" opacity="0.85"/>

  <!-- Subtle shimmer line -->
  <path d="M0 50 Q50 44 100 48 Q150 52 200 46"
