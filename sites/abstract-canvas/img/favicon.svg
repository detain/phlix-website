<!-- Favicon SVG — Abstract Canvas
     Simple square mark in carbon black with a gestural 'P' mark
     in cadmium red — matches primary color palette -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <title>Phlix favicon</title>
  <rect width="32" height="32" rx="4" fill="#1A1A1A"/>
  <!-- Abstract P mark in white/cream -->
  <text x="6" y="24"
        font-family="Georgia, serif"
        font-size="20"
        font-weight="700"
        fill="#F0EDE4">P</text>
  <!-- Cadmium red accent dot -->
  <circle cx="24" cy="8" r="3" fill="#CC2200" opacity="0.9"/>
</svg>
