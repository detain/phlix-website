<!-- Logo — Abstract Canvas wordmark for Phlix.
     logo_rules: serif wordmark in the Cormorant Garamond register, optional
     medium-radius rectangle with a sizing-ground border, generous negative
     space, carbon-black wordmark on gallery linen, one cadmium accent.
     Allowed symbols used: canvas stretcher frame, gestural brushstroke mark,
     colour field rectangle. No play-button triangle, no gears, no glows.
     SVG text uses Cormorant's declared fallback (Georgia) because a webfont
     cannot load inside an <img>. -->
<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 240 60"
  width="240"
  height="60"
  role="img"
  aria-label="Phlix"
>
  <title>Phlix</title>
  <desc>The Phlix wordmark in the Abstract Canvas identity</desc>

  <!-- Canvas stretcher frame -->
  <rect x="1" y="1" width="238" height="58" rx="6" fill="#F0EDE4" stroke="#C8C2B0" />

  <!-- Colour field rectangle holding the left margin, like a gallery wall -->
  <rect x="12" y="12" width="13" height="36" rx="2" fill="#CC2200" opacity="0.85" />
  <rect x="12" y="30" width="13" height="18" rx="2" fill="#0055AA" opacity="0.55" />

  <!-- Wordmark. Sits clear of the stroke below it: at nav size a mark that
       crosses the baseline reads as a strikethrough. -->
  <text
    x="40"
    y="36"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="30"
    font-weight="700"
    letter-spacing="-0.5"
    fill="#1A1A1A"
  >
    Phlix
  </text>

  <!-- One gestural mark, well below the descenders, ending in cadmium -->
  <path
    d="M41 51 C74 46 104 55 136 49"
    stroke="#3A3128"
    stroke-width="2"
    stroke-linecap="round"
    fill="none"
    opacity="0.4"
  />
  <path
    d="M144 48 C164 45 180 51 198 46"
    stroke="#CC2200"
    stroke-width="2.5"
    stroke-linecap="round"
    fill="none"
  />
</svg>
