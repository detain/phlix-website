<!-- Logo SVG — Abstract Canvas brand wordmark
     Wordmark: Phlix in Cormorant-inspired serif letterforms
     Accent: gestural cadmium-red brushstroke mark
     Simple, high-contrast, reads on gallery linen at all sizes -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" width="240" height="60"
     role="img" aria-label="Phlix">
  <title>Phlix</title>
  <desc>Abstract Canvas brand wordmark for Phlix</desc>

  <!-- Gestural brushstroke accent — cadmium red, like a mark made by a brush -->
  <path d="M12 42 Q18 38 26 40 Q34 42 38 44 Q44 46 52 44"
        stroke="#CC2200" stroke-width="2.5" stroke-linecap="round"
        fill="none" opacity="0.85"/>

  <!-- Wordmark: "Phlix" -->
  <!-- Using SVG text with a fallback to built-in serif forms -->
  <text x="8" y="36"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="32"
        font-weight="600"
        letter-spacing="-0.5"
        fill="#1A1A1A">Phlix</text>

  <!-- Brushstroke underline accent on 'i' dot area — ultramarine -->
  <circle cx="98" cy="12" r="3.5" fill="#0055AA" opacity="0.8"/>
</svg>
