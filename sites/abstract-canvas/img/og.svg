<!-- OG card source — Abstract Canvas, 1200x630.
     Editable source for img/og.png (rasterised with rsvg-convert). Carries the
     wordmark, the kit's tagline_primary and the copy_overlay hero headline over
     a Rothko-style colour field on gallery linen. No named XML entities: a
     DTD-less SVG rejects them and libxml2 then refuses the document. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <title>Phlix — Every Frame Is a Brushstroke</title>
  <desc>Social share card for Phlix in the Abstract Canvas identity</desc>

  <defs>
    <linearGradient id="colorField" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#CC2200" stop-opacity="0.14" />
      <stop offset="42%" stop-color="#C8900A" stop-opacity="0.07" />
      <stop offset="100%" stop-color="#F0EDE4" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="redField" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#CC2200" stop-opacity="0.62" />
      <stop offset="100%" stop-color="#CC2200" stop-opacity="0.26" />
    </linearGradient>
    <linearGradient id="blueField" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0055AA" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#0055AA" stop-opacity="0.2" />
    </linearGradient>
  </defs>

  <!-- Warm gallery-linen ground -->
  <rect width="1200" height="630" fill="#F0EDE4" />
  <rect width="1200" height="630" fill="url(#colorField)" />

  <!-- Two floating colour fields, right-hand third -->
  <rect x="812" y="70" width="316" height="240" rx="6" fill="url(#redField)" />
  <rect x="856" y="330" width="272" height="230" rx="6" fill="url(#blueField)" />

  <!-- Gestural marks -->
  <path
    d="M96 556 C260 520 380 588 560 548 C660 526 720 560 812 536"
    stroke="#3A3128"
    stroke-width="9"
    stroke-linecap="round"
    fill="none"
    opacity="0.6"
  />
  <path
    d="M96 92 C200 66 280 122 372 92"
    stroke="#CC2200"
    stroke-width="6"
    stroke-linecap="round"
    fill="none"
    opacity="0.7"
  />

  <!-- Vertical cadmium accent bar, holding the type block -->
  <rect x="76" y="196" width="5" height="250" rx="2" fill="#CC2200" />

  <text
    x="112"
    y="222"
    font-family="Helvetica, Arial, sans-serif"
    font-size="24"
    font-weight="600"
    letter-spacing="5"
    fill="#B31E00"
  >
    SELF-HOSTED CREATIVITY
  </text>

  <text
    x="108"
    y="330"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="104"
    font-weight="700"
    letter-spacing="-3"
    fill="#1A1A1A"
  >
    Phlix
  </text>

  <text
    x="112"
    y="392"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="34"
    font-style="italic"
    fill="#5F594C"
  >
    Every Frame Is a Brushstroke.
  </text>

  <text
    x="112"
    y="440"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="28"
    fill="#141210"
  >
    Your collection. Your gallery. Your frame.
  </text>
</svg>
