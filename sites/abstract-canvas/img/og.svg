<!-- OG Image SVG — Abstract Canvas
     1200x630 social share card
     Full-bleed gallery linen with color-field gradient and brand wordmark -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <title>Phlix — Abstract Canvas</title>
  <desc>Social share card for Phlix Abstract Canvas brand</desc>

  <!-- Background: gallery linen -->
  <rect width="1200" height="630" fill="#F0EDE4"/>

  <!-- Color-field gradient backdrop (Rothko-inspired) -->
  <rect x="0" y="0" width="1200" height="630" fill="url(#colorField)"/>

  <!-- Color field definitions -->
  <defs>
    <linearGradient id="colorField" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#CC2200" stop-opacity="0.15"/>
      <stop offset="45%" stop-color="#0055AA" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#F0EDE4" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="brushGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#CC2200" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#CC2200" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Gestural brushstroke accent — top right -->
  <path d="M900 40 Q960 30 1020 50 Q1080 70 1160 55"
        stroke="url(#brushGradient)" stroke-width="8" stroke-linecap="round"
        fill="none" opacity="0.5"/>

  <!-- Abstract color field rectangle block — bottom right -->
  <rect x="820" y="400" width="340" height="200" rx="6"
        fill="#CC2200" opacity="0.12"/>
  <rect x="860" y="360" width="300" height="180" rx="4"
        fill="#0055AA" opacity="0.1"/>

  <!-- Brand wordmark -->
  <text x="80" y="360"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="96"
        font-weight="600"
        letter-spacing="-2"
        fill="#1A1A1A">Phlix</text>

  <!-- Tagline: Every Frame Is a Brushstroke. -->
  <text x="80" y="420"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="28"
        font-style="italic"
        fill="#8A8070"
        letter-spacing="0">Every Frame Is a Brushstroke.</text>

  <!-- Vertical cadmium-red accent bar -->
  <rect x="60" y="320" width="4" height="160" rx="2" fill="#CC2200"/>

  <!-- Decorative dot — ultramarine -->
  <circle cx="1100" cy="300" r="20" fill="#0055AA" opacity="0.2"/>

</svg>
