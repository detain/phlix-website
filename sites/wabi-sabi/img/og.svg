<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Phlix Wabi-Sabi — Open Graph image">
  <title>Phlix Wabi-Sabi OG Image</title>
  <desc>Phlix brand kit site social share card in warm wabi-sabi aesthetic</desc>

  <!-- Rice paper background -->
  <rect width="1200" height="630" fill="#F5F0E8"/>

  <!-- Subtle washi texture overlay -->
  <rect width="1200" height="630" fill="url(#noise)" opacity="0.03"/>

  <!-- Washi fiber texture -->
  <filter id="noise">
    <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/>
  </filter>

  <!-- Kintsugi radial glow — top right -->
  <radialGradient id="goldGlow" cx="75%" cy="15%" r="50%">
    <stop offset="0%" stop-color="#C8901A" stop-opacity="0.12"/>
    <stop offset="100%" stop-color="#F5F0E8" stop-opacity="0"/>
  </radialGradient>
  <rect width="1200" height="630" fill="url(#goldGlow)"/>

  <!-- Kintsugi gold horizontal accent line -->
  <line x1="80" y1="440" x2="500" y2="440" stroke="#C8901A" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>

  <!-- Phlix wordmark -->
  <text
    x="80"
    y="220"
    font-family="Georgia, 'EB Garamond', serif"
    font-size="96"
    font-weight="500"
    letter-spacing="-0.01em"
    fill="#1A1A14"
  >Phlix</text>

  <!-- Primary tagline — wabi-sabi brand voice -->
  <text
    x="80"
    y="280"
    font-family="Georgia, serif"
    font-size="28"
    font-weight="300"
    letter-spacing="0.02em"
    fill="#7C5230"
    opacity="0.85"
  >Nothing lasts. Nothing is lost.</text>

  <!-- Secondary tagline -->
  <text
    x="80"
    y="330"
    font-family="Georgia, serif"
    font-size="20"
    font-weight="300"
    letter-spacing="0.03em"
    fill="#8A7A6A"
    opacity="0.75"
  >Nothing is finished.</text>

  <!-- Kintsugi crack decorative element — bottom left -->
  <path
    d="M60 560 Q100 555 150 560 Q200 565 250 558 Q300 551 340 558"
    stroke="#C8901A"
    stroke-width="1.5"
    stroke-linecap="round"
    fill="none"
    opacity="0.5"
  />
  <path
    d="M200 558 Q230 562 260 558"
    stroke="#C8901A"
    stroke-width="2.5"
    stroke-linecap="round"
    fill="none"
    opacity="0.75"
  />

  <!-- Site name — bottom right -->
  <text
    x="1120"
    y="580"
    text-anchor="end"
    font-family="Georgia, serif"
    font-size="14"
    font-weight="400"
    letter-spacing="0.08em"
    fill="#8A7A6A"
    opacity="0.6"
    text-transform="uppercase"
  >Phlix · Self-hosted media</text>
</svg>
