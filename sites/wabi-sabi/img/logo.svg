<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 56" role="img" aria-label="Phlix Wabi-Sabi logo">
  <title>Phlix logo</title>
  <desc>Phlix brand wordmark in warm weathered oak on rice paper, with a kintsugi gold crack accent</desc>

  <!-- Background (rice paper, optional — keep transparent for flexibility) -->

  <!-- Phlix wordmark — Noto Serif JP aesthetic -->
  <text
    x="8"
    y="38"
    font-family="Georgia, 'EB Garamond', serif"
    font-size="32"
    font-weight="500"
    letter-spacing="-0.01em"
    fill="#1A1A14"
  >Phlix</text>

  <!-- Kintsugi gold crack line accent — decorative underline motif -->
  <path
    d="M8 46 Q20 44 36 46 Q52 48 64 45"
    stroke="#C8901A"
    stroke-width="1.5"
    stroke-linecap="round"
    fill="none"
    opacity="0.75"
  />
  <path
    d="M36 46 Q44 48 52 46"
    stroke="#C8901A"
    stroke-width="2"
    stroke-linecap="round"
    fill="none"
    opacity="0.9"
  />

  <!-- Subtle tagline — small, quiet -->
  <text
    x="200"
    y="46"
    font-family="Georgia, serif"
    font-size="9"
    font-weight="300"
    letter-spacing="0.06em"
    fill="#8A7A6A"
    text-anchor="end"
    opacity="0.8"
  >Wabi-Sabi</text>
</svg>
