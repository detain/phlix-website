<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="favicon-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00F5FF"/>
      <stop offset="100%" style="stop-color:#7B2CBF"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="6" fill="#1A1A2E"/>
  <g transform="translate(4, 10)">
    <rect x="0" y="6" width="3" height="6" rx="1.5" fill="url(#favicon-gradient)">
      <animate attributeName="height" values="6;12;6" dur="1s" repeatCount="indefinite"/>
      <animate attributeName="y" values="6;3;6" dur="1s" repeatCount="indefinite"/>
    </rect>
    <rect x="5" y="3" width="3" height="12" rx="1.5" fill="url(#favicon-gradient)">
      <animate attributeName="height" values="12;6;12" dur="0.8s" repeatCount="indefinite"/>
      <animate attributeName="y" values="3;6;3" dur="0.8s" repeatCount="indefinite"/>
    </rect>
    <rect x="10" y="5" width="3" height="8" rx="1.5" fill="url(#favicon-gradient)">
      <animate attributeName="height" values="8;14;8" dur="1.2s" repeatCount="indefinite"/>
      <animate attributeName="y" values="5;2;5" dur="1.2s" repeatCount="indefinite"/>
    </rect>
    <rect x="15" y="4" width="3" height="10" rx="1.5" fill="url(#favicon-gradient)">
      <animate attributeName="height" values="10;5;10" dur="0.9s" repeatCount="indefinite"/>
      <animate attributeName="y" values="4;7;4" dur="0.9s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
