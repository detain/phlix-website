<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 80" width="240" height="80">
  <defs>
    <linearGradient id="phlix-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00F5FF"/>
      <stop offset="50%" style="stop-color:#7B2CBF"/>
      <stop offset="100%" style="stop-color:#E94560"/>
    </linearGradient>
    <linearGradient id="wave-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00F5FF;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#7B2CBF;stop-opacity:0.8"/>
    </linearGradient>
  </defs>

  <!-- Sound wave bars -->
  <g transform="translate(10, 25)">
    <rect x="0" y="15" width="4" height="10" rx="2" fill="url(#wave-gradient)">
      <animate attributeName="height" values="10;25;10" dur="1.2s" repeatCount="indefinite"/>
      <animate attributeName="y" values="15;5;15" dur="1.2s" repeatCount="indefinite"/>
    </rect>
    <rect x="8" y="10" width="4" height="20" rx="2" fill="url(#wave-gradient)">
      <animate attributeName="height" values="20;35;20" dur="1s" repeatCount="indefinite"/>
      <animate attributeName="y" values="10;0;10" dur="1s" repeatCount="indefinite"/>
    </rect>
    <rect x="16" y="5" width="4" height="30" rx="2" fill="url(#wave-gradient)">
      <animate attributeName="height" values="30;10;30" dur="0.9s" repeatCount="indefinite"/>
      <animate attributeName="y" values="5;15;5" dur="0.9s" repeatCount="indefinite"/>
    </rect>
    <rect x="24" y="8" width="4" height="24" rx="2" fill="url(#wave-gradient)">
      <animate attributeName="height" values="24;14;24" dur="1.1s" repeatCount="indefinite"/>
      <animate attributeName="y" values="8;13;8" dur="1.1s" repeatCount="indefinite"/>
    </rect>
    <rect x="32" y="12" width="4" height="16" rx="2" fill="url(#wave-gradient)">
      <animate attributeName="height" values="16;28;16" dur="1.3s" repeatCount="indefinite"/>
      <animate attributeName="y" values="12;6;12" dur="1.3s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Phlix text -->
  <text x="60" y="38" font-family="'Space Grotesk', system-ui, sans-serif" font-size="32" font-weight="700" fill="url(#phlix-gradient)">Phlix</text>

  <!-- Subtitle -->
  <text x="62" y="55" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="10" fill="#A0A0B0" letter-spacing="0.1em">MEDIA SERVER</text>

  <!-- Decorative sound wave trail -->
  <path d="M60 65 Q80 60, 100 65 T140 65" stroke="url(#wave-gradient)" stroke-width="2" fill="none" opacity="0.4"/>
</svg>
