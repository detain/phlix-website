<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1A1A2E"/>
      <stop offset="50%" style="stop-color:#16213E"/>
      <stop offset="100%" style="stop-color:#0F3460"/>
    </linearGradient>
    <linearGradient id="text-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00F5FF"/>
      <stop offset="50%" style="stop-color:#7B2CBF"/>
      <stop offset="100%" style="stop-color:#E94560"/>
    </linearGradient>
    <linearGradient id="wave-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00F5FF;stop-opacity:0.9"/>
      <stop offset="100%" style="stop-color:#7B2CBF;stop-opacity:0.9"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg-gradient)"/>

  <!-- Decorative grid pattern -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#7B2CBF" stroke-opacity="0.1" stroke-width="1"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Background wave decoration -->
  <ellipse cx="200" cy="400" rx="300" ry="200" fill="#7B2CBF" fill-opacity="0.1"/>
  <ellipse cx="1000" cy="250" rx="350" ry="250" fill="#00F5FF" fill-opacity="0.08"/>

  <!-- Sound wave bars -->
  <g transform="translate(100, 280)">
    <rect x="0" y="30" width="12" height="60" rx="6" fill="url(#wave-gradient)" filter="url(#glow)"/>
    <rect x="25" y="15" width="12" height="90" rx="6" fill="url(#wave-gradient)" filter="url(#glow)"/>
    <rect x="50" y="0" width="12" height="120" rx="6" fill="url(#wave-gradient)" filter="url(#glow)"/>
    <rect x="75" y="20" width="12" height="80" rx="6" fill="url(#wave-gradient)" filter="url(#glow)"/>
    <rect x="100" y="35" width="12" height="50" rx="6" fill="url(#wave-gradient)" filter="url(#glow)"/>
    <rect x="125" y="10" width="12" height="100" rx="6" fill="url(#wave-gradient)" filter="url(#glow)"/>
    <rect x="150" y="25" width="12" height="70" rx="6" fill="url(#wave-gradient)" filter="url(#glow)"/>
    <rect x="175" y="40" width="12" height="40" rx="6" fill="url(#wave-gradient)" filter="url(#glow)"/>
  </g>

  <!-- Phlix wordmark -->
  <text x="380" y="320" font-family="'Space Grotesk', system-ui, sans-serif" font-size="120" font-weight="700" fill="url(#text-gradient)" filter="url(#glow)">Phlix</text>

  <!-- Tagline -->
  <text x="385" y="390" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="28" fill="#A0A0B0" letter-spacing="0.05em">SELF-HOSTED MEDIA SERVER</text>

  <!-- Bottom wave decoration -->
  <path d="M0 580 Q200 540, 400 580 T800 580 T1200 580 L1200 630 L0 630 Z" fill="#7B2CBF" fill-opacity="0.15"/>
  <path d="M0 600 Q200 560, 400 600 T800 600 T1200 600 L1200 630 L0 630 Z" fill="#00F5FF" fill-opacity="0.1"/>
</svg>
