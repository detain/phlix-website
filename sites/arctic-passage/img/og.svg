<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0A1A2A"/>
      <stop offset="50%" style="stop-color:#1E3A5F"/>
      <stop offset="100%" style="stop-color:#0A1A2A"/>
    </linearGradient>
    <linearGradient id="auroraGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#5DADE2;stop-opacity:0.3"/>
      <stop offset="50%" style="stop-color:#A8D8EA;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#5DADE2;stop-opacity:0.25"/>
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#5DADE2;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#5DADE2;stop-opacity:0"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Aurora wave effect -->
  <ellipse cx="600" cy="200" rx="800" ry="300" fill="url(#auroraGrad)" opacity="0.5"/>

  <!-- Central glow -->
  <ellipse cx="600" cy="315" rx="400" ry="200" fill="url(#glowGrad)"/>

  <!-- Ice crystal logo mark -->
  <g transform="translate(600, 260)" filter="url(#glow)">
    <polygon points="0,-60 14,-14 60,0 14,14 0,60 -14,14 -60,0 -14,-14" fill="#5DADE2" opacity="0.9"/>
    <circle cx="0" cy="0" r="12" fill="#FFFFFF" opacity="0.9"/>
  </g>

  <!-- Wordmark -->
  <text x="600" y="380" text-anchor="middle" font-family="Georgia, serif" font-size="72" font-weight="400" fill="#FFFFFF" letter-spacing="12">PHLIX</text>

  <!-- Tagline -->
  <text x="600" y="440" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="300" fill="#A8D8EA" letter-spacing="2">Your media. Your library. Your Phlix.</text>

  <!-- Subtle bottom wave -->
  <path d="M0 550 Q300 520 600 550 T1200 550 L1200 630 L0 630 Z" fill="#1E3A5F" opacity="0.5"/>
  <path d="M0 580 Q300 560 600 580 T1200 580 L1200 630 L0 630 Z" fill="#0A1A2A" opacity="0.8"/>
</svg>
