<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" width="200" height="60">
  <defs>
    <linearGradient id="glacierGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#A8D8EA"/>
      <stop offset="50%" style="stop-color:#5DADE2"/>
      <stop offset="100%" style="stop-color:#1E3A5F"/>
    </linearGradient>
    <linearGradient id="auroraGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#5DADE2;stop-opacity:0"/>
      <stop offset="50%" style="stop-color:#A8D8EA;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#5DADE2;stop-opacity:0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Aurora wave behind -->
  <path d="M0 35 Q25 25 50 35 T100 35 T150 35 T200 35 L200 45 L0 45 Z" fill="url(#auroraGrad)" opacity="0.3"/>

  <!-- Ice crystal mark -->
  <g transform="translate(8, 10)" filter="url(#glow)">
    <polygon points="20,0 23,17 40,20 23,23 20,40 17,23 0,20 17,17" fill="url(#glacierGrad)" opacity="0.9"/>
    <circle cx="20" cy="20" r="4" fill="#FFFFFF" opacity="0.8"/>
  </g>

  <!-- Wordmark -->
  <text x="55" y="38" font-family="Georgia, serif" font-size="28" font-weight="400" fill="#FFFFFF" letter-spacing="4">PHLIX</text>

  <!-- Subtle underline -->
  <rect x="55" y="44" width="90" height="1" fill="url(#glacierGrad)" opacity="0.5"/>
</svg>
