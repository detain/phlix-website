<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lost in the Void | Void Walker</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%230A0A0F' stroke='%236C63FF' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='6' fill='none' stroke='%236C63FF' stroke-width='1.5'/%3E%3Ccircle cx='16' cy='16' r='2' fill='%236C63FF'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/portal.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="void-bg" aria-hidden="true">
    <div class="void-texture"></div>
    <div class="void-depth-1"></div>
    <div class="void-depth-2"></div>
  </div>

  <div class="debris-container" aria-hidden="true" id="debris-container"></div>

  <div class="rift-overlay" aria-hidden="true">
    <div class="rift-line rift-line-1"></div>
    <div class="rift-line rift-line-2"></div>
    <div class="rift-line rift-line-3"></div>
  </div>

  <div class="shadow-creature" aria-hidden="true" id="shadow-creature">
    <div class="creature-body"></div>
    <div class="creature-eye left"></div>
    <div class="creature-eye right"></div>
    <div class="creature-aura"></div>
  </div>

  <main style="min-height: 100vh; display: flex; align-items: center; justify-content: center; flex-direction: column; text-align: center; padding: 2rem; position: relative; z-index: 10;">
    <div style="font-family: var(--font-headline); font-size: clamp(6rem, 20vw, 12rem); font-weight: 900; color: var(--rift-violet); opacity: 0.15; line-height: 1;">404</div>

    <h1 style="font-family: var(--font-headline); font-size: clamp(1.5rem, 4vw, 2.5rem); margin: 2rem 0; color: var(--membrane-white);">
      Lost in the Between
    </h1>

    <p style="font-family: var(--font-body); font-size: 1.1rem; color: rgba(232,232,240,0.6); max-width: 500px; margin-bottom: 3rem; line-height: 1.7;">
      You've crossed into a dimension that doesn't exist. The membrane between
      realities has no record of this page. Perhaps it was consumed by the void,
      or perhaps it never existed in any timeline.
    </p>

    <div style="display: flex; gap: 1rem; flex-wrap: wrap; justify-content: center;">
      <a href="/" class="btn btn-primary">
        Return to Crossing
      </a>
      <a href="hub.html" class="btn btn-ghost">
        Enter the Hub
      </a>
    </div>
  </main>

  <script src="js/particles.js"></script>
  <script src="js/portal.js"></script>
  <script src="js/glitch.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
