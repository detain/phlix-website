<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <rect width="1200" height="630" fill="#0A0A0F"/>
  <!-- Radial void glow -->
  <radialGradient id="voidGlow" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#6C63FF" stop-opacity="0.2"/>
    <stop offset="50%" stop-color="#1A1A2E" stop-opacity="0.1"/>
    <stop offset="100%" stop-color="#0A0A0F" stop-opacity="0"/>
  </radialGradient>
  <rect width="1200" height="630" fill="url(#voidGlow)"/>
  <!-- Portal circles -->
  <circle cx="600" cy="315" r="200" stroke="#6C63FF" stroke-width="2" fill="none" opacity="0.3"/>
  <circle cx="600" cy="315" r="150" stroke="#6C63FF" stroke-width="1.5" fill="none" opacity="0.4"/>
  <circle cx="600" cy="315" r="100" stroke="#A78BFA" stroke-width="1" fill="none" opacity="0.3"/>
  <circle cx="600" cy="315" r="50" fill="#6C63FF" opacity="0.1"/>
  <!-- Orbiting particles -->
  <circle cx="600" cy="115" r="6" fill="#6C63FF" opacity="0.7"/>
  <circle cx="800" cy="315" r="4" fill="#6C63FF" opacity="0.5"/>
  <circle cx="600" cy="515" r="3" fill="#A78BFA" opacity="0.4"/>
  <circle cx="400" cy="315" r="5" fill="#6C63FF" opacity="0.6"/>
  <!-- Wordmark -->
  <text x="600" y="340" font-family="Orbitron, sans-serif" font-size="72" font-weight="700" letter-spacing="0.15em" fill="#E8E8F0" text-anchor="middle">PHLIX</text>
  <!-- Tagline -->
  <text x="600" y="400" font-family="Inter, sans-serif" font-size="24" fill="#A0A0B8" text-anchor="middle" letter-spacing="0.05em">Your media. Your library. Your Phlix.</text>
</svg>
