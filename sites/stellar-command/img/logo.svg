<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" fill="none">
  <!-- Starship/Command logo for Phlix - stellar-command theme -->
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5BC0BE"/>
      <stop offset="100%" stop-color="#3A506B"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Starship icon (simplified) -->
  <g transform="translate(5, 10)">
    <!-- Ship body -->
    <path d="M15 20 L25 5 L35 20 L30 35 L20 35 Z" fill="url(#logoGradient)" filter="url(#glow)"/>
    <!-- Nacelle left -->
    <rect x="5" y="18" width="10" height="4" rx="2" fill="#5BC0BE"/>
    <!-- Nacelle right -->
    <rect x="25" y="18" width="10" height="4" rx="2" fill="#5BC0BE"/>
    <!-- Beacon light -->
    <circle cx="25" cy="22" r="3" fill="#5BC0BE" opacity="0.8">
      <animate attributeName="opacity" values="0.8;0.4;0.8" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Wordmark -->
  <text x="50" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="700" fill="#FFFFFF" letter-spacing="-0.5">
    Phlix
  </text>

  <!-- Accent underline -->
  <rect x="50" y="45" width="55" height="2" rx="1" fill="#5BC0BE" opacity="0.6"/>
</svg>
