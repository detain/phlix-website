<svg viewBox="0 0 120 40" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#5BC0BE"/>
      <stop offset="50%" style="stop-color:#3A506B"/>
      <stop offset="100%" style="stop-color:#5BC0BE"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Star/triangle logo -->
  <polygon points="20,6 32,30 8,30" fill="none" stroke="url(#logoGradient)" stroke-width="2" filter="url(#glow)"/>
  <circle cx="20" cy="20" r="4" fill="none" stroke="#5BC0BE" stroke-width="1.5"/>
  <circle cx="20" cy="20" r="1.5" fill="#5BC0BE"/>
  
  <!-- Text -->
  <text x="40" y="18" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#FFFFFF" letter-spacing="0.1em">STELLAR COMMAND</text>
  <text x="40" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="6" font-weight="400" fill="#5BC0BE" letter-spacing="0.15em">MEDIA FLEET COMMAND CENTER</text>
</svg>
