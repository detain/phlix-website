<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Favicon: Starship command beacon -->
  <rect width="32" height="32" rx="4" fill="#0B132B"/>
  <rect x="1" y="1" width="30" height="30" rx="3" fill="none" stroke="#3A506B" stroke-width="1"/>

  <!-- Starship icon simplified -->
  <g transform="translate(16, 16)">
    <!-- Ship body -->
    <path d="M0 -10 L8 0 L0 10 L-5 5 L-5 -5 Z" fill="#5BC0BE"/>
    <!-- Nacelle glow -->
    <circle cx="0" cy="0" r="2" fill="#FFFFFF" opacity="0.8">
      <animate attributeName="opacity" values="0.8;0.4;0.8" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Corner accents (HUD style) -->
  <path d="M2 8 L2 2 L8 2" stroke="#5BC0BE" stroke-width="1.5" fill="none" opacity="0.6"/>
  <path d="M24 2 L30 2 L30 8" stroke="#5BC0BE" stroke-width="1.5" fill="none" opacity="0.6"/>
  <path d="M30 24 L30 30 L24 30" stroke="#5BC0BE" stroke-width="1.5" fill="none" opacity="0.6"/>
  <path d="M8 30 L2 30 L2 24" stroke="#5BC0BE" stroke-width="1.5" fill="none" opacity="0.6"/>
</svg>
