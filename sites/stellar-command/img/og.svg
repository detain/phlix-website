<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <!-- OG Image: Starship command bridge theme -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B"/>
      <stop offset="100%" stop-color="#1C2541"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3A506B"/>
      <stop offset="50%" stop-color="#5BC0BE"/>
      <stop offset="100%" stop-color="#3A506B"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Grid lines -->
  <g opacity="0.1">
    <line x1="0" y1="157" x2="1200" y2="157" stroke="#5BC0BE" stroke-width="1"/>
    <line x1="0" y1="315" x2="1200" y2="315" stroke="#5BC0BE" stroke-width="1"/>
    <line x1="0" y1="472" x2="1200" y2="472" stroke="#5BC0BE" stroke-width="1"/>
    <line x1="300" y1="0" x2="300" y2="630" stroke="#5BC0BE" stroke-width="1"/>
    <line x1="600" y1="0" x2="600" y2="630" stroke="#5BC0BE" stroke-width="1"/>
    <line x1="900" y1="0" x2="900" y2="630" stroke="#5BC0BE" stroke-width="1"/>
  </g>

  <!-- Center glow -->
  <ellipse cx="600" cy="315" rx="400" ry="250" fill="#5BC0BE" opacity="0.05"/>

  <!-- Starship icon -->
  <g transform="translate(600, 200) scale(3)">
    <path d="M0 -20 L16 0 L0 20 L-10 10 L-10 -10 Z" fill="url(#accentGrad)" filter="url(#glow)"/>
    <circle cx="0" cy="0" r="4" fill="#FFFFFF" opacity="0.9"/>
  </g>

  <!-- Title -->
  <text x="600" y="360" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="700" fill="#FFFFFF" letter-spacing="-1">
    Your media. Your library.
  </text>
  <text x="600" y="440" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="700" fill="#5BC0BE" letter-spacing="-1">
    Your Phlix.
  </text>

  <!-- Accent bar -->
  <rect x="400" y="480" width="400" height="4" rx="2" fill="url(#accentGrad)"/>

  <!-- Subtitle -->
  <text x="600" y="550" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#FFFFFF" opacity="0.7">
    Open-source media server
  </text>

  <!-- Corner HUD accents -->
  <path d="M20 60 L20 20 L60 20" stroke="#5BC0BE" stroke-width="2" fill="none" opacity="0.5"/>
  <path d="M1180 20 L1140 20 L1140 60" stroke="#5BC0BE" stroke-width="2" fill="none" opacity="0.5"/>
  <path d="M1140 570 L1140 610 L1180 610" stroke="#5BC0BE" stroke-width="2" fill="none" opacity="0.5"/>
  <path d="M60 610 L20 610 L20 570" stroke="#5BC0BE" stroke-width="2" fill="none" opacity="0.5"/>
</svg>
