<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a14"/>
      <stop offset="50%" style="stop-color:#2D4A3E"/>
      <stop offset="100%" style="stop-color:#1a1a14"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#C9A227"/>
      <stop offset="100%" style="stop-color:#a68820"/>
    </linearGradient>
    <linearGradient id="moss" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#7B8B6F"/>
      <stop offset="100%" style="stop-color:#5f6b54"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="noise" x="0" y="0" width="100" height="100" patternUnits="userSpaceOnUse">
      <circle cx="25" cy="25" r="1" fill="#7B8B6F" opacity="0.1"/>
      <circle cx="75" cy="75" r="1" fill="#7B8B6F" opacity="0.1"/>
      <circle cx="50" cy="10" r="0.5" fill="#C9A227" opacity="0.15"/>
      <circle cx="10" cy="60" r="0.5" fill="#C9A227" opacity="0.1"/>
      <circle cx="90" cy="40" r="0.5" fill="#C9A227" opacity="0.1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#noise)"/>

  <!-- Decorative arches -->
  <path d="M50 580 L50 300 Q50 200 150 200 L250 200 Q300 200 300 250 L300 300" fill="none" stroke="#7B8B6F" stroke-width="3" opacity="0.3"/>
  <path d="M900 580 L900 350 Q900 250 1000 250 L1100 250 Q1150 250 1150 300 L1150 580" fill="none" stroke="#7B8B6F" stroke-width="3" opacity="0.3"/>

  <!-- Central glow -->
  <ellipse cx="600" cy="315" rx="400" ry="200" fill="#C9A227" opacity="0.08" filter="url(#glow)"/>

  <!-- Hieroglyph decorations -->
  <g fill="#7B8B6F" opacity="0.2">
    <circle cx="100" cy="100" r="20"/>
    <circle cx="150" cy="150" r="15"/>
    <circle cx="1100" cy="100" r="20"/>
    <circle cx="1050" cy="150" r="15"/>
    <circle cx="200" cy="500" r="12"/>
    <circle cx="1000" cy="500" r="12"/>
  </g>

  <!-- Logo/Wordmark -->
  <text x="600" y="280" font-family="serif" font-size="120" font-weight="bold" fill="url(#gold)" text-anchor="middle" filter="url(#glow)">Phlix</text>

  <!-- Tagline -->
  <text x="600" y="380" font-family="sans-serif" font-size="32" fill="#e8e4d9" text-anchor="middle" opacity="0.9">Your media. Your library. Your server.</text>

  <!-- Accent line -->
  <rect x="450" y="410" width="300" height="3" fill="url(#gold)" rx="1.5"/>

  <!-- Client icons hint -->
  <g fill="#7B8B6F" opacity="0.6" transform="translate(350, 470)">
    <rect x="0" y="0" width="50" height="50" rx="8"/>
    <rect x="70" y="0" width="50" height="50" rx="8"/>
    <rect x="140" y="0" width="50" height="50" rx="8"/>
    <rect x="210" y="0" width="50" height="50" rx="8"/>
    <rect x="280" y="0" width="50" height="50" rx="8"/>
  </g>

  <!-- Small accent glyphs -->
  <text x="600" cy="530" font-family="serif" font-size="24" fill="#C9A227" opacity="0.4" text-anchor="middle">Roku · Samsung Tizen · Windows · Mobile · DLNA</text>
</svg>
