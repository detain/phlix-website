<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Dark noir background -->
  <rect width="1200" height="630" fill="#0A0C10"/>

  <!-- Gradient overlays for depth -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827" stop-opacity="1"/>
      <stop offset="100%" stop-color="#0A0C10" stop-opacity="1"/>
    </linearGradient>
    <radialGradient id="cyanGlow" cx="30%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="magentaGlow" cx="70%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#FF2D78" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#FF2D78" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="neonHorizon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF2D78" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#F5A623" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0.6"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <rect width="1200" height="630" fill="url(#cyanGlow)"/>
  <rect width="1200" height="630" fill="url(#magentaGlow)"/>

  <!-- Venetian blind shadow effect at top -->
  <g opacity="0.1">
    <rect y="0" width="1200" height="8" fill="#00E5FF"/>
    <rect y="20" width="1200" height="6" fill="#00E5FF"/>
    <rect y="38" width="1200" height="4" fill="#00E5FF"/>
  </g>

  <!-- Neon horizon line -->
  <rect x="0" y="400" width="1200" height="2" fill="url(#neonHorizon)" opacity="0.8"/>

  <!-- City silhouette -->
  <g fill="#111827" opacity="0.9">
    <!-- Buildings from left -->
    <rect x="50" y="320" width="60" height="280"/>
    <rect x="80" y="280" width="40" height="320"/>
    <rect x="130" y="350" width="50" height="250"/>
    <rect x="200" y="260" width="70" height="340"/>
    <rect x="290" y="300" width="45" height="300"/>
    <rect x="350" y="240" width="80" height="360"/>
    <rect x="450" y="290" width="55" height="310"/>
    <rect x="520" y="220" width="90" height="380"/>
    <rect x="630" y="270" width="65" height="330"/>
    <rect x="710" y="310" width="50" height="290"/>
    <rect x="780" y="250" width="75" height="350"/>
    <rect x="870" y="300" width="60" height="300"/>
    <rect x="950" y="230" width="85" height="370"/>
    <rect x="1050" y="280" width="55" height="320"/>
    <rect x="1120" y="320" width="60" height="280"/>
  </g>

  <!-- Neon window lights on buildings -->
  <g fill="#F5A623" opacity="0.8">
    <rect x="360" y="260" width="4" height="6"/>
    <rect x="370" y="275" width="4" height="6"/>
    <rect x="355" y="290" width="4" height="6"/>
    <rect x="375" y="305" width="4" height="6"/>
    <rect x="540" y="240" width="5" height="8"/>
    <rect x="555" y="255" width="5" height="8"/>
    <rect x="530" y="270" width="5" height="8"/>
    <rect x="550" y="285" width="5" height="8"/>
    <rect x="800" y="270" width="4" height="6"/>
    <rect x="815" y="285" width="4" height="6"/>
    <rect x="790" y="300" width="4" height="6"/>
    <rect x="970" y="250" width="5" height="8"/>
    <rect x="985" y="265" width="5" height="8"/>
    <rect x="960" y="280" width="5" height="8"/>
  </g>

  <!-- Cyan neon accent lights -->
  <g fill="#00E5FF" opacity="0.6">
    <rect x="340" y="255" width="6" height="3"/>
    <rect x="520" y="235" width="8" height="3"/>
    <rect x="770" y="265" width="6" height="3"/>
    <rect x="960" y="245" width="8" height="3"/>
  </g>

  <!-- Title: Phlix -->
  <text x="600" y="160" font-family="Georgia, 'Times New Roman', serif" font-weight="900" font-size="96" fill="#E8EDF5" text-anchor="middle" letter-spacing="-4">
    Phlix
  </text>

  <!-- Neon glow on title -->
  <text x="600" y="160" font-family="Georgia, 'Times New Roman', serif" font-weight="900" font-size="96" fill="none" stroke="#00E5FF" stroke-width="1" opacity="0.4" text-anchor="middle" letter-spacing="-4">
    Phlix
  </text>

  <!-- Tagline -->
  <text x="600" y="210" font-family="Georgia, serif" font-style="italic" font-size="28" fill="#7A8FA6" text-anchor="middle" letter-spacing="1">
    Every Frame, a Mystery.
  </text>

  <!-- Accent line under tagline -->
  <rect x="520" y="230" width="160" height="2" fill="#F5A623" rx="1" opacity="0.8"/>

  <!-- Bottom text: tagline secondary -->
  <text x="600" y="500" font-family="Georgia, serif" font-size="20" fill="#7A8FA6" text-anchor="middle" letter-spacing="2">
    SELF-HOSTED MEDIA SERVER
  </text>

  <!-- Neon bar at very bottom -->
  <rect x="0" y="620" width="1200" height="10" fill="#0A0C10"/>
  <rect x="0" y="622" width="1200" height="2" fill="#F5A623" opacity="0.6"/>
  <rect x="0" y="626" width="1200" height="1" fill="#00E5FF" opacity="0.4"/>
</svg>
