<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="bg-glow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1C2333"/>
      <stop offset="100%" stop-color="#0A0C10"/>
    </radialGradient>
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="amber-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="venetian-blinds" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2A3650" stop-opacity="0"/>
      <stop offset="50%" stop-color="#2A3650" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#2A3650" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg-glow)"/>

  <!-- Venetian blind shadow lines -->
  <g opacity="0.3">
    <rect x="0" y="0" width="1200" height="8" fill="#2A3650" opacity="0.5"/>
    <rect x="0" y="80" width="1200" height="4" fill="#2A3650" opacity="0.3"/>
    <rect x="0" y="160" width="1200" height="4" fill="#2A3650" opacity="0.3"/>
    <rect x="0" y="240" width="1200" height="4" fill="#2A3650" opacity="0.3"/>
    <rect x="0" y="320" width="1200" height="4" fill="#2A3650" opacity="0.3"/>
    <rect x="0" y="400" width="1200" height="4" fill="#2A3650" opacity="0.3"/>
    <rect x="0" y="480" width="1200" height="4" fill="#2A3650" opacity="0.3"/>
    <rect x="0" y="560" width="1200" height="4" fill="#2A3650" opacity="0.3"/>
  </g>

  <!-- Neon cyan horizon line -->
  <rect x="0" y="440" width="1200" height="2" fill="#00E5FF" opacity="0.15"/>

  <!-- Wordmark: Phlix -->
  <text x="600" y="320" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="140" font-weight="700" font-style="italic"
        fill="#E8EDF5" letter-spacing="-4"
        filter="url(#neon-glow)">Phlix</text>

  <!-- Tagline -->
  <text x="600" y="380" text-anchor="middle"
        font-family="system-ui, 'Helvetica Neue', sans-serif"
        font-size="28" font-weight="400"
        fill="#7A8FA6" letter-spacing="8">EVERY FILE. EVERY ROOM. EVERY NIGHT.</text>

  <!-- Neon accent bar bottom -->
  <rect x="0" y="560" width="1200" height="70" fill="#0A0C10"/>
  <rect x="0" y="560" width="1200" height="3" fill="#00E5FF" opacity="0.4"/>
  <rect x="0" y="563" width="1200" height="1" fill="#F5A623" opacity="0.6"/>

  <!-- Neon X in corner -->
  <text x="1140" y="600" text-anchor="middle"
        font-family="Impact, 'Arial Black', sans-serif"
        font-size="48" font-weight="400"
        fill="#F5A623" opacity="0.3"
        filter="url(#amber-glow)">X</text>
</svg>
