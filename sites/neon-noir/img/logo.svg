<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 80" width="240" height="80">
  <!-- Neon Noir Phlix wordmark -->
  <!-- Dark background bar with cyan border -->
  <rect x="0" y="20" width="240" height="50" fill="#0A0C10" rx="4"/>
  <rect x="0" y="20" width="240" height="50" fill="none" stroke="#00E5FF" stroke-width="1" rx="4" opacity="0.6"/>

  <!-- "Phlix" in Playfair Display style italic - using bold serif representation -->
  <text x="20" y="54" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-style="italic" font-size="36" fill="#E8EDF5" letter-spacing="-1">Phlix</text>

  <!-- Neon glow effect on text -->
  <text x="20" y="54" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-style="italic" font-size="36" fill="none" stroke="#00E5FF" stroke-width="0.5" opacity="0.3" letter-spacing="-1">Phlix</text>

  <!-- Decorative neon bar accent -->
  <rect x="108" y="35" width="40" height="3" fill="#F5A623" rx="1">
    <animate attributeName="opacity" values="1;0.7;1" dur="2s" repeatCount="indefinite"/>
  </rect>

  <!-- Neon sign flicker effect on the accent -->
  <rect x="108" y="35" width="40" height="3" fill="#F5A623" rx="1" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0.4;0.8" dur="0.1s" repeatCount="indefinite"/>
  </rect>

  <!-- "NEON NOIR" subtitle -->
  <text x="155" y="54" font-family="Georgia, serif" font-size="11" fill="#7A8FA6" letter-spacing="2" text-transform="uppercase">NEON NOIR</text>
</svg>
