    <!-- Root shim base is injected by the server/HTMX root shim for 404 -->

    <!-- ── 404: Dead-end alley ─────────────────────────────────────────────── -->
    <main class="error-page" id="main-content">
      <div class="error-backdrop" aria-hidden="true"></div>

      <div class="error-content">
        <!-- Flickering dead neon X sign -->
        <div class="error-sign" aria-hidden="true" style="margin-bottom: var(--space-6)">
          <svg
            viewBox="0 0 120 80"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
            style="width: 120px; height: 80px; margin: 0 auto; display: block"
          >
            <!-- Dead neon X — grey/flickering -->
            <text
              x="60"
              y="58"
              text-anchor="middle"
              font-family="'Bebas Neue', Impact, sans-serif"
              font-size="56"
              fill="#3A3A4A"
              letter-spacing="4"
            >
              X
            </text>
            <text
              x="60"
              y="58"
              text-anchor="middle"
              font-family="'Bebas Neue', Impact, sans-serif"
              font-size="56"
              fill="#E5154E"
              opacity="0.3"
              letter-spacing="4"
              style="animation: dead-flicker 3s infinite"
            >
              X
            </text>
          </svg>
          <style>
            @keyframes dead-flicker {
              0%,
              100% {
                opacity: 0.3;
              }
              5% {
                opacity: 0.05;
              }
              10% {
                opacity: 0.3;
              }
              15% {
                opacity: 0.05;
              }
              25% {
                opacity: 0.2;
              }
              30% {
                opacity: 0;
              }
              40% {
                opacity: 0;
              }
              50% {
                opacity: 0.15;
              }
              60% {
                opacity: 0;
              }
              70% {
                opacity: 0.1;
              }
              80% {
                opacity: 0;
              }
              90% {
                opacity: 0.05;
              }
              95% {
                opacity: 0;
              }
            }
          </style>
        </div>

        <!-- Lux silhouette -->
        <div
          aria-hidden="true"
          style="margin-bottom: var(--space-6); display: flex; justify-content: center"
        >
          <svg
            viewBox="0 0 60 80"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
            style="width: 48px; height: 64px; opacity: 0.35"
          >
            <!-- Fedora -->
            <path
              d="M10 18 Q30 5 50 18"
              stroke="#2A3650"
              stroke-width="2"
              fill="none"
              stroke-linecap="round"
            />
            <rect x="8" y="15" width="44" height="5" rx="1" fill="#2A3650" opacity="0.8" />
            <path d="M5 22 L55 22" stroke="#2A3650" stroke-width="1.5" opacity="0.4" />
            <!-- Body -->
            <path d="M18 40 L14 78 L46 78 L42 40 Z" fill="#1C2333" opacity="0.6" />
            <!-- Eyes dim -->
            <circle cx="25" cy="31" r="2" fill="#3A3A4A" opacity="0.5" />
            <circle cx="35" cy="31" r="2" fill="#3A3A4A" opacity="0.5" />
            <text
              x="30"
              y="65"
              text-anchor="middle"
              font-family="'Bebas Neue', sans-serif"
              font-size="18"
              fill="#2A3650"
              opacity="0.5"
              letter-spacing="2"
            >
              X
            </text>
          </svg>
        </div>

        <!-- FILE NOT FOUND -->
        <div class="error-code" aria-hidden="true">404</div>

        </p>

          <a href="features.html" class="btn btn-ghost">Evidence Files</a>
          <a href="download.html" class="btn btn-ghost">Get Access</a>
        </nav>
