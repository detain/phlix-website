<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Phlix favicon">
  <title>Phlix</title>

  <!-- Dark background -->
  <rect width="32" height="32" fill="#0D0D0D"/>

  <!-- Pixel "P" mark in green -->
  <rect x="4" y="4" width="2" height="16" fill="#00FF00"/>
  <rect x="6" y="4" width="4" height="2" fill="#00FF00"/>
  <rect x="10" y="6" width="2" height="2" fill="#00FF00"/>
  <rect x="12" y="8" width="2" height="2" fill="#00FF00"/>
  <rect x="10" y="10" width="4" height="2" fill="#00FF00"/>
  <rect x="6" y="12" width="2" height="8" fill="#00FF00"/>

  <!-- Decorative pixel border in gold -->
  <rect x="2" y="2" width="28" height="2" fill="#FFD700"/>
  <rect x="2" y="28" width="28" height="2" fill="#FFD700"/>
  <rect x="2" y="2" width="2" height="28" fill="#FFD700"/>
  <rect x="28" y="2" width="2" height="28" fill="#FFD700"/>

  <!-- Corner accents in orange -->
  <rect x="4" y="4" width="4" height="2" fill="#FF4500"/>
  <rect x="24" y="4" width="4" height="2" fill="#FF4500"/>
  <rect x="4" y="26" width="4" height="2" fill="#FF4500"/>
  <rect x="24" y="26" width="4" height="2" fill="#FF4500"/>
</svg>
