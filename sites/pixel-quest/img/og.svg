<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Phlix social card">
  <title>Phlix — Your media. Your library. Your Phlix.</title>

  <!-- Dark pixel-art dungeon background -->
  <rect width="1200" height="630" fill="#0D0D0D"/>

  <!-- Pixel grid overlay -->
  <defs>
    <pattern id="pixelgrid" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="none" stroke="#1a1a2e" stroke-width="1"/>
    </pattern>
    <pattern id="biggrid" width="64" height="64" patternUnits="userSpaceOnUse">
      <rect width="64" height="64" fill="none" stroke="#16213e" stroke-width="2"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#biggrid)"/>
  <rect width="1200" height="630" fill="url(#pixelgrid)"/>

  <!-- Decorative corner frames -->
  <rect x="0" y="0" width="32" height="8" fill="#FFD700"/>
  <rect x="0" y="0" width="8" height="32" fill="#FFD700"/>
  <rect x="1168" y="0" width="32" height="8" fill="#FFD700"/>
  <rect x="1192" y="0" width="8" height="32" fill="#FFD700"/>
  <rect x="0" y="622" width="32" height="8" fill="#FFD700"/>
  <rect x="0" y="598" width="8" height="32" fill="#FFD700"/>
  <rect x="1168" y="622" width="32" height="8" fill="#FFD700"/>
  <rect x="1192" y="598" width="8" height="32" fill="#FFD700"/>

  <!-- Central content area -->
  <g transform="translate(600, 280)">

    <!-- Logo / wordmark -->
    <text x="0" y="-80" font-family="'Courier New', monospace" font-size="72" fill="#00FF00" text-anchor="middle" letter-spacing="16" font-weight="bold">
      PHLIX
    </text>

    <!-- Glow effect behind wordmark -->
    <text x="0" y="-80" font-family="'Courier New', monospace" font-size="72" fill="none" stroke="#00FF00" stroke-width="2" text-anchor="middle" letter-spacing="16" opacity="0.5">
      PHLIX
    </text>

    <!-- Tagline -->
    <text x="0" y="-10" font-family="'Courier New', monospace" font-size="28" fill="#FFD700" text-anchor="middle" letter-spacing="4">
      Your media. Your library. Your Phlix.
    </text>

    <!-- Divider line -->
    <rect x="-300" y="30" width="600" height="4" fill="#00FF00" opacity="0.6"/>
    <rect x="-250" y="38" width="500" height="2" fill="#FFD700" opacity="0.4"/>

    <!-- Feature bullets (compact) -->
    <text x="0" y="80" font-family="'Courier New', monospace" font-size="16" fill="#888888" text-anchor="middle">
      Self-hosted PHP media server
    </text>
    <text x="0" y="110" font-family="'Courier New', monospace" font-size="16" fill="#888888" text-anchor="middle">
      Roku · Samsung Tizen · Windows · Mobile · DLNA
    </text>
    <text x="0" y="140" font-family="'Courier New', monospace" font-size="16" fill="#888888" text-anchor="middle">
      SyncPlay · Live TV · Transcoding · Plugin system
    </text>

    <!-- Bottom badge -->
    <rect x="-120" y="180" width="240" height="40" rx="4" fill="#00FF00"/>
    <text x="0" y="206" font-family="'Courier New', monospace" font-size="18" fill="#0D0D0D" text-anchor="middle" font-weight="bold">
      OPEN SOURCE • MPL-2.0
    </text>
  </g>

  <!-- Top-left accent -->
  <rect x="40" y="40" width="120" height="4" fill="#FF4500"/>
  <rect x="40" y="48" width="80" height="4" fill="#FF4500" opacity="0.6"/>

  <!-- Bottom-right accent -->
  <rect x="1040" y="578" width="120" height="4" fill="#4169E1"/>
  <rect x="1080" y="570" width="80" height="4" fill="#4169E1" opacity="0.6"/>

</svg>
