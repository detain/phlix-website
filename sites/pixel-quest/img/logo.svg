<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 80" role="img" aria-label="Phlix logo">
  <title>Phlix</title>

  <!-- Pixel-art game controller / play icon as the "P" mark -->
  <g transform="translate(8, 12)">
    <!-- Controller body (pixel rectangle) -->
    <rect x="0" y="8" width="8" height="20" fill="#00FF00"/>
    <rect x="8" y="4" width="8" height="28" fill="#00FF00"/>
    <rect x="16" y="8" width="8" height="20" fill="#00FF00"/>
    <rect x="24" y="12" width="8" height="12" fill="#00FF00"/>
    <rect x="32" y="8" width="8" height="20" fill="#00FF00"/>
    <rect x="40" y="4" width="8" height="28" fill="#00FF00"/>
    <rect x="48" y="8" width="8" height="20" fill="#00FF00"/>

    <!-- D-pad (cross) -->
    <rect x="12" y="14" width="4" height="4" fill="#0D0D0D"/>
    <rect x="8" y="18" width="4" height="4" fill="#0D0D0D"/>
    <rect x="16" y="18" width="4" height="4" fill="#0D0D0D"/>
    <rect x="12" y="22" width="4" height="4" fill="#0D0D0D"/>

    <!-- Buttons (colored squares) -->
    <rect x="36" y="14" width="4" height="4" fill="#FF4500"/>
    <rect x="42" y="14" width="4" height="4" fill="#FFD700"/>
    <rect x="36" y="20" width="4" height="4" fill="#4169E1"/>
    <rect x="42" y="20" width="4" height="4" fill="#00FF00"/>
  </g>

  <!-- "PHLIX" wordmark in pixel font style -->
  <!-- P -->
  <g transform="translate(72, 16)">
    <rect x="0" y="0" width="4" height="32" fill="#00FF00"/>
    <rect x="4" y="0" width="8" height="4" fill="#00FF00"/>
    <rect x="12" y="4" width="4" height="4" fill="#00FF00"/>
    <rect x="16" y="8" width="4" height="4" fill="#00FF00"/>
    <rect x="12" y="12" width="8" height="4" fill="#00FF00"/>
    <rect x="4" y="16" width="4" height="16" fill="#00FF00"/>
  </g>

  <!-- H -->
  <g transform="translate(100, 16)">
    <rect x="0" y="0" width="4" height="32" fill="#00FF00"/>
    <rect x="4" y="14" width="8" height="4" fill="#00FF00"/>
    <rect x="12" y="0" width="4" height="32" fill="#00FF00"/>
  </g>

  <!-- L -->
  <g transform="translate(124, 16)">
    <rect x="0" y="0" width="4" height="32" fill="#00FF00"/>
    <rect x="4" y="28" width="12" height="4" fill="#00FF00"/>
  </g>

  <!-- I -->
  <g transform="translate(148, 16)">
    <rect x="0" y="0" width="12" height="4" fill="#00FF00"/>
    <rect x="4" y="4" width="4" height="28" fill="#00FF00"/>
    <rect x="0" y="28" width="12" height="4" fill="#00FF00"/>
  </g>

  <!-- X -->
  <g transform="translate(172, 16)">
    <rect x="0" y="0" width="4" height="4" fill="#FFD700"/>
    <rect x="12" y="0" width="4" height="4" fill="#FFD700"/>
    <rect x="4" y="4" width="4" height="4" fill="#FFD700"/>
    <rect x="8" y="8" width="4" height="4" fill="#FFD700"/>
    <rect x="4" y="12" width="4" height="4" fill="#FFD700"/>
    <rect x="8" y="16" width="4" height="4" fill="#FFD700"/>
    <rect x="0" y="28" width="4" height="4" fill="#FFD700"/>
    <rect x="12" y="28" width="4" height="4" fill="#FFD700"/>
    <rect x="4" y="24" width="4" height="4" fill="#FFD700"/>
    <rect x="8" y="20" width="4" height="4" fill="#FFD700"/>
    <rect x="4" y="16" width="4" height="4" fill="#FFD700"/>
    <rect x="8" y="12" width="4" height="4" fill="#FFD700"/>
  </g>

  <!-- Tagline below -->
  <text x="120" y="68" font-family="monospace" font-size="8" fill="#888888" text-anchor="middle" letter-spacing="2">
    SELF-HOSTED MEDIA SERVER
  </text>
</svg>
