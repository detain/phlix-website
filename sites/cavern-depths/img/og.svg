<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0F1A"/>
      <stop offset="50%" stop-color="#1A2A4A"/>
      <stop offset="100%" stop-color="#0A0F1A"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4A90D9"/>
      <stop offset="100%" stop-color="#7FFFD4"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="textGlow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Background cave texture effect -->
  <ellipse cx="200" cy="500" rx="300" ry="200" fill="#4A90D9" opacity="0.05"/>
  <ellipse cx="900" cy="150" rx="350" ry="200" fill="#7FFFD4" opacity="0.04"/>

  <!-- Stalactite decorations at top -->
  <polygon points="100,0 110,120 120,0" fill="#1A2A4A" opacity="0.8"/>
  <polygon points="150,0 165,180 180,0" fill="#243550" opacity="0.7"/>
  <polygon points="250,0 260,80 270,0" fill="#1A2A4A" opacity="0.6"/>
  <polygon points="900,0 920,150 940,0" fill="#1A2A4A" opacity="0.7"/>
  <polygon points="1000,0 1020,100 1040,0" fill="#243550" opacity="0.8"/>
  <polygon points="1080,0 1095,130 1110,0" fill="#1A2A4A" opacity="0.6"/>

  <!-- Bioluminescent pools at bottom -->
  <ellipse cx="150" cy="580" rx="120" ry="30" fill="#7FFFD4" opacity="0.15" filter="url(#glow)"/>
  <ellipse cx="400" cy="600" rx="80" ry="20" fill="#4A90D9" opacity="0.12" filter="url(#glow)"/>
  <ellipse cx="750" cy="590" rx="100" ry="25" fill="#7FFFD4" opacity="0.1" filter="url(#glow)"/>
  <ellipse cx="1050" cy="570" rx="90" ry="22" fill="#4A90D9" opacity="0.13" filter="url(#glow)"/>

  <!-- Crystal formations -->
  <polygon points="180,350 200,280 220,350 210,350 200,300 190,350" fill="#7FFFD4" opacity="0.6" filter="url(#glow)"/>
  <polygon points="950,380 970,300 990,380 980,380 970,320 960,380" fill="#4A90D9" opacity="0.5" filter="url(#glow)"/>

  <!-- Logo mark - stalactite P -->
  <g transform="translate(480, 200)" filter="url(#textGlow)">
    <polygon points="30,180 30,50 80,0 80,180" fill="none" stroke="url(#glowGrad)" stroke-width="8"/>
    <polygon points="80,50 110,50" fill="none" stroke="url(#glowGrad)" stroke-width="8"/>
    <polygon points="115,50 125,50 125,60 115,60 125,50" fill="#7FFFD4"/>
    <polygon points="130,50 140,50" fill="#4A90D9"/>
  </g>

  <!-- Text -->
  <text x="600" y="340" font-family="Barlow Condensed, Arial, sans-serif" font-size="64" font-weight="700" fill="#E8E8E8" text-anchor="middle" letter-spacing="0.1em" filter="url(#textGlow)">PHLIX</text>

  <!-- Headline -->
  <text x="600" y="420" font-family="Barlow, Arial, sans-serif" font-size="28" font-weight="400" fill="#7FFFD4" text-anchor="middle" opacity="0.9">Your media. Your library. Your Phlix.</text>

  <!-- Subtle glow line -->
  <rect x="400" y="460" width="400" height="2" fill="#7FFFD4" opacity="0.3" rx="1"/>

  <!-- Footer tagline -->
  <text x="600" y="560" font-family="Barlow, Arial, sans-serif" font-size="16" fill="#E8E8E8" text-anchor="middle" opacity="0.6">Open-source media, on your terms.</text>

  <!-- Decorative dots -->
  <circle cx="350" cy="450" r="3" fill="#7FFFD4" opacity="0.4"/>
  <circle cx="850" cy="450" r="3" fill="#7FFFD4" opacity="0.4"/>
  <circle cx="300" cy="490" r="2" fill="#4A90D9" opacity="0.3"/>
  <circle cx="900" cy="490" r="2" fill="#4A90D9" opacity="0.3"/>
</svg>
