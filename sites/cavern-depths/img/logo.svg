<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" fill="none">
  <defs>
    <linearGradient id="caveGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4A90D9"/>
      <stop offset="100%" style="stop-color:#7FFFD4"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Stalactite shapes forming P -->
  <path d="M20 55 L20 20 L35 5 L35 55" stroke="url(#caveGrad)" stroke-width="4" fill="none" filter="url(#glow)"/>
  <path d="M35 20 L50 20" stroke="url(#caveGrad)" stroke-width="4" fill="none" filter="url(#glow)"/>
  <!-- Crystal formations -->
  <polygon points="55,55 58,35 61,55" fill="#7FFFD4" opacity="0.8"/>
  <polygon points="63,55 67,25 71,55" fill="#4A90D9" opacity="0.6"/>
  <polygon points="73,55 75,40 77,55" fill="#7FFFD4" opacity="0.5"/>
  <!-- Text -->
  <text x="90" y="42" font-family="Barlow Condensed, sans-serif" font-weight="700" font-size="28" fill="#E8E8E8" letter-spacing="0.05em">PHLIX</text>
  <!-- Bioluminescent dots -->
  <circle cx="85" cy="20" r="2" fill="#7FFFD4" opacity="0.6"/>
  <circle cx="180" cy="15" r="1.5" fill="#7FFFD4" opacity="0.4"/>
  <circle cx="175" cy="45" r="2" fill="#4A90D9" opacity="0.5"/>
</svg>
