<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>404 — Page Not Found — Phlix Ricochet</title>
    <meta name="description" content="The page you're looking for ricocheted off into the void." />
    <meta name="theme-color" content="#FF9F1A" />
    <link rel="icon" type="image/svg+xml" href="img/favicon.svg" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/theme.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/animations.css" />
  </head>
  <body>
    <canvas id="spark-canvas" aria-hidden="true"></canvas>
    <main class="error-page">
      <div class="container">
        <div class="error-content">
          <div class="error-bullethole" aria-hidden="true"></div>
          <h1 class="error-code">404</h1>
          <p class="error-message">The page you're looking for ricocheted off into the void.</p>
          <a href="./" class="btn btn-primary">Back to Home</a>
        </div>
      </div>
    </main>
    <script src="js/ricochet-physics.js"></script>
    <script src="js/spark-particles.js"></script>
    <script src="js/main.js"></script>
    <style>
      .error-page { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: var(--space-8); }
      .error-content { text-align: center; position: relative; }
      .error-bullethole { position: absolute; top: -60px; left: 50%; transform: translateX(-50%); width: 80px; height: 80px; background: radial-gradient(circle, var(--color-tertiary) 0%, var(--color-tertiary) 30%, transparent 31%, transparent 60%, var(--color-tertiary) 61%, var(--color-tertiary) 70%, transparent 71%); opacity: 0.4; }
      .error-code { font-family: var(--font-headline); font-size: clamp(6rem, 20vw, 12rem); color: var(--color-primary); line-height: 1; margin-bottom: var(--space-4); }
      .error-message { font-size: 1.25rem; color: var(--color-text-muted); margin-bottom: var(--space-8); }
    </style>
  </body>
</html>
