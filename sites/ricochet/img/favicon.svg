<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Background -->
  <rect width="64" height="64" rx="8" fill="#011627"/>

  <!-- Bullet shape -->
  <path d="M32 8C24 8 18 16 18 24C18 32 24 40 32 40C40 40 46 32 46 24C46 16 40 8 32 8Z" fill="#FF9F1A"/>

  <!-- Spark trail 1 -->
  <circle cx="20" cy="48" r="3" fill="#2EC4B6" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0.2;0.8" dur="1.5s" repeatCount="indefinite"/>
  </circle>

  <!-- Spark trail 2 -->
  <circle cx="12" cy="52" r="2" fill="#E71D36" opacity="0.6">
    <animate attributeName="opacity" values="0.6;0.1;0.6" dur="2s" repeatCount="indefinite"/>
  </circle>

  <!-- Spark trail 3 -->
  <circle cx="44" cy="50" r="2.5" fill="#FF9F1A" opacity="0.7">
    <animate attributeName="opacity" values="0.7;0.2;0.7" dur="1.8s" repeatCount="indefinite"/>
  </circle>

  <!-- Trajectory line -->
  <path d="M20 48 Q 26 44 32 40 Q 38 36 44 50" stroke="url(#traj-grad)" stroke-width="1.5" fill="none" opacity="0.6"/>

  <defs>
    <linearGradient id="traj-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9F1A"/>
      <stop offset="50%" stop-color="#E71D36"/>
      <stop offset="100%" stop-color="#2EC4B6"/>
    </linearGradient>
  </defs>
</svg>
