<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1C1C1C"/>
      <stop offset="100%" stop-color="#2F4F4F"/>
    </linearGradient>
    <linearGradient id="reel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C0C0C0"/>
      <stop offset="100%" stop-color="#8B4513"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Decorative film strip holes (left) -->
  <g fill="#333333" opacity="0.6">
    <rect x="0" y="80" width="30" height="20" rx="3"/>
    <rect x="0" y="120" width="30" height="20" rx="3"/>
    <rect x="0" y="160" width="30" height="20" rx="3"/>
    <rect x="0" y="200" width="30" height="20" rx="3"/>
    <rect x="0" y="240" width="30" height="20" rx="3"/>
    <rect x="0" y="280" width="30" height="20" rx="3"/>
    <rect x="0" y="320" width="30" height="20" rx="3"/>
    <rect x="0" y="360" width="30" height="20" rx="3"/>
    <rect x="0" y="400" width="30" height="20" rx="3"/>
    <rect x="0" y="440" width="30" height="20" rx="3"/>
    <rect x="0" y="480" width="30" height="20" rx="3"/>
    <rect x="0" y="520" width="30" height="20" rx="3"/>
  </g>

  <!-- Decorative film strip holes (right) -->
  <g fill="#333333" opacity="0.6">
    <rect x="1170" y="80" width="30" height="20" rx="3"/>
    <rect x="1170" y="120" width="30" height="20" rx="3"/>
    <rect x="1170" y="160" width="30" height="20" rx="3"/>
    <rect x="1170" y="200" width="30" height="20" rx="3"/>
    <rect x="1170" y="240" width="30" height="20" rx="3"/>
    <rect x="1170" y="280" width="30" height="20" rx="3"/>
    <rect x="1170" y="320" width="30" height="20" rx="3"/>
    <rect x="1170" y="360" width="30" height="20" rx="3"/>
    <rect x="1170" y="400" width="30" height="20" rx="3"/>
    <rect x="1170" y="440" width="30" height="20" rx="3"/>
    <rect x="1170" y="480" width="30" height="20" rx="3"/>
    <rect x="1170" y="520" width="30" height="20" rx="3"/>
  </g>

  <!-- Large film reel (left) -->
  <g transform="translate(200, 315)">
    <circle cx="0" cy="0" r="180" fill="none" stroke="#444444" stroke-width="4"/>
    <circle cx="0" cy="0" r="160" fill="none" stroke="#555555" stroke-width="2"/>
    <!-- Spokes -->
    <circle cx="0" cy="-120" r="25" fill="#1C1C1C" stroke="#C0C0C0" stroke-width="4"/>
    <circle cx="0" cy="120" r="25" fill="#1C1C1C" stroke="#C0C0C0" stroke-width="4"/>
    <circle cx="-120" cy="0" r="25" fill="#1C1C1C" stroke="#C0C0C0" stroke-width="4"/>
    <circle cx="120" cy="0" r="25" fill="#1C1C1C" stroke="#C0C0C0" stroke-width="4"/>
    <circle cx="-85" cy="-85" r="20" fill="#1C1C1C" stroke="#C0C0C0" stroke-width="3"/>
    <circle cx="85" cy="-85" r="20" fill="#1C1C1C" stroke="#C0C0C0" stroke-width="3"/>
    <circle cx="-85" cy="85" r="20" fill="#1C1C1C" stroke="#C0C0C0" stroke-width="3"/>
    <circle cx="85" cy="85" r="20" fill="#1C1C1C" stroke="#C0C0C0" stroke-width="3"/>
    <!-- Center hub -->
    <circle cx="0" cy="0" r="50" fill="#FFD700" opacity="0.9"/>
    <circle cx="0" cy="0" r="30" fill="#1C1C1C"/>
  </g>

  <!-- Text content -->
  <text x="600" y="240" font-family="Impact, Arial Black, sans-serif" font-size="72" font-weight="400" fill="#C0C0C0" text-anchor="middle" letter-spacing="8">PHLIX</text>
  <text x="600" y="320" font-family="Arial, sans-serif" font-size="28" fill="#888888" text-anchor="middle" letter-spacing="2">YOUR MEDIA. YOUR LIBRARY. YOUR TERMS.</text>
  <text x="600" y="380" font-family="Arial, sans-serif" font-size="22" fill="#FFD700" text-anchor="middle">Self-hosted media server</text>

  <!-- Small film reel accent (bottom right) -->
  <g transform="translate(1000, 500)">
    <circle cx="0" cy="0" r="80" fill="none" stroke="#444444" stroke-width="2"/>
    <circle cx="0" cy="0" r="65" fill="none" stroke="#555555" stroke-width="1"/>
    <circle cx="0" cy="-55" r="12" fill="#1C1C1C" stroke="#C0C0C0" stroke-width="2"/>
    <circle cx="0" cy="55" r="12" fill="#1C1C1C" stroke="#C0C0C0" stroke-width="2"/>
    <circle cx="-55" cy="0" r="12" fill="#1C1C1C" stroke="#C0C0C0" stroke-width="2"/>
    <circle cx="55" cy="0" r="12" fill="#1C1C1C" stroke="#C0C0C0" stroke-width="2"/>
    <circle cx="0" cy="0" r="20" fill="#FFD700" opacity="0.8"/>
  </g>
</svg>
