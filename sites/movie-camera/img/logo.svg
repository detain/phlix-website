<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" fill="none">
  <!-- Film Reel Icon -->
  <g transform="translate(8, 8)">
    <!-- Main reel body -->
    <circle cx="22" cy="22" r="20" fill="#1C1C1C" stroke="#C0C0C0" stroke-width="2"/>
    <!-- Center hub -->
    <circle cx="22" cy="22" r="6" fill="#FFD700"/>
    <!-- Spokes -->
    <circle cx="22" cy="6" r="4" fill="#1C1C1C" stroke="#C0C0C0" stroke-width="1.5"/>
    <circle cx="22" cy="38" r="4" fill="#1C1C1C" stroke="#C0C0C0" stroke-width="1.5"/>
    <circle cx="6" cy="22" r="4" fill="#1C1C1C" stroke="#C0C0C0" stroke-width="1.5"/>
    <circle cx="38" cy="22" r="4" fill="#1C1C1C" stroke="#C0C0C0" stroke-width="1.5"/>
    <!-- Diagonal spokes -->
    <circle cx="11" cy="11" r="3.5" fill="#1C1C1C" stroke="#C0C0C0" stroke-width="1"/>
    <circle cx="33" cy="11" r="3.5" fill="#1C1C1C" stroke="#C0C0C0" stroke-width="1"/>
    <circle cx="11" cy="33" r="3.5" fill="#1C1C1C" stroke="#C0C0C0" stroke-width="1"/>
    <circle cx="33" cy="33" r="3.5" fill="#1C1C1C" stroke="#C0C0C0" stroke-width="1"/>
  </g>
  <!-- Wordmark -->
  <text x="72" y="40" font-family="Impact, Arial Black, sans-serif" font-size="32" font-weight="400" fill="#C0C0C0" letter-spacing="4" text-transform="uppercase">PHLIX</text>
</svg>
