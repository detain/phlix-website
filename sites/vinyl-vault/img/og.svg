<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img">
  <title>Phlix — Your media. Your library. Your Phlix.</title>
  <desc>Vinyl Vault Open Graph image for Phlix media server</desc>

  <!-- Background -->
  <rect width="1200" height="630" fill="#2D1810"/>

  <!-- Subtle groove texture -->
  <defs>
    <pattern id="grooves" x="0" y="0" width="4" height="4" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="rgba(196,149,106,0.08)"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#grooves)"/>

  <!-- Large vinyl record -->
  <g transform="translate(200, 315)">
    <circle cx="0" cy="0" r="220" fill="#1a0f08"/>
    <circle cx="0" cy="0" r="200" fill="none" stroke="#C4956A" stroke-width="1" opacity="0.3"/>
    <circle cx="0" cy="0" r="180" fill="none" stroke="#C4956A" stroke-width="1" opacity="0.25"/>
    <circle cx="0" cy="0" r="160" fill="none" stroke="#C4956A" stroke-width="1" opacity="0.2"/>
    <circle cx="0" cy="0" r="140" fill="none" stroke="#C4956A" stroke-width="1" opacity="0.2"/>
    <circle cx="0" cy="0" r="120" fill="none" stroke="#C4956A" stroke-width="1" opacity="0.15"/>
    <circle cx="0" cy="0" r="100" fill="none" stroke="#C4956A" stroke-width="1" opacity="0.15"/>
    <!-- Label -->
    <circle cx="0" cy="0" r="70" fill="#C4956A"/>
    <!-- Center hole -->
    <circle cx="0" cy="0" r="20" fill="#E8D5B7"/>
    <!-- Highlight -->
    <ellipse cx="-50" cy="-50" rx="60" ry="40" fill="rgba(255,255,255,0.08)"/>
  </g>

  <!-- Text content -->
  <text x="700" y="240" font-family="Georgia, serif" font-size="72" font-weight="700" fill="#E8D5B7" text-anchor="middle">Phlix</text>
  <text x="700" y="320" font-family="Georgia, serif" font-size="28" fill="#C4956A" text-anchor="middle" letter-spacing="3">MEDIA SERVER</text>
  <text x="700" y="400" font-family="Georgia, serif" font-size="24" fill="#D4C4A8" text-anchor="middle">Your media. Your library. Your Phlix.</text>

  <!-- Bottom accent line -->
  <rect x="550" y="460" width="300" height="3" fill="#C4956A" rx="1.5"/>

  <!-- Footer tagline -->
  <text x="600" y="560" font-family="Georgia, serif" font-size="18" fill="#8B7355" text-anchor="middle" font-style="italic">Open-source media, on your terms.</text>
</svg>
