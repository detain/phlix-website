<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 80" fill="none">
  <defs>
    <linearGradient id="vinylGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C4956A"/>
      <stop offset="100%" stop-color="#8B4513"/>
    </linearGradient>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#C4956A"/>
    </linearGradient>
  </defs>

  <!-- Vinyl record -->
  <circle cx="30" cy="40" r="24" fill="#2D1810" stroke="#C4956A" stroke-width="2"/>
  <circle cx="30" cy="40" r="18" fill="none" stroke="#3D2820" stroke-width="1"/>
  <circle cx="30" cy="40" r="14" fill="none" stroke="#3D2820" stroke-width="1"/>
  <circle cx="30" cy="40" r="10" fill="none" stroke="#3D2820" stroke-width="1"/>
  <circle cx="30" cy="40" r="6" fill="#FFD700"/>
  <circle cx="30" cy="40" r="2" fill="#2D1810"/>

  <!-- Wordmark -->
  <text x="62" y="38" font-family="Georgia, serif" font-size="28" font-weight="700" fill="#E8D5B7">Vinyl</text>
  <text x="62" y="62" font-family="Georgia, serif" font-size="18" font-style="italic" fill="#C4956A">Vault</text>

  <!-- Decorative line -->
  <rect x="62" y="68" width="80" height="2" fill="url(#goldGradient)" rx="1"/>
</svg>
