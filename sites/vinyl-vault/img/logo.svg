<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" role="img">
  <title>Phlix</title>
  <desc>Vinyl Vault branding — Phlix media server logo</desc>

  <!-- Vinyl record -->
  <g transform="translate(8, 8)">
    <!-- Record body -->
    <circle cx="22" cy="22" r="20" fill="#2D1810"/>
    <!-- Grooves -->
    <circle cx="22" cy="22" r="17" fill="none" stroke="#C4956A" stroke-width="0.5" opacity="0.4"/>
    <circle cx="22" cy="22" r="14" fill="none" stroke="#C4956A" stroke-width="0.5" opacity="0.3"/>
    <circle cx="22" cy="22" r="11" fill="none" stroke="#C4956A" stroke-width="0.5" opacity="0.3"/>
    <circle cx="22" cy="22" r="8" fill="none" stroke="#C4956A" stroke-width="0.5" opacity="0.2"/>
    <!-- Label -->
    <circle cx="22" cy="22" r="5" fill="#C4956A"/>
    <!-- Center hole -->
    <circle cx="22" cy="22" r="2" fill="#E8D5B7"/>
    <!-- Highlight -->
    <ellipse cx="16" cy="16" rx="6" ry="4" fill="white" opacity="0.1"/>
  </g>

  <!-- Wordmark -->
  <text x="60" y="38" font-family="Georgia, serif" font-size="28" font-weight="700" fill="#2D1810" letter-spacing="-0.5">Phlix</text>
  <text x="60" y="52" font-family="Georgia, serif" font-size="10" fill="#C4956A" letter-spacing="2">MEDIA SERVER</text>
</svg>
