<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img">
  <title>Phlix</title>
  <desc>Vinyl Vault favicon — stylized vinyl record</desc>
  <!-- Record body -->
  <circle cx="16" cy="16" r="14" fill="#2D1810"/>
  <!-- Grooves -->
  <circle cx="16" cy="16" r="11" fill="none" stroke="#C4956A" stroke-width="0.5" opacity="0.5"/>
  <circle cx="16" cy="16" r="8" fill="none" stroke="#C4956A" stroke-width="0.5" opacity="0.4"/>
  <circle cx="16" cy="16" r="5" fill="none" stroke="#C4956A" stroke-width="0.5" opacity="0.3"/>
  <!-- Label -->
  <circle cx="16" cy="16" r="3.5" fill="#C4956A"/>
  <!-- Center hole -->
  <circle cx="16" cy="16" r="1.5" fill="#E8D5B7"/>
  <!-- Highlight -->
  <ellipse cx="12" cy="12" rx="3" ry="2" fill="white" opacity="0.15"/>
</svg>
