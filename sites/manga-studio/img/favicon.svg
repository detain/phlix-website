<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Manga Studio favicon">
  <!-- Square panel — Spot Red background -->
  <rect width="32" height="32" fill="#D0021B"/>
  <!-- Inner panel border — white -->
  <rect x="2" y="2" width="28" height="28" fill="none" stroke="#F8F8F4" stroke-width="2"/>
  <!-- Pen nib silhouette — white on red -->
  <g transform="translate(16, 16)">
    <path d="M0,-10 L7,0 L0,10 L-7,0 Z" fill="#F8F8F4"/>
    <line x1="0" y1="-7" x2="0" y2="7" stroke="#D0021B" stroke-width="1.5"/>
  </g>
</svg>
