<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Manga Studio — Phlix marketing site">
  <!-- Manga White background -->
  <rect width="1200" height="630" fill="#F8F8F4"/>

  <!-- Speed line radial burst from center-right -->
  <g transform="translate(900, 315)" opacity="0.12">
    <circle r="500" fill="none" stroke="#0D0D0D" stroke-width="1"/>
    <circle r="450" fill="none" stroke="#0D0D0D" stroke-width="1"/>
    <circle r="400" fill="none" stroke="#0D0D0D" stroke-width="1"/>
    <circle r="350" fill="none" stroke="#0D0D0D" stroke-width="1"/>
    <circle r="300" fill="none" stroke="#0D0D0D" stroke-width="1"/>
    <circle r="250" fill="none" stroke="#0D0D0D" stroke-width="1"/>
    <circle r="200" fill="none" stroke="#0D0D0D" stroke-width="1"/>
  </g>
  <!-- Speed lines -->
  <g opacity="0.08" stroke="#0D0D0D" stroke-width="2">
    <line x1="900" y1="315" x2="0" y2="0"/>
    <line x1="900" y1="315" x2="0" y2="157"/>
    <line x1="900" y1="315" x2="0" y2="315"/>
    <line x1="900" y1="315" x2="0" y2="473"/>
    <line x1="900" y1="315" x2="0" y2="630"/>
    <line x1="900" y1="315" x2="300" y2="0"/>
    <line x1="900" y1="315" x2="600" y2="0"/>
    <line x1="900" y1="315" x2="900" y2="0"/>
    <line x1="900" y1="315" x2="1200" y2="0"/>
    <line x1="900" y1="315" x2="1200" y2="157"/>
    <line x1="900" y1="315" x2="1200" y2="315"/>
    <line x1="900" y1="315" x2="1200" y2="473"/>
    <line x1="900" y1="315" x2="1200" y2="630"/>
    <line x1="900" y1="315" x2="600" y2="630"/>
    <line x1="900" y1="315" x2="300" y2="630"/>
  </g>

  <!-- Spot Red vertical accent bar left -->
  <rect x="0" y="0" width="12" height="630" fill="#D0021B"/>

  <!-- White panel card behind text -->
  <rect x="48" y="140" width="720" height="350" fill="#FFFFFF" stroke="#0D0D0D" stroke-width="3"/>
  <!-- Red top accent on panel -->
  <rect x="48" y="140" width="720" height="6" fill="#D0021B"/>

  <!-- Phlix wordmark -->
  <text x="80" y="220"
    font-family="'Black Han Sans', 'Anton', Impact, sans-serif"
    font-size="72" font-weight="900" fill="#0D0D0D"
    letter-spacing="2">PHLIX</text>

  <!-- Tagline: Every Frame, A Masterpiece -->
  <text x="80" y="290"
    font-family="'Rampart One', 'Black Han Sans', Impact, sans-serif"
    font-size="48" font-weight="400" fill="#0D0D0D"
    letter-spacing="1">Every Frame, A Masterpiece.</text>

  <!-- Subtext -->
  <text x="80" y="350"
    font-family="'Noto Sans JP', sans-serif"
    font-size="22" fill="#5A5A5A">Self-hosted PHP media server</text>

  <!-- Impact Yellow star burst accent bottom-right of panel -->
  <g transform="translate(700, 430)">
    <polygon points="0,-40 8,-12 38,-12 14,4 22,34 0,16 -22,34 -14,4 -38,-12 -8,-12"
      fill="#FFD000"/>
  </g>

  <!-- Pen nib icon right side -->
  <g transform="translate(1000, 315)">
    <path d="M0,-60 L30,0 L0,60 L-30,0 Z" fill="#0D0D0D"/>
    <line x1="0" y1="-45" x2="0" y2="45" stroke="#D0021B" stroke-width="4"/>
    <circle cx="0" cy="0" r="8" fill="#F8F8F4"/>
  </g>
</svg>
