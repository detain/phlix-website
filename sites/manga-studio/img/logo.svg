<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 72" role="img" aria-label="Manga Studio logo">
  <!-- Panel border outer frame -->
  <rect x="1" y="1" width="238" height="70" fill="#F8F8F4" stroke="#0D0D0D" stroke-width="2"/>
  <!-- Inner accent bar top — Spot Red -->
  <rect x="1" y="1" width="238" height="4" fill="#D0021B"/>
  <!-- Speed-line accent marks left -->
  <line x1="8" y1="20" x2="20" y2="20" stroke="#0D0D0D" stroke-width="2"/>
  <line x1="8" y1="28" x2="16" y2="28" stroke="#0D0D0D" stroke-width="2"/>
  <line x1="8" y1="36" x2="20" y2="36" stroke="#0D0D0D" stroke-width="2"/>
  <!-- Pen nib icon — ink black with red accent -->
  <g transform="translate(220, 36)">
    <!-- nib body -->
    <path d="M0,-14 L8,0 L0,14 L-8,0 Z" fill="#0D0D0D"/>
    <!-- nib slit — Spot Red -->
    <line x1="0" y1="-10" x2="0" y2="10" stroke="#D0021B" stroke-width="2"/>
    <!-- nib dot -->
    <circle cx="0" cy="0" r="2" fill="#F8F8F4"/>
  </g>
  <!-- MANGA STUDIO wordmark -->
  <text x="26" y="46"
    font-family="'Black Han Sans', 'Anton', Impact, sans-serif"
    font-size="28"
    font-weight="900"
    fill="#0D0D0D"
    letter-spacing="-0.5">MANGA STUDIO</text>
</svg>
