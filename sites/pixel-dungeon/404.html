<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GAME OVER — Pixel Dungeon</title>
    <meta name="description" content="This quest does not exist." />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#0a0a0a" />
    <!-- 404 — no canonical, no open graph image (selfcheck requires og:image even for 404) -->
    <link rel="icon" type="image/svg+xml" href="img/favicon.svg" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/theme.css" />
    <link rel="stylesheet" href="css/components.css" />
  </head>
  <body data-page="404">
    <a class="skip-link" href="#main-content">Skip to main content</a>

    <main
      id="main-content"
      style="
        min-height: 80vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: var(--space-6);
      "
    >
      <!-- Game Over concept: Blip defeated sprite + "This Quest Does Not Exist" -->
      <div
        style="font-size: 3rem; margin-bottom: var(--space-4); color: var(--color-error)"
        aria-hidden="true"
      >
        ✕ ✕
      </div>
      <h1
        style="
          font-family: var(--font-headline);
          font-size: clamp(0.75rem, 3vw, 1.25rem);
          color: var(--color-text);
          letter-spacing: 0.08em;
          margin-bottom: var(--space-4);
        "
      >
        GAME OVER
      </h1>
      <p
        style="
          font-family: var(--font-headline);
          font-size: 0.625rem;
          color: var(--color-neutral);
          letter-spacing: 0.05em;
          margin-bottom: var(--space-2);
        "
      >
        — This Quest Does Not Exist —
      </p>
      <p
        style="
          font-family: var(--font-body);
          font-size: 0.75rem;
          color: var(--color-neutral);
          max-width: 400px;
          margin-bottom: var(--space-6);
        "
      >
        The map doesn't cover this area. Try heading back to the Lobby or check the Armory for your
        next adventure.
      </p>

      <div style="display: flex; gap: var(--space-3); flex-wrap: wrap; justify-content: center">
        <a href="./" class="btn btn-primary">✓ Restart — Back to Lobby</a>
        <a href="features.html" class="btn btn-ghost">Armory</a>
        <a href="download.html" class="btn btn-ghost">Insert Coin</a>
      </div>
    </main>

    <!-- No footer on 404 — pure Game Over screen -->
  </body>
</html>
