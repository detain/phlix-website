<!-- Blip — 16×16 pixel hero sprite running right (2-frame walk cycle) -->
<!-- Frame 1: left foot forward -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" role="img" aria-label="Blip the hero sprite">
  <!-- Background: transparent -->
  <!-- Head: 4×4 red tunic, 2×2 white eyes -->
  <rect x="6" y="1" width="4" height="4" fill="#E8001A"/>
  <rect x="7" y="2" width="2" height="2" fill="#F5F5F0"/>
  <rect x="7" y="2" width="1" height="1" fill="#000"/>
  <!-- Body: 4×4 red tunic -->
  <rect x="6" y="5" width="4" height="4" fill="#E8001A"/>
  <!-- Left arm (forward) -->
  <rect x="10" y="5" width="2" height="2" fill="#E8001A"/>
  <!-- Right arm (back) -->
  <rect x="4" y="6" width="2" height="2" fill="#E8001A"/>
  <!-- Legs: left foot forward -->
  <rect x="6" y="9" width="2" height="3" fill="#0055AA"/>
  <rect x="8" y="10" width="2" height="3" fill="#0055AA"/>
  <!-- Left foot forward (frame 1) -->
  <rect x="4" y="12" width="2" height="2" fill="#0A0A0A"/>
  <!-- Right foot back -->
  <rect x="10" y="11" width="2" height="2" fill="#0A0A0A"/>
</svg>
