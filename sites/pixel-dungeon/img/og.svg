<!-- Pixel Dungeon OG social share card — 1200×630, Cartridge Black, Mario Red border -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Phlix Pixel Dungeon — Insert Coin. Begin Story.">
  <!-- Background -->
  <rect width="1200" height="630" fill="#0A0A0A"/>
  <!-- CRT scanlines -->
  <rect width="1200" height="630" fill="url(#scanlines)" opacity="0.05"/>
  <!-- Border -->
  <rect x="16" y="16" width="1168" height="598" fill="none" stroke="#E8001A" stroke-width="4"/>
  <!-- Inner border -->
  <rect x="24" y="24" width="1152" height="582" fill="none" stroke="#333333" stroke-width="2"/>

  <!-- Logo area -->
  <text
    x="600" y="160"
    font-family="'Press Start 2P', monospace"
    font-size="80"
    fill="#F5F5F0"
    text-anchor="middle"
    letter-spacing="12"
  >PHLIX</text>

  <!-- Decorative pixel divider -->
  <rect x="300" y="200" width="600" height="4" fill="#E8001A"/>

  <!-- Tagline -->
  <text
    x="600" y="300"
    font-family="'Press Start 2P', monospace"
    font-size="36"
    fill="#FFCC00"
    text-anchor="middle"
    letter-spacing="6"
  >Insert Coin.</text>
  <text
    x="600" y="370"
    font-family="'Press Start 2P', monospace"
    font-size="36"
    fill="#F5F5F0"
    text-anchor="middle"
    letter-spacing="6"
  >Begin Story.</text>

  <!-- Coin sprites -->
  <g transform="translate(180, 420)">
    <!-- Coin 1 -->
    <rect x="0" y="0" width="24" height="24" fill="#FFCC00"/>
    <rect x="4" y="4" width="16" height="16" fill="#88BB00"/>
    <rect x="8" y="8" width="8" height="8" fill="#FFCC00"/>
  </g>
  <g transform="translate(480, 420)">
    <!-- Coin 2 -->
    <rect x="0" y="0" width="24" height="24" fill="#FFCC00"/>
    <rect x="4" y="4" width="16" height="16" fill="#88BB00"/>
    <rect x="8" y="8" width="8" height="8" fill="#FFCC00"/>
  </g>
  <g transform="translate(696, 420)">
    <!-- Coin 3 — center -->
    <rect x="0" y="0" width="24" height="24" fill="#FFCC00"/>
    <rect x="4" y="4" width="16" height="16" fill="#88BB00"/>
    <rect x="8" y="8" width="8" height="8" fill="#FFCC00"/>
  </g>
  <g transform="translate(912, 420)">
    <!-- Coin 4 -->
    <rect x="0" y="0" width="24" height="24" fill="#FFCC00"/>
    <rect x="4" y="4" width="16" height="16" fill="#88BB00"/>
    <rect x="8" y="8" width="8" height="8" fill="#FFCC00"/>
  </g>
  <g transform="translate(1000, 420)">
    <!-- Coin 5 -->
    <rect x="0" y="0" width="24" height="24" fill="#FFCC00"/>
    <rect x="4" y="4" width="16" height="16" fill="#88BB00"/>
    <rect x="8" y="8" width="8" height="8" fill="#FFCC00"/>
  </g>

  <!-- Blurb -->
  <text
    x="600" y="520"
    font-family="'Silkscreen', monospace"
    font-size="22"
    fill="#666660"
    text-anchor="middle"
    letter-spacing="2"
  >Self-hosted PHP media server • BSD-3-Clause</text>

  <!-- Footer -->
  <text
    x="600" y="590"
    font-family="'Silkscreen', monospace"
    font-size="18"
    fill="#666660"
    text-anchor="middle"
    letter-spacing="4"
  >phlix.app</text>

  <defs>
    <pattern id="scanlines" x="0" y="0" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="4" height="2" fill="#000"/>
    </pattern>
  </defs>
</svg>
