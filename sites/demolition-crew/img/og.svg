<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#2D3436"/>
  <!-- Background debris fragments -->
  <polygon points="0,400 80,350 50,500" fill="#3D4449" opacity="0.6"/>
  <polygon points="1100,200 1200,150 1150,300" fill="#3D4449" opacity="0.6"/>
  <polygon points="200,0 300,80 150,100" fill="#3D4449" opacity="0.4"/>
  <!-- Central blast -->
  <circle cx="600" cy="315" r="200" fill="#FF3838" opacity="0.15"/>
  <circle cx="600" cy="315" r="140" fill="#FF3838" opacity="0.2"/>
  <circle cx="600" cy="315" r="80" fill="#FF3838" opacity="0.3"/>
  <!-- Wrecking ball icon -->
  <circle cx="600" cy="280" r="60" fill="#FF3838"/>
  <circle cx="600" cy="280" r="42" fill="#2D3436"/>
  <circle cx="600" cy="280" r="22" fill="#FF3838"/>
  <!-- Chain -->
  <rect x="597" y="140" width="6" height="80" fill="#FFD93D"/>
  <rect x="597" y="100" width="6" height="40" fill="#FFD93D"/>
  <rect x="597" y="60" width="6" height="40" fill="#FFD93D"/>
  <!-- Title -->
  <text x="600" y="420" font-family="Impact, Arial Black, sans-serif" font-size="72" font-weight="900" fill="#F5F5F5" text-anchor="middle" letter-spacing="6">STREAM DEMOLISHED</text>
  <!-- Tagline -->
  <text x="600" y="470" font-family="Arial, sans-serif" font-size="24" fill="#636E72" text-anchor="middle" letter-spacing="4">WRECKING BALL APPROACH TO MEDIA SERVERS</text>
  <!-- Bottom stripe -->
  <rect x="0" y="600" width="1200" height="30" fill="#FF3838"/>
  <rect x="0" y="600" width="200" height="30" fill="#6C5CE7"/>
  <rect x="1000" y="600" width="200" height="30" fill="#FFD93D"/>
</svg>
