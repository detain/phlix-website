<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img">
  <title>Your Stories, Wide Open. — Phlix</title>
  <desc>Desert Horizon brand social share image — Sonoran Desert at golden hour with Phlix wordmark</desc>

  <!-- Sky gradient: sunset amber to mesa dusk -->
  <defs>
    <linearGradient id="og-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8C3A18"/>
      <stop offset="25%" stop-color="#C2542A"/>
      <stop offset="50%" stop-color="#E07050"/>
      <stop offset="75%" stop-color="#F2B87A"/>
      <stop offset="100%" stop-color="#F2E4C8"/>
    </linearGradient>
    <linearGradient id="mesa-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5C2E14" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#2E1A0E"/>
    </linearGradient>
    <!-- Navajo diamond pattern -->
    <pattern id="najo-diamond" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M20 0 L40 20 L20 40 L0 20 Z" fill="none" stroke="#C2542A" stroke-width="1.5" opacity="0.3"/>
      <path d="M20 5 L35 20 L20 35 L5 20 Z" fill="none" stroke="#2A8C82" stroke-width="1" opacity="0.2"/>
    </pattern>
  </defs>

  <!-- Background sky -->
  <rect width="1200" height="630" fill="url(#og-sky)"/>

  <!-- Subtle Navajo diamond texture overlay on sky -->
  <rect width="1200" height="630" fill="url(#najo-diamond)" opacity="0.5"/>

  <!-- Sun disc -->
  <circle cx="900" cy="200" r="80" fill="#E07050" opacity="0.6"/>
  <circle cx="900" cy="200" r="50" fill="#F2B87A" opacity="0.7"/>

  <!-- Distant mesa mountains — far background -->
  <path d="M0 450 Q200 380 400 420 Q600 460 800 400 Q1000 340 1200 400 L1200 630 L0 630 Z"
        fill="#5C2E14" opacity="0.5"/>

  <!-- Mid mesa ridge -->
  <path d="M0 500 Q150 460 300 480 Q500 500 700 460 Q900 420 1100 460 Q1200 475 1200 460 L1200 630 L0 630 Z"
        fill="#8C3A18" opacity="0.8"/>

  <!-- Foreground mesa plateau -->
  <path d="M0 540 Q100 520 250 535 Q400 550 550 525 Q700 500 900 520 Q1100 540 1200 520 L1200 630 L0 630 Z"
        fill="#2E1A0E"/>

  <!-- Saguaro silhouette 1 — left focal point -->
  <g transform="translate(180, 400)" fill="#2E1A0E">
    <path d="M0 160 L0 80 Q0 50 -15 50 Q-30 50 -30 80 L-30 160"/>
    <path d="M-30 110 Q-50 100 -60 85"/>
    <path d="M0 70 Q20 55 35 40"/>
    <!-- Ground -->
    <ellipse cx="0" cy="160" rx="40" ry="5" fill="#2E1A0E" opacity="0.4"/>
  </g>

  <!-- Saguaro silhouette 2 — right, slightly smaller (atmospheric perspective) -->
  <g transform="translate(950, 420) scale(0.75)" fill="#2E1A0E" opacity="0.7">
    <path d="M0 160 L0 80 Q0 50 -15 50 Q-30 50 -30 80 L-30 160"/>
    <path d="M-30 110 Q-50 100 -60 85"/>
    <path d="M0 70 Q20 55 35 40"/>
  </g>

  <!-- Turquoise diamond decorative strip at bottom of image content -->
  <rect x="0" y="0" width="1200" height="6" fill="url(#najo-diamond)"/>

  <!-- White overlay for bottom text zone -->
  <rect x="0" y="470" width="1200" height="160" fill="#F2E4C8" opacity="0.92"/>

  <!-- Top Navajo strip — static 4-color pattern -->
  <rect x="0" y="0" width="1200" height="6" fill="url(#top-strip)"/>
  <defs>
    <pattern id="top-strip" x="0" y="0" width="82" height="6" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="20" height="6" fill="#C2542A"/>
      <rect x="20" y="0" width="20" height="6" fill="#2A8C82"/>
      <rect x="40" y="0" width="20" height="6" fill="#E07050"/>
      <rect x="60" y="0" width="22" height="6" fill="#2E1A0E"/>
    </pattern>
  </defs>

  <!-- Wordmark zone -->
  <text x="80" y="540" font-family="Georgia, 'Rockwell', serif" font-size="52" font-weight="700" fill="#C2542A" letter-spacing="0.5">Your Stories, Wide Open.</text>
  <text x="80" y="590" font-family="Georgia, serif" font-size="28" fill="#2E1A0E" font-style="italic" letter-spacing="1">Phlix — Self-hosted media server</text>

  <!-- Turquoise accent marks -->
  <rect x="80" y="608" width="120" height="4" fill="#2A8C82" rx="2"/>

  <!-- Phlix wordmark right-aligned -->
  <text x="1120" y="590" font-family="Georgia, serif" font-size="36" font-weight="700" fill="#C2542A" text-anchor="end" letter-spacing="2">Phlix</text>
</svg>
