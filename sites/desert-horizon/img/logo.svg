<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" role="img">
  <title>Desert Horizon — Phlix brand</title>
  <desc>Desert Horizon wordmark with saguaro cactus silhouette badge</desc>

  <!-- Background: sandstone -->
  <rect width="320" height="80" rx="8" fill="#F2E4C8"/>

  <!-- Left: Saguaro silhouette badge -->
  <g transform="translate(8, 8)">
    <!-- Simple saguaro in terracotta -->
    <path d="M28 60 L28 30 Q28 18 22 18 Q16 18 16 30 L16 60"
          fill="none" stroke="#C2542A" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M16 38 Q10 34 6 28"
          fill="none" stroke="#C2542A" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M28 28 Q34 22 38 16"
          fill="none" stroke="#C2542A" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Ground line -->
    <line x1="4" y1="60" x2="40" y2="60" stroke="#C2542A" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  </g>

  <!-- Divider -->
  <line x1="60" y1="16" x2="60" y2="64" stroke="#2E1A0E" stroke-width="1.5" opacity="0.3"/>

  <!-- Wordmark -->
  <g font-family="Georgia, 'Rockwell', serif">
    <!-- "Desert" in Playfair Display style bold -->
    <text x="72" y="36" font-size="17" font-weight="700" fill="#C2542A" letter-spacing="0.5">Desert</text>
    <!-- "Horizon" in slightly lighter weight -->
    <text x="72" y="55" font-size="15" font-weight="400" fill="#2E1A0E" letter-spacing="0.8" font-style="italic">Horizon</text>
  </g>

  <!-- Turquoise accent dot -->
  <circle cx="308" cy="16" r="5" fill="#2A8C82" opacity="0.8"/>
</svg>
