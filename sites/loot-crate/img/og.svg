<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1A0A2E"/>
      <stop offset="50%" stop-color="#231040"/>
      <stop offset="100%" stop-color="#1A0A2E"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#9B59B6"/>
      <stop offset="50%" stop-color="#F39C12"/>
      <stop offset="100%" stop-color="#FFD700"/>
    </linearGradient>
    <radialGradient id="glow1" cx="30%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#9B59B6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#9B59B6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="70%" cy="30%" r="35%">
      <stop offset="0%" stop-color="#F39C12" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#F39C12" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow3" cx="80%" cy="80%" r="30%">
      <stop offset="0%" stop-color="#E74C3C" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#E74C3C" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glowGold">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Glow orbs -->
  <ellipse cx="360" cy="315" rx="480" ry="315" fill="url(#glow1)"/>
  <ellipse cx="840" cy="190" rx="420" ry="220" fill="url(#glow2)"/>
  <ellipse cx="960" cy="500" rx="360" ry="240" fill="url(#glow3)"/>

  <!-- Decorative grid lines -->
  <g opacity="0.08" stroke="#9B59B6" stroke-width="1">
    <line x1="0" y1="157" x2="1200" y2="157"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="473" x2="1200" y2="473"/>
    <line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
  </g>

  <!-- Loot crate icon (left side) -->
  <g transform="translate(80, 215)" filter="url(#glow)">
    <rect x="0" y="0" width="200" height="200" rx="20" fill="#2D1556" stroke="url(#textGrad)" stroke-width="4"/>
    <!-- Crate lid -->
    <line x1="0" y1="50" x2="200" y2="50" stroke="#9B59B6" stroke-width="2" opacity="0.7"/>
    <line x1="100" y1="0" x2="100" y2="200" stroke="#F39C12" stroke-width="2" opacity="0.5"/>
    <!-- Star in crate -->
    <path d="M100 70 l25 52 57 7-42 37 11 57-51-30-51 30 11-57-42-37 57-7z" fill="#FFD700" filter="url(#glowGold)"/>
  </g>

  <!-- Text content -->
  <g transform="translate(340, 0)">
    <!-- Wordmark -->
    <text x="60" y="220" font-family="'Chakra Petch', 'Orbitron', 'Rajdhani', sans-serif" font-size="110" font-weight="700" fill="url(#textGrad)" letter-spacing="12" filter="url(#glow)">PHLIX</text>

    <!-- Tagline -->
    <text x="60" y="300" font-family="'IBM Plex Sans', 'Exo 2', sans-serif" font-size="32" font-weight="400" fill="#F0E6FF" opacity="0.9">Your media. Your library. Your Phlix.</text>

    <!-- Subtext -->
    <text x="60" y="360" font-family="'IBM Plex Sans', 'Exo 2', sans-serif" font-size="22" fill="#B8A0D4" opacity="0.8">Self-hosted PHP media server</text>

    <!-- Features row -->
    <g transform="translate(60, 420)">
      <text font-family="'IBM Plex Mono', monospace" font-size="16" fill="#F39C12" opacity="0.9">Roku</text>
      <text x="120" font-family="'IBM Plex Mono', monospace" font-size="16" fill="#9B59B6" opacity="0.9">•</text>
      <text x="150" font-family="'IBM Plex Mono', monospace" font-size="16" fill="#3498DB" opacity="0.9">Samsung Tizen</text>
      <text x="360" font-family="'IBM Plex Mono', monospace" font-size="16" fill="#9B59B6" opacity="0.9">•</text>
      <text x="390" font-family="'IBM Plex Mono', monospace" font-size="16" fill="#FFD700" opacity="0.9">Windows</text>
      <text x="550" font-family="'IBM Plex Mono', monospace" font-size="16" fill="#9B59B6" opacity="0.9">•</text>
      <text x="580" font-family="'IBM Plex Mono', monospace" font-size="16" fill="#E74C3C" opacity="0.9">Mobile (beta)</text>
      <text x="780" font-family="'IBM Plex Mono', monospace" font-size="16" fill="#9B59B6" opacity="0.9">•</text>
      <text x="810" font-family="'IBM Plex Mono', monospace" font-size="16" fill="#AAAAAA" opacity="0.9">DLNA</text>
    </g>

    <!-- Loot drop indicator -->
    <g transform="translate(60, 480)">
      <rect x="0" y="0" width="180" height="36" rx="6" fill="rgba(155,89,182,0.2)" stroke="#9B59B6" stroke-width="1"/>
      <text x="90" y="24" font-family="'IBM Plex Mono', monospace" font-size="14" fill="#9B59B6" text-anchor="middle" letter-spacing="2">OPEN SOURCE</text>
    </g>
  </g>

  <!-- Rarity glow at bottom -->
  <rect x="0" y="600" width="1200" height="30" fill="url(#textGrad)" opacity="0.15"/>
</svg>
