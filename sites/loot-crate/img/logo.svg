<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" fill="none">
  <defs>
    <linearGradient id="crateGrad" x1="0" y1="0" x2="200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#9B59B6"/>
      <stop offset="50%" stop-color="#F39C12"/>
      <stop offset="100%" stop-color="#FFD700"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Crate box -->
  <rect x="8" y="12" width="36" height="36" rx="4" fill="#2D1556" stroke="url(#crateGrad)" stroke-width="2" filter="url(#glow)"/>
  <!-- Crate lid lines -->
  <line x1="8" y1="22" x2="44" y2="22" stroke="#9B59B6" stroke-width="1.5" opacity="0.7"/>
  <line x1="26" y1="12" x2="26" y2="48" stroke="#F39C12" stroke-width="1.5" opacity="0.5"/>
  <!-- Star/loot symbol -->
  <path d="M26 28l3.5 7.5 8 1-6 5.5 1.5 8L26 44l-7 6 1.5-8-6-5.5 8-1z" fill="#FFD700" filter="url(#glow)" opacity="0.9"/>
  <!-- PHLIX text -->
  <text x="56" y="40" font-family="'Chakra Petch', 'Orbitron', 'Rajdhani', sans-serif" font-size="28" font-weight="700" fill="url(#crateGrad)" letter-spacing="4" filter="url(#glow)">PHLIX</text>
</svg>
