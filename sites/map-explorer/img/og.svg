<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="parchmentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5E6D3"/>
      <stop offset="50%" stop-color="#D4A574"/>
      <stop offset="100%" stop-color="#C9A227"/>
    </linearGradient>
    <radialGradient id="compassGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(201,162,39,0.4)"/>
      <stop offset="100%" stop-color="rgba(201,162,39,0)"/>
    </radialGradient>
    <pattern id="mapPattern" x="0" y="0" width="120" height="120" patternUnits="userSpaceOnUse">
      <path d="M60 10 L65 55 L110 60 L65 65 L60 110 L55 65 L10 60 L55 55 Z" fill="none" stroke="#C9A227" stroke-width="0.5" opacity="0.15"/>
      <circle cx="60" cy="60" r="40" fill="none" stroke="#C9A227" stroke-width="0.3" opacity="0.1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#F5E6D3"/>
  <rect width="1200" height="630" fill="url(#parchmentGrad)" opacity="0.3"/>
  <rect width="1200" height="630" fill="url(#mapPattern)"/>

  <!-- Decorative border -->
  <rect x="30" y="30" width="1140" height="570" rx="4" fill="none" stroke="#8B4513" stroke-width="2" opacity="0.5"/>
  <rect x="40" y="40" width="1120" height="550" rx="2" fill="none" stroke="#C9A227" stroke-width="1" opacity="0.6"/>

  <!-- Large compass rose (left side) -->
  <g transform="translate(200, 315)" opacity="0.25">
    <circle cx="0" cy="0" r="140" fill="none" stroke="#C9A227" stroke-width="1"/>
    <circle cx="0" cy="0" r="120" fill="none" stroke="#C9A227" stroke-width="0.5"/>
    <circle cx="0" cy="0" r="100" fill="none" stroke="#C9A227" stroke-width="0.3"/>
    <!-- N-S-E-W points -->
    <path d="M0 -120 L8 -20 L0 0 L-8 -20 Z" fill="#C9A227"/>
    <path d="M0 120 L8 20 L0 0 L-8 20 Z" fill="#8B4513" opacity="0.7"/>
    <path d="M-120 0 L-20 -8 L0 0 L-20 8 Z" fill="#8B4513" opacity="0.7"/>
    <path d="M120 0 L20 -8 L0 0 L20 8 Z" fill="#C9A227"/>
    <!-- Diagonal points -->
    <path d="M-85 -85 L-14 -14 L0 0 Z" fill="#C9A227" opacity="0.6"/>
    <path d="M85 -85 L14 -14 L0 0 Z" fill="#C9A227" opacity="0.6"/>
    <path d="M-85 85 L-14 14 L0 0 Z" fill="#C9A227" opacity="0.6"/>
    <path d="M85 85 L14 14 L0 0 Z" fill="#C9A227" opacity="0.6"/>
    <!-- Center -->
    <circle cx="0" cy="0" r="8" fill="#C9A227"/>
    <circle cx="0" cy="0" r="4" fill="#8B4513"/>
  </g>

  <!-- Compass glow overlay -->
  <circle cx="200" cy="315" r="180" fill="url(#compassGlow)"/>

  <!-- Content area (right side) -->
  <!-- Logo -->
  <g transform="translate(700, 200)">
    <!-- Small compass rose for logo area -->
    <circle cx="0" cy="0" r="50" fill="none" stroke="#C9A227" stroke-width="2"/>
    <circle cx="0" cy="0" r="42" fill="none" stroke="#C9A227" stroke-width="1" opacity="0.5"/>
    <path d="M0 -42 L4 -8 L0 0 L-4 -8 Z" fill="#C9A227"/>
    <path d="M0 42 L4 8 L0 0 L-4 8 Z" fill="#8B4513"/>
    <path d="M-42 0 L-8 -4 L0 0 L-8 4 Z" fill="#8B4513"/>
    <path d="M42 0 L8 -4 L0 0 L8 4 Z" fill="#C9A227"/>
    <circle cx="0" cy="0" r="4" fill="#C9A227"/>
  </g>

  <!-- Wordmark -->
  <text x="700" y="290" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="64" font-weight="bold" fill="#2C1810" letter-spacing="0.08em">Phlix</text>

  <!-- Decorative underline -->
  <line x1="600" y1="310" x2="800" y2="310" stroke="#C9A227" stroke-width="2" opacity="0.8"/>

  <!-- Headline -->
  <text x="700" y="400" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="44" font-weight="bold" fill="#2C1810">Your media. Your library.</text>
  <text x="700" y="460" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="44" font-weight="bold" fill="#8B4513">Your Phlix.</text>

  <!-- Tagline -->
  <text x="700" y="530" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="20" fill="#5C4033" font-style="italic">Self-hosted media server — on your terms.</text>

  <!-- Corner ornaments -->
  <path d="M50 50 L90 50 L90 52 L52 52 L52 90 L50 90 Z" fill="#C9A227" opacity="0.6"/>
  <path d="M1150 50 L1110 50 L1110 52 L1148 52 L1148 90 L1150 90 Z" fill="#C9A227" opacity="0.6"/>
  <path d="M50 580 L90 580 L90 578 L52 578 L52 540 L50 540 Z" fill="#C9A227" opacity="0.6"/>
  <path d="M1150 580 L1110 580 L1110 578 L1148 578 L1148 540 L1150 540 Z" fill="#C9A227" opacity="0.6"/>

  <!-- Bottom decorative line -->
  <line x1="400" y1="570" x2="1000" y2="570" stroke="#C9A227" stroke-width="1" opacity="0.4"/>
</svg>
