<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" width="200" height="60">
  <title>Phlix — Fantasy Map Explorer</title>
  <desc>Phlix media server logo with compass rose and treasure map aesthetic</desc>

  <defs>
    <!-- Gold gradient for compass elements -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D4AD2E"/>
      <stop offset="50%" style="stop-color:#C9A227"/>
      <stop offset="100%" style="stop-color:#8B6914"/>
    </linearGradient>

    <!-- Parchment gradient background -->
    <linearGradient id="parchmentGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFF8F0"/>
      <stop offset="100%" style="stop-color:#F5E6D3"/>
    </linearGradient>
  </defs>

  <!-- Compass Rose Symbol -->
  <g transform="translate(8, 8)">
    <!-- Outer circle -->
    <circle cx="22" cy="22" r="20" fill="none" stroke="#C9A227" stroke-width="1.5" opacity="0.6"/>
    <circle cx="22" cy="22" r="16" fill="none" stroke="#C9A227" stroke-width="0.5" opacity="0.4"/>

    <!-- Main compass points -->
    <path d="M22 2 L25 18 L22 22 L19 18 Z" fill="url(#goldGrad)"/>
    <path d="M22 42 L25 26 L22 22 L19 26 Z" fill="#8B4513" opacity="0.7"/>
    <path d="M2 22 L18 19 L22 22 L18 25 Z" fill="#8B4513" opacity="0.7"/>
    <path d="M42 22 L26 19 L22 22 L26 25 Z" fill="url(#goldGrad)"/>

    <!-- Diagonal points -->
    <path d="M7 7 L19 19 L22 22 L19 19 Z" fill="#C9A227" opacity="0.5"/>
    <path d="M37 7 L25 19 L22 22 L25 19 Z" fill="#C9A227" opacity="0.5"/>
    <path d="M7 37 L19 25 L22 22 L19 25 Z" fill="#C9A227" opacity="0.5"/>
    <path d="M37 37 L25 25 L22 22 L25 25 Z" fill="#C9A227" opacity="0.5"/>

    <!-- Center circle -->
    <circle cx="22" cy="22" r="3" fill="url(#goldGrad)"/>
  </g>

  <!-- Phlix Text -->
  <text x="58" y="38"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="28"
        font-weight="bold"
        fill="#2C1810"
        letter-spacing="0.12em">Phlix</text>

  <!-- Decorative underline -->
  <path d="M58 44 Q75 46, 92 44 T130 44"
        fill="none"
        stroke="#C9A227"
        stroke-width="1.5"
        stroke-linecap="round"
        opacity="0.8"/>
</svg>
