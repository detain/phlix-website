<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <title>Phlix favicon</title>
  <desc>Compass rose favicon for Phlix media server</desc>

  <defs>
    <linearGradient id="goldFav" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D4AD2E"/>
      <stop offset="100%" style="stop-color:#8B6914"/>
    </linearGradient>
  </defs>

  <!-- Background circle (aged parchment) -->
  <circle cx="16" cy="16" r="15" fill="#F5E6D3" stroke="#C9A227" stroke-width="1.5"/>

  <!-- Compass Rose -->
  <g transform="translate(16, 16)">
    <!-- Main N-S-E-W points -->
    <path d="M0 -10 L2.5 -3 L0 0 L-2.5 -3 Z" fill="url(#goldFav)"/>
    <path d="M0 10 L2.5 3 L0 0 L-2.5 3 Z" fill="#8B4513" opacity="0.7"/>
    <path d="M-10 0 L-3 -2.5 L0 0 L-3 2.5 Z" fill="#8B4513" opacity="0.7"/>
    <path d="M10 0 L3 -2.5 L0 0 L3 2.5 Z" fill="url(#goldFav)"/>

    <!-- Diagonal minor points -->
    <path d="M-7 -7 L-2.5 -2.5 L0 0 Z" fill="#C9A227" opacity="0.5"/>
    <path d="M7 -7 L2.5 -2.5 L0 0 Z" fill="#C9A227" opacity="0.5"/>
    <path d="M-7 7 L-2.5 2.5 L0 0 Z" fill="#C9A227" opacity="0.5"/>
    <path d="M7 7 L2.5 2.5 L0 0 Z" fill="#C9A227" opacity="0.5"/>

    <!-- Center dot -->
    <circle cx="0" cy="0" r="1.5" fill="#C9A227"/>
  </g>
</svg>
