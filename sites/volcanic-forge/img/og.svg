<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="heroBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0E0C0A"/>
      <stop offset="50%" stop-color="#1C1916"/>
      <stop offset="100%" stop-color="#0E0C0A"/>
    </linearGradient>
    <linearGradient id="forgeHorizon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D4820A" stop-opacity="0.6"/>
      <stop offset="30%" stop-color="#E8611A" stop-opacity="0.4"/>
      <stop offset="60%" stop-color="#C0241A" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0E0C0A" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="eruptionGlow" cx="50%" cy="60%" r="50%">
      <stop offset="0%" stop-color="#E8611A" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0E0C0A" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#heroBg)"/>

  <!-- Forge horizon gradient -->
  <rect x="0" y="280" width="1200" height="350" fill="url(#forgeHorizon)"/>

  <!-- Eruption radial glow -->
  <ellipse cx="600" cy="400" rx="700" ry="300" fill="url(#eruptionGlow)"/>

  <!-- Lava crack / magma channel (decorative diagonal) -->
  <path d="M0 630 L300 400 L500 450 L800 300 L1200 200 L1200 630 Z" fill="#E8611A" opacity="0.08"/>

  <!-- Forge glow line -->
  <rect x="300" y="395" width="600" height="2" rx="1" fill="#E8611A" opacity="0.5"/>
  <rect x="350" y="400" width="500" height="1" rx="0.5" fill="#D4820A" opacity="0.4"/>

  <!-- Logo area: anvil badge + Phlix wordmark -->
  <g transform="translate(80, 200)">
    <!-- Anvil badge -->
    <g transform="translate(0, 0)">
      <polygon points="10,38 50,38 56,28 62,28 62,18 2,18 2,28 8,28" fill="#3D3530"/>
      <polygon points="0,32 8,26 8,32" fill="#3D3530"/>
      <polygon points="2,18 62,18 58,10 6,10" fill="#E8611A" opacity="0.9"/>
      <path d="M22 18 C20 12 26 4 30 10 C34 4 40 12 38 18 Z" fill="#D4820A"/>
    </g>

    <!-- Vertical stripe -->
    <rect x="72" y="0" width="4" height="60" rx="2" fill="#E8611A"/>

    <!-- Phlix text -->
    <text x="86" y="52" font-family="'Anton', 'Barlow Condensed', Impact, sans-serif" font-size="56" font-weight="400" letter-spacing="0.03em" fill="#F0EAE0">Phlix</text>
  </g>

  <!-- Headline -->
  <text x="80" y="350" font-family="'Anton', 'Barlow Condensed', Impact, sans-serif" font-size="80" font-weight="400" letter-spacing="0.02em" fill="#F0EAE0">FORGED FOR THE SCREEN.</text>

  <!-- Tagline -->
  <text x="80" y="400" font-family="'Barlow Semi Condensed', sans-serif" font-size="24" font-weight="600" letter-spacing="0.1em" fill="#7A7268">Self-hosted media server</text>

  <!-- Ember gold accent line -->
  <rect x="80" y="420" width="320" height="2" rx="1" fill="#D4820A" opacity="0.7"/>

  <!-- URL hint -->
  <text x="80" y="600" font-family="'Barlow', sans-serif" font-size="16" fill="#7A7268">phlix-website / volcanic-forge</text>
</svg>
