<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 52" fill="none">
  <!-- Volcanic Forge logo: angular obsidian badge + Phlix wordmark + lava accent -->
  <defs>
    <linearGradient id="lavaAccent" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#E8611A"/>
      <stop offset="100%" stop-color="#D4820A"/>
    </linearGradient>
    <linearGradient id="magmaGlow" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#C0241A"/>
      <stop offset="100%" stop-color="#0E0C0A"/>
    </linearGradient>
  </defs>

  <!-- Anvil silhouette — forge symbol -->
  <g transform="translate(4, 10)">
    <!-- Anvil body -->
    <polygon points="10,28 30,28 34,22 38,22 38,18 6,18 6,22 10,22" fill="#3D3530"/>
    <!-- Anvil horn -->
    <polygon points="0,24 6,18 6,24" fill="#3D3530"/>
    <!-- Anvil top face (hot) -->
    <polygon points="6,18 38,18 36,14 8,14" fill="#E8611A" opacity="0.9"/>
    <!-- Forge flame -->
    <path d="M16 14 C14 10 18 4 20 8 C22 4 26 10 24 14 Z" fill="#D4820A"/>
    <path d="M18 14 C17 11 20 6 22 9 C24 6 27 11 26 14 Z" fill="#E8611A"/>
  </g>

  <!-- Vertical lava accent stripe -->
  <rect x="50" y="4" width="3" height="44" rx="1.5" fill="url(#lavaAccent)"/>

  <!-- "Phlix" wordmark in Anton style (bold condensed) -->
  <text x="60" y="40" font-family="'Anton', 'Barlow Condensed', Impact, sans-serif" font-size="36" font-weight="400" letter-spacing="0.03em" fill="#F0EAE0">Phlix</text>

  <!-- Tagline -->
  <text x="60" y="48" font-family="'Barlow Semi Condensed', sans-serif" font-size="9" font-weight="600" letter-spacing="0.12em" fill="#7A7268" text-transform="uppercase">Volcanic Forge</text>
</svg>
