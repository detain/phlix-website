<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <style>
      .bg { fill: #F5F5DC; }
      .ink { fill: #1A1A1A; }
      .curtain { fill: #8B0000; }
      .gold { fill: #C9A227; }
      .charcoal { fill: #2F2F2F; }
      .paper-light { fill: #FAFAE8; }
      .text { font-family: 'Courier New', Courier, monospace; font-weight: bold; }
      .text-light { font-family: 'Courier New', Courier, monospace; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="bg" width="1200" height="630"/>

  <!-- Paper lines texture -->
  <g opacity="0.05">
    <line x1="0" y1="100" x2="1200" y2="100" stroke="#8B0000" stroke-width="1"/>
    <line x1="0" y1="200" x2="1200" y2="200" stroke="#8B0000" stroke-width="1"/>
    <line x1="0" y1="300" x2="1200" y2="300" stroke="#8B0000" stroke-width="1"/>
    <line x1="0" y1="400" x2="1200" y2="400" stroke="#8B0000" stroke-width="1"/>
    <line x1="0" y1="500" x2="1200" y2="500" stroke="#8B0000" stroke-width="1"/>
  </g>

  <!-- Film strip left edge -->
  <rect x="0" y="0" width="60" height="630" class="curtain"/>
  <rect x="10" y="50" width="40" height="30" rx="2" class="paper-light"/>
  <rect x="10" y="130" width="40" height="30" rx="2" class="paper-light"/>
  <rect x="10" y="210" width="40" height="30" rx="2" class="paper-light"/>
  <rect x="10" y="290" width="40" height="30" rx="2" class="paper-light"/>
  <rect x="10" y="370" width="40" height="30" rx="2" class="paper-light"/>
  <rect x="10" y="450" width="40" height="30" rx="2" class="paper-light"/>
  <rect x="10" y="530" width="40" height="30" rx="2" class="paper-light"/>

  <!-- Film strip right edge -->
  <rect x="1140" y="0" width="60" height="630" class="curtain"/>
  <rect x="1150" y="50" width="40" height="30" rx="2" class="paper-light"/>
  <rect x="1150" y="130" width="40" height="30" rx="2" class="paper-light"/>
  <rect x="1150" y="210" width="40" height="30" rx="2" class="paper-light"/>
  <rect x="1150" y="290" width="40" height="30" rx="2" class="paper-light"/>
  <rect x="1150" y="370" width="40" height="30" rx="2" class="paper-light"/>
  <rect x="1150" y="450" width="40" height="30" rx="2" class="paper-light"/>
  <rect x="1150" y="530" width="40" height="30" rx="2" class="paper-light"/>

  <!-- Logo wordmark -->
  <text x="640" y="220" class="text ink" font-size="72" text-anchor="middle" letter-spacing="0.1em">PHLIX</text>

  <!-- Tagline -->
  <text x="640" y="280" class="text-light charcoal" font-size="28" text-anchor="middle" letter-spacing="0.05em">MEDIA SERVER</text>

  <!-- Divider -->
  <line x1="340" y1="320" x2="940" y2="320" stroke="#C9A227" stroke-width="2"/>

  <!-- Headline -->
  <text x="640" y="420" class="text ink" font-size="36" text-anchor="middle">Your media. Your library.</text>
  <text x="640" y="470" class="text ink" font-size="36" text-anchor="middle">Your Phlix.</text>

  <!-- Accent line -->
  <rect x="540" y="510" width="200" height="4" class="curtain" rx="2"/>

  <!-- Bottom tagline -->
  <text x="640" y="580" class="text-light charcoal" font-size="18" text-anchor="middle" letter-spacing="0.15em">OPEN-SOURCE MEDIA, ON YOUR TERMS.</text>
</svg>
