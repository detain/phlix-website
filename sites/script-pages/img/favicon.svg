<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Script favicon — film frame with P -->
  <rect width="32" height="32" fill="#8B0000" rx="4"/>
  <rect x="4" y="4" width="24" height="24" fill="#F5F5DC" rx="2"/>

  <!-- Film perforations -->
  <rect x="6" y="6" width="3" height="4" fill="#8B0000" rx="1"/>
  <rect x="6" y="22" width="3" height="4" fill="#8B0000" rx="1"/>
  <rect x="23" y="6" width="3" height="4" fill="#8B0000" rx="1"/>
  <rect x="23" y="22" width="3" height="4" fill="#8B0000" rx="1"/>

  <!-- P letter -->
  <text x="16" y="23" font-family="Courier New, monospace" font-size="14" font-weight="bold" fill="#8B0000" text-anchor="middle">P</text>
</svg>
