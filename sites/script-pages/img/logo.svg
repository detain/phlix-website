<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 40">
  <!-- Phlix logo — screenplay style with film reel motif -->
  <defs>
    <style>
      .logo-text { font-family: 'Courier New', monospace; font-weight: bold; fill: #1A1A1A; }
      .logo-accent { fill: #8B0000; }
    </style>
  </defs>

  <!-- Film strip accent -->
  <rect x="0" y="8" width="8" height="24" fill="#8B0000" rx="1"/>
  <rect x="2" y="12" width="4" height="4" fill="#F5F5DC"/>
  <rect x="2" y="20" width="4" height="4" fill="#F5F5DC"/>
  <rect x="2" y="28" width="4" height="4" fill="#F5F5DC"/>

  <!-- Wordmark -->
  <text x="16" y="28" font-size="24" class="logo-text">PHLIX</text>

  <!-- Subtitle line -->
  <text x="16" y="38" font-size="8" class="logo-text" fill="#2F2F2F" letter-spacing="0.15em">MEDIA SERVER</text>
</svg>
