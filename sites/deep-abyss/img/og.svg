<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A1628"/>
      <stop offset="50%" stop-color="#0E4D64"/>
      <stop offset="100%" stop-color="#0A1628"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00F5D4" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#00F5D4" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5D4"/>
      <stop offset="100%" stop-color="#1B8ABC"/>
    </linearGradient>
    <radialGradient id="glowBubble" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00F5D4" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#00F5D4" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Decorative depth lines -->
  <g opacity="0.1" stroke="#1B8ABC" stroke-width="1" fill="none">
    <path d="M0 500 Q300 480 600 500 Q900 520 1200 500"/>
    <path d="M0 520 Q300 500 600 520 Q900 540 1200 520"/>
    <path d="M0 540 Q300 520 600 540 Q900 560 1200 540"/>
  </g>

  <!-- Central glow -->
  <ellipse cx="600" cy="280" rx="400" ry="250" fill="url(#glowBubble)"/>

  <!-- Jellyfish logo mark - centered -->
  <g transform="translate(480, 120)">
    <!-- Outer glow ring -->
    <ellipse cx="120" cy="100" rx="100" ry="80" fill="url(#glowGrad)" opacity="0.5"/>

    <!-- Bell top dome -->
    <path d="M120 30 C30 30 10 80 10 120 C10 160 40 180 80 180 L160 180 C200 180 230 160 230 120 C230 80 210 30 120 30Z"
          fill="#0A1628" stroke="url(#bodyGrad)" stroke-width="4"/>

    <!-- Inner dome highlight -->
    <ellipse cx="120" cy="95" rx="70" ry="45" fill="none" stroke="#00F5D4" stroke-width="2" opacity="0.5"/>

    <!-- Tentacles -->
    <g stroke="url(#bodyGrad)" stroke-width="3" stroke-linecap="round" fill="none" filter="url(#glow)">
      <path d="M50 165 Q40 220 60 270" opacity="0.7"/>
      <path d="M85 175 Q75 235 95 285" opacity="0.85"/>
      <path d="M120 180 Q120 250 120 300" opacity="1"/>
      <path d="M155 175 Q165 235 145 285" opacity="0.85"/>
      <path d="M190 165 Q200 220 180 270" opacity="0.7"/>
    </g>

    <!-- Bioluminescent dots -->
    <circle cx="80" cy="105" r="6" fill="#00F5D4" filter="url(#glow)"/>
    <circle cx="145" cy="95" r="4" fill="#00F5D4" opacity="0.7" filter="url(#glow)"/>
    <circle cx="120" cy="130" r="5" fill="#00F5D4" filter="url(#glow)"/>
    <circle cx="160" cy="115" r="3" fill="#00F5D4" opacity="0.5"/>
  </g>

  <!-- Wordmark -->
  <text x="600" y="460" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="72" font-weight="700" fill="#E8F4F8" letter-spacing="-0.02em">Phlix</text>

  <!-- Tagline -->
  <text x="600" y="510" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="24" font-weight="400" fill="#6B9DB5" letter-spacing="0.05em">SELF-HOSTED MEDIA SERVER</text>

  <!-- Bottom accent bar -->
  <rect x="500" y="540" width="200" height="3" rx="1.5" fill="url(#bodyGrad)"/>
</svg>
