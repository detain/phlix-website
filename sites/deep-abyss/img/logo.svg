<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" fill="none">
  <!-- Deep Abyss Phlix logo — wave/fish abstract mark + wordmark -->
  <defs>
    <linearGradient id="markGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00CED1"/>
      <stop offset="100%" stop-color="#004488"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Abstract wave/fish mark -->
  <g transform="translate(8, 10)" filter="url(#glow)">
    <!-- Outer ring -->
    <circle cx="20" cy="20" r="18" stroke="url(#markGrad)" stroke-width="2" fill="none" opacity="0.4"/>
    <!-- Inner wave forms suggesting a fish swimming -->
    <path d="M8 20 Q14 10, 22 14 Q30 18, 34 12" stroke="#00CED1" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <path d="M8 20 Q14 30, 22 26 Q30 22, 34 28" stroke="#00CED1" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <!-- Eye dot -->
    <circle cx="30" cy="20" r="2.5" fill="#00CED1"/>
  </g>

  <!-- Wordmark -->
  <text x="56" y="38" font-family="Georgia, 'Times New Roman', serif" font-size="26" font-weight="700" fill="#F5F5F5" letter-spacing="0.04em">Phlix</text>
</svg>
