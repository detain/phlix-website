<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" fill="none">
  <defs>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5D4"/>
      <stop offset="100%" stop-color="#1B8ABC"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00F5D4" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#00F5D4" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Jellyfish body / logo mark -->
  <g transform="translate(8, 8)">
    <!-- Outer glow -->
    <ellipse cx="20" cy="16" rx="18" ry="14" fill="url(#glowGrad)" opacity="0.4"/>
    <!-- Main bell -->
    <path d="M20 4 C8 4 2 12 2 20 C2 26 6 30 12 30 L28 30 C34 30 38 26 38 20 C38 12 32 4 20 4Z"
          fill="#0A1628" stroke="url(#bodyGrad)" stroke-width="2"/>
    <!-- Inner dome -->
    <ellipse cx="20" cy="16" rx="12" ry="8" fill="none" stroke="#00F5D4" stroke-width="1" opacity="0.6"/>
    <!-- Tentacles -->
    <g stroke="url(#bodyGrad)" stroke-width="1.5" stroke-linecap="round" fill="none">
      <path d="M10 28 Q8 36 12 42" opacity="0.8"/>
      <path d="M16 29 Q14 38 18 44" opacity="0.9"/>
      <path d="M20 30 Q20 40 20 46" opacity="1" filter="url(#glow)"/>
      <path d="M24 29 Q26 38 22 44" opacity="0.9"/>
      <path d="M30 28 Q32 36 28 42" opacity="0.8"/>
    </g>
    <!-- Bioluminescent dots -->
    <circle cx="14" cy="18" r="1.5" fill="#00F5D4" filter="url(#glow)"/>
    <circle cx="24" cy="16" r="1" fill="#00F5D4" opacity="0.7"/>
    <circle cx="20" cy="22" r="1.2" fill="#00F5D4" filter="url(#glow)"/>
  </g>

  <!-- Wordmark -->
  <text x="68" y="38" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="24" font-weight="700" fill="#E8F4F8">Phlix</text>
  <text x="68" y="52" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10" font-weight="400" fill="#6B9DB5" letter-spacing="0.1em">MEDIA SERVER</text>
</svg>
