<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <!-- OG image for social sharing -->
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16213E"/>
      <stop offset="100%" stop-color="#0F0F1A"/>
    </linearGradient>
    <linearGradient id="fire-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF3E3E"/>
      <stop offset="100%" stop-color="#FF6B35"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg-grad)"/>

  <!-- Speed lines -->
  <g opacity="0.1">
    <line x1="0" y1="100" x2="1200" y2="100" stroke="#00D9FF" stroke-width="2"/>
    <line x1="0" y1="200" x2="1200" y2="200" stroke="#00D9FF" stroke-width="1"/>
    <line x1="0" y1="315" x2="1200" y2="315" stroke="#FF3E3E" stroke-width="3"/>
    <line x1="0" y1="430" x2="1200" y2="430" stroke="#00D9FF" stroke-width="1"/>
    <line x1="0" y1="530" x2="1200" y2="530" stroke="#00D9FF" stroke-width="2"/>
  </g>

  <!-- Combat target / arena icon -->
  <circle cx="200" cy="315" r="120" stroke="url(#fire-grad)" stroke-width="8" fill="none" opacity="0.8"/>
  <circle cx="200" cy="315" r="60" stroke="#FF3E3E" stroke-width="4" fill="none"/>
  <circle cx="200" cy="315" r="20" fill="#FF3E3E" opacity="0.3"/>
  <!-- Crosshairs -->
  <line x1="200" y1="140" x2="200" y2="200" stroke="#00D9FF" stroke-width="4"/>
  <line x1="200" y1="430" x2="200" y2="490" stroke="#00D9FF" stroke-width="4"/>
  <line x1="25" y1="315" x2="85" y2="315" stroke="#00D9FF" stroke-width="4"/>
  <line x1="315" y1="315" x2="375" y2="315" stroke="#00D9FF" stroke-width="4"/>

  <!-- Phlix text -->
  <text x="450" y="280" font-family="Bebas Neue, Impact, sans-serif" font-size="140" fill="#F5F5F7" letter-spacing="0.06em">PHLIX</text>
  <text x="455" y="380" font-family="Bebas Neue, Impact, sans-serif" font-size="48" fill="#FF3E3E" letter-spacing="0.1em">DIGITAL COMBAT ZONE</text>

  <!-- Tagline -->
  <text x="455" y="450" font-family="Exo 2, sans-serif" font-size="28" fill="#A0A0B0" letter-spacing="0.02em">Your Library. Your Arena. Your Fight.</text>

  <!-- Bottom accent -->
  <rect x="450" y="480" width="300" height="4" fill="url(#fire-grad)" opacity="0.6"/>
</svg>
