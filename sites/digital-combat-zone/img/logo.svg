<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" fill="none">
  <!-- Phlix wordmark with combat styling -->
  <defs>
    <linearGradient id="arena-fire" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF3E3E"/>
      <stop offset="100%" stop-color="#FF6B35"/>
    </linearGradient>
    <filter id="glow-red">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Combat arena icon / target reticle -->
  <circle cx="30" cy="30" r="18" stroke="url(#arena-fire)" stroke-width="3" fill="none" filter="url(#glow-red)"/>
  <circle cx="30" cy="30" r="8" stroke="#FF3E3E" stroke-width="2" fill="none"/>
  <line x1="30" y1="8" x2="30" y2="16" stroke="#00D9FF" stroke-width="2"/>
  <line x1="30" y1="44" x2="30" y2="52" stroke="#00D9FF" stroke-width="2"/>
  <line x1="8" y1="30" x2="16" y2="30" stroke="#00D9FF" stroke-width="2"/>
  <line x1="44" y1="30" x2="52" y2="30" stroke="#00D9FF" stroke-width="2"/>

  <!-- Text: PHLIX -->
  <text x="65" y="42" font-family="Bebas Neue, Impact, sans-serif" font-size="38" fill="#F5F5F7" letter-spacing="0.08em">PHLIX</text>
</svg>
