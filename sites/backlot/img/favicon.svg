<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Simple square mark in primary color -->
  <rect width="32" height="32" fill="#2D2D2D"/>
  <!-- Film perforation style corner marks -->
  <rect x="4" y="4" width="4" height="4" fill="#FFD700"/>
  <rect x="24" y="4" width="4" height="4" fill="#FFD700"/>
  <rect x="4" y="24" width="4" height="4" fill="#FFD700"/>
  <rect x="24" y="24" width="4" height="4" fill="#FFD700"/>
  <!-- P letterform -->
  <text x="16" y="23" font-family="Arial Black, Arial, sans-serif" font-size="16" font-weight="900" fill="#F5F5DC" text-anchor="middle">P</text>
</svg>
