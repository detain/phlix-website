<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" fill="none">
  <!-- Backlot wordmark with industrial/warehouse aesthetic -->
  <!-- Film strip perforations on left -->
  <g fill="#FFD700">
    <rect x="8" y="10" width="6" height="8" rx="1"/>
    <rect x="8" y="26" width="6" height="8" rx="1"/>
    <rect x="8" y="42" width="6" height="8" rx="1"/>
  </g>

  <!-- Main wordmark -->
  <text x="28" y="42" font-family="Arial Black, Arial, sans-serif" font-size="32" font-weight="900" fill="#F5F5DC">PHLIX</text>

  <!-- Accent underline -->
  <rect x="28" y="50" width="50" height="3" fill="#FFD700"/>

  <!-- Tagline -->
  <text x="90" y="42" font-family="monospace" font-size="10" fill="#8B7355" letter-spacing="0.1em">BACKLOT EDITION</text>
</svg>
