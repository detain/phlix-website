<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#2D2D2D"/>

  <!-- Grid pattern (soundstage floor) -->
  <defs>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M 80 0 L 0 0 0 80" fill="none" stroke="#8B7355" stroke-width="1" opacity="0.2"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Golden accent bar -->
  <rect x="0" y="0" width="1200" height="8" fill="#FFD700"/>

  <!-- Film perforations left side -->
  <g fill="#FFD700" opacity="0.6">
    <rect x="30" y="60" width="16" height="24" rx="3"/>
    <rect x="30" y="120" width="16" height="24" rx="3"/>
    <rect x="30" y="180" width="16" height="24" rx="3"/>
    <rect x="30" y="240" width="16" height="24" rx="3"/>
    <rect x="30" y="300" width="16" height="24" rx="3"/>
    <rect x="30" y="360" width="16" height="24" rx="3"/>
    <rect x="30" y="420" width="16" height="24" rx="3"/>
    <rect x="30" y="480" width="16" height="24" rx="3"/>
    <rect x="30" y="540" width="16" height="24" rx="3"/>
  </g>

  <!-- Logo area -->
  <text x="100" y="300" font-family="Arial Black, Arial, sans-serif" font-size="120" font-weight="900" fill="#F5F5DC">PHLIX</text>

  <!-- Golden underline -->
  <rect x="100" y="330" width="400" height="8" fill="#FFD700"/>

  <!-- Tagline -->
  <text x="100" y="400" font-family="monospace" font-size="28" fill="#8B7355" letter-spacing="0.15em">BACKLOT EDITION</text>

  <!-- Subheadline -->
  <text x="100" y="480" font-family="Arial, sans-serif" font-size="36" fill="#F5F5DC">Your media. Your library. Your terms.</text>

  <!-- Bottom accent -->
  <rect x="0" y="622" width="1200" height="8" fill="#FFD700"/>
</svg>
