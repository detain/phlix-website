<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Phlix social sharing image">
  <title>Phlix — Grid. Type. Truth.</title>
  <desc>Swiss Modernist brand-kit OG image for Phlix media server</desc>
  <rect width="1200" height="630" fill="#F8F8F4"/>

  <!-- Grid lines (subtle) -->
  <g stroke="#E5E5E0" stroke-width="1" opacity="0.5">
    <line x1="100" y1="0" x2="100" y2="630"/>
    <line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="500" y1="0" x2="500" y2="630"/>
    <line x1="700" y1="0" x2="700" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
    <line x1="1100" y1="0" x2="1100" y2="630"/>
    <line x1="0" y1="157" x2="1200" y2="157"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="473" x2="1200" y2="473"/>
  </g>

  <!-- Large background numeral "01" -->
  <text x="850" y="580" font-family="Barlow Condensed, Inter, Impact, sans-serif" font-weight="900" font-size="480" fill="#EFEFEB" letter-spacing="-0.04em" text-anchor="middle">01</text>

  <!-- Phlix wordmark -->
  <text x="100" y="240" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="900" font-size="120" letter-spacing="-0.04em" fill="#121212">Phlix</text>

  <!-- 4px Basel Red rule -->
  <rect x="100" y="260" width="240" height="8" fill="#E8001C"/>

  <!-- Tagline -->
  <text x="100" y="340" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="500" font-size="36" letter-spacing="0.01em" fill="#1A1A1A">Grid. Type. Truth.</text>

  <!-- Descriptor line -->
  <text x="100" y="400" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" font-size="22" fill="#888888">Self-hosted media server</text>

  <!-- Bottom bar -->
  <rect x="0" y="580" width="1200" height="50" fill="#1A1A1A"/>
  <text x="100" y="615" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="500" font-size="16" letter-spacing="0.08em" fill="#F8F8F4" text-transform="uppercase">BSD-3-Clause · No subscription · PHP 8.3+</text>
</svg>
