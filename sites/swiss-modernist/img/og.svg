<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Phlix — Grid. Type. Truth.">
  <title>Phlix — Grid. Type. Truth.</title>
  <desc>Swiss Modernist brand-kit OG image for the Phlix media server: Grid White field, drawn 12-column guides, oversized Inter Black wordmark, one Basel Red rule.</desc>
  <rect width="1200" height="630" fill="#F8F8F4"/>

  <!-- The 12-column grid, drawn. 100px module, 1px Module Gray guides. -->
  <g stroke="#E5E5E0" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="630"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="500" y1="0" x2="500" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="700" y1="0" x2="700" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
    <line x1="1100" y1="0" x2="1100" y2="630"/>
    <line x1="0" y1="157" x2="1200" y2="157"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="473" x2="1200" y2="473"/>
  </g>

  <!-- Section numeral 01, Rule Gray at poster scale: legible, not a ghost. -->
  <text x="1100" y="500" text-anchor="end" font-family="Barlow Condensed, Inter, Impact, sans-serif" font-weight="900" font-size="360" letter-spacing="-0.02em" fill="#888888">01</text>

  <!-- Wordmark -->
  <text x="100" y="240" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="900" font-size="120" letter-spacing="-0.04em" fill="#121212">Phlix</text>

  <!-- The single Basel Red rule, anchoring the wordmark -->
  <rect x="100" y="266" width="300" height="8" fill="#E8001C"/>

  <!-- Tagline -->
  <text x="100" y="346" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="800" font-size="40" letter-spacing="-0.02em" fill="#121212">Grid. Type. Truth.</text>

  <!-- Descriptor -->
  <text x="100" y="400" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="500" font-size="22" letter-spacing="0.01em" fill="#5E5E5E">Self-hostable PHP media server</text>

  <!-- Bottom bar: technical readout, mono -->
  <rect x="0" y="570" width="1200" height="60" fill="#121212"/>
  <text x="100" y="607" font-family="JetBrains Mono, Courier New, Courier, monospace" font-weight="500" font-size="18" letter-spacing="0.08em" fill="#F8F8F4">PHP 8.3+ · WORKERMAN 5.X · SERVER + HUB MPL-2.0 · CLIENTS MIT</text>
</svg>
