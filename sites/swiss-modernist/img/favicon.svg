<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <title>Phlix favicon</title>
  <!-- logo_rules.colors permits only Ink Black on Grid White or Grid White on
       Ink Black; do_dont.branding.dont forbids the logo on a colored ground.
       The predecessor set the wordmark letter on solid Basel Red. -->
