  <text x="16" y="24" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="900" font-size="18" text-anchor="middle" letter-spacing="-0.04em" fill="#F8F8F4">P</text>
</svg>
