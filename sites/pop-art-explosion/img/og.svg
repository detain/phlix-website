<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Phlix — WHAM! Your media, amplified.">
  <!-- Editable source for og.png (rasterise with tools/gen-og.mjs).
       Pop Art Explosion: full-bleed Kapow Red ground, Ben-Day dot field, one
       Zap Yellow starburst, thick black ink outlines, zero gradients.
       All copy is traceable: headline = copy_overlay.hero.headline;
       descriptor = content.json hero.eyebrow; bottom line =
       copy_overlay.footer_tagline. -->
  <defs>
    <style>
      .bangers { font-family: 'Bangers', Impact, 'Arial Black', sans-serif; }
      .barlow { font-family: 'Barlow', Arial, sans-serif; font-weight: 700; }
    </style>
    <pattern id="og-dots" x="0" y="0" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="9" cy="9" r="4.6" fill="#FFFFFF" fill-opacity="0.26"/>
    </pattern>
    <pattern id="og-ink-dots" x="0" y="0" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="7" cy="7" r="3.4" fill="#0A0A0A" fill-opacity="0.16"/>
    </pattern>
  </defs>

  <!-- ground -->
  <rect width="1200" height="630" fill="#FF1A1A"/>
  <rect width="1200" height="630" fill="url(#og-dots)"/>

  <!-- top yellow band + gutter -->
  <rect x="0" y="0" width="1200" height="72" fill="#FFE600"/>
  <rect x="0" y="0" width="1200" height="72" fill="url(#og-ink-dots)"/>
  <rect x="0" y="68" width="1200" height="8" fill="#0A0A0A"/>

  <!-- wordmark plate, per logo_rules -->
  <rect x="76" y="128" width="356" height="112" fill="#0A0A0A"/>
  <rect x="68" y="120" width="356" height="112" fill="#FF1A1A"/>
  <rect x="68" y="120" width="356" height="112" fill="none" stroke="#0A0A0A" stroke-width="6"/>
  <text x="246" y="208" text-anchor="middle" class="bangers" font-size="86" fill="#FFFFFF" letter-spacing="6">PHLIX</text>

  <!-- descriptor: content.json hero.eyebrow -->
  <text x="452" y="200" class="barlow" font-size="30" fill="#0A0A0A" letter-spacing="4">SELF-HOSTED MEDIA SERVER</text>

  <!-- headline: copy_overlay.hero.headline -->
  <text x="68" y="356" class="bangers" font-size="108" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="5" paint-order="stroke" letter-spacing="4">WHAM! YOUR MEDIA,</text>
  <text x="68" y="462" class="bangers" font-size="108" fill="#FFE600" stroke="#0A0A0A" stroke-width="5" paint-order="stroke" letter-spacing="4">AMPLIFIED.</text>

  <!-- Zap Yellow starburst, bottom-right -->
  <g transform="translate(1010 452)">
    <polygon points="0,-118 24,-72 74,-92 62,-40 116,-30 74,4 108,48 54,48 40,102 0,66 -40,102 -54,48 -108,48 -74,4 -116,-30 -62,-40 -74,-92 -24,-72" fill="#FFE600" stroke="#0A0A0A" stroke-width="6"/>
    <text x="0" y="8" text-anchor="middle" class="bangers" font-size="52" fill="#0A0A0A">POW!</text>
  </g>

  <!-- bottom gutter + footer tagline -->
  <rect x="0" y="554" width="1200" height="8" fill="#0A0A0A"/>
  <rect x="0" y="562" width="1200" height="68" fill="#FFE600"/>
  <rect x="0" y="562" width="1200" height="68" fill="url(#og-ink-dots)"/>
  <text x="68" y="608" class="bangers" font-size="40" fill="#0A0A0A" letter-spacing="3">YOUR LIBRARY. FOUR-COLOR GLORY.</text>
</svg>
