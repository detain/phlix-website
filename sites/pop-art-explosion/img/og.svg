<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <style>
      .bangers { font-family: 'Bangers', Impact, 'Arial Black', sans-serif; }
      .barlow { font-family: 'Barlow', Arial, sans-serif; font-weight: 700; }
    </style>
    <pattern id="ogbendot" x="0" y="0" width="10" height="10" patternUnits="userSpaceOnUse">
      <circle cx="5" cy="5" r="3" fill="#FFE600" fill-opacity="0.25"/>
    </pattern>
    <pattern id="bendot2" x="0" y="0" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="2" fill="#0A0A0A" fill-opacity="0.1"/>
    </pattern>
  </defs>

  <!-- Background: primary red -->
  <rect width="1200" height="630" fill="#FF1A1A"/>
  <!-- Ben-Day dots -->
  <rect width="1200" height="630" fill="url(#ogbendot)"/>
  <!-- Diagonal accent stripe -->
  <rect width="1200" height="60" y="0" fill="#FFE600"/>
  <rect width="1200" height="60" y="0" fill="url(#bendot2)"/>

  <!-- Corner starburst decorations -->
  <!-- Top-left KAPOW burst -->
  <polygon points="40,0 55,20 80,10 70,40 95,55 65,65 55,95 40,70 10,80 20,55" fill="#FFE600" stroke="#0A0A0A" stroke-width="3"/>
  <!-- Top-right POW burst -->
  <polygon points="1160,0 1175,20 1200,10 1190,40 1200,55 1170,65 1160,95 1145,70 1115,80 1125,55" fill="#FFE600" stroke="#0A0A0A" stroke-width="3"/>
  <!-- Bottom decorative band -->
  <rect x="0" y="570" width="1200" height="60" fill="#FFE600"/>
  <rect x="0" y="570" width="1200" height="60" fill="url(#bendot2)"/>

  <!-- Main content area: white card -->
  <rect x="80" y="120" width="1040" height="390" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="4"/>
  <rect x="84" y="124" width="1040" height="390" fill="#FF1A1A"/>
  <rect x="84" y="124" width="1040" height="390" fill="url(#ogbendot)"/>
  <rect x="80" y="120" width="1040" height="390" fill="none" stroke="#0A0A0A" stroke-width="4"/>

  <!-- PHLIX big wordmark -->
  <text x="600" y="270" text-anchor="middle" class="bangers" font-size="140" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="4" letter-spacing="0.05em">PHLIX</text>

  <!-- Tagline -->
  <text x="600" y="360" text-anchor="middle" class="bangers" font-size="72" fill="#FFE600" stroke="#0A0A0A" stroke-width="3" letter-spacing="0.03em">WHAM! Your media,</text>
  <text x="600" y="430" text-anchor="middle" class="bangers" font-size="72" fill="#FFE600" stroke="#0A0A0A" stroke-width="3" letter-spacing="0.03em">AMPLIFIED.</text>

  <!-- Tagline below card -->
  <text x="600" y="570" text-anchor="middle" class="barlow" font-size="28" fill="#0A0A0A" letter-spacing="0.1em">Self-hosted PHP media server — no lock-in, no subscription.</text>

  <!-- Bottom tagline in yellow band -->
  <text x="600" y="610" text-anchor="middle" class="bangers" font-size="28" fill="#0A0A0A" letter-spacing="0.08em">Phlix — Stream what you own, anywhere.</text>
</svg>
