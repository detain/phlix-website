<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 52" width="160" height="52">
  <defs>
    <style>
      .wordmark { font-family: 'Bangers', Impact, 'Arial Black', sans-serif; font-size: 38px; letter-spacing: 0.05em; }
    </style>
    <pattern id="bendot" x="0" y="0" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="1.8" fill="#FFE600" fill-opacity="0.3"/>
    </pattern>
  </defs>
  <!-- Offset shadow -->
  <rect x="4" y="4" width="152" height="44" fill="#0A0A0A"/>
  <!-- Red main block -->
  <rect x="0" y="0" width="152" height="44" fill="#FF1A1A"/>
  <!-- Ben-Day dots overlay -->
  <rect x="0" y="0" width="152" height="44" fill="url(#bendot)"/>
  <!-- 3px border -->
  <rect x="0" y="0" width="152" height="44" fill="none" stroke="#0A0A0A" stroke-width="3"/>
  <!-- White PHLIX wordmark -->
  <text x="76" y="33" text-anchor="middle" class="wordmark" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="1.5">PHLIX</text>
</svg>
