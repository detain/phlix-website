<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 10" width="40" height="10">
  <!-- seasonal_variants[1] "Factory Winter" motif: "silver foil accent stripe
       at page top". The Factory's aluminium foil, struck flat as alternating
       chevrons — no gradient, because this kit forbids them. -->
  <rect width="40" height="10" fill="#FAFAFA"/>
  <g fill="#0A0A0A" fill-opacity="0.28">
    <polygon points="0,0 8,0 4,10 -4,10"/>
    <polygon points="16,0 24,0 20,10 12,10"/>
    <polygon points="32,0 40,0 36,10 28,10"/>
  </g>
  <g fill="#0028DC" fill-opacity="0.18">
    <polygon points="8,0 16,0 12,10 4,10"/>
    <polygon points="24,0 32,0 28,10 20,10"/>
  </g>
</svg>
