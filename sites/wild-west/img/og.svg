<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2C1810"/>
      <stop offset="100%" style="stop-color:#1a0f09"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" style="stop-color:#8B4513;stop-opacity:0.4"/>
      <stop offset="100%" style="stop-color:#2C1810;stop-opacity:0"/>
    </radialGradient>
    <pattern id="grain" width="200" height="200" patternUnits="userSpaceOnUse">
      <rect width="200" height="200" fill="#2C1810"/>
      <circle cx="50" cy="50" r="1" fill="#8B4513" opacity="0.1"/>
      <circle cx="150" cy="100" r="1" fill="#D4A574" opacity="0.1"/>
      <circle cx="100" cy="150" r="1" fill="#8B4513" opacity="0.1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect width="1200" height="630" fill="url(#grain)"/>

  <!-- Decorative border -->
  <rect x="40" y="40" width="1120" height="550" rx="16" fill="none" stroke="#8B4513" stroke-width="3" stroke-dasharray="12,8"/>

  <!-- Wanted star - large left side -->
  <polygon transform="translate(180, 315) scale(4)" points="0,-1 0.22,-0.31 0.95,-0.31 0.36,0.12 0.59,0.81 0,0.38 -0.59,0.81 -0.36,0.12 -0.95,-0.31 -0.22,-0.31"
           fill="#D4A574" stroke="#8B4513" stroke-width="0.5"/>

  <!-- Text content -->
  <text x="420" y="280" font-family="Georgia, serif" font-size="72" font-weight="bold" fill="#F5DEB3">Phlix</text>

  <text x="420" y="350" font-family="Arial, sans-serif" font-size="28" fill="#C19A6B">Your media. Your library. Your Phlix.</text>

  <text x="420" y="420" font-family="Arial, sans-serif" font-size="22" fill="#8B4513">Self-hosted media server</text>

  <!-- Bottom tagline -->
  <text x="600" y="560" font-family="Georgia, serif" font-size="24" font-style="italic" fill="#D4A574" text-anchor="middle">Open-source media, on your terms.</text>
</svg>
