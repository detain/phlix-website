<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" width="200" height="60">
  <defs>
    <linearGradient id="wood" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8B4513"/>
      <stop offset="50%" style="stop-color:#5D2E0C"/>
      <stop offset="100%" style="stop-color:#3D1F08"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.7" numOctaves="3" result="noise"/>
      <feColorMatrix type="saturate" values="0"/>
      <feBlend in="SourceGraphic" mode="multiply" result="blend"/>
      <feComposite in="blend" in2="SourceGraphic" operator="in"/>
    </filter>
  </defs>

  <!-- Background plank -->
  <rect x="0" y="0" width="200" height="60" rx="6" fill="url(#wood)"/>

  <!-- Wood grain lines -->
  <g stroke="#2C1810" stroke-width="0.5" opacity="0.3">
    <line x1="0" y1="15" x2="200" y2="17"/>
    <line x1="0" y1="30" x2="200" y2="28"/>
    <line x1="0" y1="45" x2="200" y2="46"/>
  </g>

  <!-- Wanted star badge -->
  <polygon points="30,30 33,24 39,24 34,20 36,14 30,17 24,14 26,20 21,24 27,24"
           fill="#D4A574" stroke="#2C1810" stroke-width="1.5"/>

  <!-- P letter -->
  <text x="50" y="42" font-family="Georgia, serif" font-size="36" font-weight="bold" fill="#F5DEB3">P</text>

  <!-- hlix text -->
  <text x="85" y="42" font-family="Georgia, serif" font-size="28" font-weight="bold" fill="#D4A574">hlix</text>

  <!-- Decorative underline -->
  <rect x="50" y="48" width="100" height="3" rx="1.5" fill="#8B4513"/>
</svg>
