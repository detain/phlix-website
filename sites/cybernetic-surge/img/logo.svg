<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 48" fill="none">
  <!-- Circuit background pattern -->
  <rect x="0" y="20" width="160" height="8" fill="#03045E"/>
  <rect x="0" y="20" width="160" height="1" fill="#00FF9F" opacity="0.4"/>
  <rect x="0" y="27" width="160" height="1" fill="#00FF9F" opacity="0.2"/>
  <!-- Circuit traces -->
  <rect x="8" y="16" width="2" height="16" fill="#00FF9F"/>
  <rect x="8" y="22" width="20" height="2" fill="#00FF9F"/>
  <circle cx="8" cy="16" r="3" fill="#03045E" stroke="#00FF9F" stroke-width="1.5"/>
  <circle cx="8" cy="16" r="1" fill="#00FF9F"/>
  <rect x="24" y="10" width="2" height="28" fill="#00B4D8"/>
  <rect x="24" y="22" width="16" height="2" fill="#00B4D8"/>
  <circle cx="24" cy="10" r="3" fill="#03045E" stroke="#00B4D8" stroke-width="1.5"/>
  <circle cx="24" cy="10" r="1" fill="#00B4D8"/>
  <!-- Main text: Phlix -->
  <text x="40" y="34" font-family="Orbitron, sans-serif" font-weight="700" font-size="24" letter-spacing="0.08em" fill="#E8F4F8">Phlix</text>
  <!-- Teal accent underline -->
  <rect x="40" y="38" width="80" height="2" rx="1" fill="#00FF9F" opacity="0.6"/>
  <!-- Glow dot -->
  <circle cx="152" cy="12" r="5" fill="#03045E" stroke="#00FF9F" stroke-width="1.5"/>
  <circle cx="152" cy="12" r="2" fill="#00FF9F">
    <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
  </circle>
</svg>
