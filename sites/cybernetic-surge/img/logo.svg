<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" fill="none">
  <defs>
    <linearGradient id="chrome-surge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C8D8E8"/>
      <stop offset="50%" stop-color="#00B4D8"/>
      <stop offset="100%" stop-color="#00FF9F"/>
    </linearGradient>
    <linearGradient id="text-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E8F4F8"/>
      <stop offset="100%" stop-color="#00FF9F"/>
    </linearGradient>
  </defs>

  <!-- Hexagonal circuit trace border accent -->
  <path d="M12 30 L18 18 L30 12 L42 18 L48 30 L42 42 L30 48 L18 42 Z"
        stroke="url(#chrome-surge)"
        stroke-width="1.5"
        fill="none"
        opacity="0.6"/>

  <!-- Circuit nodes -->
  <circle cx="30" cy="30" r="3" fill="#00FF9F" opacity="0.8"/>
  <circle cx="30" cy="12" r="2" fill="#00FF9F" opacity="0.5"/>
  <circle cx="30" cy="48" r="2" fill="#00FF9F" opacity="0.5"/>
  <circle cx="12" cy="30" r="2" fill="#00FF9F" opacity="0.5"/>
  <circle cx="48" cy="30" r="2" fill="#00FF9F" opacity="0.5"/>

  <!-- Circuit traces from hexagon -->
  <line x1="30" y1="12" x2="30" y2="6" stroke="#00FF9F" stroke-width="1" opacity="0.4"/>
  <line x1="30" y1="48" x2="30" y2="54" stroke="#00FF9F" stroke-width="1" opacity="0.4"/>
  <line x1="12" y1="30" x2="6" y2="30" stroke="#00FF9F" stroke-width="1" opacity="0.4"/>
  <line x1="48" y1="30" x2="54" y2="30" stroke="#00FF9F" stroke-width="1" opacity="0.4"/>

  <!-- Phlix text -->
  <text x="68" y="42"
        font-family="Orbitron, Rajdhani, sans-serif"
        font-size="32"
        font-weight="700"
        fill="url(#text-gradient)"
        letter-spacing="0.1em">
    PHLIX
  </text>

  <!-- Subtle underline accent -->
  <line x1="68" y1="50" x2="190" y2="50" stroke="url(#chrome-surge)" stroke-width="2" opacity="0.6"/>
</svg>
