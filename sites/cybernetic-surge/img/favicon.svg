<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="circuit-flush" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF9F"/>
      <stop offset="100%" stop-color="#00B4D8"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="32" height="32" rx="4" fill="#03045E"/>

  <!-- Hexagonal circuit node -->
  <path d="M16 6 L22 10 L22 18 L16 22 L10 18 L10 10 Z"
