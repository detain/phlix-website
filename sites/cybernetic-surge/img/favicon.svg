  <!-- Circuit traces -->
  <line x1="16" y1="6" x2="16" y2="3" stroke="#00FF9F" stroke-width="1" opacity="0.5"/>
  <line x1="22" y1="10" x2="26" y2="8" stroke="#00FF9F" stroke-width="1" opacity="0.5"/>
  <line x1="22" y1="18" x2="26" y2="20" stroke="#00FF9F" stroke-width="1" opacity="0.5"/>
  <line x1="16" y1="22" x2="16" y2="29" stroke="#00FF9F" stroke-width="1" opacity="0.5"/>
  <line x1="10" y1="18" x2="6" y2="20" stroke="#00FF9F" stroke-width="1" opacity="0.5"/>
  <line x1="10" y1="10" x2="6" y2="8" stroke="#00FF9F" stroke-width="1" opacity="0.5"/>
</svg>
