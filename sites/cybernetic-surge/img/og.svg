<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#03045E"/>
      <stop offset="100%" stop-color="#010A31"/>
    </linearGradient>
    <linearGradient id="circuit-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00FF9F" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00FF9F" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#00FF9F" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E8F4F8"/>
      <stop offset="100%" stop-color="#00FF9F"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00FF9F" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#00FF9F" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg-grad)"/>

  <!-- Circuit grid pattern -->
  <g opacity="0.05">
    <line x1="0" y1="100" x2="1200" y2="100" stroke="#00FF9F" stroke-width="1"/>
    <line x1="0" y1="200" x2="1200" y2="200" stroke="#00FF9F" stroke-width="1"/>
    <line x1="0" y1="300" x2="1200" y2="300" stroke="#00FF9F" stroke-width="1"/>
    <line x1="0" y1="400" x2="1200" y2="400" stroke="#00FF9F" stroke-width="1"/>
    <line x1="0" y1="500" x2="1200" y2="500" stroke="#00FF9F" stroke-width="1"/>
    <line x1="200" y1="0" x2="200" y2="630" stroke="#00FF9F" stroke-width="1"/>
    <line x1="400" y1="0" x2="400" y2="630" stroke="#00FF9F" stroke-width="1"/>
    <line x1="600" y1="0" x2="600" y2="630" stroke="#00FF9F" stroke-width="1"/>
    <line x1="800" y1="0" x2="800" y2="630" stroke="#00FF9F" stroke-width="1"/>
    <line x1="1000" y1="0" x2="1000" y2="630" stroke="#00FF9F" stroke-width="1"/>
  </g>

  <!-- Central glow -->
  <ellipse cx="600" cy="315" rx="400" ry="250" fill="url(#glow)"/>

  <!-- Horizontal circuit line -->
  <rect x="0" y="310" width="1200" height="2" fill="url(#circuit-grad)"/>

  <!-- Phlix logo/wordmark -->
  <text x="600" y="280"
        font-family="Orbitron, Arial, sans-serif"
        font-size="120"
        font-weight="700"
        fill="url(#text-grad)"
        text-anchor="middle"
        letter-spacing="0.15em">
    PHLIX
  </text>

  <!-- Tagline -->
  <text x="600" y="380"
        font-family="Arial, sans-serif"
        font-size="32"
        fill="#C8D8E8"
        text-anchor="middle"
        letter-spacing="0.05em">
    Upgrade Your Stream.
  </text>

  <!-- Circuit node accents -->
  <circle cx="200" cy="310" r="8" fill="#00FF9F" opacity="0.8"/>
  <circle cx="1000" cy="310" r="8" fill="#00FF9F" opacity="0.8"/>

  <!-- Circuit traces from nodes -->
  <line x1="200" y1="310" x2="100" y2="310" stroke="#00FF9F" stroke-width="1" opacity="0.5"/>
  <line x1="200" y1="310" x2="200" y2="200" stroke="#00FF9F" stroke-width="1" opacity="0.5"/>
  <line x1="1000" y1="310" x2="1100" y2="310" stroke="#00FF9F" stroke-width="1" opacity="0.5"/>
  <line x1="1000" y1="310" x2="1000" y2="200" stroke="#00FF9F" stroke-width="1" opacity="0.5"/>

  <!-- Bottom accent bar -->
  <rect x="0" y="620" width="1200" height="10" fill="#00FF9F" opacity="0.3"/>
  <rect x="0" y="620" width="400" height="10" fill="#00FF9F" opacity="0.6"/>
</svg>
