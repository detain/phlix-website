<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" fill="none">
  <defs>
    <linearGradient id="phlix-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00B4D8" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#00B4D8" stop-opacity="1"/>
      <stop offset="100%" stop-color="#00B4D8" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Stealth fighter silhouette / wing shape -->
  <g filter="url(#glow)">
    <!-- Main P letter with tactical styling -->
    <path d="M20 10 L20 50 L32 50 L32 38 L28 38 L28 34 L32 34 L32 22 L28 22 L28 18 L32 18 L32 10 Z"
          fill="none" stroke="url(#phlix-glow)" stroke-width="2" stroke-linejoin="bevel"/>

    <!-- Horizontal targeting line through P -->
    <line x1="34" y1="30" x2="45" y2="30" stroke="#00B4D8" stroke-width="1" opacity="0.6"/>

    <!-- "HLIX" text in monospace style -->
    <text x="50" y="42"
          font-family="monospace"
          font-size="24"
          font-weight="700"
          letter-spacing="4"
          fill="#E0E1DD"
          text-anchor="start">
      HLIX
    </text>

    <!-- Targeting reticle on H -->
    <circle cx="58" cy="25" r="8" fill="none" stroke="#00B4D8" stroke-width="0.5" opacity="0.4"/>
    <line x1="58" y1="15" x2="58" y2="20" stroke="#00B4D8" stroke-width="0.5" opacity="0.4"/>
    <line x1="58" y1="30" x2="58" y2="35" stroke="#00B4D8" stroke-width="0.5" opacity="0.4"/>
    <line x1="48" y1="25" x2="53" y2="25" stroke="#00B4D8" stroke-width="0.5" opacity="0.4"/>
    <line x1="63" y1="25" x2="68" y2="25" stroke="#00B4D8" stroke-width="0.5" opacity="0.4"/>
  </g>

  <!-- Corner accent marks (HUD style) -->
  <path d="M5 15 L5 5 L15 5" fill="none" stroke="#00B4D8" stroke-width="1" opacity="0.5"/>
  <path d="M185 55 L195 55 L195 45" fill="none" stroke="#00B4D8" stroke-width="1" opacity="0.5"/>

  <!-- Bottom accent line -->
  <line x1="50" y1="55" x2="195" y2="55" stroke="#415A77" stroke-width="1" opacity="0.3"/>
</svg>
