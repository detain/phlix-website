<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0A0A"/>
      <stop offset="50%" stop-color="#1B2631"/>
      <stop offset="100%" stop-color="#0A0A0A"/>
    </linearGradient>
    <linearGradient id="line-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00B4D8" stop-opacity="0"/>
      <stop offset="30%" stop-color="#00B4D8" stop-opacity="1"/>
      <stop offset="70%" stop-color="#00B4D8" stop-opacity="1"/>
      <stop offset="100%" stop-color="#00B4D8" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg-grad)"/>

  <!-- Grid overlay -->
  <g opacity="0.05">
    <line x1="0" y1="0" x2="1200" y2="630" stroke="#00B4D8" stroke-width="1"/>
    <line x1="0" y1="63" x2="1200" y2="63" stroke="#00B4D8" stroke-width="0.5"/>
    <line x1="0" y1="126" x2="1200" y2="126" stroke="#00B4D8" stroke-width="0.5"/>
    <line x1="0" y1="189" x2="1200" y2="189" stroke="#00B4D8" stroke-width="0.5"/>
    <line x1="0" y1="252" x2="1200" y2="252" stroke="#00B4D8" stroke-width="0.5"/>
    <line x1="0" y1="315" x2="1200" y2="315" stroke="#00B4D8" stroke-width="0.5"/>
    <line x1="0" y1="378" x2="1200" y2="378" stroke="#00B4D8" stroke-width="0.5"/>
    <line x1="0" y1="441" x2="1200" y2="441" stroke="#00B4D8" stroke-width="0.5"/>
    <line x1="0" y1="504" x2="1200" y2="504" stroke="#00B4D8" stroke-width="0.5"/>
    <line x1="0" y1="567" x2="1200" y2="567" stroke="#00B4D8" stroke-width="0.5"/>
  </g>

  <!-- Horizontal accent lines -->
  <line x1="100" y1="400" x2="1100" y2="400" stroke="url(#line-grad)" stroke-width="1" opacity="0.3"/>
  <line x1="100" y1="550" x2="1100" y2="550" stroke="url(#line-grad)" stroke-width="1" opacity="0.2"/>

  <!-- Corner HUD elements -->
  <path d="M30 80 L30 30 L80 30" fill="none" stroke="#00B4D8" stroke-width="2" opacity="0.4"/>
  <path d="M1170 80 L1170 30 L1120 30" fill="none" stroke="#00B4D8" stroke-width="2" opacity="0.4"/>
  <path d="M30 550 L30 600 L80 600" fill="none" stroke="#00B4D8" stroke-width="2" opacity="0.4"/>
  <path d="M1170 550 L1170 600 L1120 600" fill="none" stroke="#00B4D8" stroke-width="2" opacity="0.4"/>

  <!-- Logo mark -->
  <g transform="translate(120, 200)" filter="url(#glow)">
    <!-- P letter with tactical styling -->
    <path d="M0 0 L0 150 L50 150 L50 90 L40 90 L40 80 L50 80 L50 0 Z"
          fill="none" stroke="#00B4D8" stroke-width="6" stroke-linejoin="bevel"/>
    <!-- Targeting line -->
    <line x1="60" y1="75" x2="100" y2="75" stroke="#00B4D8" stroke-width="2" opacity="0.5"/>
  </g>

  <!-- "PHLIX" text -->
  <text x="280" y="290"
        font-family="monospace"
        font-size="100"
        font-weight="700"
        letter-spacing="12"
        fill="#E0E1DD">
    PHLIX
  </text>

  <!-- Tagline -->
  <text x="280" y="360"
        font-family="monospace"
        font-size="28"
        font-weight="400"
        letter-spacing="4"
        fill="#00B4D8"
        opacity="0.9">
    YOUR MEDIA. YOUR LIBRARY.
  </text>

  <!-- Targeting reticle decoration -->
  <g transform="translate(1050, 150)" opacity="0.3">
    <circle cx="0" cy="0" r="60" fill="none" stroke="#00B4D8" stroke-width="1"/>
    <circle cx="0" cy="0" r="80" fill="none" stroke="#00B4D8" stroke-width="0.5"/>
    <line x1="-100" y1="0" x2="-70" y2="0" stroke="#00B4D8" stroke-width="1"/>
    <line x1="70" y1="0" x2="100" y2="0" stroke="#00B4D8" stroke-width="1"/>
    <line x1="0" y1="-100" x2="0" y2="-70" stroke="#00B4D8" stroke-width="1"/>
    <line x1="0" y1="70" x2="0" y2="100" stroke="#00B4D8" stroke-width="1"/>
  </g>

  <!-- Bottom text -->
  <text x="600" y="520"
        font-family="monospace"
        font-size="18"
        font-weight="400"
        letter-spacing="6"
        fill="#415A77"
        text-anchor="middle">
    SELF-HOSTED MEDIA SERVER
  </text>
</svg>
