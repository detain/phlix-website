<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="favicon-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00B4D8"/>
      <stop offset="100%" stop-color="#0090b0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="32" height="32" fill="#0A0A0A"/>

  <!-- P letter stylized -->
  <g filter="url(#glow)">
    <path d="M6 6 L6 26 L11 26 L11 19 L10 19 L10 17 L11 17 L11 13 L10 13 L10 11 L11 11 L11 6 Z"
          fill="none" stroke="url(#favicon-glow)" stroke-width="1.5" stroke-linejoin="bevel"/>

    <!-- Targeting dot -->
    <circle cx="19" cy="16" r="4" fill="none" stroke="#00B4D8" stroke-width="0.5" opacity="0.5"/>
    <circle cx="19" cy="16" r="1" fill="#00B4D8"/>
  </g>

  <!-- Corner marks -->
  <path d="M2 8 L2 2 L8 2" fill="none" stroke="#00B4D8" stroke-width="0.5" opacity="0.4"/>
  <path d="M24 30 L30 30 L30 24" fill="none" stroke="#00B4D8" stroke-width="0.5" opacity="0.4"/>
</svg>
