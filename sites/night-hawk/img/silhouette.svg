<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" fill="none">
  <!-- Aircraft Body / Fuselage -->
  <path d="M20 80 L60 80 L90 50 L120 35 L200 25 L280 35 L310 50 L340 80 L380 80 L360 90 L320 90 L280 70 L240 60 L200 55 L160 60 L120 70 L80 90 L40 90 Z" fill="currentColor" opacity="0.9"/>
  
  <!-- Cockpit Canopy -->
  <path d="M175 28 L200 20 L225 28 L215 45 L185 45 Z" fill="var(--nh-primary)" opacity="0.8"/>
  
  <!-- Engine Intake Left -->
  <path d="M80 55 L95 55 L100 75 L75 75 Z" fill="currentColor" opacity="0.7"/>
  
  <!-- Engine Intake Right -->
  <path d="M320 55 L305 55 L300 75 L325 75 Z" fill="currentColor" opacity="0.7"/>
  
  <!-- Wing Details Left -->
  <path d="M95 60 L70 85 L85 88 L110 65 Z" fill="currentColor" opacity="0.6"/>
  
  <!-- Wing Details Right -->
  <path d="M305 60 L330 85 L315 88 L290 65 Z" fill="currentColor" opacity="0.6"/>
  
  <!-- Tail Fin -->
  <path d="M370 65 L385 45 L390 70 L375 80 Z" fill="currentColor" opacity="0.8"/>
  
  <!-- Vertical Stabilizer -->
  <path d="M350 30 L360 20 L365 35 L355 45 Z" fill="currentColor" opacity="0.7"/>
  
  <!-- Afterburner Left -->
  <g class="afterburner-left">
    <ellipse cx="50" cy="82" rx="12" ry="6" fill="var(--nh-primary)" opacity="0.6"/>
    <ellipse cx="50" cy="82" rx="20" ry="4" fill="var(--nh-primary)" opacity="0.3"/>
    <ellipse cx="50" cy="82" rx="28" ry="2" fill="var(--nh-nv-green)" opacity="0.2"/>
  </g>
  
  <!-- Afterburner Right -->
  <g class="afterburner-right">
    <ellipse cx="350" cy="82" rx="12" ry="6" fill="var(--nh-primary)" opacity="0.6"/>
    <ellipse cx="350" cy="82" rx="20" ry="4" fill="var(--nh-primary)" opacity="0.3"/>
    <ellipse cx="350" cy="82" rx="28" ry="2" fill="var(--nh-nv-green)" opacity="0.2"/>
  </g>
  
  <!-- Targeting Reticle -->
  <g class="targeting-reticle" transform="translate(200, 55)">
    <circle r="30" fill="none" stroke="var(--nh-primary)" stroke-width="0.5" stroke-dasharray="4,4" opacity="0.6"/>
    <circle r="45" fill="none" stroke="var(--nh-primary)" stroke-width="0.5" opacity="0.3"/>
    <!-- Crosshairs -->
    <line x1="0" y1="-55" x2="0" y2="-35" stroke="var(--nh-primary)" stroke-width="0.5" opacity="0.8"/>
    <line x1="0" y1="35" x2="0" y2="55" stroke="var(--nh-primary)" stroke-width="0.5" opacity="0.8"/>
    <line x1="-55" y1="0" x2="-35" y2="0" stroke="var(--nh-primary)" stroke-width="0.5" opacity="0.8"/>
    <line x1="35" y1="0" x2="55" y2="0" stroke="var(--nh-primary)" stroke-width="0.5" opacity="0.8"/>
    <!-- Corner brackets -->
    <path d="M-20 -20 L-10 -10 M20 -20 L10 -10 M-20 20 L-10 10 M20 20 L10 10" stroke="var(--nh-primary)" stroke-width="1" opacity="0.8"/>
  </g>
  
  <!-- Panel Lines -->
  <g stroke="currentColor" stroke-width="0.3" opacity="0.2">
    <line x1="120" y1="35" x2="140" y2="35"/>
    <line x1="200" y1="25" x2="200" y2="55"/>
    <line x1="280" y1="35" x2="260" y2="35"/>
    <line x1="150" y1="50" x2="130" y2="60"/>
    <line x1="250" y1="50" x2="270" y2="60"/>
  </g>
</svg>
