<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 80" fill="none">
  <!-- Tondo frame (oval) -->
  <ellipse cx="40" cy="40" rx="36" ry="36" fill="none" stroke="#C8971A" stroke-width="2"/>
  <ellipse cx="40" cy="40" rx="32" ry="32" fill="none" stroke="#C8971A" stroke-width="1"/>

  <!-- Wordmark inside tondo -->
  <text x="40" y="47" text-anchor="middle"
        font-family="'Cormorant Garamond', Georgia, serif"
        font-size="26" font-weight="600"
        fill="#2B4A8C" letter-spacing="-0.5">Phlix</text>

  <!-- Subtitle in small caps -->
  <text x="40" y="60" text-anchor="middle"
        font-family="'Cormorant SC', Georgia, serif"
        font-size="8" font-weight="600"
        fill="#C8971A" letter-spacing="3"
        text-transform="uppercase">Renaissance Atelier</text>

  <!-- Quill pen accent (right of tondo) -->
  <path d="M95 20 Q100 10 108 14 Q104 22 100 28 Q98 24 95 20Z" fill="#3D1F0A" opacity="0.7"/>
  <line x1="95" y1="20" x2="88" y2="38" stroke="#3D1F0A" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/>
</svg>
