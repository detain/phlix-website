<!--
  Renaissance Atelier logo lockup
  Phlix wordmark in Cormorant Garamond semibold,
  enclosed in a double-rule ochre-gold oval tondo frame.
  Lapis lazuli (#2B4A8C) wordmark on ivory parchment (#F4ECD8) ground.
  Per brand kit logo_rules §16:
    - shape: oval tondo frame, double-rule border
    - complexity: simple and legible at 24px height
    - negative_space: generous — the lockup breathes
    - allowed_symbols: quill pen, lapis stone, tondo oval, candle lantern, open folio
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 100" role="img" aria-label="Phlix logo">
  <title>Phlix</title>
  <desc>Renaissance Atelier brand logo — Phlix wordmark in an ochre-gold oval tondo frame</desc>

  <defs>
    <!-- Ivory parchment background -->
    <radialGradient id="parchmentGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F4ECD8"/>
      <stop offset="100%" stop-color="#EDE1C6"/>
    </radialGradient>
    <!-- Gold shimmer gradient for the tondo border -->
    <linearGradient id="goldShimmer" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C8971A"/>
      <stop offset="40%" stop-color="#F0CC6A"/>
      <stop offset="60%" stop-color="#C8971A"/>
      <stop offset="100%" stop-color="#A07818"/>
    </linearGradient>
    <!-- Candle bloom behind the wordmark -->
    <radialGradient id="candleBloom" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(200,151,26,0.18)"/>
      <stop offset="100%" stop-color="rgba(200,151,26,0)"/>
    </radialGradient>
  </defs>

  <!-- Background parchment ground (optional, for contexts where SVG has no background) -->
  <rect x="0" y="0" width="280" height="100" fill="url(#parchmentGlow)" rx="8"/>

  <!-- Tondo frame — outer ochre-gold ring (double-rule outer) -->
  <ellipse cx="140" cy="50" rx="108" ry="44"
    fill="none"
    stroke="url(#goldShimmer)"
    stroke-width="2.5"/>

  <!-- Tondo frame — inner ochre-gold ring (double-rule inner) -->
  <ellipse cx="140" cy="50" rx="102" ry="38"
    fill="none"
    stroke="url(#goldShimmer)"
    stroke-width="1"/>

  <!-- Tondo inner fill — ivory parchment -->
  <ellipse cx="140" cy="50" rx="100" ry="36" fill="#F4ECD8"/>

  <!-- Candle bloom glow behind wordmark -->
  <ellipse cx="140" cy="50" rx="72" ry="26" fill="url(#candleBloom)"/>

  <!-- Phlix wordmark — Cormorant Garamond style (SVG text approximation)
       Using a serif typeface stack; the actual font is loaded via CSS.
       At small sizes, this fallback reads as a dignified serif. -->
  <text
    x="140"
    y="58"
    text-anchor="middle"
    font-family="'Cormorant Garamond', 'Garamond', 'Times New Roman', serif"
    font-size="40"
    font-weight="600"
    letter-spacing="-0.5"
    fill="#2B4A8C">Phlix</text>

  <!-- Subtle lamp/candle glyph — the single allowed symbol accent (small) -->
  <!-- Candle lantern silhouette at the lower right of the tondo -->
  <g transform="translate(232, 72) scale(0.6)" fill="#C8971A" opacity="0.7">
    <rect x="-6" y="0" width="12" height="18" rx="2"/>
    <rect x="-4" y="-4" width="8" height="6" rx="1"/>
    <ellipse cx="0" cy="-7" rx="3" ry="4" fill="#F0CC6A"/>
  </g>

</svg>
