<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="chiaroscuro" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2C1A0E"/>
      <stop offset="45%" stop-color="#A0522D"/>
      <stop offset="80%" stop-color="#C8971A"/>
    </linearGradient>
    <radialGradient id="candle-bloom" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="rgba(200,151,26,0.5)"/>
      <stop offset="100%" stop-color="rgba(200,151,26,0)"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#chiaroscuro)"/>
  <rect width="1200" height="630" fill="url(#candle-bloom)"/>

  <!-- Decorative double-rule border -->
  <rect x="40" y="40" width="1120" height="550" rx="4" fill="none" stroke="#C8971A" stroke-width="1.5" opacity="0.6"/>
  <rect x="48" y="48" width="1104" height="534" rx="2" fill="none" stroke="#C8971A" stroke-width="1" opacity="0.4"/>

  <!-- Piero silhouette (left) -->
  <circle cx="180" cy="360" r="80" fill="rgba(250,244,228,0.08)"/>
  <circle cx="180" cy="320" r="35" fill="#FAF4E4" opacity="0.12"/>
  <rect x="150" y="350" width="60" height="80" rx="6" fill="#FAF4E4" opacity="0.1"/>
  <!-- Lantern glow -->
  <circle cx="230" cy="310" r="25" fill="#C8971A" opacity="0.25"/>
  <rect x="220" y="295" width="20" height="30" rx="3" fill="#C8971A" opacity="0.4"/>

  <!-- Logo wordmark (centre-right) -->
  <ellipse cx="750" cy="315" rx="100" ry="100" fill="none" stroke="#C8971A" stroke-width="3" opacity="0.8"/>
  <ellipse cx="750" cy="315" rx="90" ry="90" fill="none" stroke="#C8971A" stroke-width="1.5" opacity="0.5"/>
  <text x="750" y="330" text-anchor="middle"
        font-family="'Cormorant Garamond', Georgia, serif"
        font-size="72" font-weight="600" fill="#FAF4E4" letter-spacing="-2">Phlix</text>
  <text x="750" y="360" text-anchor="middle"
        font-family="'Cormorant SC', Georgia, serif"
        font-size="18" font-weight="600" fill="#C8971A" letter-spacing="8">RENAISSANCE ATELIER</text>

  <!-- Headline -->
  <text x="600" y="480" text-anchor="middle"
        font-family="'Cormorant Garamond', Georgia, serif"
        font-size="52" font-weight="600" fill="#FAF4E4" letter-spacing="-1">Your Library. Illuminated.</text>

  <!-- Decorative rule -->
  <line x1="350" y1="505" x2="850" y2="505" stroke="#C8971A" stroke-width="1.5" opacity="0.6"/>

  <!-- Tagline -->
  <text x="600" y="540" text-anchor="middle"
        font-family="'EB Garamond', Georgia, serif"
        font-size="22" fill="rgba(250,244,228,0.75)" font-style="italic">Self-hosted media server — on your terms.</text>

  <!-- Gold corner ornaments -->
  <path d="M55 55 L85 55 L85 57 L57 57 L57 85 L55 85 Z" fill="#C8971A" opacity="0.5"/>
  <path d="M1145 55 L1115 55 L1115 57 L1143 57 L1143 85 L1145 85 Z" fill="#C8971A" opacity="0.5"/>
  <path d="M55 575 L85 575 L85 573 L57 573 L57 545 L55 545 Z" fill="#C8971A" opacity="0.5"/>
  <path d="M1145 575 L1115 575 L1115 573 L1143 573 L1143 545 L1145 545 Z" fill="#C8971A" opacity="0.5"/>
</svg>
