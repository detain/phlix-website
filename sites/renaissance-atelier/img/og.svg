<!--
  Renaissance Atelier OG social share card (1200x630)
  Full-bleed lapis lazuli chiaroscuro gradient background,
  Phlix wordmark + tagline in ivory and ochre gold.
  Per brand kit layout_patterns.landing and new_site.md §11.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Phlix — Your media. Your library. Illuminated.">
  <title>Phlix — Your media. Your library. Illuminated.</title>
  <desc>Open Graph social share card for the Renaissance Atelier Phlix brand site</desc>

  <defs>
    <!-- Chiaroscuro lapis-to-ochre hero gradient -->
    <linearGradient id="heroBg" x1="0%" y1="100%" x2="60%" y2="0%">
      <stop offset="0%" stop-color="#1A2D5A"/>
      <stop offset="45%" stop-color="#2B4A8C"/>
      <stop offset="70%" stop-color="#A0522D"/>
      <stop offset="100%" stop-color="#C8971A"/>
    </linearGradient>

    <!-- Candle bloom radial behind headline -->
    <radialGradient id="candleBloom" cx="50%" cy="50%" r="40%">
      <stop offset="0%" stop-color="rgba(200,151,26,0.35)"/>
      <stop offset="100%" stop-color="rgba(200,151,26,0)"/>
    </radialGradient>

    <!-- Sfumato vignette overlay -->
    <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="rgba(14,10,6,0)"/>
      <stop offset="100%" stop-color="rgba(14,10,6,0.55)"/>
    </radialGradient>

    <!-- Gold shimmer for accent lines -->
    <linearGradient id="goldRule" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="transparent"/>
      <stop offset="20%" stop-color="#C8971A"/>
      <stop offset="50%" stop-color="#F0CC6A"/>
      <stop offset="80%" stop-color="#C8971A"/>
      <stop offset="100%" stop-color="transparent"/>
    </linearGradient>
  </defs>

  <!-- Background — chiaroscuro gradient -->
  <rect width="1200" height="630" fill="url(#heroBg)"/>

  <!-- Vignette overlay -->
  <rect width="1200" height="630" fill="url(#vignette)"/>

  <!-- Candle bloom behind headline -->
  <ellipse cx="600" cy="310" rx="420" ry="200" fill="url(#candleBloom)"/>

  <!-- Decorative gold rule above headline -->
  <line x1="360" y1="190" x2="840" y2="190" stroke="url(#goldRule)" stroke-width="2"/>

  <!-- Eyebrow text -->
  <text
    x="600"
    y="235"
    text-anchor="middle"
    font-family="'Cormorant SC', 'Cormorant Garamond', serif"
    font-size="16"
    font-weight="600"
    letter-spacing="0.15em"
    fill="#F0CC6A"
    opacity="0.9">SELF-HOSTED MEDIA SERVER</text>

  <!-- Main headline -->
  <text
    x="600"
    y="310"
    text-anchor="middle"
    font-family="'Cormorant Garamond', 'Garamond', 'Times New Roman', serif"
    font-size="72"
    font-weight="700"
    letter-spacing="-0.02em"
    fill="#FAF4E4">Your media.</text>

  <text
    x="600"
    y="390"
    text-anchor="middle"
    font-family="'Cormorant Garamond', 'Garamond', 'Times New Roman', serif"
    font-size="72"
    font-weight="700"
    letter-spacing="-0.02em"
    fill="#FAF4E4">Your library.</text>

  <text
    x="600"
    y="465"
    text-anchor="middle"
    font-family="'Cormorant Garamond', 'Garamond', 'Times New Roman', serif"
    font-size="72"
    font-weight="700"
    letter-spacing="-0.02em"
    fill="#C8971A">Illuminated.</text>

  <!-- Decorative gold rule below headline -->
  <line x1="360" y1="490" x2="840" y2="490" stroke="url(#goldRule)" stroke-width="2"/>

  <!-- Tagline -->
  <text
    x="600"
    y="540"
    text-anchor="middle"
    font-family="'EB Garamond', 'Garamond', serif"
    font-size="20"
    font-weight="400"
    letter-spacing="0.02em"
    fill="rgba(250,244,228,0.75)">Open-source. Self-hosted. No lock-in.</text>

  <!-- Tondo oval logo mark at top right — subtle -->
  <g transform="translate(1100, 80)">
    <ellipse cx="0" cy="0" rx="38" ry="16"
      fill="none"
      stroke="#C8971A"
      stroke-width="1.5"/>
    <text
      x="0"
      y="7"
      text-anchor="middle"
      font-family="'Cormorant Garamond', serif"
      font-size="18"
      font-weight="600"
      fill="#C8971A">Phlix</text>
  </g>

</svg>
