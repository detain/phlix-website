<!--
  Renaissance Atelier favicon
  Square mark in lapis lazuli (#2B4A8C) with a subtle ochre-gold tondo frame accent.
  Per brand kit §16 / logo_rules — simple, legible at small sizes.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Phlix favicon">
  <title>Phlix favicon</title>
  <desc>Lapis lazuli square favicon with ochre-gold accent</desc>

  <!-- Background — lapis lazuli -->
  <rect width="32" height="32" rx="6" fill="#2B4A8C"/>

  <!-- Inner parchment/ivory tondo oval accent -->
  <ellipse cx="16" cy="16" rx="11" ry="11"
    fill="none"
    stroke="#C8971A"
    stroke-width="1.2"/>

  <!-- Phlix initial "P" in ochre gold on the lapis ground -->
  <!-- Using a classical serif letterform approximation in SVG -->
  <text
    x="16"
    y="22"
    text-anchor="middle"
    font-family="'Cormorant Garamond', 'Garamond', 'Times New Roman', serif"
    font-size="20"
    font-weight="700"
    fill="#C8971A">P</text>

</svg>
