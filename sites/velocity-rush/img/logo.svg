  <!-- Speed bolt accent -->
  <path d="M20 14 L14 38 L22 38 L18 52 L32 18 L24 18 Z" fill="#00F5FF"/>
  <!-- VELOCITY text -->
  <text x="42" y="38" font-family="Barlow Condensed, Oswald, sans-serif" font-weight="800" font-size="22" fill="#FFFFFF" letter-spacing="-0.5">VELOCITY</text>
  <!-- RUSH text -->
  <text x="135" y="38" font-family="Barlow Condensed, Oswald, sans-serif" font-weight="700" font-size="22" fill="#00F5FF" letter-spacing="-0.5">RUSH</text>
  <!-- Speed lines -->
  <path d="M42 46 L158 46" stroke="#00F5FF" stroke-width="1" opacity="0.3"/>
  <path d="M42 50 L130 50" stroke="#00F5FF" stroke-width="0.5" opacity="0.2"/>
  <!-- Glow effect -->
