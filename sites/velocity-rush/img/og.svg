<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <!-- Dark background -->
  <rect width="1200" height="630" fill="#1C1C1E"/>
  <!-- Speed streaks background -->
  <line x1="0" y1="150" x2="1200" y2="150" stroke="#00F5FF" stroke-width="2" opacity="0.06"/>
  <line x1="0" y1="300" x2="1200" y2="300" stroke="#00F5FF" stroke-width="1" opacity="0.04"/>
  <line x1="0" y1="450" x2="1200" y2="450" stroke="#00F5FF" stroke-width="2" opacity="0.06"/>
  <!-- Angular racing stripe -->
  <path d="M0 0 L1200 0 L1200 8 L0 120 Z" fill="#00F5FF" opacity="0.15"/>
  <!-- Speed bolt large -->
  <path d="M80 100 L50 340 L140 340 L100 540 L220 200 L150 200 Z" fill="#00F5FF" opacity="0.9"/>
  <!-- Phlix text -->
  <text x="280" y="270" font-family="Barlow Condensed, Oswald, sans-serif" font-weight="800" font-size="120" fill="#FFFFFF" letter-spacing="-2">Phlix</text>
  <!-- Tagline -->
  <text x="280" y="340" font-family="Barlow Condensed, Oswald, sans-serif" font-weight="700" font-size="56" fill="#00F5FF" letter-spacing="-1">ZERO TO PLAY. ZERO WAIT.</text>
  <!-- Speed lines -->
  <line x1="280" y1="380" x2="800" y2="380" stroke="#00F5FF" stroke-width="3" opacity="0.4"/>
  <line x1="280" y1="400" x2="650" y2="400" stroke="#00F5FF" stroke-width="1.5" opacity="0.2"/>
  <!-- Bottom racing stripe -->
  <path d="M0 622 L1200 622 L1200 630 L0 560 Z" fill="#FF2D55" opacity="0.2"/>
  <!-- Description -->
  <text x="280" y="450" font-family="Barlow, Inter, sans-serif" font-size="28" fill="#888899">Open-source PHP media server · SyncPlay · Live TV · 5 clients</text>
</svg>
