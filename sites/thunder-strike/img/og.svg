<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#131720"/>
      <stop offset="100%" stop-color="#1A1F2E"/>
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5F27CD"/>
      <stop offset="100%" stop-color="#48DBFB"/>
    </linearGradient>
    <radialGradient id="orbGrad" cx="70%" cy="30%" r="60%">
      <stop offset="0%" stop-color="rgba(72,219,251,0.3)"/>
      <stop offset="50%" stop-color="rgba(95,39,205,0.15)"/>
      <stop offset="100%" stop-color="rgba(19,23,32,0)"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Plasma orb glow -->
  <ellipse cx="900" cy="200" rx="500" ry="400" fill="url(#orbGrad)"/>

  <!-- Arc line decoration top -->
  <path d="M0 3 L1200 3" stroke="#5F27CD" stroke-width="3" opacity="0.6"/>
  <path d="M0 8 L1200 8" stroke="#48DBFB" stroke-width="1" opacity="0.4"/>

  <!-- Lightning bolt T -->
  <g transform="translate(120, 200)">
    <path d="M70 0 L100 100 H90 L70 180 H50 L70 100 H60 L70 0Z" fill="url(#boltGrad)"/>
  </g>
  <!-- H -->
  <text x="230" y="350" font-family="Arial Black, Impact, sans-serif" font-size="110" font-weight="900" fill="#F5F6FA" letter-spacing="2">THUNDER STRIKE</text>

  <!-- Tagline -->
  <text x="120" y="430" font-family="Arial, sans-serif" font-size="28" fill="#8892A0">Open-source media, on your terms.</text>

  <!-- Bottom arc line -->
  <path d="M0 622 L1200 622" stroke="#EE5A24" stroke-width="3" opacity="0.6"/>
  <path d="M0 627 L1200 627" stroke="#48DBFB" stroke-width="1" opacity="0.4"/>

  <!-- Color palette dots -->
  <circle cx="1150" cy="600" r="12" fill="#5F27CD"/>
  <circle cx="1120" cy="600" r="12" fill="#48DBFB"/>
  <circle cx="1090" cy="600" r="12" fill="#EE5A24"/>

  <!-- Phlix text bottom right -->
  <text x="980" y="600" font-family="Arial, sans-serif" font-size="18" fill="#8892A0" text-anchor="end">Phlix</text>
</svg>
