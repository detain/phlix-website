<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Favicon - Clapperboard inspired, gold on dark -->
  <rect width="32" height="32" rx="4" fill="#1C1C1C"/>

  <!-- Clapperboard -->
  <g transform="translate(4, 6)">
    <!-- Board -->
    <rect x="0" y="8" width="24" height="16" rx="1" fill="#2D3436" stroke="#FFD93D" stroke-width="1"/>
    <!-- Clapper -->
    <path d="M0 8 L12 0 L24 8" fill="#1C1C1C" stroke="#FFD93D" stroke-width="1"/>
    <!-- Clapper lines -->
    <line x1="4" y1="4" x2="4" y2="8" stroke="#FFD93D" stroke-width="1"/>
    <line x1="8" y1="2" x2="8" y2="8" stroke="#FFD93D" stroke-width="1"/>
    <line x1="12" y1="4" x2="12" y2="8" stroke="#FFD93D" stroke-width="1"/>
    <line x1="16" y1="2" x2="16" y2="8" stroke="#FFD93D" stroke-width="1"/>
    <line x1="20" y1="4" x2="20" y2="8" stroke="#FFD93D" stroke-width="1"/>
  </g>
</svg>
