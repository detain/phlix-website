<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <!-- Directors Chair OG Image - Film set theme -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1C1C1C"/>
      <stop offset="100%" stop-color="#2D3436"/>
    </linearGradient>
    <radialGradient id="spotlight" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#FFD93D" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Spotlight effect -->
  <ellipse cx="600" cy="200" rx="700" ry="400" fill="url(#spotlight)"/>

  <!-- Clapperboard icon -->
  <g transform="translate(520, 140)">
    <!-- Board -->
    <rect x="0" y="40" width="160" height="110" rx="4" fill="#2D3436" stroke="#FFD93D" stroke-width="3"/>
    <!-- Clapper -->
    <path d="M0 40 L80 0 L160 40" fill="#1C1C1C" stroke="#FFD93D" stroke-width="3"/>
    <!-- Clapper lines -->
    <line x1="20" y1="20" x2="20" y2="40" stroke="#FFD93D" stroke-width="3"/>
    <line x1="40" y1="10" x2="40" y2="40" stroke="#FFD93D" stroke-width="3"/>
    <line x1="60" y1="20" x2="60" y2="40" stroke="#FFD93D" stroke-width="3"/>
    <line x1="80" y1="10" x2="80" y2="40" stroke="#FFD93D" stroke-width="3"/>
    <line x1="100" y1="20" x2="100" y2="40" stroke="#FFD93D" stroke-width="3"/>
    <line x1="120" y1="10" x2="120" y2="40" stroke="#FFD93D" stroke-width="3"/>
    <line x1="140" y1="20" x2="140" y2="40" stroke="#FFD93D" stroke-width="3"/>
    <!-- Reel circles -->
    <circle cx="50" cy="95" r="20" fill="none" stroke="#FFD93D" stroke-width="2"/>
    <circle cx="50" cy="95" r="8" fill="#FFD93D"/>
    <circle cx="110" cy="95" r="20" fill="none" stroke="#FFD93D" stroke-width="2"/>
    <circle cx="110" cy="95" r="8" fill="#FFD93D"/>
  </g>

  <!-- Phlix wordmark -->
  <text x="600" y="370" text-anchor="middle" font-family="Impact, Arial Black, sans-serif" font-size="96" font-weight="900" fill="#FFFFFF" letter-spacing="16" filter="url(#glow)">PHLIX</text>

  <!-- Accent underline -->
  <rect x="300" y="390" width="600" height="6" fill="#FFD93D"/>

  <!-- Tagline -->
  <text x="600" y="450" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#FFFFFF" opacity="0.8" letter-spacing="4">MEDIA SERVER</text>

  <!-- Bottom accent -->
  <text x="600" y="580" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#FFD93D" letter-spacing="2">Your media. Your library. Your Phlix.</text>

  <!-- Decorative corners -->
  <path d="M20 20 L80 20 L20 80" fill="none" stroke="#FFD93D" stroke-width="2" opacity="0.5"/>
  <path d="M1180 20 L1120 20 L1180 80" fill="none" stroke="#FFD93D" stroke-width="2" opacity="0.5"/>
  <path d="M20 610 L80 610 L20 550" fill="none" stroke="#FFD93D" stroke-width="2" opacity="0.5"/>
  <path d="M1180 610 L1120 610 L1180 550" fill="none" stroke="#FFD93D" stroke-width="2" opacity="0.5"/>
</svg>
