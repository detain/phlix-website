<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" fill="none">
  <!-- Phlix Wordmark - Directors Chair Theme -->
  <!-- Film clapperboard-inspired design with gold accent on dark -->

  <!-- Clapperboard icon -->
  <g transform="translate(10, 25)">
    <!-- Board -->
    <rect x="0" y="20" width="60" height="45" rx="2" fill="#2D3436" stroke="#FFD93D" stroke-width="2"/>
    <!-- Clapper -->
    <path d="M0 20 L30 0 L60 20" fill="#1C1C1C" stroke="#FFD93D" stroke-width="2"/>
    <!-- Clapper lines -->
    <line x1="10" y1="10" x2="10" y2="20" stroke="#FFD93D" stroke-width="2"/>
    <line x1="20" y1="5" x2="20" y2="20" stroke="#FFD93D" stroke-width="2"/>
    <line x1="30" y1="10" x2="30" y2="20" stroke="#FFD93D" stroke-width="2"/>
    <line x1="40" y1="5" x2="40" y2="20" stroke="#FFD93D" stroke-width="2"/>
    <line x1="50" y1="10" x2="50" y2="20" stroke="#FFD93D" stroke-width="2"/>
    <!-- Reel circles (film motif) -->
    <circle cx="18" cy="42" r="8" fill="none" stroke="#FFD93D" stroke-width="1.5"/>
    <circle cx="18" cy="42" r="3" fill="#FFD93D"/>
    <circle cx="42" cy="42" r="8" fill="none" stroke="#FFD93D" stroke-width="1.5"/>
    <circle cx="42" cy="42" r="3" fill="#FFD93D"/>
  </g>

  <!-- Phlix text -->
  <text x="90" y="72" font-family="Impact, Arial Black, sans-serif" font-size="56" font-weight="900" fill="#FFFFFF" letter-spacing="8">PHLIX</text>

  <!-- Accent underline -->
  <rect x="90" y="80" width="180" height="4" fill="#FFD93D"/>

  <!-- Tagline -->
  <text x="92" y="105" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#FFFFFF" opacity="0.7" letter-spacing="2">MEDIA SERVER</text>

  <!-- Spotlight effect -->
  <ellipse cx="200" cy="60" rx="150" ry="40" fill="url(#spotlight)" opacity="0.15"/>

  <defs>
    <radialGradient id="spotlight">
      <stop offset="0%" stop-color="#FFD93D"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
  </defs>
</svg>
