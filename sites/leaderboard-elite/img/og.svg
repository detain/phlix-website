<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0A0A1A"/>
      <stop offset="100%" style="stop-color:#12122A"/>
    </linearGradient>
    <radialGradient id="glowGold" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#FFD700;stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="glowBlue" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#1A1AFF;stop-opacity:0.2"/>
      <stop offset="100%" style="stop-color:#1A1AFF;stop-opacity:0"/>
    </radialGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  
  <!-- Decorative glows -->
  <ellipse cx="200" cy="315" rx="400" ry="300" fill="url(#glowBlue)"/>
  <ellipse cx="1000" cy="315" rx="400" ry="300" fill="url(#glowGold)"/>
  
  <!-- Podium shapes at bottom -->
  <g transform="translate(0, 480)">
    <!-- Bronze (left) -->
    <rect x="250" y="50" width="200" height="100" fill="#CD7F32" rx="8"/>
    <!-- Silver (center, taller) -->
    <rect x="500" y="0" width="200" height="150" fill="#C0C0C0" rx="8"/>
    <!-- Gold (right, tallest) -->
    <rect x="750" y="-50" width="200" height="200" fill="#FFD700" rx="8"/>
  </g>
  
  <!-- Trophy icons on podium -->
  <g transform="translate(0, 480)">
    <!-- Bronze trophy -->
    <g transform="translate(310, 55)">
      <path d="M8 4 L32 4 L34 20 C34 28 28 32 24 32 C20 32 14 28 14 20 L16 4 Z" fill="#0A0A1A"/>
      <rect x="19" y="33" width="10" height="4" fill="#0A0A1A"/>
    </g>
    <!-- Silver trophy -->
    <g transform="translate(560, 5)">
      <path d="M8 4 L32 4 L34 20 C34 28 28 32 24 32 C20 32 14 28 14 20 L16 4 Z" fill="#0A0A1A"/>
      <rect x="19" y="33" width="10" height="4" fill="#0A0A1A"/>
    </g>
    <!-- Gold trophy -->
    <g transform="translate(810, -45)">
      <path d="M8 4 L32 4 L34 20 C34 28 28 32 24 32 C20 32 14 28 14 20 L16 4 Z" fill="#0A0A1A"/>
      <rect x="19" y="33" width="10" height="4" fill="#0A0A1A"/>
    </g>
  </g>
  
  <!-- Main text: Your media. Your library. Your Phlix. -->
  <text x="600" y="280" font-family="system-ui, -apple-system, sans-serif" font-size="72" font-weight="700" fill="#FFD700" text-anchor="middle" letter-spacing="3">
    Your media.
  </text>
  <text x="600" y="370" font-family="system-ui, -apple-system, sans-serif" font-size="72" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="3">
    Your library.
  </text>
  <text x="600" y="460" font-family="system-ui, -apple-system, sans-serif" font-size="72" font-weight="700" fill="#FFD700" text-anchor="middle" letter-spacing="3">
    Your Phlix.
  </text>
  
  <!-- Subtitle -->
  <text x="600" y="580" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#B0B0D0" text-anchor="middle" letter-spacing="1">
    Self-hosted media server
  </text>
</svg>
