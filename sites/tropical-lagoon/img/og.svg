<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Phlix social share image">
  <title>Phlix — Your media. Your way.</title>
  <desc>Tropical Lagoon brand kit social share card for Phlix</desc>

  <!-- Background: deep lagoon -->
  <rect width="1200" height="630" fill="#011A20"/>

  <!-- Subtle caustic light overlay -->
  <ellipse cx="600" cy="200" rx="700" ry="300" fill="#00D4B8" opacity="0.07"/>
  <ellipse cx="300" cy="400" rx="400" ry="200" fill="#FF6B35" opacity="0.05"/>

  <!-- Wave form at bottom -->
  <path d="M0 550 Q150 520 300 545 Q450 570 600 545 Q750 520 900 545 Q1050 570 1200 545 L1200 630 L0 630 Z"
        fill="#00D4B8" opacity="0.15"/>

  <!-- Palm frond accents (top corners) -->
  <g opacity="0.2" fill="none" stroke="#00D4B8" stroke-width="1">
    <!-- Left palm -->
    <path d="M0 0 Q60 80 40 160 M0 0 Q80 60 120 100 M0 0 Q70 50 100 80"/>
    <!-- Right palm -->
    <path d="M1200 0 Q1140 80 1160 160 M1200 0 Q1120 60 1080 100 M1200 0 Q1130 50 1100 80"/>
  </g>

  <!-- Logo text -->
  <text x="600" y="280"
        font-family="Pacifico, cursive"
        font-size="96"
        fill="#F0FAF8"
        text-anchor="middle"
        letter-spacing="2">Phlix</text>

  <!-- Caustic shimmer line -->
  <path d="M200 310 Q600 295 1000 310"
        stroke="url(#og-grad)" stroke-width="3" fill="none"
        stroke-linecap="round"/>

  <!-- Tagline -->
  <text x="600" y="380"
        font-family="Nunito, system-ui, sans-serif"
        font-size="32"
        font-weight="500"
        fill="#F0FAF8"
        text-anchor="middle"
        opacity="0.85">Your media. Your library. Your Phlix.</text>

  <!-- "Self-hosted media server" eyebrow -->
  <text x="600" y="440"
        font-family="Nunito, system-ui, sans-serif"
        font-size="20"
        font-weight="600"
        fill="#00D4B8"
        text-anchor="middle"
        letter-spacing="3"
        opacity="0.9">SELF-HOSTED MEDIA SERVER</text>

  <!-- Brand tagline overlay -->
  <text x="600" y="500"
        font-family="Pacifico, cursive"
        font-size="22"
        fill="#00D4B8"
        text-anchor="middle"
        opacity="0.7">Your Next Adventure Starts Here.</text>

  <defs>
    <linearGradient id="og-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D4B8" stop-opacity="0"/>
      <stop offset="30%" stop-color="#00D4B8" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#00D4B8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#00D4B8" stop-opacity="0"/>
    </linearGradient>
  </defs>
</svg>
