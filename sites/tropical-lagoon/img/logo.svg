<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 80" role="img" aria-label="Phlix brand logo">
  <title>Phlix</title>

  <!-- Caustic shimmer underline -->
  <path d="M10 68 Q70 60 140 68 Q210 76 270 65"
        stroke="url(#caustic-grad)" stroke-width="2" fill="none"
        stroke-linecap="round" opacity="0.7"/>

  <!-- Wordmark -->
  <text x="140" y="52"
        font-family="Pacifico, cursive"
        font-size="42"
        fill="#F0FAF8"
        text-anchor="middle"
        letter-spacing="1">Phlix</text>

  <!-- Tropical wave accent (small, bottom-left) -->
  <path d="M8 72 Q20 68 32 72 Q44 76 56 72"
        stroke="#00D4B8" stroke-width="1.5" fill="none"
        stroke-linecap="round" opacity="0.5"/>

  <!-- Tropical wave accent (small, bottom-right) -->
  <path d="M224 72 Q236 68 248 72 Q260 76 272 72"
        stroke="#00D4B8" stroke-width="1.5" fill="none"
        stroke-linecap="round" opacity="0.5"/>

  <defs>
    <linearGradient id="caustic-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D4B8" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#00D4B8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#00D4B8" stop-opacity="0.2"/>
    </linearGradient>
  </defs>
</svg>
