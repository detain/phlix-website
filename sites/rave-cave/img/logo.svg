<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" fill="none">
  <title>Phlix — Rave Cave</title>
  <desc>Open-source media server logo with neon glow aesthetic</desc>

  <defs>
    <filter id="glow-purple" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glow-green" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="text-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#CC00FF"/>
      <stop offset="50%" stop-color="#00FF00"/>
      <stop offset="100%" stop-color="#FF6600"/>
    </linearGradient>
  </defs>

  <!-- Logo mark — stylized P with glow -->
  <g filter="url(#glow-purple)">
    <path d="M18 10 L18 50 L28 50 L28 38 L34 38 C42 38 46 33 46 26 C46 19 42 14 34 14 L28 14 L28 10 Z M28 20 L33 20 C37 20 39 22 39 26 C39 30 37 32 33 32 L28 32 Z"
          fill="#CC00FF"/>
  </g>

  <!-- Secondary accent — small pulse circle -->
  <g filter="url(#glow-green)">
    <circle cx="52" cy="30" r="4" fill="#00FF00"/>
  </g>

  <!-- Wordmark -->
  <text x="65" y="40"
        font-family="'Orbitron', 'Share Tech Mono', monospace"
        font-size="28"
        font-weight="700"
        letter-spacing="0.05em"
        fill="url(#text-gradient)"
        filter="url(#glow-purple)">
    PHLIX
  </text>
</svg>
