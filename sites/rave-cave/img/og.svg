<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <title>Phlix — Rave Cave OG Image</title>
  <desc>Social share card for Phlix with rave-cave underground rave theme</desc>

  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0A0A"/>
      <stop offset="50%" stop-color="#111111"/>
      <stop offset="100%" stop-color="#0A0A0A"/>
    </linearGradient>
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#CC00FF"/>
      <stop offset="50%" stop-color="#00FF00"/>
      <stop offset="100%" stop-color="#FF6600"/>
    </linearGradient>
    <radialGradient id="glow-purple" cx="30%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#CC00FF" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#CC00FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-green" cx="70%" cy="70%" r="60%">
      <stop offset="0%" stop-color="#00FF00" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#00FF00" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg-grad)"/>

  <!-- Decorative glows -->
  <rect width="1200" height="630" fill="url(#glow-purple)"/>
  <rect width="1200" height="630" fill="url(#glow-green)"/>

  <!-- Grid lines (subtle) -->
  <g stroke="#CC00FF" stroke-opacity="0.1" stroke-width="1">
    <line x1="0" y1="157" x2="1200" y2="157"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="472" x2="1200" y2="472"/>
    <line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
  </g>

  <!-- Logo mark -->
  <g transform="translate(540, 200)" filter="url(#glow)">
    <path d="M18 10 L18 50 L28 50 L28 38 L34 38 C42 38 46 33 46 26 C46 19 42 14 34 14 L28 14 L28 10 Z M28 20 L33 20 C37 20 39 22 39 26 C39 30 37 32 33 32 L28 32 Z"
          fill="#CC00FF"/>
    <circle cx="52" cy="30" r="4" fill="#00FF00"/>
  </g>

  <!-- Wordmark -->
  <text x="600" y="340"
        font-family="'Orbitron', 'Share Tech Mono', monospace"
        font-size="72"
        font-weight="700"
        letter-spacing="0.1em"
        fill="url(#text-grad)"
        text-anchor="middle"
        filter="url(#glow)">
    PHLIX
  </text>

  <!-- Tagline -->
  <text x="600" y="400"
        font-family="'Rajdhani', 'Arial Narrow', sans-serif"
        font-size="28"
        fill="#AAAAAA"
        text-anchor="middle"
        letter-spacing="0.05em">
    Open-source media, on your terms.
  </text>

  <!-- Bottom accent bar -->
  <rect x="500" y="440" width="200" height="3" fill="#CC00FF" opacity="0.8" filter="url(#glow)"/>

  <!-- Client badges -->
  <g font-family="'Share Tech Mono', monospace" font-size="14" fill="#AAAAAA">
    <text x="380" y="500">Roku</text>
    <text x="480" y="500">·</text>
    <text x="510" y="500">Samsung Tizen</text>
    <text x="680" y="500">·</text>
    <text x="710" y="500">Windows</text>
    <text x="820" y="500">·</text>
    <text x="850" y="500">Mobile</text>
    <text x="930" y="500">·</text>
    <text x="960" y="500" fill="#00FF00">DLNA</text>
  </g>
</svg>
