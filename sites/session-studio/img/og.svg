<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1C1C1C"/>
      <stop offset="100%" stop-color="#252525"/>
    </linearGradient>
    <linearGradient id="vuGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4ECDC4"/>
      <stop offset="60%" stop-color="#4ECDC4"/>
      <stop offset="80%" stop-color="#FF8C00"/>
      <stop offset="100%" stop-color="#FF4444"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Grid pattern (subtle) -->
  <g opacity="0.05">
    <line x1="0" y1="157" x2="1200" y2="157" stroke="#4ECDC4" stroke-width="1"/>
    <line x1="0" y1="315" x2="1200" y2="315" stroke="#4ECDC4" stroke-width="1"/>
    <line x1="0" y1="472" x2="1200" y2="472" stroke="#4ECDC4" stroke-width="1"/>
    <line x1="300" y1="0" x2="300" y2="630" stroke="#4ECDC4" stroke-width="1"/>
    <line x1="600" y1="0" x2="600" y2="630" stroke="#4ECDC4" stroke-width="1"/>
    <line x1="900" y1="0" x2="900" y2="630" stroke="#4ECDC4" stroke-width="1"/>
  </g>

  <!-- VU meter decoration (top) -->
  <g transform="translate(50, 50)">
    <rect x="0" y="0" width="8" height="20" rx="2" fill="#4ECDC4" filter="url(#glow)"/>
    <rect x="12" y="5" width="8" height="15" rx="2" fill="#4ECDC4" filter="url(#glow)"/>
    <rect x="24" y="2" width="8" height="18" rx="2" fill="#FF8C00" filter="url(#glow)"/>
    <rect x="36" y="7" width="8" height="13" rx="2" fill="#4ECDC4" filter="url(#glow)"/>
    <rect x="48" y="0" width="8" height="20" rx="2" fill="#3A6EA5" filter="url(#glow)"/>
    <rect x="60" y="4" width="8" height="16" rx="2" fill="#4ECDC4" filter="url(#glow)"/>
    <rect x="72" y="8" width="8" height="12" rx="2" fill="#4ECDC4" filter="url(#glow)"/>
    <rect x="84" y="3" width="8" height="17" rx="2" fill="#FF8C00" filter="url(#glow)"/>
    <rect x="96" y="6" width="8" height="14" rx="2" fill="#4ECDC4" filter="url(#glow)"/>
  </g>

  <!-- Main title -->
  <text x="600" y="280" font-family="Oswald, Impact, sans-serif" font-weight="700" font-size="120" fill="#F5F5F5" text-anchor="middle" letter-spacing="8">PHLIX</text>

  <!-- Tagline -->
  <text x="600" y="350" font-family="Source Sans Pro, Arial, sans-serif" font-weight="400" font-size="28" fill="#A0A0A0" text-anchor="middle">Your media. Your library. Your Phlix.</text>

  <!-- VU meter decoration (bottom) -->
  <rect x="0" y="600" width="1200" height="30" fill="url(#vuGradient)" opacity="0.6"/>
  <rect x="0" y="600" width="1200" height="3" fill="#4ECDC4"/>

  <!-- Bottom accent lines -->
  <g transform="translate(50, 520)">
    <line x1="0" y1="0" x2="200" y2="0" stroke="#3A6EA5" stroke-width="2"/>
    <line x1="0" y1="8" x2="150" y2="8" stroke="#4ECDC4" stroke-width="2"/>
    <line x1="0" y1="16" x2="100" y2="16" stroke="#FF8C00" stroke-width="2"/>
  </g>

  <g transform="translate(950, 520)">
    <line x1="0" y1="0" x2="200" y2="0" stroke="#3A6EA5" stroke-width="2"/>
    <line x1="50" y1="8" x2="200" y2="8" stroke="#4ECDC4" stroke-width="2"/>
    <line x1="100" y1="16" x2="200" y2="16" stroke="#FF8C00" stroke-width="2"/>
  </g>
</svg>
