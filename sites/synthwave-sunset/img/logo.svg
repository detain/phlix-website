<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" fill="none">
  <defs>
    <linearGradient id="phlixGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2E63"/>
      <stop offset="100%" stop-color="#9D4EDD"/>
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#08D9D6"/>
      <stop offset="100%" stop-color="#FF2E63"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Stylized P with neon glow -->
  <text x="8" y="45" font-family="Orbitron, sans-serif" font-size="42" font-weight="700" fill="url(#phlixGrad)" filter="url(#glow)">P</text>
  <!-- Horizontal line / grid horizon -->
  <line x1="42" y1="30" x2="95" y2="30" stroke="url(#sunGrad)" stroke-width="2"/>
  <!-- Wordmark -->
  <text x="100" y="42" font-family="Rajdhani, sans-serif" font-size="28" font-weight="600" fill="#EAEAEA">hlix</text>
  <!-- Decorative sun/circle element -->
  <circle cx="230" cy="15" r="8" fill="url(#sunGrad)" opacity="0.8"/>
  <circle cx="230" cy="15" r="4" fill="#EAEAEA"/>
</svg>
