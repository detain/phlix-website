<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" role="img">
  <title>Phlix</title>
  <desc>Synthwave Sunset branding — Phlix media server logo</desc>

  <!-- Sun/horizon -->
  <defs>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF2E63"/>
      <stop offset="100%" stop-color="#FFB800"/>
    </linearGradient>
    <linearGradient id="gridGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#08D9D6" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#08D9D6" stop-opacity="0.1"/>
    </linearGradient>
  </defs>

  <!-- Sun -->
  <circle cx="30" cy="30" r="18" fill="url(#sunGrad)"/>

  <!-- Horizon grid lines -->
  <g transform="translate(0, 48)" opacity="0.6">
    <line x1="0" y1="0" x2="60" y2="0" stroke="#08D9D6" stroke-width="0.5"/>
    <line x1="0" y1="-6" x2="60" y2="-6" stroke="#08D9D6" stroke-width="0.3" opacity="0.7"/>
    <line x1="0" y1="-12" x2="60" y2="-12" stroke="#08D9D6" stroke-width="0.3" opacity="0.5"/>
    <line x1="0" y1="-18" x2="60" y2="-18" stroke="#08D9D6" stroke-width="0.3" opacity="0.3"/>
  </g>

  <!-- Grid perspective lines from sun -->
  <g opacity="0.3">
    <line x1="30" y1="30" x2="0" y2="55" stroke="#08D9D6" stroke-width="0.5"/>
    <line x1="30" y1="30" x2="15" y2="55" stroke="#08D9D6" stroke-width="0.5"/>
    <line x1="30" y1="30" x2="30" y2="55" stroke="#08D9D6" stroke-width="0.5"/>
    <line x1="30" y1="30" x2="45" y2="55" stroke="#08D9D6" stroke-width="0.5"/>
    <line x1="30" y1="30" x2="60" y2="55" stroke="#08D9D6" stroke-width="0.5"/>
  </g>

  <!-- Wordmark -->
  <text x="75" y="38" font-family="Arial Black, sans-serif" font-size="26" font-weight="900" fill="#EAEAEA" letter-spacing="2" text-transform="uppercase">Phlix</text>
  <text x="75" y="52" font-family="Arial, sans-serif" font-size="10" fill="#08D9D6" letter-spacing="4">MEDIA SERVER</text>
</svg>
