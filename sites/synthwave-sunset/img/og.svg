<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img">
  <title>Phlix — Your media. Your library. Your Phlix.</title>
  <desc>Synthwave Sunset Open Graph image for Phlix media server</desc>

  <!-- Background -->
  <rect width="1200" height="630" fill="#252A34"/>

  <!-- Grid horizon -->
  <g opacity="0.3">
    <line x1="0" y1="350" x2="1200" y2="350" stroke="#08D9D6" stroke-width="2"/>
    <line x1="0" y1="400" x2="1200" y2="400" stroke="#08D9D6" stroke-width="1"/>
    <line x1="0" y1="450" x2="1200" y2="450" stroke="#08D9D6" stroke-width="1"/>
    <line x1="0" y1="500" x2="1200" y2="500" stroke="#08D9D6" stroke-width="1"/>
    <line x1="0" y1="550" x2="1200" y2="550" stroke="#08D9D6" stroke-width="1"/>
    <!-- Perspective lines -->
    <line x1="600" y1="350" x2="0" y2="630" stroke="#08D9D6" stroke-width="1"/>
    <line x1="600" y1="350" x2="300" y2="630" stroke="#08D9D6" stroke-width="1"/>
    <line x1="600" y1="350" x2="500" y2="630" stroke="#08D9D6" stroke-width="1"/>
    <line x1="600" y1="350" x2="700" y2="630" stroke="#08D9D6" stroke-width="1"/>
    <line x1="600" y1="350" x2="900" y2="630" stroke="#08D9D6" stroke-width="1"/>
    <line x1="600" y1="350" x2="1200" y2="630" stroke="#08D9D6" stroke-width="1"/>
  </g>

  <!-- Sun -->
  <defs>
    <linearGradient id="sunGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF2E63"/>
      <stop offset="50%" stop-color="#FF2E63"/>
      <stop offset="100%" stop-color="#FFB800"/>
    </linearGradient>
    <clipPath id="sunClip">
      <rect x="0" y="0" width="1200" height="350"/>
    </clipPath>
  </defs>
  <circle cx="600" cy="350" r="180" fill="url(#sunGrad2)" clip-path="url(#sunClip)"/>

  <!-- Text -->
  <text x="600" y="200" font-family="Arial Black, sans-serif" font-size="100" font-weight="900" fill="#EAEAEA" text-anchor="middle" letter-spacing="8">Phlix</text>
  <text x="600" y="480" font-family="Arial, sans-serif" font-size="28" fill="#08D9D6" text-anchor="middle" letter-spacing="6">MEDIA SERVER</text>
  <text x="600" y="540" font-family="Arial, sans-serif" font-size="24" fill="#8892A0" text-anchor="middle">Your media. Your library. Your Phlix.</text>

  <!-- Neon line -->
  <rect x="400" y="580" width="400" height="3" fill="#08D9D6" rx="1"/>
</svg>
