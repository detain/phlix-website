<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img">
  <title>Phlix</title>
  <desc>Synthwave Sunset favicon — sun and horizon icon</desc>
  <!-- Sun -->
  <circle cx="16" cy="14" r="10" fill="#FF2E63"/>
  <!-- Horizon -->
  <rect x="0" y="22" width="32" height="10" fill="#252A34"/>
  <!-- Grid line -->
  <line x1="0" y1="24" x2="32" y2="24" stroke="#08D9D6" stroke-width="1" opacity="0.6"/>
  <!-- Grid perspective -->
  <g opacity="0.4">
    <line x1="16" y1="14" x2="0" y2="22" stroke="#08D9D6" stroke-width="0.5"/>
    <line x1="16" y1="14" x2="32" y2="22" stroke="#08D9D6" stroke-width="0.5"/>
    <line x1="16" y1="14" x2="8" y2="22" stroke="#08D9D6" stroke-width="0.5"/>
    <line x1="16" y1="14" x2="24" y2="22" stroke="#08D9D6" stroke-width="0.5"/>
  </g>
</svg>
