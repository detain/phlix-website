<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Wilderness Trail — Phlix social card">
  <title>Wilderness Trail — Find Your Trail.</title>
  <desc>National Park Service-style social card for Wilderness Trail Phlix brand kit</desc>

  <!-- Background: Alpenglow gradient -->
  <defs>
    <linearGradient id="alpenglow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4581A"/>
      <stop offset="60%" stop-color="#3A7CA5"/>
      <stop offset="100%" stop-color="#2D5A27"/>
    </linearGradient>
    <linearGradient id="sky-fade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3A7CA5" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#1A3318" stop-opacity="0.6"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#alpenglow)"/>

  <!-- Topo contour lines (decorative background) -->
  <g opacity="0.12" fill="none" stroke="#F0E6CE" stroke-width="1">
    <path d="M0 480 Q200 440 400 480 T800 480 T1200 480"/>
    <path d="M0 510 Q200 470 400 510 T800 510 T1200 510"/>
    <path d="M100 420 Q300 380 500 420 T900 420"/>
    <path d="M200 370 Q400 330 600 370 T1000 370"/>
    <path d="M0 540 Q300 500 600 540 T1200 540"/>
  </g>

  <!-- Pine silhouette ridgeline (bottom) -->
  <g fill="#1A3318" opacity="0.5">
    <!-- Tree group left -->
    <polygon points="0,630 0,520 30,470 60,520 60,630"/>
    <polygon points="50,630 50,500 85,445 120,500 120,630"/>
    <polygon points="100,630 100,515 140,460 180,515 180,630"/>
    <!-- Tree group center -->
    <polygon points="450,630 450,480 490,420 530,480 530,630"/>
    <polygon points="520,630 520,490 565,430 610,490 610,630"/>
    <polygon points="600,630 600,470 650,400 700,470 700,630"/>
    <!-- Tree group right -->
    <polygon points="900,630 900,490 945,430 990,490 990,630"/>
    <polygon points="970,630 970,505 1015,455 1060,505 1060,630"/>
    <polygon points="1040,630 1040,480 1090,415 1140,480 1140,630"/>
    <polygon points="1120,630 1120,510 1160,465 1200,510 1200,630"/>
  </g>

  <!-- Campfire flame (bottom-left accent) -->
  <g transform="translate(80, 570)" fill="#D4581A" opacity="0.8">
    <polygon points="20,0 30,25 22,20 28,40 18,30 12,40 18,20 10,25"/>
    <polygon points="20,15 26,35 20,32 24,50 16,42 12,50 16,32 10,35" fill="#E8D9BC"/>
  </g>

  <!-- Phlix wordmark -->
  <text x="600" y="280"
    font-family="Georgia, 'Times New Roman', serif"
    font-weight="bold"
    font-size="72"
    fill="#F0E6CE"
    text-anchor="middle"
    letter-spacing="8">WILDERNESS TRAIL</text>

  <!-- Tagline -->
  <text x="600" y="340"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="32"
    fill="#F0E6CE"
    text-anchor="middle"
    letter-spacing="4"
    opacity="0.9">Find Your Trail.</text>

  <!-- Divider line -->
  <line x1="350" y1="370" x2="850" y2="370" stroke="#F0E6CE" stroke-width="1" opacity="0.4"/>

  <!-- Product name -->
  <text x="600" y="420"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="28"
    fill="#F0E6CE"
    text-anchor="middle"
    letter-spacing="6"
    opacity="0.75">PHLIX</text>

  <!-- Small tagline bottom -->
  <text x="600" y="580"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="18"
    fill="#E8D9BC"
    text-anchor="middle"
    letter-spacing="2"
    opacity="0.6">Self-hosted media server</text>

  <!-- Trail blaze diamond (top right) -->
  <g transform="translate(1100, 60)" fill="#D4581A">
    <polygon points="20,0 40,20 20,40 0,20"/>
    <polygon points="20,8 32,20 20,32 8,20" fill="#E8D9BC"/>
  </g>

  <!-- Topo oval (top left accent) -->
  <ellipse cx="100" cy="100" rx="60" ry="35" fill="none" stroke="#F0E6CE" stroke-width="1" opacity="0.2"/>
  <ellipse cx="100" cy="100" rx="45" ry="25" fill="none" stroke="#F0E6CE" stroke-width="0.8" opacity="0.15"/>
</svg>
