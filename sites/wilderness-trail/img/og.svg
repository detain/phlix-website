<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 180" role="img">
  <defs>
    <linearGradient id="alpenglow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3A7CA5"/>
      <stop offset="60%" stop-color="#2D5A27"/>
      <stop offset="100%" stop-color="#1A3318"/>
    </linearGradient>
  </defs>
  <rect width="280" height="180" fill="url(#alpenglow)" rx="8"/>
  <!-- Starfield -->
  <circle cx="20" cy="20" r="1" fill="#F0E6CE" opacity="0.6"/>
  <circle cx="60" cy="15" r="1.5" fill="#F0E6CE" opacity="0.5"/>
  <circle cx="90" cy="30" r="1" fill="#F0E6CE" opacity="0.7"/>
  <circle cx="130" cy="10" r="1" fill="#F0E6CE" opacity="0.4"/>
  <circle cx="200" cy="25" r="1.5" fill="#F0E6CE" opacity="0.6"/>
  <circle cx="240" cy="15" r="1" fill="#F0E6CE" opacity="0.5"/>
  <circle cx="260" cy="35" r="1" fill="#F0E6CE" opacity="0.7"/>
  <!-- Ridgeline silhouettes -->
  <path d="M0,180 L0,120 L40,100 L80,115 L120,90 L160,105 L200,75 L240,95 L280,80 L280,180 Z" fill="#1A3318" opacity="0.6"/>
  <path d="M0,180 L0,140 L60,120 L100,130 L140,110 L180,125 L220,105 L260,118 L280,110 L280,180 Z" fill="#2D5A27" opacity="0.5"/>
  <!-- Wordmark -->
  <text x="140" y="138" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-weight="bold" fill="#E8D9BC" text-anchor="middle" letter-spacing="3">WILDERNESS TRAIL</text>
  <text x="140" y="160" font-family="Georgia, 'Times New Roman', serif" font-size="12" fill="#D8C89A" text-anchor="middle" letter-spacing="1" font-style="italic">Find Your Trail.</text>
  <!-- Campfire orange accent -->
  <circle cx="140" cy="165" r="3" fill="#D4581A"/>
</svg>
