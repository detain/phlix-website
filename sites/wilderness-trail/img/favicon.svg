<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Wilderness Trail favicon">
  <title>Wilderness Trail favicon</title>
  <rect width="32" height="32" fill="#2D5A27" rx="4"/>
  <!-- Pine tree silhouette -->
  <g transform="translate(16, 16)" fill="#F0E6CE">
    <polygon points="0,-12 8,-2  -8,-2"/>
    <polygon points="0,-6 10,6  -10,6"/>
    <polygon points="0,1 12,16 -12,16"/>
    <rect x="-2" y="16" width="4" height="5" fill="#7A5C3A"/>
  </g>
  <!-- Campfire orange accent at base -->
  <rect x="12" y="28" width="8" height="2" fill="#D4581A" rx="1"/>
</svg>
