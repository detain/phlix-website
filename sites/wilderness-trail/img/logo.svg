<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 80" role="img" aria-label="Wilderness Trail logo">
  <title>Wilderness Trail</title>
  <desc>National Park Service-style wordmark with pine tree and mountain peak on canvas tan</desc>

  <!-- Background: canvas tan -->
  <rect width="280" height="80" fill="#E8D9BC" rx="6"/>

  <!-- Outer border: ink-pine double-rule effect -->
  <rect x="4" y="4" width="272" height="72" fill="none" stroke="#1A3318" stroke-width="2" rx="4"/>
  <rect x="9" y="9" width="262" height="62" fill="none" stroke="#1A3318" stroke-width="0.75" rx="2"/>

  <!-- Pine tree silhouette (left) -->
  <g transform="translate(20, 12)" fill="#2D5A27">
    <!-- Tree tiers -->
    <polygon points="12,0 22,18 2,18"/>
    <polygon points="12,8 24,30 0,30"/>
    <polygon points="12,18 26,44 -2,44"/>
    <!-- Trunk -->
    <rect x="9" y="44" width="6" height="12" fill="#7A5C3A"/>
  </g>

  <!-- Mountain peak (right of tree) -->
  <g transform="translate(52, 16)" fill="#3A7CA5" opacity="0.7">
    <polygon points="20,0 38,38 2,38"/>
    <!-- Snow cap -->
    <polygon points="20,0 26,14 14,14" fill="#F0E6CE"/>
    <!-- Second smaller peak -->
    <polygon points="28,12 40,38 16,38" fill="#3A7CA5" opacity="0.5"/>
  </g>

  <!-- Topo contour oval (decorative, center) -->
  <ellipse cx="140" cy="40" rx="30" ry="18" fill="none" stroke="#3A7CA5" stroke-width="0.8" opacity="0.25"/>

  <!-- Wordmark: WILDERNESS TRAIL -->
  <text x="140" y="62"
    font-family="Georgia, 'Times New Roman', serif"
    font-weight="bold"
    font-size="16"
    fill="#2D5A27"
    text-anchor="middle"
    letter-spacing="2">WILDERNESS TRAIL</text>

  <!-- Tagline: small trail blaze -->
  <rect x="134" y="68" width="12" height="6" fill="#D4581A" rx="1" opacity="0.85"/>
</svg>
