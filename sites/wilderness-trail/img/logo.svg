<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 64" role="img">
  <!-- Pine mountain silhouette -->
  <g fill="#2D5A27">
    <!-- Mountain peak -->
    <polygon points="16,52 32,20 48,52"/>
    <!-- Second peak -->
    <polygon points="28,52 50,12 72,52"/>
    <!-- Third peak -->
    <polygon points="60,52 78,22 96,52"/>
    <!-- Tree silhouettes at base -->
    <rect x="8" y="48" width="4" height="12" rx="1" fill="#1A3318"/>
    <polygon points="10,40 6,52 14,52" fill="#1A3318"/>
    <rect x="88" y="50" width="4" height="10" rx="1" fill="#1A3318"/>
    <polygon points="90,42 86,54 94,54" fill="#1A3318"/>
  </g>
  <!-- Wordmark -->
  <text x="108" y="28" font-family="Georgia, 'Times New Roman', serif" font-size="18" font-weight="bold" fill="#2D5A27" letter-spacing="2">WILDERNESS</text>
  <text x="108" y="48" font-family="Georgia, 'Times New Roman', serif" font-size="18" font-weight="bold" fill="#1A3318" letter-spacing="2">TRAIL</text>
</svg>
