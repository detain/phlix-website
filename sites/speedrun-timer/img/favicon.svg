<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="32" height="32" fill="#000000"/>

  <!-- Timer circle -->
  <circle cx="16" cy="16" r="12" fill="none" stroke="#00FF00" stroke-width="1.5" filter="url(#glow)"/>

  <!-- Timer top button -->
  <rect x="14" y="2" width="4" height="3" fill="#00FF00" rx="0.5"/>

  <!-- Timer side button -->
  <rect x="25" y="13" width="3" height="2" fill="#00FF00" rx="0.5"/>

  <!-- Split hand -->
  <line x1="16" y1="16" x2="16" y2="7" stroke="#00FF00" stroke-width="1.5" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Hand dot -->
  <circle cx="16" cy="7" r="1.5" fill="#00FF00"/>

  <!-- Center -->
  <circle cx="16" cy="16" r="1.5" fill="#00FF00"/>
</svg>
