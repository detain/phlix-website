<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" width="200" height="60">
  <defs>
    <filter id="glow-green">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Timer icon (stopwatch shape) -->
  <g transform="translate(8, 10)">
    <!-- Outer circle -->
    <circle cx="20" cy="20" r="18" fill="none" stroke="#00FF00" stroke-width="2" filter="url(#glow-green)"/>
    <!-- Inner circle -->
    <circle cx="20" cy="20" r="14" fill="none" stroke="#00FF00" stroke-width="1" opacity="0.5"/>
    <!-- Top button -->
    <rect x="17" y="0" width="6" height="4" fill="#00FF00" rx="1"/>
    <!-- Side button -->
    <rect x="35" y="14" width="5" height="3" fill="#00FF00" rx="1"/>
    <!-- Split hand (pointing to green) -->
    <line x1="20" y1="20" x2="20" y2="8" stroke="#00FF00" stroke-width="2" stroke-linecap="round"/>
    <!-- Split indicator dot -->
    <circle cx="20" cy="8" r="2" fill="#00FF00"/>
    <!-- Center dot -->
    <circle cx="20" cy="20" r="2" fill="#00FF00"/>
  </g>

  <!-- PHLIX text -->
  <text x="60" y="42" font-family="'Share Tech Mono', monospace" font-size="28" font-weight="bold" fill="#00FF00" letter-spacing="0.15em" filter="url(#glow-green)">PHLIX</text>
</svg>
