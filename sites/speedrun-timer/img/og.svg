<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <filter id="glow-green">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glow-cyan">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#000000"/>

  <!-- Grid lines (speedrun aesthetic) -->
  <g stroke="#00FF00" stroke-width="0.5" opacity="0.1">
    <line x1="0" y1="157" x2="1200" y2="157"/>
    <line x1="0" y1="314" x2="1200" y2="314"/>
    <line x1="0" y1="471" x2="1200" y2="471"/>
    <line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
  </g>

  <!-- Scanlines effect -->
  <g fill="#00FF00" opacity="0.02">
    <rect y="0" width="1200" height="2"/>
    <rect y="4" width="1200" height="2"/>
    <rect y="8" width="1200" height="2"/>
    <rect y="12" width="1200" height="2"/>
    <rect y="16" width="1200" height="2"/>
  </g>

  <!-- Timer icon (large) -->
  <g transform="translate(100, 265)" opacity="0.8">
    <circle cx="50" cy="50" r="45" fill="none" stroke="#00FF00" stroke-width="3" filter="url(#glow-green)"/>
    <circle cx="50" cy="50" r="35" fill="none" stroke="#00FF00" stroke-width="1" opacity="0.5"/>
    <rect x="45" y="2" width="10" height="8" fill="#00FF00"/>
    <rect x="88" y="42" width="10" height="6" fill="#00FF00"/>
    <line x1="50" y1="50" x2="50" y2="20" stroke="#00FF00" stroke-width="4" stroke-linecap="round" filter="url(#glow-green)"/>
    <line x1="50" y1="50" x2="70" y2="50" stroke="#00FFFF" stroke-width="3" stroke-linecap="round" filter="url(#glow-cyan)"/>
    <circle cx="50" cy="50" r="4" fill="#00FF00"/>
  </g>

  <!-- Main text: Phlix -->
  <text x="600" y="300" font-family="'Orbitron', 'Share Tech Mono', monospace" font-size="120" font-weight="bold" fill="#00FF00" text-anchor="middle" letter-spacing="0.2em" filter="url(#glow-green)">PHLIX</text>

  <!-- Tagline -->
  <text x="600" y="380" font-family="'Share Tech Mono', monospace" font-size="24" fill="#00FFFF" text-anchor="middle" letter-spacing="0.3em" opacity="0.9">SELF-HOSTED MEDIA SERVER</text>

  <!-- Bottom info -->
  <text x="600" y="550" font-family="'Share Tech Mono', monospace" font-size="18" fill="#888888" text-anchor="middle" letter-spacing="0.15em">Roku · Samsung Tizen · Windows · Mobile · DLNA</text>

  <!-- Millisecond precision indicator (decorative) -->
  <g transform="translate(600, 480)">
    <text font-family="'Share Tech Mono', monospace" font-size="14" fill="#FFD700" text-anchor="middle" opacity="0.7">00:00:00.000</text>
  </g>
</svg>
