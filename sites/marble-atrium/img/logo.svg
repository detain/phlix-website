<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 64" role="img" aria-label="Phlix — Marble Atrium">
  <rect width="220" height="64" fill="#F7F5F2"/>
  <!-- Top hairline rule -->
  <line x1="20" y1="12" x2="200" y2="12" stroke="#C8C4BC" stroke-width="0.75"/>
  <!-- Phlix wordmark — product name -->
  <text x="110" y="36"
    font-family="Georgia, 'Times New Roman', serif"
    font-weight="400"
    font-size="28"
    letter-spacing="0.25em"
    text-anchor="middle"
    fill="#0F0F0E">PHLIX</text>
  <!-- Bottom hairline rule -->
  <line x1="20" y1="44" x2="200" y2="44" stroke="#C8C4BC" stroke-width="0.75"/>
  <!-- Kit identity subtitle -->
  <text x="110" y="58"
    font-family="Georgia, 'Times New Roman', serif"
    font-weight="400"
    font-size="9"
    letter-spacing="0.35em"
    text-anchor="middle"
    fill="#A0A09A">MARBLE ATRIUM</text>
</svg>
