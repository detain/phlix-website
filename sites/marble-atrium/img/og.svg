<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Phlix — Your Library, Elevated.">
  <!-- Marble White background -->
  <rect width="1200" height="630" fill="#F7F5F2"/>

  <!-- Glass-ceiling grid geometry — very subtle signature motif -->
  <defs>
    <pattern id="grid" x="0" y="0" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M 80 0 L 0 0 0 80" fill="none" stroke="#C8C4BC" stroke-width="0.5" opacity="0.2"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#grid)" opacity="0.5"/>

  <!-- Glass ceiling radial light from above -->
  <defs>
    <radialGradient id="overhead-light" cx="50%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#EEECE8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#F7F5F2" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <ellipse cx="600" cy="0" rx="700" ry="400" fill="url(#overhead-light)"/>

  <!-- Top hairline rule -->
  <line x1="120" y1="220" x2="1080" y2="220" stroke="#C8C4BC" stroke-width="1"/>

  <!-- PHLIX wordmark -->
  <text x="600" y="370"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="96"
    font-weight="400"
    letter-spacing="0.3em"
    text-anchor="middle"
    fill="#0F0F0E">PHLIX</text>

  <!-- Bottom hairline rule -->
  <line x1="120" y1="400" x2="1080" y2="400" stroke="#C8C4BC" stroke-width="1"/>

  <!-- Tagline primary -->
  <text x="600" y="470"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="28"
    font-weight="300"
    letter-spacing="0.08em"
    text-anchor="middle"
    fill="#A0A09A"
    font-style="italic">Your Library, Elevated.</text>

  <!-- Kit identity — bottom right -->
  <text x="1080" y="600"
    font-family="Georgia, serif"
    font-size="11"
    letter-spacing="0.35em"
    text-anchor="end"
    fill="#A0A09A">MARBLE ATRIUM</text>
</svg>
