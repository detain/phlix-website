<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 50" width="200" height="50">
  <defs>
    <linearGradient id="magma-text" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#8B0000"/>
      <stop offset="50%" style="stop-color:#DC143C"/>
      <stop offset="100%" style="stop-color:#FF5349"/>
    </linearGradient>
    <linearGradient id="magma-icon" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#8B0000"/>
      <stop offset="50%" style="stop-color:#DC143C"/>
      <stop offset="100%" style="stop-color:#FF5349"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Flame icon -->
  <path d="M25 5 C30 15, 40 20, 35 35 C33 42, 25 45, 25 45 C25 45, 17 42, 15 35 C10 20, 20 15, 25 5 Z" fill="url(#magma-icon)" filter="url(#glow)"/>
  <ellipse cx="25" cy="40" rx="8" ry="4" fill="#FFB347" opacity="0.8"/>
  <!-- Text: Phlix -->
  <text x="50" y="35" font-family="Cinzel, serif" font-size="28" font-weight="700" fill="url(#magma-text)" letter-spacing="2">PHLIX</text>
</svg>
