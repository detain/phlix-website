<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0A0510"/>
      <stop offset="100%" style="stop-color:#1A1025"/>
    </linearGradient>
    <linearGradient id="magma-hero" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#8B0000"/>
      <stop offset="30%" style="stop-color:#DC143C"/>
      <stop offset="70%" style="stop-color:#FF5349"/>
      <stop offset="100%" style="stop-color:#FFB347"/>
    </linearGradient>
    <radialGradient id="glow-center" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#DC143C;stop-opacity:0.4"/>
      <stop offset="100%" style="stop-color:#DC143C;stop-opacity:0"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg-grad)"/>
  <!-- Eruption glow -->
  <ellipse cx="600" cy="400" rx="500" ry="300" fill="url(#glow-center)"/>
  <!-- Lava flow at bottom -->
  <path d="M0 630 L0 500 Q200 450, 400 480 Q500 490, 600 450 Q700 410, 800 460 Q900 510, 1000 470 Q1100 430, 1200 480 L1200 630 Z" fill="url(#magma-hero)" opacity="0.7"/>
  <!-- Flame/eruption in center -->
  <path d="M600 100 C650 180, 720 220, 680 320 C660 380, 600 420, 600 420 C600 420, 540 380, 520 320 C480 220, 550 180, 600 100 Z" fill="url(#magma-hero)" filter="url(#glow)"/>
  <!-- Core glow -->
  <ellipse cx="600" cy="360" rx="40" ry="60" fill="#FFB347" opacity="0.6"/>
  <!-- Title text -->
  <text x="600" y="520" font-family="Cinzel, serif" font-size="72" font-weight="700" fill="#F0EBE8" text-anchor="middle" letter-spacing="8">IGNITE YOUR VISION</text>
  <!-- Subtitle -->
  <text x="600" y="570" font-family="Rajdhani, sans-serif" font-size="28" fill="#6B6B7B" text-anchor="middle" letter-spacing="4">SELF-HOSTED MEDIA SERVER</text>
</svg>
