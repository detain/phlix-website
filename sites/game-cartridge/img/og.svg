<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2D2D2D"/>
      <stop offset="100%" style="stop-color:#1a1a1a"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#00FF00;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#00FF00;stop-opacity:0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Scanlines -->
  <g opacity="0.05">
    <line x1="0" y1="0" x2="1200" y2="0" stroke="#00FF00" stroke-width="1"/>
    <line x1="0" y1="4" x2="1200" y2="4" stroke="#00FF00" stroke-width="1"/>
    <line x1="0" y1="8" x2="1200" y2="8" stroke="#00FF00" stroke-width="1"/>
    <line x1="0" y1="12" x2="1200" y2="12" stroke="#00FF00" stroke-width="1"/>
    <line x1="0" y1="16" x2="1200" y2="16" stroke="#00FF00" stroke-width="1"/>
    <line x1="0" y1="20" x2="1200" y2="20" stroke="#00FF00" stroke-width="1"/>
    <line x1="0" y1="24" x2="1200" y2="24" stroke="#00FF00" stroke-width="1"/>
    <line x1="0" y1="28" x2="1200" y2="28" stroke="#00FF00" stroke-width="1"/>
    <line x1="0" y1="32" x2="1200" y2="32" stroke="#00FF00" stroke-width="1"/>
    <line x1="0" y1="36" x2="1200" y2="36" stroke="#00FF00" stroke-width="1"/>
    <line x1="0" y1="40" x2="1200" y2="40" stroke="#00FF00" stroke-width="1"/>
    <line x1="0" y1="44" x2="1200" y2="44" stroke="#00FF00" stroke-width="1"/>
    <line x1="0" y1="48" x2="1200" y2="48" stroke="#00FF00" stroke-width="1"/>
    <line x1="0" y1="52" x2="1200" y2="52" stroke="#00FF00" stroke-width="1"/>
    <line x1="0" y1="56" x2="1200" y2="56" stroke="#00FF00" stroke-width="1"/>
    <line x1="0" y1="60" x2="1200" y2="60" stroke="#00FF00" stroke-width="1"/>
    <line x1="0" y1="64" x2="1200" y2="64" stroke="#00FF00" stroke-width="1"/>
    <line x1="0" y1="68" x2="1200" y2="68" stroke="#00FF00" stroke-width="1"/>
    <line x1="0" y1="72" x2="1200" y2="72" stroke="#00FF00" stroke-width="1"/>
    <line x1="0" y1="76" x2="1200" y2="76" stroke="#00FF00" stroke-width="1"/>
  </g>

  <!-- Glow effect at top -->
  <rect x="0" y="0" width="1200" height="200" fill="url(#glowGrad)"/>

  <!-- Cartridge graphic (left side) -->
  <g transform="translate(100, 165)">
    <!-- Cartridge body -->
    <rect x="0" y="0" width="240" height="300" rx="12" fill="#3a3a3a" stroke="#555" stroke-width="4"/>
    <!-- Label area -->
    <rect x="15" y="20" width="210" height="180" rx="6" fill="#1a1a1a" stroke="#00FF00" stroke-width="2"/>
    <!-- Label texture -->
    <g opacity="0.1" stroke="#00FF00" stroke-width="1">
      <line x1="20" y1="35" x2="220" y2="35"/>
      <line x1="20" y1="50" x2="220" y2="50"/>
      <line x1="20" y1="65" x2="220" y2="65"/>
      <line x1="20" y1="80" x2="220" y2="80"/>
    </g>
    <!-- PHLIX on label -->
    <text x="120" y="120" font-family="'Courier New', monospace" font-size="42" font-weight="bold" fill="#00FF00" text-anchor="middle" dominant-baseline="middle">PHLIX</text>
    <!-- Connector pins -->
    <g fill="#FFD700">
      <rect x="20" y="260" width="12" height="30" rx="2"/>
      <rect x="36" y="260" width="12" height="30" rx="2"/>
      <rect x="52" y="260" width="12" height="30" rx="2"/>
      <rect x="68" y="260" width="12" height="30" rx="2"/>
      <rect x="84" y="260" width="12" height="30" rx="2"/>
      <rect x="100" y="260" width="12" height="30" rx="2"/>
      <rect x="116" y="260" width="12" height="30" rx="2"/>
      <rect x="132" y="260" width="12" height="30" rx="2"/>
      <rect x="148" y="260" width="12" height="30" rx="2"/>
      <rect x="164" y="260" width="12" height="30" rx="2"/>
      <rect x="180" y="260" width="12" height="30" rx="2"/>
      <rect x="196" y="260" width="12" height="30" rx="2"/>
    </g>
  </g>

  <!-- Text content (right side) -->
  <text x="420" y="220" font-family="'Courier New', monospace" font-size="24" fill="#888888">SELF-HOSTED MEDIA SERVER</text>

  <text x="420" y="300" font-family="'Courier New', monospace" font-size="64" font-weight="bold" fill="#00FF00">Your media.</text>
  <text x="420" y="380" font-family="'Courier New', monospace" font-size="64" font-weight="bold" fill="#FFD700">Your library.</text>
  <text x="420" y="460" font-family="'Courier New', monospace" font-size="64" font-weight="bold" fill="#C0C0C0">Your Phlix.</text>

  <!-- Tagline -->
  <text x="420" y="540" font-family="'Courier New', monospace" font-size="20" fill="#666666">Open-source media, on your terms.</text>

  <!-- Decorative elements -->
  <rect x="380" y="210" width="4" height="350" rx="2" fill="#00FF00" opacity="0.3"/>

  <!-- Bottom accent line -->
  <rect x="0" y="620" width="1200" height="10" fill="#00FF00" opacity="0.5"/>
</svg>
