<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" width="200" height="60">
  <!-- Game Cartridge Logo for Phlix -->
  <defs>
    <linearGradient id="cartBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3a3a3a"/>
      <stop offset="100%" style="stop-color:#2a2a2a"/>
    </linearGradient>
    <linearGradient id="labelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2D2D2D"/>
      <stop offset="100%" style="stop-color:#1a1a1a"/>
    </linearGradient>
  </defs>

  <!-- Cartridge body -->
  <rect x="10" y="5" width="120" height="50" rx="4" fill="url(#cartBody)" stroke="#555" stroke-width="2"/>

  <!-- Label area -->
  <rect x="15" y="10" width="110" height="35" rx="2" fill="url(#labelGrad)" stroke="#00FF00" stroke-width="1"/>

  <!-- Label texture lines -->
  <g opacity="0.1" stroke="#00FF00" stroke-width="0.5">
    <line x1="17" y1="14" x2="123" y2="14"/>
    <line x1="17" y1="18" x2="123" y2="18"/>
    <line x1="17" y1="22" x2="123" y2="22"/>
  </g>

  <!-- Phlix text -->
  <text x="70" y="32" font-family="'Courier New', monospace" font-size="14" font-weight="bold" fill="#00FF00" text-anchor="middle" dominant-baseline="middle">PHLIX</text>

  <!-- Connector pins -->
  <g fill="#FFD700">
    <rect x="15" y="48" width="4" height="6" rx="1"/>
    <rect x="21" y="48" width="4" height="6" rx="1"/>
    <rect x="27" y="48" width="4" height="6" rx="1"/>
    <rect x="33" y="48" width="4" height="6" rx="1"/>
    <rect x="39" y="48" width="4" height="6" rx="1"/>
    <rect x="45" y="48" width="4" height="6" rx="1"/>
    <rect x="51" y="48" width="4" height="6" rx="1"/>
    <rect x="57" y="48" width="4" height="6" rx="1"/>
    <rect x="63" y="48" width="4" height="6" rx="1"/>
    <rect x="69" y="48" width="4" height="6" rx="1"/>
    <rect x="75" y="48" width="4" height="6" rx="1"/>
    <rect x="81" y="48" width="4" height="6" rx="1"/>
    <rect x="87" y="48" width="4" height="6" rx="1"/>
    <rect x="93" y="48" width="4" height="6" rx="1"/>
    <rect x="99" y="48" width="4" height="6" rx="1"/>
    <rect x="105" y="48" width="4" height="6" rx="1"/>
    <rect x="111" y="48" width="4" height="6" rx="1"/>
    <rect x="117" y="48" width="4" height="6" rx="1"/>
  </g>

  <!-- Slot line decoration -->
  <rect x="130" y="20" width="3" height="25" rx="1" fill="#4A4A4A"/>

  <!-- Media symbols on right side -->
  <g transform="translate(145, 15)">
    <!-- Play button triangle -->
    <polygon points="20,15 5,8 5,22" fill="#00FF00"/>

    <!-- Sound waves -->
    <g stroke="#FFD700" stroke-width="1.5" fill="none" opacity="0.8">
      <path d="M30,8 Q35,15 30,22"/>
      <path d="M35,5 Q42,15 35,25"/>
    </g>
  </g>
</svg>
