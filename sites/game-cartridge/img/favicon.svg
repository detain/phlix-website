<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Game Cartridge Favicon -->
  <rect width="32" height="32" rx="4" fill="#2D2D2D"/>

  <!-- Cartridge body -->
  <rect x="4" y="3" width="18" height="22" rx="2" fill="#3a3a3a" stroke="#555" stroke-width="1"/>

  <!-- Label -->
  <rect x="5" y="4" width="16" height="14" rx="1" fill="#1a1a1a" stroke="#00FF00" stroke-width="0.5"/>

  <!-- PHLIX text -->
  <text x="13" y="13" font-family="'Courier New', monospace" font-size="5" font-weight="bold" fill="#00FF00" text-anchor="middle" dominant-baseline="middle">P</text>

  <!-- Connector pins -->
  <g fill="#FFD700">
    <rect x="5" y="22" width="2" height="4" rx="0.5"/>
    <rect x="8" y="22" width="2" height="4" rx="0.5"/>
    <rect x="11" y="22" width="2" height="4" rx="0.5"/>
    <rect x="14" y="22" width="2" height="4" rx="0.5"/>
    <rect x="17" y="22" width="2" height="4" rx="0.5"/>
  </g>

  <!-- Play indicator -->
  <polygon points="24,11 24,21 30,16" fill="#00FF00"/>
</svg>
