<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1A1A2E"/>
      <stop offset="50%" style="stop-color:#2C3E50"/>
      <stop offset="100%" style="stop-color:#1A1A2E"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#C9A227"/>
      <stop offset="50%" style="stop-color:#F5D76E"/>
      <stop offset="100%" style="stop-color:#C9A227"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" style="stop-color:#C9A227;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#C9A227;stop-opacity:0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Decorative glow -->
  <ellipse cx="600" cy="250" rx="500" ry="300" fill="url(#glow)"/>

  <!-- Cinematic bars -->
  <rect x="0" y="0" width="1200" height="40" fill="#000"/>
  <rect x="0" y="590" width="1200" height="40" fill="#000"/>

  <!-- Logo/Wordmark -->
  <g transform="translate(600, 280)">
    <!-- P letterform -->
    <path d="M-120 -60 L-120 60 L-90 60 L-90 20 L-60 20 C-30 20 -10 -5 -10 -35 C-10 -65 -30 -80 -60 -80 L-120 -80 Z M-90 -55 L-60 -55 C-45 -55 -40 -50 -40 -35 C-40 -20 -45 -15 -60 -15 L-90 -15 L-90 -55 Z" fill="url(#gold)"/>

    <!-- Star accent -->
    <polygon points="-5,-45 0,-25 20,-25 5,-10 10,10 -5,-5 -20,10 -15,-10 -30,-25 -10,-25" fill="#E74C3C"/>

    <!-- h -->
    <path d="M35 -80 L35 60 L50 60 L50 -45 C50 -60 60 -65 70 -65 C80 -65 85 -60 85 -50 L85 60 L100 60 L100 -45 C100 -75 75 -80 65 -80 L35 -80 Z" fill="url(#gold)"/>

    <!-- l -->
    <path d="M115 -80 L115 60 L130 60 L130 -80 Z" fill="url(#gold)"/>

    <!-- i -->
    <path d="M150 -80 L150 -65 C160 -65 165 -60 165 -50 C165 -40 160 -35 150 -35 L150 60 L165 60 L165 -35 C185 -40 190 -60 190 -75 L190 -80 Z" fill="url(#gold)"/>

    <!-- x -->
    <path d="M210 -80 L225 -55 L240 -80 L260 -80 L235 -45 L260 -10 L240 -10 L225 -35 L210 -10 L190 -10 L215 -45 L190 -80 Z" fill="url(#gold)"/>
  </g>

  <!-- Tagline -->
  <text x="600" y="400" font-family="Georgia, serif" font-size="28" fill="#F5F5F5" text-anchor="middle" opacity="0.9">Your media. Your library. Your Phlix.</text>

  <!-- Subtle film frame lines -->
  <rect x="50" y="50" width="1100" height="530" fill="none" stroke="#C9A227" stroke-width="2" opacity="0.2" rx="10"/>
</svg>
