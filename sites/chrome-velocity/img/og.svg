<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <!-- OG social card: Chrome Velocity branding -->
  <defs>
    <linearGradient id="og-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D0D0F"/>
      <stop offset="60%" stop-color="#17181C"/>
      <stop offset="100%" stop-color="#0D0D0F"/>
    </linearGradient>
    <linearGradient id="red-glow" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#CC0000" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#CC0000" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="chrome-text" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#C0C5CE"/>
      <stop offset="50%" stop-color="#F0F2F5"/>
      <stop offset="100%" stop-color="#8A8F9A"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#og-bg)"/>

  <!-- Subtle carbon fiber diagonal grid -->
  <g opacity="0.06" stroke="#C0C5CE" stroke-width="0.5">
    <line x1="0" y1="630" x2="300" y2="0"/>
    <line x1="150" y1="630" x2="450" y2="0"/>
    <line x1="300" y1="630" x2="600" y2="0"/>
    <line x1="450" y1="630" x2="750" y2="0"/>
    <line x1="600" y1="630" x2="900" y2="0"/>
    <line x1="750" y1="630" x2="1050" y2="0"/>
    <line x1="900" y1="630" x2="1200" y2="0"/>
    <line x1="1050" y1="630" x2="1200" y2="330"/>
  </g>

  <!-- Red glow top accent -->
  <rect width="1200" height="200" fill="url(#red-glow)"/>

  <!-- Racing red left bar -->
  <rect x="0" y="0" width="8" height="630" fill="#CC0000"/>

  <!-- Angular divider -->
  <polygon points="0,440 1200,380 1200,420 0,480" fill="#17181C" opacity="0.8"/>
  <line x1="0" y1="445" x2="1200" y2="385" stroke="#CC0000" stroke-width="2" opacity="0.6"/>

  <!-- Product name: Phlix -->
  <text x="80" y="160"
    font-family="'Barlow Condensed', 'Oswald', 'Impact', sans-serif"
    font-weight="800"
    font-size="72"
    letter-spacing="0.04em"
    fill="#F0F2F5">PHLIX</text>

  <!-- Chrome Velocity wordmark -->
  <text x="80" y="240"
    font-family="'Barlow Condensed', 'Oswald', 'Impact', sans-serif"
    font-weight="700"
    font-size="36"
    letter-spacing="0.08em"
    fill="url(#chrome-text)">CHROME VELOCITY</text>

  <!-- Tagline -->
  <text x="80" y="310"
    font-family="'Barlow', 'Inter', sans-serif"
    font-weight="400"
    font-size="24"
    fill="#C0C5CE">Your media. Your library. Your Phlix.</text>

  <!-- Telemetry-style bottom strip -->
  <rect x="0" y="580" width="1200" height="50" fill="#0D0D0F"/>
  <text x="80" y="615"
    font-family="'JetBrains Mono', monospace"
    font-size="14"
    letter-spacing="0.04em"
    fill="#3A3D42">PHRASE: ZERO_LATENCY | LAT: 0.003s | STATUS: FULL_THROTTLE</text>
  <rect x="920" y="590" width="200" height="30" fill="none" stroke="#2A2C32" stroke-width="1"/>
  <rect x="920" y="590" width="140" height="30" fill="#CC0000" opacity="0.8"/>
  <text x="1020" y="610"
    font-family="'JetBrains Mono', monospace"
    font-size="12"
    font-weight="600"
    fill="#F0F2F5"
    text-anchor="middle">70% LOAD</text>

  <!-- Checkered flag motif bottom right -->
  <g transform="translate(1070, 500)">
    <rect width="10" height="10" fill="#F0F2F5"/>
    <rect x="10" y="0" width="10" height="10" fill="#0D0D0F"/>
    <rect x="0" y="10" width="10" height="10" fill="#0D0D0F"/>
    <rect x="10" y="10" width="10" height="10" fill="#F0F2F5"/>
    <rect x="20" y="0" width="10" height="10" fill="#0D0D0F"/>
    <rect x="30" y="0" width="10" height="10" fill="#F0F2F5"/>
    <rect x="20" y="10" width="10" height="10" fill="#F0F2F5"/>
    <rect x="30" y="10" width="10" height="10" fill="#0D0D0F"/>
  </g>
</svg>
