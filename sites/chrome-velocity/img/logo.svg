<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 48" fill="none">
  <!-- Chrome Velocity wordmark in angular parallelogram badge -->
  <!-- Background: carbon black with subtle gradient -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D0D0F"/>
      <stop offset="100%" stop-color="#17181C"/>
    </linearGradient>
    <linearGradient id="red-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#CC0000"/>
      <stop offset="100%" stop-color="#FF6B00"/>
    </linearGradient>
    <linearGradient id="chrome" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#C0C5CE"/>
      <stop offset="40%" stop-color="#E8ECF0"/>
      <stop offset="100%" stop-color="#8A8F9A"/>
    </linearGradient>
    <clipPath id="badge-clip">
      <polygon points="12,0 200,0 188,48 0,48"/>
    </clipPath>
  </defs>

  <!-- Angular parallelogram badge -->
  <polygon points="12,0 200,0 188,48 0,48" fill="url(#bg)" stroke="#2A2C32" stroke-width="1"/>

  <!-- Racing red left accent bar -->
  <polygon points="0,0 6,0 0,48" fill="#CC0000"/>

  <!-- Speed line accent -->
  <line x1="16" y1="38" x2="185" y2="38" stroke="#2A2C32" stroke-width="1"/>

  <!-- Wordmark: CHROME (heavy) -->
  <text x="20" y="33"
    font-family="'Barlow Condensed', 'Oswald', 'Impact', sans-serif"
    font-weight="800"
    font-size="22"
    letter-spacing="-0.02em"
    fill="url(#chrome)">CHROME</text>

  <!-- Wordmark: VELOCITY (slightly lighter) -->
  <text x="108" y="33"
    font-family="'Barlow Condensed', 'Oswald', 'Impact', sans-serif"
    font-weight="700"
    font-size="22"
    letter-spacing="0.01em"
    fill="#F0F2F5">VELOCITY</text>

  <!-- Checkered flag dot accent -->
  <rect x="20" y="42" width="4" height="4" fill="#CC0000"/>
  <rect x="26" y="42" width="4" height="4" fill="#2A2C32"/>
  <rect x="32" y="42" width="4" height="4" fill="#CC0000"/>
</svg>
