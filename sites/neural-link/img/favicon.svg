<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <title>Phlix Neural-Link Favicon</title>
  <rect width="32" height="32" rx="6" fill="#0A0A0A"/>
  <g stroke="#00F2FF" stroke-width="1.5" fill="none">
    <!-- Central neural node -->
    <circle cx="16" cy="16" r="5" fill="#0A0A0A"/>
    <circle cx="16" cy="16" r="2.5" fill="#00F2FF"/>
    <!-- Outer connections -->
    <path d="M16 11 L16 6" opacity="0.7"/>
    <path d="M16 21 L16 26" opacity="0.7"/>
    <path d="M11 16 L6 16" opacity="0.7"/>
    <path d="M21 16 L26 16" opacity="0.7"/>
    <path d="M12.5 12.5 L8.5 8.5" opacity="0.5"/>
    <path d="M19.5 19.5 L23.5 23.5" opacity="0.5"/>
    <path d="M12.5 19.5 L8.5 23.5" opacity="0.5"/>
    <path d="M19.5 12.5 L23.5 8.5" opacity="0.5"/>
    <!-- Outer nodes -->
    <circle cx="16" cy="6" r="2" fill="#0A0A0A"/>
    <circle cx="16" cy="6" r="1" fill="#7B2FFF"/>
    <circle cx="16" cy="26" r="2" fill="#0A0A0A"/>
    <circle cx="16" cy="26" r="1" fill="#00FF9F"/>
    <circle cx="6" cy="16" r="2" fill="#0A0A0A"/>
    <circle cx="6" cy="16" r="1" fill="#00F2FF"/>
    <circle cx="26" cy="16" r="2" fill="#0A0A0A"/>
    <circle cx="26" cy="16" r="1" fill="#7B2FFF"/>
  </g>
</svg>
