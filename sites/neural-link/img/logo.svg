<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" fill="none">
  <title>Phlix Logo</title>
  <!-- Neural network nodes representing media connection -->
  <g stroke="url(#neuralGradient)" stroke-width="1.5" fill="none">
    <!-- Central node -->
    <circle cx="30" cy="30" r="8" fill="#0A0A0A"/>
    <circle cx="30" cy="30" r="4" fill="#00F2FF"/>

    <!-- Connection lines to outer nodes -->
    <path d="M38 30 L55 15" opacity="0.8"/>
    <path d="M38 30 L55 30" opacity="0.8"/>
    <path d="M38 30 L55 45" opacity="0.8"/>
    <path d="M30 22 L30 8" opacity="0.6"/>
    <path d="M30 38 L30 52" opacity="0.6"/>

    <!-- Outer nodes -->
    <circle cx="55" cy="15" r="5" fill="#0A0A0A"/>
    <circle cx="55" cy="15" r="2.5" fill="#7B2FFF"/>

    <circle cx="55" cy="30" r="5" fill="#0A0A0A"/>
    <circle cx="55" cy="30" r="2.5" fill="#00F2FF"/>

    <circle cx="55" cy="45" r="5" fill="#0A0A0A"/>
    <circle cx="55" cy="45" r="2.5" fill="#00FF9F"/>

    <circle cx="30" cy="8" r="4" fill="#0A0A0A"/>
    <circle cx="30" cy="8" r="2" fill="#00F2FF"/>

    <circle cx="30" cy="52" r="4" fill="#0A0A0A"/>
    <circle cx="30" cy="52" r="2" fill="#00FF9F"/>
  </g>

  <!-- Wordmark -->
  <text x="75" y="40" font-family="Orbitron, Rajdhani, sans-serif" font-size="28" font-weight="700" fill="#00F2FF" letter-spacing="0.1em">PHLIX</text>

  <!-- Synaptic pulse on the 'I' -->
  <circle cx="103" cy="18" r="3" fill="#7B2FFF">
    <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
  </circle>

  <defs>
    <linearGradient id="neuralGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FF"/>
      <stop offset="50%" stop-color="#7B2FFF"/>
      <stop offset="100%" stop-color="#00FF9F"/>
    </linearGradient>
  </defs>
</svg>
