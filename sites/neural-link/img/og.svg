<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0A0A"/>
      <stop offset="50%" stop-color="#1A1A2E"/>
      <stop offset="100%" stop-color="#0A0A0A"/>
    </linearGradient>
    <radialGradient id="glow1" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="rgba(0, 242, 255, 0.15)"/>
      <stop offset="100%" stop-color="rgba(0, 242, 255, 0)"/>
    </radialGradient>
    <radialGradient id="glow2" cx="80%" cy="70%" r="50%">
      <stop offset="0%" stop-color="rgba(123, 47, 255, 0.15)"/>
      <stop offset="100%" stop-color="rgba(123, 47, 255, 0)"/>
    </radialGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FF"/>
      <stop offset="100%" stop-color="#7B2FFF"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <rect width="1200" height="630" fill="url(#glow1)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>

  <!-- Neural network visualization (background decoration) -->
  <g stroke="rgba(0, 242, 255, 0.2)" stroke-width="1.5" fill="none">
    <!-- Connection lines -->
    <path d="M100 315 L250 200"/>
    <path d="M100 315 L250 315"/>
    <path d="M100 315 L250 430"/>
    <path d="M250 200 L400 150"/>
    <path d="M250 200 L400 250"/>
    <path d="M250 315 L400 250"/>
    <path d="M250 315 L400 315"/>
    <path d="M250 315 L400 380"/>
    <path d="M250 430 L400 380"/>
    <path d="M250 430 L400 480"/>

    <!-- Nodes -->
    <circle cx="100" cy="315" r="12" fill="#0A0A0A" stroke="#00F2FF"/>
    <circle cx="250" cy="200" r="10" fill="#0A0A0A" stroke="#7B2FFF"/>
    <circle cx="250" cy="315" r="14" fill="#0A0A0A" stroke="#00F2FF"/>
    <circle cx="250" cy="430" r="10" fill="#0A0A0A" stroke="#00FF9F"/>

    <circle cx="400" cy="150" r="8" fill="#0A0A0A" stroke="#7B2FFF"/>
    <circle cx="400" cy="250" r="10" fill="#0A0A0A" stroke="#00F2FF"/>
    <circle cx="400" cy="315" r="12" fill="#0A0A0A" stroke="#00FF9F"/>
    <circle cx="400" cy="380" r="8" fill="#0A0A0A" stroke="#00F2FF"/>
    <circle cx="400" cy="480" r="6" fill="#0A0A0A" stroke="#7B2FFF"/>
  </g>

  <!-- Decorative nodes bottom right -->
  <g stroke="rgba(123, 47, 255, 0.2)" stroke-width="1.5" fill="none">
    <path d="M800 500 L900 480 L1000 500 L1100 520"/>
    <circle cx="800" cy="500" r="8" fill="#0A0A0A" stroke="#7B2FFF"/>
    <circle cx="900" cy="480" r="6" fill="#0A0A0A" stroke="#00FF9F"/>
    <circle cx="1000" cy="500" r="10" fill="#0A0A0A" stroke="#00F2FF"/>
    <circle cx="1100" cy="520" r="8" fill="#0A0A0A" stroke="#7B2FFF"/>
  </g>

  <!-- Main content -->
  <text x="600" y="280" font-family="Orbitron, Rajdhani, sans-serif" font-size="72" font-weight="700" fill="url(#textGrad)" text-anchor="middle" letter-spacing="0.1em">PHLIX</text>

  <text x="600" y="350" font-family="Exo 2, Monda, sans-serif" font-size="28" fill="#E8E8FF" text-anchor="middle" opacity="0.9">Your media. Your library. Your Phlix.</text>

  <!-- Accent line -->
  <rect x="500" y="375" width="200" height="3" rx="1.5" fill="url(#textGrad)" opacity="0.7"/>

  <text x="600" y="420" font-family="Share Tech Mono, monospace" font-size="16" fill="#8888AA" text-anchor="middle">Self-hosted media server</text>
</svg>
