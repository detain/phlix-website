<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" fill="none">
  <title>Phlix</title>
  <desc>Camera lens optics brand logo</desc>

  <!-- Lens barrel outline -->
  <circle cx="30" cy="30" r="22" stroke="#00CED1" stroke-width="2.5" fill="none"/>
  <circle cx="30" cy="30" r="16" stroke="#00CED1" stroke-width="1.5" fill="none"/>
  <circle cx="30" cy="30" r="10" stroke="#FFD700" stroke-width="1" fill="none"/>
  <circle cx="30" cy="30" r="4" fill="#00CED1"/>

  <!-- Focus ring markings -->
  <line x1="52" y1="14" x2="58" y2="14" stroke="#00CED1" stroke-width="2"/>
  <line x1="52" y1="20" x2="56" y2="20" stroke="#00CED1" stroke-width="1.5"/>
  <line x1="52" y1="26" x2="58" y2="26" stroke="#00CED1" stroke-width="2"/>
  <line x1="52" y1="34" x2="56" y2="34" stroke="#00CED1" stroke-width="1.5"/>
  <line x1="52" y1="40" x2="58" y2="40" stroke="#00CED1" stroke-width="2"/>

  <!-- Aperture blade suggestion -->
  <path d="M30 18 L33 24 L30 30 L27 24 Z" fill="#FFD700" opacity="0.6"/>

  <!-- Text -->
  <text x="75" y="38" font-family="'Outfit', 'Source Sans 3', system-ui, sans-serif" font-size="28" font-weight="700" fill="#FFFFFF">Phlix</text>

  <!-- Lens flare accent -->
  <circle cx="12" cy="18" r="3" fill="#FFD700" opacity="0.4"/>
  <circle cx="48" cy="42" r="2" fill="#00CED1" opacity="0.3"/>
</svg>
