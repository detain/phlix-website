<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <title>Phlix — Your media. Your library. Your Phlix.</title>
  <desc>Open Graph image for Phlix media server</desc>

  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D0D0D"/>
      <stop offset="50%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0D0D0D"/>
    </linearGradient>
    <radialGradient id="glowCyan" cx="30%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#00CED1" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#00CED1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowGold" cx="70%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#FFD700" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#FFD700" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Decorative gradients -->
  <rect width="1200" height="630" fill="url(#glowCyan)"/>
  <rect width="1200" height="630" fill="url(#glowGold)"/>

  <!-- Aperture rings decoration -->
  <g transform="translate(120, 315)" opacity="0.15">
    <circle cx="0" cy="0" r="200" stroke="#00CED1" stroke-width="1" fill="none"/>
    <circle cx="0" cy="0" r="170" stroke="#00CED1" stroke-width="0.5" fill="none"/>
    <circle cx="0" cy="0" r="140" stroke="#00CED1" stroke-width="0.5" fill="none"/>
    <circle cx="0" cy="0" r="110" stroke="#FFD700" stroke-width="0.5" fill="none"/>
    <circle cx="0" cy="0" r="80" stroke="#00CED1" stroke-width="0.5" fill="none"/>
  </g>

  <!-- Lens icon -->
  <g transform="translate(200, 315)">
    <circle cx="0" cy="0" r="70" stroke="#00CED1" stroke-width="3" fill="none"/>
    <circle cx="0" cy="0" r="52" stroke="#00CED1" stroke-width="2" fill="none"/>
    <circle cx="0" cy="0" r="34" stroke="#FFD700" stroke-width="1.5" fill="none"/>
    <circle cx="0" cy="0" r="12" fill="#00CED1"/>
    <!-- Lens flare -->
    <circle cx="-40" cy="-40" r="8" fill="#FFD700" opacity="0.5"/>
    <circle cx="45" cy="35" r="4" fill="#00CED1" opacity="0.4"/>
  </g>

  <!-- Text -->
  <text x="360" y="285" font-family="'Outfit', system-ui, sans-serif" font-size="72" font-weight="800" fill="#FFFFFF">Phlix</text>
  <text x="360" y="350" font-family="'Source Sans 3', system-ui, sans-serif" font-size="28" font-weight="400" fill="#00CED1">Your media. Your library. Your Phlix.</text>

  <!-- Footer accent -->
  <rect x="360" y="380" width="200" height="4" rx="2" fill="#00CED1" opacity="0.6"/>

  <!-- Focus ring tick marks -->
  <g transform="translate(1000, 315)" stroke="#00CED1" stroke-width="2" opacity="0.3">
    <line x1="0" y1="-80" x2="30" y2="-80"/>
    <line x1="0" y1="-50" x2="20" y2="-50"/>
    <line x1="0" y1="-20" x2="30" y2="-20"/>
    <line x1="0" y1="10" x2="20" y2="10"/>
    <line x1="0" y1="40" x2="30" y2="40"/>
    <line x1="0" y1="70" x2="20" y2="70"/>
  </g>
</svg>
