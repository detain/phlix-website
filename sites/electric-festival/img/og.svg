<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D0D0D"/>
      <stop offset="50%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#0D0D0D"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9D00FF"/>
      <stop offset="50%" stop-color="#00FF9D"/>
      <stop offset="100%" stop-color="#FF0099"/>
    </linearGradient>
    <radialGradient id="glow1" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="rgba(157,0,255,0.3)"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <radialGradient id="glow2" cx="80%" cy="70%" r="50%">
      <stop offset="0%" stop-color="rgba(255,0,153,0.2)"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Neon grid pattern -->
  <g opacity="0.3">
    <line x1="0" y1="0" x2="0" y2="630" stroke="#9D00FF" stroke-width="0.5"/>
    <line x1="100" y1="0" x2="100" y2="630" stroke="#9D00FF" stroke-width="0.5"/>
    <line x1="200" y1="0" x2="200" y2="630" stroke="#9D00FF" stroke-width="0.5"/>
    <line x1="300" y1="0" x2="300" y2="630" stroke="#9D00FF" stroke-width="0.5"/>
    <line x1="400" y1="0" x2="400" y2="630" stroke="#9D00FF" stroke-width="0.5"/>
    <line x1="500" y1="0" x2="500" y2="630" stroke="#9D00FF" stroke-width="0.5"/>
    <line x1="600" y1="0" x2="600" y2="630" stroke="#9D00FF" stroke-width="0.5"/>
    <line x1="700" y1="0" x2="700" y2="630" stroke="#9D00FF" stroke-width="0.5"/>
    <line x1="800" y1="0" x2="800" y2="630" stroke="#9D00FF" stroke-width="0.5"/>
    <line x1="900" y1="0" x2="900" y2="630" stroke="#9D00FF" stroke-width="0.5"/>
    <line x1="1000" y1="0" x2="1000" y2="630" stroke="#9D00FF" stroke-width="0.5"/>
    <line x1="1100" y1="0" x2="1100" y2="630" stroke="#9D00FF" stroke-width="0.5"/>
    <line x1="1200" y1="0" x2="1200" y2="630" stroke="#9D00FF" stroke-width="0.5"/>
    <line x1="0" y1="0" x2="1200" y2="0" stroke="#9D00FF" stroke-width="0.5"/>
    <line x1="0" y1="100" x2="1200" y2="100" stroke="#9D00FF" stroke-width="0.5"/>
    <line x1="0" y1="200" x2="1200" y2="200" stroke="#9D00FF" stroke-width="0.5"/>
    <line x1="0" y1="300" x2="1200" y2="300" stroke="#9D00FF" stroke-width="0.5"/>
    <line x1="0" y1="400" x2="1200" y2="400" stroke="#9D00FF" stroke-width="0.5"/>
    <line x1="0" y1="500" x2="1200" y2="500" stroke="#9D00FF" stroke-width="0.5"/>
    <line x1="0" y1="600" x2="1200" y2="600" stroke="#9D00FF" stroke-width="0.5"/>
    <line x1="0" y1="630" x2="1200" y2="630" stroke="#9D00FF" stroke-width="0.5"/>
  </g>

  <!-- Glow overlays -->
  <ellipse cx="240" cy="190" rx="300" ry="250" fill="url(#glow1)"/>
  <ellipse cx="960" cy="440" rx="350" ry="280" fill="url(#glow2)"/>

  <!-- Logo mark with glow -->
  <g transform="translate(600, 230)" filter="url(#glow)">
    <!-- Outer ring -->
    <circle cx="0" cy="0" r="60" stroke="url(#textGrad)" stroke-width="6" fill="none"/>
    <!-- Inner P shape -->
    <path d="M-15 -40 L-15 40 L15 40 L15 25 Q15 10 30 5 L30 -5 Q15 -10 15 -25 L15 -40 Z" fill="#9D00FF"/>
    <!-- Lightning accent -->
    <path d="M35 -20 L50 -35 L42 -35 L55 -55 L38 -35 L48 -35 Z" fill="#00FF9D"/>
  </g>

  <!-- Phlix wordmark -->
  <text x="600" y="370" font-family="'Orbitron', 'Rajdhani', system-ui, sans-serif" font-weight="700" font-size="72" fill="url(#textGrad)" text-anchor="middle" filter="url(#glow)">Phlix</text>

  <!-- Tagline -->
  <text x="600" y="440" font-family="'Exo 2', 'Exo 2 Regular', system-ui, sans-serif" font-size="28" fill="#999999" text-anchor="middle">Your media. Your library. Your Phlix.</text>

  <!-- Decorative line -->
  <line x1="400" y1="480" x2="800" y2="480" stroke="url(#textGrad)" stroke-width="2" opacity="0.5"/>
</svg>
