<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" fill="none">
  <!-- Phlix logo wordmark with neon glow -->
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9D00FF"/>
      <stop offset="50%" stop-color="#00FF9D"/>
      <stop offset="100%" stop-color="#FF0099"/>
    </linearGradient>
  </defs>

  <!-- Stylized "P" mark with lightning bolt energy -->
  <g filter="url(#glow)">
    <!-- Outer ring -->
    <circle cx="30" cy="30" r="22" stroke="url(#textGrad)" stroke-width="3" fill="none"/>
    <!-- Inner P shape -->
    <path d="M25 16 L25 44 L38 44 L38 35 Q38 28 44 26 L44 22 Q38 20 38 16 Z" fill="#9D00FF"/>
    <!-- Lightning accent -->
    <path d="M42 20 L48 14 L44 14 L50 8 L44 14 L48 14 Z" fill="#00FF9D"/>
  </g>

  <!-- Wordmark -->
  <text x="65" y="42" font-family="'Orbitron', 'Rajdhani', system-ui, sans-serif" font-weight="700" font-size="28" fill="url(#textGrad)">Phlix</text>
</svg>
