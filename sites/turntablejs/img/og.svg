<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <!-- Background -->
  <rect width="1200" height="630" fill="#0A0A0A"/>

  <!-- Decorative grid -->
  <g opacity="0.1">
    <line x1="0" y1="157" x2="1200" y2="157" stroke="#1DB954" stroke-width="1"/>
    <line x1="0" y1="315" x2="1200" y2="315" stroke="#1DB954" stroke-width="1"/>
    <line x1="0" y1="472" x2="1200" y2="472" stroke="#1DB954" stroke-width="1"/>
    <line x1="300" y1="0" x2="300" y2="630" stroke="#1DB954" stroke-width="1"/>
    <line x1="600" y1="0" x2="600" y2="630" stroke="#1DB954" stroke-width="1"/>
    <line x1="900" y1="0" x2="900" y2="630" stroke="#1DB954" stroke-width="1"/>
  </g>

  <!-- Large vinyl record -->
  <g transform="translate(200, 315)">
    <!-- Outer ring glow -->
    <circle cx="0" cy="0" r="220" fill="none" stroke="#1DB954" stroke-width="2" opacity="0.3"/>
    <!-- Vinyl body -->
    <circle cx="0" cy="0" r="200" fill="#1A1A1A" stroke="#333333" stroke-width="2"/>
    <!-- Grooves -->
    <circle cx="0" cy="0" r="170" fill="none" stroke="#333333" stroke-width="1"/>
    <circle cx="0" cy="0" r="140" fill="none" stroke="#333333" stroke-width="1"/>
    <circle cx="0" cy="0" r="110" fill="none" stroke="#333333" stroke-width="1"/>
    <circle cx="0" cy="0" r="80" fill="none" stroke="#333333" stroke-width="1"/>
    <!-- Label -->
    <circle cx="0" cy="0" r="50" fill="#1DB954"/>
    <!-- Center hole -->
    <circle cx="0" cy="0" r="15" fill="#0A0A0A"/>
  </g>

  <!-- Text content -->
  <g transform="translate(550, 280)">
    <!-- PHLIX wordmark -->
    <text x="0" y="0" font-family="Oswald, Impact, Arial Black, sans-serif" font-size="120" font-weight="700" fill="#FFFFFF" letter-spacing="8">PHLIX</text>
    <!-- Tagline -->
    <text x="0" y="60" font-family="Roboto, Helvetica, Arial, sans-serif" font-size="32" font-weight="400" fill="#999999">Your media. Your library. Your terms.</text>
    <!-- Accent line -->
    <rect x="0" y="90" width="200" height="4" fill="#1DB954"/>
  </g>

  <!-- LED indicators -->
  <g transform="translate(550, 400)">
    <circle cx="0" cy="0" r="8" fill="#1DB954">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="30" cy="0" r="8" fill="#1DB954" opacity="0.7">
      <animate attributeName="opacity" values="0.7;0.3;0.7" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="60" cy="0" r="8" fill="#FF6B6B" opacity="0.5">
      <animate attributeName="opacity" values="0.5;0.8;0.5" dur="1.8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Corner accent -->
  <rect x="0" y="0" width="8" height="630" fill="#1DB954"/>
  <rect x="1192" y="0" width="8" height="630" fill="#1DB954"/>
  <rect x="0" y="0" width="1200" height="8" fill="#1DB954"/>
  <rect x="0" y="622" width="1200" height="8" fill="#1DB954"/>
</svg>