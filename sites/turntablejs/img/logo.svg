<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 40" fill="none">
  <!-- Vinyl record logo -->
  <g transform="translate(0, 0)">
    <!-- Vinyl record -->
    <circle cx="20" cy="20" r="16" fill="#0A0A0A" stroke="#1DB954" stroke-width="1"/>
    <!-- Grooves -->
    <circle cx="20" cy="20" r="12" fill="none" stroke="#333333" stroke-width="0.5"/>
    <circle cx="20" cy="20" r="9" fill="none" stroke="#333333" stroke-width="0.5"/>
    <circle cx="20" cy="20" r="6" fill="none" stroke="#333333" stroke-width="0.5"/>
    <!-- Center label -->
    <circle cx="20" cy="20" r="4" fill="#1DB954"/>
    <!-- Center hole -->
    <circle cx="20" cy="20" r="1.5" fill="#0A0A0A"/>
  </g>
  <!-- PHLIX text -->
  <text x="42" y="27" font-family="Oswald, Impact, Arial Black, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" letter-spacing="2">PHLIX</text>
</svg>