<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Phlix social card">
  <title>Phlix — Your media. Your library. Your Phlix.</title>

  <!-- Deep purple dungeon background -->
  <rect width="1200" height="630" fill="#1A0A2E"/>

  <!-- Radial glow effect -->
  <defs>
    <radialGradient id="glow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#3D2066" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#1A0A2E" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#CC9900"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Decorative corner shields -->
  <g transform="translate(40, 40)">
    <path d="M0 20 L20 0 L40 0 L40 40 Q40 50 20 50 Q0 50 0 40 Z" fill="#251540" stroke="#FFD700" stroke-width="2"/>
    <path d="M12 30 L12 20 L20 12 L28 20 L28 30 Q28 35 20 36 Q12 35 12 30 Z" fill="#FFD700"/>
  </g>
  <g transform="translate(1120, 40)">
    <path d="M40 20 L20 0 L0 0 L0 40 Q0 50 20 50 Q40 50 40 40 Z" fill="#251540" stroke="#FFD700" stroke-width="2"/>
    <path d="M28 30 L28 20 L20 12 L12 20 L12 30 Q12 35 20 36 Q28 35 28 30 Z" fill="#FFD700"/>
  </g>
  <g transform="translate(40, 540)">
    <path d="M0 20 L20 0 L40 0 L40 40 Q40 50 20 50 Q0 50 0 40 Z" fill="#251540" stroke="#FFD700" stroke-width="2"/>
    <path d="M12 30 L12 20 L20 12 L28 20 L28 30 Q28 35 20 36 Q12 35 12 30 Z" fill="#FFD700"/>
  </g>
  <g transform="translate(1120, 540)">
    <path d="M40 20 L20 0 L0 0 L0 40 Q0 50 20 50 Q40 50 40 40 Z" fill="#251540" stroke="#FFD700" stroke-width="2"/>
    <path d="M28 30 L28 20 L20 12 L12 20 L12 30 Q28 35 20 36 Q28 35 28 30 Z" fill="#FFD700"/>
  </g>

  <!-- Central content area -->
  <g transform="translate(600, 280)">

    <!-- Shield with play button as logo -->
    <g transform="translate(0, -100)">
      <path d="M-60 -50 L0 -70 L60 -50 L60 40 Q60 70 0 80 Q-60 70 -60 40 Z" fill="#251540" stroke="#FFD700" stroke-width="4"/>
      <path d="M-45 -35 L0 -50 L45 -35 L45 25 Q45 50 0 55 Q-45 50 -45 25 Z" fill="none" stroke="#8B4513" stroke-width="2" opacity="0.5"/>
      <path d="M-20 -15 L-20 15 L25 0 Z" fill="#FFD700"/>
    </g>

    <!-- Wordmark -->
    <text x="0" y="-20" font-family="'Times New Roman', serif" font-size="72" fill="#FFD700" text-anchor="middle" letter-spacing="12" font-weight="bold">
      PHLIX
    </text>

    <!-- Glow behind wordmark -->
    <text x="0" y="-20" font-family="'Times New Roman', serif" font-size="72" fill="none" stroke="#FFD700" stroke-width="2" text-anchor="middle" letter-spacing="12" opacity="0.4" filter="url(#glow)">
      PHLIX
    </text>

    <!-- Tagline -->
    <text x="0" y="30" font-family="'Helvetica Neue', sans-serif" font-size="28" fill="#F5E6D3" text-anchor="middle" letter-spacing="2">
      Your media. Your library. Your Phlix.
    </text>

    <!-- Divider line -->
    <rect x="-300" y="55" width="600" height="3" fill="#FFD700" opacity="0.4"/>
    <rect x="-200" y="62" width="400" height="1" fill="#FFD700" opacity="0.2"/>

    <!-- Feature bullets (compact) -->
    <text x="0" y="95" font-family="'Helvetica Neue', sans-serif" font-size="16" fill="#A890B8" text-anchor="middle">
      Self-hosted PHP media server
    </text>
    <text x="0" y="125" font-family="'Helvetica Neue', sans-serif" font-size="16" fill="#A890B8" text-anchor="middle">
      Roku · Samsung Tizen · Windows · Mobile · DLNA
    </text>
    <text x="0" y="155" font-family="'Helvetica Neue', sans-serif" font-size="16" fill="#A890B8" text-anchor="middle">
      SyncPlay · Live TV · Transcoding · Plugin system
    </text>

    <!-- Bottom badge -->
    <rect x="-120" y="190" width="240" height="40" rx="6" fill="#FFD700"/>
    <text x="0" y="216" font-family="'Helvetica Neue', sans-serif" font-size="16" fill="#1A0A2E" text-anchor="middle" font-weight="bold" letter-spacing="2">
      OPEN SOURCE • MPL-2.0
    </text>
  </g>

  <!-- Top accent bar -->
  <rect x="0" y="0" width="1200" height="8" fill="#FFD700" opacity="0.6"/>
  <rect x="0" y="0" width="400" height="3" fill="#FFD700"/>

  <!-- Bottom accent bar -->
  <rect x="0" y="622" width="1200" height="8" fill="#FFD700" opacity="0.6"/>
  <rect x="800" y="627" width="400" height="3" fill="#FFD700"/>
</svg>
