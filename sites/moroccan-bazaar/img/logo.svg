<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 80" role="img" aria-label="Phlix Moroccan Bazaar logo">
  <title>Phlix — Moroccan Bazaar</title>
  <defs>
    <linearGradient id="soukGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8531A"/>
      <stop offset="100%" stop-color="#B87828"/>
    </linearGradient>
    <filter id="copperGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Zellige eight-pointed star decorative element -->
  <g transform="translate(20, 18)" opacity="0.85">
    <polygon points="20,0 23.5,11 35,11 25.5,17.5 29,28.5 20,22 11,28.5 14.5,17.5 5,11 16.5,11"
      fill="none" stroke="#B87828" stroke-width="1.2"/>
    <polygon points="20,8 22,14.5 28.5,14.5 23.5,18 25.5,24 20,20.5 14.5,24 16.5,18 11.5,14.5 18,14.5"
      fill="#B87828" opacity="0.35"/>
  </g>
  <!-- Wordmark "Phlix" -->
  <text x="68" y="42"
    font-family="Cormorant Garamond, Georgia, serif"
    font-weight="700"
    font-size="38"
    letter-spacing="-0.01em"
    fill="#F2E4CC">Phlix</text>
  <!-- Tagline in Cinzel -->
  <text x="68" y="60"
    font-family="Cinzel, 'Trajan Pro', serif"
    font-weight="400"
    font-size="10"
    letter-spacing="0.18em"
    fill="#B87828"
    text-transform="uppercase">Moroccan Bazaar</text>
  <!-- Subtle lantern glow accent under text -->
  <rect x="68" y="66" width="140" height="1.5" rx="1" fill="url(#soukGrad)" opacity="0.5"/>
</svg>
