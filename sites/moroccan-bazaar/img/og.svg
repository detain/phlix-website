<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Phlix Moroccan Bazaar — Every Frame, a Masterwork.">
  <title>Phlix — Moroccan Bazaar</title>
  <defs>
    <linearGradient id="ogGradBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A0A04"/>
      <stop offset="50%" stop-color="#140A04"/>
      <stop offset="100%" stop-color="#0A0602"/>
    </linearGradient>
    <radialGradient id="ogLantern" cx="50%" cy="45%" r="45%">
      <stop offset="0%" stop-color="rgba(184,120,40,0.22)"/>
      <stop offset="60%" stop-color="rgba(232,83,26,0.08)"/>
      <stop offset="100%" stop-color="rgba(20,10,4,0)"/>
    </radialGradient>
    <linearGradient id="ogGradLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E8531A" stop-opacity="0"/>
      <stop offset="50%" stop-color="#B87828"/>
      <stop offset="100%" stop-color="#E8531A" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#ogGradBg)"/>
  <!-- Lantern glow -->
  <ellipse cx="600" cy="280" rx="500" ry="320" fill="url(#ogLantern)"/>
  <!-- Zellige star watermark -->
  <g transform="translate(600, 280)" opacity="0.08">
    <polygon points="0,-120 21,56 120,56 35,91 63,200 0,120 -63,200 -35,91 -120,56 -21,56"
      fill="none" stroke="#B87828" stroke-width="2"/>
  </g>
  <!-- "Phlix" headline -->
  <text x="600" y="220"
    text-anchor="middle"
    font-family="Cormorant Garamond, Georgia, serif"
    font-weight="700"
    font-size="120"
    letter-spacing="-0.02em"
    fill="#F2E4CC">Phlix</text>
  <!-- Decorative line -->
  <rect x="400" y="245" width="400" height="2" rx="1" fill="url(#ogGradLine)"/>
  <!-- Tagline -->
  <text x="600" y="295"
    text-anchor="middle"
    font-family="Cinzel, 'Trajan Pro', serif"
    font-weight="400"
    font-size="32"
    letter-spacing="0.12em"
    fill="#B87828">Moroccan Bazaar</text>
  <!-- Sub-tagline -->
  <text x="600" y="350"
    text-anchor="middle"
    font-family="Cinzel, 'Trajan Pro', serif"
    font-weight="400"
    font-size="22"
    letter-spacing="0.08em"
    fill="rgba(242,228,204,0.55)">Every Frame, a Masterwork.</text>
  <!-- Bottom bar -->
  <rect x="0" y="560" width="1200" height="70" fill="#200E06"/>
  <text x="600" y="600"
    text-anchor="middle"
    font-family="Cinzel, 'Trajan Pro', serif"
    font-weight="400"
    font-size="18"
    letter-spacing="0.15em"
    fill="rgba(242,228,204,0.6)">Self-Hosted Media Server</text>
  <!-- Corner stars -->
  <g opacity="0.25">
    <polygon points="60,60 63,70 73,70 65,76 68,86 60,80 52,86 55,76 47,70 57,70" fill="#B87828"/>
    <polygon points="1140,60 1143,70 1153,70 1145,76 1148,86 1140,80 1132,86 1135,76 1127,70 1137,70" fill="#B87828"/>
    <polygon points="60,570 63,580 73,580 65,586 68,596 60,590 52,596 55,586 47,580 57,580" fill="#B87828"/>
    <polygon points="1140,570 1143,580 1153,580 1145,586 1148,596 1140,590 1132,596 1135,586 1127,580 1137,580" fill="#B87828"/>
  </g>
</svg>
