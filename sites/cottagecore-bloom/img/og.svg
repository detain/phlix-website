<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Warm ivory background gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFF8F2"/>
      <stop offset="100%" stop-color="#FFF3E8"/>
    </linearGradient>
    <!-- Subtle linen texture -->
    <filter id="linen">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="4" result="noise"/>
      <feColorMatrix type="saturate" values="0" in="noise" result="gray"/>
      <feBlend in="SourceGraphic" in2="gray" mode="multiply" result="blend"/>
      <feComposite in="blend" in2="SourceGraphic" operator="in"/>
    </filter>
    <!-- Rose glow -->
    <radialGradient id="roseGlow" cx="50%" cy="60%" r="40%">
      <stop offset="0%" stop-color="#C8556A" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#C8556A" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Botanical corner accent - top left -->
  <g transform="translate(0,0)" opacity="0.25">
    <ellipse cx="60" cy="60" rx="55" ry="40" fill="#C8556A" transform="rotate(-20 60 60)"/>
    <ellipse cx="90" cy="40" rx="40" ry="25" fill="#7A9E6B" transform="rotate(10 90 40)"/>
    <ellipse cx="40" cy="100" rx="35" ry="20" fill="#8B7AB5" transform="rotate(-40 40 100)"/>
    <circle cx="100" cy="80" r="15" fill="#C8556A" opacity="0.5"/>
  </g>

  <!-- Botanical corner accent - bottom right -->
  <g transform="translate(1200,630) rotate(180)" opacity="0.2">
    <ellipse cx="60" cy="60" rx="55" ry="40" fill="#C8556A" transform="rotate(-20 60 60)"/>
    <ellipse cx="90" cy="40" rx="40" ry="25" fill="#7A9E6B" transform="rotate(10 90 40)"/>
    <circle cx="100" cy="80" r="15" fill="#C8556A" opacity="0.5"/>
  </g>

  <!-- Rose radial glow behind center -->
  <ellipse cx="600" cy="380" rx="500" ry="300" fill="url(#roseGlow)"/>

  <!-- Center content -->
  <!-- Wordmark -->
  <text x="600" y="260" text-anchor="middle" font-family="Georgia, serif" font-size="72" font-weight="bold" font-style="italic" fill="#2A1A10" letter-spacing="-2">Phlix</text>

  <!-- Tagline -->
  <text x="600" y="330" text-anchor="middle" font-family="Georgia, serif" font-size="28" fill="#2A1A10" opacity="0.7">Where Every Story Blooms.</text>

  <!-- Decorative botanical divider -->
  <line x1="350" y1="370" x2="500" y2="370" stroke="#E8D5C4" stroke-width="1"/>
  <circle cx="525" cy="370" r="5" fill="#C8556A" opacity="0.6"/>
  <circle cx="600" cy="370" r="6" fill="#C8556A" opacity="0.8"/>
  <circle cx="675" cy="370" r="5" fill="#C8556A" opacity="0.6"/>
  <line x1="700" y1="370" x2="850" y2="370" stroke="#E8D5C4" stroke-width="1"/>

  <!-- Subtitle -->
  <text x="600" y="420" text-anchor="middle" font-family="Georgia, serif" font-size="20" fill="#B0A090">Self-hosted media server — Roku, Tizen, Windows, Mobile + DLNA</text>

  <!-- Bottom petal decorations -->
  <g transform="translate(600,520)" opacity="0.2">
    <ellipse cx="-180" cy="0" rx="30" ry="18" fill="#C8556A" transform="rotate(-15)"/>
    <ellipse cx="-100" cy="-10" rx="25" ry="15" fill="#7A9E6B" transform="rotate(10)"/>
    <ellipse cx="0" cy="-15" rx="35" ry="20" fill="#C8556A" transform="rotate(-5)"/>
    <ellipse cx="100" cy="-10" rx="25" ry="15" fill="#8B7AB5" transform="rotate(15)"/>
    <ellipse cx="180" cy="0" rx="30" ry="18" fill="#7A9E6B" transform="rotate(-10)"/>
  </g>
</svg>
