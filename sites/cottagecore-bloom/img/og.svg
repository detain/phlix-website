<!-- Cottagecore Bloom OG image — 1200x630 social share card -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Phlix social sharing image">
  <title>Phlix — Where Every Story Blooms</title>
  <desc>Social sharing image for the Cottagecore Bloom brand of Phlix media server</desc>

  <!-- Background — warm ivory gradient -->
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF8F2"/>
      <stop offset="100%" stop-color="#FDEEDE"/>
    </linearGradient>
    <linearGradient id="hero-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(200,85,106,0.15)"/>
      <stop offset="100%" stop-color="rgba(139,122,181,0.10)"/>
    </linearGradient>
    <radialGradient id="rose-glow" cx="30%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(200,85,106,0.20)"/>
      <stop offset="100%" stop-color="rgba(200,85,106,0)"/>
    </radialGradient>
  </defs>

  <!-- Base background -->
  <rect width="1200" height="630" fill="url(#bg-grad)"/>

  <!-- Subtle botanical washes -->
  <ellipse cx="200" cy="500" rx="300" ry="200" fill="url(#rose-glow)" opacity="0.5"/>
  <ellipse cx="1000" cy="150" rx="250" ry="180" fill="rgba(139,122,181,0.08)" opacity="0.6"/>
  <ellipse cx="600" cy="630" rx="400" ry="150" fill="rgba(122,158,107,0.06)" opacity="0.4"/>

  <!-- Decorative border — petal blush -->
  <rect x="20" y="20" width="1160" height="590" rx="16" fill="none" stroke="#E8D5C4" stroke-width="1"/>

  <!-- Botanical corner accents — top right -->
  <g transform="translate(1100, 60)" opacity="0.4">
    <!-- Rose bloom -->
    <circle cx="0" cy="0" r="18" fill="none" stroke="#C8556A" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="10" fill="rgba(200,85,106,0.2)"/>
    <!-- Stem and leaves -->
    <path d="M0 18 Q2 30 8 40" stroke="#7A9E6B" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <path d="M2 24 Q-8 20 -12 12" stroke="#7A9E6B" stroke-width="1.2" fill="none" stroke-linecap="round"/>
    <path d="M4 30 Q14 26 18 18" stroke="#7A9E6B" stroke-width="1.2" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Botanical corner accents — bottom left -->
  <g transform="translate(80, 560)" opacity="0.35">
    <path d="M0 0 Q4 8 10 14 Q6 10 0 0" fill="#8B7AB5" opacity="0.4"/>
    <path d="M10 14 Q16 10 20 4" stroke="#7A9E6B" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <path d="M4 6 Q-6 8 -10 16" stroke="#7A9E6B" stroke-width="1.2" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Logo lockup — centered -->
  <g transform="translate(600, 220)">
    <!-- Rose motif above wordmark -->
    <g transform="translate(0, -50)" opacity="0.7">
      <circle cx="-12" cy="0" r="6" fill="none" stroke="#C8556A" stroke-width="1.5"/>
      <circle cx="0" cy="-8" r="5" fill="none" stroke="#8B7AB5" stroke-width="1.2"/>
      <circle cx="12" cy="0" r="6" fill="none" stroke="#7A9E6B" stroke-width="1.2"/>
      <path d="M0 8 L0 16" stroke="#B0A090" stroke-width="1"/>
    </g>

    <!-- Wordmark -->
    <text x="0" y="0"
          font-family="Georgia, 'Times New Roman', serif"
          font-style="italic"
          font-weight="700"
          font-size="72"
          fill="#2A1A10"
          text-anchor="middle"
          letter-spacing="-0.03em">Phlix</text>
  </g>

  <!-- Tagline -->
  <text x="600" y="300"
        font-family="Georgia, serif"
        font-style="italic"
        font-size="28"
        fill="#C8556A"
        text-anchor="middle"
        opacity="0.85">Where Every Story Blooms.</text>

  <!-- Tagline secondary -->
  <text x="600" y="420"
        font-family="Georgia, serif"
        font-size="20"
        fill="#2A1A10"
        text-anchor="middle"
        opacity="0.65">Self-hosted media server for Roku, Samsung TV, Windows &amp; mobile</text>

  <!-- CTA hint -->
  <text x="600" y="520"
        font-family="Georgia, serif"
        font-size="18"
        fill="#7A9E6B"
        text-anchor="middle"
        opacity="0.8">Get Phlix →</text>
</svg>
