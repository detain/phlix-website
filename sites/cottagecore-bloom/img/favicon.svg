<!-- Cottagecore Bloom favicon — Primrose the bumble bee on Garden Rose -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Phlix — Cottagecore Bloom">
  <title>Phlix — Primrose the bumble bee mascot</title>
  <desc>Favicon featuring Primrose the bumble bee in the Cottagecore Bloom brand palette</desc>

  <!-- Garden Rose background square -->
  <rect width="32" height="32" rx="6" fill="#C8556A"/>

  <!-- Bumble bee body — warm amber -->
  <ellipse cx="16" cy="18" rx="7" ry="5.5" fill="#C47B2B"/>
  <!-- Bee stripes -->
  <ellipse cx="16" cy="16.5" rx="7" ry="1.5" fill="#2A1A10" opacity="0.4"/>
  <ellipse cx="16" cy="19.5" rx="7" ry="1.5" fill="#2A1A10" opacity="0.3"/>

  <!-- Bee head -->
  <circle cx="16" cy="12" r="3.5" fill="#C47B2B"/>
  <!-- Bee eyes -->
  <circle cx="14.5" cy="11.5" r="0.9" fill="#2A1A10" opacity="0.6"/>
  <circle cx="17.5" cy="11.5" r="0.9" fill="#2A1A10" opacity="0.6"/>

  <!-- Wings — soft lavender, watercolour feel -->
  <ellipse cx="10" cy="12" rx="4" ry="2.5" fill="#8B7AB5" opacity="0.45" transform="rotate(-25 10 12)"/>
  <ellipse cx="22" cy="12" rx="4" ry="2.5" fill="#8B7AB5" opacity="0.45" transform="rotate(25 22 12)"/>
  <!-- Wing details / veins -->
  <path d="M8 11.5 Q10 10 12 11.5" stroke="#8B7AB5" stroke-width="0.5" fill="none" opacity="0.6"/>
  <path d="M20 11.5 Q22 10 24 11.5" stroke="#8B7AB5" stroke-width="0.5" fill="none" opacity="0.6"/>

  <!-- Flower crown on bee — tiny wildflowers -->
  <circle cx="12" cy="9" r="1.5" fill="#C8556A" opacity="0.8"/>
  <circle cx="16" cy="8" r="1.5" fill="#8B7AB5" opacity="0.7"/>
  <circle cx="20" cy="9" r="1.5" fill="#7A9E6B" opacity="0.7"/>
  <!-- Crown stems -->
  <path d="M12 10.5 Q14 9 16 8 Q18 9 20 10.5" stroke="#7A9E6B" stroke-width="0.7" fill="none" opacity="0.7"/>

  <!-- Tiny antennae -->
  <path d="M14.5 9 Q13.5 7 12.5 6.5" stroke="#2A1A10" stroke-width="0.7" fill="none" stroke-linecap="round" opacity="0.5"/>
  <path d="M17.5 9 Q18.5 7 19.5 6.5" stroke="#2A1A10" stroke-width="0.7" fill="none" stroke-linecap="round" opacity="0.5"/>
</svg>
