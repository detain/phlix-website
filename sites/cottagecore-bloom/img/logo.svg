<!-- Cottagecore Bloom logo — Playfair Display italic wordmark + climbing-rose botanical motif -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" role="img" aria-label="Phlix logo">
  <title>Phlix</title>
  <desc>Cottagecore Bloom brand logo for Phlix — a climbing rose botanical with Playfair Display italic wordmark on warm ivory</desc>

  <!-- Climbing rose sprig motif — left side -->
  <g transform="translate(8, 8)" fill="none" stroke="#C8556A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Main stem -->
    <path d="M14 44 Q12 36 15 30 Q18 24 14 18 Q10 12 14 6"/>
    <!-- Leaves -->
    <path d="M14 30 Q8 26 6 20 Q10 22 14 24"/>
    <path d="M15 22 Q20 18 22 12 Q18 16 14 18"/>
    <path d="M14 38 Q8 36 5 30 Q10 32 14 34"/>
    <!-- Rose bloom -->
    <circle cx="14" cy="5" r="3" fill="#C8556A" opacity="0.8"/>
    <circle cx="17" cy="8" r="2" fill="#8B7AB5" opacity="0.6"/>
    <circle cx="11" cy="8" r="2" fill="#7A9E6B" opacity="0.5"/>
  </g>

  <!-- Wordmark -->
  <text x="44" y="42"
        font-family="Georgia, 'Times New Roman', serif"
        font-style="italic"
        font-weight="700"
        font-size="30"
        fill="#2A1A10"
        letter-spacing="-0.02em">Phlix</text>
</svg>
