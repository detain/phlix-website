<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Huginn, Odin's raven">
  <title>Huginn</title>
  <desc>A stylized geometric raven in Nordic knotwork style</desc>

  <!-- Body - angular dark shape -->
  <path d="M32 8 L12 28 L8 44 L20 52 L32 48 L44 52 L56 44 L52 28 Z"
        fill="#060C12" stroke="#4A8FB5" stroke-width="1.5"/>

  <!-- Wing left -->
  <path d="M12 28 L4 24 L8 36 L12 32 Z"
        fill="#060C12" stroke="#4A8FB5" stroke-width="1.5"/>

  <!-- Wing right -->
  <path d="M52 28 L60 24 L56 36 L52 32 Z"
        fill="#060C12" stroke="#4A8FB5" stroke-width="1.5"/>

  <!-- Knotwork lines on body -->
  <path d="M24 28 L32 24 L40 28 M28 36 L32 40 L36 36"
        stroke="#4A8FB5" stroke-width="1" fill="none"/>

  <!-- Tail feathers -->
  <path d="M20 52 L16 60 L24 56 Z" fill="#060C12" stroke="#4A8FB5" stroke-width="1"/>
  <path d="M32 48 L32 60 L36 54 Z" fill="#060C12" stroke="#4A8FB5" stroke-width="1"/>
  <path d="M44 52 L48 60 L40 56 Z" fill="#060C12" stroke="#4A8FB5" stroke-width="1"/>

  <!-- Eye - Forge Fire ember glow -->
  <circle cx="36" cy="24" r="4" fill="#C8700A">
    <animate attributeName="opacity" values="1;0.6;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="36" cy="24" r="2" fill="#E8E0D0"/>

  <!-- Beak -->
  <path d="M40 22 L48 20 L44 24 Z" fill="#5A6070"/>
</svg>
