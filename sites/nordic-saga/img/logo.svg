<!--
  Nordic Saga — Phlix Logo
  Wordmark in Cinzel bold, Nordic rune-stone aesthetic.
  Forge fire against winter dark. The world tree and ravens as signature motif.
  Kit: nordic-saga
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" role="img" aria-label="Phlix logo">
  <title>Phlix</title>
  <desc>Nordic Saga wordmark for Phlix — forge fire orange on fjord night dark</desc>

  <!-- Background -->
  <rect width="320" height="80" fill="#060C12"/>

  <!-- Ship-prow chevron accent (left) -->
  <polygon points="12,20 24,40 12,60" fill="#1E2D3E"/>

  <!-- Ship-prow chevron accent (right) -->
  <polygon points="308,20 296,40 308,60" fill="#1E2D3E"/>

  <!-- Forge fire glow behind wordmark -->
  <ellipse cx="160" cy="42" rx="110" ry="24" fill="url(#forgeGlow)" opacity="0.35"/>

  <!-- Wordmark: Phlix in Cinzel Bold -->
  <text
    x="160" y="54"
    font-family="'Cinzel', 'Trajan Pro', 'Times New Roman', serif"
    font-weight="700"
    font-size="42"
    letter-spacing="0.08em"
    fill="#E8E0D0"
    text-anchor="middle"
    dominant-baseline="middle"
    style="filter: drop-shadow(0 0 12px rgba(200,112,10,0.6));"
  >Phlix</text>

  <!-- Rune-violet accent underline (runestone inscription line) -->
  <line x1="80" y1="66" x2="240" y2="66" stroke="#8B6DC8" stroke-width="1.5" opacity="0.7"/>

  <!-- Small knotwork terminal dots on the underline -->
  <circle cx="80" cy="66" r="3" fill="#8B6DC8" opacity="0.7"/>
  <circle cx="240" cy="66" r="3" fill="#8B6DC8" opacity="0.7"/>

  <!-- Yggdrasil branch motif (top center) - two stylized branches -->
  <g opacity="0.5" stroke="#4A8FB5" stroke-width="1" fill="none">
    <path d="M150,8 Q160,14 155,22"/>
    <path d="M170,8 Q160,14 165,22"/>
    <!-- Raven silhouettes at branch tips (Huginn/Muninn) -->
    <circle cx="150" cy="8" r="2" fill="#4A8FB5"/>
    <circle cx="170" cy="8" r="2" fill="#4A8FB5"/>
  </g>

  <defs>
    <radialGradient id="forgeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C8700A" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#060C12" stop-opacity="0"/>
    </radialGradient>
  </defs>
</svg>
