<!--
  Nordic Saga — Phlix Favicon
  Square favicon in forge-fire primary color with ship-prow chevron.
  Kit: nordic-saga
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Phlix favicon">
  <title>Phlix</title>
  <desc>Nordic Saga favicon — forge fire orange chevron on fjord night dark</desc>

  <!-- Fjord night background -->
  <rect width="32" height="32" fill="#060C12" rx="4"/>

  <!-- Ship-prow chevron in forge fire -->
  <polygon points="4,6 28,16 4,26" fill="#C8700A" opacity="0.9"/>

  <!-- Fjord steel accent line -->
  <line x1="4" y1="16" x2="28" y2="16" stroke="#4A8FB5" stroke-width="1" opacity="0.6"/>

  <!-- Rune-violet dot accent (top) -->
  <circle cx="16" cy="4" r="1.5" fill="#8B6DC8" opacity="0.7"/>

  <!-- Rune-violet dot accent (bottom) -->
  <circle cx="16" cy="28" r="1.5" fill="#8B6DC8" opacity="0.7"/>
</svg>
