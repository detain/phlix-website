<!--
  Nordic Saga — Phlix OG Image
  Social share card (1200x630)
  Dark winter fjord background, forge-fire wordmark, Nordic Saga atmosphere.
  Kit: nordic-saga
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Phlix — Nordic Saga social image">
  <title>Phlix — Nordic Saga</title>
  <desc>Open Graph social share image for Nordic Saga Phlix brand site</desc>

  <!-- Fjord night background -->
  <rect width="1200" height="630" fill="#060C12"/>

  <!-- Forge horizon gradient (top-left to bottom-right) -->
  <defs>
    <linearGradient id="forgeHorizon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C8700A" stop-opacity="0.3"/>
      <stop offset="60%" stop-color="#8B6DC8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#060C12" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="forgeHalo" cx="30%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#C8700A" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#060C12" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#forgeHorizon)"/>
  <rect width="1200" height="630" fill="url(#forgeHalo)"/>

  <!-- Storm sea surface at bottom -->
  <rect x="0" y="480" width="1200" height="150" fill="#0A1320" opacity="0.7"/>
  <line x1="0" y1="480" x2="1200" y2="480" stroke="#1E2D3E" stroke-width="1"/>

  <!-- Fjord steel horizontal lines (distant wave suggestion) -->
  <g opacity="0.15" stroke="#4A8FB5" stroke-width="1">
    <line x1="0" y1="520" x2="1200" y2="520"/>
    <line x1="0" y1="560" x2="1200" y2="560"/>
    <line x1="0" y1="600" x2="1200" y2="600"/>
  </g>

  <!-- Ship-prow chevron left decor -->
  <polygon points="30,180 110,315 30,450" fill="#1E2D3E" opacity="0.8"/>
  <polygon points="30,180 110,315 30,450" fill="none" stroke="#C8700A" stroke-width="1.5" opacity="0.3"/>

  <!-- Ship-prow chevron right decor -->
  <polygon points="1170,180 1090,315 1170,450" fill="#1E2D3E" opacity="0.8"/>
  <polygon points="1170,180 1090,315 1170,450" fill="none" stroke="#C8700A" stroke-width="1.5" opacity="0.3"/>

  <!-- Knotwork top border -->
  <g opacity="0.4">
    <rect x="100" y="80" width="1000" height="2" fill="#1E2D3E"/>
    <!-- Knotwork corner marks -->
    <rect x="100" y="80" width="8" height="8" fill="#C8700A" opacity="0.6"/>
    <rect x="1092" y="80" width="8" height="8" fill="#C8700A" opacity="0.6"/>
  </g>

  <!-- Nordic tagline (top) -->
  <text
    x="600" y="130"
    font-family="'Cinzel', 'Trajan Pro', serif"
    font-weight="600"
    font-size="18"
    letter-spacing="0.2em"
    fill="#8B6DC8"
    text-anchor="middle"
    opacity="0.8"
  >NORDIC SAGA</text>

  <!-- Central wordmark -->
  <text
    x="600" y="320"
    font-family="'Cinzel', 'Trajan Pro', 'Times New Roman', serif"
    font-weight="900"
    font-size="120"
    letter-spacing="0.06em"
    fill="#E8E0D0"
    text-anchor="middle"
    dominant-baseline="middle"
    style="filter: drop-shadow(0 0 30px rgba(200,112,10,0.7));"
  >Phlix</text>

  <!-- Rune underline -->
  <line x1="280" y1="345" x2="920" y2="345" stroke="#8B6DC8" stroke-width="2" opacity="0.6"/>
  <circle cx="280" cy="345" r="4" fill="#8B6DC8" opacity="0.6"/>
  <circle cx="920" cy="345" r="4" fill="#8B6DC8" opacity="0.6"/>

  <!-- Primary tagline -->
  <text
    x="600" y="400"
    font-family="'Cinzel', serif"
    font-weight="600"
    font-size="28"
    letter-spacing="0.06em"
    fill="#C8700A"
    text-anchor="middle"
    opacity="0.9"
  >The Story Is Not Over. Neither Are You.</text>

  <!-- Yggdrasil branch motif (bottom corners) -->
  <g opacity="0.25" stroke="#4A8FB5" stroke-width="1.5" fill="none">
    <!-- Left branch -->
    <path d="M60,560 Q120,520 100,470"/>
    <path d="M80,555 Q130,525 120,485"/>
    <!-- Right branch -->
    <path d="M1140,560 Q1080,520 1100,470"/>
    <path d="M1120,555 Q1070,525 1080,485"/>
  </g>

  <!-- Raven silhouettes bottom center -->
  <g opacity="0.4" fill="#4A8FB5">
    <ellipse cx="560" cy="500" rx="14" ry="8"/>
    <ellipse cx="580" cy="510" rx="12" ry="7"/>
    <path d="M546,500 Q540,492 548,488" stroke="#4A8FB5" stroke-width="1.5" fill="none"/>
    <path d="M566,510 Q560,502 568,498" stroke="#4A8FB5" stroke-width="1.5" fill="none"/>
  </g>

  <!-- Knotwork bottom border -->
  <g opacity="0.4">
    <rect x="100" y="580" width="1000" height="2" fill="#1E2D3E"/>
    <rect x="100" y="580" width="8" height="8" fill="#C8700A" opacity="0.6"/>
    <rect x="1092" y="580" width="8" height="8" fill="#C8700A" opacity="0.6"/>
  </g>

  <!-- Forge fire glow left edge -->
  <rect x="0" y="200" width="4" height="200" fill="#C8700A" opacity="0.15"/>
  <!-- Forge fire glow right edge -->
  <rect x="1196" y="200" width="4" height="200" fill="#C8700A" opacity="0.15"/>
</svg>
