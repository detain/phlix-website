<svg viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="#0b0b15"/>

  <!-- Subtle star field -->
  <circle cx="100" cy="80" r="1.5" fill="#ffffff" opacity="0.3"/>
  <circle cx="250" cy="150" r="1" fill="#ffffff" opacity="0.2"/>
  <circle cx="400" cy="60" r="1.5" fill="#ffffff" opacity="0.25"/>
  <circle cx="550" cy="120" r="1" fill="#ffffff" opacity="0.15"/>
  <circle cx="700" cy="90" r="1.5" fill="#ffffff" opacity="0.2"/>
  <circle cx="850" cy="140" r="1" fill="#ffffff" opacity="0.25"/>
  <circle cx="1000" cy="70" r="1.5" fill="#ffffff" opacity="0.2"/>
  <circle cx="1100" cy="130" r="1" fill="#ffffff" opacity="0.15"/>
  <circle cx="150" cy="500" r="1" fill="#ffffff" opacity="0.2"/>
  <circle cx="350" cy="550" r="1.5" fill="#ffffff" opacity="0.15"/>
  <circle cx="600" cy="520" r="1" fill="#ffffff" opacity="0.25"/>
  <circle cx="900" cy="560" r="1.5" fill="#ffffff" opacity="0.2"/>
  <circle cx="1050" cy="510" r="1" fill="#ffffff" opacity="0.15"/>

  <!-- Glow effect behind station -->
  <circle cx="600" cy="300" r="200" fill="#00bfbf" opacity="0.05"/>

  <!-- Space station illustration -->
  <g transform="translate(500, 240)">
    <!-- Solar panels left -->
    <rect x="-250" y="5" width="120" height="30" rx="3" fill="#1a2a4a" stroke="#00bfbf" stroke-width="2"/>
    <line x1="-130" y1="20" x2="-100" y2="20" stroke="#00bfbf" stroke-width="2"/>

    <!-- Solar panels right -->
    <rect x="130" y="5" width="120" height="30" rx="3" fill="#1a2a4a" stroke="#00bfbf" stroke-width="2"/>
    <line x1="130" y1="20" x2="100" y2="20" stroke="#00bfbf" stroke-width="2"/>

    <!-- Core module -->
    <rect x="-100" y="0" width="200" height="50" rx="6" fill="#1a2a4a" stroke="#00bfbf" stroke-width="2.5"/>

    <!-- Docking port top -->
    <rect x="-50" y="-50" width="100" height="50" rx="4" fill="#1a2a4a" stroke="#00bfbf" stroke-width="2"/>
    <circle cx="0" cy="-25" r="12" fill="#0b0b15" stroke="#ff6b35" stroke-width="2"/>

    <!-- Docking port bottom -->
    <rect x="-50" y="50" width="100" height="50" rx="4" fill="#1a2a4a" stroke="#00bfbf" stroke-width="2"/>
    <circle cx="0" cy="75" r="12" fill="#0b0b15" stroke="#ff6b35" stroke-width="2"/>

    <!-- Cupola (center observation dome) -->
    <ellipse cx="0" cy="25" rx="30" ry="15" fill="#0b0b15" stroke="#00bfbf" stroke-width="1.5"/>
    <ellipse cx="0" cy="25" rx="18" ry="8" fill="#00bfbf" opacity="0.2"/>

    <!-- Antenna -->
    <line x1="0" y1="0" x2="0" y2="-50" stroke="#00bfbf" stroke-width="1.5"/>
    <circle cx="0" cy="-55" r="6" fill="#ff6b35"/>
  </g>

  <!-- Text: PHLIX -->
  <text x="600" y="440" font-family="Orbitron, Arial, sans-serif" font-size="72" font-weight="700" fill="#e8e8e8" text-anchor="middle" letter-spacing="0.1em">PHLIX</text>

  <!-- Tagline -->
  <text x="600" y="490" font-family="Rajdhani, Arial, sans-serif" font-size="24" font-weight="500" fill="#00bfbf" text-anchor="middle" letter-spacing="0.05em">Self-hosted media server</text>

  <!-- Glow effect under text -->
  <rect x="300" y="420" width="600" height="100" fill="url(#textGlow)" opacity="0.1"/>

  <defs>
    <radialGradient id="textGlow">
      <stop offset="0%" stop-color="#00bfbf"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
  </defs>
</svg>
