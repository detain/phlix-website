  <rect x="100" y="15" width="40" height="15" rx="2" fill="#1a2a4a" stroke="#00bfbf" stroke-width="1.5"/>
  <circle cx="120" cy="22" r="4" fill="#0b0b15" stroke="#ff6b35" stroke-width="1"/>
  <rect x="100" y="50" width="40" height="15" rx="2" fill="#1a2a4a" stroke="#00bfbf" stroke-width="1.5"/>
  <circle cx="120" cy="57" r="4" fill="#0b0b15" stroke="#ff6b35" stroke-width="1"/>
