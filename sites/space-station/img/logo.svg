  <rect x="80" y="30" width="80" height="20" rx="3" fill="#1a2a4a" stroke="#00bfbf" stroke-width="1.5"/>
  <!-- Solar panels -->
  <rect x="20" y="35" width="50" height="10" rx="1" fill="#1a2a4a" stroke="#00bfbf" stroke-width="1"/>
  <line x1="70" y1="40" x2="80" y2="40" stroke="#00bfbf" stroke-width="1.5"/>
  <rect x="170" y="35" width="50" height="10" rx="1" fill="#1a2a4a" stroke="#00bfbf" stroke-width="1"/>
  <line x1="160" y1="40" x2="170" y2="40" stroke="#00bfbf" stroke-width="1.5"/>
