<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="bg-grad" cx="20%" cy="0%" r="80%">
      <stop offset="0%" style="stop-color:#7209B7;stop-opacity:0.8"/>
      <stop offset="40%" style="stop-color:#3A0CA3;stop-opacity:0.5"/>
      <stop offset="100%" style="stop-color:#0D0D0D;stop-opacity:1"/>
    </radialGradient>
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F72585"/>
      <stop offset="50%" style="stop-color:#7209B7"/>
      <stop offset="100%" style="stop-color:#4361EE"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="1200" height="630" fill="#0D0D0D"/>
  <rect width="1200" height="630" fill="url(#bg-grad)"/>
  <!-- Explosion burst shapes -->
  <polygon points="100,315 50,250 80,280 40,200 100,250 80,150 120,220 100,100 140,200 160,80 180,180 200,100 190,200 220,180 200,250 240,220 220,280 260,250 230,315" fill="#F72585" opacity="0.3"/>
  <polygon points="1100,315 1150,250 1120,280 1160,200 1100,250 1120,150 1080,220 1100,100 1060,200 1040,80 1020,180 1000,100 1010,200 980,180 1000,250 960,220 980,280 940,250 970,315" fill="#4361EE" opacity="0.3"/>
  <!-- Noise texture overlay -->
  <rect width="1200" height="630" fill="url(#noise)" opacity="0.05"/>
  <!-- Main text -->
  <text x="600" y="260" font-family="Impact, Arial Black, sans-serif" font-size="120" font-weight="900" fill="url(#text-grad)" text-anchor="middle" letter-spacing="-4" filter="url(#glow)">PHLIX</text>
  <!-- Tagline -->
  <text x="600" y="340" font-family="Arial, sans-serif" font-size="32" fill="#FFFFFF" text-anchor="middle" letter-spacing="2" opacity="0.9">Your media. Your library. Your Phlix.</text>
  <!-- Accent line -->
  <rect x="300" y="380" width="200" height="4" fill="#F72585"/>
  <rect x="500" y="380" width="200" height="4" fill="#7209B7"/>
  <rect x="700" y="380" width="200" height="4" fill="#4361EE"/>
  <!-- Bottom tagline -->
  <text x="600" y="550" font-family="Arial, sans-serif" font-size="24" fill="#4CC9F0" text-anchor="middle" letter-spacing="4" text-transform="uppercase">Open-source media, on your terms.</text>
  <!-- Bottom bar -->
  <rect x="0" y="600" width="1200" height="30" fill="#1A1A1A"/>
  <rect x="0" y="600" width="1200" height="2" fill="url(#text-grad)"/>
</svg>
