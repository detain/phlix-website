<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1A1D1E"/>
      <stop offset="100%" style="stop-color:#2D3436"/>
    </linearGradient>
    <linearGradient id="circuitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00CEFF;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#00CEFF;stop-opacity:0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Circuit grid pattern -->
  <g opacity="0.1">
    <line x1="0" y1="0" x2="0" y2="630" stroke="#636E72" stroke-width="1"/>
    <line x1="100" y1="0" x2="100" y2="630" stroke="#636E72" stroke-width="1"/>
    <line x1="200" y1="0" x2="200" y2="630" stroke="#636E72" stroke-width="1"/>
    <line x1="300" y1="0" x2="300" y2="630" stroke="#636E72" stroke-width="1"/>
    <line x1="400" y1="0" x2="400" y2="630" stroke="#636E72" stroke-width="1"/>
    <line x1="500" y1="0" x2="500" y2="630" stroke="#636E72" stroke-width="1"/>
    <line x1="600" y1="0" x2="600" y2="630" stroke="#636E72" stroke-width="1"/>
    <line x1="700" y1="0" x2="700" y2="630" stroke="#636E72" stroke-width="1"/>
    <line x1="800" y1="0" x2="800" y2="630" stroke="#636E72" stroke-width="1"/>
    <line x1="900" y1="0" x2="900" y2="630" stroke="#636E72" stroke-width="1"/>
    <line x1="1000" y1="0" x2="1000" y2="630" stroke="#636E72" stroke-width="1"/>
    <line x1="1100" y1="0" x2="1100" y2="630" stroke="#636E72" stroke-width="1"/>
    <line x1="1200" y1="0" x2="1200" y2="630" stroke="#636E72" stroke-width="1"/>
    <line x1="0" y1="0" x2="1200" y2="0" stroke="#636E72" stroke-width="1"/>
    <line x1="0" y1="100" x2="1200" y2="100" stroke="#636E72" stroke-width="1"/>
    <line x1="0" y1="200" x2="1200" y2="200" stroke="#636E72" stroke-width="1"/>
    <line x1="0" y1="300" x2="1200" y2="300" stroke="#636E72" stroke-width="1"/>
    <line x1="0" y1="400" x2="1200" y2="400" stroke="#636E72" stroke-width="1"/>
    <line x1="0" y1="500" x2="1200" y2="500" stroke="#636E72" stroke-width="1"/>
    <line x1="0" y1="630" x2="1200" y2="630" stroke="#636E72" stroke-width="1"/>
  </g>

  <!-- Large mechanical eye (center left) -->
  <g transform="translate(200, 315)">
    <circle cx="0" cy="0" r="180" fill="none" stroke="#636E72" stroke-width="2"/>
    <circle cx="0" cy="0" r="150" fill="none" stroke="#636E72" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="120" fill="none" stroke="#00CEFF" stroke-width="2" filter="url(#glow)" opacity="0.5"/>
    <circle cx="0" cy="0" r="80" fill="url(#circuitGrad)"/>
    <circle cx="0" cy="0" r="60" fill="#00CEFF" opacity="0.2"/>
    <circle cx="0" cy="0" r="30" fill="#00CEFF"/>

    <!-- Outer circuit traces -->
    <line x1="180" y1="0" x2="250" y2="0" stroke="#636E72" stroke-width="1"/>
    <line x1="-180" y1="0" x2="-250" y2="0" stroke="#636E72" stroke-width="1"/>
    <line x1="0" y1="180" x2="0" y2="250" stroke="#636E72" stroke-width="1"/>
    <line x1="0" y1="-180" x2="0" y2="-250" stroke="#636E72" stroke-width="1"/>
    <line x1="127" y1="127" x2="177" y2="177" stroke="#636E72" stroke-width="1"/>
    <line x1="-127" y1="127" x2="-177" y2="177" stroke="#636E72" stroke-width="1"/>
    <line x1="127" y1="-127" x2="177" y2="-177" stroke="#636E72" stroke-width="1"/>
    <line x1="-127" y1="-127" x2="-177" y2="-177" stroke="#636E72" stroke-width="1"/>
  </g>

  <!-- PHLIX text (right side) -->
  <text x="500" y="260" font-family="Orbitron, system-ui, sans-serif" font-size="72" font-weight="900" fill="#FFFFFF" letter-spacing="0.1em">PHLIX</text>

  <!-- Tagline -->
  <text x="500" y="320" font-family="Share Tech Mono, monospace" font-size="24" fill="#B2BEC3" letter-spacing="0.15em">Your media. Your library. Your Phlix.</text>

  <!-- Accent line -->
  <rect x="500" y="340" width="500" height="3" fill="#00CEFF" opacity="0.8"/>

  <!-- Feature pills -->
  <g transform="translate(500, 380)">
    <rect x="0" y="0" width="140" height="32" rx="4" fill="#2D3436" stroke="#636E72" stroke-width="1"/>
    <text x="70" y="21" font-family="Share Tech Mono, monospace" font-size="12" fill="#B2BEC3" text-anchor="middle">SyncPlay</text>

    <rect x="160" y="0" width="140" height="32" rx="4" fill="#2D3436" stroke="#636E72" stroke-width="1"/>
    <text x="230" y="21" font-family="Share Tech Mono, monospace" font-size="12" fill="#B2BEC3" text-anchor="middle">Live TV + DVR</text>

    <rect x="320" y="0" width="140" height="32" rx="4" fill="#2D3436" stroke="#636E72" stroke-width="1"/>
    <text x="390" y="21" font-family="Share Tech Mono, monospace" font-size="12" fill="#B2BEC3" text-anchor="middle">DLNA</text>

    <rect x="480" y="0" width="140" height="32" rx="4" fill="#2D3436" stroke="#636E72" stroke-width="1"/>
    <text x="550" y="21" font-family="Share Tech Mono, monospace" font-size="12" fill="#B2BEC3" text-anchor="middle">Plugin System</text>
  </g>

  <!-- Second row of pills -->
  <g transform="translate(500, 425)">
    <rect x="0" y="0" width="140" height="32" rx="4" fill="#2D3436" stroke="#636E72" stroke-width="1"/>
    <text x="70" y="21" font-family="Share Tech Mono, monospace" font-size="12" fill="#B2BEC3" text-anchor="middle">Roku</text>

    <rect x="160" y="0" width="140" height="32" rx="4" fill="#2D3436" stroke="#636E72" stroke-width="1"/>
    <text x="230" y="21" font-family="Share Tech Mono, monospace" font-size="12" fill="#B2BEC3" text-anchor="middle">Samsung Tizen</text>

    <rect x="320" y="0" width="140" height="32" rx="4" fill="#2D3436" stroke="#636E72" stroke-width="1"/>
    <text x="390" y="21" font-family="Share Tech Mono, monospace" font-size="12" fill="#B2BEC3" text-anchor="middle">Windows</text>

    <rect x="480" y="0" width="140" height="32" rx="4" fill="#2D3436" stroke="#636E72" stroke-width="1"/>
    <text x="550" y="21" font-family="Share Tech Mono, monospace" font-size="12" fill="#B2BEC3" text-anchor="middle">Mobile</text>
  </g>
</svg>
