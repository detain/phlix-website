<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 80" width="240" height="80">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="240" height="80" fill="#1A1D1E"/>

  <!-- Mechanical Eye Icon -->
  <g transform="translate(20, 15)">
    <!-- Outer rings -->
    <circle cx="25" cy="25" r="23" fill="none" stroke="#636E72" stroke-width="1.5"/>
    <circle cx="25" cy="25" r="18" fill="none" stroke="#636E72" stroke-width="1"/>
    <circle cx="25" cy="25" r="13" fill="none" stroke="#00CEFF" stroke-width="1.5" filter="url(#glow)"/>

    <!-- Iris -->
    <circle cx="25" cy="25" r="8" fill="#00CEFF" opacity="0.3"/>
    <circle cx="25" cy="25" r="4" fill="#00CEFF"/>

    <!-- Circuit traces -->
    <line x1="48" y1="25" x2="55" y2="25" stroke="#636E72" stroke-width="1"/>
    <line x1="2" y1="25" x2="-5" y2="25" stroke="#636E72" stroke-width="1"/>
    <line x1="25" y1="2" x2="25" y2="-5" stroke="#636E72" stroke-width="1"/>
    <line x1="25" y1="48" x2="25" y2="55" stroke="#636E72" stroke-width="1"/>
  </g>

  <!-- Text: PHLIX -->
  <text x="90" y="38" font-family="Orbitron, system-ui, sans-serif" font-size="24" font-weight="700" fill="#FFFFFF" letter-spacing="0.1em">PHLIX</text>

  <!-- Tagline -->
  <text x="90" y="58" font-family="Share Tech Mono, monospace" font-size="10" fill="#B2BEC3" letter-spacing="0.15em">SELF-HOSTED MEDIA SERVER</text>

  <!-- Accent line -->
  <rect x="90" y="64" width="130" height="2" fill="#00CEFF" opacity="0.6"/>
</svg>
