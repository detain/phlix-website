<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error 404 | Android Dreams</title>
    <meta name="description" content="System error - page not found">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/mechanical-eye.css">
</head>
<body>
    <div class="scan-lines"></div>
    <div class="vignette"></div>

    <div class="error-page">
        <div class="error-eye">
            <div class="mechanical-eye small">
                <div class="eye-outer">
                    <div class="eye-ring"></div>
                    <div class="eye-ring"></div>
                </div>
                <div class="eye-iris">
                    <div class="iris-inner"></div>
                    <div class="iris-pupil"></div>
                </div>
            </div>
        </div>

        <h1 class="error-code">404</h1>
        <p class="error-title">SYSTEM ERROR</p>
        <p class="error-message">The requested data stream could not be located. The neural pathways may be disrupted or the resource has been decommissioned.</p>

        <div class="error-actions">
            <a href="index.html" class="btn btn-primary">
                <span class="btn-text">Return to Base</span>
            </a>
            <button class="btn btn-secondary" onclick="location.reload()">
                <span class="btn-text">Reboot System</span>
            </button>
        </div>

        <div class="error-binary">
            <span>01000110 01001111 01010101 01001110 01000100 00100000 01001110 01001111 01010100 00100000 01000110 01001111 01010101 01001110 01000100</span>
        </div>
    </div>

    <style>
        .error-page {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: var(--space-lg);
            position: relative;
        }

        .error-eye {
            margin-bottom: var(--space-xl);
        }

        .error-code {
            font-family: var(--font-display);
            font-size: clamp(4rem, 15vw, 10rem);
            font-weight: 900;
            color: var(--color-highlight);
            text-shadow: 0 0 40px rgba(255, 107, 107, 0.5);
            margin-bottom: var(--space-sm);
            animation: errorPulse 2s ease-in-out infinite;
        }

        @keyframes errorPulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        .error-title {
            font-family: var(--font-display);
            font-size: 1.5rem;
            color: var(--color-text);
            letter-spacing: 0.2em;
            margin-bottom: var(--space-md);
        }

        .error-message {
            font-family: var(--font-body);
            font-size: 1rem;
            color: var(--color-text-secondary);
            max-width: 500px;
            margin: 0 auto var(--space-xl);
            line-height: 1.7;
        }

        .error-actions {
            display: flex;
            gap: var(--space-md);
            flex-wrap: wrap;
            justify-content: center;
            margin-bottom: var(--space-xl);
        }

        .error-binary {
            font-family: var(--font-body);
            font-size: 0.625rem;
            color: var(--color-secondary);
            opacity: 0.3;
            letter-spacing: 0.15em;
        }
    </style>
</body>
</html>
