<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" role="img" aria-label="Phlix logo">
  <title>Phlix</title>
  <desc>Bamboo Sanctuary brand wordmark: Phlix in Cormorant Garamond light, with a single bamboo stalk mark in charcoal ink on washi white.</desc>

  <!-- Washi white background -->
  <rect width="240" height="60" fill="#F2EDE5"/>

  <!-- Single bamboo stalk mark — left side -->
  <g transform="translate(16, 8)" stroke="#2A2A25" stroke-width="1.5" fill="none" opacity="0.7">
    <!-- Main stalk -->
    <line x1="12" y1="0" x2="12" y2="44"/>
    <!-- Bamboo joints -->
    <line x1="8" y1="10" x2="16" y2="10" stroke-width="1"/>
    <line x1="8" y1="22" x2="16" y2="22" stroke-width="1"/>
    <line x1="8" y1="34" x2="16" y2="34" stroke-width="1"/>
    <!-- Single leaf at top-right -->
    <path d="M12 0 Q20 4, 22 -4" stroke-width="1" fill="none"/>
  </g>

  <!-- Phlix wordmark in Cormorant Garamond light -->
  <text
    x="52"
    y="41"
    font-family="'Cormorant Garamond', Georgia, serif"
    font-weight="300"
    font-size="28"
    letter-spacing="0.06em"
    fill="#2A2A25">Phlix</text>
</svg>
