<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Phlix — Watch with intention.">
  <title>Phlix — Watch with intention.</title>
  <desc>Bamboo Sanctuary brand social card: a calm bamboo grove with raked gravel, Phlix wordmark, and tagline on washi white.</desc>

  <!-- Washi white background -->
  <rect width="1200" height="630" fill="#F2EDE5"/>

  <!-- Subtle bamboo grove silhouette — background layer -->
  <g stroke="#8FAF9F" stroke-width="2" fill="none" opacity="0.2">
    <!-- Far left cluster -->
    <line x1="60" y1="630" x2="60" y2="60"/>
    <line x1="95" y1="630" x2="95" y2="80"/>
    <line x1="130" y1="630" x2="130" y2="100"/>
    <line x1="165" y1="630" x2="165" y2="120"/>
    <!-- Far right cluster -->
    <line x1="1035" y1="630" x2="1035" y2="80"/>
    <line x1="1070" y1="630" x2="1070" y2="60"/>
    <line x1="1105" y1="630" x2="1105" y2="90"/>
    <line x1="1140" y1="630" x2="1140" y2="110"/>
  </g>

  <!-- Mid bamboo layer — slightly darker -->
  <g stroke="#7A9E89" stroke-width="2" fill="none" opacity="0.18">
    <line x1="200" y1="630" x2="200" y2="140"/>
    <line x1="240" y1="630" x2="240" y2="160"/>
    <line x1="960" y1="630" x2="960" y2="150"/>
    <line x1="1000" y1="630" x2="1000" y2="130"/>
  </g>

  <!-- Bamboo joints — horizontal marks on stalks -->
  <g stroke="#8FAF9F" stroke-width="1" fill="none" opacity="0.15">
    <line x1="52" y1="140" x2="78" y2="140"/>
    <line x1="52" y1="260" x2="78" y2="260"/>
    <line x1="52" y1="380" x2="78" y2="380"/>
    <line x1="52" y1="500" x2="78" y2="500"/>
    <line x1="87" y1="160" x2="113" y2="160"/>
    <line x1="87" y1="300" x2="113" y2="300"/>
    <line x1="87" y1="440" x2="113" y2="440"/>
    <line x1="87" y1="560" x2="113" y2="560"/>
    <line x1="1027" y1="150" x2="1053" y2="150"/>
    <line x1="1027" y1="280" x2="1053" y2="280"/>
    <line x1="1027" y1="410" x2="1053" y2="410"/>
    <line x1="1062" y1="130" x2="1088" y2="130"/>
    <line x1="1062" y1="270" x2="1088" y2="270"/>
    <line x1="1062" y1="410" x2="1088" y2="410"/>
    <line x1="1062" y1="530" x2="1088" y2="530"/>
  </g>

  <!-- Raked gravel lines at bottom -->
  <g stroke="#E8E3DA" stroke-width="1.5" fill="none" opacity="0.8">
    <path d="M0 560 Q150 540, 300 560 Q450 580, 600 560 Q750 540, 900 560 Q1050 580, 1200 560"/>
    <path d="M0 590 Q150 570, 300 590 Q450 610, 600 590 Q750 570, 900 590 Q1050 610, 1200 590"/>
    <path d="M0 615 Q150 595, 300 615 Q450 635, 600 615 Q750 595, 900 615 Q1050 635, 1200 615"/>
  </g>

  <!-- Filtered light dapple — radial gradient overlay -->
  <ellipse cx="600" cy="280" rx="400" ry="220" fill="url(#mist-glow)" opacity="0.4"/>

  <defs>
    <radialGradient id="mist-glow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#F8F5F0" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#F2EDE5" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Phlix wordmark — centered, Cormorant Garamond light -->
  <text
    x="600"
    y="290"
    font-family="'Cormorant Garamond', Georgia, serif"
    font-weight="300"
    font-size="96"
    letter-spacing="0.08em"
    text-anchor="middle"
    fill="#2A2A25">Phlix</text>

  <!-- Tagline — centered below wordmark -->
  <text
    x="600"
    y="360"
    font-family="'DM Sans', system-ui, sans-serif"
    font-size="24"
    font-weight="300"
    letter-spacing="0.12em"
    text-anchor="middle"
    fill="#8E8E85">Watch with intention.</text>

  <!-- Thin celadon divider line -->
  <line x1="480" y1="390" x2="720" y2="390" stroke="#8FAF9F" stroke-width="1" opacity="0.5"/>
</svg>
