<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Phlix favicon">
  <title>Phlix favicon</title>
  <desc>Bamboo Sanctuary favicon: a celadon circle on washi white — a zen bamboo node mark.</desc>
  <!-- Washi white square -->
  <rect width="32" height="32" fill="#F2EDE5" rx="6"/>
  <!-- Celadon ring — zen bamboo node / stone circle mark -->
  <circle cx="16" cy="16" r="9" fill="none" stroke="#8FAF9F" stroke-width="2.5"/>
  <!-- Inner dot — the still point -->
  <circle cx="16" cy="16" r="2.5" fill="#8FAF9F"/>
</svg>
