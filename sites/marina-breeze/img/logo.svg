<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" role="img" aria-label="Phlix Marina Breeze logo">
  <title>Phlix logo</title>
  <!-- Compass rose mark -->
  <g transform="translate(8, 8)" fill="none" stroke="#1B3A5C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="20" cy="20" r="18" stroke-opacity="0.3"/>
    <circle cx="20" cy="20" r="3"/>
    <!-- N/S/E/W points -->
    <line x1="20" y1="2" x2="20" y2="10"/>
    <line x1="20" y1="30" x2="20" y2="38"/>
    <line x1="2" y1="20" x2="10" y2="20"/>
    <line x1="30" y1="20" x2="38" y2="20"/>
    <!-- Diagonal points -->
    <line x1="7" y1="7" x2="12" y2="12"/>
    <line x1="28" y1="28" x2="33" y2="33"/>
    <line x1="33" y1="7" x2="28" y2="12"/>
    <line x1="7" y1="33" x2="12" y2="28"/>
    <!-- Center dot -->
    <circle cx="20" cy="20" r="2" fill="#1B3A5C" stroke="none"/>
  </g>
  <!-- Wordmark -->
  <text x="58" y="40"
        font-family="Georgia, 'Times New Roman', serif"
        font-style="italic"
        font-weight="700"
        font-size="28"
        fill="#1B3A5C"
        letter-spacing="-0.5">Phlix</text>
</svg>
