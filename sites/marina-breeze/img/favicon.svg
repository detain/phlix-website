<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Phlix favicon">
  <title>Phlix favicon</title>
  <rect width="32" height="32" rx="6" fill="#1B3A5C"/>
  <g transform="translate(16, 16)" fill="none" stroke="#F5F1E8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="0" cy="0" r="11" stroke-opacity="0.4"/>
    <circle cx="0" cy="0" r="2" fill="#F5F1E8" stroke="none"/>
    <!-- N/S/E/W -->
    <line x1="0" y1="-11" x2="0" y2="-5"/>
    <line x1="0" y1="5" x2="0" y2="11"/>
    <line x1="-11" y1="0" x2="-5" y2="0"/>
    <line x1="5" y1="0" x2="11" y2="0"/>
    <!-- Diagonals -->
    <line x1="-7.5" y1="-7.5" x2="-4" y2="-4"/>
    <line x1="4" y1="4" x2="7.5" y2="7.5"/>
    <line x1="7.5" y1="-7.5" x2="4" y2="-4"/>
    <line x1="-4" y1="4" x2="-7.5" y2="7.5"/>
  </g>
</svg>
