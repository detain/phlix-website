<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Phlix social share image">
  <title>Phlix — Self-hosted media server</title>
  <desc>Set Sail for Tonight. — Phlix marina breeze brand</desc>
  <!-- Background: ocean-to-sky gradient -->
  <defs>
    <linearGradient id="og-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B3A5C"/>
      <stop offset="100%" stop-color="#5BA3A0"/>
    </linearGradient>
    <radialGradient id="lighthouse-glow" cx="20%" cy="10%" r="60%">
      <stop offset="0%" stop-color="rgba(253,250,244,0.25)"/>
      <stop offset="100%" stop-color="rgba(253,250,244,0)"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#og-bg)"/>
  <rect width="1200" height="630" fill="url(#lighthouse-glow)"/>
  <!-- Decorative horizon line -->
  <line x1="0" y1="450" x2="1200" y2="450" stroke="rgba(245,241,232,0.15)" stroke-width="1"/>
  <!-- Logo lockup: compass rose + wordmark -->
  <g transform="translate(80, 80)">
    <g fill="none" stroke="#F5F1E8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="30" cy="30" r="26" stroke-opacity="0.4"/>
      <circle cx="30" cy="30" r="4" fill="#F5F1E8" stroke="none"/>
      <line x1="30" y1="4" x2="30" y2="16"/>
      <line x1="30" y1="44" x2="30" y2="56"/>
      <line x1="4" y1="30" x2="16" y2="30"/>
      <line x1="44" y1="30" x2="56" y2="30"/>
      <line x1="11" y1="11" x2="18" y2="18"/>
      <line x1="42" y1="42" x2="49" y2="49"/>
      <line x1="49" y1="11" x2="42" y2="18"/>
      <line x1="11" y1="49" x2="18" y2="42"/>
    </g>
  </g>
  <text x="190" y="122"
        font-family="Georgia, 'Times New Roman', serif"
        font-style="italic"
        font-weight="700"
        font-size="52"
        fill="#F5F1E8"
        letter-spacing="-1">Phlix</text>
  <!-- Tagline -->
  <text x="80" y="520"
        font-family="Georgia, 'Times New Roman', serif"
        font-style="italic"
        font-weight="700"
        font-size="68"
        fill="#ffffff"
        letter-spacing="-1">Set Sail for Tonight.</text>
  <!-- Sub line -->
  <text x="80" y="580"
        font-family="Helvetica, Arial, sans-serif"
        font-size="22"
        fill="rgba(245,241,232,0.75)"
        letter-spacing="0.5">Self-hosted media server — Roku, Samsung TV, Windows, mobile, any DLNA device</text>
  <!-- Decorative wave dots along bottom -->
  <g fill="rgba(245,241,232,0.2)">
    <circle cx="900" cy="560" r="6"/>
    <circle cx="930" cy="555" r="4"/>
    <circle cx="960" cy="560" r="6"/>
    <circle cx="990" cy="555" r="4"/>
    <circle cx="1020" cy="560" r="6"/>
    <circle cx="1050" cy="555" r="4"/>
    <circle cx="1080" cy="560" r="6"/>
    <circle cx="1110" cy="555" r="4"/>
    <circle cx="1140" cy="560" r="6"/>
  </g>
</svg>
