<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <title>Phlix</title>
  <desc>Glitch Entity favicon — magenta square with digital corruption</desc>

  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF00FF"/>
      <stop offset="100%" style="stop-color:#CC00CC"/>
    </linearGradient>
  </defs>

  <!-- Background square with rounded corners -->
  <rect x="2" y="2" width="28" height="28" rx="4" fill="url(#bgGrad)"/>

  <!-- Glitch offset P -->
  <text x="6" y="24" font-family="Arial Black, Arial, sans-serif" font-size="20" font-weight="900" fill="#0D0D0D">P</text>

  <!-- Glitch artifacts -->
  <rect x="4" y="10" width="12" height="2" fill="#00FF00" opacity="0.6"/>
  <rect x="6" y="14" width="8" height="1" fill="#FFFF00" opacity="0.5"/>
  <rect x="18" y="8" width="3" height="3" fill="#0D0D0D" opacity="0.4"/>
  <rect x="22" y="20" width="4" height="2" fill="#00FF00" opacity="0.3"/>

  <!-- Scanline effect -->
  <rect x="2" y="2" width="28" height="28" rx="4" fill="transparent" opacity="0.1" stroke="#000" stroke-width="0.5" stroke-dasharray="2 2"/>
</svg>
