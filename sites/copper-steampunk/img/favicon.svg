<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Phlix favicon">
  <title>Phlix</title>
  <desc>Copper gear cog favicon for Phlix in Copper Steampunk identity</desc>

  <!-- Octagonal background -->
  <polygon points="6,2 26,2 30,6 30,26 26,30 6,30 2,26 2,6"
    fill="#B5651D"
    stroke="#C9A84C"
    stroke-width="1.5"
    stroke-linejoin="round"/>

  <!-- Gear cog center -->
  <circle cx="16" cy="16" r="8" fill="none" stroke="#1A1208" stroke-width="2"/>

  <!-- Gear teeth (8 teeth) -->
  <g fill="#1A1208">
    <rect x="14.5" y="3" width="3" height="5" rx="0.5"/>
    <rect x="14.5" y="24" width="3" height="5" rx="0.5"/>
    <rect x="3" y="14.5" width="5" height="3" rx="0.5"/>
    <rect x="24" y="14.5" width="5" height="3" rx="0.5"/>
    <rect x="6" y="6" width="3" height="4" rx="0.5" transform="rotate(45 7.5 8)"/>
    <rect x="23" y="6" width="3" height="4" rx="0.5" transform="rotate(-45 24.5 8)"/>
    <rect x="6" y="22" width="3" height="4" rx="0.5" transform="rotate(-45 7.5 24)"/>
    <rect x="23" y="22" width="3" height="4" rx="0.5" transform="rotate(45 24.5 24)"/>
  </g>

  <!-- Inner circle -->
  <circle cx="16" cy="16" r="4" fill="#C9A84C"/>
</svg>
