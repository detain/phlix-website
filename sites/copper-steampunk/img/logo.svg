<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" role="img" aria-label="Phlix logo">
  <title>Phlix</title>
  <desc>Copper Steampunk Phlix logo — Cinzel Decorative wordmark in antique brass inside an octagonal engraved shield with a gear cog, on soot black.</desc>

  <defs>
    <!-- Octagonal shield path -->
    <clipPath id="octagon">
      <polygon points="16,2 44,2 58,16 58,44 44,58 16,58 2,44 2,16"/>
    </clipPath>
    <!-- Gear cog shape -->
    <symbol id="gear" viewBox="0 0 24 24">
      <path d="M12 15a3 3 0 100-6 3 3 0 000 6z" fill="#C9A84C"/>
      <path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-2 2 2 2 0 01-2-2v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 01-2-2 2 2 0 012-2h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 012-2 2 2 0 012 2v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 012 2 2 2 0 01-2 2h-.09a1.65 1.65 0 00-1.51 1z" fill="#C9A84C"/>
    </symbol>
  </defs>

  <!-- Octagonal shield background -->
  <g transform="translate(0, 0)">
    <!-- Shield body -->
    <polygon points="16,2 44,2 58,16 58,44 44,58 16,58 2,44 2,16"
      fill="#1A1208"
      stroke="#C9A84C"
      stroke-width="2"
      stroke-linejoin="round"/>
    <!-- Inner bevel line -->
    <polygon points="19,6 41,6 53,18 53,42 41,54 19,54 7,42 7,18"
      fill="none"
      stroke="#7B4F2E"
      stroke-width="1"
      stroke-linejoin="round"/>
    <!-- Rivet dots -->
    <circle cx="16" cy="6" r="2" fill="#7B4F2E"/>
    <circle cx="44" cy="6" r="2" fill="#7B4F2E"/>
    <circle cx="53" cy="18" r="2" fill="#7B4F2E"/>
    <circle cx="53" cy="42" r="2" fill="#7B4F2E"/>
    <circle cx="44" cy="54" r="2" fill="#7B4F2E"/>
    <circle cx="16" cy="54" r="2" fill="#7B4F2E"/>
    <circle cx="7" cy="42" r="2" fill="#7B4F2E"/>
    <circle cx="7" cy="18" r="2" fill="#7B4F2E"/>
  </g>

  <!-- Gear cog (top-left of shield) -->
  <use href="#gear" x="-10" y="-8" width="22" height="22"/>

  <!-- PHLIX wordmark -->
  <text x="30" y="40"
    font-family="Cinzel Decorative, 'Trajan Pro', 'Times New Roman', serif"
    font-size="20"
    font-weight="400"
    fill="#C9A84C"
    letter-spacing="3"
    text-anchor="middle">PHLIX</text>

  <!-- Tagline below shield -->
  <text x="100" y="38"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="11"
    font-weight="400"
    fill="#E8D5A3"
    letter-spacing="0.5"
    opacity="0.7"
    text-anchor="middle">Masterfully Engineered</text>
</svg>
