<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Phlix social share card">
  <title>Phlix — Your Collection, Masterfully Engineered.</title>
  <desc>Copper Steampunk social card for Phlix media server — brass gear, copper pipes, Victorian engineering aesthetic</desc>

  <defs>
    <linearGradient id="boiler-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B5651D"/>
      <stop offset="35%" stop-color="#7B4F2E"/>
      <stop offset="75%" stop-color="#2C1A0E"/>
      <stop offset="100%" stop-color="#1A1208"/>
    </linearGradient>

    <radialGradient id="gas-lamp" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="rgba(212,134,10,0.35)"/>
      <stop offset="100%" stop-color="rgba(26,18,8,0)"/>
    </radialGradient>

    <linearGradient id="copper-pipe" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D4780A"/>
      <stop offset="40%" stop-color="#B5651D"/>
      <stop offset="100%" stop-color="#7B4F2E"/>
    </linearGradient>

    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feBlend in="SourceGraphic" mode="multiply" result="blend"/>
      <feComposite in="blend" in2="SourceGraphic" operator="in"/>
    </filter>

    <pattern id="crosshatch" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M0 20 L20 0 M10 20 L20 10 M20 20 L20 0 M30 20 L20 10 M40 20 L20 0 M40 20 L40 0 M40 20 L20 20 M40 40 L20 20"
        stroke="#B5651D" stroke-width="0.5" opacity="0.08"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#boiler-bg)"/>

  <!-- Cross-hatch texture overlay -->
  <rect width="1200" height="630" fill="url(#crosshatch)" opacity="1"/>

  <!-- Gas-lamp radial glow -->
  <ellipse cx="600" cy="280" rx="600" ry="350" fill="url(#gas-lamp)"/>

  <!-- Decorative copper pipes (horizontal rules) -->
  <rect x="0" y="180" width="1200" height="4" fill="url(#copper-pipe)" opacity="0.4"/>
  <rect x="0" y="470" width="1200" height="4" fill="url(#copper-pipe)" opacity="0.4"/>

  <!-- Pipe caps left -->
  <ellipse cx="20" cy="182" rx="12" ry="20" fill="#C9A84C"/>
  <ellipse cx="20" cy="472" rx="12" ry="20" fill="#C9A84C"/>

  <!-- Pipe caps right -->
  <ellipse cx="1180" cy="182" rx="12" ry="20" fill="#C9A84C"/>
  <ellipse cx="1180" cy="472" rx="12" ry="20" fill="#C9A84C"/>

  <!-- Corner riveted iron panels (top-left, top-right) -->
  <g opacity="0.5">
    <rect x="30" y="30" width="80" height="100" rx="2" fill="none" stroke="#3D2B1A" stroke-width="2"/>
    <circle cx="38" cy="38" r="4" fill="#3D2B1A"/>
    <circle cx="102" cy="38" r="4" fill="#3D2B1A"/>
    <circle cx="38" cy="122" r="4" fill="#3D2B1A"/>
    <circle cx="102" cy="122" r="4" fill="#3D2B1A"/>

    <rect x="1090" y="30" width="80" height="100" rx="2" fill="none" stroke="#3D2B1A" stroke-width="2"/>
    <circle cx="1098" cy="38" r="4" fill="#3D2B1A"/>
    <circle cx="1162" cy="38" r="4" fill="#3D2B1A"/>
    <circle cx="1098" cy="122" r="4" fill="#3D2B1A"/>
    <circle cx="1162" cy="122" r="4" fill="#3D2B1A"/>
  </g>

  <!-- Large gear decoration (background) -->
  <g transform="translate(900, 420)" opacity="0.12">
    <circle cx="0" cy="0" r="180" fill="none" stroke="#C9A84C" stroke-width="8"/>
    <g fill="#C9A84C">
      <!-- Gear teeth (16) -->
      <rect x="-15" y="-210" width="30" height="45" rx="3"/>
      <rect x="-15" y="-210" width="30" height="45" rx="3" transform="rotate(22.5)"/>
      <rect x="-15" y="-210" width="30" height="45" rx="3" transform="rotate(45)"/>
      <rect x="-15" y="-210" width="30" height="45" rx="3" transform="rotate(67.5)"/>
      <rect x="-15" y="-210" width="30" height="45" rx="3" transform="rotate(90)"/>
      <rect x="-15" y="-210" width="30" height="45" rx="3" transform="rotate(112.5)"/>
      <rect x="-15" y="-210" width="30" height="45" rx="3" transform="rotate(135)"/>
      <rect x="-15" y="-210" width="30" height="45" rx="3" transform="rotate(157.5)"/>
      <rect x="-15" y="-210" width="30" height="45" rx="3" transform="rotate(180)"/>
      <rect x="-15" y="-210" width="30" height="45" rx="3" transform="rotate(202.5)"/>
      <rect x="-15" y="-210" width="30" height="45" rx="3" transform="rotate(225)"/>
      <rect x="-15" y="-210" width="30" height="45" rx="3" transform="rotate(247.5)"/>
      <rect x="-15" y="-210" width="30" height="45" rx="3" transform="rotate(270)"/>
      <rect x="-15" y="-210" width="30" height="45" rx="3" transform="rotate(292.5)"/>
      <rect x="-15" y="-210" width="30" height="45" rx="3" transform="rotate(315)"/>
      <rect x="-15" y="-210" width="30" height="45" rx="3" transform="rotate(337.5)"/>
    </g>
    <circle cx="0" cy="0" r="120" fill="#1A1208"/>
  </g>

  <!-- Small gear (foreground-left) -->
  <g transform="translate(180, 480)" opacity="0.15">
    <circle cx="0" cy="0" r="80" fill="none" stroke="#C9A84C" stroke-width="6"/>
    <g fill="#C9A84C">
      <rect x="-10" y="-95" width="20" height="30" rx="2" transform="rotate(0)"/>
      <rect x="-10" y="-95" width="20" height="30" rx="2" transform="rotate(45)"/>
      <rect x="-10" y="-95" width="20" height="30" rx="2" transform="rotate(90)"/>
      <rect x="-10" y="-95" width="20" height="30" rx="2" transform="rotate(135)"/>
      <rect x="-10" y="-95" width="20" height="30" rx="2" transform="rotate(180)"/>
      <rect x="-10" y="-95" width="20" height="30" rx="2" transform="rotate(225)"/>
      <rect x="-10" y="-95" width="20" height="30" rx="2" transform="rotate(270)"/>
      <rect x="-10" y="-95" width="20" height="30" rx="2" transform="rotate(315)"/>
    </g>
    <circle cx="0" cy="0" r="55" fill="#1A1208"/>
  </g>

  <!-- Central octagonal badge (logo area) -->
  <g transform="translate(600, 260)">
    <polygon points="-90,-30 -60,-90 0,-110 60,-90 90,-30 90,30 60,90 0,110 -60,90 -90,30"
      fill="#1A1208"
      stroke="#C9A84C"
      stroke-width="3"
      stroke-linejoin="round"/>
    <polygon points="-78,-24 -51,-75 0,-93 51,-75 78,-24 78,24 51,75 0,93 -51,75 -78,24"
      fill="none"
      stroke="#7B4F2E"
      stroke-width="1.5"
      stroke-linejoin="round"/>
    <!-- Rivets -->
    <circle cx="-78" cy="-24" r="4" fill="#7B4F2E"/>
    <circle cx="78" cy="-24" r="4" fill="#7B4F2E"/>
    <circle cx="-78" cy="24" r="4" fill="#7B4F2E"/>
    <circle cx="78" cy="24" r="4" fill="#7B4F2E"/>
    <circle cx="0" cy="-93" r="4" fill="#7B4F2E"/>
    <circle cx="0" cy="93" r="4" fill="#7B4F2E"/>

    <!-- Gear cog inside badge -->
    <g transform="translate(0, -8)">
      <circle cx="0" cy="0" r="22" fill="none" stroke="#C9A84C" stroke-width="3"/>
      <g fill="#C9A84C">
        <rect x="-4" y="-30" width="8" height="12" rx="1"/>
        <rect x="-4" y="-30" width="8" height="12" rx="1" transform="rotate(60)"/>
        <rect x="-4" y="-30" width="8" height="12" rx="1" transform="rotate(120)"/>
        <rect x="-4" y="-30" width="8" height="12" rx="1" transform="rotate(180)"/>
        <rect x="-4" y="-30" width="8" height="12" rx="1" transform="rotate(240)"/>
        <rect x="-4" y="-30" width="8" height="12" rx="1" transform="rotate(300)"/>
      </g>
      <circle cx="0" cy="0" r="10" fill="#C9A84C"/>
      <circle cx="0" cy="0" r="5" fill="#1A1208"/>
    </g>
  </g>

  <!-- PHLIX wordmark -->
  <text x="600" y="310"
    font-family="Cinzel Decorative, 'Trajan Pro', 'Times New Roman', serif"
    font-size="42"
    font-weight="400"
    fill="#C9A84C"
    letter-spacing="10"
    text-anchor="middle">PHLIX</text>

  <!-- Tagline -->
  <text x="600" y="345"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="15"
    fill="#E8D5A3"
    letter-spacing="2"
    text-anchor="middle"
    opacity="0.75">Your Collection, Masterfully Engineered.</text>

  <!-- Bottom eyebrow -->
  <text x="600" y="400"
    font-family="Josefin Slab, 'Courier New', monospace"
    font-size="11"
    font-weight="600"
    fill="#7B4F2E"
    letter-spacing="4"
    text-anchor="middle"
    text-transform="uppercase">SELF-HOSTED MEDIA SERVER</text>

  <!-- Bottom tagline -->
  <text x="600" y="545"
    font-family="Georgia, serif"
    font-size="14"
    fill="#E8D5A3"
    letter-spacing="1"
    text-anchor="middle"
    opacity="0.55">Roku · Samsung Tizen · Windows · Mobile · DLNA · SyncPlay · Live TV</text>

  <!-- Steam wisps (decorative) -->
  <g opacity="0.2" fill="none" stroke="#E8D5A3" stroke-width="1.5" stroke-linecap="round">
    <path d="M500 520 Q490 500 500 480 Q510 460 500 440">
      <animate attributeName="d"
        values="M500 520 Q490 500 500 480 Q510 460 500 440;M500 520 Q510 500 500 480 Q490 460 500 440;M500 520 Q490 500 500 480 Q510 460 500 440"
        dur="4s" repeatCount="indefinite"/>
    </path>
    <path d="M700 520 Q690 500 700 480 Q710 460 700 440">
      <animate attributeName="d"
        values="M700 520 Q690 500 700 480 Q710 460 700 440;M700 520 Q710 500 700 480 Q690 460 700 440;M700 520 Q690 500 700 480 Q710 460 700 440"
        dur="3.5s" repeatCount="indefinite"/>
    </path>
  </g>
</svg>
