<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1A1A"/>
      <stop offset="50%" stop-color="#2D3436"/>
      <stop offset="100%" stop-color="#1A1A1A"/>
    </linearGradient>
    <radialGradient id="spotlight1" cx="20%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#E71D36" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#E71D36" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="spotlight2" cx="80%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#FF6B35" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#FF6B35" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="spotlight3" cx="50%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#FFD93D" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#FFD93D" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="phlixGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E71D36"/>
      <stop offset="50%" stop-color="#FF6B35"/>
      <stop offset="100%" stop-color="#FFD93D"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Spotlight effects -->
  <rect width="1200" height="630" fill="url(#spotlight1)"/>
  <rect width="1200" height="630" fill="url(#spotlight2)"/>
  <rect width="1200" height="630" fill="url(#spotlight3)"/>

  <!-- Concert light tower lines -->
  <g opacity="0.15" stroke="#FFD93D" stroke-width="1">
    <line x1="100" y1="630" x2="200" y2="0"/>
    <line x1="150" y1="630" x2="280" y2="0"/>
    <line x1="1050" y1="630" x2="1000" y2="0"/>
    <line x1="1100" y1="630" x2="920" y2="0"/>
  </g>

  <!-- Crowd silhouette bottom -->
  <path d="M0 580 Q50 560 100 580 T200 570 T300 585 T400 565 T500 580 T600 560 T700 575 T800 565 T900 580 T1000 560 T1100 575 T1200 570 L1200 630 L0 630 Z" fill="#0D0D0D" opacity="0.8"/>

  <!-- Logo/Wordmark -->
  <text x="600" y="300" font-family="Anton, Impact, Arial Black, sans-serif" font-size="120" font-weight="900" fill="url(#phlixGrad)" text-anchor="middle" letter-spacing="8">PHLIX</text>

  <!-- Tagline -->
  <text x="600" y="380" font-family="Barlow, Arial, sans-serif" font-size="32" font-weight="500" fill="#FFFFFF" text-anchor="middle" opacity="0.9">Your media. Your library. Your Phlix.</text>

  <!-- Decorative line -->
  <rect x="500" y="410" width="200" height="4" rx="2" fill="url(#phlixGrad)"/>

  <!-- Platform/stage indicator -->
  <rect x="0" y="520" width="1200" height="110" fill="#0D0D0D"/>
  <rect x="0" y="515" width="1200" height="8" fill="url(#phlixGrad)" opacity="0.6"/>
</svg>
