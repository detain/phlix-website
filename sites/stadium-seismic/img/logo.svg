<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" width="200" height="60">
  <defs>
    <linearGradient id="phlixGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E71D36"/>
      <stop offset="50%" stop-color="#FF6B35"/>
      <stop offset="100%" stop-color="#FFD93D"/>
    </linearGradient>
    <linearGradient id="waveGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E71D36" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FF6B35" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Sound wave accent -->
  <g transform="translate(5, 35)">
    <rect x="0" y="-8" width="3" height="16" rx="1.5" fill="url(#waveGradient)">
      <animate attributeName="height" values="16;12;16;8;16" dur="1.5s" repeatCount="indefinite"/>
      <animate attributeName="y" values="-8;-4;-8;-0;-8" dur="1.5s" repeatCount="indefinite"/>
    </rect>
    <rect x="6" y="-15" width="3" height="30" rx="1.5" fill="url(#waveGradient)">
      <animate attributeName="height" values="30;20;30;25;30" dur="1.8s" repeatCount="indefinite"/>
      <animate attributeName="y" values="-15;-10;-15;-12.5;-15" dur="1.8s" repeatCount="indefinite"/>
    </rect>
    <rect x="12" y="-5" width="3" height="10" rx="1.5" fill="url(#waveGradient)">
      <animate attributeName="height" values="10;18;10;14;10" dur="1.3s" repeatCount="indefinite"/>
      <animate attributeName="y" values="-5;-9;-5;-7;-5" dur="1.3s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- P letter with stadium light effect -->
  <text x="28" y="44" font-family="Anton, Impact, sans-serif" font-size="42" font-weight="400" fill="url(#phlixGradient)">P</text>

  <!-- h letter -->
  <text x="52" y="44" font-family="Anton, Impact, sans-serif" font-size="42" font-weight="400" fill="#FFFFFF">h</text>

  <!-- l letter -->
  <text x="70" y="44" font-family="Anton, Impact, sans-serif" font-size="42" font-weight="400" fill="#FFFFFF">l</text>

  <!-- i letter -->
  <text x="84" y="44" font-family="Anton, Impact, sans-serif" font-size="42" font-weight="400" fill="#FFFFFF">i</text>

  <!-- x letter -->
  <text x="95" y="44" font-family="Anton, Impact, sans-serif" font-size="42" font-weight="400" fill="url(#phlixGradient)">x</text>

  <!-- Spotlight effect -->
  <ellipse cx="60" cy="52" rx="45" ry="3" fill="url(#phlixGradient)" opacity="0.3">
    <animate attributeName="rx" values="45;48;45" dur="2s" repeatCount="indefinite"/>
  </ellipse>
</svg>
