<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- OG social share image — 1200x630 -->
  <!-- Background: Cosmic Void -->
  <rect width="1200" height="630" fill="#04000A"/>
  <!-- Subtle radial: cosmic rift purple at top -->
  <ellipse cx="600" cy="-100" rx="900" ry="400" fill="rgba(61,0,128,0.30)"/>
  <!-- Subtle radial: eldritch green at bottom -->
  <ellipse cx="600" cy="700" rx="800" ry="350" fill="rgba(0,204,102,0.08)"/>
  <!-- Top accent line -->
  <rect x="80" y="60" width="80" height="2" fill="#00CC66"/>
  <!-- Tagline primary — large display text -->
  <text x="600" y="230" text-anchor="middle" font-family="Cinzel, Trajan Pro, Times New Roman, serif" font-weight="700" font-size="72" letter-spacing="4" fill="#C8D8C0">That Which Has</text>
  <text x="600" y="320" text-anchor="middle" font-family="Cinzel, Trajan Pro, Times New Roman, serif" font-weight="700" font-size="72" letter-spacing="4" fill="#C8D8C0">Always Been Watching.</text>
  <!-- Brand name -->
  <text x="600" y="420" text-anchor="middle" font-family="Uncial Antiqua, Palatino Linotype, serif" font-weight="400" font-size="48" letter-spacing="8" fill="#00CC66">Phlix</text>
  <!-- Bottom accent line -->
  <rect x="1040" y="568" width="80" height="2" fill="#00CC66"/>
  <!-- Lower tagline -->
  <text x="600" y="530" text-anchor="middle" font-family="Crimson Text, EB Garamond, serif" font-size="20" letter-spacing="2" fill="rgba(200,216,192,0.5)">Self-hosted PHP media server</text>
</svg>
