<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 80" width="200" height="80">
  <!-- Cosmic Horror brand wordmark: Cinzel on void, eldritch-green sigil above wordmark -->
  <rect width="200" height="80" fill="#04000A"/>
  <!-- Sharp eldritch-green border -->
  <rect x="1" y="1" width="198" height="78" fill="none" stroke="#00CC66" stroke-width="1"/>
  <!-- Sigil: cyclopean arch + eldritch eye — upper portion -->
  <g transform="translate(100, 22)">
    <!-- Cyclopean arch form -->
    <path d="M-14 14 L-14 -6 Q-14 -18 0 -18 Q14 -18 14 -6 L14 14" fill="none" stroke="#00CC66" stroke-width="1.5"/>
    <!-- Central eye / sigil dot -->
    <circle cx="0" cy="-1" r="3" fill="#00CC66"/>
    <!-- Vertical sigil line -->
    <line x1="0" y1="3" x2="0" y2="16" stroke="#00CC66" stroke-width="1"/>
    <!-- Left tentacular arm -->
    <path d="M-14 4 Q-20 8 -18 14" fill="none" stroke="#00CC66" stroke-width="1" stroke-linecap="round"/>
    <!-- Right tentacular arm -->
    <path d="M14 4 Q20 8 18 14" fill="none" stroke="#00CC66" stroke-width="1" stroke-linecap="round"/>
    <!-- Upper glyph marks -->
    <line x1="-7" y1="-18" x2="-7" y2="-22" stroke="#00CC66" stroke-width="1"/>
    <line x1="0" y1="-18" x2="0" y2="-24" stroke="#00CC66" stroke-width="1.5"/>
    <line x1="7" y1="-18" x2="7" y2="-22" stroke="#00CC66" stroke-width="1"/>
  </g>
  <!-- Wordmark -->
  <text x="100" y="58" text-anchor="middle" font-family="Cinzel, Trajan Pro, Times New Roman, serif" font-weight="700" font-size="20" letter-spacing="5" fill="#C8D8C0">PHLIX</text>
</svg>
