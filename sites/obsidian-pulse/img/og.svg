<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <!-- Obsidian background -->
  <rect width="1200" height="630" fill="#0A0B0E"/>
  <!-- Subtle grid overlay at very low opacity -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#2A2E38" stroke-width="0.5" opacity="0.3"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <!-- Gradient glow behind logo -->
  <ellipse cx="600" cy="280" rx="300" ry="120" fill="#00B4FF" opacity="0.06"/>
  <!-- Logo wordmark: phlix -->
  <text x="600" y="300" font-family="'Space Grotesk', 'DM Sans', sans-serif" font-weight="300" font-size="120" letter-spacing="20" text-anchor="middle" fill="#F0F2F5">phlix</text>
  <!-- Pulse bar beneath wordmark -->
  <rect x="340" y="316" width="520" height="4" fill="#00B4FF"/>
  <!-- Tagline -->
  <text x="600" y="400" font-family="'DM Sans', 'Inter', sans-serif" font-weight="300" font-size="32" letter-spacing="12" text-anchor="middle" fill="#C8CDD6">SIGNAL. REFINED.</text>
  <!-- Bottom tagline -->
  <text x="600" y="560" font-family="'JetBrains Mono', monospace" font-weight="400" font-size="18" letter-spacing="4" text-anchor="middle" fill="#2A2E38">Self-hosted media server</text>
  <!-- Blue LED dots as subtle decoration -->
  <circle cx="880" cy="316" r="4" fill="#00B4FF" opacity="0.8"/>
  <circle cx="320" cy="316" r="4" fill="#00B4FF" opacity="0.8"/>
</svg>
