<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>404 — Signal not found — Phlix</title>
    <meta name="description" content="Signal not found. The page you requested doesn't exist." />
    <!-- Favicon -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%230A0B0E'/><rect x='6' y='22' width='20' height='2' fill='%2300B4FF'/></svg>"
    />

    <!-- 404.html uses relative asset paths — the root shim injects <base> -->
    <link rel="stylesheet" href="./css/base.css" />
    <link rel="stylesheet" href="./css/theme.css" />
    <link rel="stylesheet" href="./css/components.css" />
  </head>
  <body>
    <a href="#main-content" class="skip-link">Skip to main content</a>

    <!-- Minimal 404 page — nav omitted per error_page_experience.spec -->
    <main class="error-page" id="main-content" role="main" aria-labelledby="error-code">
      <div class="error-page__logo" aria-hidden="true" style="margin-bottom: var(--space-8)">
        <a href="index.html" aria-label="Phlix home" style="text-decoration: none">
          <div
            style="
              font-family: var(--font-display);
              font-weight: 300;
              font-size: 1.25rem;
              letter-spacing: var(--tracking-display);
              color: var(--color-text);
              display: flex;
              flex-direction: column;
              align-items: center;
              gap: 4px;
            "
          >
            phlix
            <span
              style="
                width: 32px;
                height: 2px;
                background-color: var(--color-primary);
                border-radius: 1px;
              "
            ></span>
          </div>
        </a>
      </div>

      <p class="error-page__code" id="error-code">404</p>

      <h1 class="error-page__title">Signal not found.</h1>

      <div class="error-page__divider" aria-hidden="true"></div>

      <ul class="error-page__links" role="list">
        <li><a href="index.html" class="error-page__link">Return to home</a></li>
        <li><a href="features.html" class="error-page__link">Features</a></li>
        <li><a href="download.html" class="error-page__link">Download</a></li>
      </ul>
    </main>

    <script src="js/main.js"></script>
  </body>
</html>
