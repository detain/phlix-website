<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Phlix — In the Dark, Life Finds a Way">
  <title>Phlix — Self-hosted media server</title>
  <defs>
    <radialGradient id="bg-glow" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#020F1C" stop-opacity="1"/>
      <stop offset="60%" stop-color="#010B14" stop-opacity="1"/>
      <stop offset="100%" stop-color="#010B14" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="biolume-orb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00E8C8" stop-opacity="0.5"/>
      <stop offset="40%" stop-color="#00E8C8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#00E8C8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="violet-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7700FF" stop-opacity="0.4"/>
      <stop offset="60%" stop-color="#7700FF" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#7700FF" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg-glow)"/>

  <!-- Bioluminescent bloom effects -->
  <ellipse cx="400" cy="280" rx="350" ry="280" fill="url(#biolume-orb)" opacity="0.6"/>
  <ellipse cx="800" cy="350" rx="300" ry="240" fill="url(#violet-glow)" opacity="0.5"/>

  <!-- Decorative jellyfish organism -->
  <g transform="translate(900, 120)" opacity="0.35" filter="url(#soft-glow)">
    <ellipse cx="60" cy="55" rx="50" ry="38" fill="none" stroke="#00E8C8" stroke-width="2"/>
    <path d="M20 75 Q10 110 18 145" stroke="#00E8C8" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <path d="M40 80 Q38 115 40 150" stroke="#00E8C8" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <path d="M60 82 Q62 118 60 155" stroke="#00E8C8" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <path d="M80 80 Q82 115 80 150" stroke="#00E8C8" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <path d="M100 75 Q110 110 102 145" stroke="#00E8C8" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <circle cx="60" cy="55" r="12" fill="rgba(0,232,200,0.3)"/>
    <circle cx="60" cy="55" r="5" fill="#00E8C8"/>
  </g>

  <!-- Logo / wordmark -->
  <text x="80" y="260" font-family="Georgia, serif" font-style="italic" font-weight="600" font-size="72" letter-spacing="-2" fill="#C8F0FF">Phlix</text>

  <!-- Tagline -->
  <text x="80" y="310" font-family="Georgia, serif" font-style="italic" font-size="28" fill="#00E8C8" opacity="0.9">In the Dark, Life Finds a Way.</text>

  <!-- Divider line -->
  <line x1="80" y1="340" x2="500" y2="340" stroke="#0D2A40" stroke-width="1"/>

  <!-- Product descriptor -->
  <text x="80" y="375" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="rgba(200,240,255,0.6)">Self-hosted PHP media server</text>

  <!-- Tagline 2 -->
  <text x="80" y="410" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="rgba(200,240,255,0.4)">Roku · Samsung Tizen · Windows · Mobile · Any DLNA device</text>

  <!-- Corner accent jellyfish (small) -->
  <g transform="translate(1050, 500)" opacity="0.2">
    <ellipse cx="40" cy="30" rx="28" ry="22" fill="none" stroke="#00E8C8" stroke-width="1.2"/>
    <path d="M18 44 Q12 65 16 85" stroke="#00E8C8" stroke-width="1" fill="none" stroke-linecap="round"/>
    <path d="M28 46 Q26 68 28 88" stroke="#00E8C8" stroke-width="1" fill="none" stroke-linecap="round"/>
    <path d="M40 47 Q40 70 40 90" stroke="#00E8C8" stroke-width="1" fill="none" stroke-linecap="round"/>
    <path d="M52 46 Q54 68 52 88" stroke="#00E8C8" stroke-width="1" fill="none" stroke-linecap="round"/>
    <path d="M62 44 Q68 65 64 85" stroke="#00E8C8" stroke-width="1" fill="none" stroke-linecap="round"/>
    <circle cx="40" cy="30" r="6" fill="rgba(0,232,200,0.4)"/>
  </g>
</svg>
