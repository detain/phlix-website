<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" role="img" aria-label="Phlix logo">
  <title>Phlix</title>
  <defs>
    <radialGradient id="glow-aqua" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00E8C8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#00E8C8" stop-opacity="0"/>
    </radialGradient>
    <filter id="biolume-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Jellyfish bell silhouette -->
  <g transform="translate(10, 8)" filter="url(#biolume-glow)">
    <ellipse cx="20" cy="22" rx="18" ry="14" fill="none" stroke="#00E8C8" stroke-width="1.5" opacity="0.9"/>
    <path d="M8 30 Q5 38 7 46" stroke="#00E8C8" stroke-width="1.2" fill="none" stroke-linecap="round" opacity="0.6"/>
    <path d="M14 32 Q12 40 13 48" stroke="#00E8C8" stroke-width="1.2" fill="none" stroke-linecap="round" opacity="0.7"/>
    <path d="M20 33 Q20 42 20 50" stroke="#00E8C8" stroke-width="1.2" fill="none" stroke-linecap="round" opacity="0.8"/>
    <path d="M26 32 Q28 40 27 48" stroke="#00E8C8" stroke-width="1.2" fill="none" stroke-linecap="round" opacity="0.7"/>
    <path d="M32 30 Q35 38 33 46" stroke="#00E8C8" stroke-width="1.2" fill="none" stroke-linecap="round" opacity="0.6"/>
    <ellipse cx="20" cy="22" rx="8" ry="6" fill="rgba(0,232,200,0.15)"/>
    <circle cx="20" cy="22" r="3" fill="#00E8C8" opacity="0.8"/>
  </g>

  <!-- Wordmark -->
  <text
    x="60"
    y="40"
    font-family="Georgia, serif"
    font-style="italic"
    font-weight="600"
    font-size="30"
    letter-spacing="-0.5"
    fill="#C8F0FF"
  >Phlix</text>
</svg>
