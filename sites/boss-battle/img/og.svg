<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <title>Phlix - Boss Battle Theme OG Image</title>
  <desc>Your media. Your library. Your Phlix. - Self-hosted media server</desc>

  <!-- Background gradient -->
  <rect width="1200" height="630" fill="#0D0D0D"/>
  <ellipse cx="600" cy="0" rx="800" ry="400" fill="#1a0a1a"/>
  <ellipse cx="900" cy="500" rx="500" ry="300" fill="#1a0505"/>

  <!-- Decorative cross pattern -->
  <g stroke="#8B0000" stroke-width="1" opacity="0.3">
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="300" y1="157" x2="900" y2="472"/>
    <line x1="900" y1="157" x2="300" y2="472"/>
  </g>

  <!-- Shield shapes -->
  <path d="M100 150 L500 130 L500 350 L100 150Z" fill="none" stroke="#FFD700" stroke-width="3" opacity="0.6"/>
  <path d="M500 350 L1100 150 L1100 500 L500 350Z" fill="none" stroke="#8B0000" stroke-width="3" opacity="0.6"/>

  <!-- Center P logo -->
  <text x="600" y="340" font-family="serif" font-size="200" font-weight="bold" fill="#FFD700" text-anchor="middle" filter="url(#glow)">P</text>

  <!-- Glow filter -->
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Main text -->
  <text x="600" y="450" font-family="serif" font-size="72" font-weight="bold" fill="#E8E8E8" text-anchor="middle" letter-spacing="8">HLIX</text>

  <!-- Tagline -->
  <text x="600" y="530" font-family="sans-serif" font-size="28" fill="#999999" text-anchor="middle" letter-spacing="4">YOUR MEDIA. YOUR LIBRARY. YOUR TERMS.</text>

  <!-- Flame accents -->
  <path d="M200 580 Q220 550 200 520 Q240 550 220 580Z" fill="#8B0000" opacity="0.6"/>
  <path d="M1000 580 Q980 550 1000 520 Q960 550 980 580Z" fill="#8B0000" opacity="0.6"/>
</svg>
