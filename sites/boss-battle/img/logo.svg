<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 60" fill="none">
  <title>Phlix Logo</title>
  <desc>Self-hosted media server</desc>

  <!-- Shield outline -->
  <path d="M8 8 L140 4 L140 30 L8 8Z" fill="none" stroke="#FFD700" stroke-width="2"/>
  <path d="M140 30 L272 8 L272 52 L140 30Z" fill="none" stroke="#8B0000" stroke-width="2"/>

  <!-- Crossed swords -->
  <g stroke="#FFD700" stroke-width="2.5" stroke-linecap="round">
    <line x1="40" y1="50" x2="100" y2="20"/>
    <line x1="100" y1="20" x2="120" y2="25"/>
    <line x1="100" y1="20" x2="95" y2="40"/>
    <line x1="95" y1="40" x2="110" y2="45"/>
    <line x1="95" y1="40" x2="80" y2="38"/>
  </g>
  <g stroke="#8B0000" stroke-width="2.5" stroke-linecap="round">
    <line x1="240" y1="50" x2="180" y2="20"/>
    <line x1="180" y1="20" x2="160" y2="25"/>
    <line x1="180" y1="20" x2="185" y2="40"/>
    <line x1="185" y1="40" x2="170" y2="45"/>
    <line x1="185" y1="40" x2="200" y2="38"/>
  </g>

  <!-- P letter with glow -->
  <text x="136" y="50" font-family="serif" font-size="42" font-weight="bold" fill="#FFD700" filter="url(#glow)">P</text>

  <!-- Glow filter -->
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Text -->
  <text x="185" y="44" font-family="serif" font-size="28" font-weight="bold" fill="#E8E8E8" letter-spacing="4">HLIX</text>
</svg>
