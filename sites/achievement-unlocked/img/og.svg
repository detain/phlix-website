<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <!-- Background -->
  <rect width="1200" height="630" fill="#1A1A2E"/>
  
  <!-- Gradient overlay -->
  <defs>
    <radialGradient id="glow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#FFD700" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#1A1A2E" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#glow)"/>
  
  <!-- Trophy decoration -->
  <g transform="translate(540, 180)">
    <path d="M60 10 L84 10 L78 54 C78 72 66 84 60 84 C54 84 42 72 42 54 L36 10 L60 10Z" fill="#FFD700"/>
    <path d="M36 24 C24 24 18 36 18 45 C18 54 24 60 30 60 L36 54" stroke="#FFD700" stroke-width="4" fill="none"/>
    <path d="M84 24 C96 24 102 36 102 45 C102 54 96 60 90 60 L84 54" stroke="#FFD700" stroke-width="4" fill="none"/>
    <rect x="51" y="84" width="18" height="12" fill="#FFD700"/>
    <rect x="42" y="96" width="36" height="9" rx="3" fill="#C0C0C0"/>
    <path d="M60 30 L64 42 L76 42 L66 50 L70 62 L60 54 L50 62 L54 50 L44 42 L56 42 Z" fill="#1A1A2E"/>
  </g>
  
  <!-- Phlix text -->
  <text x="600" y="340" font-family="Oswald, Arial Black, sans-serif" font-size="72" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.1em">PHLIX</text>
  
  <!-- Tagline -->
  <text x="600" y="400" font-family="Source Sans 3, Arial, sans-serif" font-size="28" fill="#A0A0B0" text-anchor="middle">Your media. Your library. Your Phlix.</text>
  
  <!-- Achievement badge -->
  <g transform="translate(600, 480)">
    <rect x="-120" y="-20" width="240" height="40" rx="20" fill="rgba(255, 215, 0, 0.1)" stroke="#FFD700" stroke-width="2"/>
    <text x="0" y="8" font-family="Oswald, Arial Black, sans-serif" font-size="14" font-weight="600" fill="#FFD700" text-anchor="middle" letter-spacing="0.15em">ACHIEVEMENT UNLOCKED</text>
  </g>
  
  <!-- Corner decorations -->
  <circle cx="60" cy="60" r="30" fill="#FFD700" opacity="0.1"/>
  <circle cx="1140" cy="60" r="30" fill="#FFD700" opacity="0.1"/>
  <circle cx="60" cy="570" r="30" fill="#FFD700" opacity="0.1"/>
  <circle cx="1140" cy="570" r="30" fill="#FFD700" opacity="0.1"/>
</svg>
