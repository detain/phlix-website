<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" fill="none">
  <defs>
    <!-- Film reel gradient -->
    <linearGradient id="reelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C0C0C0"/>
      <stop offset="100%" stop-color="#909090"/>
    </linearGradient>
    <!-- Red accent -->
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF0000"/>
      <stop offset="100%" stop-color="#CC0000"/>
    </linearGradient>
  </defs>

  <!-- Left film reel icon -->
  <g transform="translate(5, 10)">
    <!-- Outer ring -->
    <circle cx="20" cy="20" r="18" stroke="url(#reelGrad)" stroke-width="2" fill="none"/>
    <!-- Inner ring -->
    <circle cx="20" cy="20" r="10" stroke="url(#reelGrad)" stroke-width="2" fill="none"/>
    <!-- Center hub -->
    <circle cx="20" cy="20" r="4" fill="url(#redGrad)"/>
    <!-- Spokes with sprocket holes -->
    <line x1="20" y1="2" x2="20" y2="8" stroke="url(#reelGrad)" stroke-width="2"/>
    <line x1="20" y1="32" x2="20" y2="38" stroke="url(#reelGrad)" stroke-width="2"/>
    <line x1="2" y1="20" x2="8" y2="20" stroke="url(#reelGrad)" stroke-width="2"/>
    <line x1="32" y1="20" x2="38" y2="20" stroke="url(#reelGrad)" stroke-width="2"/>
    <!-- Sprocket holes -->
    <circle cx="20" cy="3" r="1.5" fill="#1C1C1C"/>
    <circle cx="20" cy="37" r="1.5" fill="#1C1C1C"/>
    <circle cx="3" cy="20" r="1.5" fill="#1C1C1C"/>
    <circle cx="37" cy="20" r="1.5" fill="#1C1C1C"/>
  </g>

  <!-- Wordmark: Phlix -->
  <text x="55" y="38" font-family="Georgia, serif" font-size="28" font-weight="bold" fill="#C0C0C0" letter-spacing="-1">
    Phlix
  </text>

  <!-- Film strip accent line under text -->
  <g transform="translate(55, 48)">
    <rect width="80" height="3" fill="url(#redGrad)" rx="1"/>
    <!-- Sprocket holes on accent line -->
    <circle cx="5" cy="1.5" r="1" fill="#1C1C1C"/>
    <circle cx="15" cy="1.5" r="1" fill="#1C1C1C"/>
    <circle cx="25" cy="1.5" r="1" fill="#1C1C1C"/>
    <circle cx="35" cy="1.5" r="1" fill="#1C1C1C"/>
    <circle cx="45" cy="1.5" r="1" fill="#1C1C1C"/>
    <circle cx="55" cy="1.5" r="1" fill="#1C1C1C"/>
    <circle cx="65" cy="1.5" r="1" fill="#1C1C1C"/>
    <circle cx="75" cy="1.5" r="1" fill="#1C1C1C"/>
  </g>

  <!-- Second small film reel (decorative) -->
  <g transform="translate(150, 5)" opacity="0.5">
    <circle cx="10" cy="10" r="8" stroke="#909090" stroke-width="1.5" fill="none"/>
    <circle cx="10" cy="10" r="4" stroke="#909090" stroke-width="1" fill="none"/>
    <circle cx="10" cy="10" r="1.5" fill="#FF0000"/>
  </g>
</svg>
