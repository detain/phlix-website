<!-- OG card source — Film Reel, 1200x630.
     Editable source for img/og.png (rasterised with rsvg-convert).
     Cinema projection theme: film reels, sprocket holes, silver and red. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <title>Phlix — Your media. Your library. Your Phlix.</title>
  <desc>Social share card for Phlix in the Film Reel identity</desc>

  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1C1C1C" />
      <stop offset="100%" stop-color="#000000" />
    </linearGradient>
    <radialGradient id="glowRed" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF0000" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#FF0000" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowGold" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFD700" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#FFD700" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />

  <!-- Projector glow effect -->
  <ellipse cx="600" cy="0" rx="600" ry="400" fill="url(#glowRed)" />
  <ellipse cx="200" cy="630" rx="400" ry="300" fill="url(#glowGold)" />
  <ellipse cx="1000" cy="630" rx="400" ry="300" fill="url(#glowGold)" />

  <!-- Sprocket holes pattern top -->
  <g fill="#2a2a2a" opacity="0.8">
    <rect x="40" y="20" width="24" height="16" rx="2" />
    <rect x="84" y="20" width="24" height="16" rx="2" />
    <rect x="128" y="20" width="24" height="16" rx="2" />
    <rect x="172" y="20" width="24" height="16" rx="2" />
    <rect x="216" y="20" width="24" height="16" rx="2" />
    <rect x="260" y="20" width="24" height="16" rx="2" />
    <rect x="304" y="20" width="24" height="16" rx="2" />
    <rect x="348" y="20" width="24" height="16" rx="2" />
    <rect x="392" y="20" width="24" height="16" rx="2" />
    <rect x="436" y="20" width="24" height="16" rx="2" />
    <rect x="480" y="20" width="24" height="16" rx="2" />
    <rect x="524" y="20" width="24" height="16" rx="2" />
    <rect x="568" y="20" width="24" height="16" rx="2" />
    <rect x="612" y="20" width="24" height="16" rx="2" />
    <rect x="656" y="20" width="24" height="16" rx="2" />
    <rect x="700" y="20" width="24" height="16" rx="2" />
    <rect x="744" y="20" width="24" height="16" rx="2" />
    <rect x="788" y="20" width="24" height="16" rx="2" />
    <rect x="832" y="20" width="24" height="16" rx="2" />
    <rect x="876" y="20" width="24" height="16" rx="2" />
    <rect x="920" y="20" width="24" height="16" rx="2" />
    <rect x="964" y="20" width="24" height="16" rx="2" />
    <rect x="1008" y="20" width="24" height="16" rx="2" />
    <rect x="1052" y="20" width="24" height="16" rx="2" />
    <rect x="1096" y="20" width="24" height="16" rx="2" />
  </g>

  <!-- Sprocket holes pattern bottom -->
  <g fill="#2a2a2a" opacity="0.8">
    <rect x="40" y="594" width="24" height="16" rx="2" />
    <rect x="84" y="594" width="24" height="16" rx="2" />
    <rect x="128" y="594" width="24" height="16" rx="2" />
    <rect x="172" y="594" width="24" height="16" rx="2" />
    <rect x="216" y="594" width="24" height="16" rx="2" />
    <rect x="260" y="594" width="24" height="16" rx="2" />
    <rect x="304" y="594" width="24" height="16" rx="2" />
    <rect x="348" y="594" width="24" height="16" rx="2" />
    <rect x="392" y="594" width="24" height="16" rx="2" />
    <rect x="436" y="594" width="24" height="16" rx="2" />
    <rect x="480" y="594" width="24" height="16" rx="2" />
    <rect x="524" y="594" width="24" height="16" rx="2" />
    <rect x="568" y="594" width="24" height="16" rx="2" />
    <rect x="612" y="594" width="24" height="16" rx="2" />
    <rect x="656" y="594" width="24" height="16" rx="2" />
    <rect x="700" y="594" width="24" height="16" rx="2" />
    <rect x="744" y="594" width="24" height="16" rx="2" />
    <rect x="788" y="594" width="24" height="16" rx="2" />
    <rect x="832" y="594" width="24" height="16" rx="2" />
    <rect x="876" y="594" width="24" height="16" rx="2" />
    <rect x="920" y="594" width="24" height="16" rx="2" />
    <rect x="964" y="594" width="24" height="16" rx="2" />
    <rect x="1008" y="594" width="24" height="16" rx="2" />
    <rect x="1052" y="594" width="24" height="16" rx="2" />
    <rect x="1096" y="594" width="24" height="16" rx="2" />
  </g>

  <!-- Left film reel decoration -->
  <g transform="translate(100, 315)" opacity="0.25">
    <circle cx="0" cy="0" r="90" stroke="#C0C0C0" stroke-width="3" fill="none" />
    <circle cx="0" cy="0" r="60" stroke="#C0C0C0" stroke-width="2" fill="none" />
    <circle cx="0" cy="0" r="30" stroke="#C0C0C0" stroke-width="2" fill="none" />
    <circle cx="0" cy="0" r="12" fill="#FF0000" />
    <line x1="0" y1="-90" x2="0" y2="-62" stroke="#C0C0C0" stroke-width="3" />
    <line x1="0" y1="62" x2="0" y2="90" stroke="#C0C0C0" stroke-width="3" />
    <line x1="-90" y1="0" x2="-62" y2="0" stroke="#C0C0C0" stroke-width="3" />
    <line x1="62" y1="0" x2="90" y2="0" stroke="#C0C0C0" stroke-width="3" />
  </g>

  <!-- Right film reel decoration -->
  <g transform="translate(1100, 315)" opacity="0.2">
    <circle cx="0" cy="0" r="70" stroke="#C0C0C0" stroke-width="2" fill="none" />
    <circle cx="0" cy="0" r="45" stroke="#C0C0C0" stroke-width="2" fill="none" />
    <circle cx="0" cy="0" r="20" stroke="#C0C0C0" stroke-width="2" fill="none" />
    <circle cx="0" cy="0" r="8" fill="#FF0000" />
  </g>

  <!-- Eyebrow -->
  <text
    x="600"
    y="210"
    font-family="Helvetica, Arial, sans-serif"
    font-size="18"
    font-weight="600"
    letter-spacing="8"
    fill="#FF0000"
    text-anchor="middle"
  >
    SELF-HOSTED MEDIA SERVER
  </text>

  <!-- Main headline -->
  <text
    x="600"
    y="320"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="72"
    font-weight="700"
    fill="#FFFFFF"
    text-anchor="middle"
    letter-spacing="-2"
  >
    Phlix
  </text>

  <!-- Subline -->
  <text
    x="600"
    y="390"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="28"
    fill="#C0C0C0"
    text-anchor="middle"
  >
    Your media. Your library. Your Phlix.
  </text>

  <!-- Red accent bar -->
  <rect x="500" y="420" width="200" height="4" rx="2" fill="#FF0000" />

  <!-- Tagline -->
  <text
    x="600"
    y="480"
    font-family="Helvetica, Arial, sans-serif"
    font-size="16"
    fill="#909090"
    text-anchor="middle"
    letter-spacing="2"
  >
    OPEN-SOURCE MEDIA, ON YOUR TERMS.
  </text>
</svg>
