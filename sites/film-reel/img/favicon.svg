<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Background -->
  <rect width="32" height="32" rx="4" fill="#1C1C1C"/>

  <!-- Film reel icon centered -->
  <g transform="translate(16, 16)">
    <!-- Outer ring -->
    <circle cx="0" cy="0" r="12" stroke="#C0C0C0" stroke-width="1.5" fill="none"/>
    <!-- Inner ring -->
    <circle cx="0" cy="0" r="6" stroke="#C0C0C0" stroke-width="1" fill="none"/>
    <!-- Center hub -->
    <circle cx="0" cy="0" r="2.5" fill="#FF0000"/>
    <!-- Spokes -->
    <line x1="0" y1="-12" x2="0" y2="-7" stroke="#C0C0C0" stroke-width="1.5"/>
    <line x1="0" y1="7" x2="0" y2="12" stroke="#C0C0C0" stroke-width="1.5"/>
    <line x1="-12" y1="0" x2="-7" y2="0" stroke="#C0C0C0" stroke-width="1.5"/>
    <line x1="7" y1="0" x2="12" y2="0" stroke="#C0C0C0" stroke-width="1.5"/>
    <!-- Sprocket holes -->
    <circle cx="0" cy="-11" r="1" fill="#1C1C1C"/>
    <circle cx="0" cy="11" r="1" fill="#1C1C1C"/>
    <circle cx="-11" cy="0" r="1" fill="#1C1C1C"/>
    <circle cx="11" cy="0" r="1" fill="#1C1C1C"/>
  </g>
</svg>
