<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" width="240" height="60" role="img" aria-label="Phlix logo">
  <title>Phlix</title>
  <desc>Phlix media server — Egyptian Dusk brand kit wordmark</desc>

  <!-- Cartouche stele frame -->
  <rect x="1" y="1" width="238" height="58" rx="2" ry="2"
    fill="#0A0603"
    stroke="#D4A520"
    stroke-width="1.5"/>

  <!-- Inner glow line at top -->
  <line x1="12" y1="3" x2="228" y2="3" stroke="#D4A520" stroke-width="0.5" stroke-opacity="0.4"/>

  <!-- Wordmark: Phlix -->
  <text
    x="120" y="42"
    font-family="Cinzel Decorative, Trajan Pro, Georgia, serif"
    font-size="28"
    font-weight="700"
    letter-spacing="0.12em"
    text-anchor="middle"
    fill="#D4A520"
    filter="url(#gold-glow)">Phlix</text>

  <!-- Gold glow filter -->
  <defs>
    <filter id="gold-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Decorative ankh at right -->
  <g transform="translate(205, 30)" fill="none" stroke="#D4A520" stroke-width="1.2" stroke-linecap="square" opacity="0.65">
    <circle cx="0" cy="-10" r="5"/>
    <line x1="0" y1="-5" x2="0" y2="10"/>
    <line x1="-6" y1="2" x2="6" y2="2"/>
  </g>

  <!-- Decorative ankh at left (mirror) -->
  <g transform="translate(35, 30) scale(-1,1)" fill="none" stroke="#D4A520" stroke-width="1.2" stroke-linecap="square" opacity="0.65">
    <circle cx="0" cy="-10" r="5"/>
    <line x1="0" y1="-5" x2="0" y2="10"/>
    <line x1="-6" y1="2" x2="6" y2="2"/>
  </g>
</svg>
