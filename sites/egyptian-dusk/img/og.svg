<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Phlix — Your media. Your library. Your Phlix.">
  <title>Phlix — Your media. Your library. Your Phlix.</title>

  <!-- Dusk Over the Pyramids gradient background -->
  <defs>
    <linearGradient id="dusk-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#C8440A"/>
      <stop offset="45%"  stop-color="#D4A520"/>
      <stop offset="100%" stop-color="#0D2B5E"/>
    </linearGradient>
    <radialGradient id="ra-glow" cx="50%" cy="30%" r="55%">
      <stop offset="0%"   stop-color="rgba(212,165,32,0.45)"/>
      <stop offset="100%" stop-color="rgba(10,6,3,0.0)"/>
    </radialGradient>
    <linearGradient id="ground-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#0A0603"/>
      <stop offset="100%" stop-color="#1C1008"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#dusk-grad)"/>

  <!-- Ra's Descent radial glow -->
  <rect width="1200" height="630" fill="url(#ra-glow)"/>

  <!-- Pyramid silhouettes at bottom -->
  <polygon points="0,630 280,280 560,630" fill="#0A0603" opacity="0.85"/>
  <polygon points="350,630 600,200 850,630" fill="#0A0603" opacity="0.90"/>
  <polygon points="650,630 900,300 1150,630" fill="#0A0603" opacity="0.85"/>

  <!-- Ground strip -->
  <rect x="0" y="550" width="1200" height="80" fill="url(#ground-grad)"/>

  <!-- Sand-grain texture overlay (subtle) -->
  <rect width="1200" height="630" fill="url(#noise)" opacity="0.04">
    <filter id="noise">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" stitchTiles="stitch"/>
    </filter>
  </rect>

  <!-- Phlix wordmark -->
  <text
    x="600" y="260"
    font-family="Cinzel Decorative, Trajan Pro, Georgia, serif"
    font-size="120"
    font-weight="700"
    letter-spacing="0.1em"
    text-anchor="middle"
    fill="#FFF5D8"
    filter="url(#glow)">Phlix</text>

  <!-- Tagline -->
  <text
    x="600" y="340"
    font-family="Cinzel, Trajan Pro, Times New Roman, serif"
    font-size="32"
    font-weight="400"
    letter-spacing="0.15em"
    text-anchor="middle"
    fill="rgba(255,245,216,0.85)"
    text-transform="uppercase">Your media. Your library. Your Phlix.</text>

  <!-- Gold rule line -->
  <line x1="300" y1="380" x2="900" y2="380" stroke="#D4A520" stroke-width="1" stroke-opacity="0.6"/>

  <!-- Tagline secondary: Stories Carved in Gold. -->
  <text
    x="600" y="420"
    font-family="Cinzel, Trajan Pro, Georgia, serif"
    font-size="20"
    font-weight="400"
    letter-spacing="0.20em"
    text-anchor="middle"
    fill="rgba(212,165,32,0.85)"
    text-transform="uppercase">Stories Carved in Gold.</text>

</svg>
