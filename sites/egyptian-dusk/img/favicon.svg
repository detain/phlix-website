<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Phlix favicon">
  <title>Phlix</title>

  <!-- Pharaoh Gold square -->
  <rect width="32" height="32" fill="#D4A520" rx="2"/>

  <!-- Stylised ankh — the eternal symbol -->
  <g transform="translate(16, 17)" fill="none" stroke="#0A0603" stroke-width="2" stroke-linecap="square">
    <!-- Ankh circle -->
    <circle cx="0" cy="-5" r="4.5"/>
    <!-- Ankh vertical -->
    <line x1="0" y1="-1" x2="0" y2="9"/>
    <!-- Ankh horizontal -->
    <line x1="-5" y1="3" x2="5" y2="3"/>
  </g>
</svg>
