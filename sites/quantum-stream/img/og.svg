<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <!-- Quantum Stream OG Image -->
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1B2A"/>
      <stop offset="50%" stop-color="#1B263B"/>
      <stop offset="100%" stop-color="#0D1B2A"/>
    </linearGradient>
    <radialGradient id="cloud-grad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#415A77" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0D1B2A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E0E1DD"/>
      <stop offset="100%" stop-color="#778DA9"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg-grad)"/>

  <!-- Probability cloud effect -->
  <ellipse cx="600" cy="200" rx="500" ry="200" fill="url(#cloud-grad)"/>
  <ellipse cx="400" cy="300" rx="200" ry="150" fill="#415A77" opacity="0.08"/>
  <ellipse cx="800" cy="250" rx="250" ry="120" fill="#60A5FA" opacity="0.05"/>

  <!-- Atom structure - large centered -->
  <!-- Nucleus -->
  <circle cx="600" cy="280" r="20" fill="#778DA9"/>
  <circle cx="600" cy="280" r="10" fill="#E0E1DD" opacity="0.9"/>

  <!-- Orbital paths -->
  <ellipse cx="600" cy="280" rx="120" ry="45" stroke="#415A77" stroke-width="1.5" fill="none" opacity="0.6"/>
  <ellipse cx="600" cy="280" rx="120" ry="45" stroke="#415A77" stroke-width="1.5" fill="none" opacity="0.6" transform="rotate(60 600 280)"/>
  <ellipse cx="600" cy="280" rx="120" ry="45" stroke="#415A77" stroke-width="1.5" fill="none" opacity="0.6" transform="rotate(-60 600 280)"/>

  <!-- Electrons with glow -->
  <circle cx="720" cy="280" r="8" fill="#60A5FA">
    <animate attributeName="opacity" values="1;0.6;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="540" cy="138" r="6" fill="#60A5FA" opacity="0.8">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="540" cy="422" r="6" fill="#60A5FA" opacity="0.7">
    <animate attributeName="opacity" values="0.7;0.4;0.7" dur="2s" repeatCount="indefinite"/>
  </circle>

  <!-- Glow effect behind nucleus -->
  <circle cx="600" cy="280" r="40" fill="#60A5FA" opacity="0.1">
    <animate attributeName="r" values="35;45;35" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.1;0.15;0.1" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- Title text -->
  <text x="600" y="480" font-family="'IBM Plex Mono', monospace" font-size="48" font-weight="500" fill="url(#text-grad)" text-anchor="middle" letter-spacing="0.1em">QUANTUM STREAM</text>

  <!-- Subtitle -->
  <text x="600" y="530" font-family="'IBM Plex Mono', monospace" font-size="18" fill="#778DA9" text-anchor="middle" letter-spacing="0.06em">Every Frame. Every State. Observed.</text>

  <!-- Decorative line -->
  <line x1="400" y1="560" x2="800" y2="560" stroke="#415A77" stroke-width="1" opacity="0.4"/>

  <!-- Corner decorations - orbital brackets -->
  <path d="M 60 60 L 60 100 L 100 100" stroke="#415A77" stroke-width="1.5" fill="none" opacity="0.5"/>
  <path d="M 1140 60 L 1140 100 L 1100 100" stroke="#415A77" stroke-width="1.5" fill="none" opacity="0.5"/>
  <path d="M 60 570 L 60 530 L 100 530" stroke="#415A77" stroke-width="1.5" fill="none" opacity="0.5"/>
  <path d="M 1140 570 L 1140 530 L 1100 530" stroke="#415A77" stroke-width="1.5" fill="none" opacity="0.5"/>
</svg>
