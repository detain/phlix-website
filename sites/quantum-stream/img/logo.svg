<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 50" width="160" height="50">
  <defs>
    <linearGradient id="phlixGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#778da9"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
  </defs>
  <!-- Atom icon -->
  <g transform="translate(8, 5)">
    <!-- Orbit 1 -->
    <ellipse cx="20" cy="20" rx="16" ry="6" fill="none" stroke="#415a77" stroke-width="1" transform="rotate(-45 20 20)"/>
    <!-- Orbit 2 -->
    <ellipse cx="20" cy="20" rx="16" ry="6" fill="none" stroke="#415a77" stroke-width="1" transform="rotate(45 20 20)"/>
    <!-- Nucleus -->
    <circle cx="20" cy="20" r="4" fill="#60a5fa"/>
    <!-- Electron -->
    <circle cx="20" cy="4" r="2" fill="#60a5fa">
      <animateTransform attributeName="transform" type="rotate" from="0 20 20" to="360 20 20" dur="6s" repeatCount="indefinite"/>
    </circle>
  </g>
  <!-- Text: PHLIX -->
  <text x="55" y="33" font-family="'IBM Plex Mono', 'Consolas', monospace" font-size="24" font-weight="700" fill="#e0e1dd" letter-spacing="0.1em">PHLIX</text>
</svg>
