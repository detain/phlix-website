<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 40" fill="none">
  <!-- Quantum Stream Logo -->
  <!-- Atom structure with orbital paths -->
  <defs>
    <linearGradient id="orbital-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#415A77"/>
      <stop offset="50%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#415A77"/>
    </linearGradient>
    <radialGradient id="nucleus-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#778DA9"/>
      <stop offset="100%" stop-color="#415A77"/>
    </radialGradient>
  </defs>

  <!-- Central nucleus -->
  <circle cx="20" cy="20" r="6" fill="url(#nucleus-grad)"/>
  <circle cx="20" cy="20" r="3" fill="#E0E1DD" opacity="0.8"/>

  <!-- Orbital path 1 - horizontal -->
  <ellipse cx="20" cy="20" rx="16" ry="6" stroke="url(#orbital-grad)" stroke-width="0.75" fill="none" opacity="0.6"/>

  <!-- Orbital path 2 - diagonal -->
  <ellipse cx="20" cy="20" rx="16" ry="6" stroke="url(#orbital-grad)" stroke-width="0.75" fill="none" opacity="0.6" transform="rotate(60 20 20)"/>

  <!-- Orbital path 3 - diagonal opposite -->
  <ellipse cx="20" cy="20" rx="16" ry="6" stroke="url(#orbital-grad)" stroke-width="0.75" fill="none" opacity="0.6" transform="rotate(-60 20 20)"/>

  <!-- Electrons -->
  <circle cx="36" cy="20" r="2.5" fill="#60A5FA">
    <animate attributeName="opacity" values="1;0.5;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="10" cy="6" r="2" fill="#60A5FA">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="10" cy="34" r="2" fill="#60A5FA">
    <animate attributeName="opacity" values="0.7;0.4;0.7" dur="2s" repeatCount="indefinite"/>
  </circle>

  <!-- PHLIX wordmark -->
  <text x="48" y="26" font-family="'IBM Plex Mono', monospace" font-size="14" font-weight="500" fill="#E0E1DD" letter-spacing="0.08em">PHLIX</text>

  <!-- Quantum tagline -->
  <text x="100" y="26" font-family="'IBM Plex Mono', monospace" font-size="8" fill="#778DA9" letter-spacing="0.04em" opacity="0.8">QS</text>
</svg>
