<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Quantum Stream Favicon -->
  <!-- Atom structure at small scale -->
  <defs>
    <radialGradient id="fg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#415A77"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="32" height="32" fill="#0D1B2A" rx="4"/>

  <!-- Nucleus -->
  <circle cx="16" cy="16" r="3" fill="#778DA9"/>
  <circle cx="16" cy="16" r="1.5" fill="#E0E1DD" opacity="0.9"/>

  <!-- Orbital paths -->
  <ellipse cx="16" cy="16" rx="9" ry="3.5" stroke="#415A77" stroke-width="0.5" fill="none" opacity="0.7"/>
  <ellipse cx="16" cy="16" rx="9" ry="3.5" stroke="#415A77" stroke-width="0.5" fill="none" opacity="0.7" transform="rotate(60 16 16)"/>
  <ellipse cx="16" cy="16" rx="9" ry="3.5" stroke="#415A77" stroke-width="0.5" fill="none" opacity="0.7" transform="rotate(-60 16 16)"/>

  <!-- Electrons -->
  <circle cx="25" cy="16" r="1.5" fill="#60A5FA"/>
  <circle cx="8.5" cy="9" r="1.2" fill="#60A5FA" opacity="0.8"/>
  <circle cx="8.5" cy="23" r="1.2" fill="#60A5FA" opacity="0.6"/>
</svg>
