<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="nucleus" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#415a77"/>
    </radialGradient>
  </defs>
  <!-- Background -->
  <rect width="64" height="64" fill="#0d1b2a" rx="8"/>
  <!-- Orbit 1 -->
  <ellipse cx="32" cy="32" rx="26" ry="10" fill="none" stroke="#415a77" stroke-width="1" transform="rotate(-60 32 32)"/>
  <!-- Orbit 2 -->
  <ellipse cx="32" cy="32" rx="26" ry="10" fill="none" stroke="#415a77" stroke-width="1" transform="rotate(60 32 32)"/>
  <!-- Orbit 3 -->
  <ellipse cx="32" cy="32" rx="26" ry="10" fill="none" stroke="#415a77" stroke-width="1"/>
  <!-- Nucleus -->
  <circle cx="32" cy="32" r="6" fill="url(#nucleus)"/>
  <!-- Electrons -->
  <circle cx="32" cy="6" r="3" fill="#60a5fa">
    <animateTransform attributeName="transform" type="rotate" from="0 32 32" to="360 32 32" dur="8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="32" cy="6" r="3" fill="#60a5fa">
    <animateTransform attributeName="transform" type="rotate" from="120 32 32" to="480 32 32" dur="8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="32" cy="6" r="3" fill="#60a5fa">
    <animateTransform attributeName="transform" type="rotate" from="240 32 32" to="600 32 32" dur="8s" repeatCount="indefinite"/>
  </circle>
</svg>
