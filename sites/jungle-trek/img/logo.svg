<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 48" fill="none">
  <!-- Jungle Trek wordmark with emerald badge -->
  <!-- Background: deep rainforest green -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D2B0D"/>
      <stop offset="100%" stop-color="#1B4D1B"/>
    </linearGradient>
    <linearGradient id="gold-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#FFA500"/>
    </linearGradient>
    <linearGradient id="leaf-green" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#228B22"/>
      <stop offset="50%" stop-color="#32CD32"/>
      <stop offset="100%" stop-color="#0D2B0D"/>
    </linearGradient>
  </defs>

  <!-- Rounded rectangle badge -->
  <rect x="0" y="0" width="200" height="48" rx="6" fill="url(#bg)" stroke="#228B22" stroke-width="1"/>

  <!-- Left leaf accent -->
  <path d="M0 24 Q8 12 0 0 Q0 24 0 48 Q8 36 0 24" fill="#228B22"/>

  <!-- Bottom forest line -->
  <line x1="12" y1="40" x2="188" y2="40" stroke="#228B22" stroke-width="1" opacity="0.4"/>

  <!-- Leaf motif (top right) -->
  <path d="M175 8 Q185 8 188 18 Q180 14 175 8" fill="#228B22" opacity="0.6"/>
  <path d="M180 12 Q190 12 193 22 Q185 18 180 12" fill="#228B22" opacity="0.4"/>

  <!-- Wordmark: JUNGLE (slightly separated for jungle feel) -->
  <text x="16" y="31"
    font-family="'Libre Baskerville', 'Georgia', 'Times New Roman', serif"
    font-weight="400"
    font-size="16"
    letter-spacing="0.15em"
    fill="#F5DEB3">JUNGLE</text>

  <!-- Wordmark: TREK (bold, adventurous) -->
  <text x="78" y="31"
    font-family="'Libre Baskerville', 'Georgia', 'Times New Roman', serif"
    font-weight="700"
    font-size="18"
    letter-spacing="0.08em"
    fill="#FFD700">TREK</text>

  <!-- Dot accents (like fireflies) -->
  <circle cx="16" cy="42" r="2" fill="#FFD700" opacity="0.8"/>
  <circle cx="24" cy="42" r="1.5" fill="#228B22" opacity="0.6"/>
  <circle cx="30" cy="42" r="2" fill="#FFD700" opacity="0.6"/>

  <!-- Small leaf accent -->
  <path d="M160 38 Q165 33 168 38 Q165 35 160 38" fill="#228B22" opacity="0.7"/>
</svg>