<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <!-- OG social card: Jungle Trek branding -->
  <defs>
    <linearGradient id="og-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D2B0D"/>
      <stop offset="60%" stop-color="#1B4D1B"/>
      <stop offset="100%" stop-color="#0D2B0D"/>
    </linearGradient>
    <linearGradient id="canopy-glow" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#228B22" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#228B22" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="leaf-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#32CD32"/>
      <stop offset="50%" stop-color="#228B22"/>
      <stop offset="100%" stop-color="#0D2B0D"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#og-bg)"/>

  <!-- Subtle canopy layer lines -->
  <g opacity="0.08" stroke="#228B22" stroke-width="0.5">
    <path d="M0 200 Q300 150 600 200 Q900 250 1200 200"/>
    <path d="M0 250 Q300 200 600 250 Q900 300 1200 250"/>
    <path d="M0 300 Q300 250 600 300 Q900 350 1200 300"/>
    <path d="M0 350 Q300 300 600 350 Q900 400 1200 350"/>
  </g>

  <!-- Green glow top accent -->
  <rect width="1200" height="200" fill="url(#canopy-glow)"/>

  <!-- Forest green left bar -->
  <rect x="0" y="0" width="8" height="630" fill="#228B22"/>

  <!-- Canopy floor divider -->
  <path d="M0 440 Q600 400 1200 440 L1200 480 Q600 440 0 480 Z" fill="#0D2B0D" opacity="0.6"/>
  <path d="M0 448 Q600 408 1200 448" stroke="#FFD700" stroke-width="2" opacity="0.4" fill="none"/>

  <!-- Product name: Phlix -->
  <text x="80" y="160"
    font-family="'Libre Baskerville', 'Georgia', serif"
    font-weight="700"
    font-size="72"
    letter-spacing="0.04em"
    fill="#F5DEB3">PHLIX</text>

  <!-- Jungle Trek wordmark -->
  <text x="80" y="240"
    font-family="'Libre Baskerville', 'Georgia', serif"
    font-weight="400"
    font-size="36"
    letter-spacing="0.12em"
    fill="#FFD700">JUNGLE TREK</text>

  <!-- Tagline -->
  <text x="80" y="310"
    font-family="'Libre Baskerville', 'Georgia', serif"
    font-weight="400"
    font-size="24"
    fill="#F5DEB3" opacity="0.8">Your media. Your library. Your Phlix.</text>

  <!-- Leaf motif top right -->
  <g transform="translate(1000, 60)" opacity="0.6">
    <path d="M0 80 Q40 40 80 80 Q40 60 0 80" fill="#228B22"/>
    <path d="M20 60 Q60 20 100 60 Q60 40 20 60" fill="#228B22" opacity="0.8"/>
    <path d="M40 40 Q80 0 120 40 Q80 20 40 40" fill="#228B22" opacity="0.6"/>
  </g>

  <!-- Jungle floor strip -->
  <rect x="0" y="580" width="1200" height="50" fill="#0D2B0D"/>
  <text x="80" y="615"
    font-family="'Courier New', monospace"
    font-size="14"
    letter-spacing="0.04em"
    fill="#228B22">DEPTH: CANOPY_LAYER | SPECIES: 4_CLIENTS | STATUS: EXPEDITION_ACTIVE</text>

  <!-- Gold firefly accents -->
  <circle cx="920" cy="590" r="4" fill="#FFD700" opacity="0.9"/>
  <circle cx="930" cy="598" r="2" fill="#FFD700" opacity="0.6"/>
  <circle cx="940" cy="593" r="3" fill="#FFD700" opacity="0.7"/>

  <!-- Leaf silhouette bottom right -->
  <g transform="translate(1050, 490)" opacity="0.5">
    <path d="M0 80 Q30 40 60 80 Q30 60 0 80" fill="url(#leaf-grad)"/>
    <path d="M30 40 Q30 20 30 0" stroke="#228B22" stroke-width="1" fill="none"/>
  </g>
</svg>