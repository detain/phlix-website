<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Jungle Trek favicon - leaf in emerald circle -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D2B0D"/>
      <stop offset="100%" stop-color="#1B4D1B"/>
    </linearGradient>
    <linearGradient id="leaf-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#32CD32"/>
      <stop offset="100%" stop-color="#228B22"/>
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="16" cy="16" r="15" fill="url(#bg)" stroke="#228B22" stroke-width="1"/>

  <!-- Leaf shape -->
  <path d="M16 6 Q24 10 22 20 Q18 24 16 26 Q14 24 10 20 Q8 10 16 6" fill="url(#leaf-grad)"/>

  <!-- Leaf vein -->
  <path d="M16 8 Q16 14 16 24" stroke="#0D2B0D" stroke-width="1" opacity="0.5" fill="none"/>
  <path d="M16 12 Q19 14 18 18" stroke="#0D2B0D" stroke-width="0.5" opacity="0.4" fill="none"/>
  <path d="M16 14 Q13 16 14 19" stroke="#0D2B0D" stroke-width="0.5" opacity="0.4" fill="none"/>

  <!-- Gold accent dot -->
  <circle cx="22" cy="10" r="2" fill="#FFD700" opacity="0.8"/>
</svg>