<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img">
  <title>Phlix — Your media. Your library. Your Phlix.</title>
  <desc>Mosh Pit Open Graph image for Phlix media server</desc>
  <rect width="1200" height="630" fill="#000000"/>
  <!-- Diagonal slash -->
  <polygon points="0,0 300,0 0,200" fill="#FF0000"/>
  <polygon points="1200,630 900,630 1200,430" fill="#FF0000"/>
  <!-- X mark -->
  <g transform="translate(100, 215)" stroke="#FFFF00" stroke-width="20">
    <line x1="0" y1="0" x2="200" y2="200"/>
    <line x1="200" y1="0" x2="0" y2="200"/>
  </g>
  <!-- Text -->
  <text x="400" y="300" font-family="Arial Black, sans-serif" font-size="90" font-weight="900" fill="#FFFFFF" letter-spacing="4">Phlix</text>
  <text x="400" y="380" font-family="Arial, sans-serif" font-size="32" fill="#00FF00" letter-spacing="6">MEDIA SERVER</text>
  <text x="400" y="460" font-family="Arial, sans-serif" font-size="28" fill="#888888">Your media. Your library. Your Phlix.</text>
  <!-- Accent line -->
  <rect x="400" y="500" width="400" height="8" fill="#FFFF00"/>
</svg>
