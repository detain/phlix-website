<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" role="img" aria-label="Phlix">
  <title>Phlix</title>
  <defs>
    <linearGradient id="glitch" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF0000"/>
      <stop offset="50%" stop-color="#FFFF00"/>
      <stop offset="100%" stop-color="#00FF00"/>
    </linearGradient>
  </defs>
  <!-- Background shape - jagged/aggressive -->
  <polygon points="0,5 8,0 15,8 25,2 35,10 45,0 55,8 65,3 75,10 85,0 95,8 105,2 115,10 125,0 135,8 145,3 155,10 165,0 175,8 185,2 195,10 200,5 200,15 0,15" fill="#000"/>
  <!-- P letter - distorted -->
  <text x="10" y="48" font-family="Impact, Arial Black, sans-serif" font-size="42" font-weight="900" fill="#FF0000" transform="skewX(-5)">P</text>
  <!-- HLIX - stretched, chaotic -->
  <text x="55" y="48" font-family="Impact, Arial Black, sans-serif" font-size="42" font-weight="900" fill="#FFFFFF" transform="rotate(-2)">HLIX</text>
  <!-- Glitch overlay -->
  <text x="12" y="46" font-family="Impact, Arial Black, sans-serif" font-size="42" font-weight="900" fill="url(#glitch)" opacity="0.3" transform="skewX(-5)">P</text>
  <!-- Slash accent -->
  <line x1="52" y1="10" x2="55" y2="55" stroke="#FFFF00" stroke-width="3"/>
</svg>
