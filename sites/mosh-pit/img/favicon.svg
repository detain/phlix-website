<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Phlix favicon">
  <title>Phlix</title>
  <!-- Black background -->
  <rect width="32" height="32" fill="#000"/>
  <!-- Red P - distorted -->
  <text x="2" y="26" font-family="Impact, Arial Black, sans-serif" font-size="26" font-weight="900" fill="#FF0000" transform="skewX(-8)">P</text>
  <!-- Yellow slash -->
  <line x1="18" y1="4" x2="20" y2="30" stroke="#FFFF00" stroke-width="2"/>
  <!-- Green accent dot -->
  <circle cx="26" cy="8" r="3" fill="#00FF00"/>
</svg>
