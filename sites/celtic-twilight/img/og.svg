<!-- Celtic Twilight — OG social share image 1200x630 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Phlix — Where Every Story Finds Its Fire">
  <title>Phlix — Celtic Twilight</title>
  <defs>
    <linearGradient id="og-dusk" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D6A4F"/>
      <stop offset="45%" stop-color="#4A2578"/>
      <stop offset="100%" stop-color="#1A0D2E"/>
    </linearGradient>
    <radialGradient id="glow-gold" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(184,134,11,0.3)"/>
      <stop offset="100%" stop-color="rgba(184,134,11,0)"/>
    </radialGradient>
    <radialGradient id="glow-emerald" cx="30%" cy="70%" r="60%">
      <stop offset="0%" stop-color="rgba(45,106,79,0.4)"/>
      <stop offset="100%" stop-color="rgba(45,106,79,0)"/>
    </radialGradient>
  </defs>
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#og-dusk)"/>
  <!-- Atmospheric glows -->
  <ellipse cx="900" cy="500" rx="500" ry="300" fill="url(#glow-emerald)"/>
  <ellipse cx="300" cy="200" rx="400" ry="300" fill="url(#glow-gold)"/>
  <!-- Knotwork border frame (subtle) -->
  <rect x="20" y="20" width="1160" height="590" rx="8" fill="none" stroke="#B8860B" stroke-width="1.5" opacity="0.25"/>
  <!-- Logo -->
  <text x="600" y="220" font-family="Georgia, serif" font-size="72" font-weight="700" letter-spacing="0.14em" fill="#B8860B" text-anchor="middle">Phlix</text>
  <!-- Tagline -->
  <text x="600" y="330" font-family="Georgia, serif" font-size="36" font-weight="400" letter-spacing="0.06em" fill="#F4EDD8" text-anchor="middle" font-style="italic">Where Every Story Finds Its Fire.</text>
  <!-- Divider -->
  <line x1="350" y1="370" x2="850" y2="370" stroke="#B8860B" stroke-width="1" opacity="0.5"/>
  <!-- Subline -->
  <text x="600" y="430" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="rgba(244,237,216,0.7)" text-anchor="middle" letter-spacing="0.05em">Self-hosted media server — Roku, Samsung, Windows, Mobile, DLNA</text>
  <!-- Triskelion ornament -->
  <g transform="translate(600,520)" fill="none" stroke="#B8860B" stroke-width="2" stroke-linecap="round" opacity="0.6">
    <path d="M0,-28 Q14,-28 14,-14 Q14,0 0,0"/>
    <path d="M24,12 Q12,12 4,21 Q-4,30 -18,24"/>
    <path d="M21,-18 Q21,-6 12,3 Q3,12 -6,9"/>
    <circle cx="0" cy="0" r="7" fill="#B8860B" opacity="0.8"/>
  </g>
</svg>
