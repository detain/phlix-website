<!-- Celtic Twilight — Favicon: Emerald square with spiral ornament -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Phlix favicon">
  <title>Phlix</title>
  <rect width="32" height="32" rx="6" fill="#2D6A4F"/>
  <!-- Triskelion spiral ornament -->
  <g transform="translate(16,16)" fill="none" stroke="#B8860B" stroke-width="1.5" stroke-linecap="round">
    <path d="M0,-9 Q5,-9 5,-4 Q5,0 0,0"/>
    <path d="M8,4 Q4,4 1,7 Q-2,10 -6,8"/>
    <path d="M7,-6 Q7,-2 3,1 Q0,4 -4,3"/>
    <circle cx="0" cy="0" r="2.5" fill="#B8860B"/>
  </g>
</svg>
