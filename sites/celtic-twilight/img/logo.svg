<!-- Celtic Twilight — Phlix Logo -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 80" role="img" aria-label="Phlix">
  <title>Phlix — Celtic Twilight</title>
  <defs>
    <linearGradient id="dusk-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D6A4F"/>
      <stop offset="50%" stop-color="#4A2578"/>
      <stop offset="100%" stop-color="#1A0D2E"/>
    </linearGradient>
    <linearGradient id="knotwork-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C9980A"/>
      <stop offset="100%" stop-color="#B8860B"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="280" height="80" rx="10" fill="url(#dusk-bg)"/>
  <!-- Corner knotwork top-left -->
  <g transform="translate(8,8)" fill="none" stroke="url(#knotwork-gold)" stroke-width="1.5" stroke-linecap="round" opacity="0.7">
    <path d="M0,24 Q0,0 24,0"/>
    <path d="M4,20 Q4,4 20,4"/>
    <path d="M8,16 Q8,8 16,8"/>
    <circle cx="4" cy="4" r="2"/>
    <path d="M12,0 L12,8 Q12,12 8,12"/>
    <path d="M0,12 L8,12 Q12,12 12,8"/>
  </g>
  <!-- Corner knotwork top-right -->
  <g transform="translate(272,8) scale(-1,1)" fill="none" stroke="url(#knotwork-gold)" stroke-width="1.5" stroke-linecap="round" opacity="0.7">
    <path d="M0,24 Q0,0 24,0"/>
    <path d="M4,20 Q4,4 20,4"/>
    <path d="M8,16 Q8,8 16,8"/>
    <circle cx="4" cy="4" r="2"/>
    <path d="M12,0 L12,8 Q12,12 8,12"/>
    <path d="M0,12 L8,12 Q12,12 12,8"/>
  </g>
  <!-- Wordmark -->
  <text
    x="140" y="54"
    font-family="Georgia, serif"
    font-size="40"
    font-weight="700"
    letter-spacing="0.12em"
    fill="#B8860B"
    text-anchor="middle"
    dominant-baseline="middle">Phlix</text>
</svg>
