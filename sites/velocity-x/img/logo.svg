<svg viewBox="0 0 200 50" xmlns="http://www.w3.org/2000/svg" fill="none">
  <!-- Velocity X logo: angular slash-burst with wheel motif -->
  <rect width="200" height="50" fill="#000"/>
  <!-- Slash burst accent -->
  <path d="M0 10 L20 0 L25 15 L10 25 Z" fill="#FF0055"/>
  <path d="M175 0 L195 10 L190 25 L170 15 Z" fill="#00AAFF"/>
  <!-- Logo text -->
  <text x="45" y="36" font-family="'Bebas Neue', Impact, sans-serif" font-size="28" fill="#FFFFFF" letter-spacing="2">VELOCITY</text>
  <text x="155" y="36" font-family="'Bebas Neue', Impact, sans-serif" font-size="28" fill="#FF0055" letter-spacing="2">X</text>
  <!-- Underline slash -->
  <rect x="45" y="42" width="110" height="3" fill="#00AAFF" transform="skewX(-15)"/>
</svg>
