<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" fill="none">
  <!-- OG Image: 1200x630 Velocity X -->
  <rect width="1200" height="630" fill="#000"/>

  <!-- Background splatter accents -->
  <ellipse cx="200" cy="150" rx="120" ry="80" fill="rgba(255,0,85,0.15)"/>
  <ellipse cx="1000" cy="480" rx="150" ry="100" fill="rgba(0,170,255,0.1)"/>
  <ellipse cx="600" cy="100" rx="80" ry="50" fill="rgba(255,255,0,0.05)"/>

  <!-- Slash diagonal accent -->
  <path d="M900 0 L1200 0 L1200 630 L950 630 Z" fill="rgba(255,0,85,0.08)"/>
  <path d="M0 400 L300 0 L500 0 L200 400 Z" fill="rgba(0,170,255,0.06)"/>

  <!-- Central logo area -->
  <text x="600" y="280" font-family="'Bebas Neue', Impact, sans-serif" font-size="180" fill="#FFFFFF" text-anchor="middle" letter-spacing="8">VELOCITY X</text>

  <!-- Hot pink underline -->
  <rect x="350" y="295" width="500" height="8" fill="#FF0055" transform="skewX(-10)"/>

  <!-- Tagline -->
  <text x="600" y="380" font-family="'Space Grotesk', sans-serif" font-size="42" fill="#888888" text-anchor="middle" letter-spacing="4">DROP IN. PRESS PLAY.</text>

  <!-- Corner wheel marks -->
  <circle cx="100" cy="530" r="50" stroke="#FF0055" stroke-width="2" fill="none" opacity="0.3"/>
  <circle cx="1100" cy="100" r="40" stroke="#00AAFF" stroke-width="2" fill="none" opacity="0.3"/>

  <!-- Spray paint dots -->
  <circle cx="150" cy="120" r="8" fill="#FF0055" opacity="0.6"/>
  <circle cx="180" cy="140" r="5" fill="#00AAFF" opacity="0.6"/>
  <circle cx="1050" cy="520" r="6" fill="#FF0055" opacity="0.6"/>
  <circle cx="1080" cy="490" r="4" fill="#FFFF00" opacity="0.6"/>
</svg>
