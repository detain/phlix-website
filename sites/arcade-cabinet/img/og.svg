<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1A0A2E"/>
      <stop offset="50%" style="stop-color:#251442"/>
      <stop offset="100%" style="stop-color:#1A0A2E"/>
    </linearGradient>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FF00FF"/>
      <stop offset="50%" style="stop-color:#00FFFF"/>
      <stop offset="100%" style="stop-color:#FFD700"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glowCyan" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Grid lines -->
  <g opacity="0.1">
    <line x1="0" y1="100" x2="1200" y2="100" stroke="#FF00FF" stroke-width="1"/>
    <line x1="0" y1="200" x2="1200" y2="200" stroke="#FF00FF" stroke-width="1"/>
    <line x1="0" y1="300" x2="1200" y2="300" stroke="#00FFFF" stroke-width="1"/>
    <line x1="0" y1="400" x2="1200" y2="400" stroke="#00FFFF" stroke-width="1"/>
    <line x1="0" y1="500" x2="1200" y2="500" stroke="#FFD700" stroke-width="1"/>
    <line x1="300" y1="0" x2="300" y2="630" stroke="#FF00FF" stroke-width="1"/>
    <line x1="600" y1="0" x2="600" y2="630" stroke="#00FFFF" stroke-width="1"/>
    <line x1="900" y1="0" x2="900" y2="630" stroke="#FF00FF" stroke-width="1"/>
  </g>

  <!-- Corner decorations -->
  <g filter="url(#glowCyan)" opacity="0.6">
    <path d="M0 80 L0 0 L80 0" stroke="#00FFFF" stroke-width="3" fill="none"/>
    <path d="M1200 80 L1200 0 L1120 0" stroke="#00FFFF" stroke-width="3" fill="none"/>
    <path d="M0 550 L0 630 L80 630" stroke="#00FFFF" stroke-width="3" fill="none"/>
    <path d="M1200 550 L1200 630 L1120 630" stroke="#00FFFF" stroke-width="3" fill="none"/>
  </g>

  <!-- Phlix wordmark -->
  <g filter="url(#glow)" transform="translate(600, 200)">
    <!-- P letterform -->
    <text x="-200" y="50"
          font-family="Arial Black, sans-serif"
          font-size="180"
          font-weight="900"
          fill="url(#neonGrad)">P</text>
    <!-- HLIX text -->
    <text x="-30" y="50"
          font-family="Arial Black, sans-serif"
          font-size="120"
          font-weight="900"
          fill="url(#neonGrad)"
          letter-spacing="8">HLIX</text>
  </g>

  <!-- Tagline -->
  <text x="600" y="380"
        font-family="Arial, sans-serif"
        font-size="32"
        fill="#FFFFFF"
        text-anchor="middle"
        opacity="0.9">Your media. Your library. Your Phlix.</text>

  <!-- Sub tagline -->
  <text x="600" y="430"
        font-family="Arial, sans-serif"
        font-size="18"
        fill="#B8A3C7"
        text-anchor="middle">Self-hosted media server</text>

  <!-- Bottom accent line -->
  <rect x="400" y="480" width="400" height="3" rx="1.5" fill="url(#neonGrad)" opacity="0.8"/>

  <!-- Footer text -->
  <text x="600" y="560"
        font-family="Arial, sans-serif"
        font-size="14"
        fill="#B8A3C7"
        text-anchor="middle">Open-source media, on your terms.</text>

  <!-- Decorative dots -->
  <g fill="#FFD700" opacity="0.4">
    <circle cx="150" cy="550" r="4"/>
    <circle cx="170" cy="550" r="4"/>
    <circle cx="190" cy="550" r="4"/>
    <circle cx="1010" cy="550" r="4"/>
    <circle cx="1030" cy="550" r="4"/>
    <circle cx="1050" cy="550" r="4"/>
  </g>
</svg>
