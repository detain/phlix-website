<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" fill="none">
  <!-- Arcade cabinet style wordmark -->
  <defs>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FF00FF;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#00FFFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFD700;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glowMagenta" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- P letter - arcade style -->
  <g filter="url(#glowMagenta)">
    <path d="M15 10 L15 50 L25 50 L25 35 L35 35 C45 35 50 30 50 22 C50 14 45 10 35 10 Z M25 17 L35 17 C40 17 42 19 42 22 C42 25 40 28 35 28 L25 28 Z"
          fill="none"
          stroke="url(#neonGrad)"
          stroke-width="3"
          stroke-linecap="round"
          stroke-linejoin="round"/>
  </g>

  <!-- HLIX text -->
  <g filter="url(#glow)">
    <text x="62" y="42"
          font-family="Orbitron, Arial, sans-serif"
          font-size="32"
          font-weight="700"
          fill="url(#neonGrad)"
          letter-spacing="3">HLIX</text>
  </g>

  <!-- Decorative coin slot line -->
  <rect x="62" y="48" width="60" height="2" rx="1" fill="#FFD700" opacity="0.6"/>
</svg>