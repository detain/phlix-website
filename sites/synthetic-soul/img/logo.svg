<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" fill="none">
  <defs>
    <linearGradient id="heartGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B6B"/>
      <stop offset="50%" style="stop-color:#4ECDC4"/>
      <stop offset="100%" style="stop-color:#FFE66D"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Stylized heartbeat line -->
  <path d="M10 30 L30 30 L35 30 L40 15 L45 45 L50 20 L55 35 L60 30 L90 30"
        stroke="url(#heartGradient)"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        fill="none"
        filter="url(#glow)"/>

  <!-- Heart icon -->
  <path d="M15 22 C15 18 18 15 22 15 C26 15 29 18 29 22 C29 30 22 35 22 35 C22 35 15 30 15 22Z"
        fill="#FF6B6B"
        filter="url(#glow)"/>

  <!-- Phlix text -->
  <text x="70" y="42" font-family="Georgia, serif" font-size="32" font-weight="bold" fill="#f0f0f5">
    Phlix
  </text>

  <!-- Pulse dots -->
  <circle cx="170" cy="30" r="3" fill="#4ECDC4" opacity="0.6">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="182" cy="30" r="2" fill="#FFE66D" opacity="0.4">
    <animate attributeName="opacity" values="0.4;0.8;0.4" dur="1.5s" repeatCount="indefinite" begin="0.2s"/>
  </circle>
  <circle cx="192" cy="30" r="2" fill="#FF6B6B" opacity="0.4">
    <animate attributeName="opacity" values="0.4;0.8;0.4" dur="1.5s" repeatCount="indefinite" begin="0.4s"/>
  </circle>
</svg>
