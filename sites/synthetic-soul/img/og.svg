<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d0d1a"/>
      <stop offset="50%" style="stop-color:#1A1A2E"/>
      <stop offset="100%" style="stop-color:#0d0d1a"/>
    </linearGradient>
    <radialGradient id="glow1" cx="30%" cy="30%" r="50%">
      <stop offset="0%" style="stop-color:#FF6B6B;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#FF6B6B;stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="70%" cy="70%" r="50%">
      <stop offset="0%" style="stop-color:#4ECDC4;stop-opacity:0.2"/>
      <stop offset="100%" style="stop-color:#4ECDC4;stop-opacity:0"/>
    </radialGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f0f0f5"/>
      <stop offset="50%" style="stop-color:#C7F9CC"/>
      <stop offset="100%" style="stop-color:#FFE66D"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Decorative glows -->
  <ellipse cx="300" cy="200" rx="400" ry="300" fill="url(#glow1)"/>
  <ellipse cx="900" cy="450" rx="400" ry="300" fill="url(#glow2)"/>

  <!-- Grid pattern -->
  <g opacity="0.05">
    <line x1="0" y1="100" x2="1200" y2="100" stroke="#4ECDC4" stroke-width="1"/>
    <line x1="0" y1="200" x2="1200" y2="200" stroke="#4ECDC4" stroke-width="1"/>
    <line x1="0" y1="300" x2="1200" y2="300" stroke="#4ECDC4" stroke-width="1"/>
    <line x1="0" y1="400" x2="1200" y2="400" stroke="#4ECDC4" stroke-width="1"/>
    <line x1="0" y1="500" x2="1200" y2="500" stroke="#4ECDC4" stroke-width="1"/>
    <line x1="200" y1="0" x2="200" y2="630" stroke="#4ECDC4" stroke-width="1"/>
    <line x1="400" y1="0" x2="400" y2="630" stroke="#4ECDC4" stroke-width="1"/>
    <line x1="600" y1="0" x2="600" y2="630" stroke="#4ECDC4" stroke-width="1"/>
    <line x1="800" y1="0" x2="800" y2="630" stroke="#4ECDC4" stroke-width="1"/>
    <line x1="1000" y1="0" x2="1000" y2="630" stroke="#4ECDC4" stroke-width="1"/>
  </g>

  <!-- Heartbeat line -->
  <path d="M100 400 L300 400 L340 400 L360 350 L380 450 L400 380 L420 410 L440 400 L700 400
           L740 400 L760 420 L780 380 L800 400 L850 400 L900 400"
        stroke="#FF6B6B"
        stroke-width="3"
        stroke-linecap="round"
        stroke-linejoin="round"
        fill="none"
        opacity="0.6"/>

  <!-- Heart icon -->
  <g transform="translate(500, 180)">
    <path d="M100 130 C100 90 130 70 160 70 C190 70 220 90 220 130 C220 200 160 240 160 240 C160 240 100 200 100 130Z"
          fill="#FF6B6B"
          opacity="0.9"/>
    <path d="M160 110 C160 100 170 95 175 100 C180 95 190 100 190 110 C190 140 175 160 175 160 C175 160 160 140 160 110Z"
          fill="#4ECDC4"
          opacity="0.8"/>
  </g>

  <!-- Phlix text -->
  <text x="600" y="450" text-anchor="middle" font-family="Georgia, serif" font-size="120" font-weight="bold" fill="url(#textGrad)">
    Phlix
  </text>

  <!-- Tagline -->
  <text x="600" y="520" text-anchor="middle" font-family="Georgia, serif" font-size="28" fill="#a0a0b8" font-style="italic">
    Your media. Your library. Your terms.
  </text>

  <!-- Pulse indicators -->
  <circle cx="950" cy="200" r="8" fill="#4ECDC4">
    <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="980" cy="200" r="5" fill="#FFE66D">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite" begin="0.3s"/>
  </circle>
  <circle cx="1005" cy="200" r="5" fill="#FF6B6B">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite" begin="0.6s"/>
  </circle>
</svg>
