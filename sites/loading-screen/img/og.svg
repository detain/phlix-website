<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- DOS terminal style OG image -->

  <!-- Background -->
  <rect width="1200" height="630" fill="#000000"/>

  <!-- Scanline effect -->
  <defs>
    <pattern id="scanlines" patternUnits="userSpaceOnUse" width="4" height="4">
      <line x1="0" y1="0" x2="4" y2="0" stroke="#00FF00" stroke-width="0.5" opacity="0.05"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#scanlines)"/>

  <!-- Terminal frame -->
  <rect x="50" y="50" width="1100" height="530" fill="#000000" stroke="#00FF00" stroke-width="3" rx="4"/>

  <!-- Title bar -->
  <rect x="50" y="50" width="1100" height="40" fill="#00FF00"/>
  <text x="70" y="78" font-family="'Courier New', Courier, monospace" font-size="18" font-weight="bold" fill="#000000">C:\PHLIX\SERVER.EXE</text>

  <!-- Loading bar -->
  <rect x="100" y="150" width="900" height="40" fill="#333333" stroke="#00FF00" stroke-width="2"/>
  <rect x="100" y="150" width="600" height="40" fill="#00FF00">
    <animate attributeName="width" values="100;900;100" dur="3s" repeatCount="indefinite"/>
  </rect>

  <!-- Status text -->
  <text x="100" y="130" font-family="'Courier New', Courier, monospace" font-size="20" fill="#00FF00">
    <animate attributeName="opacity" values="1;0.5;1" dur="1s" repeatCount="indefinite"/>LOADING MEDIA LIBRARY...
  </text>

  <!-- Progress percentage -->
  <text x="1020" y="130" font-family="'Courier New', Courier, monospace" font-size="20" fill="#00FF00">66%</text>

  <!-- Main headline -->
  <text x="100" y="280" font-family="'Courier New', Courier, monospace" font-size="48" font-weight="bold" fill="#00FF00">YOUR MEDIA.</text>
  <text x="100" y="340" font-family="'Courier New', Courier, monospace" font-size="48" font-weight="bold" fill="#00FF00">YOUR LIBRARY.</text>
  <text x="100" y="400" font-family="'Courier New', Courier, monospace" font-size="48" font-weight="bold" fill="#00FF00">YOUR PHLIX.</text>

  <!-- Blinking cursor -->
  <rect x="100" y="420" width="20" height="30" fill="#00FF00">
    <animate attributeName="opacity" values="1;0;1" dur="0.8s" repeatCount="indefinite"/>
  </rect>

  <!-- Footer tagline -->
  <rect x="50" y="540" width="1100" height="40" fill="#333333"/>
  <text x="100" y="568" font-family="'Courier New', Courier, monospace" font-size="16" fill="#00FF00">Open-source media, on your terms. | phlix-server | MPL-2.0</text>

  <!-- Decorative corners -->
  <path d="M50 90 L50 130 L90 130" fill="none" stroke="#00FF00" stroke-width="2"/>
  <path d="M1150 90 L1150 130 L1110 130" fill="none" stroke="#00FF00" stroke-width="2"/>
  <path d="M50 490 L50 540 L90 540" fill="none" stroke="#00FF00" stroke-width="2"/>
  <path d="M1150 490 L1150 540 L1110 540" fill="none" stroke="#00FF00" stroke-width="2"/>
</svg>
