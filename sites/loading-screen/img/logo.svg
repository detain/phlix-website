<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" width="200" height="60">
  <!-- Loading bar style logo -->
  <defs>
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00FF00;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#00FF00;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#00FF00;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Logo text: PHLIX -->
  <text x="10" y="28" font-family="'Courier New', Courier, monospace" font-size="24" font-weight="bold" fill="#00FF00">PHLIX</text>

  <!-- Loading bar underneath -->
  <rect x="10" y="36" width="180" height="8" fill="#333333" stroke="#00FF00" stroke-width="1"/>
  <rect x="10" y="36" width="120" height="8" fill="url(#barGrad)"/>

  <!-- Percentage -->
  <text x="165" y="28" font-family="'Courier New', Courier, monospace" font-size="12" fill="#00FF00">66%</text>

  <!-- Blinking cursor -->
  <rect x="170" y="38" width="6" height="6" fill="#00FF00">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>
</svg>
