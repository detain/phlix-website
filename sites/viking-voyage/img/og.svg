<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <!-- Viking Voyage OG Image - 1200x630 -->
  <!-- Background -->
  <rect width="1200" height="630" fill="#1A1510"/>
  <!-- Aurora gradient effect -->
  <defs>
    <linearGradient id="aurora" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00CED1;stop-opacity:0.15" />
      <stop offset="50%" style="stop-color:#C9A227;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#8B4513;stop-opacity:0.1" />
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#aurora)"/>
  <!-- Decorative wave pattern -->
  <path d="M0 500 Q300 450 600 500 T1200 500 L1200 630 L0 630 Z" fill="#4A3728" opacity="0.3"/>
  <path d="M0 520 Q300 470 600 520 T1200 520 L1200 630 L0 630 Z" fill="#4A3728" opacity="0.2"/>
  <!-- Central shield/longship emblem -->
  <circle cx="600" cy="260" r="100" fill="none" stroke="#C9A227" stroke-width="3"/>
  <circle cx="600" cy="260" r="80" fill="none" stroke="#4A3728" stroke-width="2"/>
  <!-- Longship -->
  <path d="M520 270 Q600 290 680 270 L660 250 Q600 265 540 250 Z" fill="#C9A227"/>
  <!-- Aurora/sail -->
  <path d="M600 180 L600 250 M560 200 Q600 170 640 200" stroke="#00CED1" stroke-width="4" stroke-linecap="round"/>
  <!-- Oars -->
  <path d="M540 270 L520 250 M660 270 L680 250" stroke="#8B4513" stroke-width="2" stroke-linecap="round"/>
  <!-- Phlix text -->
  <text x="600" y="420" font-family="Georgia, serif" font-size="64" font-weight="bold" fill="#C9A227" text-anchor="middle" letter-spacing="8">PHLIX</text>
  <text x="600" y="480" font-family="Georgia, serif" font-size="28" fill="#9A8B78" text-anchor="middle" letter-spacing="4">VOYAGE</text>
  <!-- Tagline -->
  <text x="600" y="550" font-family="Georgia, serif" font-size="22" fill="#E8DCC4" text-anchor="middle" opacity="0.8">Your media. Your library. Your Phlix.</text>
  <!-- Decorative corner runes -->
  <text x="80" y="80" font-family="serif" font-size="40" fill="#4A3728">ᚠ</text>
  <text x="1120" y="80" font-family="serif" font-size="40" fill="#4A3728">ᚢ</text>
  <text x="80" y="580" font-family="serif" font-size="40" fill="#4A3728">ᚦ</text>
  <text x="1120" y="580" font-family="serif" font-size="40" fill="#4A3728">ᚨ</text>
</svg>
