<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" fill="none">
  <!-- Viking Longship silhouette with Phlix text -->
  <!-- Shield/roundel base -->
  <circle cx="30" cy="30" r="22" fill="#1A1510" stroke="#C9A227" stroke-width="2"/>
  <!-- Inner ring -->
  <circle cx="30" cy="30" r="17" fill="none" stroke="#4A3728" stroke-width="1"/>
  <!-- Longship hull -->
  <path d="M14 32 Q30 38 46 32 L42 28 Q30 32 18 28 Z" fill="#C9A227"/>
  <!-- Sail/wave -->
  <path d="M30 12 L30 26 M22 18 Q30 12 38 18" stroke="#00CED1" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Oar hints -->
  <path d="M18 32 L14 28 M42 32 L46 28" stroke="#8B4513" stroke-width="1" stroke-linecap="round"/>
  <!-- Phlix text -->
  <text x="62" y="26" font-family="Georgia, serif" font-size="18" font-weight="bold" fill="#C9A227" letter-spacing="2">PHLIX</text>
  <text x="62" y="42" font-family="Georgia, serif" font-size="10" fill="#9A8B78" letter-spacing="1">VOYAGE</text>
  <!-- Decorative underline -->
  <line x1="62" y1="48" x2="140" y2="48" stroke="#4A3728" stroke-width="1"/>
</svg>
