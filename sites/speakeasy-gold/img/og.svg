<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Phlix social share image">
  <title>Phlix — Your media. Your library.</title>

  <defs>
    <!-- Gilded candelabra radial glow -->
    <radialGradient id="og-glow" cx="50%" cy="55%" r="55%">
      <stop offset="0%" stop-color="#C9A84C" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#B86C2C" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0A0806" stop-opacity="0"/>
    </radialGradient>
    <!-- Bourbon pour gradient for CTA shape -->
    <linearGradient id="og-cta-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C9A84C"/>
      <stop offset="100%" stop-color="#B86C2C"/>
    </linearGradient>
    <!-- Herringbone pattern -->
    <pattern id="herringbone" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="#0A0806"/>
      <line x1="0" y1="20" x2="20" y2="0" stroke="#C9A84C" stroke-width="0.4" opacity="0.08"/>
      <line x1="-10" y1="10" x2="10" y2="10" stroke="#C9A84C" stroke-width="0.4" opacity="0.08"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#0A0806"/>
  <rect width="1200" height="630" fill="url(#herringbone)"/>
  <rect width="1200" height="630" fill="url(#og-glow)"/>

  <!-- Art Deco stepped arch frame -->
  <g transform="translate(600,315)" opacity="0.25">
    <!-- Sunburst rays -->
    <g stroke="#C9A84C" stroke-width="1" opacity="0.5">
      <line x1="0" y1="-260" x2="0" y2="-320" transform="rotate(0)"/>
      <line x1="0" y1="-260" x2="0" y2="-320" transform="rotate(15)"/>
      <line x1="0" y1="-260" x2="0" y2="-320" transform="rotate(30)"/>
      <line x1="0" y1="-260" x2="0" y2="-320" transform="rotate(45)"/>
      <line x1="0" y1="-260" x2="0" y2="-320" transform="rotate(60)"/>
      <line x1="0" y1="-260" x2="0" y2="-320" transform="rotate(75)"/>
      <line x1="0" y1="-260" x2="0" y2="-320" transform="rotate(90)"/>
      <line x1="0" y1="-260" x2="0" y2="-320" transform="rotate(105)"/>
      <line x1="0" y1="-260" x2="0" y2="-320" transform="rotate(120)"/>
      <line x1="0" y1="-260" x2="0" y2="-320" transform="rotate(135)"/>
      <line x1="0" y1="-260" x2="0" y2="-320" transform="rotate(150)"/>
      <line x1="0" y1="-260" x2="0" y2="-320" transform="rotate(165)"/>
      <line x1="0" y1="-260" x2="0" y2="-320" transform="rotate(180)"/>
      <line x1="0" y1="-260" x2="0" y2="-320" transform="rotate(195)"/>
      <line x1="0" y1="-260" x2="0" y2="-320" transform="rotate(210)"/>
      <line x1="0" y1="-260" x2="0" y2="-320" transform="rotate(225)"/>
      <line x1="0" y1="-260" x2="0" y2="-320" transform="rotate(240)"/>
      <line x1="0" y1="-260" x2="0" y2="-320" transform="rotate(255)"/>
      <line x1="0" y1="-260" x2="0" y2="-320" transform="rotate(270)"/>
      <line x1="0" y1="-260" x2="0" y2="-320" transform="rotate(285)"/>
      <line x1="0" y1="-260" x2="0" y2="-320" transform="rotate(300)"/>
      <line x1="0" y1="-260" x2="0" y2="-320" transform="rotate(315)"/>
      <line x1="0" y1="-260" x2="0" y2="-320" transform="rotate(330)"/>
      <line x1="0" y1="-260" x2="0" y2="-320" transform="rotate(345)"/>
    </g>
  </g>

  <!-- Stepped arch silhouette frame (top) -->
  <path d="M80,100 L80,70 L120,50 L160,30 L300,10 L500,5 L700,5 L900,10 L1040,30 L1080,50 L1120,70 L1120,100"
        fill="none" stroke="#8A6E2E" stroke-width="1.5" opacity="0.5"/>

  <!-- Brand name -->
  <text x="600" y="260"
        font-family="'Poiret One', 'Josefin Sans', 'Century Gothic', sans-serif"
        font-size="80"
        font-weight="400"
        fill="#C9A84C"
        text-anchor="middle"
        letter-spacing="20"
        style="text-transform:uppercase;">PHLIX</text>

  <!-- Tagline -->
  <text x="600" y="320"
        font-family="'Poiret One', 'Josefin Sans', 'Century Gothic', sans-serif"
        font-size="28"
        font-weight="400"
        fill="#F2E8D9"
        text-anchor="middle"
        letter-spacing="6"
        opacity="0.85"
        style="text-transform:uppercase;">Your media. Your library.</text>

  <!-- Art Deco rule line -->
  <line x1="300" y1="350" x2="900" y2="350" stroke="#8A6E2E" stroke-width="1"/>
  <rect x="592" y="343" width="16" height="16" fill="#C9A84C" transform="rotate(45 600 350)"/>

  <!-- Subline -->
  <text x="600" y="385"
        font-family="'Josefin Sans', 'Futura', sans-serif"
        font-size="16"
        font-weight="300"
        fill="#6B6560"
        text-anchor="middle"
        letter-spacing="4"
        style="text-transform:uppercase;">Self-hosted &bull; BSD-3-Clause &bull; No lock-in</text>

  <!-- Bottom stepped arch frame -->
  <path d="M80,530 L80,560 L120,580 L160,600 L300,620 L500,625 L700,625 L900,620 L1040,600 L1080,580 L1120,560 L1120,530"
        fill="none" stroke="#8A6E2E" stroke-width="1.5" opacity="0.5"/>
</svg>
