<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" role="img" aria-label="Phlix logo">
  <title>Phlix</title>
  <!-- Art Deco stepped-arch badge frame -->
  <defs>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C9A84C"/>
      <stop offset="50%" stop-color="#E8D080"/>
      <stop offset="100%" stop-color="#B8862A"/>
    </linearGradient>
  </defs>
  <!-- Stepped-arch outer frame -->
  <path d="M10,55 L10,35 L20,25 L30,15 L50,8 L80,5 L120,5 L150,8 L170,15 L180,25 L190,35 L190,55"
        fill="none" stroke="url(#gold-grad)" stroke-width="1.5"/>
  <!-- Inner double rule -->
  <path d="M16,55 L16,37 L24,28 L33,19 L51,13 L81,10 L119,10 L149,13 L167,19 L176,28 L184,37 L184,55"
        fill="none" stroke="#8A6E2E" stroke-width="0.75"/>
  <!-- Wordmark: PHLIX -->
  <text x="100" y="44"
        font-family="'Poiret One', 'Josefin Sans', 'Century Gothic', sans-serif"
        font-size="28"
        font-weight="400"
        fill="#C9A84C"
        text-anchor="middle"
        letter-spacing="8"
        style="text-transform:uppercase;">PHLIX</text>
  <!-- Small sunburst rays (decorative) -->
  <g opacity="0.4" stroke="#C9A84C" stroke-width="0.5">
    <line x1="100" y1="3" x2="100" y2="0"/>
    <line x1="60" y1="5" x2="55" y2="1"/>
    <line x1="140" y1="5" x2="145" y2="1"/>
  </g>
</svg>
