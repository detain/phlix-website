  <rect x="11" y="10" width="3" height="16" rx="1.5" fill="url(#favicon-gradient)" opacity="0.7"/>
  <rect x="16" y="12" width="3" height="12" rx="1.5" fill="url(#favicon-gradient)" opacity="0.6"/>
  <rect x="21" y="8" width="3" height="20" rx="1.5" fill="url(#favicon-gradient)"/>
  <rect x="26" y="13" width="3" height="10" rx="1.5" fill="url(#favicon-gradient)" opacity="0.55"/>
</svg>
