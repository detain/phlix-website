<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D0D1A"/>
      <stop offset="100%" stop-color="#1A1A2E"/>
    </linearGradient>
    <linearGradient id="logo-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7B68EE"/>
      <stop offset="50%" stop-color="#00CED1"/>
      <stop offset="100%" stop-color="#FF6B9D"/>
    </linearGradient>
    <radialGradient id="glow1" cx="30%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#7B68EE" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#7B68EE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="70%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#00CED1" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#00CED1" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg-gradient)"/>

  <!-- Glow effects -->
  <ellipse cx="300" cy="200" rx="400" ry="300" fill="url(#glow1)"/>
  <ellipse cx="900" cy="450" rx="400" ry="300" fill="url(#glow2)"/>

  <!-- Waveform decoration -->
  <g transform="translate(100, 480)" opacity="0.4">
    <rect x="0" y="25" width="8" height="30" rx="4" fill="url(#logo-gradient)"/>
    <rect x="16" y="15" width="8" height="50" rx="4" fill="url(#logo-gradient)"/>
    <rect x="32" y="20" width="8" height="40" rx="4" fill="url(#logo-gradient)"/>
    <rect x="48" y="5" width="8" height="70" rx="4" fill="url(#logo-gradient)"/>
    <rect x="64" y="18" width="8" height="44" rx="4" fill="url(#logo-gradient)"/>
    <rect x="80" y="28" width="8" height="24" rx="4" fill="url(#logo-gradient)"/>
    <rect x="96" y="12" width="8" height="56" rx="4" fill="url(#logo-gradient)"/>
    <rect x="112" y="22" width="8" height="36" rx="4" fill="url(#logo-gradient)"/>
  </g>

  <g transform="translate(950, 100)" opacity="0.3">
    <rect x="0" y="25" width="8" height="30" rx="4" fill="url(#logo-gradient)"/>
    <rect x="16" y="15" width="8" height="50" rx="4" fill="url(#logo-gradient)"/>
    <rect x="32" y="20" width="8" height="40" rx="4" fill="url(#logo-gradient)"/>
    <rect x="48" y="5" width="8" height="70" rx="4" fill="url(#logo-gradient)"/>
    <rect x="64" y="18" width="8" height="44" rx="4" fill="url(#logo-gradient)"/>
    <rect x="80" y="28" width="8" height="24" rx="4" fill="url(#logo-gradient)"/>
    <rect x="96" y="12" width="8" height="56" rx="4" fill="url(#logo-gradient)"/>
    <rect x="112" y="22" width="8" height="36" rx="4" fill="url(#logo-gradient)"/>
  </g>

  <!-- Logo -->
  <text x="600" y="260" font-family="system-ui, -apple-system, sans-serif" font-size="72" font-weight="700" fill="url(#logo-gradient)" text-anchor="middle">Phlix</text>

  <!-- Tagline -->
  <text x="600" y="340" font-family="system-ui, -apple-system, sans-serif" font-size="32" fill="#E8E8F0" text-anchor="middle" opacity="0.9">Your media. Your library. Your Phlix.</text>

  <!-- Subtext -->
  <text x="600" y="420" font-family="system-ui, -apple-system, sans-serif" font-size="20" fill="#9090A8" text-anchor="middle">Self-hosted media server</text>

  <!-- Bottom bar with gradient line -->
  <rect x="0" y="610" width="1200" height="20" fill="url(#logo-gradient)" opacity="0.6"/>
</svg>
