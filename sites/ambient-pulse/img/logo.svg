<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" width="200" height="60">
  <defs>
    <linearGradient id="logo-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7B68EE"/>
      <stop offset="50%" stop-color="#00CED1"/>
      <stop offset="100%" stop-color="#FF6B9D"/>
    </linearGradient>
    <linearGradient id="wave-gradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00CED1"/>
      <stop offset="100%" stop-color="#7B68EE"/>
    </linearGradient>
  </defs>

  <!-- Phlix wordmark -->
  <text x="8" y="42" font-family="system-ui, sans-serif" font-size="32" font-weight="700" fill="url(#logo-gradient)">Phlix</text>

  <!-- Waveform pulse indicator -->
  <g transform="translate(140, 18)">
    <rect x="0" y="12" width="4" height="12" rx="2" fill="url(#wave-gradient)" opacity="0.4"/>
    <rect x="6" y="6" width="4" height="24" rx="2" fill="url(#wave-gradient)" opacity="0.6">
      <animate attributeName="height" values="24;10;24" dur="1.4s" repeatCount="indefinite"/>
      <animate attributeName="y" values="6;14;6" dur="1.4s" repeatCount="indefinite"/>
    </rect>
    <rect x="12" y="9" width="4" height="18" rx="2" fill="url(#wave-gradient)" opacity="0.5">
      <animate attributeName="height" values="18;8;18" dur="1.1s" repeatCount="indefinite"/>
      <animate attributeName="y" values="9;14;9" dur="1.1s" repeatCount="indefinite"/>
    </rect>
    <rect x="18" y="4" width="4" height="28" rx="2" fill="url(#wave-gradient)" opacity="0.7">
      <animate attributeName="height" values="28;12;28" dur="1.6s" repeatCount="indefinite"/>
      <animate attributeName="y" values="4;12;4" dur="1.6s" repeatCount="indefinite"/>
    </rect>
    <rect x="24" y="8" width="4" height="20" rx="2" fill="url(#wave-gradient)" opacity="0.5">
      <animate attributeName="height" values="20;10;20" dur="1.3s" repeatCount="indefinite"/>
      <animate attributeName="y" values="8;13;8" dur="1.3s" repeatCount="indefinite"/>
    </rect>
    <rect x="30" y="11" width="4" height="14" rx="2" fill="url(#wave-gradient)" opacity="0.4">
      <animate attributeName="height" values="14;6;14" dur="1s" repeatCount="indefinite"/>
      <animate attributeName="y" values="11;15;11" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
