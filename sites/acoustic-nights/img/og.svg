<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <title>Phlix — Your media. Your library. Your Phlix.</title>
  <desc>Social sharing card for Phlix media server</desc>

  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1A0F0A"/>
      <stop offset="100%" style="stop-color:#241610"/>
    </linearGradient>
    <linearGradient id="glowTop" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:0.2"/>
      <stop offset="100%" style="stop-color:#FFD700;stop-opacity:0"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFF8E7"/>
      <stop offset="100%" style="stop-color:#D4A574"/>
    </linearGradient>
    <radialGradient id="glowCenter" cx="50%" cy="40%" r="50%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#FFD700;stop-opacity:0"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glowSmall" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Ambient glow from top -->
  <ellipse cx="600" cy="0" rx="600" ry="300" fill="url(#glowTop)"/>

  <!-- Center glow -->
  <ellipse cx="600" cy="250" rx="500" ry="300" fill="url(#glowCenter)"/>

  <!-- String lights decoration (top) -->
  <g opacity="0.6">
    <text x="100" y="80" font-size="24" fill="#FFD700" filter="url(#glowSmall)">✦</text>
    <text x="220" y="60" font-size="18" fill="#FFD700" filter="url(#glowSmall)">✧</text>
    <text x="340" y="75" font-size="20" fill="#FFD700" filter="url(#glowSmall)">✦</text>
    <text x="480" y="55" font-size="16" fill="#D4A574" filter="url(#glowSmall)">✧</text>
    <text x="600" y="70" font-size="22" fill="#FFD700" filter="url(#glowSmall)">✦</text>
    <text x="720" y="58" font-size="18" fill="#D4A574" filter="url(#glowSmall)">✧</text>
    <text x="840" y="78" font-size="20" fill="#FFD700" filter="url(#glowSmall)">✦</text>
    <text x="980" y="62" font-size="16" fill="#FFD700" filter="url(#glowSmall)">✧</text>
    <text x="1090" y="75" font-size="22" fill="#D4A574" filter="url(#glowSmall)">✦</text>
  </g>

  <!-- Logo icon -->
  <g transform="translate(500, 180)">
    <circle cx="100" cy="100" r="90" fill="none" stroke="#D4A574" stroke-width="3" opacity="0.5"/>
    <circle cx="100" cy="100" r="70" fill="none" stroke="#D4A574" stroke-width="2" opacity="0.3"/>
    <path d="M60 85 Q100 55, 140 85" stroke="#FFD700" stroke-width="4" fill="none" stroke-linecap="round" filter="url(#glowSmall)"/>
    <path d="M45 100 Q100 60, 155 100" stroke="#D4A574" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M60 115 Q100 145, 140 115" stroke="#FFD700" stroke-width="4" fill="none" stroke-linecap="round" filter="url(#glowSmall)"/>
    <circle cx="100" cy="100" r="8" fill="#FFD700" filter="url(#glow)"/>
  </g>

  <!-- Wordmark -->
  <text x="600" y="380" font-family="Georgia, serif" font-size="72" font-weight="600" fill="url(#textGrad)" text-anchor="middle" letter-spacing="-2" filter="url(#glowSmall)">
    Phlix
  </text>

  <!-- Tagline glow bar -->
  <rect x="480" y="405" width="240" height="3" rx="1.5" fill="#FFD700" opacity="0.7" filter="url(#glowSmall)"/>

  <!-- Tagline text -->
  <text x="600" y="460" font-family="Georgia, serif" font-size="28" font-style="italic" fill="#C4B5A0" text-anchor="middle">
    Your media. Your library. Your Phlix.
  </text>

  <!-- Bottom tagline -->
  <text x="600" y="570" font-family="Arial, sans-serif" font-size="18" fill="#8B7355" text-anchor="middle">
    Open-source media, on your terms.
  </text>

  <!-- Corner decorations -->
  <text x="60" y="600" font-size="14" fill="#5C4030">MPL-2.0 / MIT</text>
  <text x="1140" y="600" font-size="14" fill="#5C4030" text-anchor="end">@detain</text>
</svg>
