<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 80" fill="none">
  <title>Phlix — Acoustic Nights</title>
  <desc>Phlix media server logo for the acoustic-nights theme</desc>

  <defs>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFF8E7"/>
      <stop offset="100%" style="stop-color:#D4A574"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:0.6"/>
      <stop offset="50%" style="stop-color:#FFD700;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#FFD700;stop-opacity:0.6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Icon: Stylized sound wave / musical note -->
  <g transform="translate(8, 12)">
    <!-- Outer glow ring -->
    <circle cx="28" cy="28" r="26" fill="none" stroke="#FFD700" stroke-width="1" opacity="0.3"/>
    <!-- Inner warm circle -->
    <circle cx="28" cy="28" r="20" fill="#1A0F0A" stroke="#D4A574" stroke-width="2"/>

    <!-- Sound wave arcs representing acoustic / music -->
    <path d="M20 22 Q28 16, 36 22" stroke="#FFD700" stroke-width="2" fill="none" stroke-linecap="round" filter="url(#glow)"/>
    <path d="M16 28 Q28 20, 40 28" stroke="#D4A574" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M20 34 Q28 40, 36 34" stroke="#FFD700" stroke-width="2" fill="none" stroke-linecap="round" filter="url(#glow)"/>

    <!-- Center dot -->
    <circle cx="28" cy="28" r="3" fill="#FFD700" filter="url(#glow)"/>
  </g>

  <!-- Wordmark -->
  <text x="80" y="50" font-family="Georgia, serif" font-size="38" font-weight="600" fill="url(#textGrad)" letter-spacing="-1">
    Phlix
  </text>

  <!-- Tagline glow bar -->
  <rect x="80" y="58" width="80" height="2" rx="1" fill="url(#glowGrad)" opacity="0.7"/>
</svg>
