<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2C2C2C"/>
      <stop offset="100%" stop-color="#383838"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#FF4444"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Decorative grid lines -->
  <g opacity="0.1" stroke="#F5F5DC" stroke-width="1">
    <line x1="0" y1="157.5" x2="1200" y2="157.5"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="472.5" x2="1200" y2="472.5"/>
    <line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
  </g>
  <!-- Main wordmark -->
  <text x="600" y="280" font-family="Impact, Arial Black, sans-serif" font-size="180" font-weight="900" fill="url(#textGrad)" text-anchor="middle" dominant-baseline="middle">
    PHLIX
  </text>
  <!-- Tagline -->
  <text x="600" y="400" font-family="Arial, sans-serif" font-size="48" fill="#F5F5DC" text-anchor="middle" opacity="0.9">
    Your media. Your garage. Your rules.
  </text>
  <!-- Decorative sound waves -->
  <g opacity="0.6">
    <path d="M100 500 Q150 450, 200 500 T300 500" stroke="#FF4444" stroke-width="4" fill="none"/>
    <path d="M900 500 Q950 450, 1000 500 T1100 500" stroke="#FF4444" stroke-width="4" fill="none"/>
  </g>
  <g opacity="0.4">
    <path d="M120 530 Q170 480, 220 530 T320 530" stroke="#FFD700" stroke-width="3" fill="none"/>
    <path d="M880 530 Q930 480, 980 530 T1080 530" stroke="#FFD700" stroke-width="3" fill="none"/>
  </g>
  <!-- Bottom accent bar -->
  <rect x="0" y="600" width="1200" height="30" fill="#FF4444" opacity="0.8"/>
</svg>
