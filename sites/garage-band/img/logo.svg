<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" fill="none">
  <!-- Phlix text with rock/garage vibe -->
  <defs>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700"/>
      <stop offset="100%" style="stop-color:#FF4444"/>
    </linearGradient>
  </defs>
  <!-- Main wordmark -->
  <text x="10" y="45" font-family="Impact, Arial Black, sans-serif" font-size="42" font-weight="900" fill="url(#textGrad)">
    PHLIX
  </text>
  <!-- Decorative sound waves -->
  <path d="M160 20 Q170 15, 180 20 T200 20" stroke="#FF4444" stroke-width="3" fill="none" opacity="0.7"/>
  <path d="M165 30 Q175 25, 185 30 T205 30" stroke="#FFD700" stroke-width="2" fill="none" opacity="0.5"/>
  <path d="M170 40 Q180 35, 190 40 T210 40" stroke="#FF4444" stroke-width="2" fill="none" opacity="0.3"/>
  <!-- Garage band dots -->
  <circle cx="155" cy="45" r="4" fill="#FFD700"/>
  <circle cx="165" cy="48" r="3" fill="#FF4444"/>
  <circle cx="173" cy="46" r="2" fill="#FFD700"/>
</svg>
