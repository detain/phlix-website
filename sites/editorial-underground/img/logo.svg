<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 44" width="140" height="44">
  <!-- Zero-radius rectangular badge with 2px electric-yellow border -->
  <rect x="1" y="1" width="138" height="42" fill="#0A0A08" stroke="#FFE500" stroke-width="2"/>
  <!-- Registration mark corners -->
  <path d="M6 1V5M1 6H5" stroke="#FFE500" stroke-width="1.5" fill="none"/>
  <path d="M134 1V5M139 6H135" stroke="#FFE500" stroke-width="1.5" fill="none"/>
  <path d="M6 43V39M1 38H5" stroke="#FFE500" stroke-width="1.5" fill="none"/>
  <path d="M134 43V39M139 38H135" stroke="#FFE500" stroke-width="1.5" fill="none"/>
  <!-- Film reel / cassette shapes as the "logo mark" -->
  <g transform="translate(12, 10)">
    <!-- Left reel circle -->
    <circle cx="9" cy="12" r="7" fill="#FFE500"/>
    <circle cx="9" cy="12" r="3" fill="#0A0A08"/>
    <!-- Right reel circle -->
    <circle cx="23" cy="12" r="7" fill="#FFE500"/>
    <circle cx="23" cy="12" r="3" fill="#0A0A08"/>
    <!-- Tape window between reels -->
    <rect x="14" y="10" width="4" height="4" fill="#0A0A08"/>
  </g>
  <!-- PHLIX wordmark in Anton style -->
  <text x="54" y="31" font-family="Anton, Impact, Haettenschweiler, sans-serif" font-size="26" font-weight="400" fill="#FFE500" letter-spacing="1" text-transform="uppercase">PHLIX</text>
</svg>
