<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" width="240" height="60">
  <!-- Registration mark corners -->
  <rect x="2" y="2" width="8" height="2" fill="#555550" opacity="0.5"/>
  <rect x="2" y="2" width="2" height="8" fill="#555550" opacity="0.5"/>
  <rect x="230" y="2" width="8" height="2" fill="#555550" opacity="0.5"/>
  <rect x="236" y="2" width="2" height="8" fill="#555550" opacity="0.5"/>
  <rect x="2" y="56" width="8" height="2" fill="#555550" opacity="0.5"/>
  <rect x="2" y="50" width="2" height="8" fill="#555550" opacity="0.5"/>
  <rect x="230" y="56" width="8" height="2" fill="#555550" opacity="0.5"/>
  <rect x="236" y="50" width="2" height="8" fill="#555550" opacity="0.5"/>

  <!-- Background rectangle -->
  <rect x="10" y="8" width="220" height="44" fill="#0A0A08" stroke="#FFE500" stroke-width="2"/>

  <!-- Slash separator before wordmark -->
  <polygon points="18,8 30,8 30,52 18,52" fill="#FFE500"/>

  <!-- PHLIX wordmark -->
  <text x="42" y="43"
    font-family="Anton, Impact, Haettenschweiler, sans-serif"
    font-size="32"
    font-weight="400"
    letter-spacing="0.05em"
    fill="#F5F5F0"
    text-transform="uppercase">PHLIX</text>

  <!-- Lightning bolt accent -->
  <polygon points="190,16 198,28 194,28 202,40 192,30 196,30" fill="#FFE500"/>
</svg>
