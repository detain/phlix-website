<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Dark background -->
  <rect width="1200" height="630" fill="#0A0A08"/>

  <!-- Halftone dot texture -->
  <defs>
    <pattern id="dots" x="0" y="0" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#555550" opacity="0.15"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#dots)"/>

  <!-- Yellow gradient bar at bottom -->
  <rect x="0" y="560" width="1200" height="70" fill="#FFE500"/>
  <text x="600" y="610"
    font-family="Anton, Impact, sans-serif"
    font-size="28"
    font-weight="400"
    fill="#0A0A08"
    text-anchor="middle"
    letter-spacing="0.1em">DOWNLOAD PHLIX</text>

  <!-- Diagonal slash elements -->
  <polygon points="0,0 80,0 0,80" fill="#FFE500" opacity="0.15"/>
  <polygon points="1200,0 1120,0 1200,80" fill="#FFE500" opacity="0.15"/>

  <!-- Registration marks -->
  <rect x="30" y="30" width="20" height="3" fill="#555550" opacity="0.5"/>
  <rect x="30" y="30" width="3" height="20" fill="#555550" opacity="0.5"/>
  <rect x="1150" y="30" width="20" height="3" fill="#555550" opacity="0.5"/>
  <rect x="1167" y="30" width="3" height="20" fill="#555550" opacity="0.5"/>

  <!-- Main headline -->
  <text x="600" y="240"
    font-family="Anton, Impact, sans-serif"
    font-size="120"
    font-weight="400"
    fill="#F5F5F0"
    text-anchor="middle"
    letter-spacing="0.02em"
    text-transform="uppercase">YOUR MEDIA.</text>
  <text x="600" y="360"
    font-family="Anton, Impact, sans-serif"
    font-size="120"
    font-weight="400"
    fill="#FFE500"
    text-anchor="middle"
    letter-spacing="0.02em"
    text-transform="uppercase">YOUR LIBRARY.</text>
  <text x="600" y="480"
    font-family="Anton, Impact, sans-serif"
    font-size="120"
    font-weight="400"
    fill="#F5F5F0"
    text-anchor="middle"
    letter-spacing="0.02em"
    text-transform="uppercase">YOUR PHLIX.</text>

  <!-- Lightning bolt accent left -->
  <polygon points="100,280 115,340 105,340 125,410 90,320 100,320" fill="#FFE500" opacity="0.8"/>

  <!-- Lightning bolt accent right -->
  <polygon points="1100,280 1085,340 1095,340 1075,410 1110,320 1100,320" fill="#FFE500" opacity="0.8"/>
</svg>
