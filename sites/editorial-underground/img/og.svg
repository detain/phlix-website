<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Xerox Black background -->
  <rect width="1200" height="630" fill="#0A0A08"/>

  <!-- Halftone dot texture overlay -->
  <defs>
    <pattern id="halftone" x="0" y="0" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.2" fill="#555550" opacity="0.3"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#halftone)"/>

  <!-- Diagonal slash cut — top right to lower left -->
  <polygon points="700,0 1200,0 1200,630 500,630" fill="#111110"/>

  <!-- Electric yellow registration mark corners -->
  <path d="M40 20V50M20 40H50" stroke="#FFE500" stroke-width="3" fill="none"/>
  <path d="M1160 20V50M1180 40H1150" stroke="#FFE500" stroke-width="3" fill="none"/>
  <path d="M40 610V580M20 590H50" stroke="#FFE500" stroke-width="3" fill="none"/>
  <path d="M1160 610V580M1180 590H1150" stroke="#FFE500" stroke-width="3" fill="none"/>

  <!-- Film reel / safety pin hybrid mark -->
  <g transform="translate(80, 220)">
    <!-- Safety pin shape -->
    <ellipse cx="60" cy="80" rx="30" ry="60" fill="none" stroke="#FFE500" stroke-width="4"/>
    <path d="M60 20 L60 -20 Q60 -40 80 -40 L100 -40 Q120 -40 120 -20 L120 20 Q120 60 90 80 Q60 100 30 80 Q0 60 0 20 L0 -20 Q0 -40 20 -40 L40 -40 Q60 -40 60 -20 Z" fill="none" stroke="#FFE500" stroke-width="4"/>
    <!-- Safety pin coil lines -->
    <line x1="60" y1="20" x2="60" y2="140" stroke="#FFE500" stroke-width="3"/>
    <path d="M30 80 Q60 100 90 80 Q120 60 120 20 Q120 -40 60 -40 Q0 -40 0 20 Q0 60 30 80" fill="none" stroke="#FFE500" stroke-width="3"/>
  </g>

  <!-- Main PHLIX wordmark -->
  <text x="280" y="380" font-family="Anton, Impact, Haettenschweiler, sans-serif" font-size="160" font-weight="400" fill="#FFE500" letter-spacing="4">PHLIX</text>

  <!-- Primary tagline -->
  <text x="280" y="460" font-family="Oswald, 'Franklin Gothic Medium', sans-serif" font-size="48" font-weight="700" fill="#F5F5F0" letter-spacing="-1">No Signal. No Permission. Just Play.</text>

  <!-- Slash divider -->
  <line x1="280" y1="490" x2="900" y2="490" stroke="#FFE500" stroke-width="2"/>

  <!-- Sub-copy -->
  <text x="280" y="540" font-family="Space Mono, Courier New, monospace" font-size="22" fill="#AAAAAA">Self-hosted media server &mdash; Roku &bull; Samsung Tizen &bull; Windows &bull; Mobile &bull; DLNA</text>
</svg>
