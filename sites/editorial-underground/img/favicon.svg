<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Electric yellow square, zero radius — editorial underground primary -->
  <rect width="32" height="32" fill="#FFE500"/>
  <!-- Xerox Black band across middle (film frame) -->
  <rect x="0" y="10" width="32" height="12" fill="#0A0A08"/>
  <!-- Two film-reel circles -->
  <circle cx="10" cy="16" r="4" fill="#FFE500"/>
  <circle cx="10" cy="16" r="1.5" fill="#0A0A08"/>
  <circle cx="22" cy="16" r="4" fill="#FFE500"/>
  <circle cx="22" cy="16" r="1.5" fill="#0A0A08"/>
</svg>
