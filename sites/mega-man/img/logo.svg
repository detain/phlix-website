<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" width="200" height="60">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0099E6"/>
      <stop offset="100%" style="stop-color:#0077BE"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFE44D"/>
      <stop offset="100%" style="stop-color:#FFD700"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- PHLIX text with retro arcade style -->
  <text x="100" y="42" font-family="Impact, Arial Black, sans-serif" font-size="36" font-weight="bold" text-anchor="middle" letter-spacing="8" fill="url(#blueGrad)" filter="url(#glow)">
    PHLIX
  </text>

  <!-- Accent underline -->
  <rect x="30" y="50" width="140" height="4" rx="2" fill="url(#goldGrad)"/>

  <!-- Small decorative elements -->
  <rect x="20" y="48" width="8" height="8" fill="#0077BE"/>
  <rect x="172" y="48" width="8" height="8" fill="#FF4500"/>
</svg>