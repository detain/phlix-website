<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1A1A2E"/>
      <stop offset="50%" style="stop-color:#16162A"/>
      <stop offset="100%" style="stop-color:#1A1A2E"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0099E6"/>
      <stop offset="100%" style="stop-color:#0077BE"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFE44D"/>
      <stop offset="100%" style="stop-color:#FFD700"/>
    </linearGradient>
    <radialGradient id="glowBlue" cx="50%" cy="30%" r="60%">
      <stop offset="0%" style="stop-color:#0077BE;stop-opacity:0.4"/>
      <stop offset="100%" style="stop-color:#0077BE;stop-opacity:0"/>
    </radialGradient>
    <filter id="textGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <rect width="1200" height="630" fill="url(#glowBlue)"/>

  <!-- Decorative grid lines -->
  <g stroke="#2D2D4A" stroke-width="1" opacity="0.5">
    <line x1="0" y1="157" x2="1200" y2="157"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="473" x2="1200" y2="473"/>
    <line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
  </g>

  <!-- Accent elements -->
  <rect x="100" y="550" width="200" height="4" rx="2" fill="url(#goldGrad)"/>
  <rect x="900" y="550" width="200" height="4" rx="2" fill="#FF4500"/>

  <!-- Logo area -->
  <g transform="translate(100, 180)">
    <text font-family="Impact, Arial Black, sans-serif" font-size="72" font-weight="bold" fill="url(#blueGrad)" filter="url(#textGlow)" letter-spacing="12">
      PHLIX
    </text>
  </g>

  <!-- Tagline -->
  <text x="600" y="340" font-family="Arial, sans-serif" font-size="36" fill="#E0E0E0" text-anchor="middle" font-weight="bold">
    Your media. Your library. Your Phlix.
  </text>

  <!-- Sub text -->
  <text x="600" y="400" font-family="Arial, sans-serif" font-size="20" fill="#B0B0B0" text-anchor="middle">
    Self-hosted media server for Roku, Samsung TV, Windows, Mobile & DLNA
  </text>

  <!-- Feature icons row -->
  <g transform="translate(200, 480)" fill="none" stroke="#FFD700" stroke-width="2">
    <!-- Library icon -->
    <g transform="translate(0, 0)">
      <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z" stroke-width="1.5"/>
    </g>
    <!-- SyncPlay icon -->
    <g transform="translate(100, 0)">
      <circle cx="12" cy="12" r="10" stroke-width="1.5"/>
      <polyline points="12 6 12 12 16 14" stroke-width="1.5"/>
    </g>
    <!-- Transcode icon -->
    <g transform="translate(200, 0)">
      <polygon points="23 7 16 12 23 17 23 7" stroke-width="1.5"/>
      <rect x="1" y="5" width="15" height="14" rx="2" ry="2" stroke-width="1.5"/>
    </g>
    <!-- Shield icon -->
    <g transform="translate(300, 0)">
      <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" stroke-width="1.5"/>
    </g>
    <!-- Antenna icon -->
    <g transform="translate(400, 0)">
      <path d="M5 12.55a11 11 0 0 1 14.08 0M1.42 9a16 16 0 0 1 21.16 0M8.53 16.11a6 6 0 0 1 6.95 0M12 20h.01" stroke-width="1.5"/>
    </g>
    <!-- DLNA icon -->
    <g transform="translate(500, 0)">
      <circle cx="12" cy="12" r="2" stroke-width="1.5"/>
      <path d="M16.24 7.76a6 6 0 0 1 0 8.49m-8.48-.01a6 6 0 0 1 0-8.49" stroke-width="1.5"/>
    </g>
    <!-- Plugin icon -->
    <g transform="translate(600, 0)">
      <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z" stroke-width="1.5"/>
    </g>
    <!-- Hub icon -->
    <g transform="translate(700, 0)">
      <circle cx="12" cy="12" r="10" stroke-width="1.5"/>
      <line x1="2" y1="12" x2="22" y2="12" stroke-width="1.5"/>
      <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z" stroke-width="1.5"/>
    </g>
  </g>

  <!-- Bottom accent bar -->
  <rect x="0" y="620" width="1200" height="10" fill="url(#goldGrad)"/>
</svg>