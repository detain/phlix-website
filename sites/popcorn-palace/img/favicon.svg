<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Art Deco square favicon in gold/primary color -->
  <rect width="32" height="32" fill="#1A0A0A"/>
  <rect x="1" y="1" width="30" height="30" rx="2" stroke="#FFD700" stroke-width="1.5" fill="none"/>
  <rect x="3" y="3" width="26" height="26" rx="1" stroke="#8B0000" stroke-width="0.5" fill="none"/>

  <!-- Simple popcorn/film reel motif -->
  <circle cx="16" cy="16" r="8" fill="none" stroke="#FFD700" stroke-width="1.5"/>
  <circle cx="16" cy="16" r="3" fill="#FFD700"/>
  <circle cx="16" cy="9" r="1.5" fill="#FFD700"/>
  <circle cx="22" cy="13" r="1.5" fill="#FFD700"/>
  <circle cx="20" cy="20" r="1.5" fill="#FFD700"/>
  <circle cx="12" cy="20" r="1.5" fill="#FFD700"/>
  <circle cx="10" cy="13" r="1.5" fill="#FFD700"/>
</svg>
