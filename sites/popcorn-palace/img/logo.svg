<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" fill="none">
  <!-- Popcorn Palace Logo: Art Deco style with movie theater marquee feel -->
  <rect width="200" height="60" fill="#1A0A0A"/>

  <!-- Decorative marquee border -->
  <rect x="2" y="2" width="196" height="56" rx="2" stroke="#FFD700" stroke-width="1.5" fill="none"/>
  <rect x="6" y="6" width="188" height="48" rx="1" stroke="#8B0000" stroke-width="0.5" fill="none"/>

  <!-- Popcorn bucket shape -->
  <path d="M30 45 L30 25 Q30 20 35 20 L55 20 Q60 20 60 25 L60 45" fill="#F5DEB3" stroke="#FFD700" stroke-width="1"/>
  <!-- Popcorn kernels -->
  <ellipse cx="38" cy="18" rx="4" ry="3" fill="#FFD700"/>
  <ellipse cx="45" cy="15" rx="4" ry="3" fill="#FFD700"/>
  <ellipse cx="52" cy="17" rx="4" ry="3" fill="#FFD700"/>
  <ellipse cx="42" cy="12" rx="3" ry="2.5" fill="#F5DEB3"/>
  <ellipse cx="50" cy="13" rx="3" ry="2.5" fill="#F5DEB3"/>

  <!-- Text: PHLIX in Art Deco style -->
  <text x="75" y="35" font-family="Georgia, serif" font-size="22" font-weight="bold" fill="#FFD700" letter-spacing="3">PHLIX</text>

  <!-- Decorative lines -->
  <line x1="75" y1="40" x2="145" y2="40" stroke="#8B0000" stroke-width="1"/>
  <line x1="75" y1="43" x2="145" y2="43" stroke="#FFD700" stroke-width="0.5"/>

  <!-- Tagline -->
  <text x="75" y="52" font-family="Arial, sans-serif" font-size="8" fill="#F5DEB3" letter-spacing="1">MEDIA SERVER</text>

  <!-- Marquee lights -->
  <circle cx="165" cy="15" r="2" fill="#FFD700">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="175" cy="15" r="2" fill="#FFD700">
    <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="185" cy="15" r="2" fill="#8B0000">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="1.5s" repeatCount="indefinite"/>
  </circle>
</svg>
