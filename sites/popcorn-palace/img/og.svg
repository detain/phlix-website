<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#1A0A0A"/>

  <!-- Gradient overlay -->
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD700" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#8B0000" stop-opacity="0.2"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFD700" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#FFD700" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#goldGrad)"/>
  <ellipse cx="600" cy="315" rx="500" ry="300" fill="url(#glow)"/>

  <!-- Art Deco border frame -->
  <rect x="30" y="30" width="1140" height="570" rx="8" fill="none" stroke="#FFD700" stroke-width="3"/>
  <rect x="45" y="45" width="1110" height="540" rx="4" fill="none" stroke="#8B0000" stroke-width="1"/>

  <!-- Decorative corners -->
  <path d="M30 80 L30 30 L80 30" fill="none" stroke="#FFD700" stroke-width="4"/>
  <path d="M1120 30 L1170 30 L1170 80" fill="none" stroke="#FFD700" stroke-width="4"/>
  <path d="M1170 550 L1170 600 L1120 600" fill="none" stroke="#FFD700" stroke-width="4"/>
  <path d="M80 600 L30 600 L30 550" fill="none" stroke="#FFD700" stroke-width="4"/>

  <!-- Logo: Popcorn + PHLIX text -->
  <g transform="translate(400, 180)">
    <!-- Popcorn bucket -->
    <path d="M0 120 L0 60 Q0 40 20 40 L80 40 Q100 40 100 60 L100 120" fill="#F5DEB3" stroke="#FFD700" stroke-width="2"/>
    <!-- Popcorn kernels -->
    <ellipse cx="25" cy="35" rx="12" ry="10" fill="#FFD700"/>
    <ellipse cx="50" cy="25" rx="12" ry="10" fill="#FFD700"/>
    <ellipse cx="75" cy="32" rx="12" ry="10" fill="#FFD700"/>
    <ellipse cx="38" cy="15" rx="10" ry="8" fill="#F5DEB3"/>
    <ellipse cx="62" cy="18" rx="10" ry="8" fill="#F5DEB3"/>
  </g>

  <!-- PHLIX text -->
  <text x="540" y="270" font-family="Georgia, serif" font-size="100" font-weight="bold" fill="#FFD700" letter-spacing="8">PHLIX</text>

  <!-- Decorative line under text -->
  <line x1="540" y1="290" x2="860" y2="290" stroke="#8B0000" stroke-width="2"/>
  <line x1="540" y1="298" x2="860" y2="298" stroke="#FFD700" stroke-width="1"/>

  <!-- Tagline -->
  <text x="600" y="370" font-family="Arial, sans-serif" font-size="28" fill="#F5DEB3" text-anchor="middle" letter-spacing="2">Your media. Your library. Your Phlix.</text>

  <!-- Marquee light bulbs at bottom -->
  <g transform="translate(150, 480)">
    <circle cx="0" cy="0" r="8" fill="#FFD700">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="50" cy="0" r="8" fill="#FFD700">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" begin="0.3s"/>
    </circle>
    <circle cx="100" cy="0" r="8" fill="#8B0000">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="1.5s" repeatCount="indefinite" begin="0.6s"/>
    </circle>
    <circle cx="150" cy="0" r="8" fill="#FFD700">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" begin="0.9s"/>
    </circle>
    <circle cx="200" cy="0" r="8" fill="#FFD700">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" begin="1.2s"/>
    </circle>
    <circle cx="250" cy="0" r="8" fill="#8B0000">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="1.5s" repeatCount="indefinite" begin="1.5s"/>
    </circle>
    <circle cx="300" cy="0" r="8" fill="#FFD700">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" begin="1.8s"/>
    </circle>
    <circle cx="350" cy="0" r="8" fill="#FFD700">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" begin="2.1s"/>
    </circle>
    <circle cx="400" cy="0" r="8" fill="#8B0000">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="1.5s" repeatCount="indefinite" begin="2.4s"/>
    </circle>
    <circle cx="450" cy="0" r="8" fill="#FFD700">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" begin="2.7s"/>
    </circle>
    <circle cx="500" cy="0" r="8" fill="#FFD700">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" begin="3s"/>
    </circle>
    <circle cx="550" cy="0" r="8" fill="#8B0000">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="1.5s" repeatCount="indefinite" begin="3.3s"/>
    </circle>
    <circle cx="600" cy="0" r="8" fill="#FFD700">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" begin="3.6s"/>
    </circle>
    <circle cx="650" cy="0" r="8" fill="#FFD700">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" begin="3.9s"/>
    </circle>
    <circle cx="700" cy="0" r="8" fill="#8B0000">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="1.5s" repeatCount="indefinite" begin="4.2s"/>
    </circle>
    <circle cx="750" cy="0" r="8" fill="#FFD700">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" begin="4.5s"/>
    </circle>
    <circle cx="800" cy="0" r="8" fill="#FFD700">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" begin="4.8s"/>
    </circle>
    <circle cx="850" cy="0" r="8" fill="#8B0000">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="1.5s" repeatCount="indefinite" begin="5.1s"/>
    </circle>
    <circle cx="900" cy="0" r="8" fill="#FFD700">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" begin="5.4s"/>
    </circle>
  </g>

  <!-- Subtitle -->
  <text x="600" y="560" font-family="Arial, sans-serif" font-size="16" fill="#C4A882" text-anchor="middle" letter-spacing="1">Self-hosted media server</text>
</svg>
