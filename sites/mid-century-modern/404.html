<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>404 — Off the Flight Plan — Phlix</title>
    <meta
      name="description"
      content="Navigation error — this page has drifted off the flight plan. Orbit is confused but the mission can continue."
    />
    <link
      rel="canonical"
      href="https://detain.github.io/phlix-website/mid-century-modern/404.html"
    />
    <meta property="og:title" content="404 — Off the Flight Plan" />
    <meta
      property="og:description"
      content="Navigation error — this page has drifted off the flight plan."
    />
    <meta
      property="og:image"
      content="https://detain.github.io/phlix-website/mid-century-modern/img/og.png"
    />
    <meta
      property="og:url"
      content="https://detain.github.io/phlix-website/mid-century-modern/404.html"
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Phlix" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:creator" content="@detain" />
    <meta name="twitter:title" content="404 — Off the Flight Plan" />
    <meta
      name="twitter:description"
      content="Navigation error — this page has drifted off the flight plan."
    />
    <meta
      name="twitter:image"
      content="https://detain.github.io/phlix-website/mid-century-modern/img/og.png"
    />
    <meta name="theme-color" content="#111008" />
    <link rel="icon" type="image/svg+xml" href="img/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="img/favicon-16x16.png" />
    <link rel="apple-touch-icon" href="img/apple-touch-icon.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/theme.css" />
    <link rel="stylesheet" href="css/components.css" />
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to main content</a>

    <!-- Decorative marquee/starfield background -->
    <div
      style="
        position: fixed;
        inset: 0;
        background: var(--color-bg);
        overflow: hidden;
        pointer-events: none;
        z-index: 0;
      "
      aria-hidden="true"
    >
      <!-- Star field -->
      <svg
        style="position: absolute; inset: 0; width: 100%; height: 100%"
        viewBox="0 0 100 100"
        preserveAspectRatio="xMidYMid slice"
      >
        <g fill="#00AFAF" opacity="0.15">
          <circle cx="5" cy="10" r="0.4" />
          <circle cx="15" cy="25" r="0.3" />
          <circle cx="25" cy="8" r="0.5" />
          <circle cx="35" cy="30" r="0.3" />
          <circle cx="45" cy="15" r="0.4" />
          <circle cx="55" cy="5" r="0.3" />
          <circle cx="65" cy="28" r="0.5" />
          <circle cx="75" cy="12" r="0.3" />
          <circle cx="85" cy="22" r="0.4" />
          <circle cx="95" cy="8" r="0.3" />
          <circle cx="10" cy="45" r="0.3" />
          <circle cx="20" cy="55" r="0.5" />
          <circle cx="30" cy="40" r="0.3" />
          <circle cx="40" cy="60" r="0.4" />
          <circle cx="50" cy="50" r="0.3" />
          <circle cx="60" cy="65" r="0.5" />
          <circle cx="70" cy="42" r="0.3" />
          <circle cx="80" cy="58" r="0.4" />
          <circle cx="90" cy="48" r="0.3" />
          <circle cx="8" cy="75" r="0.4" />
          <circle cx="18" cy="88" r="0.3" />
          <circle cx="28" cy="70" r="0.5" />
          <circle cx="38" cy="82" r="0.3" />
          <circle cx="48" cy="72" r="0.4" />
          <circle cx="58" cy="90" r="0.3" />
          <circle cx="68" cy="78" r="0.5" />
          <circle cx="78" cy="85" r="0.3" />
          <circle cx="88" cy="70" r="0.4" />
          <circle cx="98" cy="80" r="0.3" />
        </g>
        <!-- Broken starburst / torn star chart lines -->
        <g stroke="#00AFAF" stroke-width="0.5" opacity="0.12">
          <line x1="30" y1="20" x2="55" y2="35" />
          <line x1="70" y1="25" x2="80" y2="50" stroke-dasharray="2,3" />
          <line x1="45" y1="75" x2="60" y2="55" stroke-dasharray="1,4" />
        </g>
      </svg>
    </div>

    <main
      id="main-content"
      style="
        position: relative;
        z-index: 1;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: var(--space-8);
      "
    >
      <!-- Confused Orbit -->
      <div style="margin-bottom: var(--space-8)">
        <svg
          viewBox="0 0 120 140"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
          aria-label="Orbit the rocket looking confused"
          role="img"
          style="width: 120px; height: 140px"
        >
          <!-- Question marks floating around -->
          <text
            x="85"
            y="25"
            font-family="'Bebas Neue', Impact, sans-serif"
            font-size="20"
            fill="#F2B705"
            opacity="0.7"
          >
            ?
          </text>
          <text
            x="95"
            y="45"
            font-family="'Bebas Neue', Impact, sans-serif"
            font-size="14"
            fill="#F2B705"
            opacity="0.5"
          >
            ?
          </text>
          <!-- Rocket body tilted -->
          <g transform="rotate(-12, 60, 70)">
            <ellipse
              cx="60"
              cy="70"
              rx="22"
              ry="38"
              fill="#1A1710"
              stroke="#00AFAF"
              stroke-width="2"
            />
            <path
              d="M60 32 C60 32 38 50 38 70 L82 70 C82 50 60 32 60 32Z"
              fill="#00AFAF"
              opacity="0.85"
            />
            <!-- Porthole -->
            <circle cx="60" cy="65" r="13" fill="#111008" stroke="#F2B705" stroke-width="2" />
            <circle cx="60" cy="65" r="9" fill="#1A1710" />
            <!-- Confused eyes -->
            <circle cx="55" cy="62" r="2.5" fill="#F5EFE8" />
            <circle cx="65" cy="62" r="2.5" fill="#F5EFE8" />
            <!-- Raised eyebrow (confused) -->
            <path
              d="M52 56 Q60 52 68 57"
              stroke="#F5EFE8"
              stroke-width="1.5"
              fill="none"
              stroke-linecap="round"
            />
            <!-- Frown -->
            <path
              d="M53 71 Q60 67 67 71"
              stroke="#F5EFE8"
              stroke-width="1.5"
              fill="none"
              stroke-linecap="round"
            />
            <!-- Fins -->
            <path d="M38 90 L20 115 L38 105 Z" fill="#F2B705" opacity="0.75" />
            <path d="M82 90 L100 115 L82 105 Z" fill="#F2B705" opacity="0.75" />
            <!-- Torn star chart in hand (small) -->
            <g transform="translate(75, 85) rotate(20)">
              <rect
                x="0"
                y="0"
                width="18"
                height="12"
                rx="1"
                fill="#231F16"
                stroke="#2E2A1E"
                stroke-width="1"
                opacity="0.9"
              />
              <line
                x1="3"
                y1="3"
                x2="15"
                y2="3"
                stroke="#00AFAF"
                stroke-width="0.5"
                opacity="0.6"
              />
              <line
                x1="3"
                y1="6"
                x2="12"
                y2="6"
                stroke="#00AFAF"
                stroke-width="0.5"
                opacity="0.6"
              />
              <line
                x1="3"
                y1="9"
                x2="10"
                y2="9"
                stroke="#00AFAF"
                stroke-width="0.5"
                opacity="0.6"
              />
              <path d="M18 0 L18 12" stroke="#2E2A1E" stroke-width="1" stroke-dasharray="2,1" />
            </g>
          </g>
          <!-- Question mark on torn chart -->
          <text
            x="90"
            y="100"
            font-family="'Bebas Neue', Impact, sans-serif"
            font-size="10"
            fill="#00AFAF"
            opacity="0.5"
          >
            ?!
          </text>
        </svg>
      </div>

      <!-- Error heading -->
      <h1 class="text-display" style="margin-bottom: var(--space-4); color: var(--color-text)">
        404
      </h1>
      <h2 class="text-headline" style="margin-bottom: var(--space-6); color: var(--color-neutral)">
        Off the Flight Plan
      </h2>
      <p
        class="text-body"
        style="
          max-width: 440px;
          color: var(--color-neutral);
          margin-bottom: var(--space-8);
          line-height: 1.8;
        "
      >
        Orbit has lost the chart. The page you're looking for has drifted off course — but the
        mission isn't over. Head back to base and try another heading.
      </p>

      <!-- Recovery links -->
      <nav
        aria-label="Recovery navigation"
        style="display: flex; gap: var(--space-4); flex-wrap: wrap; justify-content: center"
      >
        <a href="./" class="btn btn--primary btn--lg">Return to Home</a>
        <a href="features.html" class="btn btn--secondary btn--lg">Browse Features</a>
        <a href="download.html" class="btn btn--ghost btn--lg">Get Phlix</a>
      </nav>
    </main>

    <script src="js/main.js" defer></script>
  </body>
</html>
