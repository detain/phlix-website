<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <title>Phlix favicon</title>
  <desc>Atomic teal sunburst mark on charcoal evening</desc>

  <!-- Charcoal background -->
  <rect width="32" height="32" rx="6" fill="#111008"/>

  <!-- Atomic teal circle -->
  <circle cx="16" cy="16" r="11" fill="none" stroke="#00AFAF" stroke-width="1.5" opacity="0.8"/>

  <!-- Center dot -->
  <circle cx="16" cy="16" r="4" fill="#00AFAF"/>

  <!-- Sunburst ticks -->
  <line x1="16" y1="5" x2="16" y2="8" stroke="#F2B705" stroke-width="2" stroke-linecap="round"/>
  <line x1="27" y1="16" x2="24" y2="16" stroke="#00AFAF" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="16" y1="27" x2="16" y2="24" stroke="#00AFAF" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="5" y1="16" x2="8" y2="16" stroke="#00AFAF" stroke-width="1.5" stroke-linecap="round"/>
</svg>
