<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Phlix social share image">
  <title>Phlix — Self-hosted media server</title>
  <desc>Mid-Century Modern Phlix social share card with atomic teal sunburst and the tagline The Future Was Always Now.</desc>

  <defs>
    <!-- Atomic Horizon gradient — teal to yellow -->
    <linearGradient id="og-hero-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00AFAF"/>
      <stop offset="100%" stop-color="#F2B705"/>
    </linearGradient>
    <!-- Radial sunburst glow -->
    <radialGradient id="og-sunburst" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(242,183,5,0.25)" stop-opacity="1"/>
      <stop offset="60%" stop-color="rgba(0,175,175,0.08)" stop-opacity="1"/>
      <stop offset="100%" stop-color="#111008" stop-opacity="1"/>
    </radialGradient>
    <!-- Walnut depth gradient -->
    <linearGradient id="og-walnut" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1A1710"/>
      <stop offset="100%" stop-color="#111008"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#111008"/>

  <!-- Large ambient sunburst radial glow top-right -->
  <ellipse cx="900" cy="300" rx="600" ry="450" fill="url(#og-sunburst)"/>

  <!-- Thin teal geometric accent lines -->
  <line x1="0" y1="400" x2="1200" y2="400" stroke="#2E2A1E" stroke-width="1" opacity="0.6"/>
  <line x1="0" y1="580" x2="1200" y2="580" stroke="#2E2A1E" stroke-width="1" opacity="0.4"/>

  <!-- Atomic teal vertical accent bar left -->
  <rect x="60" y="120" width="3" height="390" fill="#00AFAF" opacity="0.5" rx="1.5"/>

  <!-- Sunburst geometric element bottom-left -->
  <g transform="translate(100, 530)" opacity="0.15">
    <circle cx="0" cy="0" r="80" fill="none" stroke="#00AFAF" stroke-width="2"/>
    <line x1="-80" y1="0" x2="80" y2="0" stroke="#00AFAF" stroke-width="1.5"/>
    <line x1="0" y1="-80" x2="0" y2="80" stroke="#00AFAF" stroke-width="1.5"/>
    <line x1="-57" y1="-57" x2="57" y2="57" stroke="#00AFAF" stroke-width="1"/>
    <line x1="-57" y1="57" x2="57" y2="-57" stroke="#00AFAF" stroke-width="1"/>
    <circle cx="0" cy="0" r="40" fill="none" stroke="#F2B705" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="10" fill="#00AFAF"/>
  </g>

  <!-- PHLIX wordmark -->
  <text x="90" y="300"
    font-family="'Josefin Sans', 'Futura', 'Century Gothic', sans-serif"
    font-size="96"
    font-weight="600"
    fill="#F5EFE8"
    letter-spacing="14"
    text-anchor="start">PHLIX</text>

  <!-- Tagline primary -->
  <text x="90" y="360"
    font-family="'Josefin Sans', 'Futura', 'Century Gothic', sans-serif"
    font-size="32"
    font-weight="400"
    fill="#00AFAF"
    letter-spacing="4"
    text-anchor="start">The Future Was Always Now.</text>

  <!-- Thin horizontal rule -->
  <rect x="90" y="385" width="300" height="2" fill="#F2B705" rx="1"/>

  <!-- Product descriptor -->
  <text x="90" y="430"
    font-family="'Libre Baskerville', 'Georgia', serif"
    font-size="20"
    fill="#8C7B6A"
    letter-spacing="0.5"
    text-anchor="start">Self-hosted PHP media server</text>

  <!-- Tagline secondary variants -->
  <text x="90" y="470"
    font-family="'Libre Baskerville', 'Georgia', serif"
    font-size="16"
    fill="#8C7B6A"
    letter-spacing="0.3"
    text-anchor="start"
    opacity="0.7">SyncPlay · Live TV · DLNA · Plugins</text>

  <!-- Atomic teal circle accent top-right -->
  <circle cx="1050" cy="120" r="50" fill="none" stroke="#00AFAF" stroke-width="2" opacity="0.4"/>
  <circle cx="1050" cy="120" r="25" fill="none" stroke="#F2B705" stroke-width="1.5" opacity="0.5"/>
  <circle cx="1050" cy="120" r="8" fill="#00AFAF"/>

  <!-- Bottom bar — accent -->
  <rect x="0" y="600" width="1200" height="30" fill="#1A1710"/>
  <rect x="0" y="600" width="200" height="30" fill="#00AFAF" opacity="0.2"/>
  <text x="90" y="620"
    font-family="'Josefin Sans', sans-serif"
    font-size="11"
    font-weight="400"
    fill="#8C7B6A"
    letter-spacing="3"
    text-anchor="start"
    opacity="0.7">MID-CENTURY MODERN · ATOMIC AGE OPTIMISM</text>
</svg>
