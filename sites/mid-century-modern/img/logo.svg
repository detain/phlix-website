<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 60" role="img" aria-label="Phlix logo">
  <title>Phlix</title>
  <desc>Mid-Century Modern Phlix logo — Josefin Sans uppercase wordmark in cream on charcoal evening with an atomic teal sunburst ring, evoking 1950s space-age optimism.</desc>

  <defs>
    <!-- Sunburst radial glow -->
    <radialGradient id="sunburst-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00AFAF" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#00AFAF" stop-opacity="0"/>
    </radialGradient>
    <!-- Atomic teal gradient for accent -->
    <linearGradient id="teal-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00AFAF"/>
      <stop offset="100%" stop-color="#00A878"/>
    </linearGradient>
  </defs>

  <!-- Background badge (optional soft-cornered rect) -->
  <rect x="1" y="1" width="218" height="58" rx="6" ry="6"
    fill="#111008"
    stroke="#00AFAF"
    stroke-width="1.2"
    stroke-opacity="0.6"/>

  <!-- Atomic orbital ring / sunburst orbit element -->
  <g transform="translate(30, 30)">
    <!-- Ambient glow disc -->
    <circle cx="0" cy="0" r="26" fill="url(#sunburst-glow)"/>
    <!-- Outer orbital ring -->
    <circle cx="0" cy="0" r="22" fill="none" stroke="#00AFAF" stroke-width="1.5" stroke-opacity="0.7"/>
    <!-- Inner hub -->
    <circle cx="0" cy="0" r="8" fill="#00AFAF" fill-opacity="0.25"/>
    <circle cx="0" cy="0" r="4" fill="#00AFAF"/>
    <!-- Sunburst tick marks -->
    <line x1="0" y1="-22" x2="0" y2="-17" stroke="#F2B705" stroke-width="2" stroke-linecap="round"/>
    <line x1="15.6" y1="-15.6" x2="12" y2="-12" stroke="#00AFAF" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="22" y1="0" x2="17" y2="0" stroke="#00AFAF" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="15.6" y1="15.6" x2="12" y2="12" stroke="#00AFAF" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="0" y1="22" x2="0" y2="17" stroke="#00AFAF" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="-15.6" y1="15.6" x2="-12" y2="12" stroke="#00AFAF" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="-22" y1="0" x2="-17" y2="0" stroke="#00AFAF" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="-15.6" y1="-15.6" x2="-12" y2="-12" stroke="#00AFAF" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- PHLIX wordmark -->
  <text x="68" y="39"
    font-family="'Josefin Sans', 'Futura', 'Century Gothic', sans-serif"
    font-size="26"
    font-weight="600"
    fill="#F5EFE8"
    letter-spacing="6"
    text-anchor="start">PHLIX</text>

  <!-- Small tagline / brand mark below -->
  <text x="68" y="52"
    font-family="'Josefin Sans', 'Futura', sans-serif"
    font-size="8"
    font-weight="400"
    fill="#00AFAF"
    letter-spacing="3"
    text-anchor="start"
    opacity="0.8">MID-CENTURY MODERN</text>
</svg>
