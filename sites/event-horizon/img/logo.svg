<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" width="200" height="60">
  <defs>
    <linearGradient id="phlix-text-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E8EAF0"/>
      <stop offset="100%" stop-color="#7B2CBF"/>
    </linearGradient>
    <linearGradient id="accretion-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7B2CBF" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#5A189A" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#7B2CBF" stop-opacity="0"/>
    </linearGradient>
    <filter id="void-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background (optional, can be removed for transparent) -->
  <!-- <rect width="200" height="60" fill="#000000"/> -->

  <!-- Accretion spiral element (subtle, left side) -->
  <g transform="translate(15, 30)" opacity="0.7">
    <circle cx="0" cy="0" r="12" fill="none" stroke="url(#accretion-glow)" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="8" fill="none" stroke="#7B2CBF" stroke-width="1" opacity="0.5"/>
    <circle cx="0" cy="0" r="3" fill="#7B2CBF"/>
  </g>

  <!-- PHLIX wordmark -->
  <text x="42" y="42"
        font-family="Orbitron, 'Exo 2', sans-serif"
        font-size="32"
        font-weight="700"
        letter-spacing="0.08em"
        fill="url(#phlix-text-gradient)"
        filter="url(#void-glow)">PHLIX</text>
</svg>
