<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 40" aria-label="Phlix">
  <defs>
    <linearGradient id="text-glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#A78BFA" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#7B2CBF" stop-opacity="0.7"/>
    </linearGradient>
  </defs>
  <text x="8" y="28" font-family="Orbitron, 'Exo 2', sans-serif" font-size="20" font-weight="700" letter-spacing="0.08em" fill="url(#text-glow)" filter="url(#glow)">PHLIX</text>
  <circle cx="108" cy="20" r="8" fill="none" stroke="#7B2CBF" stroke-width="1" opacity="0.6"/>
  <circle cx="108" cy="20" r="3" fill="#000000"/>
  <circle cx="108" cy="20" r="5" fill="none" stroke="#A78BFA" stroke-width="0.5" opacity="0.4"/>
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
</svg>
