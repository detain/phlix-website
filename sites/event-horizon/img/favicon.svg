<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <radialGradient id="core-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7B2CBF"/>
      <stop offset="60%" stop-color="#5A189A"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
  </defs>

  <!-- Event horizon circle -->
  <circle cx="16" cy="16" r="14" fill="none" stroke="#7B2CBF" stroke-width="1.5"/>

  <!-- Photon sphere ring -->
  <circle cx="16" cy="16" r="11" fill="none" stroke="#5A189A" stroke-width="0.75" opacity="0.6"/>

  <!-- Inner accretion glow -->
  <circle cx="16" cy="16" r="8" fill="url(#core-glow)"/>

  <!-- Central singularity point -->
  <circle cx="16" cy="16" r="3" fill="#000000"/>

  <!-- Brightest point of accretion (Hawking radiation) -->
  <circle cx="16" cy="16" r="1.5" fill="#E8EAF0" opacity="0.9"/>
</svg>
