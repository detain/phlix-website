<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="bg-glow" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#240046"/>
      <stop offset="50%" stop-color="#100018"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <radialGradient id="accretion" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7B2CBF" stop-opacity="0.8"/>
      <stop offset="40%" stop-color="#5A189A" stop-opacity="0.4"/>
      <stop offset="70%" stop-color="#3C096C" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="text-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E8EAF0"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg-glow)"/>

  <!-- Accretion glow effect -->
  <ellipse cx="600" cy="315" rx="500" ry="300" fill="url(#accretion)" opacity="0.6"/>

  <!-- Accretion rings -->
  <circle cx="600" cy="315" r="220" fill="none" stroke="#7B2CBF" stroke-width="1" opacity="0.3"/>
  <circle cx="600" cy="315" r="180" fill="none" stroke="#5A189A" stroke-width="1.5" opacity="0.4"/>
  <circle cx="600" cy="315" r="140" fill="none" stroke="#7B2CBF" stroke-width="2" opacity="0.5"/>

  <!-- Center singularity -->
  <circle cx="600" cy="315" r="60" fill="#000000"/>
  <circle cx="600" cy="315" r="60" fill="none" stroke="#7B2CBF" stroke-width="3"/>

  <!-- PHLIX wordmark -->
  <text x="600" y="540"
        font-family="Orbitron, sans-serif"
        font-size="72"
        font-weight="700"
        letter-spacing="0.1em"
        text-anchor="middle"
        fill="url(#text-gradient)">PHLIX</text>

  <!-- Tagline -->
  <text x="600" y="590"
        font-family="Inter, sans-serif"
        font-size="24"
        font-weight="400"
        letter-spacing="0.05em"
        text-anchor="middle"
        fill="#9CA3AF">Self-hosted media server</text>
</svg>
