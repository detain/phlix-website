name: Bug report
description: Something on the website is broken
labels: [bug]
body:
  - type: dropdown
    id: variant
    attributes:
      label: Which variant?
      options:
        - 01-minimalist-cinema
        - 02-spotlight-projector
        - 03-retro-film-reel
        - 04-portal-hub
        - 05-pixel-tech
        - All / shared content
    validations:
      required: true
  - type: input
    id: page
    attributes:
      label: Page URL
  - type: textarea
    id: what
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
  - type: input
    id: browser
    attributes:
      label: Browser + OS
