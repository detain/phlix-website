name: Lighthouse CI

# REAL since 2026-10-29 (review website__devops M1). Before that this was
# gate theater with every defect stacked:
#   - the one `lhci` step carried `continue-on-error: true`, and
#   - there was NO lighthouserc config at all, so `lhci autorun` failed its
#     healthcheck (exit 1) almost instantly on every run — swallowed green;
#   - `LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}` referenced
#     a secret this repo never had (remote-check uploads are gone entirely —
#     the gate measures a LOCAL server now, nothing to authenticate to);
#   - `on: pull_request` only, in a master-direct estate: pushes to master
#     never triggered it, so the only runs on record were dependabot PRs,
#     every one of them "success" on a step that had never asserted anything.
#
# What it is now: build dist/, serve it locally (tools/serve-dist.mjs), run
# @lhci/cli with the committed lighthouserc.cjs / lighthouserc.desktop.cjs
# budgets (mobile + desktop passes, numbers measured — see those files'
# headers), raw exit codes. Chrome comes from the runner image (ubuntu
# runners ship google-chrome-stable, and this job's pa11y sibling in lint.yml
# has proven headless Chrome works there); if no Chrome is found, lhci's
# healthcheck fails the job LOUDLY instead of pretending.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lhci:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      # Separate steps + `!cancelled()` per the S268 law in lint.yml: mobile
      # and desktop measure different regressions, and a failure in one must
      # not hide whether the other ran at all. No continue-on-error anywhere
      # in this file — test/lighthouse-gate.test.mjs pins that.
      - name: Lighthouse budgets (mobile)
        run: npm run lhci
      - name: Lighthouse budgets (desktop)
        if: ${{ !cancelled() }}
        run: npm run lhci:desktop
