name: Deploy to GitHub Pages

# PRODUCTION DEPLOY IS BLOCKED WHEN GATES RED (review website__devops M2).
# `build` below carries `needs: gates`, so a red lint/unit/audit verdict can
# no longer coexist with a published site. Before this, the push trigger
# published unconditionally: on 2026-10-29 the same SHA (bdd102aad) shows run
# 40861349153 (Lint — audit-gate step FAILED) next to run 40861349019 (this
# workflow — deploy SUCCEEDED). GitHub Actions `needs:` cannot span workflows,
# so the gates are MIRRORED here as a dedicated job; lint.yml stays the PR
# gate. test/deploy-gate.test.mjs pins the mirror command-for-command — the
# very suite this job runs — so editing lint.yml without mirroring it here
# turns the deploy path red on the next push. That test is the drift tripwire;
# keep both files in step.

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Mirror of .github/workflows/lint.yml: the whole `lint` job's gate steps
  # (format, three linters, audit-gate, a11y, meta) plus the `unit` job's command.
  # Step separation and `if: !cancelled()` follow the S268 law documented in
  # lint.yml — every gate gets its own visible row, and an earlier failure
  # never hides whether a later gate ran. The neutering surface is pinned by
  # test/deploy-gate.test.mjs — each law below red-mutation-proven at r2:
  # continue-on-error (job or step), `|| true`, forced `exit 0`, the `needs:`
  # chain, the command mirror, job-level `if:` (only absent/`success()` — an
  # `always()` resurrecting build over red gates reddens, review M4) and
  # step-level `if:` (only absent/`!cancelled()` — an `if: false` skipping a
  # gate row reddens, review M7).
  gates:
    runs-on: ubuntu-26.04
    # review website__devops m2: 15 bounds a stuck runner (observed job maxima
    # 2026-10-30: Lint run ~3 min, this chain's runs ≤ ~7 min; only the 6h
    # GitHub default bounded it — see the 1h01m33s Pages outlier 39371489227).
    timeout-minutes: 15
    steps:
      # Actions pinned by commit SHA with resolve proof 2026-10-30 (`git
      # ls-remote https://github.com/actions/<name>`; lightweight tags — the
      # ref value IS the commit), estate idiom from the 2026-10-08 migration
      # sweep. Version comments are what dependabot's github-actions
      # ecosystem reads when it proposes bumps.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Format check
        run: npm run format:check
      - name: Lint HTML (htmlhint)
        if: ${{ !cancelled() }}
        run: npm run lint:html
      - name: Lint CSS (stylelint)
        if: ${{ !cancelled() }}
        run: npm run lint:css
      - name: Lint JS (eslint)
        if: ${{ !cancelled() }}
        run: npm run lint:js
      - name: npm audit (allow-list gate)
        if: ${{ !cancelled() }}
        run: node scripts/audit-gate.mjs
      - name: Accessibility (pa11y-ci)
        if: ${{ !cancelled() }}
        run: npm run a11y
      - name: Unit tests (node:test)
        if: ${{ !cancelled() }}
        run: npm run test:unit
      - name: Meta audit (check-meta)
        if: ${{ !cancelled() }}
        # Mirror of lint.yml's Meta audit step (review website__devops m3) —
        # deploy-gate.test.mjs pins the two command sets against each other.
        run: npm run meta

  build:
    needs: gates
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
