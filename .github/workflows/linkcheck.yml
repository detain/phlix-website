name: Link Check

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
  pull_request:
    paths:
      # The generated brand-kit sites. (Was 'variants/**/*.html' until that
      # directory was removed on 2026-06-30 and replaced by sites/<slug>/.)
      - 'sites/**/*.html'
      - 'shared/content.json'
      - 'tools/lint.mjs'

# Least-privilege GITHUB_TOKEN (review website__devops m1): no step below
# needs more than a read-only checkout; sibling workflows bound it the same
# way (pages.yml, lighthouse.yml).
permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-26.04
    # Timeout bound (review website__devops m2): runs measure ~2 min; 15 caps
    # a stuck runner with 5x headroom. Action SHAs pinned with resolve proof
    # 2026-10-30 via git ls-remote (see pages.yml header note — same idiom).
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # TW-101-a tripwire — command byte-ident across all six checkout legs in
      # the four workflows; full rationale in lint.yml's `lint` job.
      - name: Repo size tripwire (reviews/ archive guard)
        run: |
          SIZE_MB=$(du -sm --exclude=.git . | cut -f1)
          echo "Working tree (excluding .git): ${SIZE_MB} MB — warn >150 MB, fail >250 MB"
          if [ "$SIZE_MB" -gt 250 ]; then
            echo "::error::Working tree is ${SIZE_MB} MB, above the 250 MB fail limit — the committed reviews/ archive grew; prune it or take the relocation owner call (review website__devops m2)."
            exit 1
          fi
          if [ "$SIZE_MB" -gt 150 ]; then
            echo "::warning::Working tree is ${SIZE_MB} MB, above the 150 MB warn threshold — every CI job pays the reviews/ archive; relocation is an open owner call (review website__devops m2)."
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # `linkcheck` validates the BUILT artifact (dist/**/*.html), because that
      # is what GitHub Pages publishes. sites/ holds 138 site directories but
      # only the 79 with a loadable brand kit (brand-kits/expected-kits.json
      # pins that count) are ever deployed, so checking sites/ produced 653
      # guaranteed-404s for pages that were not on the internet. tools/lint.mjs
      # FAILS rather than skips if dist/ is absent, so forgetting this step
      # cannot turn into a silent pass.
      - run: npm run build
      - run: npm run linkcheck
