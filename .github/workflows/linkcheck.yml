name: Link Check

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
  pull_request:
    paths:
      # The generated brand-kit sites. (Was 'variants/**/*.html' until that
      # directory was removed on 2026-06-30 and replaced by sites/<slug>/.)
      - 'sites/**/*.html'
      - 'shared/content.json'
      - 'tools/lint.mjs'

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run linkcheck
