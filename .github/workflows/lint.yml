name: Lint

on:
  push:
    branches: [master]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Format check
        run: npm run format:check
      - name: Lint (html / css / js)
        run: npm run lint
      - name: npm audit (moderate severity gate)
        # Tightened from high -> moderate (S2): after S1 re-classified deps to
        # tooling-only + existing overrides, `npm audit` reports 0 vulnerabilities,
        # so a moderate gate is achievable and exits 0. See PR for evidence.
        run: npm audit --audit-level=moderate
      - name: Accessibility (pa11y-ci, soft-fail until pages exist)
        run: npm run a11y
        continue-on-error: true

  # Additive job, deliberately NOT folded into `lint` above: before this, no
  # workflow in this repo ran any test at all (`grep -rln 'test:unit\|npm test'
  # .github/workflows/` returned nothing), so test/copyright.test.mjs could never
  # have gone red in CI. Runs `npm run test:unit`, NEVER `npm test`: the `test`
  # script chains `linkcheck`, which validates LIVE URLs and therefore cannot
  # gate a pull request. Node version, cache and install command mirror `lint`.
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Unit tests (node:test)
        run: npm run test:unit
