name: Lint

on:
  push:
    branches: [master]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Format check
        run: npm run format:check
      # The three linters are SEPARATE steps, each with `if: !cancelled()`, and
      # that is deliberate — see S268. They used to be one `npm run lint`, which
      # is `run-p`, and run-p KILLS its siblings the moment one task fails.
      # `lint:js` always failed first, so `lint:css` was killed ~4s into a 17s
      # run and had never once completed: 0 green runs of this workflow in 40,
      # and 3859 stylelint errors nobody had ever seen. As separate steps each
      # linter gets its own row in the checks UI, so "did not run" is visible
      # instead of being indistinguishable from "ran and passed".
      # `!cancelled()` (not `always()`) so a real cancellation still stops them,
      # but a failure in an earlier linter does not hide a later one.
      - name: Lint HTML (htmlhint)
        if: ${{ !cancelled() }}
        run: npm run lint:html
      - name: Lint CSS (stylelint)
        if: ${{ !cancelled() }}
        run: npm run lint:css
      - name: Lint JS (eslint)
        if: ${{ !cancelled() }}
        run: npm run lint:js
      - name: npm audit (allow-list gate)
        if: ${{ !cancelled() }}
        # Was: `npm audit --audit-level=moderate` (the S2 tightening — see git
        # history). Registry-side advisory drift reddened that bare step on
        # 2026-10-07 (run 37802257237). Five of the seven reported advisories
        # had in-range patches and were cleared lockfile-only; two do not have
        # any reachable fix (braces GHSA-vfj7: 3.0.3 is the newest release
        # ever published; basic-ftp GHSA-c475: patched 6.2.1 is unreachable
        # under get-uri's ^5.x declaration at every upstream generation).
        # The allow-list lives IN scripts/audit-gate.mjs, not here — every
        # entry carries its justification, an UPSTREAM WATCH removal plan,
        # and a re-verify-by date; test/audit-gate.test.mjs pins its
        # integrity. Exit codes: 0 clean-or-allowed-only, 1 any other
        # advisory id, 2 broken/unreadable audit (an unread verdict is never
        # a green one). Raw exit is preserved: no continue-on-error, no
        # `|| true`.
        run: node scripts/audit-gate.mjs
      # Also `!cancelled()`: this step and the audit above had never executed in
      # any run of this workflow, because an earlier step failed every time and
      # GitHub skips subsequent steps by default. `continue-on-error` only stops
      # a FAILING step from failing the job; it does nothing for a step that is
      # never reached.
      # No `continue-on-error` any more. It used to be blanket-true, and that is
      # how `npm run a11y` managed to crash on startup in every run this repo
      # has ever had without anyone noticing: a TypeError out of globby and a
      # clean pass were the same green tick. tools/a11y.mjs now separates the
      # two — pa11y-ci's exit 2 (pages have findings) is reported and tolerated,
      # while any other non-zero exit means the harness itself did not run and
      # FAILS the job. So the ~842 pre-existing WCAG2AA contrast findings do not
      # red the build, but a re-break of the harness does.
      - name: Accessibility (pa11y-ci)
        if: ${{ !cancelled() }}
        run: npm run a11y

  # Additive job, deliberately NOT folded into `lint` above: before this, no
  # workflow in this repo ran any test at all (`grep -rln 'test:unit\|npm test'
  # .github/workflows/` returned nothing), so test/copyright.test.mjs could never
  # have gone red in CI. Runs `npm run test:unit`, NEVER `npm test`: the `test`
  # script chains `linkcheck`, which validates LIVE URLs and therefore cannot
  # gate a pull request. Node version, cache and install command mirror `lint`.
  unit:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Unit tests (node:test)
        run: npm run test:unit
