name: Lint

on:
  push:
    branches: [master]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Format check
        run: npm run format:check
      - name: Lint (html / css / js)
        run: npm run lint
      - name: npm audit (high severity gate)
        run: npm audit --audit-level=high
      - name: Accessibility (pa11y-ci, soft-fail until pages exist)
        run: npm run a11y
        continue-on-error: true
