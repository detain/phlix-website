<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <rect width="1200" height="630" fill="#000000"/>
  <!-- Grid pattern -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1A1A1A" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <!-- Glowing line -->
  <line x1="0" y1="300" x2="1200" y2="300" stroke="#39FF14" stroke-width="1" opacity="0.3"/>
  <!-- Logo marks -->
  <g transform="translate(520, 240)">
    <path d="M8 0L0 30L8 60H20L12 30L20 0H8Z" fill="#39FF14"/>
    <path d="M28 0L20 30L28 60H40L32 30L40 0H28Z" fill="#39FF14" opacity="0.7"/>
    <path d="M48 0L40 30L48 60H60L52 30L60 0H48Z" fill="#39FF14" opacity="0.4"/>
  </g>
  <!-- Title -->
  <text x="600" y="380" font-family="monospace" font-size="48" font-weight="bold" fill="#39FF14" text-anchor="middle" letter-spacing="0.2em">PHLIX</text>
  <!-- Tagline -->
  <text x="600" y="420" font-family="monospace" font-size="16" fill="#C0C0C0" text-anchor="middle" letter-spacing="0.1em">Engineered for Your Library.</text>
  <!-- Terminal prompt decoration -->
  <text x="100" y="500" font-family="monospace" font-size="14" fill="#00FF66">$ self-host --media-server</text>
  <text x="100" y="530" font-family="monospace" font-size="14" fill="#9B30FF">> Roku | Tizen | Windows | Mobile | DLNA</text>
</svg>