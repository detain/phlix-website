<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <radialGradient id="spotlight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFB84D" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#F5C542" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#F5C542" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lens" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7A1F1F"/>
      <stop offset="100%" stop-color="#3A3A3A"/>
    </linearGradient>
    <linearGradient id="beam" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#F5C542" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#F5C542" stop-opacity="0"/>
    </linearGradient>
  </defs>
  
  <!-- Spotlight beam -->
  <path d="M50 25 L20 95 L80 95 Z" fill="url(#beam)" opacity="0.6"/>
  
  <!-- Projector body -->
  <circle cx="50" cy="25" r="22" fill="url(#lens)" stroke="#F5C542" stroke-width="2"/>
  
  <!-- Lens highlight -->
  <circle cx="44" cy="20" r="5" fill="rgba(255,247,230,0.3)"/>
  
  <!-- Film strip elements -->
  <rect x="25" y="12" width="8" height="6" rx="1" fill="#3A3A3A"/>
  <rect x="67" y="12" width="8" height="6" rx="1" fill="#3A3A3A"/>
  
  <!-- Stand -->
  <rect x="46" y="45" width="8" height="12" fill="#3A3A3A"/>
  <ellipse cx="50" cy="58" rx="18" ry="4" fill="#3A3A3A"/>
  
  <!-- P letter for Phlix -->
  <text x="50" y="32" text-anchor="middle" font-family="Georgia, serif" font-weight="bold" font-size="18" fill="#F5C542">P</text>
</svg>
