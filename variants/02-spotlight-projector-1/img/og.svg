<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <defs>
    <radialGradient id="ogSpotlight" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#F5C542" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#FFB84D" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ogLens" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7A1F1F"/>
      <stop offset="100%" stop-color="#3A3A3A"/>
    </linearGradient>
    <linearGradient id="ogBeam" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#F5C542" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#F5C542" stop-opacity="0"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="#000000"/>
  
  <!-- Spotlight glow -->
  <ellipse cx="600" cy="200" rx="500" ry="300" fill="url(#ogSpotlight)"/>
  
  <!-- Theater curtain hint left -->
  <rect x="0" y="0" width="60" height="630" fill="rgba(122,31,31,0.1)"/>
  
  <!-- Theater curtain hint right -->
  <rect x="1140" y="0" width="60" height="630" fill="rgba(122,31,31,0.1)"/>
  
  <!-- Large projector beam -->
  <path d="M600 180 L300 580 L900 580 Z" fill="url(#ogBeam)" opacity="0.4"/>
  
  <!-- Large projector body -->
  <circle cx="600" cy="180" r="80" fill="url(#ogLens)" stroke="#F5C542" stroke-width="4"/>
  
  <!-- Lens highlight -->
  <circle cx="570" cy="155" r="20" fill="rgba(255,247,230,0.2)"/>
  
  <!-- P letter for Phlix -->
  <text x="600" cy="195" text-anchor="middle" font-family="Georgia, serif" font-weight="bold" font-size="60" fill="#F5C542">P</text>
  
  <!-- Stand -->
  <rect x="585" y="255" width="30" height="45" fill="#3A3A3A"/>
  <ellipse cx="600" cy="310" rx="70" ry="15" fill="#3A3A3A"/>
  
  <!-- Title -->
  <text x="600" y="420" text-anchor="middle" font-family="Georgia, serif" font-weight="bold" font-size="72" fill="#F5C542">Phlix</text>
  
  <!-- Tagline -->
  <text x="600" y="480" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" fill="#FFF7E6">Your Personal Cinema.</text>
  
  <!-- Subtitle -->
  <text x="600" y="530" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="rgba(255,247,230,0.7)">Self-hosted media server for Roku, Samsung TV, Windows &amp; Mobile</text>
</svg>
