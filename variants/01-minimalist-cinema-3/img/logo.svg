<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 40" role="img" aria-label="Phlix logo">
  <title>Phlix</title>
  <desc>Minimalist film-strip X icon for Phlix. Dark mode version with warm white on near-black.</desc>

  <!-- Background for visibility -->
  <rect width="120" height="40" fill="transparent"/>

  <!-- Wordmark "Phlix" in Bebas Neue style -->
  <text x="48" y="28" font-family="Georgia, Arial, sans-serif" font-weight="bold" font-size="22" fill="#FAFAF8" letter-spacing="0.05em">Phlix</text>

  <!-- Stylized X as film strip / play button - Dark Mode with red accent -->
  <g transform="translate(4, 6)">
    <!-- Left diagonal of X (film strip segment) -->
    <path d="M6 0 L14 0 L22 24 L14 24 Z" fill="#E63946"/>

    <!-- Right diagonal of X (film strip segment) -->
    <path d="M14 0 L22 0 L14 24 L6 24 Z" fill="#E63946"/>

    <!-- Sprocket holes - left diagonal -->
    <circle cx="9" cy="4" r="2" fill="#0A0A0F"/>
    <circle cx="13" cy="8" r="2" fill="#0A0A0F"/>
    <circle cx="17" cy="12" r="2" fill="#0A0A0F"/>

    <!-- Sprocket holes - right diagonal -->
    <circle cx="17" cy="4" r="2" fill="#0A0A0F"/>
    <circle cx="13" cy="8" r="2" fill="#0A0A0F"/>
    <circle cx="9" cy="12" r="2" fill="#0A0A0F"/>

    <!-- Play button triangle (negative space in center) -->
    <polygon points="10,8 10,16 18,12" fill="#FAFAF8"/>
  </g>
</svg>
