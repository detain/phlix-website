<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Phlix - Your media. Your way.">
  <title>Phlix - Your media. Your way.</title>
  <desc>Open graph image for Phlix media server website - Dark Mode variant</desc>

  <!-- Dark background -->
  <rect width="1200" height="630" fill="#0A0A0F"/>

  <!-- Subtle film strip elements at top and bottom -->
  <g opacity="0.15">
    <!-- Top film strip -->
    <rect x="0" y="40" width="1200" height="30" fill="#E63946"/>
    <circle cx="50" cy="55" r="8" fill="#0A0A0F"/>
    <circle cx="150" cy="55" r="8" fill="#0A0A0F"/>
    <circle cx="250" cy="55" r="8" fill="#0A0A0F"/>
    <circle cx="350" cy="55" r="8" fill="#0A0A0F"/>
    <circle cx="450" cy="55" r="8" fill="#0A0A0F"/>
    <circle cx="550" cy="55" r="8" fill="#0A0A0F"/>
    <circle cx="650" cy="55" r="8" fill="#0A0A0F"/>
    <circle cx="750" cy="55" r="8" fill="#0A0A0F"/>
    <circle cx="850" cy="55" r="8" fill="#0A0A0F"/>
    <circle cx="950" cy="55" r="8" fill="#0A0A0F"/>
    <circle cx="1050" cy="55" r="8" fill="#0A0A0F"/>
    <circle cx="1150" cy="55" r="8" fill="#0A0A0F"/>

    <!-- Bottom film strip -->
    <rect x="0" y="560" width="1200" height="30" fill="#E63946"/>
    <circle cx="50" cy="575" r="8" fill="#0A0A0F"/>
    <circle cx="150" cy="575" r="8" fill="#0A0A0F"/>
    <circle cx="250" cy="575" r="8" fill="#0A0A0F"/>
    <circle cx="350" cy="575" r="8" fill="#0A0A0F"/>
    <circle cx="450" cy="575" r="8" fill="#0A0A0F"/>
    <circle cx="550" cy="575" r="8" fill="#0A0A0F"/>
    <circle cx="650" cy="575" r="8" fill="#0A0A0F"/>
    <circle cx="750" cy="575" r="8" fill="#0A0A0F"/>
    <circle cx="850" cy="575" r="8" fill="#0A0A0F"/>
    <circle cx="950" cy="575" r="8" fill="#0A0A0F"/>
    <circle cx="1050" cy="575" r="8" fill="#0A0A0F"/>
    <circle cx="1150" cy="575" r="8" fill="#0A0A0F"/>
  </g>

  <!-- Logo mark -->
  <g transform="translate(600, 200)">
    <!-- Stylized X as film strip - red accent -->
    <path d="M-50 -50 L0 -50 L50 50 L0 50 Z" fill="#E63946"/>
    <path d="M0 -50 L50 -50 L0 50 L-50 50 Z" fill="#E63946"/>

    <!-- Sprocket holes -->
    <circle cx="-35" cy="-35" r="8" fill="#0A0A0F"/>
    <circle cx="-15" cy="-15" r="8" fill="#0A0A0F"/>
    <circle cx="35" cy="-35" r="8" fill="#0A0A0F"/>
    <circle cx="15" cy="-15" r="8" fill="#0A0A0F"/>
    <circle cx="-35" cy="35" r="8" fill="#0A0A0F"/>
    <circle cx="-15" cy="15" r="8" fill="#0A0A0F"/>
    <circle cx="35" cy="35" r="8" fill="#0A0A0F"/>
    <circle cx="15" cy="15" r="8" fill="#0A0A0F"/>

    <!-- Play button triangle - warm white -->
    <polygon points="-20,0 30,0 5,-25" fill="#FAFAF8"/>
  </g>

  <!-- Wordmark -->
  <text x="600" y="320" font-family="Georgia, Arial, sans-serif" font-weight="bold" font-size="72" fill="#FAFAF8" text-anchor="middle" letter-spacing="0.05em">Phlix</text>

  <!-- Tagline -->
  <text x="600" y="380" font-family="Arial, sans-serif" font-weight="400" font-size="28" fill="#6B6B73" text-anchor="middle">Your media. Your way.</text>

  <!-- Subtext -->
  <text x="600" y="450" font-family="Arial, sans-serif" font-weight="500" font-size="20" fill="#6B6B73" text-anchor="middle">Self-hosted media server</text>
</svg>
