<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Phlix favicon">
  <title>Phlix</title>
  <desc>Minimalist film-strip X icon for favicon - Dark Mode</desc>

  <!-- Background -->
  <rect width="32" height="32" rx="4" fill="#E63946"/>

  <!-- Stylized X as film strip centered -->
  <g transform="translate(16, 16)">
    <!-- Left diagonal -->
    <path d="M-8 -8 L0 -8 L8 8 L0 8 Z" fill="#FAFAF8"/>

    <!-- Right diagonal -->
    <path d="M0 -8 L8 -8 L0 8 L-8 8 Z" fill="#FAFAF8"/>

    <!-- Play button triangle in center -->
    <polygon points="-4,0 4,0 0,-5" fill="#E63946"/>
  </g>
</svg>
