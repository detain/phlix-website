<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 36">
  <defs>
    <linearGradient id="terminalGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#39FF14"/>
      <stop offset="100%" stop-color="#00FF41"/>
    </linearGradient>
  </defs>
  <!-- Terminal icon -->
  <rect x="2" y="4" width="24" height="18" rx="2" ry="2" fill="none" stroke="url(#terminalGlow)" stroke-width="1.5"/>
  <path d="M6 10 L10 13 L6 16" fill="none" stroke="url(#terminalGlow)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="12" y1="16" x2="18" y2="16" stroke="url(#terminalGlow)" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Phlix text -->
  <text x="32" y="21" font-family="monospace" font-size="14" font-weight="bold" fill="#00FF41" letter-spacing="2">PHLIX</text>
  <!-- Cursor blink -->
  <rect x="92" y="8" width="8" height="14" fill="#39FF14" opacity="0.7">
    <animate attributeName="opacity" values="0.7;0;0.7" dur="1s" repeatCount="indefinite"/>
  </rect>
</svg>
