<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1A0D"/>
      <stop offset="100%" stop-color="#001A00"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#39FF14"/>
      <stop offset="100%" stop-color="#00FF41"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <!-- Grid pattern -->
  <g stroke="#1A4D1A" stroke-width="1" opacity="0.3">
    <line x1="0" y1="0" x2="0" y2="630"/>
    <line x1="60" y1="0" x2="60" y2="630"/>
    <line x1="120" y1="0" x2="120" y2="630"/>
    <line x1="180" y1="0" x2="180" y2="630"/>
    <line x1="240" y1="0" x2="240" y2="630"/>
    <line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="360" y1="0" x2="360" y2="630"/>
    <line x1="420" y1="0" x2="420" y2="630"/>
    <line x1="480" y1="0" x2="480" y2="630"/>
    <line x1="540" y1="0" x2="540" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="660" y1="0" x2="660" y2="630"/>
    <line x1="720" y1="0" x2="720" y2="630"/>
    <line x1="780" y1="0" x2="780" y2="630"/>
    <line x1="840" y1="0" x2="840" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
    <line x1="960" y1="0" x2="960" y2="630"/>
    <line x1="1020" y1="0" x2="1020" y2="630"/>
    <line x1="1080" y1="0" x2="1080" y2="630"/>
    <line x1="1140" y1="0" x2="1140" y2="630"/>
    <line x1="1200" y1="0" x2="1200" y2="630"/>
    <line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="360" x2="1200" y2="360"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="480" x2="1200" y2="480"/>
    <line x1="0" y1="540" x2="1200" y2="540"/>
    <line x1="0" y1="600" x2="1200" y2="600"/>
  </g>
  <!-- Terminal icon -->
  <rect x="80" y="200" width="120" height="80" rx="6" ry="6" fill="none" stroke="url(#textGrad)" stroke-width="3"/>
  <path d="M100 235 L120 255 L100 275" fill="none" stroke="url(#textGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="135" y1="275" x2="175" y2="275" stroke="url(#textGrad)" stroke-width="3" stroke-linecap="round"/>
  <!-- Text -->
  <text x="240" y="280" font-family="monospace" font-size="80" font-weight="bold" fill="url(#textGrad)" letter-spacing="8">PHLIX</text>
  <!-- Tagline -->
  <text x="240" y="340" font-family="monospace" font-size="24" fill="#00FF41" opacity="0.8" letter-spacing="2">Connect everything. Control everything.</text>
  <!-- Decorative scanlines -->
  <g opacity="0.1">
    <rect x="0" y="0" width="1200" height="2" fill="#39FF14"/>
    <rect x="0" y="4" width="1200" height="2" fill="#39FF14"/>
    <rect x="0" y="8" width="1200" height="2" fill="#39FF14"/>
  </g>
