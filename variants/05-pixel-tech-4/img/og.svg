<!-- ============================================================
     variants/05-pixel-tech-3/img/og.svg
     Open Graph placeholder image for social sharing
     Neon Cyberpunk variant - deep purple with hot pink accents
     ============================================================ -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="#0D0815"/>
      <path d="M20 0L0 0 0 20" fill="none" stroke="#1A1030" stroke-width="0.5"/>
    </pattern>

    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <linearGradient id="neon-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF2D78"/>
      <stop offset="50%" stop-color="#ff5c96"/>
      <stop offset="100%" stop-color="#FF2D78"/>
    </linearGradient>

    <radialGradient id="bg-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1A1030" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0D0815" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#0D0815"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#bg-glow)"/>

  <!-- Decorative corner glows - magenta -->
  <rect x="0" y="0" width="8" height="8" fill="#FF2D78" opacity="0.8"/>
  <rect x="8" y="0" width="8" height="8" fill="#FF2D78" opacity="0.6"/>
  <rect x="0" y="8" width="8" height="8" fill="#FF2D78" opacity="0.6"/>

  <rect x="1184" y="0" width="8" height="8" fill="#ff5c96" opacity="0.8"/>
  <rect x="1176" y="0" width="8" height="8" fill="#ff5c96" opacity="0.6"/>
  <rect x="1184" y="8" width="8" height="8" fill="#ff5c96" opacity="0.6"/>

  <rect x="0" y="614" width="8" height="8" fill="#ff5c96" opacity="0.8"/>
  <rect x="8" y="622" width="8" height="8" fill="#ff5c96" opacity="0.6"/>
  <rect x="0" y="622" width="8" height="8" fill="#ff5c96" opacity="0.6"/>

  <rect x="1184" y="622" width="8" height="8" fill="#FF2D78" opacity="0.8"/>
  <rect x="1176" y="614" width="8" height="8" fill="#FF2D78" opacity="0.6"/>
  <rect x="1184" y="614" width="8" height="8" fill="#FF2D78" opacity="0.6"/>

  <!-- Phlix text with neon glow -->
  <g filter="url(#glow)" transform="translate(600, 280)">
    <!-- P -->
    <text x="-200" y="0" font-family="Orbitron, sans-serif" font-size="180" font-weight="bold" fill="#FF2D78" text-anchor="middle">P</text>
    <!-- h -->
    <text x="-80" y="0" font-family="Orbitron, sans-serif" font-size="180" font-weight="bold" fill="#FF2D78" text-anchor="middle">h</text>
    <!-- lix -->
    <text x="80" y="0" font-family="Orbitron, sans-serif" font-size="180" font-weight="bold" fill="#E8E0F0" text-anchor="middle">lix</text>
  </g>

  <!-- Tagline -->
  <text x="600" y="400" font-family="Exo 2, sans-serif" font-size="28" fill="#ff5c96" text-anchor="middle" letter-spacing="0.2em">OPEN SOURCE. ZERO COMPROMISE.</text>

  <!-- Bottom line with neon gradient -->
  <line x1="200" y1="500" x2="1000" y2="500" stroke="url(#neon-gradient)" stroke-width="2" opacity="0.6"/>

  <!-- Subtitle -->
  <text x="600" y="560" font-family="Exo 2, sans-serif" font-size="18" fill="#6B5B7B" text-anchor="middle">Self-hosted media server for Roku, Samsung TV, Windows, Mobile & DLNA</text>
</svg>
