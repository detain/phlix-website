<!-- ============================================================
     variants/05-pixel-tech-3/img/favicon.svg
     Neon Cyberpunk Favicon - hot pink P icon on deep purple
     ============================================================ -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <rect width="32" height="32" fill="#0D0815"/>

  <!-- Hot pink P block with glow effect -->
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g filter="url(#glow)">
    <!-- P - pixel block formation -->
    <rect x="4" y="4" width="4" height="4" fill="#FF2D78"/>
    <rect x="8" y="4" width="4" height="4" fill="#FF2D78"/>
    <rect x="12" y="4" width="4" height="4" fill="#FF2D78"/>
    <rect x="4" y="8" width="4" height="4" fill="#FF2D78"/>
    <rect x="16" y="8" width="4" height="4" fill="#FF2D78"/>
    <rect x="4" y="12" width="4" height="4" fill="#FF2D78"/>
    <rect x="8" y="12" width="4" height="4" fill="#FF2D78"/>
    <rect x="12" y="12" width="4" height="4" fill="#FF2D78"/>
    <rect x="16" y="12" width="4" height="4" fill="#FF2D78"/>
    <rect x="4" y="16" width="4" height="4" fill="#FF2D78"/>
    <rect x="4" y="20" width="4" height="4" fill="#FF2D78"/>
    <rect x="4" y="24" width="4" height="4" fill="#FF2D78"/>

    <!-- h continuation with magenta gradient -->
    <rect x="8" y="24" width="4" height="4" fill="#ff5c96"/>
    <rect x="12" y="20" width="4" height="4" fill="#ff5c96"/>
    <rect x="16" y="16" width="4" height="4" fill="#ff5c96"/>
    <rect x="16" y="20" width="4" height="4" fill="#ff5c96"/>
    <rect x="16" y="24" width="4" height="4" fill="#ff5c96"/>
  </g>
</svg>
