<svg viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
    <!-- Warm background -->
    <rect width="1200" height="630" fill="#FFFBEB"/>
    
    <!-- Decorative warm glow -->
    <ellipse cx="600" cy="315" rx="500" ry="300" fill="#F59E0B" opacity="0.08"/>
    
    <!-- Central portal/sun motif -->
    <circle cx="600" cy="280" r="80" stroke="#F59E0B" stroke-width="4" fill="none" opacity="0.2"/>
    <circle cx="600" cy="280" r="55" stroke="#F59E0B" stroke-width="3" fill="none" opacity="0.4"/>
    <circle cx="600" cy="280" r="35" stroke="#F59E0B" stroke-width="2" fill="none" opacity="0.7"/>
    <circle cx="600" cy="280" r="15" fill="#F59E0B"/>
    
    <!-- Title text -->
    <text x="600" y="440" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="800" fill="#1A1A1A" text-anchor="middle">Phlix</text>
    
    <!-- Tagline -->
    <text x="600" y="500" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#78716C" text-anchor="middle">Connect everything. Control everything.</text>
</svg>
