<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Phlix - Your media. Your way.">
  <!-- Background with subtle dot pattern -->
  <rect width="1200" height="630" fill="#FFFDF0"/>
  <defs>
    <pattern id="dots" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#00C2FF" opacity="0.3"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#dots)"/>

  <!-- Decorative starburst -->
  <polygon points="950,100 970,180 1060,180 985,230 1000,315 950,260 900,315 915,230 840,180 930,180" fill="#FFD100" opacity="0.8"/>

  <!-- Main content card -->
  <rect x="100" y="130" width="800" height="370" rx="20" fill="#FFF5E6" stroke="#1a1a2e" stroke-width="6"/>

  <!-- Logo area -->
  <rect x="130" y="160" width="50" height="50" rx="10" fill="#FF3366" stroke="#1a1a2e" stroke-width="3"/>
  <path d="M145 175 L165 190 L145 205 Z" fill="#ffffff"/>
  <text x="200" y="198" font-family="Boogaloo, Helvetica, Arial, sans-serif" font-size="42" fill="#1a1a2e">Phlix</text>

  <!-- Headline -->
  <text x="150" y="290" font-family="Boogaloo, Helvetica, Arial, sans-serif" font-size="64" fill="#1a1a2e">Your media.</text>
  <text x="150" y="370" font-family="Boogaloo, Helvetica, Arial, sans-serif" font-size="64" fill="#FF3366">Your way.</text>

  <!-- Tagline -->
  <text x="150" y="440" font-family="Nunito, Helvetica, Arial, sans-serif" font-size="28" fill="#5c5470">Self-hostable PHP media server</text>

  <!-- CTA badge -->
  <rect x="150" y="460" width="200" height="50" rx="8" fill="#FFD100"/>
  <text x="190" y="495" font-family="Nunito, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#1a1a2e">Get Started</text>
</svg>
