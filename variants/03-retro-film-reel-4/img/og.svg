<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#0A1628"/>
  <!-- Gradient overlay -->
  <defs>
    <radialGradient id="glow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#00D4AA" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0A1628" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <!-- Film reel motif -->
  <circle cx="200" cy="315" r="120" fill="none" stroke="#00D4AA" stroke-width="4" opacity="0.3"/>
  <circle cx="200" cy="315" r="60" fill="#00D4AA" opacity="0.2"/>
  <circle cx="200" cy="315" r="24" fill="#00D4AA"/>
  <!-- Text -->
  <text x="380" y="280" font-family="system-ui, sans-serif" font-size="72" font-weight="600" fill="#E8F0F8">Phlix</text>
  <text x="380" y="370" font-family="system-ui, sans-serif" font-size="32" fill="#5A7A8A">Timeless stories. Modern streaming.</text>
  <!-- Decorative lines -->
  <rect x="380" y="400" width="200" height="4" rx="2" fill="#00D4AA"/>
</svg>
