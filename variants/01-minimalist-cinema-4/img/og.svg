<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <!-- OG Image for Warm Editorial variant -->
  <rect width="1200" height="630" fill="#F7F3EE"/>
  <!-- Decorative element -->
  <rect x="0" y="0" width="8" height="630" fill="#C4583A"/>
  <!-- Centered content -->
  <g transform="translate(600, 315)">
    <!-- Logo icon -->
    <rect x="-60" y="-120" width="120" height="120" rx="16" fill="#C4583A"/>
    <line x1="-40" y1="-90" x2="40" y2="30" stroke="white" stroke-width="8" stroke-linecap="round"/>
    <line x1="40" y1="-90" x2="-40" y2="30" stroke="white" stroke-width="8" stroke-linecap="round"/>
    <!-- Text -->
    <text x="0" y="80" text-anchor="middle" font-family="Georgia, serif" font-weight="700" font-size="64" fill="#2D2926">Phlix</text>
    <text x="0" y="130" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="400" font-size="28" fill="#7A6E66">Your media. Your way.</text>
  </g>
