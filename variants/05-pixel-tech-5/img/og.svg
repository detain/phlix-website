<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050510"/>
      <stop offset="100%" stop-color="#0A0A20"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg-grad)"/>
  <text x="600" y="320" font-family="Arial Black, sans-serif" font-size="72" font-weight="900" fill="#00A8FF" text-anchor="middle" filter="url(#glow)">Phlix</text>
  <text x="600" y="380" font-family="Arial, sans-serif" font-size="24" fill="#E0F4FF" text-anchor="middle">Self-hosted media server</text>
  <text x="600" y="420" font-family="Arial, sans-serif" font-size="18" fill="#4A6A8A" text-anchor="middle">Open source. Zero compromise.</text>
</svg>
