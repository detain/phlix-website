<!-- ============================================================
     variants/05-pixel-tech-5/img/logo.svg
     Electric Blue Cyber logo: "Ph" with electric blue glow
     Futuristic neon aesthetic with cyan/blue accents
     ============================================================ -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" width="200" height="60">
  <defs>
    <!-- Glow filter for neon effect -->
    <filter id="neon-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Electric blue gradient -->
    <linearGradient id="electric-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00A8FF"/>
      <stop offset="50%" stop-color="#66C2FF"/>
      <stop offset="100%" stop-color="#00A8FF"/>
    </linearGradient>

    <!-- Dark background gradient -->
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0A0A20"/>
      <stop offset="100%" stop-color="#050510"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="200" height="60" fill="url(#bg-gradient)"/>

  <!-- Pixelated "Ph" - left side with electric blue glow -->
  <g filter="url(#neon-glow)">
    <!-- P - pixel block formation -->
    <rect x="10" y="12" width="8" height="4" fill="#00A8FF"/>
    <rect x="14" y="8" width="4" height="4" fill="#00A8FF"/>
    <rect x="18" y="8" width="4" height="4" fill="#00A8FF"/>
    <rect x="22" y="12" width="4" height="4" fill="#00A8FF"/>
    <rect x="18" y="16" width="4" height="4" fill="#00A8FF"/>
    <rect x="14" y="16" width="4" height="4" fill="#00A8FF"/>
    <rect x="10" y="16" width="4" height="4" fill="#00A8FF"/>
    <rect x="10" y="20" width="8" height="4" fill="#00A8FF"/>
    <rect x="10" y="24" width="8" height="4" fill="#00A8FF"/>
    <rect x="10" y="28" width="8" height="4" fill="#00A8FF"/>
    <rect x="10" y="32" width="8" height="4" fill="#00A8FF"/>
    <rect x="10" y="36" width="8" height="4" fill="#00A8FF"/>
    <rect x="10" y="40" width="8" height="4" fill="#00A8FF"/>

    <!-- h - pixel block continuation -->
    <rect x="26" y="28" width="8" height="4" fill="#00A8FF"/>
    <rect x="26" y="32" width="8" height="4" fill="#00A8FF"/>
    <rect x="26" y="36" width="8" height="4" fill="#00A8FF"/>
    <rect x="26" y="40" width="8" height="4" fill="#00A8FF"/>
    <rect x="30" y="24" width="4" height="4" fill="#00A8FF"/>
    <rect x="34" y="20" width="4" height="4" fill="#66C2FF"/>
    <rect x="34" y="24" width="4" height="4" fill="#66C2FF"/>
    <rect x="34" y="28" width="4" height="4" fill="#66C2FF"/>
    <rect x="34" y="32" width="4" height="4" fill="#66C2FF"/>
    <rect x="34" y="36" width="4" height="4" fill="#66C2FF"/>
    <rect x="34" y="40" width="4" height="4" fill="#66C2FF"/>

    <!-- Transition pixels (between Ph and lix) -->
    <rect x="42" y="28" width="4" height="2" fill="#66C2FF" opacity="0.7"/>
    <rect x="46" y="26" width="4" height="2" fill="#66C2FF" opacity="0.5"/>
    <rect x="50" y="24" width="4" height="2" fill="#66C2FF" opacity="0.3"/>
  </g>

  <!-- Smooth "lix" - right side -->
  <g filter="url(#neon-glow)">
    <!-- l - smooth -->
    <rect x="58" y="12" width="6" height="36" fill="#E0F4FF"/>
    <rect x="58" y="8" width="6" height="4" fill="#E0F4FF"/>

    <!-- i - smooth -->
    <rect x="70" y="12" width="4" height="4" fill="#E0F4FF"/>
    <rect x="70" y="20" width="4" height="28" fill="#E0F4FF"/>

    <!-- x - smooth (transitional) -->
    <rect x="78" y="12" width="4" height="4" fill="#E0F4FF"/>
    <rect x="82" y="12" width="4" height="4" fill="#E0F4FF"/>
    <rect x="80" y="16" width="4" height="4" fill="#E0F4FF"/>
    <rect x="86" y="16" width="4" height="4" fill="#E0F4FF"/>
    <rect x="78" y="20" width="4" height="4" fill="#E0F4FF"/>
    <rect x="82" y="20" width="4" height="4" fill="#E0F4FF"/>
    <rect x="86" y="24" width="4" height="4" fill="#E0F4FF"/>
    <rect x="78" y="28" width="4" height="4" fill="#E0F4FF"/>
    <rect x="82" y="28" width="4" height="4" fill="#E0F4FF"/>
    <rect x="86" y="32" width="4" height="4" fill="#E0F4FF"/>
    <rect x="78" y="36" width="4" height="4" fill="#E0F4FF"/>
    <rect x="82" y="36" width="4" height="4" fill="#E0F4FF"/>
    <rect x="86" y="40" width="4" height="4" fill="#E0F4FF"/>
    <rect x="78" y="44" width="4" height="4" fill="#E0F4FF"/>
    <rect x="82" y="44" width="4" height="4" fill="#E0F4FF"/>
  </g>

  <!-- Tagline line with neon glow -->
  <line x1="10" y1="54" x2="190" y2="54" stroke="#0A0A20" stroke-width="1"/>
  <line x1="10" y1="54" x2="60" y2="54" stroke="#00A8FF" stroke-width="1" opacity="0.6"/>
</svg>
