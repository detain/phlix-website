<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 48">
  <!-- Background with purple velvet -->
  <rect width="120" height="48" rx="6" fill="#1A0A2E"/>
  <!-- Film reel / play button motif with purple accent -->
  <circle cx="24" cy="24" r="14" fill="none" stroke="#9B4DCA" stroke-width="2"/>
  <circle cx="24" cy="24" r="6" fill="#9B4DCA"/>
  <circle cx="24" cy="10" r="2" fill="#9B4DCA"/>
  <circle cx="24" cy="38" r="2" fill="#9B4DCA"/>
  <circle cx="10" cy="24" r="2" fill="#9B4DCA"/>
  <circle cx="38" cy="24" r="2" fill="#9B4DCA"/>
  <!-- Silver accent ring -->
  <circle cx="24" cy="24" r="18" fill="none" stroke="#C0C0C0" stroke-width="0.5" stroke-dasharray="2 2" opacity="0.5"/>
  <!-- Text with lavender color -->
  <text x="46" y="30" font-family="Georgia, serif" font-size="18" font-weight="600" fill="#F0E6FF" letter-spacing="0.1em">Phlix</text>
