<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <!-- Background with purple gradient -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1A0A2E"/>
      <stop offset="50%" style="stop-color:#250F42"/>
      <stop offset="100%" style="stop-color:#1A0A2E"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#9B4DCA"/>
      <stop offset="100%" style="stop-color:#7B3DA8"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Decorative circles -->
  <circle cx="100" cy="100" r="200" fill="#9B4DCA" opacity="0.1"/>
  <circle cx="1100" cy="530" r="200" fill="#C0C0C0" opacity="0.05"/>
  <!-- Film reel icon -->
  <circle cx="600" cy="280" r="80" fill="none" stroke="#9B4DCA" stroke-width="4"/>
  <circle cx="600" cy="280" r="35" fill="#9B4DCA"/>
  <circle cx="600" cy="200" r="10" fill="#9B4DCA"/>
  <circle cx="600" cy="360" r="10" fill="#9B4DCA"/>
  <circle cx="520" cy="280" r="10" fill="#9B4DCA"/>
  <circle cx="680" cy="280" r="10" fill="#9B4DCA"/>
  <!-- Title -->
  <text x="600" y="450" font-family="Georgia, serif" font-size="72" font-weight="600" fill="#F0E6FF" text-anchor="middle" letter-spacing="0.15em">PHLIX</text>
  <!-- Tagline -->
  <text x="600" y="520" font-family="Arial, sans-serif" font-size="28" fill="#9A8AAF" text-anchor="middle" letter-spacing="0.1em">Timeless stories. Modern streaming.</text>
  <!-- Accent line -->
  <rect x="500" y="550" width="200" height="3" fill="url(#accent)" rx="1.5"/>
</svg>
