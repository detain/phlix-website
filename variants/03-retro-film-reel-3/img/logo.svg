<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <!-- Film Noir Badge Logo for Phlix -->
  <!-- High contrast B&W with single warm amber accent -->

  <!-- Outer circle/badge - noir black -->
  <circle cx="60" cy="60" r="56" fill="#0D0D0D" stroke="#FAFAFA" stroke-width="3"/>

  <!-- Inner amber ring - single accent color -->
  <circle cx="60" cy="60" r="48" fill="none" stroke="#D4763B" stroke-width="2"/>

  <!-- Film reel outer ring - noir white -->
  <circle cx="60" cy="52" r="28" fill="none" stroke="#FAFAFA" stroke-width="2.5"/>

  <!-- Film reel inner circle -->
  <circle cx="60" cy="52" r="8" fill="#FAFAFA"/>

  <!-- Film reel holes - 4 circular holes arranged like reel spokes -->
  <!-- Top hole -->
  <circle cx="60" cy="36" r="5" fill="#0D0D0D" stroke="#D4763B" stroke-width="1.5"/>
  <!-- Right hole -->
  <circle cx="76" cy="52" r="5" fill="#0D0D0D" stroke="#D4763B" stroke-width="1.5"/>
  <!-- Bottom hole -->
  <circle cx="60" cy="68" r="5" fill="#0D0D0D" stroke="#D4763B" stroke-width="1.5"/>
  <!-- Left hole -->
  <circle cx="44" cy="52" r="5" fill="#0D0D0D" stroke="#D4763B" stroke-width="1.5"/>

  <!-- Center dot on reel -->
  <circle cx="60" cy="52" r="3" fill="#0D0D0D"/>

  <!-- Decorative sprocket dots on outer area -->
  <circle cx="60" cy="18" r="2" fill="#FAFAFA"/>
  <circle cx="60" cy="86" r="2" fill="#FAFAFA"/>
  <circle cx="18" cy="60" r="2" fill="#FAFAFA"/>
  <circle cx="102" cy="60" r="2" fill="#FAFAFA"/>

  <!-- Banner across center - amber accent -->
  <rect x="12" y="82" width="96" height="20" rx="2" fill="#D4763B"/>

  <!-- Banner text - Phlix -->
  <text x="60" y="97" text-anchor="middle" font-family="Georgia, serif" font-size="12" font-weight="bold" fill="#0D0D0D" letter-spacing="2">Phlix</text>

  <!-- Small decorative diamond accents -->
  <polygon points="24,24 26,28 24,32 22,28" fill="#FAFAFA"/>
  <polygon points="96,24 98,28 96,32 94,28" fill="#FAFAFA"/>
</svg>
