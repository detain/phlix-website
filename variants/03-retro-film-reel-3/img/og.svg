<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- OG Image - Film Noir Variant -->
  <rect width="1200" height="630" fill="#0D0D0D"/>

  <!-- Subtle film grain texture -->
  <defs>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="4" result="noise"/>
      <feColorMatrix type="saturate" values="0"/>
      <feBlend in="SourceGraphic" in2="noise" mode="multiply"/>
    </filter>
  </defs>

  <!-- Ambient glow - amber accent -->
  <circle cx="100" cy="100" r="200" fill="#D4763B" opacity="0.08"/>
  <circle cx="1100" cy="530" r="250" fill="#D4763B" opacity="0.06"/>

  <!-- Main logo badge -->
  <g transform="translate(450, 180)">
    <!-- Outer badge - noir -->
    <circle cx="150" cy="150" r="140" fill="#0D0D0D" stroke="#FAFAFA" stroke-width="6"/>

    <!-- Inner amber ring -->
    <circle cx="150" cy="150" r="120" fill="none" stroke="#D4763B" stroke-width="4"/>

    <!-- Film reel -->
    <circle cx="150" cy="140" r="70" fill="none" stroke="#FAFAFA" stroke-width="4"/>
    <circle cx="150" cy="140" r="20" fill="#FAFAFA"/>

    <!-- Reel holes -->
    <circle cx="150" cy="85" r="14" fill="#0D0D0D" stroke="#D4763B" stroke-width="3"/>
    <circle cx="200" cy="140" r="14" fill="#0D0D0D" stroke="#D4763B" stroke-width="3"/>
    <circle cx="150" cy="195" r="14" fill="#0D0D0D" stroke="#D4763B" stroke-width="3"/>
    <circle cx="100" cy="140" r="14" fill="#0D0D0D" stroke="#D4763B" stroke-width="3"/>
    <circle cx="150" cy="140" r="8" fill="#0D0D0D"/>

    <!-- Banner -->
    <rect x="20" y="230" width="260" height="50" rx="4" fill="#D4763B"/>
    <text x="150" y="265" text-anchor="middle" font-family="Georgia, serif" font-size="28" font-weight="bold" fill="#0D0D0D" letter-spacing="3">Phlix</text>

    <!-- Decorative diamonds -->
    <polygon points="60,60 65,70 60,80 55,70" fill="#FAFAFA"/>
    <polygon points="240,60 245,70 240,80 235,70" fill="#FAFAFA"/>
  </g>

  <!-- Tagline -->
  <text x="600" y="480" text-anchor="middle" font-family="Georgia, serif" font-size="42" fill="#FAFAFA" letter-spacing="2">Timeless stories.</text>
  <text x="600" y="530" text-anchor="middle" font-family="Georgia, serif" font-size="28" fill="#D4763B" letter-spacing="4">Modern streaming.</text>

  <!-- Decorative dots -->
  <g fill="#D4763B">
    <circle cx="200" cy="500" r="6"/>
    <circle cx="230" cy="520" r="4"/>
    <circle cx="970" cy="500" r="6"/>
    <circle cx="940" cy="520" r="4"/>
  </g>

  <!-- Film strip perforations - top -->
  <g fill="#FAFAFA" opacity="0.3">
    <rect x="50" y="30" width="20" height="30" rx="3"/>
    <rect x="100" y="30" width="20" height="30" rx="3"/>
    <rect x="150" y="30" width="20" height="30" rx="3"/>
    <rect x="200" y="30" width="20" height="30" rx="3"/>
    <rect x="250" y="30" width="20" height="30" rx="3"/>
    <rect x="950" y="30" width="20" height="30" rx="3"/>
    <rect x="1000" y="30" width="20" height="30" rx="3"/>
    <rect x="1050" y="30" width="20" height="30" rx="3"/>
    <rect x="1100" y="30" width="20" height="30" rx="3"/>
    <rect x="1150" y="30" width="20" height="30" rx="3"/>
  </g>

  <!-- Film strip perforations - bottom -->
  <g fill="#FAFAFA" opacity="0.3">
    <rect x="50" y="580" width="20" height="30" rx="3"/>
    <rect x="100" y="580" width="20" height="30" rx="3"/>
    <rect x="150" y="580" width="20" height="30" rx="3"/>
    <rect x="200" y="580" width="20" height="30" rx="3"/>
    <rect x="250" y="580" width="20" height="30" rx="3"/>
    <rect x="950" y="580" width="20" height="30" rx="3"/>
    <rect x="1000" y="580" width="20" height="30" rx="3"/>
    <rect x="1050" y="580" width="20" height="30" rx="3"/>
    <rect x="1100" y="580" width="20" height="30" rx="3"/>
    <rect x="1150" y="580" width="20" height="30" rx="3"/>
  </g>
</svg>
