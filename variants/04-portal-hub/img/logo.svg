<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 40" fill="none">
  <!-- Portal ring icon -->
  <g id="portal-icon" transform="translate(0, 0)">
    <!-- Outer ring -->
    <circle cx="20" cy="20" r="16" fill="none" stroke="#00E5FF" stroke-width="2"/>
    <!-- Inner ring with gradient effect -->
    <circle cx="20" cy="20" r="11" fill="none" stroke="#7FF6FF" stroke-width="1.5" stroke-opacity="0.7"/>
    <!-- Play button -->
    <path d="M17 14l8 6-8 6V14z" fill="#00E5FF"/>
  </g>
  <!-- Wordmark -->
  <text x="45" y="27" font-family="Poppins, system-ui, sans-serif" font-weight="600" font-size="18" fill="#FFFFFF">Phlix</text>
</svg>
