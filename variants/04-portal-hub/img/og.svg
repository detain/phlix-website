<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <!-- OG Image placeholder for Portal Hub variant -->
  <rect width="1200" height="630" fill="#0A0F1F"/>

  <!-- Background gradient -->
  <defs>
    <radialGradient id="bg-glow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#08101C" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg-glow)"/>

  <!-- Portal ring decoration -->
  <g transform="translate(600, 280)">
    <circle cx="0" cy="0" r="180" fill="none" stroke="#00E5FF" stroke-width="3" stroke-opacity="0.3"/>
    <circle cx="0" cy="0" r="140" fill="none" stroke="#FF00C8" stroke-width="2" stroke-opacity="0.2"/>
    <circle cx="0" cy="0" r="100" fill="none" stroke="#00E5FF" stroke-width="1.5" stroke-opacity="0.4"/>
  </g>

  <!-- Logo mark -->
  <g transform="translate(480, 180)">
    <circle cx="60" cy="60" r="50" fill="none" stroke="#00E5FF" stroke-width="4"/>
    <circle cx="60" cy="60" r="35" fill="none" stroke="#7FF6FF" stroke-width="2" stroke-opacity="0.8"/>
    <path d="M50 40l25 20-25 20V40z" fill="#00E5FF"/>
  </g>

  <!-- Wordmark -->
  <text x="600" y="360" text-anchor="middle" font-family="Poppins, system-ui, sans-serif" font-weight="600" font-size="72" fill="#FFFFFF">Phlix</text>
  <text x="600" y="420" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-weight="300" font-size="28" fill="#7FF6FF">Stream Everything.</text>

  <!-- Tagline -->
  <text x="600" y="550" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-weight="400" font-size="20" fill="#00E5FF" fill-opacity="0.8">Self-hosted media server</text>
</svg>
