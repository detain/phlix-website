<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <!-- Phlix OG Image — Warm Spotlight -->
  <rect width="1200" height="630" fill="#1A1208"/>

  <!-- Warm ambient glow in center -->
  <ellipse cx="600" cy="315" rx="500" ry="250" fill="url(#ogGlow)" opacity="0.3"/>

  <defs>
    <radialGradient id="ogGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E89B3C" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#E89B3C" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Border frame -->
  <rect x="40" y="40" width="1120" height="550" rx="8" fill="none" stroke="#E89B3C" stroke-width="1" opacity="0.4"/>

  <!-- "Ph" monogram large -->
  <g transform="translate(460, 200)">
    <path d="M0 0 L0 120" stroke="#E89B3C" stroke-width="8" stroke-linecap="round"/>
    <path d="M0 0 L60 0 C90 0 90 80 60 80 L0 80" fill="none" stroke="#E89B3C" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M80 80 L80 120" stroke="#E89B3C" stroke-width="8" stroke-linecap="round"/>
    <path d="M80 92 C80 70 120 70 120 92 L120 120" fill="none" stroke="#E89B3C" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- "lix" text -->
  <text x="640" y="292" font-family="Georgia, serif" font-size="72" font-weight="400" fill="#F5E6C8" letter-spacing="3">lix</text>

  <!-- Tagline -->
  <text x="600" y="440" font-family="Georgia, serif" font-size="24" fill="#8B7355" text-anchor="middle" font-style="italic" letter-spacing="1">Your story. Our stage.</text>

  <!-- Subtitle -->
  <text x="600" y="500" font-family="system-ui, sans-serif" font-size="18" fill="#8B7355" text-anchor="middle" letter-spacing="2">SELF-HOSTED MEDIA SERVER</text>
</svg>
