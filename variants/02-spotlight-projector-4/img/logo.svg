<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" fill="none">
  <!-- Phlix Logo — Warm Spotlight aesthetic -->
  <!-- Modern premium luxury, warm amber glows, cozy theater atmosphere -->

  <!-- Subtle warm spotlight frame effect -->
  <rect x="2" y="2" width="196" height="56" rx="2" fill="none" stroke="#E89B3C" stroke-width="0.5" opacity="0.4"/>

  <!-- "Ph" as elegant theater letters with warm amber -->
  <g id="letters">
    <!-- "P" shape -->
    <path d="M22 12 L22 48" stroke="#E89B3C" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M22 12 L34 12 C42 12 42 26 34 26 L22 26" fill="none" stroke="#E89B3C" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- "h" shape -->
    <path d="M40 26 L40 48" stroke="#E89B3C" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M40 34 C40 28 47 28 47 34 L47 48" fill="none" stroke="#E89B3C" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Warm ambient spotlight glow -->
  <ellipse cx="95" cy="30" rx="55" ry="20" fill="url(#warmGlow)" opacity="0.5"/>

  <!-- Gradient definition for warm ambient light -->
  <defs>
    <radialGradient id="warmGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E89B3C" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#E89B3C" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Remaining letters "lix" in warm cream -->
  <text x="100" y="38" font-family="Georgia, serif" font-size="24" font-weight="400" fill="#F5E6C8" letter-spacing="1">lix</text>

  <!-- Tagline: Your story. Our stage. -->
  <text x="200" y="56" font-family="Georgia, serif" font-size="8" fill="#8B7355" text-anchor="end" font-style="italic" letter-spacing="0.5">Your story. Our stage.</text>
</svg>
