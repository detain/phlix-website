<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 36" fill="none">
  <defs>
    <linearGradient id="ring-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#FF00C8"/>
    </linearGradient>
  </defs>
  <!-- Outer ring -->
  <circle cx="18" cy="18" r="16" stroke="url(#ring-gradient)" stroke-width="2" fill="none" opacity="0.4"/>
  <!-- Middle ring -->
  <circle cx="18" cy="18" r="11" stroke="#00E5FF" stroke-width="1.5" fill="none" opacity="0.7"/>
  <!-- Inner ring -->
  <circle cx="18" cy="18" r="6" stroke="#00E5FF" stroke-width="1" fill="none"/>
  <!-- Core dot -->
  <circle cx="18" cy="18" r="2" fill="#00E5FF"/>
  <!-- Portal nodes -->
  <circle cx="18" cy="2" r="1.5" fill="#00E5FF"/>
  <circle cx="18" cy="34" r="1.5" fill="#FF00C8"/>
  <circle cx="2" cy="18" r="1.5" fill="#FF00C8"/>
  <circle cx="34" cy="18" r="1.5" fill="#00E5FF"/>
</svg>
