<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <!-- Background -->
  <rect width="1200" height="630" fill="#0A0F1F"/>

  <!-- Radial glow -->
  <circle cx="600" cy="315" r="400" fill="url(#bg-glow)" opacity="0.3"/>

  <!-- Logo ring system -->
  <g transform="translate(600, 280)">
    <!-- Outer ring -->
    <circle r="120" stroke="#00E5FF" stroke-width="2" fill="none" opacity="0.3"/>
    <!-- Middle ring -->
    <circle r="80" stroke="#00E5FF" stroke-width="1.5" fill="none" opacity="0.5"/>
    <!-- Inner ring -->
    <circle r="40" stroke="#00E5FF" stroke-width="1" fill="none" opacity="0.8"/>
    <!-- Core -->
    <circle r="15" fill="#00E5FF"/>
  </g>

  <!-- Text -->
  <text x="600" y="480" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="600" font-size="48" fill="#FFFFFF">Phlix</text>
  <text x="600" y="530" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="300" font-size="24" fill="#7FF6FF">Stream Everything.</text>

  <!-- Gradient definitions -->
  <defs>
    <radialGradient id="bg-glow">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#0A0F1F"/>
    </radialGradient>
  </defs>
</svg>
