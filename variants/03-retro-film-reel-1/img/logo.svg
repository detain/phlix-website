<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Retro film reel-inspired logo -->
  <!-- Outer ring -->
  <circle cx="100" cy="100" r="90" stroke="#C0392B" stroke-width="8" fill="none"/>
  <!-- Inner ring -->
  <circle cx="100" cy="100" r="70" stroke="#C0392B" stroke-width="4" fill="none"/>
  <!-- Center hub -->
  <circle cx="100" cy="100" r="25" fill="#C0392B"/>
  <!-- Spokes -->
  <line x1="100" y1="10" x2="100" y2="30" stroke="#C0392B" stroke-width="6" stroke-linecap="round"/>
  <line x1="100" y1="170" x2="100" y2="190" stroke="#C0392B" stroke-width="6" stroke-linecap="round"/>
  <line x1="10" y1="100" x2="30" y2="100" stroke="#C0392B" stroke-width="6" stroke-linecap="round"/>
  <line x1="170" y1="100" x2="190" y2="100" stroke="#C0392B" stroke-width="6" stroke-linecap="round"/>
  <!-- Diagonal spokes -->
  <line x1="36" y1="36" x2="50" y2="50" stroke="#C0392B" stroke-width="4" stroke-linecap="round"/>
  <line x1="150" y1="150" x2="164" y2="164" stroke="#C0392B" stroke-width="4" stroke-linecap="round"/>
  <line x1="164" y1="36" x2="150" y2="50" stroke="#C0392B" stroke-width="4" stroke-linecap="round"/>
  <line x1="36" y1="164" x2="50" y2="150" stroke="#C0392B" stroke-width="4" stroke-linecap="round"/>
  <!-- Film reel perforations -->
  <rect x="88" y="15" width="24" height="16" rx="4" fill="#F5E9D4"/>
  <rect x="88" y="169" width="24" height="16" rx="4" fill="#F5E9D4"/>
  <rect x="15" y="88" width="16" height="24" rx="4" fill="#F5E9D4"/>
  <rect x="169" y="88" width="16" height="24" rx="4" fill="#F5E9D4"/>
  <!-- Center highlight -->
  <circle cx="100" cy="100" r="15" fill="#F5E9D4"/>
</svg>
