<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="#F5E9D4"/>

  <!-- Decorative film strip top -->
  <rect x="0" y="30" width="1200" height="60" fill="#111111"/>
  <rect x="40" y="40" width="80" height="40" rx="4" fill="#F5E9D4"/>
  <rect x="160" y="40" width="80" height="40" rx="4" fill="#F5E9D4"/>
  <rect x="280" y="40" width="80" height="40" rx="4" fill="#F5E9D4"/>
  <rect x="400" y="40" width="80" height="40" rx="4" fill="#F5E9D4"/>
  <rect x="520" y="40" width="80" height="40" rx="4" fill="#F5E9D4"/>
  <rect x="640" y="40" width="80" height="40" rx="4" fill="#F5E9D4"/>
  <rect x="760" y="40" width="80" height="40" rx="4" fill="#F5E9D4"/>
  <rect x="880" y="40" width="80" height="40" rx="4" fill="#F5E9D4"/>
  <rect x="1000" y="40" width="80" height="40" rx="4" fill="#F5E9D4"/>

  <!-- Decorative film strip bottom -->
  <rect x="0" y="540" width="1200" height="60" fill="#111111"/>
  <rect x="40" y="550" width="80" height="40" rx="4" fill="#F5E9D4"/>
  <rect x="160" y="550" width="80" height="40" rx="4" fill="#F5E9D4"/>
  <rect x="280" y="550" width="80" height="40" rx="4" fill="#F5E9D4"/>
  <rect x="400" y="550" width="80" height="40" rx="4" fill="#F5E9D4"/>
  <rect x="520" y="550" width="80" height="40" rx="4" fill="#F5E9D4"/>
  <rect x="640" y="550" width="80" height="40" rx="4" fill="#F5E9D4"/>
  <rect x="760" y="550" width="80" height="40" rx="4" fill="#F5E9D4"/>
  <rect x="880" y="550" width="80" height="40" rx="4" fill="#F5E9D4"/>
  <rect x="1000" y="550" width="80" height="40" rx="4" fill="#F5E9D4"/>

  <!-- Central logo area -->
  <circle cx="600" cy="315" r="180" stroke="#C0392B" stroke-width="12" fill="none"/>
  <circle cx="600" cy="315" r="140" stroke="#C0392B" stroke-width="6" fill="none"/>
  <circle cx="600" cy="315" r="50" fill="#C0392B"/>
  <circle cx="600" cy="315" r="30" fill="#F5E9D4"/>

  <!-- Spokes -->
  <line x1="600" y1="135" x2="600" y2="175" stroke="#C0392B" stroke-width="8" stroke-linecap="round"/>
  <line x1="600" y1="455" x2="600" y2="495" stroke="#C0392B" stroke-width="8" stroke-linecap="round"/>
  <line x1="420" y1="315" x2="460" y2="315" stroke="#C0392B" stroke-width="8" stroke-linecap="round"/>
  <line x1="740" y1="315" x2="780" y2="315" stroke="#C0392B" stroke-width="8" stroke-linecap="round"/>

  <!-- Phlix text -->
  <text x="600" y="580" font-family="Arial, sans-serif" font-size="72" font-weight="bold" fill="#111111" text-anchor="middle">Phlix</text>
  <text x="600" y="620" font-family="Arial, sans-serif" font-size="28" fill="#8C5E3C" text-anchor="middle">Home Theater, Upgraded.</text>
</svg>
