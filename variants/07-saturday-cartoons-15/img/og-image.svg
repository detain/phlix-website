<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Phlix Media Server">
  <!-- Background -->
  <rect width="1200" height="630" fill="#fff9f5"/>
  <!-- Tent stripe pattern -->
  <defs>
    <pattern id="stripes" patternUnits="userSpaceOnUse" width="80" height="80" patternTransform="rotate(45)">
      <rect width="40" height="80" fill="#D61A6C" fill-opacity="0.15"/>
      <rect x="40" width="40" height="80" fill="#FFD700" fill-opacity="0.15"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#stripes)"/>
  <!-- Main card -->
  <rect x="150" y="115" width="900" height="400" rx="20" fill="white" stroke="#1a0a1a" stroke-width="6"/>
  <!-- Header bar with gradient -->
  <rect x="150" y="115" width="900" height="60" rx="20" fill="linear-gradient(90deg, #D61A6C, #FFD700, #00CED1, #FF8C00)"/>
  <rect x="150" y="145" width="900" height="30" fill="#D61A6C"/>
  <!-- Logo area -->
  <circle cx="300" cy="310" r="80" fill="#D61A6C" stroke="#1a0a1a" stroke-width="6"/>
  <path d="M270 280 L330 310 L270 340 Z" fill="#FFD700" stroke="#1a0a1a" stroke-width="4"/>
  <!-- Text -->
  <text x="420" y="290" font-family="Impact, Arial Black, sans-serif" font-size="72" font-weight="bold" fill="#D61A6C">Phlix</text>
  <text x="420" y="360" font-family="Arial, sans-serif" font-size="32" fill="#4a2c4a">Your media. Your way.</text>
  <text x="420" y="410" font-family="Arial, sans-serif" font-size="24" fill="#7a5a7a">Self-hosted PHP media server</text>
  <!-- Stars decoration -->
  <text x="1100" y="150" font-size="48" fill="#FFD700">★</text>
  <text x="80" y="580" font-size="36" fill="#00CED1">✦</text>
  <text x="1100" y="580" font-size="36" fill="#FF8C00">✦</text>
</svg>
