  <polygon points="15,10 15,30 32,20" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
  <!-- Comic dots decoration -->
  <circle cx="50" cy="12" r="4" fill="#0074d9" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="62" cy="20" r="3" fill="#ffdc00" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="55" cy="30" r="5" fill="#2ecc40" stroke="#1a1a1a" stroke-width="2"/>
  <!-- Text -->
  <text x="75" y="28" font-family="Arial Black, sans-serif" font-size="22" font-weight="bold" fill="#1a1a1a" letter-spacing="2">Phlix</text>
</svg>
