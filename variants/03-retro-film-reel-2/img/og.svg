<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="#2C1810"/>

  <!-- Velvet texture pattern -->
  <rect width="1200" height="630" fill="url(#velvet-gradient)" opacity="0.3"/>

  <!-- Film strip borders -->
  <g fill="#D4A017">
    <!-- Top film strip -->
    <rect y="0" width="1200" height="60" fill="#1A0F0A"/>
    <rect y="8" width="1200" height="44" fill="#2C1810"/>
    <!-- Film perforations top -->
    <rect x="40" y="16" width="30" height="28" rx="4" fill="#D4A017"/>
    <rect x="120" y="16" width="30" height="28" rx="4" fill="#D4A017"/>
    <rect x="200" y="16" width="30" height="28" rx="4" fill="#D4A017"/>
    <rect x="280" y="16" width="30" height="28" rx="4" fill="#D4A017"/>
    <rect x="360" y="16" width="30" height="28" rx="4" fill="#D4A017"/>
    <rect x="440" y="16" width="30" height="28" rx="4" fill="#D4A017"/>
    <rect x="520" y="16" width="30" height="28" rx="4" fill="#D4A017"/>
    <rect x="600" y="16" width="30" height="28" rx="4" fill="#D4A017"/>
    <rect x="680" y="16" width="30" height="28" rx="4" fill="#D4A017"/>
    <rect x="760" y="16" width="30" height="28" rx="4" fill="#D4A017"/>
    <rect x="840" y="16" width="30" height="28" rx="4" fill="#D4A017"/>
    <rect x="920" y="16" width="30" height="28" rx="4" fill="#D4A017"/>
    <rect x="1000" y="16" width="30" height="28" rx="4" fill="#D4A017"/>
    <rect x="1080" y="16" width="30" height="28" rx="4" fill="#D4A017"/>
    <rect x="1160" y="16" width="30" height="28" rx="4" fill="#D4A017"/>

    <!-- Bottom film strip -->
    <rect y="570" width="1200" height="60" fill="#1A0F0A"/>
    <rect y="578" width="1200" height="44" fill="#2C1810"/>
    <!-- Film perforations bottom -->
    <rect x="40" y="586" width="30" height="28" rx="4" fill="#D4A017"/>
    <rect x="120" y="586" width="30" height="28" rx="4" fill="#D4A017"/>
    <rect x="200" y="586" width="30" height="28" rx="4" fill="#D4A017"/>
    <rect x="280" y="586" width="30" height="28" rx="4" fill="#D4A017"/>
    <rect x="360" y="586" width="30" height="28" rx="4" fill="#D4A017"/>
    <rect x="440" y="586" width="30" height="28" rx="4" fill="#D4A017"/>
    <rect x="520" y="586" width="30" height="28" rx="4" fill="#D4A017"/>
    <rect x="600" y="586" width="30" height="28" rx="4" fill="#D4A017"/>
    <rect x="680" y="586" width="30" height="28" rx="4" fill="#D4A017"/>
    <rect x="760" y="586" width="30" height="28" rx="4" fill="#D4A017"/>
    <rect x="840" y="586" width="30" height="28" rx="4" fill="#D4A017"/>
    <rect x="920" y="586" width="30" height="28" rx="4" fill="#D4A017"/>
    <rect x="1000" y="586" width="30" height="28" rx="4" fill="#D4A017"/>
    <rect x="1080" y="586" width="30" height="28" rx="4" fill="#D4A017"/>
    <rect x="1160" y="586" width="30" height="28" rx="4" fill="#D4A017"/>
  </g>

  <!-- Central content area -->
  <rect x="100" y="80" width="1000" height="470" fill="#F4E4C1" rx="12"/>
  <rect x="100" y="80" width="1000" height="470" fill="none" stroke="#D4A017" stroke-width="4" rx="12"/>

  <!-- Gold decorative corners -->
  <path d="M100 120 L130 100 L130 120 Z" fill="#D4A017"/>
  <path d="M1100 120 L1070 100 L1070 120 Z" fill="#D4A017"/>
  <path d="M100 510 L130 530 L130 510 Z" fill="#D4A017"/>
  <path d="M1100 510 L1070 530 L1070 510 Z" fill="#D4A017"/>

  <!-- Logo mark -->
  <g transform="translate(540, 150)">
    <circle cx="60" cy="60" r="50" fill="#7A1F1F" stroke="#D4A017" stroke-width="4"/>
    <circle cx="60" cy="60" r="38" fill="none" stroke="#D4A017" stroke-width="2"/>
    <line x1="60" y1="16" x2="60" y2="28" stroke="#D4A017" stroke-width="3" stroke-linecap="round"/>
    <line x1="60" y1="92" x2="60" y2="104" stroke="#D4A017" stroke-width="3" stroke-linecap="round"/>
    <line x1="16" y1="60" x2="28" y2="60" stroke="#D4A017" stroke-width="3" stroke-linecap="round"/>
    <line x1="92" y1="60" x2="104" y2="60" stroke="#D4A017" stroke-width="3" stroke-linecap="round"/>
    <circle cx="60" cy="60" r="16" fill="#D4A017"/>
    <circle cx="60" cy="60" r="7" fill="#7A1F1F"/>
  </g>

  <!-- Title text -->
  <text x="600" y="290" font-family="Georgia, serif" font-size="72" font-weight="bold" fill="#2C1810" text-anchor="middle">Phlix</text>

  <!-- Tagline -->
  <text x="600" y="350" font-family="Georgia, serif" font-size="28" fill="#8B7355" text-anchor="middle">Timeless stories. Modern streaming.</text>

  <!-- Divider line -->
  <line x1="350" y1="380" x2="850" y2="380" stroke="#D4A017" stroke-width="2"/>

  <!-- Subtitle -->
  <text x="600" y="430" font-family="Georgia, serif" font-size="22" fill="#8B7355" text-anchor="middle">Open-source media server</text>

  <defs>
    <linearGradient id="velvet-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7A1F1F;stop-opacity:0.5"/>
      <stop offset="50%" style="stop-color:#2C1810;stop-opacity:0.5"/>
      <stop offset="100%" style="stop-color:#7A1F1F;stop-opacity:0.5"/>
    </linearGradient>
  </defs>
</svg>
