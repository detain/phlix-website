<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 40" role="img" aria-label="Phlix logo">
  <title>Phlix</title>
  <desc>A clean vector logo for Phlix. The letter X is stylized as a film-strip with two diagonal bars containing circular sprocket holes. Electric blue and charcoal colors on white background.</desc>

  <!-- Wordmark "Phlix" in Montserrat ExtraBold style -->
  <text x="48" y="28" font-family="Montserrat, Arial, sans-serif" font-weight="800" font-size="22" fill="#1A1A1A">Phlix</text>

  <!-- Stylized X as film strip / play button -->
  <g transform="translate(4, 6)">
    <!-- Left diagonal of X (film strip segment) -->
    <path d="M6 0 L14 0 L22 24 L14 24 Z" fill="#2D9CFF"/>

    <!-- Right diagonal of X (film strip segment) -->
    <path d="M14 0 L22 0 L14 24 L6 24 Z" fill="#2D9CFF"/>

    <!-- Sprocket holes - left diagonal -->
    <circle cx="9" cy="4" r="2" fill="#1A1A1A"/>
    <circle cx="13" cy="8" r="2" fill="#1A1A1A"/>
    <circle cx="17" cy="12" r="2" fill="#1A1A1A"/>

    <!-- Sprocket holes - right diagonal -->
    <circle cx="17" cy="4" r="2" fill="#1A1A1A"/>
    <circle cx="13" cy="8" r="2" fill="#1A1A1A"/>
    <circle cx="9" cy="12" r="2" fill="#1A1A1A"/>

    <!-- Play button triangle (negative space in center) -->
    <polygon points="10,8 10,16 18,12" fill="#FFFFFF"/>
  </g>
</svg>
