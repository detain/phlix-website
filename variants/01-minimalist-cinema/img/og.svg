<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Phlix - Your Media. Your Way.">
  <title>Phlix - Your Media. Your Way.</title>
  <desc>Open graph image for Phlix media server website</desc>

  <!-- Background -->
  <rect width="1200" height="630" fill="#1A1A1A"/>

  <!-- Decorative film strip elements -->
  <g opacity="0.1">
    <!-- Top film strip -->
    <rect x="0" y="40" width="1200" height="30" fill="#2D9CFF"/>
    <circle cx="50" cy="55" r="8" fill="#1A1A1A"/>
    <circle cx="150" cy="55" r="8" fill="#1A1A1A"/>
    <circle cx="250" cy="55" r="8" fill="#1A1A1A"/>
    <circle cx="350" cy="55" r="8" fill="#1A1A1A"/>
    <circle cx="450" cy="55" r="8" fill="#1A1A1A"/>
    <circle cx="550" cy="55" r="8" fill="#1A1A1A"/>
    <circle cx="650" cy="55" r="8" fill="#1A1A1A"/>
    <circle cx="750" cy="55" r="8" fill="#1A1A1A"/>
    <circle cx="850" cy="55" r="8" fill="#1A1A1A"/>
    <circle cx="950" cy="55" r="8" fill="#1A1A1A"/>
    <circle cx="1050" cy="55" r="8" fill="#1A1A1A"/>
    <circle cx="1150" cy="55" r="8" fill="#1A1A1A"/>

    <!-- Bottom film strip -->
    <rect x="0" y="560" width="1200" height="30" fill="#2D9CFF"/>
    <circle cx="50" cy="575" r="8" fill="#1A1A1A"/>
    <circle cx="150" cy="575" r="8" fill="#1A1A1A"/>
    <circle cx="250" cy="575" r="8" fill="#1A1A1A"/>
    <circle cx="350" cy="575" r="8" fill="#1A1A1A"/>
    <circle cx="450" cy="575" r="8" fill="#1A1A1A"/>
    <circle cx="550" cy="575" r="8" fill="#1A1A1A"/>
    <circle cx="650" cy="575" r="8" fill="#1A1A1A"/>
    <circle cx="750" cy="575" r="8" fill="#1A1A1A"/>
    <circle cx="850" cy="575" r="8" fill="#1A1A1A"/>
    <circle cx="950" cy="575" r="8" fill="#1A1A1A"/>
    <circle cx="1050" cy="575" r="8" fill="#1A1A1A"/>
    <circle cx="1150" cy="575" r="8" fill="#1A1A1A"/>
  </g>

  <!-- Logo mark -->
  <g transform="translate(600, 200)">
    <!-- Stylized X as film strip -->
    <path d="M-50 -50 L0 -50 L50 50 L0 50 Z" fill="#2D9CFF"/>
    <path d="M0 -50 L50 -50 L0 50 L-50 50 Z" fill="#2D9CFF"/>

    <!-- Sprocket holes -->
    <circle cx="-35" cy="-35" r="8" fill="#1A1A1A"/>
    <circle cx="-15" cy="-15" r="8" fill="#1A1A1A"/>
    <circle cx="35" cy="-35" r="8" fill="#1A1A1A"/>
    <circle cx="15" cy="-15" r="8" fill="#1A1A1A"/>
    <circle cx="-35" cy="35" r="8" fill="#1A1A1A"/>
    <circle cx="-15" cy="15" r="8" fill="#1A1A1A"/>
    <circle cx="35" cy="35" r="8" fill="#1A1A1A"/>
    <circle cx="15" cy="15" r="8" fill="#1A1A1A"/>

    <!-- Play button triangle -->
    <polygon points="-20,0 30,0 5,-25" fill="#FFFFFF"/>
  </g>

  <!-- Wordmark -->
  <text x="600" y="320" font-family="Montserrat, Arial, sans-serif" font-weight="800" font-size="72" fill="#FFFFFF" text-anchor="middle" letter-spacing="-2">Phlix</text>

  <!-- Tagline -->
  <text x="600" y="380" font-family="Inter, Arial, sans-serif" font-weight="400" font-size="28" fill="#A7D8FF" text-anchor="middle">Your Media. Your Way.</text>

  <!-- Subtext -->
  <text x="600" y="450" font-family="Roboto, Arial, sans-serif" font-weight="500" font-size="20" fill="#2E2E2E" text-anchor="middle">Self-hosted media server</text>
</svg>
