<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Phlix favicon">
  <title>Phlix</title>
  <desc>Minimalist film-strip X icon for favicon</desc>

  <!-- Background -->
  <rect width="32" height="32" rx="4" fill="#2D9CFF"/>

  <!-- Stylized X as film strip -->
  <g transform="translate(16, 16)">
    <!-- Center at 16,16 so we center the X around origin then offset -->
  </g>

  <!-- Film strip X shape centered -->
  <g transform="translate(16, 16)">
    <!-- Left diagonal -->
    <path d="M-8 -8 L0 -8 L8 8 L0 8 Z" fill="#FFFFFF"/>

    <!-- Right diagonal -->
    <path d="M0 -8 L8 -8 L0 8 L-8 8 Z" fill="#FFFFFF"/>

    <!-- Play button triangle in center -->
    <polygon points="-4,0 4,0 0,-5" fill="#2D9CFF"/>
  </g>
</svg>
