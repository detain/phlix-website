<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Phlix - Your media. Your way.">
  <title>Phlix</title>
  <desc>Bold monochrome Open Graph image for Phlix with gold accent. Self-hosted media server.</desc>

  <!-- Background -->
  <rect width="1200" height="630" fill="#000000"/>

  <!-- Top accent line -->
  <rect x="0" y="0" width="1200" height="4" fill="#FFD700"/>

  <!-- Stylized X mark -->
  <g transform="translate(120, 180)">
    <path d="M0 0 L60 0 L120 135 L60 135 Z" fill="#FFD700"/>
    <path d="M60 0 L120 0 L60 135 L0 135 Z" fill="#FFD700"/>
    <polygon points="45,35 45,100 90,67" fill="#000000"/>
  </g>

  <!-- Main heading -->
  <text x="280" y="260" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" font-size="72" font-style="italic" fill="#FFFFFF" letter-spacing="-0.02em">Your media.</text>
  <text x="280" y="350" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" font-size="72" font-style="italic" fill="#FFFFFF" letter-spacing="-0.02em">Your way.</text>

  <!-- Tagline -->
  <text x="280" y="430" font-family="Arial, sans-serif" font-weight="600" font-size="18" fill="#FFD700" letter-spacing="0.2em">PHLIX MEDIA SERVER</text>

  <!-- Bottom accent -->
  <rect x="0" y="626" width="1200" height="4" fill="#FFD700"/>

  <!-- Subtle grid pattern -->
  <g opacity="0.03">
    <line x1="0" y1="100" x2="1200" y2="100" stroke="#FFFFFF" stroke-width="1"/>
    <line x1="0" y1="200" x2="1200" y2="200" stroke="#FFFFFF" stroke-width="1"/>
    <line x1="0" y1="300" x2="1200" y2="300" stroke="#FFFFFF" stroke-width="1"/>
    <line x1="0" y1="400" x2="1200" y2="400" stroke="#FFFFFF" stroke-width="1"/>
    <line x1="0" y1="500" x2="1200" y2="500" stroke="#FFFFFF" stroke-width="1"/>
    <line x1="200" y1="0" x2="200" y2="630" stroke="#FFFFFF" stroke-width="1"/>
    <line x1="400" y1="0" x2="400" y2="630" stroke="#FFFFFF" stroke-width="1"/>
    <line x1="600" y1="0" x2="600" y2="630" stroke="#FFFFFF" stroke-width="1"/>
    <line x1="800" y1="0" x2="800" y2="630" stroke="#FFFFFF" stroke-width="1"/>
    <line x1="1000" y1="0" x2="1000" y2="630" stroke="#FFFFFF" stroke-width="1"/>
  </g>
</svg>