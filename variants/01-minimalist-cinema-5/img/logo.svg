<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 40" role="img" aria-label="Phlix logo">
  <title>Phlix</title>
  <desc>Bold monochrome wordmark for Phlix with gold accent. Minimalist cinema aesthetic.</desc>

  <rect width="120" height="40" fill="transparent"/>

  <!-- Stylized X mark as film frame / play symbol -->
  <g transform="translate(4, 6)">
    <!-- Left diagonal of X -->
    <path d="M6 0 L14 0 L22 24 L14 24 Z" fill="#FFD700"/>

    <!-- Right diagonal of X -->
    <path d="M14 0 L22 0 L14 24 L6 24 Z" fill="#FFD700"/>

    <!-- Play button triangle (negative space in center) -->
    <polygon points="10,8 10,16 18,12" fill="#000000"/>
  </g>

  <!-- Wordmark -->
  <text x="48" y="28" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" font-size="22" font-style="italic" fill="#FFFFFF" letter-spacing="0.02em">Phlix</text>
</svg>