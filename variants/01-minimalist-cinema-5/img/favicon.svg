<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Phlix favicon">
  <title>Phlix</title>
  <desc>Bold X mark with play button center for Phlix favicon</desc>

  <rect width="32" height="32" fill="#000000"/>

  <!-- Stylized X mark -->
  <g transform="translate(4, 4)">
    <!-- Left diagonal -->
    <path d="M2 0 L10 0 L16 18 L8 18 Z" fill="#FFD700"/>

    <!-- Right diagonal -->
    <path d="M8 0 L16 0 L10 18 L2 18 Z" fill="#FFD700"/>

    <!-- Play button triangle -->
    <polygon points="7,6 7,12 13,9" fill="#000000"/>
  </g>
</svg>