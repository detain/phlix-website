<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Art Deco sunburst background -->
  <circle cx="50" cy="50" r="48" fill="#000000"/>
  <circle cx="50" cy="50" r="45" fill="none" stroke="#F5C542" stroke-width="0.5" opacity="0.3"/>

  <!-- Radial rays -->
  <g stroke="#F5C542" stroke-width="0.5" opacity="0.2">
    <line x1="50" y1="5" x2="50" y2="20"/>
    <line x1="50" y1="80" x2="50" y2="95"/>
    <line x1="5" y1="50" x2="20" y2="50"/>
    <line x1="80" y1="50" x2="95" y2="50"/>
    <line x1="18" y1="18" x2="28" y2="28"/>
    <line x1="72" y1="72" x2="82" y2="82"/>
    <line x1="82" y1="18" x2="72" y2="28"/>
    <line x1="28" y1="72" x2="18" y2="82"/>
  </g>

  <!-- Central geometric frame -->
  <polygon points="50,15 65,35 85,40 70,55 75,75 50,65 25,75 30,55 15,40 35,35" fill="none" stroke="#F5C542" stroke-width="1.5"/>

  <!-- Inner frame -->
  <polygon points="50,25 60,40 75,43 65,53 67,68 50,62 33,68 35,53 25,43 40,40" fill="#7A1F1F" stroke="#F5C542" stroke-width="1"/>

  <!-- P letter -->
  <text x="50" y="55" text-anchor="middle" font-family="Georgia, serif" font-weight="bold" font-size="20" fill="#F5C542">P</text>
</svg>
