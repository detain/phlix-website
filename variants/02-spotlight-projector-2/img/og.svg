<svg viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="#000000"/>

  <!-- Subtle corner geometric accents -->
  <path d="M0,0 L100,0 L0,100 Z" fill="#F5C542" opacity="0.05"/>
  <path d="M1200,0 L1100,0 L1200,100 Z" fill="#F5C542" opacity="0.05"/>
  <path d="M0,630 L100,630 L0,530 Z" fill="#F5C542" opacity="0.05"/>
  <path d="M1200,630 L1100,630 L1200,530 Z" fill="#F5C542" opacity="0.05"/>

  <!-- Radial ambient glow -->
  <ellipse cx="600" cy="315" rx="600" ry="300" fill="url(#glow)" opacity="0.3"/>

  <!-- Decorative lines top -->
  <line x1="200" y1="80" x2="1000" y2="80" stroke="#F5C542" stroke-width="0.5" opacity="0.3"/>
  <line x1="300" y1="90" x2="900" y2="90" stroke="#F5C542" stroke-width="0.5" opacity="0.2"/>

  <!-- Decorative lines bottom -->
  <line x1="200" y1="550" x2="1000" y2="550" stroke="#F5C542" stroke-width="0.5" opacity="0.3"/>
  <line x1="300" y1="540" x2="900" y2="540" stroke="#F5C542" stroke-width="0.5" opacity="0.2"/>

  <!-- Central content area -->
  <!-- Eyebrow text -->
  <text x="600" y="220" text-anchor="middle" font-family="'Source Sans Pro', Arial, sans-serif" font-size="16" font-weight="600" fill="#FFB84D" letter-spacing="4">SELF-HOSTED MEDIA SERVER</text>

  <!-- Main title -->
  <text x="600" y="300" text-anchor="middle" font-family="'Cinzel', Georgia, serif" font-size="56" font-weight="700" fill="#F5C542">Phlix</text>

  <!-- Tagline -->
  <text x="600" y="360" text-anchor="middle" font-family="'Lora', Georgia, serif" font-size="24" fill="#FFF7E6">Your media. Your library. Your Phlix.</text>

  <!-- Decorative divider -->
  <line x1="450" y1="400" x2="750" y2="400" stroke="#F5C542" stroke-width="1"/>
  <circle cx="600" cy="400" r="4" fill="#F5C542"/>

  <!-- Features hint -->
  <text x="600" y="460" text-anchor="middle" font-family="'Source Sans Pro', Arial, sans-serif" font-size="14" fill="#B8B0A0">SyncPlay • Live TV • DLNA • Transcoding • Hub</text>

  <!-- Corner decorations - stepped art deco -->
  <g stroke="#F5C542" stroke-width="1.5" fill="none" opacity="0.4">
    <!-- Top left -->
    <path d="M40,40 L40,20 L60,20"/>
    <path d="M50,50 L50,25 L75,25"/>

    <!-- Top right -->
    <path d="M1160,40 L1160,20 L1140,20"/>
    <path d="M1150,50 L1150,25 L1125,25"/>

    <!-- Bottom left -->
    <path d="M40,590 L40,610 L60,610"/>
    <path d="M50,580 L50,605 L75,605"/>

    <!-- Bottom right -->
    <path d="M1160,590 L1160,610 L1140,610"/>
    <path d="M1150,580 L1150,605 L1125,605"/>
  </g>

  <defs>
    <radialGradient id="glow">
      <stop offset="0%" stop-color="#F5C542"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
  </defs>
</svg>
