<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Art Deco sunburst/starburst frame -->
  <circle cx="50" cy="50" r="48" stroke="#F5C542" stroke-width="1" opacity="0.3"/>
  <circle cx="50" cy="50" r="44" stroke="#F5C542" stroke-width="0.5" opacity="0.2"/>

  <!-- Geometric center medallion -->
  <polygon points="50,10 55,40 85,45 60,55 65,85 50,65 35,85 40,55 15,45 45,40" fill="#F5C542" opacity="0.9"/>

  <!-- Inner diamond -->
  <polygon points="50,25 60,50 50,75 40,50" fill="#7A1F1F" stroke="#F5C542" stroke-width="1"/>

  <!-- Center circle with P -->
  <circle cx="50" cy="50" r="12" fill="#F5C542"/>
  <text x="50" y="55" text-anchor="middle" font-family="Georgia, serif" font-weight="bold" font-size="14" fill="#000000">P</text>

  <!-- Corner accents - Art Deco stepped corners -->
  <path d="M5,15 L5,5 L15,5" stroke="#F5C542" stroke-width="2" fill="none"/>
  <path d="M85,5 L95,5 L95,15" stroke="#F5C542" stroke-width="2" fill="none"/>
  <path d="M95,85 L95,95 L85,95" stroke="#F5C542" stroke-width="2" fill="none"/>
  <path d="M15,95 L5,95 L5,85" stroke="#F5C542" stroke-width="2" fill="none"/>
</svg>
