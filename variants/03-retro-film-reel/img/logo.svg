<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <!-- Retro Film Reel Badge Logo for Phlix -->
  <!-- Concept 3: Retro Film Reel Badge from brand_identity.md -->

  <!-- Outer circle/badge - cream background -->
  <circle cx="60" cy="60" r="56" fill="#F5E9D4" stroke="#111111" stroke-width="4"/>

  <!-- Inner teal ring -->
  <circle cx="60" cy="60" r="48" fill="none" stroke="#1ABC9C" stroke-width="3"/>

  <!-- Film reel outer ring -->
  <circle cx="60" cy="52" r="28" fill="none" stroke="#111111" stroke-width="3"/>

  <!-- Film reel inner circle -->
  <circle cx="60" cy="52" r="8" fill="#111111"/>

  <!-- Film reel holes - 4 circular holes arranged like reel spokes -->
  <!-- Top hole -->
  <circle cx="60" cy="36" r="5" fill="#F5E9D4" stroke="#111111" stroke-width="2"/>
  <!-- Right hole -->
  <circle cx="76" cy="52" r="5" fill="#F5E9D4" stroke="#111111" stroke-width="2"/>
  <!-- Bottom hole -->
  <circle cx="60" cy="68" r="5" fill="#F5E9D4" stroke="#111111" stroke-width="2"/>
  <!-- Left hole -->
  <circle cx="44" cy="52" r="5" fill="#F5E9D4" stroke="#111111" stroke-width="2"/>

  <!-- Center dot on reel -->
  <circle cx="60" cy="52" r="3" fill="#F5E9D4"/>

  <!-- Decorative sprocket dots on outer area -->
  <circle cx="60" cy="18" r="2" fill="#111111"/>
  <circle cx="60" cy="86" r="2" fill="#111111"/>
  <circle cx="18" cy="60" r="2" fill="#111111"/>
  <circle cx="102" cy="60" r="2" fill="#111111"/>

  <!-- Banner across center -->
  <rect x="12" y="82" width="96" height="20" rx="3" fill="#C0392B" stroke="#111111" stroke-width="3"/>

  <!-- Banner text - Phlix -->
  <text x="60" y="97" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="bold" fill="#F5E9D4" stroke="#111111" stroke-width="0.5">Phlix</text>

  <!-- Small decorative stars -->
  <polygon points="24,24 26,28 30,28 27,31 28,35 24,33 20,35 21,31 18,28 22,28" fill="#D4A017" stroke="#111111" stroke-width="1"/>
  <polygon points="96,24 98,28 102,28 99,31 100,35 96,33 92,35 93,31 90,28 94,28" fill="#D4A017" stroke="#111111" stroke-width="1"/>
</svg>
