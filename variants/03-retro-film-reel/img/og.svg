<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- OG Image - Retro Film Reel Badge Variant -->
  <rect width="1200" height="630" fill="#F5E9D4"/>

  <!-- Halftone texture pattern -->
  <defs>
    <pattern id="dots" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#111111" opacity="0.05"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#dots)"/>

  <!-- Decorative circles -->
  <circle cx="100" cy="100" r="200" fill="#1ABC9C" opacity="0.2"/>
  <circle cx="1100" cy="530" r="250" fill="#C0392B" opacity="0.2"/>

  <!-- Main logo badge -->
  <g transform="translate(450, 180)">
    <!-- Outer badge -->
    <circle cx="150" cy="150" r="140" fill="#F5E9D4" stroke="#111111" stroke-width="8"/>
    <!-- Inner teal ring -->
    <circle cx="150" cy="150" r="120" fill="none" stroke="#1ABC9C" stroke-width="6"/>
    <!-- Film reel -->
    <circle cx="150" cy="140" r="70" fill="none" stroke="#111111" stroke-width="6"/>
    <circle cx="150" cy="140" r="20" fill="#111111"/>
    <!-- Reel holes -->
    <circle cx="150" cy="85" r="14" fill="#F5E9D4" stroke="#111111" stroke-width="4"/>
    <circle cx="200" cy="140" r="14" fill="#F5E9D4" stroke="#111111" stroke-width="4"/>
    <circle cx="150" cy="195" r="14" fill="#F5E9D4" stroke="#111111" stroke-width="4"/>
    <circle cx="100" cy="140" r="14" fill="#F5E9D4" stroke="#111111" stroke-width="4"/>
    <circle cx="150" cy="140" r="8" fill="#F5E9D4"/>
    <!-- Banner -->
    <rect x="20" y="230" width="260" height="50" rx="8" fill="#C0392B" stroke="#111111" stroke-width="6"/>
    <text x="150" y="265" text-anchor="middle" font-family="Georgia, serif" font-size="32" font-weight="bold" fill="#F5E9D4" stroke="#111111" stroke-width="1">Phlix</text>
    <!-- Stars -->
    <polygon points="60,60 65,75 80,75 68,85 72,100 60,90 48,100 52,85 40,75 55,75" fill="#D4A017" stroke="#111111" stroke-width="3"/>
    <polygon points="240,60 245,75 260,75 248,85 252,100 240,90 228,100 232,85 220,75 235,75" fill="#D4A017" stroke="#111111" stroke-width="3"/>
  </g>

  <!-- Tagline -->
  <text x="600" y="480" text-anchor="middle" font-family="Georgia, serif" font-size="48" fill="#111111">Home Theater, Upgraded.</text>

  <!-- Decorative dots -->
  <g fill="#D4A017">
    <circle cx="200" cy="500" r="8"/>
    <circle cx="230" cy="520" r="6"/>
    <circle cx="970" cy="500" r="8"/>
    <circle cx="940" cy="520" r="6"/>
  </g>
</svg>
