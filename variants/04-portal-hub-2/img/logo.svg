<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 40" fill="none">
  <defs>
    <linearGradient id="portal-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D4FF"/>
      <stop offset="100%" stop-color="#00A8CC"/>
    </linearGradient>
    <linearGradient id="glass-fill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(232,244,253,0.15)"/>
      <stop offset="100%" stop-color="rgba(0,212,255,0.05)"/>
    </linearGradient>
  </defs>

  <!-- Portal grid icon with glass effect -->
  <g transform="translate(0, 0)">
    <!-- Outer ring -->
    <circle cx="20" cy="20" r="16" stroke="url(#portal-gradient)" stroke-width="1.5" fill="url(#glass-fill)" opacity="0.8"/>
    <!-- Inner ring -->
    <circle cx="20" cy="20" r="11" stroke="#00D4FF" stroke-width="1" fill="none" opacity="0.5"/>
    <!-- Grid lines -->
    <line x1="20" y1="4" x2="20" y2="8" stroke="#00D4FF" stroke-width="1" opacity="0.6"/>
    <line x1="20" y1="32" x2="20" y2="36" stroke="#00D4FF" stroke-width="1" opacity="0.6"/>
    <line x1="4" y1="20" x2="8" y2="20" stroke="#00D4FF" stroke-width="1" opacity="0.6"/>
    <line x1="32" y1="20" x2="36" y2="20" stroke="#00D4FF" stroke-width="1" opacity="0.6"/>
    <!-- Center dot -->
    <circle cx="20" cy="20" r="4" fill="#00D4FF" opacity="0.9"/>
    <!-- Play triangle -->
    <path d="M18.5 18 L22 20.5 L18.5 23 Z" fill="#0A1628"/>
  </g>

  <!-- Text: PHLIX -->
  <text x="48" y="27" font-family="Space Grotesk, system-ui, sans-serif" font-size="18" font-weight="600" fill="#E8F4FD" letter-spacing="-0.5">
    Phlix
  </text>
</svg>
