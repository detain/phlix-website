<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A1628"/>
      <stop offset="50%" stop-color="#061018"/>
      <stop offset="100%" stop-color="#0A1628"/>
    </linearGradient>
    <linearGradient id="glow-gradient" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#00D4FF" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#00D4FF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="portal-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D4FF"/>
      <stop offset="100%" stop-color="#00A8CC"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg-gradient)"/>

  <!-- Grid pattern -->
  <g opacity="0.1">
    <line x1="0" y1="60" x2="1200" y2="60" stroke="#00D4FF" stroke-width="0.5"/>
    <line x1="0" y1="120" x2="1200" y2="120" stroke="#00D4FF" stroke-width="0.5"/>
    <line x1="0" y1="180" x2="1200" y2="180" stroke="#00D4FF" stroke-width="0.5"/>
    <line x1="0" y1="240" x2="1200" y2="240" stroke="#00D4FF" stroke-width="0.5"/>
    <line x1="0" y1="300" x2="1200" y2="300" stroke="#00D4FF" stroke-width="0.5"/>
    <line x1="0" y1="360" x2="1200" y2="360" stroke="#00D4FF" stroke-width="0.5"/>
    <line x1="0" y1="420" x2="1200" y2="420" stroke="#00D4FF" stroke-width="0.5"/>
    <line x1="0" y1="480" x2="1200" y2="480" stroke="#00D4FF" stroke-width="0.5"/>
    <line x1="0" y1="540" x2="1200" y2="540" stroke="#00D4FF" stroke-width="0.5"/>
    <line x1="0" y1="600" x2="1200" y2="600" stroke="#00D4FF" stroke-width="0.5"/>
    <line x1="100" y1="0" x2="100" y2="630" stroke="#00D4FF" stroke-width="0.5"/>
    <line x1="200" y1="0" x2="200" y2="630" stroke="#00D4FF" stroke-width="0.5"/>
    <line x1="300" y1="0" x2="300" y2="630" stroke="#00D4FF" stroke-width="0.5"/>
    <line x1="400" y1="0" x2="400" y2="630" stroke="#00D4FF" stroke-width="0.5"/>
    <line x1="500" y1="0" x2="500" y2="630" stroke="#00D4FF" stroke-width="0.5"/>
    <line x1="600" y1="0" x2="600" y2="630" stroke="#00D4FF" stroke-width="0.5"/>
    <line x1="700" y1="0" x2="700" y2="630" stroke="#00D4FF" stroke-width="0.5"/>
    <line x1="800" y1="0" x2="800" y2="630" stroke="#00D4FF" stroke-width="0.5"/>
    <line x1="900" y1="0" x2="900" y2="630" stroke="#00D4FF" stroke-width="0.5"/>
    <line x1="1000" y1="0" x2="1000" y2="630" stroke="#00D4FF" stroke-width="0.5"/>
    <line x1="1100" y1="0" x2="1100" y2="630" stroke="#00D4FF" stroke-width="0.5"/>
  </g>

  <!-- Central glow -->
  <ellipse cx="600" cy="315" rx="400" ry="300" fill="url(#glow-gradient)"/>

  <!-- Portal icon (larger) -->
  <g transform="translate(480, 165)">
    <!-- Outer ring -->
    <circle cx="120" cy="120" r="100" stroke="url(#portal-gradient)" stroke-width="3" fill="rgba(0,212,255,0.1)"/>
    <!-- Middle ring -->
    <circle cx="120" cy="120" r="70" stroke="#00D4FF" stroke-width="2" fill="none" opacity="0.5"/>
    <!-- Inner ring -->
    <circle cx="120" cy="120" r="45" stroke="#00D4FF" stroke-width="1.5" fill="none" opacity="0.3"/>
    <!-- Grid lines -->
    <line x1="120" y1="20" x2="120" y2="40" stroke="#00D4FF" stroke-width="2" opacity="0.6"/>
    <line x1="120" y1="200" x2="120" y2="220" stroke="#00D4FF" stroke-width="2" opacity="0.6"/>
    <line x1="20" y1="120" x2="40" y2="120" stroke="#00D4FF" stroke-width="2" opacity="0.6"/>
    <line x1="200" y1="120" x2="220" y2="120" stroke="#00D4FF" stroke-width="2" opacity="0.6"/>
    <!-- Center portal -->
    <circle cx="120" cy="120" r="20" fill="#00D4FF" opacity="0.9"/>
    <!-- Play symbol -->
    <path d="M112 112 L128 120 L112 128 Z" fill="#0A1628"/>
  </g>

  <!-- Text: Phlix -->
  <text x="600" y="460" text-anchor="middle" font-family="Space Grotesk, system-ui, sans-serif" font-size="72" font-weight="700" fill="#E8F4FD" letter-spacing="-2">
    Phlix
  </text>

  <!-- Tagline -->
  <text x="600" y="520" text-anchor="middle" font-family="DM Sans, system-ui, sans-serif" font-size="28" font-weight="400" fill="#00D4FF" opacity="0.9">
    Connect everything. Control everything.
  </text>

  <!-- Subtitle -->
  <text x="600" y="570" text-anchor="middle" font-family="DM Sans, system-ui, sans-serif" font-size="20" font-weight="400" fill="#5B7A99">
    Self-hosted PHP media server
  </text>
</svg>
