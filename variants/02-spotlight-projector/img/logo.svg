<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" fill="none">
  <!-- Phlix Logo — "Ph" as projector beam concept -->
  <!-- Concept 2: The Spotlight Projector -->

  <!-- Projector body (stylized "Ph") -->
  <g id="projector">
    <!-- "P" shape -->
    <path d="M20 10 L20 50" stroke="#F5C542" stroke-width="4" stroke-linecap="round"/>
    <path d="M20 10 L35 10 C45 10 45 25 35 25 L20 25" fill="none" stroke="#F5C542" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- "h" shape -->
    <path d="M40 25 L40 50" stroke="#F5C542" stroke-width="4" stroke-linecap="round"/>
    <path d="M40 35 C40 28 48 28 48 35 L48 50" fill="none" stroke="#F5C542" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Beam of light (triangular spotlight) -->
  <polygon points="55,30 140,5 140,55" fill="url(#beamGradient)" opacity="0.85"/>

  <!-- Gradient definition for beam -->
  <defs>
    <linearGradient id="beamGradient" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#F5C542" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#FFB84D" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#FFB84D" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Remaining letters "lix" illuminated by beam -->
  <text x="145" y="42" font-family="Georgia, serif" font-size="28" font-weight="bold" fill="#FFF7E6">lix</text>
</svg>
