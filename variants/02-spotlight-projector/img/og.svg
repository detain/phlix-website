<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <!-- OG Image for 02-spotlight-projector variant -->

  <!-- Background -->
  <rect width="1200" height="630" fill="#000000"/>

  <!-- Spotlight glow effect -->
  <ellipse cx="600" cy="200" rx="500" ry="300" fill="url(#spotlightGrad)"/>

  <defs>
    <radialGradient id="spotlightGrad" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#F5C542" stop-opacity="0.2"/>
      <stop offset="40%" stop-color="#7A1F1F" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="1"/>
    </radialGradient>
  </defs>

  <!-- Phlix text -->
  <text x="600" y="320" font-family="Georgia, serif" font-size="120" font-weight="bold" fill="#F5C542" text-anchor="middle">Phlix</text>

  <!-- Tagline -->
  <text x="600" y="400" font-family="Arial, sans-serif" font-size="36" fill="#FFF7E6" text-anchor="middle" opacity="0.9">Your Personal Cinema.</text>

  <!-- Decorative beam lines -->
  <line x1="200" y1="500" x2="1000" y2="500" stroke="#F5C542" stroke-width="2" stroke-opacity="0.3"/>
  <line x1="300" y1="520" x2="900" y2="520" stroke="#F5C542" stroke-width="1" stroke-opacity="0.2"/>
</svg>
