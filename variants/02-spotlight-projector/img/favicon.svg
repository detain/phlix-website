<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Favicon for 02-spotlight-projector: Gold projector beam on black -->

  <!-- Background circle -->
  <rect width="32" height="32" rx="6" fill="#000000"/>

  <!-- Simplified "Ph" projector -->
  <g transform="translate(4, 6) scale(0.9)">
    <!-- P shape -->
    <path d="M4 0 L4 14" stroke="#F5C542" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M4 0 L10 0 C14 0 14 8 10 8 L4 8" fill="none" stroke="#F5C542" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- h shape -->
    <path d="M12 6 L12 14" stroke="#F5C542" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M12 10 C12 7 16 7 16 10 L16 14" fill="none" stroke="#F5C542" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Spotlight beam -->
  <polygon points="22,16 30,10 30,22" fill="#FFB84D" opacity="0.9"/>
</svg>
