<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#0D0D0D"/>
  <!-- Background gradient -->
  <defs>
    <radialGradient id="glow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#B87333" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0D0D0D" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <!-- Projector spotlights -->
  <ellipse cx="600" cy="300" rx="400" ry="200" fill="none" stroke="#B87333" stroke-width="1" opacity="0.3"/>
  <ellipse cx="600" cy="300" rx="300" ry="150" fill="none" stroke="#B87333" stroke-width="1" opacity="0.4"/>
  <ellipse cx="600" cy="300" rx="200" ry="100" fill="none" stroke="#B87333" stroke-width="1" opacity="0.5"/>
  <!-- Center icon -->
  <circle cx="600" cy="300" r="60" fill="none" stroke="#B87333" stroke-width="2"/>
  <circle cx="600" cy="300" r="40" fill="none" stroke="#B87333" stroke-width="1.5" opacity="0.8"/>
  <circle cx="600" cy="300" r="20" fill="#B87333" opacity="0.6"/>
  <!-- Title -->
  <text x="600" y="480" font-family="Georgia, serif" font-size="64" font-weight="400" font-style="italic" fill="#F5E6D3" text-anchor="middle">Phlix</text>
  <text x="600" y="530" font-family="Georgia, serif" font-size="24" fill="#8B7355" text-anchor="middle" letter-spacing="0.1em">SELF-HOSTED MEDIA SERVER</text>
  <!-- Tagline -->
  <text x="600" y="580" font-family="Georgia, serif" font-size="18" font-style="italic" fill="#B87333" text-anchor="middle">Your story. Our stage.</text>
</svg>
