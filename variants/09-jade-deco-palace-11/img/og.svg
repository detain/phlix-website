<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <rect width="1200" height="630" fill="#0a1210"/>
  <defs>
    <linearGradient id="jadeGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3dd6a8;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#2a9e7a;stop-opacity:0.1" />
    </linearGradient>
    <radialGradient id="archGlow" cx="70%" cy="30%" r="50%">
      <stop offset="0%" style="stop-color:#c9a84c;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#c9a84c;stop-opacity:0" />
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#jadeGlow)"/>
  <rect width="1200" height="630" fill="url(#archGlow)"/>
  <!-- Art deco geometric arch -->
  <path d="M500 630 L500 350 Q600 200 700 350 L700 630" stroke="#3dd6a8" stroke-width="2" fill="none" opacity="0.3"/>
  <path d="M520 630 L520 370 Q600 230 680 370 L680 630" stroke="#3dd6a8" stroke-width="1.5" fill="none" opacity="0.2"/>
  <!-- Decorative lines -->
  <line x1="100" y1="500" x2="1100" y2="500" stroke="#2a3d36" stroke-width="1"/>
  <line x1="100" y1="130" x2="1100" y2="130" stroke="#2a3d36" stroke-width="1"/>
  <!-- Diamond accents -->
  <polygon points="600,280 620,310 600,340 580,310" fill="#3dd6a8" opacity="0.6"/>
  <polygon points="600,300 615,325 600,350 585,325" fill="#3dd6a8" opacity="0.8"/>
  <!-- Logo triangle -->
  <path d="M565 400 L600 350 L635 400 Z" fill="#3dd6a8"/>
  <!-- Title text -->
  <text x="600" y="480" font-family="Georgia, serif" font-size="72" font-weight="700" letter-spacing="0.15em" fill="#f4efe4" text-anchor="middle">PHLIX</text>
  <text x="600" y="540" font-family="Georgia, serif" font-size="28" letter-spacing="0.3em" fill="#8a918a" text-anchor="middle">OBSIDIAN GALLERY</text>
  <!-- Bottom text -->
  <text x="600" y="590" font-family="Georgia, serif" font-size="18" letter-spacing="0.2em" fill="#3dd6a8" text-anchor="middle">SELFPHP MEDIA SERVER</text>
</svg>
