<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Phlix social image">
  <title>Phlix — Stream what you love. Own what you stream.</title>
  <desc>Open graph social image for Phlix media server</desc>

  <!-- Background -->
  <rect width="1200" height="630" fill="#1A1A2E"/>

  <!-- Decorative film strip elements -->
  <g opacity="0.1">
    <rect x="0" y="100" width="1200" height="8" fill="#F5F5F5"/>
    <rect x="0" y="522" width="1200" height="8" fill="#F5F5F5"/>
  </g>

  <!-- Cinema red accent bar -->
  <rect x="100" y="200" width="8" height="230" fill="#E63946"/>

  <!-- Headline -->
  <text x="140" y="300" font-family="Georgia, serif" font-weight="700" font-size="72" fill="#F5F5F5" letter-spacing="-0.02em">Phlix</text>

  <!-- Tagline -->
  <text x="140" y="370" font-family="Arial, sans-serif" font-size="28" fill="#8D99AE">Stream what you love. Own what you stream.</text>

  <!-- Film frame motif -->
  <g transform="translate(900, 200)">
    <path d="M0 0 L60 0 L120 230 L60 230 Z" fill="#1A1A2E"/>
    <path d="M60 0 L120 0 L60 230 L0 230 Z" fill="#E63946"/>
    <polygon points="40,65 40,165 105,115" fill="#F5F5F5"/>
  </g>
</svg>