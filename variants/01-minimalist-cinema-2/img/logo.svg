<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 40" role="img" aria-label="Phlix logo">
  <title>Phlix</title>
  <desc>A bold editorial logo for Phlix media server. The letter X is stylized as a film-frame with cinema red accent. Deep navy and off-white colors.</desc>

  <!-- Wordmark "Phlix" in Cormorant Garamond style -->
  <text x="48" y="28" font-family="Georgia, serif" font-weight="700" font-size="22" fill="#1A1A2E" letter-spacing="-0.02em">Phlix</text>

  <!-- Stylized X as film frame with cinema red -->
  <g transform="translate(4, 6)">
    <!-- Left diagonal of X (film frame segment) -->
    <path d="M6 0 L14 0 L22 24 L14 24 Z" fill="#1A1A2E"/>

    <!-- Right diagonal of X (film frame segment) -->
    <path d="M14 0 L22 0 L14 24 L6 24 Z" fill="#E63946"/>

    <!-- Frame holes - left diagonal -->
    <rect x="8" y="2" width="3" height="4" fill="#F5F5F5"/>
    <rect x="8" y="10" width="3" height="4" fill="#F5F5F5"/>
    <rect x="8" y="18" width="3" height="4" fill="#F5F5F5"/>

    <!-- Frame holes - right diagonal -->
    <rect x="17" y="2" width="3" height="4" fill="#F5F5F5"/>
    <rect x="17" y="10" width="3" height="4" fill="#F5F5F5"/>
    <rect x="17" y="18" width="3" height="4" fill="#F5F5F5"/>

    <!-- Play button triangle (negative space in center) -->
    <polygon points="10,8 10,16 18,12" fill="#F5F5F5"/>
  </g>
</svg>