<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Phlix favicon">
  <title>Phlix</title>
  <desc>A minimal favicon for Phlix with film-frame X motif</desc>

  <!-- Background -->
  <rect width="32" height="32" fill="#1A1A2E" rx="4"/>

  <!-- Stylized X as film frame with cinema red accent -->
  <g transform="translate(4, 4)">
    <!-- Left diagonal -->
    <path d="M4 0 L10 0 L16 20 L10 20 Z" fill="#1A1A2E"/>
    <!-- Right diagonal with red -->
    <path d="M10 0 L16 0 L10 20 L4 20 Z" fill="#E63946"/>

    <!-- Play button triangle -->
    <polygon points="7,6 7,14 14,10" fill="#F5F5F5"/>
  </g>
</svg>