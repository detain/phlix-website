<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 40" fill="none">
  <!-- Phlix wordmark — thin-line X icon + text -->
  <rect width="40" height="40" rx="6" fill="#2D9CFF"/>
  <!-- Thin X mark -->
  <line x1="12" y1="12" x2="28" y2="28" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="28" y1="12" x2="12" y2="28" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Wordmark text -->
  <text x="50" y="27" font-family="Arial Black, sans-serif" font-weight="900" font-size="22" fill="#1A1A1A">Phlix</text>
</svg>
