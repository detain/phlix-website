<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" fill="none">
  <!-- Phlix Logo — Midnight Gallery aesthetic -->
  <!-- Ultra-dark, museum elegance with restrained antique gold -->

  <!-- Subtle spotlight/gallery frame effect -->
  <rect x="2" y="2" width="196" height="56" rx="2" fill="none" stroke="#C9A84C" stroke-width="0.5" opacity="0.3"/>

  <!-- "Ph" as elegant gallery letters -->
  <g id="letters">
    <!-- "P" shape -->
    <path d="M22 12 L22 48" stroke="#C9A84C" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M22 12 L34 12 C42 12 42 26 34 26 L22 26" fill="none" stroke="#C9A84C" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- "h" shape -->
    <path d="M40 26 L40 48" stroke="#C9A84C" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M40 34 C40 28 47 28 47 34 L47 48" fill="none" stroke="#C9A84C" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Soft ambient gallery spotlight -->
  <ellipse cx="95" cy="30" rx="55" ry="20" fill="url(#ambientGlow)" opacity="0.4"/>

  <!-- Gradient definition for ambient light -->
  <defs>
    <radialGradient id="ambientGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C9A84C" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#C9A84C" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Remaining letters "lix" in museum white -->
  <text x="100" y="38" font-family="Georgia, serif" font-size="24" font-weight="400" fill="#FAF9F6" letter-spacing="1">lix</text>

  <!-- Tagline: Your story. Our stage. -->
  <text x="200" y="56" font-family="Georgia, serif" font-size="8" fill="#6B6B6B" text-anchor="end" font-style="italic" letter-spacing="0.5">Your story. Our stage.</text>
</svg>
