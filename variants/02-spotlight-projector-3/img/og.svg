<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <!-- Phlix OG Image — Midnight Gallery aesthetic -->

  <!-- Deep black background -->
  <rect width="1200" height="630" fill="#0A0A0C"/>

  <!-- Subtle gold border frame -->
  <rect x="20" y="20" width="1160" height="590" rx="4" fill="none" stroke="#C9A84C" stroke-width="1" opacity="0.3"/>

  <!-- Ambient gallery spotlight from above -->
  <ellipse cx="600" cy="200" rx="400" ry="150" fill="url(#spotlight)" opacity="0.5"/>

  <defs>
    <radialGradient id="spotlight" cx="50%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#C9A84C" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#C9A84C" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Phlix wordmark -->
  <text x="600" y="320" font-family="Georgia, serif" font-size="120" font-weight="400" fill="#FAF9F6" text-anchor="middle" letter-spacing="8">Phlix</text>

  <!-- Tagline -->
  <text x="600" y="380" font-family="Georgia, serif" font-size="24" fill="#C9A84C" text-anchor="middle" font-style="italic" letter-spacing="2">Your story. Our stage.</text>

  <!-- Subtitle -->
  <text x="600" y="450" font-family="system-ui, sans-serif" font-size="18" fill="#6B6B6B" text-anchor="middle" letter-spacing="1">Self-hosted media server</text>

  <!-- Feature pills -->
  <g transform="translate(340, 500)">
    <rect x="0" y="0" width="120" height="32" rx="16" fill="rgba(201, 168, 76, 0.1)" stroke="#C9A84C" stroke-width="0.5"/>
    <text x="60" y="21" font-family="system-ui, sans-serif" font-size="12" fill="#FAF9F6" text-anchor="middle">SyncPlay</text>

    <rect x="140" y="0" width="120" height="32" rx="16" fill="rgba(201, 168, 76, 0.1)" stroke="#C9A84C" stroke-width="0.5"/>
    <text x="200" y="21" font-family="system-ui, sans-serif" font-size="12" fill="#FAF9F6" text-anchor="middle">DLNA</text>

    <rect x="280" y="0" width="120" height="32" rx="16" fill="rgba(201, 168, 76, 0.1)" stroke="#C9A84C" stroke-width="0.5"/>
    <text x="340" y="21" font-family="system-ui, sans-serif" font-size="12" fill="#FAF9F6" text-anchor="middle">Live TV</text>

    <rect x="420" y="0" width="120" height="32" rx="16" fill="rgba(201, 168, 76, 0.1)" stroke="#C9A84C" stroke-width="0.5"/>
    <text x="480" y="21" font-family="system-ui, sans-serif" font-size="12" fill="#FAF9F6" text-anchor="middle">Transcoding</text>
  </g>
</svg>
