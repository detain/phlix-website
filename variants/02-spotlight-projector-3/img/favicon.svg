<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Phlix Favicon — Midnight Gallery -->
  <rect width="32" height="32" rx="4" fill="#0A0A0C"/>
  <rect x="2" y="2" width="28" height="28" rx="3" fill="none" stroke="#C9A84C" stroke-width="0.5" opacity="0.5"/>

  <!-- "Ph" mini monogram -->
  <g transform="translate(6, 8)">
    <path d="M2 0 L2 12" stroke="#C9A84C" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M2 0 L8 0 C11 0 11 6 8 6 L2 6" fill="none" stroke="#C9A84C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M10 6 L10 12" stroke="#C9A84C" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M10 8 C10 5 14 5 14 8 L14 12" fill="none" stroke="#C9A84C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Soft ambient glow -->
  <circle cx="16" cy="16" r="8" fill="url(#faviconGlow)" opacity="0.3"/>

  <defs>
    <radialGradient id="faviconGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C9A84C" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#C9A84C" stop-opacity="0"/>
    </radialGradient>
  </defs>
</svg>
