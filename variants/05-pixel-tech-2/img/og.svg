<!-- ============================================================
     variants/05-pixel-tech-2/img/og.svg
     Social share image - Arcade Cabinet style
     ============================================================ -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <pattern id="og-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="#0D0D0D"/>
      <rect width="10" height="10" fill="#0D0D0D" opacity="0.5"/>
      <rect width="2" height="2" fill="#00FF41" opacity="0.15"/>
    </pattern>

    <filter id="og-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00FF41;stop-opacity:0.3"/>
      <stop offset="50%" style="stop-color:#9B30FF;stop-opacity:0.2"/>
      <stop offset="100%" style="stop-color:#00FF41;stop-opacity:0.3"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#0D0D0D"/>
  <rect width="1200" height="630" fill="url(#og-grid)"/>

  <!-- Glow overlay -->
  <ellipse cx="600" cy="315" rx="500" ry="250" fill="url(#grad)" opacity="0.5"/>

  <!-- Top border - arcade trim -->
  <rect x="0" y="0" width="1200" height="4" fill="#00FF41"/>
  <rect x="0" y="0" width="300" height="4" fill="#9B30FF"/>
  <rect x="600" y="0" width="300" height="4" fill="#9B30FF"/>
  <rect x="900" y="0" width="300" height="4" fill="#00FF41"/>

  <!-- Bottom border - arcade trim -->
  <rect x="0" y="626" width="1200" height="4" fill="#00FF41"/>
  <rect x="0" y="626" width="200" height="4" fill="#9B30FF"/>
  <rect x="400" y="626" width="200" height="4" fill="#9B30FF"/>
  <rect x="800" y="626" width="200" height="4" fill="#9B30FF"/>

  <!-- Side accents -->
  <rect x="0" y="0" width="4" height="630" fill="#00FF41"/>
  <rect x="1196" y="0" width="4" height="630" fill="#00FF41"/>

  <!-- Logo area -->
  <g transform="translate(100, 180)" filter="url(#og-glow)">
    <!-- P -->
    <rect x="0" y="0" width="24" height="12" fill="#00FF41"/>
    <rect x="24" y="0" width="12" height="12" fill="#00FF41"/>
    <rect x="36" y="0" width="12" height="12" fill="#00FF41"/>
    <rect x="48" y="12" width="12" height="12" fill="#00FF41"/>
    <rect x="36" y="24" width="12" height="12" fill="#00FF41"/>
    <rect x="24" y="24" width="12" height="12" fill="#00FF41"/>
    <rect x="0" y="24" width="24" height="12" fill="#00FF41"/>
    <rect x="0" y="36" width="24" height="12" fill="#00FF41"/>
    <rect x="0" y="48" width="24" height="12" fill="#00FF41"/>
    <rect x="0" y="60" width="24" height="12" fill="#00FF41"/>
    <rect x="0" y="72" width="24" height="12" fill="#00FF41"/>
    <rect x="0" y="84" width="24" height="12" fill="#00FF41"/>

    <!-- h -->
    <rect x="60" y="72" width="24" height="12" fill="#00FF41"/>
    <rect x="60" y="84" width="24" height="12" fill="#00FF41"/>
    <rect x="60" y="96" width="24" height="12" fill="#00FF41"/>
    <rect x="60" y="108" width="24" height="12" fill="#00FF41"/>
    <rect x="72" y="60" width="12" height="12" fill="#00FF41"/>
    <rect x="84" y="48" width="12" height="12" fill="#00FF41"/>
    <rect x="84" y="60" width="12" height="12" fill="#00FF41"/>
    <rect x="84" y="72" width="12" height="12" fill="#00FF41"/>
    <rect x="84" y="84" width="12" height="12" fill="#00FF41"/>
    <rect x="84" y="96" width="12" height="12" fill="#00FF41"/>
    <rect x="84" y="108" width="12" height="12" fill="#00FF41"/>

    <!-- transition -->
    <rect x="108" y="72" width="12" height="6" fill="#9B30FF" opacity="0.7"/>
    <rect x="120" y="66" width="12" height="6" fill="#9B30FF" opacity="0.5"/>
    <rect x="132" y="60" width="12" height="6" fill="#9B30FF" opacity="0.3"/>
  </g>

  <!-- Text area -->
  <text x="320" y="270" font-family="'Share Tech Mono', monospace" font-size="72" fill="#00FF41" filter="url(#og-glow)">Phlix</text>

  <!-- Tagline -->
  <text x="320" y="340" font-family="'Fira Sans', sans-serif" font-size="28" fill="#E8E8E8">Open source. Zero compromise.</text>

  <!-- Bullet points -->
  <g font-family="'Roboto Mono', monospace" font-size="20" fill="#00FF41">
    <text x="320" y="420">▸ Self-hosted media server</text>
    <text x="320" y="460">▸ SyncPlay, Live TV, Transcoding</text>
    <text x="320" y="500">▸ Roku, Samsung, Windows, Mobile</text>
  </g>

  <!-- Decorative corner elements -->
  <rect x="50" y="50" width="60" height="4" fill="#00FF41"/>
  <rect x="50" y="50" width="4" height="40" fill="#00FF41"/>

  <rect x="1090" y="50" width="60" height="4" fill="#00FF41"/>
  <rect x="1146" y="50" width="4" height="40" fill="#00FF41"/>

  <rect x="50" y="576" width="60" height="4" fill="#00FF41"/>
  <rect x="50" y="540" width="4" height="40" fill="#00FF41"/>

  <rect x="1090" y="576" width="60" height="4" fill="#00FF41"/>
  <rect x="1146" y="540" width="4" height="40" fill="#00FF41"/>
</svg>
