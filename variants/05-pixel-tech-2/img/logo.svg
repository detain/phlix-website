<!-- ============================================================
     variants/05-pixel-tech-2/img/logo.svg
     Arcade Cabinet style logo with pixelated "Ph" transitioning
     to smooth "lix", high score display aesthetic
     ============================================================ -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" width="200" height="60">
  <defs>
    <!-- Pixel grid pattern -->
    <pattern id="pixel-grid" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="4" fill="#0D0D0D"/>
      <rect width="2" height="2" fill="#00FF41" opacity="0.7"/>
      <rect width="1" height="1" fill="#00FF41" opacity="0.4"/>
    </pattern>

    <!-- Arcade screen glow filter -->
    <filter id="arcade-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Screen curvature hint -->
    <filter id="screen-curve" x="-10%" y="-10%" width="120%" height="120%">
      <feCurveX in="SourceGraphic" type="curve" tableValues="0 0.05 0.95 1"/>
      <feCurveY in="SourceGraphic" type="curve" tableValues="0 0.02 0.98 1"/>
    </filter>
  </defs>

  <!-- Background with subtle gradient -->
  <rect width="200" height="60" fill="url(#pixel-grid)"/>
  <rect x="0" y="0" width="200" height="60" fill="rgba(13, 13, 13, 0.85)"/>

  <!-- Pixelated "Ph" - arcade style -->
  <g filter="url(#arcade-glow)">
    <!-- P - pixel block formation with arcade styling -->
    <rect x="10" y="10" width="8" height="4" fill="#00FF41"/>
    <rect x="14" y="6" width="4" height="4" fill="#00FF41"/>
    <rect x="18" y="6" width="4" height="4" fill="#00FF41"/>
    <rect x="22" y="10" width="4" height="4" fill="#00FF41"/>
    <rect x="18" y="14" width="4" height="4" fill="#00FF41"/>
    <rect x="14" y="14" width="4" height="4" fill="#00FF41"/>
    <rect x="10" y="14" width="4" height="4" fill="#00FF41"/>
    <rect x="10" y="18" width="8" height="4" fill="#00FF41"/>
    <rect x="10" y="22" width="8" height="4" fill="#00FF41"/>
    <rect x="10" y="26" width="8" height="4" fill="#00FF41"/>
    <rect x="10" y="30" width="8" height="4" fill="#00FF41"/>
    <rect x="10" y="34" width="8" height="4" fill="#00FF41"/>
    <rect x="10" y="38" width="8" height="4" fill="#00FF41"/>

    <!-- h - pixel block continuation -->
    <rect x="26" y="26" width="8" height="4" fill="#00FF41"/>
    <rect x="26" y="30" width="8" height="4" fill="#00FF41"/>
    <rect x="26" y="34" width="8" height="4" fill="#00FF41"/>
    <rect x="26" y="38" width="8" height="4" fill="#00FF41"/>
    <rect x="30" y="22" width="4" height="4" fill="#00FF41"/>
    <rect x="34" y="18" width="4" height="4" fill="#00FF41"/>
    <rect x="34" y="22" width="4" height="4" fill="#00FF41"/>
    <rect x="34" y="26" width="4" height="4" fill="#00FF41"/>
    <rect x="34" y="30" width="4" height="4" fill="#00FF41"/>
    <rect x="34" y="34" width="4" height="4" fill="#00FF41"/>
    <rect x="34" y="38" width="4" height="4" fill="#00FF41"/>

    <!-- Transition pixels (arcade sparkle) -->
    <rect x="42" y="26" width="4" height="2" fill="#9B30FF" opacity="0.8"/>
    <rect x="46" y="24" width="4" height="2" fill="#9B30FF" opacity="0.6"/>
    <rect x="50" y="22" width="4" height="2" fill="#9B30FF" opacity="0.4"/>
  </g>

  <!-- Smooth "lix" - arcade cabinet display area -->
  <g filter="url(#arcade-glow)">
    <!-- l - smooth but with pixel hints -->
    <rect x="58" y="10" width="6" height="32" fill="#E8E8E8"/>
    <rect x="58" y="6" width="6" height="4" fill="#E8E8E8"/>

    <!-- i - smooth -->
    <rect x="70" y="10" width="4" height="4" fill="#E8E8E8"/>
    <rect x="70" y="18" width="4" height="28" fill="#E8E8E8"/>

    <!-- x - smooth with arcade styling -->
    <rect x="78" y="10" width="4" height="4" fill="#E8E8E8"/>
    <rect x="82" y="10" width="4" height="4" fill="#E8E8E8"/>
    <rect x="80" y="14" width="4" height="4" fill="#E8E8E8"/>
    <rect x="86" y="14" width="4" height="4" fill="#E8E8E8"/>
    <rect x="78" y="18" width="4" height="4" fill="#E8E8E8"/>
    <rect x="82" y="18" width="4" height="4" fill="#E8E8E8"/>
    <rect x="86" y="22" width="4" height="4" fill="#E8E8E8"/>
    <rect x="78" y="22" width="4" height="4" fill="#E8E8E8"/>
    <rect x="82" y="22" width="4" height="4" fill="#E8E8E8"/>
    <rect x="86" y="26" width="4" height="4" fill="#E8E8E8"/>
    <rect x="78" y="26" width="4" height="4" fill="#E8E8E8"/>
    <rect x="82" y="26" width="4" height="4" fill="#E8E8E8"/>
    <rect x="86" y="30" width="4" height="4" fill="#E8E8E8"/>
    <rect x="78" y="34" width="4" height="4" fill="#E8E8E8"/>
    <rect x="82" y="34" width="4" height="4" fill="#E8E8E8"/>
  </g>

  <!-- Bottom trim with arcade cabinet styling -->
  <line x1="10" y1="52" x2="190" y2="52" stroke="#1A1A1A" stroke-width="1"/>
  <line x1="10" y1="52" x2="50" y2="52" stroke="#00FF41" stroke-width="2"/>
  <rect x="55" y="50" width="8" height="4" fill="#9B30FF" opacity="0.8"/>
  <rect x="68" y="50" width="8" height="4" fill="#1A1A1A"/>
  <rect x="81" y="50" width="8" height="4" fill="#9B30FF" opacity="0.6"/>
  <rect x="94" y="50" width="8" height="4" fill="#1A1A1A"/>
  <rect x="107" y="50" width="8" height="4" fill="#00FF41" opacity="0.4"/>
</svg>
